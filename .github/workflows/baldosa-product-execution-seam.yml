name: Baldosa Modern native execution seam

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/product/baldosa_execution_backend.hpp"
      - "native/product/modern_host_input_release_latch.hpp"
      - "tools/baldosa_native_product_execution.cpp"
      - "tools/baldosa_product_execution_spike.py"
      - "tools/baldosa_product_pause_spike.py"
      - "tools/baldosa_native_pause_lifecycle.cpp"
      - "tools/baldosa_native_product_pause_authority.cpp"
      - "tests/unit/test_baldosa_product_pause_spike.py"
      - "tests/native/baldosa_product_pause_bridge_test.cpp"
      - "tests/native/baldosa_execution_backend_test.cpp"
      - "tests/unit/test_baldosa_product_execution_spike.py"
      - ".github/workflows/baldosa-product-execution-seam.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baldosa-product-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-and-staging:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Native product lifecycle and P1/P2 held release
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -I native/product \
            tests/native/baldosa_execution_backend_test.cpp \
            -o "$RUNNER_TEMP/baldosa-execution-backend-test"
          "$RUNNER_TEMP/baldosa-execution-backend-test"
          echo "PASS: C++ lifecycle rejection/acknowledgement and two-seat release" >> "$GITHUB_STEP_SUMMARY"
      - name: Pinned native host guarded injection
        run: |
          set -euo pipefail
          python3 tests/unit/test_baldosa_product_execution_spike.py
          python3 tests/unit/test_baldosa_product_pause_spike.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -I native/product \
            -c tools/baldosa_native_product_execution.cpp \
            -o "$RUNNER_TEMP/baldosa_native_product_execution.o"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -I native/product \
            tests/native/baldosa_product_pause_bridge_test.cpp \
            tools/baldosa_native_product_execution.cpp \
            tools/baldosa_native_product_pause_authority.cpp \
            -o "$RUNNER_TEMP/baldosa-product-pause-bridge-test"
          "$RUNNER_TEMP/baldosa-product-pause-bridge-test"
          echo "PASS: injected C ABI handles rejected and acknowledged pause without P1/P2 held Start leakage" >> "$GITHUB_STEP_SUMMARY"

  # This is a targeted, one-route AOT integration gate, not a second
  # complete-event or HD presentation campaign. Only run native when the
  # draft graduates; the cheap unit gate runs on every relevant candidate.
  pinned-human-input-route:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SNESRECOMP_ROM: ${{ github.workspace }}/reference/roms/retail/Uniracers_USA.sfc
      SDL_AUDIODRIVER: dummy
      PIXELS: "0"
      KEEP_WRAM: "0"
      TMO: "45"
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned ROM and third-party sources
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478" "$SNESRECOMP_ROM" | sha256sum -c -
          python3 tools/verify_rom.py "$SNESRECOMP_ROM"
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Verify unchanged input baseline
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          git -C baldosa submodule status --recursive
      - name: Install pinned host SDL2/X11 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ninja-build pkg-config libsdl2-dev libgl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgles-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev xvfb x11-utils
      - name: Baseline pinned executable with two-player route
        shell: bash
        run: |
          set -euo pipefail
          cmake -S baldosa -B baldosa/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SDL3_FETCH=OFF \
            -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          test -x baldosa/build/UniracersSNESRecomp
          printf '%s\n' '[Sound]' 'EnableAudio = 0' > baldosa/build/config.ini
          Xvfb :99 -screen 0 1280x720x24 -ac > "$RUNNER_TEMP/baldosa-xvfb.log" 2>&1 &
          export DISPLAY=:99
          for i in 1 2 3 4 5; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null
          cat > "$RUNNER_TEMP/ur-baldosa-x11" <<'SH'
          #!/usr/bin/env sh
          export SDL_VIDEODRIVER=x11
          exec "$BALDOSA_REAL_BIN" "$@"
          SH
          chmod +x "$RUNNER_TEMP/ur-baldosa-x11"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export BIN="$RUNNER_TEMP/ur-baldosa-x11"
          mkdir -p "$RUNNER_TEMP/ur-baldosa-input"
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/ur-baldosa-input/original"
          test -s "$RUNNER_TEMP/ur-baldosa-input/original/fd/crc.txt"
      - name: Compile and exercise live human-only input bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          # Idempotence: staging twice changes no source after first attempt.
          python3 tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          cmake -S baldosa -B baldosa/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SDL3_FETCH=OFF \
            -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          export DISPLAY=:99
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export BIN="$RUNNER_TEMP/ur-baldosa-x11"
          export UR_BALDOSA_PRODUCT_INPUT_DIAGNOSTICS=1
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/ur-baldosa-input/modern_seam"
          # Exercise callback repeatedly without tying the invariant to an
          # absolute scripted frame number. Scripts/debug remain independent.
          input_log="$RUNNER_TEMP/ur-baldosa-input/modern_seam/log.txt"
          test "$(grep -c 'UR_BALDOSA_PRODUCT_INPUT frame=' "$input_log")" -ge 3
          grep -q 'UR_BALDOSA_PRODUCT_INPUT .* incoming=.* guest=.* host_owns=0' "$input_log"
          cmp "$RUNNER_TEMP/ur-baldosa-input/original/fd/crc.txt" \
            "$RUNNER_TEMP/ur-baldosa-input/modern_seam/fd/crc.txt"
          echo "PASS: actual 2P native Baldosa execution with mapped human callback; CRC identical to pinned unchanged guest" >> "$GITHUB_STEP_SUMMARY"
          tail -n 12 "$RUNNER_TEMP/ur-baldosa-input/modern_seam/log.txt"
      - name: Exercise real native host pause and resume with unchanged 2P guest frames
        shell: bash
        run: |
          set -euo pipefail
          # This is the same already-built pinned AOT game. Inject only one
          # additive SDL pump / pause authority; no second native graph.
          python3 tools/baldosa_product_pause_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_product_pause_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          # Existing Modern package root, not an alternate save backend.
          # Stage only in the disposable pinned Baldosa native checkout.
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          cmake -S baldosa -B baldosa/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SDL3_FETCH=OFF \
            -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          export DISPLAY=:99
          export BIN="$RUNNER_TEMP/ur-baldosa-x11"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          # Compare APPEND-ONLY host-frame WRAM before/after Restart. The
          # existing guest-indexed framedumps can overwrite earlier identical
          # frames following a true snes_frame_counter rollback.
          export UR_BALDOSA_RESTART_FRAME_TRACE=1
          export UR_BALDOSA_PAUSE_SMOKE=0
          export UR_BALDOSA_MODERN_INPUT=0
          export UR_BALDOSA_PHYSICAL_PAUSE_SMOKE=0
          export UR_BALDOSA_RESTART_SAME_FRAME_SMOKE=0
          # The packaged launcher exports this same variable. Test with a
          # real 2P guest, --config absolute and a path containing spaces.
          mkdir -p "$RUNNER_TEMP/UR Baldosa Native Modern Data Root"
          SNESRECOMP_USER_DATA_DIR="$RUNNER_TEMP/UR Baldosa Native Modern Data Root" \
            bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
              "$RUNNER_TEMP/ur-baldosa-input/native_host_baseline"
          test -s "$RUNNER_TEMP/UR Baldosa Native Modern Data Root/keybinds.ini"
          test -s "$RUNNER_TEMP/UR Baldosa Native Modern Data Root/saves/save.srm"
          test -z "$(find "$RUNNER_TEMP/ur-baldosa-input/native_host_baseline/saves" -type f -print -quit)"
          cmp "$RUNNER_TEMP/ur-baldosa-input/original/fd/crc.txt" \
              "$RUNNER_TEMP/ur-baldosa-input/native_host_baseline/fd/crc.txt"
          export UR_BALDOSA_PAUSE_SMOKE=1
          export UR_BALDOSA_MODERN_INPUT=1
          export UR_BALDOSA_PHYSICAL_PAUSE_SMOKE=1
          export UR_BALDOSA_RESTART_SAME_FRAME_SMOKE=1
          export UR_BALDOSA_PAUSE_SMOKE_AT_FRAME=1952
          export UR_BALDOSA_PAUSE_REQUIRE_RACE=1
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/ur-baldosa-input/paused_resume"
          log="$RUNNER_TEMP/ur-baldosa-input/paused_resume/log.txt"
          grep -q 'UR_BALDOSA_NATIVE_PAUSE ARMED guest=.* live_race=1 modern_session=1 physical_sdl=1' "$log"
          grep -q 'UR_BALDOSA_NATIVE_PAUSE RELEASED .* physical_sdl=1' "$log"
          grep -Eq 'UR_BALDOSA_NATIVE_RESTART SAME_FRAME guest=[0-9]+ sram_equal=1 wram_equal=1' "$log"
          grep -q 'UR_BALDOSA_NATIVE_PAUSE RELEASED guest=.* frozen_pumps=24' "$log"
          grep -q 'UR_BALDOSA_NATIVE_PAUSE RESUMED .* frozen_pumps=24' "$log"
          if grep -q 'UR_BALDOSA_NATIVE_PAUSE FAIL=' "$log"; then
            echo "::error::Baldosa native pause violated its guest hold invariant"
            exit 1
          fi
          cmp "$RUNNER_TEMP/ur-baldosa-input/original/fd/crc.txt" \
              "$RUNNER_TEMP/ur-baldosa-input/paused_resume/fd/crc.txt"
          echo "PASS: real Baldosa guest same-boundary rollback via unchanged Modern Restart anchor with byte-identical SRAM/WRAM, 24 native SDL pause polls and exact original 2P frame CRCs; synthetic SDL input, not hardware or multi-frame Retry acceptance" >> "$GITHUB_STEP_SUMMARY"
          grep 'UR_BALDOSA_NATIVE_PAUSE ' "$log"
          # Delayed RESTART: real SDL 'R' while Modern owns an active pause.
          # Unlike the same-frame no-op, this intentionally rewinds actual
          # progressed guest WRAM, so CRCs MUST diverge only after resume.
          export UR_BALDOSA_DELAYED_RESTART_SMOKE=1
          export UR_BALDOSA_RESTART_SAME_FRAME_SMOKE=0
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/ur-baldosa-input/delayed_restart"
          delayed_log="$RUNNER_TEMP/ur-baldosa-input/delayed_restart/log.txt"
          grep -Eq 'UR_BALDOSA_NATIVE_RESTART DELAYED anchor_guest=[0-9]+ request_guest=1952 paused=1 sram_equal=1 wram_rewound=1' "$delayed_log"
          grep -q 'UR_BALDOSA_NATIVE_PAUSE RESUMED previous_guest=1952 new_guest=1953 frozen_pumps=24' "$delayed_log"
          if grep -q 'UR_BALDOSA_NATIVE_PAUSE FAIL=' "$delayed_log"; then
            echo "::error::Delayed native Restart rejected guest/host state"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          from tools.baldosa_windows_native_pause_route import (
              check_delayed_restart_host_trace,
          )
          root = Path(os.environ["RUNNER_TEMP"]) / "ur-baldosa-input"
          # Guest-indexed filenames are NOT monotonic through a rollback.
          # Retain guest CRC counts, but judge the rewind on full WRAM sampled
          # against the *host* clock, which rollback does not rewind.
          original = (root / "original/fd/crc.txt").read_text().splitlines()
          delayed = (root / "delayed_restart/fd/crc.txt").read_text().splitlines()
          assert len(original) == len(delayed) == 2473, (
              "Unexpected guest frame count after delayed Restart",
              len(original), len(delayed))
          baseline_log = (root / "native_host_baseline/log.txt").read_text()
          delayed_log = (root / "delayed_restart/log.txt").read_text()
          proof = check_delayed_restart_host_trace(baseline_log, delayed_log)
          print("UR_BALDOSA_NATIVE_RESTART HOST_TRACE "
                f"first_divergent_host={proof['first_divergent_host_frame']} "
                f"original_guest={proof['original_guest_counter_after_resume']} "
                f"rewound_guest={proof['restarted_guest_counter_after_resume']} "
                f"host_samples={proof['host_sample_count']}")
          PY
          echo "PASS: pinned Baldosa AOT accepts SDL R from native Modern pause after 12+ guest frames, rewinds WRAM to genuine race anchor with SRAM preserved and host owned; append-only host-timeline WRAM proves post-resume divergence independent of rewindable guest dump filenames; no event completion credit" >> "$GITHUB_STEP_SUMMARY"
          grep 'UR_BALDOSA_NATIVE_RESTART ' "$delayed_log"

name: One-shot APU upload-path trace

on:
  push:
    branches:
      - chatgpt/audio-upload-path-2026-09-29
    paths:
      - .github/workflows/audio-upload-path.yml
      - tools/find_mmio_access_sites.py
      - tools/trace_apu_ports.py
      - tests/input/reach-first-race.script

permissions:
  contents: read

jobs:
  trace-apu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Scan encoded APU MMIO access candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apu-evidence"
          python3 tools/find_mmio_access_sites.py \
            reference/roms/retail/Uniracers_USA.sfc \
            0x2140 0x2141 0x2142 0x2143 \
            --json-out "$RUNNER_TEMP/apu-evidence/apu-mmio-static-candidates.json"

      - name: Generate project and build trace target
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/trace-project"
          mkdir -p "$ROOT"
          sh snesrecomp/tools/new_project/setup_project.sh \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --generate \
            --snesrecomp-ref cd5875cbdaf19f5e324272b1f8051d671fce9215

          PROJECT="$ROOT/UniracersSNESRecomp"

          python3 - "$PROJECT/src/host_contract.c" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "#include <stdint.h>\n"
          if marker not in s:
              raise SystemExit("host_contract.c include marker not found")
          s = s.replace(
              marker,
              marker + "\n#if !defined(SNESRECOMP_TRACE) || !SNESRECOMP_TRACE\n",
              1,
          )
          s += "\n#endif /* production debug-hook stubs */\n"
          p.write_text(s)
          PY

          cmake -S "$PROJECT" -B "$PROJECT/build-trace" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ENABLE_TRACE=ON
          cmake --build "$PROJECT/build-trace" -j2
          test -x "$PROJECT/build-trace/UniracersSNESRecomp"

      - name: Trace APU port writes to first race
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/trace-project/UniracersSNESRecomp"
          EXE="$PROJECT/build-trace/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script"
          LOG="$RUNNER_TEMP/apu-evidence/native-apu-trace-host.log"
          OUT="$RUNNER_TEMP/apu-evidence/apu-port-runtime-trace.json"

          SNESRECOMP_DEBUG_PORT=4377 SDL_AUDIODRIVER=dummy \
            timeout 240s xvfb-run -a "$EXE" "$ROM" --paused --script "$SCRIPT" \
            >"$LOG" 2>&1 &
          HOST_PID=$!
          trap 'kill "$HOST_PID" 2>/dev/null || true' EXIT

          set +e
          python3 tools/trace_apu_ports.py \
            --port 4377 \
            --command-timeout 45 \
            --coarse-until 900 \
            --coarse-step 25 \
            --max-frames 1800 \
            --json-out "$OUT"
          TRACE_STATUS=$?
          set -e

          kill "$HOST_PID" 2>/dev/null || true
          wait "$HOST_PID" 2>/dev/null || true
          trap - EXIT

          echo "== host log tail =="
          tail -n 120 "$LOG"
          if [ "$TRACE_STATUS" -ne 0 ]; then
            exit "$TRACE_STATUS"
          fi
          test -s "$OUT"

      - name: Compose compact evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "apu-evidence"
          static = json.loads((root / "apu-mmio-static-candidates.json").read_text())
          runtime = json.loads((root / "apu-port-runtime-trace.json").read_text())

          report = {
              "schema_version": 1,
              "canonical_rom_sha256": "859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478",
              "runtime": {
                  "race_active_frame": runtime["race_active_frame"],
                  "stepped_frames": runtime["stepped_frames"],
                  "event_count": runtime["event_count"],
                  "frames_with_writes": runtime["frames_with_writes"],
                  "first_frame": runtime["first_frame"],
                  "last_frame": runtime["last_frame"],
                  "ports": runtime["ports"],
                  "bursts": [
                      {
                          "index": row["index"],
                          "start_frame": row["start_frame"],
                          "end_frame": row["end_frame"],
                          "event_count": row["event_count"],
                          "per_port_counts": row["per_port_counts"],
                          "events": row["events"][:64],
                          "events_truncated": len(row["events"]) > 64,
                      }
                      for row in runtime["bursts_max_frame_gap_1"]
                  ],
              },
              "static_candidates": {
                  target: [
                      {
                          "rom_offset_hex": row["rom_offset_hex"],
                          "cpu_lorom": row["cpu_lorom"],
                          "mnemonic": row["mnemonic"],
                          "mode": row["mode"],
                          "access": row["access"],
                          "operand": row["operand"],
                          "db_sensitive": row["db_sensitive"],
                          "explicit_bank": row["explicit_bank"],
                          "context_hex": row["context_hex"],
                      }
                      for row in rows
                  ]
                  for target, rows in static["targets"].items()
              },
          }
          (root / "apu-upload-path-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "runtime_events": runtime["event_count"],
              "runtime_frames_with_writes": runtime["frames_with_writes"],
              "runtime_bursts": len(runtime["bursts_max_frame_gap_1"]),
              "race_active_frame": runtime["race_active_frame"],
              "static_counts": {
                  target: len(rows) for target, rows in static["targets"].items()
              },
          }, indent=2, sort_keys=True))
          PY

      - name: Upload APU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-apu-upload-path
          path: |
            ${{ runner.temp }}/apu-evidence/native-apu-trace-host.log
            ${{ runner.temp }}/apu-evidence/apu-mmio-static-candidates.json
            ${{ runner.temp }}/apu-evidence/apu-port-runtime-trace.json
            ${{ runner.temp }}/apu-evidence/apu-upload-path-summary.json
          if-no-files-found: warn
          retention-days: 2

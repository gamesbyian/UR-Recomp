name: Read-only account Actions artifact storage census
on:
  # Manual-first; only changes to this small reporting utility qualify for
  # the automatic self-test. Normal product PRs never dispatch the census.
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/actions-artifact-census.yml'
      - 'tools/actions_storage_inventory.py'
      - 'tests/unit/test_actions_storage_inventory.py'

concurrency:
  group: artifact-census-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    # Do not run PR source with a credential for a fork.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline inventory contract tests
        run: python3 -m unittest discover -s tests/unit -p test_actions_storage_inventory.py -v
      - name: Collect a complete artifact inventory for five active repositories
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/actions_storage_inventory.py \
            --repo gamesbyian/Chunks \
            --repo gamesbyian/Glimpse \
            --repo gamesbyian/AYA \
            --repo gamesbyian/wallgen \
            --repo gamesbyian/Expository \
            --json-out "$RUNNER_TEMP/actions-storage-inventory.json" \
            | tee "$RUNNER_TEMP/actions-storage-inventory.md"
          cat "$RUNNER_TEMP/actions-storage-inventory.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded read-only census for exact-source audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: actions-public-repositories-storage-census
          path: |
            ${{ runner.temp }}/actions-storage-inventory.json
            ${{ runner.temp }}/actions-storage-inventory.md
          retention-days: 2
          if-no-files-found: error

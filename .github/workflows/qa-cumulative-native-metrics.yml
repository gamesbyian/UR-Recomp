name: Cumulative native graphics and process endurance

# Two *different* scientific questions over one exact canonical native candidate:
# graphics = exact frame / guest-WRAM replay for varied real 2P input streams;
# performance = uninterrupted single-process long-frame horizon plus Linux RSS/fds.
# Neither is original/native parity, hardware 4K or shipped Windows certification.
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: graphics
        options: [graphics, performance]
      wall_minutes_per_shard:
        required: true
        type: choice
        default: "15"
        options: ["15", "60", "120"]
      base_seed:
        required: true
        default: "20261011"
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      wall_minutes_per_shard:
        required: true
        type: string
      base_seed:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cumulative-native-metrics-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/modern-shared-native-acceptance.yml
    with:
      canonical_candidate: false
      # Research needs only the binary; product acceptance belongs to its
      # owners' gates and previously cost ~14 runner-minutes per research run.
      candidate_only: true

  research:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Headless display and source-qualified native metrics contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb
          python3 -m unittest discover -s tests/unit -p test_qa_cumulative_native_metrics.py
      - uses: actions/download-artifact@v4
        with:
          name: shared-modern-native-candidate
          path: ${{ runner.temp }}/candidate-artifact
      - name: Restore exact source-built native candidate and verify ABI
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/candidate-artifact/shared-modern-native.tar.gz" -C "$RUNNER_TEMP"
          EXE="$RUNNER_TEMP/shared-modern-native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          test -x "$EXE"
          ldd "$EXE" 2>&1 | tee "$RUNNER_TEMP/native-metrics-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/native-metrics-ldd.txt"; then
            echo "::error::Native candidate has an unresolved shared library" >&2
            exit 1
          else
            grep_rc=$?
            if [ "$grep_rc" -ne 1 ]; then
              echo "::error::Could not inspect native dependency report (grep=$grep_rc)" >&2
              exit 1
            fi
          fi
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
      - name: Exercise varied native P1/P2 frame consistency or single-PID resource endurance
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          MINUTES: ${{ inputs.wall_minutes_per_shard }}
          SEED: ${{ inputs.base_seed }}
        run: |
          set -euo pipefail
          case "$MODE" in graphics|performance) ;; *) echo "unsupported mode"; exit 2 ;; esac
          [[ "$SEED" =~ ^[0-9]{1,8}$ ]] || { echo "invalid 8-digit seed"; exit 2; }
          python3 tools/qa_cumulative_native_metrics.py \
            --exe "$RUNNER_TEMP/shared-modern-native/UniracersSNESRecomp/build/UniracersSNESRecomp" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --source-sha "$GITHUB_SHA" --mode "$MODE" \
            --minutes "$MINUTES" --seed "$SEED" \
            --work "$RUNNER_TEMP/native-metrics-private" \
            --out "$RUNNER_TEMP/native-metrics-result/result.json"
          python3 - "$RUNNER_TEMP/native-metrics-result/result.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          with open(sys.argv[2],"a") as f:
              f.write("## Native "+v["mode"]+" research\n\n")
              f.write("Disposition: "+v["disposition"]+"\n\n")
              f.write(str(v["completed_processes"])+" real native processes; ")
              f.write(str(v["unique_seeded_frame_sweeps"])+" unique visual inputs; ")
              f.write(str(v["measured_frame_checks"])+" bit-identity-checked frames. ")
              f.write(str(v["sampled_process_seconds"])+" actual process seconds.\n\n")
              f.write("**No original/native event or release credit.**\n")
          PY
      - name: Always retain compact real-process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-cumulative-${{ inputs.mode }}-aggregate
          path: ${{ runner.temp }}/native-metrics-result/result.json
          if-no-files-found: warn
          retention-days: 14

name: Inspect extended audio record framing

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/inspect_audio_extended_records.py"
      - ".github/workflows/audio-extended-record-framing.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Inspect records 0x00 through 0x42
        run: |
          python3 tools/inspect_audio_extended_records.py             "reference/roms/retail/Uniracers_USA.sfc"             --first 0x00 --last 0x42             --json-out audio-extended-record-framing.json             | tee audio-extended-record-framing.txt
          python3 - <<'PY'
          import json
          r = json.load(open("audio-extended-record-framing.json"))
          h = r["song_family_header"]
          assert r["parsed_record_count"] == 0x43, r["parsed_record_count"]
          assert r["first_extended_id"] == "0x00"
          assert r["last_extended_id"] == "0x42"
          assert h["uniform"], h
          assert h["first_word_le"] == 0x0400, h
          assert h["second_word_le"] == 0x1D00, h
          assert h["ids"] == [f"0x{x:02X}" for x in range(0x38, 0x43)], h
          print("song-family framing confirmed:", h)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: audio-extended-record-framing
          path: |
            audio-extended-record-framing.json
            audio-extended-record-framing.txt
          retention-days: 7

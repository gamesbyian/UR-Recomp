name: One-shot cross-build symbol correspondence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/build_cross_build_symbol_correspondence.py"
      - "tests/unit/test_build_cross_build_symbol_correspondence.py"
      - ".github/workflows/cross-build-symbol-correspondence-evidence.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Build correspondence
        run: python3 tools/build_cross_build_symbol_correspondence.py
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_build_cross_build_symbol_correspondence -v
      - name: Show correspondence
        run: cat analysis/generated/cross-build-symbol-correspondence.md
      - name: Commit generated correspondence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/cross-build-symbol-correspondence.json analysis/generated/cross-build-symbol-correspondence.md
          git diff --cached --quiet || git commit -m "analysis: record cross-build symbol correspondence"
          git push origin HEAD:${{ github.head_ref }}

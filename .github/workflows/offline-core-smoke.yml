name: Offline core research smoke

on:
  pull_request:
    paths:
      - ".github/workflows/offline-core-smoke.yml"
      - "tools/bootstrap_toolchain.py"
      - "tools/verify_rom.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/toolchain-entries/snes9x-libretro.json"
      - "tools/toolchain-entries/_global.json"
      - "third_party/**"
      - "reference/roms/retail/Uniracers_USA.sfc"
  workflow_dispatch:

concurrency:
  group: offline-core-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Host/compiler prerequisites are deliberately outside the island boundary.
      # Install them before entering the network namespace.
      - name: Install declared host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Resolve runner Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          RUST_TOOLCHAIN_BIN="$(dirname "$(rustup which cargo)")"
          test -x "$RUST_TOOLCHAIN_BIN/cargo"
          test -x "$RUST_TOOLCHAIN_BIN/rustc"
          echo "RUST_TOOLCHAIN_BIN=$RUST_TOOLCHAIN_BIN" >> "$GITHUB_ENV"

      - name: Prove canonical native build with no network interface
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_WORKSPACE,RUNNER_TEMP,RUST_TOOLCHAIN_BIN \
            unshare --net --mount-proc bash -euxo pipefail <<'OFFLINE'
          export PATH="$RUST_TOOLCHAIN_BIN:$PATH"
          cargo --version
          rustc --version

          # A fresh network namespace has no configured external interface.
          # Bring loopback up only so local build tools retain ordinary localhost semantics.
          ip link set lo up

          cd "$GITHUB_WORKSPACE"
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 tools/validate_island.py --status

          # Prove both sides of the core fidelity toolchain stage from repository-owned
          # material while GitHub/PyPI/crates.io are physically unreachable.
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          test -f .tools/src/snes9x-libretro/libretro/snes9x_libretro.so

          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          test -f "$FRAMEWORK/tools/new_project/setup_project.sh"
          test -f "$FRAMEWORK/runner/runner.cmake"
          test ! -e "$FRAMEWORK/lib/recomp-net/CMakeLists.txt"
          test ! -e "$FRAMEWORK/lib/retcomm-rbengine/CMakeLists.txt"

          TMP="$RUNNER_TEMP/ur-recomp-offline-build"
          rm -rf "$TMP"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --generate \
              --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          python3 "$GITHUB_WORKSPACE/tools/bootstrap_toolchain.py" --offline --tool sdl3 --clone-only
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"
          OFFLINE

name: ordinary 2P reference regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/input/two-player-first-race.input"
      - "tests/input/two-player-first-race-observe.script"
      - "tests/input/two-player-p2-drift-microtrace.script"
      - "tests/input/two-player-phase-entry-microtrace.script"
      - "tests/input/two-player-phase-origin-microtrace.script"
      - "tools/summarize_paired_player_slots.py"
      - "tools/assert_uniracers_vs_oam_seam.py"
      - ".github/workflows/two-player-reference.yml"

concurrency:
  group: ordinary-2p-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-player-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev xvfb

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build two-pad reference cores
        run: |
          git -C snesrecomp apply --check "$GITHUB_WORKSPACE/tools/patches/snesrecomp-dual-controller-input.patch"
          git -C snesrecomp apply "$GITHUB_WORKSPACE/tools/patches/snesrecomp-dual-controller-input.patch"
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          python3 tools/bootstrap_toolchain.py --tool beetle-bsnes-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2

      - name: Build native target with neutral input replay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh"             --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"             --dir "$ROOT"             --name "Uniracers"             --players 2             --yes             --no-ci             --no-fetch-boxart             --no-recomp-ui             --no-netplay             --no-github             --no-submodules             --generate             --no-build
          PROJ="$ROOT/UniracersSNESRecomp"
          cmake -S "$PROJ" -B "$PROJ/build"             -DCMAKE_BUILD_TYPE=Release             -DSNESRECOMP_ROOT="$FRAMEWORK"             -DSNESRECOMP_SDL_BACKEND=SDL2             -DSNESRECOMP_SDL3_FETCH=OFF
          cmake --build "$PROJ/build" -j2

      - name: Replay ordinary 2P fixture in Snes9x
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snes9x-dumps"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0           SNESREF_INPUT_FILE="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"           SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"           SNESREF_DUMP_DIR="$RUNNER_TEMP/snes9x-dumps"             "$RUNNER_TEMP/snesref-build/snesref"             "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"             "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"             | tee "$RUNNER_TEMP/snes9x.log"

      - name: Replay ordinary 2P fixture in native target
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          mkdir -p "$RUNNER_TEMP/native-dumps"
          # Every native oracle launch must start from the same battery-SRAM baseline.
          # The generated desktop host persists saves beside the executable on exit; without
          # this reset, sequential diagnostics silently inherit each other's race/session state.
          rm -rf "$(dirname "$EXE")/saves"
          SNESRECOMP_INPUT_FILE="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"           SNESRECOMP_DUMP_DIR="$RUNNER_TEMP/native-dumps"           SDL_AUDIODRIVER=dummy             timeout 180s xvfb-run -a "$EXE"             "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"             --script "$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"             >"$RUNNER_TEMP/native.log" 2>&1
          cat "$RUNNER_TEMP/native.log"

      - name: Assert route and paired-player causality
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINTS=(
            --checkpoint two-player-race-1220
            --checkpoint two-player-race-1420
            --checkpoint two-player-p1-pre-1470
            --checkpoint two-player-p1-post-1520
            --checkpoint two-player-p2-post-1570
            --checkpoint two-player-both-post-1620
          )
          for label in native snes9x; do
            python3 - "$RUNNER_TEMP/$label-dumps" "$label" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); label=sys.argv[2]
          for tag in ("two-player-race-1220","two-player-race-1420","two-player-p1-pre-1470","two-player-p1-post-1520","two-player-p2-post-1570","two-player-both-post-1620"):
              w=(root/f"{tag}.wram.bin").read_bytes()
              assert w[0x009F] == 0, f"{label}/{tag}: menu=0x{w[0x009F]:02X}"
          PY
            python3 tools/summarize_paired_player_slots.py               "$RUNNER_TEMP/$label-dumps" "${CHECKPOINTS[@]}"               --json-out "$RUNNER_TEMP/$label-two-player-state.json"               | tee "$RUNNER_TEMP/$label-two-player-state.txt"
          done

          python3 - "$RUNNER_TEMP/native-two-player-state.json" "$RUNNER_TEMP/snes9x-two-player-state.json" <<'PY'
          import json,pathlib,sys
          native=json.loads(pathlib.Path(sys.argv[1]).read_text())
          ref=json.loads(pathlib.Path(sys.argv[2]).read_text())
          progress=("next_checkpoint","finish_gate","laps_remaining")

          # Pre-intervention race state should be exact across runtimes.
          for cp in ("two-player-race-1220","two-player-race-1420"):
              assert native[cp] == ref[cp], f"{cp}: native/reference semantic mismatch"

          # Causal ownership: P1-only input moves slot1 while slot2 remains at baseline.
          for label,data in (("native",native),("snes9x",ref)):
              base=data["two-player-race-1420"]
              p1pre=data["two-player-p1-pre-1470"]
              p1post=data["two-player-p1-post-1520"]
              p2post=data["two-player-p2-post-1570"]
              both=data["two-player-both-post-1620"]
              assert p1pre["slot1"]["x_pos"] == base["slot1"]["x_pos"], f"{label}: P1 moved before P1 input"
              assert p1post["slot1"]["x_pos"] != p1pre["slot1"]["x_pos"], f"{label}: P1 did not respond"
              assert p1post["slot2"]["x_pos"] == p1pre["slot2"]["x_pos"], f"{label}: P1-only input changed P2 X position"
              assert p2post["slot2"]["x_pos"] != p1post["slot2"]["x_pos"], f"{label}: P2 did not respond"
              assert both["slot1"]["x_speed"] > 0, f"{label}: expected P1 positive X velocity"
              assert both["slot2"]["x_speed"] < 0, f"{label}: expected P2 negative X velocity"

          # Race-progress semantics remain exact even if a tiny final kinematic timing drift persists.
          for cp in native:
              for player in ("player1","player2"):
                  for field in progress:
                      assert native[cp]["race_progress"][player][field] == ref[cp]["race_progress"][player][field],                           f"{cp}/{player}/{field}: race-progress mismatch"

          # Report any post-intervention kinematic drift without converting it into a tolerance.
          for cp in ("two-player-p1-pre-1470","two-player-p1-post-1520","two-player-p2-post-1570","two-player-both-post-1620"):
              diffs={}
              for slot in ("slot1","slot2"):
                  for field in native[cp][slot]:
                      if native[cp][slot][field] != ref[cp][slot][field]:
                          diffs[f"{slot}.{field}"]=(native[cp][slot][field],ref[cp][slot][field])
              print(cp, "MATCH" if not diffs else diffs)
          PY

      - name: Assert race-relative ordinary 2P parity
        shell: bash
        run: |
          set -euo pipefail
          INPUT="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"
          MICRO="$GITHUB_WORKSPACE/tests/input/two-player-p2-drift-microtrace.script"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          REF="$RUNNER_TEMP/snesref-build/snesref"
          NATIVE="$RUNNER_TEMP/native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          SHIFTED="$RUNNER_TEMP/two-player-native-race-relative.input"

          # Native enters the ordinary 2P race one host frame after Snes9x.
          # Preserve the pre-entry route verbatim, then shift every controller
          # event at/after 1180 by +1 so post-entry input occurs at the same
          # race-relative tick in both runtimes.
          python3 - "$INPUT" "$SHIFTED" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text().splitlines()
          out=[]
          for raw in src:
              body=raw.split("#",1)[0].strip()
              if not body:
                  out.append(raw)
                  continue
              parts=body.split(":")
              if len(parts) not in (3,4):
                  out.append(raw)
                  continue
              start=int(parts[0])
              if start >= 1180:
                  parts[0]=str(start+1)
                  suffix=""
                  if "#" in raw:
                      suffix=" #"+raw.split("#",1)[1]
                  raw=":".join(parts)+suffix
              out.append(raw)
          Path(sys.argv[2]).write_text("\n".join(out)+"\n")
          PY
          cat "$SHIFTED"

          mkdir -p "$RUNNER_TEMP/snes9x-race-relative" "$RUNNER_TEMP/native-race-relative"

          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_INPUT_FILE="$INPUT" SNESREF_SCRIPT="$MICRO" \
          SNESREF_DUMP_DIR="$RUNNER_TEMP/snes9x-race-relative" \
            "$REF" "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" "$ROM" \
            >"$RUNNER_TEMP/snes9x-race-relative.log" 2>&1

          rm -rf "$(dirname "$NATIVE")/saves"
          SNESRECOMP_INPUT_FILE="$SHIFTED" SNESRECOMP_DUMP_DIR="$RUNNER_TEMP/native-race-relative" \
          SDL_AUDIODRIVER=dummy \
            timeout 180s xvfb-run -a "$NATIVE" "$ROM" --script "$MICRO" \
            >"$RUNNER_TEMP/native-race-relative.log" 2>&1

          # Compare the same race-relative instant: native enters this route
          # one host frame later, so native frame N+1 is paired with Snes9x N.
          python3 - "$RUNNER_TEMP/native-race-relative" "$RUNNER_TEMP/snes9x-race-relative" <<'PY'
          from pathlib import Path
          import sys
          nroot=Path(sys.argv[1]); sroot=Path(sys.argv[2])
          fields={
              "phase0":("u8",0x0300),
              "phase2":("u8",0x0302),
              "phase3":("u8",0x0304),
              "inRace":("u8",0x0313),
              "race_tick":("u8",0x0FE7),
              "slot1.x":("u16",0x0411),
              "slot1.y":("u16",0x0415),
              "slot1.vx":("s16",0x04B7),
              "slot1.vy":("s16",0x04BB),
              "slot1.air":("u8",0x0545),
              "slot1.rot":("u8",0x04C7),
              "slot2.x":("u16",0x0413),
              "slot2.y":("u16",0x0417),
              "slot2.vx":("s16",0x04B9),
              "slot2.vy":("s16",0x04BD),
              "slot2.air":("u8",0x0547),
              "slot2.rot":("u8",0x04C9),
              "working.x_speed":("s16",0x0F9F),
          }
          def read(w,kind,off):
              if kind=="u8": return w[off]
              v=w[off]|(w[off+1]<<8)
              return v-0x10000 if kind=="s16" and v&0x8000 else v

          mismatches=[]
          for sf in range(1528,1541):
              nf=sf+1
              s=(sroot/f"p2-drift-{sf}.wram.bin").read_bytes()
              n=(nroot/f"p2-drift-{nf}.wram.bin").read_bytes()
              diffs={}
              for name,(kind,off) in fields.items():
                  pair=(read(n,kind,off),read(s,kind,off))
                  if pair[0]!=pair[1]:
                      diffs[name]=pair
              print(f"RACE_RELATIVE_COMPARE native={nf} snes9x={sf}",
                    "MATCH" if not diffs else diffs)
              if diffs:
                  mismatches.append((nf,sf,diffs))
          assert not mismatches, f"race-relative semantic mismatch: {mismatches[:3]}"
          print("RACE_RELATIVE_ALIGNMENT_CONFIRMED")
          PY

      - name: Assert ordinary 2P active-display OAM seam
        run: |
          python3 tools/assert_uniracers_vs_oam_seam.py             "$RUNNER_TEMP/snes9x-dumps/two-player-race-1220.ppuw.tsv"             "$RUNNER_TEMP/snes9x-dumps/two-player-race-1420.ppuw.tsv"             "$RUNNER_TEMP/snes9x-dumps/two-player-p1-pre-1470.ppuw.tsv"             "$RUNNER_TEMP/snes9x-dumps/two-player-p2-post-1570.ppuw.tsv"             "$RUNNER_TEMP/snes9x-dumps/two-player-both-post-1620.ppuw.tsv"

      - name: Assert ordinary 2P high-OAM routing
        run: |
          python3 tools/decode_uniracers_oam_split.py --expect 0x5A \
            "$RUNNER_TEMP/snes9x-dumps/two-player-race-1220.oam.bin" \
            "$RUNNER_TEMP/snes9x-dumps/two-player-race-1420.oam.bin" \
            "$RUNNER_TEMP/snes9x-dumps/two-player-p1-pre-1470.oam.bin" \
            "$RUNNER_TEMP/snes9x-dumps/two-player-p2-post-1570.oam.bin" \
            "$RUNNER_TEMP/snes9x-dumps/two-player-both-post-1620.oam.bin"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-2p-reference
          path: |
            ${{ runner.temp }}/native.log
            ${{ runner.temp }}/snes9x.log
            ${{ runner.temp }}/*-two-player-state.json
            ${{ runner.temp }}/*-two-player-state.txt
            ${{ runner.temp }}/native-dumps/
            ${{ runner.temp }}/snes9x-dumps/
            ${{ runner.temp }}/phase-native/
            ${{ runner.temp }}/phase-snes9x/
            ${{ runner.temp }}/phase-beetle/
            ${{ runner.temp }}/phase-native.log
            ${{ runner.temp }}/phase-snes9x.log
            ${{ runner.temp }}/phase-beetle.log
            ${{ runner.temp }}/native-micro/
            ${{ runner.temp }}/snes9x-micro/
            ${{ runner.temp }}/native-micro.log
            ${{ runner.temp }}/snes9x-micro.log
            ${{ runner.temp }}/p1-left-native/
            ${{ runner.temp }}/p1-left-snes9x/
            ${{ runner.temp }}/p1-right-native/
            ${{ runner.temp }}/p1-right-snes9x/
            ${{ runner.temp }}/p2-right-native/
            ${{ runner.temp }}/p2-right-snes9x/
            ${{ runner.temp }}/p1-left-*.log
            ${{ runner.temp }}/p1-right-*.log
            ${{ runner.temp }}/p2-right-*.log
          retention-days: 7

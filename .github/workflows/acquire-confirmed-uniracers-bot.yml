name: Acquire confirmed Uniracers bot artifacts

on:
  push:
    paths:
      - .github/workflows/acquire-confirmed-uniracers-bot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download confirmed public artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p references/imported/tas-bots
          curl -fL --retry 3 --connect-timeout 15 --max-time 60             'https://pastebin.com/raw/A0XpKw9v'             -o references/imported/tas-bots/uniracers-tabletop-bot-2014.lua
          curl -fL --retry 3 --connect-timeout 15 --max-time 60             'https://tasvideos.org/4250S?handler=Download'             -o references/imported/tas-bots/dessyreqt-4250-submission.smv
          if curl -fL --retry 2 --connect-timeout 15 --max-time 60             'http://dehacked.2y.net/microstorage.php/get/1674584940/Uniracers%20%28U%29%20%5B%21%5D.smv'             -o references/imported/tas-bots/uniracers-2008-wip-microstorage.smv; then
            echo "Recovered historical Microstorage WIP."
          else
            rm -f references/imported/tas-bots/uniracers-2008-wip-microstorage.smv
            echo "Microstorage WIP download unavailable."
          fi
          sha256sum references/imported/tas-bots/* | tee references/imported/tas-bots/SHA256SUMS
          wc -c references/imported/tas-bots/*

      - name: Write provenance
        shell: bash
        run: |
          cat > references/imported/tas-bots/README.md <<'EOF'
          # Uniracers TAS / autonomous-player artifacts

          Retrieved 2026-09-28 for private reverse-engineering research.

          ## 2014 full-game bot

          - `uniracers-tabletop-bot-2014.lua`
          - public source: https://pastebin.com/A0XpKw9v
          - raw source: https://pastebin.com/raw/A0XpKw9v
          - author: Dessyreqt
          - public title: `Uniracers Tabletop bot`
          - associated TASVideos submission: https://tasvideos.org/4250S
          - license/redistribution terms: not identified; retain as third-party research evidence.

          TASVideos submission #4250 states that the run was generated by a bot which
          plays the game to completion without savestate search and can be adjusted for
          human-vs-bot play. The Lua source is preserved verbatim as recovered.

          ## TASVideos #4250 submitted movie

          - `dessyreqt-4250-submission.smv`
          - source: https://tasvideos.org/4250S?handler=Download
          - associated submission: https://tasvideos.org/4250S
          - license/redistribution terms: not identified; retain as third-party research evidence.

          ## 2008 Microstorage WIP

          If present:
          - `uniracers-2008-wip-microstorage.smv`
          - historical info URL:
            http://dehacked.2y.net/microstorage.php/info/1674584940/Uniracers%20%28U%29%20%5B%21%5D.smv
          - direct-download convention:
            http://dehacked.2y.net/microstorage.php/get/1674584940/Uniracers%20%28U%29%20%5B%21%5D.smv
          - historical context identifies this as an Uniracers TAS work-in-progress.
          - license/redistribution terms: not identified; retain as third-party research evidence.

          Exact hashes are in `SHA256SUMS`.
          EOF

      - name: Commit recovered artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f references/imported/tas-bots/
          git commit -m "Preserve recovered Uniracers autonomous-player artifacts"
          git pull --rebase origin main
          git push origin HEAD:main

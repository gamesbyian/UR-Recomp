name: QA-08 source-pin fresh Windows 2P raster versus original

# One archive-only independent qualification of the *new*, combined PPU/OAM
# Windows process from #1641, not the historical probe PE or a new game run.
# Original 2014 Snes9x 2P run 38781958316, artifact 11996107746.
# Exact candidate #1641 b8722af: Windows run 38963502076,
# source/OAM/PPU artifact 12074238115. Immutable ZIP digests below.
on:
  # Source and entire OAM corpora are already SHA-verified and retained;
  # rerun solely on explicit request, not each independent QA/main commit.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qa08-independent-latest-real-2p-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archived-registered-source:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1649 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve two immutable source archives without emulator or ROM
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa08-paired"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/11996107746/zip" \
            -o "$RUNNER_TEMP/qa08-paired/original.zip"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/12074238115/zip" \
            -o "$RUNNER_TEMP/qa08-paired/latest-windows.zip"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/12014896975/zip" \
            -o "$RUNNER_TEMP/qa08-paired/prior-windows.zip"
          cd "$RUNNER_TEMP/qa08-paired"
          printf '%s\n' \
            "72b7b152d08d8abb3636053bfd132db64926a5bf188f4dbba7e30b20d9583e9e  original.zip" \
            "4f766de13c702a108279293df4613538d8b49cbd1ecbc0876533c5f01f09293c  latest-windows.zip" \
            "f01ab5a4888c227f306a0b9cd89e67710a4b41cad4c22867072280a17811fa82  prior-windows.zip" \
            | sha256sum -c -
          mkdir original native prior-native
          unzip -q original.zip -d original
          unzip -q latest-windows.zip -d native
          unzip -q prior-windows.zip -d prior-native
          test -f original/qa08-original-2p-fullroute.json
          test -f native/qa08-windows-2p-fullroute.json
          test -f native/qa08-native-effective-pixel-owner.json
          test -f native/qa08-native-OAM-port-input.json
          echo "Immutable original+Win32 archives SHA256 verified. ROM/SRAM not downloaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify all 263 new Windows field images identical to prior valid Win32 source
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/qa08-paired/prior-native" "$RUNNER_TEMP/qa08-paired/native" "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib, json, pathlib, sys
          old,new=map(pathlib.Path,sys.argv[1:3])
          previous=json.loads((old/"qa08-windows-2p-fullroute.json").read_text())
          latest=json.loads((new/"qa08-windows-2p-fullroute.json").read_text())
          assert previous["schema"]==latest["schema"]=="qa08-real-windows-2p-split-fullroute-source-20261015/1"
          assert previous["actual_native_simulations"]==latest["actual_native_simulations"]==5484
          assert previous["actual_native_guest_CRC_sha256"]==latest["actual_native_guest_CRC_sha256"]=="c782121bdab59790cd11ba2cb02c567adf1ca4f0a6218c75da5a896b52f04876"
          assert previous["actual_source_count"]==latest["actual_source_count"]==263
          old_manifest=previous["source_frame_P7_SHA256_by_guest"]
          new_manifest=latest["source_frame_P7_SHA256_by_guest"]
          frames=list(range(1280,5473,16))
          assert set(old_manifest)==set(new_manifest)=={str(f) for f in frames}
          for frame in frames:
              name=f"ur-baldosa-original-source-{frame:06d}.pam"
              for root,manifest in ((old,old_manifest),(new,new_manifest)):
                  raw=(root/"source"/name).read_bytes()
                  assert len(raw)>256*224*4
                  assert hashlib.sha256(raw).hexdigest()==manifest[str(frame)],name
              assert old_manifest[str(frame)]==new_manifest[str(frame)],f"new raster altered at native guest {frame}"
          assert previous["actual_windows_PE_sha256"]!=latest["actual_windows_PE_sha256"]
          print("QA08_NEW_WINDOWS_COMPARED_PRIOR 263/263 true P7 hashes identical, distinct compiled PE, 5484 CRC identical")
          with open(sys.argv[3],"a",encoding="utf-8") as out:
              out.write("All 263 actual Windows source P7 images are byte-identical to the independently archived previous real native candidate despite distinct compiled PE hashes; full 5484 guest CRC is identical. This is source-raster regression parity, not original/hardware/host presentation release.\n")
          PY

      - name: Bind exact new PE to 263 source images, OAM ports and full guest route
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/qa08-paired/native" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          source=json.loads((root/"qa08-windows-2p-fullroute.json").read_text())
          pixels=json.loads((root/"qa08-native-effective-pixel-owner.json").read_text())
          ports=json.loads((root/"qa08-native-OAM-port-input.json").read_text())
          assert source["schema"]=="qa08-real-windows-2p-split-fullroute-source-20261015/1"
          assert source["same_unmodified_exe_and_native_guest_execution_as_pixel_owner"] is True
          assert pixels["qualified_263_frame_source_PPU_in_same_native_process"] is True
          assert pixels["same_real_Windows_process_CGRAM_ports_2100_HDMA7_observed"] is True
          assert source["actual_native_guest_CRC_sha256"]==pixels["real_native_2p_guest_crc_sha256"]=="c782121bdab59790cd11ba2cb02c567adf1ca4f0a6218c75da5a896b52f04876"
          assert source["actual_windows_PE_sha256"]==pixels["verified_same_actual_Windows_executable"]
          assert source["actual_native_simulations"]==pixels["real_native_2p_guest_frames"]==5484
          assert source["actual_source_count"]==263
          assert pixels["independently_source_qualified_native_pixels"]==11
          assert pixels["independently_source_qualified_native_scanline_OAM_snapshots"]==70
          assert source["read_only_native_CGRAM_port_writer_chronology"]["write_frames"]==[5169,5176,5183,5190]
          assert source["read_only_native_INIDISP_2100_write_chronology"]["actual_bounded_native_2100_writes"]>0
          assert source["read_only_native_HDMA7_firstline"]["read_only"] is True
          assert source["original_snes9x_effective_OBJ_BG_math_priority_accepted"] is False
          print("QA08_FRESH_ONE_PROCESS_SOURCE_QA 263_PPU=1 5484_guest=1 11_pixels=1 70_OAM=1 source_port=1")
          PY

      - name: Compare all 15 million RGB5 source pixels using independent 2014 oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.unit.test_qa08_compare_windows_original_twoplayer_sparse
          python3 tools/qa08_compare_windows_original_twoplayer_sparse.py \
            --original-dir "$RUNNER_TEMP/qa08-paired/original" \
            --windows-dir "$RUNNER_TEMP/qa08-paired/native" \
            --route "reference/imported/reverse-engineering/baldosa-uniracers-recomp/tests/routes/race_2p.txt" \
            --out "$RUNNER_TEMP/qa08-paired/source-verdict.json"
          python3 - "$RUNNER_TEMP/qa08-paired/source-verdict.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["full_logical_pixel_geometry"]==[256,224]
          assert d["all_2P_source_pixels_compared"]==263*256*224
          assert d["authentic_native_guest_simulations"]==5484
          assert d["native_guest_CRC_sha256"]=="c782121bdab59790cd11ba2cb02c567adf1ca4f0a6218c75da5a896b52f04876"
          assert d["actual_original_source_callback_count"]==d["actual_native_source_callback_count"]==263
          assert d["strict_exact_2P_sampled_frames"]==203
          assert d["strict_divergent_2P_sampled_frames"]==60
          assert d["total_original_vs_windows_incorrect_RGB5_pixels"]==385373
          assert d["earliest_real_divergent_guest"]==1280
          assert d["continuous_executed_guest_CPU_camera_input_phase_independently_proven"] is False
          assert d["physical_4x_widescreen_HD_art_release_accepted"] is False
          with open(sys.argv[2],"a",encoding="utf-8") as o:
              o.write("### Exact fresh-Win32 Original PPU vs immutable 2014 Snes9x\n")
              o.write(f"263 actual source fields, 15,081,472 RGB5 pixels, {d['strict_exact_2P_sampled_frames']} exact / {d['strict_divergent_2P_sampled_frames']} divergent; {d['total_original_vs_windows_incorrect_RGB5_pixels']} incorrect RGB5 pixels.\n")
              o.write("The historical reference is a source diagnostic, not a physical SNES DAC oracle. No actual player-visible 4x, Widescreen/7:6, original-effective OBJ priority, HD approval, complete event or release acceptance.\n")
          print("QA08_EXACT_NEW_WIN32_2P source_raster=qualified historical_rgb5_diff=preserved release=0")
          PY
      - name: Retain source-hashed per-frame comparison receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa08-new-win32-original-2p-263frame-adjudication
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/qa08-paired/source-verdict.json
      # Accepted graphics evidence is ROM/SRAM free. The nested producer
      # archives keep their *original* immutable whole-ZIP SHA256 checksums,
      # unlike the new GitHub upload ZIP envelope. Source screenshot bytes
      # and 263 image manifests are independently pinned, not a new emulator.
      - name: Verify ROM-free graphics source archives before long retention
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/qa08-paired" <<'PY'
          from pathlib import Path
          import sys, zipfile
          root=Path(sys.argv[1])
          for file in ("original.zip","latest-windows.zip","prior-windows.zip"):
              with zipfile.ZipFile(root/file) as zip_file:
                  names=zip_file.namelist()
                  assert names and len(names)==len(set(names))
                  assert all(not name.startswith("/") and ".." not in Path(name).parts for name in names)
                  for name in names:
                      low=name.lower()
                      assert not low.endswith((".sfc",".smc",".srm",".sav",".rom",".nes",".gb",".zip"))
                      assert not any(token in low for token in ("wram.bin","sram.bin","vram.bin","profile.json","user-data"))
          print("QA08_SOURCE_RETENTION_VERIFIED original/native nested source ZIPs contain no ROM/SRAM/save/profile files")
          PY
      - name: Preserve immutable original and native source rasters with 90-day traceability
        uses: actions/upload-artifact@v4
        with:
          name: qa08-source-raster-3producer-nested-90d
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/qa08-paired/original.zip
            ${{ runner.temp }}/qa08-paired/latest-windows.zip
            ${{ runner.temp }}/qa08-paired/prior-windows.zip
            ${{ runner.temp }}/qa08-paired/source-verdict.json

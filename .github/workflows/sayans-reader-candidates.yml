name: One-shot Sayans reader candidate scan

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/scan_text_control_reader_candidates.py"
      - ".github/workflows/sayans-reader-candidates.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Scan text/control reader candidates
        run: |
          python3 tools/scan_text_control_reader_candidates.py             "reference/roms/retail/Uniracers_USA.sfc"             --json-out sayans-reader-candidates.json
          cat sayans-reader-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: sayans-reader-candidates
          path: sayans-reader-candidates.json

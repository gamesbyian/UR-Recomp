name: One-shot controlled SRAM medal discriminator

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/analyze_sram_medal_discriminator.py"
      - ".github/workflows/one-shot-sram-medal-discriminator.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-sram-medal-discriminator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build pinned Snes9x reference core
        run: |
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2

      - name: Finish Dragster from clean recovered SRAM
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          CLEAN="$GITHUB_WORKSPACE/reference/imported/reverse-engineering/dessyreqt/SRAM/Clean.srm"
          DUMPS="$RUNNER_TEMP/sram-medal-dumps"
          mkdir -p "$DUMPS"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$CLEAN" \
          SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/ui-race-result-route.script" \
          SNESREF_DUMP_DIR="$DUMPS" \
            "$EXE" "$CORE" "$ROM" >"$RUNNER_TEMP/run.log" 2>&1
          cat "$RUNNER_TEMP/run.log"
          RESULTS="$(find "$DUMPS" -maxdepth 1 -type f -name 'race-results*sram*' -print -quit)"
          ADVANCE="$(find "$DUMPS" -maxdepth 1 -type f -name 'ui-race-result-after-advance*sram*' -print -quit)"
          BACK="$(find "$DUMPS" -maxdepth 1 -type f -name 'ui-race-result-after-back*sram*' -print -quit)"
          test -n "$RESULTS"
          test -n "$ADVANCE"
          test -n "$BACK"
          cp "$RESULTS" "$RUNNER_TEMP/race-results.srm"
          cp "$ADVANCE" "$RUNNER_TEMP/after-advance.srm"
          cp "$BACK" "$RUNNER_TEMP/after-back.srm"

      - name: Analyze controlled transitions
        run: |
          python3 tools/analyze_sram_medal_discriminator.py \
            "$RUNNER_TEMP/race-results.srm" \
            "$RUNNER_TEMP/after-advance.srm" \
            --known-no-hunter "reference/imported/reverse-engineering/dessyreqt/SRAM/All Silvers - No Hunter.srm" \
            --known-with-hunter "reference/imported/reverse-engineering/dessyreqt/SRAM/All Silvers - With Hunter.srm" \
            --json-out analysis/generated/sram-controlled-result-advance.json \
            --md-out analysis/generated/sram-controlled-result-advance.md
          python3 tools/analyze_sram_medal_discriminator.py \
            "$RUNNER_TEMP/after-advance.srm" \
            "$RUNNER_TEMP/after-back.srm" \
            --json-out analysis/generated/sram-controlled-result-back.json \
            --md-out analysis/generated/sram-controlled-result-back.md
          cat analysis/generated/sram-controlled-result-advance.md
          cat analysis/generated/sram-controlled-result-back.md

      - name: Persist report
        shell: bash
        run: |
          set -euo pipefail
          git add analysis/generated/sram-controlled-result-advance.json analysis/generated/sram-controlled-result-advance.md analysis/generated/sram-controlled-result-back.json analysis/generated/sram-controlled-result-back.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record controlled Dragster SRAM mutation"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

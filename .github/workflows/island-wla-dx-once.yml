name: One-shot island WLA-DX

on:
  push:
    branches:
      - chatgpt/island-wla-dx-2026-09-29
    paths:
      - .github/workflows/island-wla-dx-once.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Stage pinned 65816/linker source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/wla-dx"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/vhelin/wla-dx.git
          git -C "$upstream" fetch --depth 1 --filter=blob:none origin 91c52b1f4ef3cc8ba3c0638f7536539579af6a9f
          git -C "$upstream" checkout --detach --force 91c52b1f4ef3cc8ba3c0638f7536539579af6a9f
          test "$(git -C "$upstream" rev-parse HEAD)" = "91c52b1f4ef3cc8ba3c0638f7536539579af6a9f"

          dest="third_party/src/wla-dx"
          rm -rf "$dest"
          mkdir -p "$dest"

          # Preserve upstream root sources/metadata, then remove CPU backends
          # that the UR-Recomp build graph deliberately does not expose.
          find "$upstream" -maxdepth 1 -type f -exec cp {} "$dest/" \;
          cp -a "$upstream/instruction_table_generator" "$dest/"
          cp -a "$upstream/wlalink" "$dest/"

          for cpu in \
            i6502.c i65c02.c i65ce02.c i6800.c i68000.c i6801.c i6809.c \
            i8008.c i8080.c icx4.c iez80.c igb.c ihuc6280.c ispc700.c \
            isuperfx.c ish2.c iz80.c iz80n.c
          do
            rm -f "$dest/$cpu"
          done

          rm -f "$dest"/azure-pipelines-*.yml "$dest"/.readthedocs.yaml
          rm -rf "$dest"/.git

      - name: Prove pruned 65816/linker build
        shell: bash
        run: |
          set -euo pipefail
          buildsrc="$RUNNER_TEMP/wla-build"
          cp -a third_party/src/wla-dx "$buildsrc"
          git -C "$buildsrc" init -q
          git -C "$buildsrc" add .
          git -C "$buildsrc" apply "$GITHUB_WORKSPACE/tools/patches/wla-dx-ur-recomp.patch"

          cmake -S "$buildsrc" -B "$buildsrc/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$buildsrc/build" --target wla-65816 wlalink -j2
          test -x "$buildsrc/build/binaries/wla-65816"
          test -x "$buildsrc/build/binaries/wlalink"

          # Both CLIs must execute successfully enough to identify themselves.
          "$buildsrc/build/binaries/wla-65816" 2>&1 | head -n 12 || true
          "$buildsrc/build/binaries/wlalink" 2>&1 | head -n 12 || true

      - name: Record manifest and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          source = root / "third_party/src/wla-dx"

          def file_sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def tree_sha256(path):
              h = hashlib.sha256()
              for item in sorted(p for p in path.rglob("*") if p.is_file()):
                  rel = item.relative_to(path)
                  if any(part in {".git", "__pycache__", "build"} for part in rel.parts):
                      continue
                  h.update(rel.as_posix().encode("utf-8"))
                  h.update(b"\0")
                  h.update(file_sha256(item).encode("ascii"))
                  h.update(b"\n")
              return h.hexdigest()

          tree_hash = tree_sha256(source)

          manifest_path = root / "third_party/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          component = next(c for c in manifest["components"] if c["id"] == "wla-dx")
          component.update({
              "mode": "vendored",
              "source_path": "third_party/src/wla-dx",
              "archive_path": None,
              "source_sha256": tree_hash,
              "license_spdx": "GPL-2.0-or-later",
              "license_path": "third_party/src/wla-dx/LICENSE",
              "notes": "Pruned repository-owned WLA-DX source for the 65816 assembler and wlalink only. Other CPU backends, tests, docs, examples, platform packaging and auxiliary binaries are omitted; a project patch narrows upstream CMake to the retained build graph.",
              "provenance_path": "third_party/provenance/wla-dx.json",
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          provenance = {
              "schema_version": 1,
              "tool": "wla-dx",
              "upstream_url": "https://github.com/vhelin/wla-dx.git",
              "upstream_revision": "91c52b1f4ef3cc8ba3c0638f7536539579af6a9f",
              "vendored_source_path": "third_party/src/wla-dx",
              "vendored_tree_sha256": tree_hash,
              "license_spdx": "GPL-2.0-or-later",
              "license_path": "third_party/src/wla-dx/LICENSE",
              "project_patch": "tools/patches/wla-dx-ur-recomp.patch",
              "retained": [
                  "top-level common assembler source/headers and upstream metadata",
                  "i65816.c",
                  "instruction_table_generator/**",
                  "wlalink/**"
              ],
              "excluded": [
                  "non-65816 i*.c CPU backends",
                  "tests/**",
                  "doc/**",
                  "examples/**",
                  "historical/**",
                  "windows/**",
                  "binaries/**",
                  "wlab/**",
                  "byte_tester/**",
                  "display_statistics/**",
                  "print_instructions/**",
                  "memorymaps/**",
                  "CI/pipeline metadata"
              ],
              "exclusion_reason": "UR-Recomp consumes only wla-65816 and wlalink for reconstruction workflows. The retained common sources plus one CPU backend and linker form the complete build closure after the narrow CMake patch.",
              "dependency_closure": "No package registry. Build requires only CMake, a C compiler and ordinary host libc/libm.",
              "build_contract": "Apply tools/patches/wla-dx-ur-recomp.patch, then CMake Release configure and build targets wla-65816 and wlalink."
          }
          prov = root / "third_party/provenance/wla-dx.json"
          prov.parent.mkdir(parents=True, exist_ok=True)
          prov.write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print("tree_sha256", tree_hash)
          PY

          python3 tools/validate_island.py

      - name: Commit repository-owned WLA-DX source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f third_party/src/wla-dx third_party/provenance/wla-dx.json third_party/manifest.json
          git commit -m "toolchain: vendor WLA-DX 65816 source"
          git push origin "HEAD:${{ github.ref_name }}"

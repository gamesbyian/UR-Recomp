# One bounded Windows x64 build of the exact pinned Baldosa AOT title with
# UR's existing guest observer, human input and acknowledged pause bridge.
# Does not assert a packaged Modern product or course/event completion.
name: Baldosa native Windows x64 bridge feasibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/baldosa-windows-native-bridge.yml"
      - "tools/baldosa_windows_native_pause_route.py"
      - "tools/baldosa_native_1p_records_probe.py"
      - "tools/baldosa_native_2p_records_probe.py"
      - "tools/baldosa_native_first_racer_probe.py"
      - "tools/baldosa_native_second_racer_probe.py"
      - "tools/baldosa_native_practice_probe.py"
      - "tests/unit/test_baldosa_native_practice_probe.py"
      - "tests/unit/test_baldosa_native_second_racer_probe.py"
      - "tools/baldosa_native_first_racer_real_run_probe.py"
      - "tests/unit/test_baldosa_native_first_racer_real_run_probe.py"
      - "native/product/baldosa_native_first_profile.hpp"
      - "native/product/baldosa_native_second_profile.hpp"
      - "native/product/modern_root_overlay_presenter.hpp"
      - "native/product/modern_root_physical_edges.hpp"
      - "tests/native/baldosa_native_first_profile_test.cpp"
      - "tests/unit/test_baldosa_native_first_profile_cpp.py"
      - "tests/unit/test_baldosa_native_first_racer_probe.py"
      - "tools/baldosa_modern_profile_native_fixture.cpp"
      - "tests/unit/test_baldosa_native_2p_records_probe.py"
      - "tests/unit/test_baldosa_native_1p_records_probe.py"
      - "tests/unit/test_baldosa_windows_native_pause_route.py"
      - "tools/baldosa_native_pause_lifecycle.cpp"
      - "tools/baldosa_product_pause_spike.py"
      - "tools/baldosa_modern_user_data_spike.py"
      - "tools/baldosa_modern_profile_activation_spike.py"
      - "tools/baldosa_modern_profile_activation.cpp"
      - "tools/baldosa_modern_profile_native_fixture.cpp"
      - "tests/native/baldosa_modern_profile_activation_test.cpp"
      - "tests/unit/test_baldosa_modern_profile_activation_spike.py"
      - "tools/check_windows_portable_binary.py"
      - "tools/assemble_baldosa_windows_candidate.py"
      - "tools/verify_baldosa_windows_extracted_launcher.py"
      - "tests/unit/test_assemble_baldosa_windows_candidate.py"
      - "native/product/modern_session_c_api.*"
      - "native/product/modern_session_runtime.*"
      - "native/product/session_runtime_adapter.*"
      - "native/product/baldosa_modern_session_binding.hpp"
  workflow_dispatch:
  workflow_call:
    inputs:
      export_campaign_inputs:
        description: "Export the one source-bound Windows executable and ROMless ZIP for manual cohort reuse"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: baldosa-windows-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out owning UR product bridge
        uses: actions/checkout@v4

      - name: Check out exact pinned native AOT and framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Guard guest CRC, pause witness and Modern mutable-root stage
        run: |
          python tests/unit/test_assemble_baldosa_windows_candidate.py
          python tests/unit/test_baldosa_windows_native_pause_route.py
          python tests/unit/test_baldosa_native_1p_records_probe.py
          python tests/unit/test_baldosa_native_2p_records_probe.py
          python tests/unit/test_baldosa_native_first_profile_cpp.py
          python tests/unit/test_baldosa_native_first_racer_probe.py
          python tests/unit/test_baldosa_native_second_racer_probe.py
          python tests/unit/test_baldosa_native_first_racer_real_run_probe.py
          python tests/unit/test_baldosa_modern_user_data_spike.py
          python tests/unit/test_baldosa_modern_profile_activation_spike.py

      - name: Verify immutable native source pins
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          test -s baldosa/src/gen/dispatch_v2.c
          git -C baldosa submodule status --recursive

      - name: Stage only the verified UR native boundary
        run: |
          set -euo pipefail
          python tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_pause_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          # No second native core, ROM or alternate product frontend.
          test -s baldosa/src/main.c
          test -s baldosa/snesrecomp/runner/src/desktop/host_main.c

      - name: Use Baldosa's already-proven Windows clang toolchain path
        run: |
          set -euo pipefail
          bash baldosa/snesrecomp/tools/ci/fetch_toolchain.sh --artifact windows-x64

      - name: Build real native AOT Windows x64 title plus UR host bridges
        run: |
          set -euo pipefail
          # Same toolchain as pinned Baldosa upstream Windows workflow.
          source "${TOOLCHAIN_DIR}/env.sh"
          cmake -S baldosa -B baldosa/build-ur-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_ENABLE_TRACE=OFF
          cmake --build baldosa/build-ur-win --target UniracersSNESRecomp -j 3
          cmake --build baldosa/build-ur-win --target ur-baldosa-modern-profile-fixture -j 3
          test -s baldosa/build-ur-win/UniracersSNESRecomp.exe
          test -s baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe

      - name: Admit only a real Windows x64 PE32+ executable
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct
          image = Path("baldosa/build-ur-win/UniracersSNESRecomp.exe").read_bytes()
          assert len(image) > 65536, "empty or placeholder executable"
          assert image[:2] == b"MZ", "missing DOS header"
          pe = struct.unpack_from("<I", image, 0x3c)[0]
          assert image[pe:pe+4] == b"PE\x00\x00", "missing PE signature"
          machine = struct.unpack_from("<H", image, pe + 4)[0]
          magic = struct.unpack_from("<H", image, pe + 24)[0]
          assert machine == 0x8664 and magic == 0x20b, (machine, magic)
          print(f"PASS native Baldosa+UR Windows x64 PE32+: bytes={len(image)}")
          PY
          echo "PASS: pinned Baldosa AOT Windows x64 with existing UR guest/input/native-pause hooks links and produces PE32+" >> "$GITHUB_STEP_SUMMARY"
          echo "NOT TESTED: Modern frontend, runtime interaction, package, per-profile SRAM, Records, replay, ghosts, or complete event." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Baldosa Windows PE needs only clean-machine system DLLs
        run: |
          set -euo pipefail
          # Reuse the SAME verifier as the existing shipping portable ZIP.
          # Windows runners may supply VC/MinGW/SDL DLLs via PATH that the
          # extracted consumer ZIP will not contain.
          EXE_WIN="$(cygpath -w "$GITHUB_WORKSPACE/baldosa/build-ur-win/UniracersSNESRecomp.exe")"
          export EXE_WIN
          powershell.exe -NoProfile -Command '
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -property installationPath
            if (-not $vs) { throw "Visual Studio installation not found" }
            $toolsRoot = Join-Path $vs "VC\Tools\MSVC"
            $tools = Get-ChildItem -LiteralPath $toolsRoot -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $tools) { throw "MSVC tools directory not found" }
            $dumpbin = Join-Path $tools.FullName "bin\Hostx64\x64\dumpbin.exe"
            if (-not (Test-Path -LiteralPath $dumpbin)) { throw "dumpbin.exe not found" }
            & $dumpbin /dependents $env:EXE_WIN
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ' | tee "$RUNNER_TEMP/baldosa-native-pe-dependencies.log"
          python tools/check_windows_portable_binary.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --dependencies "$RUNNER_TEMP/baldosa-native-pe-dependencies.log"
          echo "PASS: native AOT game imports only stock Windows inbox DLLs; no unsupplied compiler/SDL runtime needed" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute actual Win32 two-player guest and native pause/resume
        env:
          UR_BALDOSA_PRODUCT_INPUT_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          python tools/baldosa_windows_native_pause_route.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --script "baldosa/tests/routes/race_2p_split.txt" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route" \
            --video windows --expected-frames 2473 --timeout 95 \
            --profile-fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe"
          echo "PASS: Win32 real native guest boot with two distinct catalog-backed Modern profiles, exact acknowledged native post-save typed SRAM publication/readback, per-rider isolation, pause/Restart, fresh-process reload, clean-machine DLL and invalid-profile gates. No completed event, physical hardware or unified frontend claim." >> "$GITHUB_STEP_SUMMARY"

      - name: Real stock 1P result and newly saved Records reopened by fresh native game
        run: |
          set -euo pipefail
          python tools/baldosa_native_1p_records_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --seed "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/baseline/Modern Player Data With Spaces/saves/save.srm" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_real_1p_records" \
            --video windows --timeout 150
          echo "PASS: same source-bound Win32 guest entered stock 1P from Modern root, committed an actual result to a named .urrun, and a genuinely fresh game process opened that exact Records artifact. Original/native parity and physical controller remain unverified." >> "$GITHUB_STEP_SUMMARY"

      - name: Real named P1/P2 ordinary race through paired Records and fresh native process
        run: |
          set -euo pipefail
          # Reuse the already built EXACT same native PE and Modern codec
          # fixture. Stock game result must emerge from live SRAM; a bare
          # sprite/guest CRC, synthetic result, or script quit cannot pass.
          python tools/baldosa_native_2p_records_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --seed "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/baseline/Modern Player Data With Spaces/saves/save.srm" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_real_2p_records" \
            --video windows --timeout 360
          echo "PASS: real stock 2P result from separately confirmed Modern P1/P2 identities, one canonical paired .urrun/.urmatch, and a fresh native game opening exact same Records. Not original parity, hardware gamepads or release acceptance." >> "$GITHUB_STEP_SUMMARY"

      - name: First controller-semantic native racer creation persists for exact fresh-game boot
        run: |
          set -euo pipefail
          python tools/baldosa_native_first_racer_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_first_racer" \
            --video windows --timeout 110
          echo "PASS: real native first-run Modern preset creation through shared root controls, canonical clean SRAM and typed catalog; new game process independently booted it, never live SRAM hot-swap. No physical pad or original/native release credit." >> "$GITHUB_STEP_SUMMARY"

      - name: Native first-run nondefault Andrew stock rider and clean new-game SRAM
        run: |
          set -euo pipefail
          # Same exact native Windows PE and production profile/catalog/raw
          # codecs. Additional real human-root Up/Down semantic event,
          # deliberately choosing stock preset index 1 rather than Mike.
          python tools/baldosa_native_first_racer_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_first_racer_andrew" \
            --preset 1 --video windows --timeout 110
          echo "PASS: actual native first-run P1 Down/A selected ANDREW, first private full 8192-byte source SRAM rider byte=1, exact existing typed/catalog/raw codec and a second real Windows game BOOT_SRAM fingerprint. This is scripted input, NOT physical hardware or original/emulator gameplay parity." >> "$GITHUB_STEP_SUMMARY"

      - name: Native named P1 explicitly creates independent P2 then both enter stock 2P
        run: |
          set -euo pipefail
          python tools/baldosa_native_second_racer_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_real_second_racer" \
            --video windows --timeout 180
          echo "PASS: actual native P1 Mike created isolated Andrew P2 with canonical typed/raw/catalog, retained active P1 selector, and a third real native game confirmed both seats and entered original 2P GO. No completed match, physical pads or original/native parity credit." >> "$GITHUB_STEP_SUMMARY"

      - name: Real pad-created P2 survives explicit interrupted-catalog recovery
        run: |
          set -euo pipefail
          # Same pinned Windows source guest and production P1 pad handler:
          # two genuine first-time frontend creations, a CI-only lost-row
          # fault cut, an explicit third-game catalog-only recovery, and
          # fourth-game original 2P source GO. No invented result or player.
          python tools/baldosa_native_second_racer_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_second_racer_interrupted_p2" \
            --recover-interrupted-catalog \
            --video windows --timeout 220
          echo "PASS: real UI-created Mike/Martin, test-only missing P2 catalog row, real P1 controller recovery and next-process original 2P GO. No OS power-loss, physical pad or settled result credit." >> "$GITHUB_STEP_SUMMARY"

      - name: Native shared Quick Practice enters original source-qualified Dragster
        run: |
          set -euo pipefail
          # P1 real controller handler: Down -> A -> A. No script inputs to
          # original racer/tour/track/GO menus; shared QuickPracticeLaunch
          # must drive those through existing stock input queue and see the
          # exact decoded original course 1 before human guest handoff.
          python tools/baldosa_native_practice_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_source_practice_dragster" \
            --video windows --timeout 220
          echo "PASS: actual P1 native Quick Practice enters source-verified Dragster 1P GO without external original-menu input scripts. One course only; no physical pad or 45-course gate credit." >> "$GITHUB_STEP_SUMMARY"

      - name: Native P1 gamepad-created P1 and P2 earn original 2P and both fresh Records
        run: |
          set -euo pipefail
          # Actual Win32 native P1 gamepad handler receives X/A to create
          # Mike, then X/Down/A to create Martin. Original stock 2P guest
          # picker/drive is unchanged. The existing source result observer
          # publishes the only earned pair; next-process native gamepad UI
          # switches to Martin for independent fresh Records readback.
          python tools/baldosa_native_player_created_2p_records_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_player_created_2p_records" \
            --video windows --timeout 220
          echo "PASS: P1 semantic gamepad created Mike/Martin, exact original 2P source earned one paired match, and both fresh native Records passed. The *CI-only* raw .urrun/.urmatch, canonical typed/raw 8KiB profile bytes and SHA manifest are retained for independent QA; no ROM, real user files or release qualification is included. Physical pads and complete original/native parity remain unaccepted." >> "$GITHUB_STEP_SUMMARY"

      - name: Native first-racer creation through genuine earned 1P Records in three separate games
        run: |
          set -euo pipefail
          # Reuse the same exact pinned Windows AOT PE, stock controls,
          # existing profile codec and observer. NO synthetic results or
          # fresh-user profile fixture may substitute for the real new user.
          python tools/baldosa_native_first_racer_real_run_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_first_racer_earned_records" \
            --video windows --timeout 180
          echo "PASS: empty Modern root -> explicit first named racer -> fresh game genuine source-observed 1P Race -> one earned .urrun -> third native game reopens exact Records. Synthetic SDL/guest inputs; original/native strict parity, packaged no-args relaunch and physical pads remain independent QA gaps." >> "$GITHUB_STEP_SUMMARY"

      - name: Native controller selects existing P1 both directions across cold game processes
        run: |
          set -euo pipefail
          # Both profiles were created by native root. Test ONLY the
          # production locked next-boot selector and actual source SRAM boot.
          python tools/baldosa_native_existing_p1_ui_probe.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --fixture "baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/UR Baldosa Win32 Pause Route/native_existing_p1_switch" \
            --video windows --timeout 180
          echo "PASS: native Modern X/A switches the full verified existing profile selector Mike to Andrew and back only for next launch; fresh source guest boots each stock 8KiB rider. No manufactured guest result, physical gamepad QA or original/native complete-event parity." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble verified ROM-free Baldosa Modern Windows candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baldosa-native-romless"
          python tools/assemble_baldosa_windows_candidate.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --out "$RUNNER_TEMP/baldosa-native-romless/UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip" \
            --revision "$GITHUB_SHA"
          cd "$RUNNER_TEMP/baldosa-native-romless"
          sha256sum UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip > UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip.sha256
          test -s UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip.sha256
          echo "PASS: deterministic ROM-free Baldosa Windows candidate created from the same executable that passed native PE, clean-machine import and 1P/2P player-journey QA. Contains no ROM, SRAM or user state. Candidate only, not a completed remaster." >> "$GITHUB_STEP_SUMMARY"

      - name: Prove extracted CMD launcher, ROM gates and isolated user SRAM
        run: |
          set -euo pipefail
          python tools/verify_baldosa_windows_extracted_launcher.py \
            --zip "$RUNNER_TEMP/baldosa-native-romless/UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/Baldosa Native Extracted Launcher QA" \
            --timeout 80
          echo "PASS: actual ROM-free ZIP extracted on Windows; double-click CMD rejects missing/wrong ROM and package-local/relative saves, accepts valid personal ROM, opens shared Modern root and saves exact native SRAM outside extracted executable directory. No ROM or saved data uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain ROM-free Windows candidate only (no ROM or SRAM)
        uses: actions/upload-artifact@v4
        with:
          name: baldosa-modern-windows-x64-romless-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/baldosa-native-romless/UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip
            ${{ runner.temp }}/baldosa-native-romless/UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip.sha256

      - name: Retain bounded Windows guest evidence (never ROM or saves)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baldosa-win32-native-pause-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/Baldosa Native Extracted Launcher QA/launcher-acceptance.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/report.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_1p_records/report.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_1p_records/played_native_event/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_1p_records/fresh_game_records/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_2p_records/report.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_2p_records/played_native_2p/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_2p_records/fresh_game_2p_records/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_first_racer/report.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_first_racer_andrew/report.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_second_racer/report.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/report.json
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/ci-owned-raw-artifacts/**
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/first_P1_mike/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/named_P1_adds_P2/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/played_native_2p/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/mike_ui_selects_martin/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/fresh_mike_records/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/fresh_martin_records/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_second_racer/first_P1_mike/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_second_racer/named_P1_adds_P2/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_real_second_racer/fresh_two_seat_source_go/log.txt
            ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_first_racer_andrew/first_anonymous_process/log.txt

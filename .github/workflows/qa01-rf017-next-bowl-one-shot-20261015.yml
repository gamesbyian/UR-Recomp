name: QA-01 temporary integrated RF-017 authentic next Bowl source test

# SINGLE RESEARCH EXECUTION, delete before close. No CPU/runtime changes.
on:
  pull_request:
    paths:
      - .github/workflows/qa01-rf017-next-bowl-one-shot-20261015.yml
      - .github/workflows/qa01-event-campaign.yml
      - tools/probe_original_event_complete.py
      - tests/unit/test_qa01_zoo_next_bowl.py

permissions:
  contents: read

concurrency:
  group: qa01-rf017-next-bowl-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corrected-source-next-bowl:
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      source_followthrough: true
      zoo_next_bowl: true
      baldosa_refresh_beam_rate: true
      baldosa_io_clock_order: true
      zoo_terminal_phase: true
      qa01_cold_guest_reload: false
      qa01_apu_phase: false

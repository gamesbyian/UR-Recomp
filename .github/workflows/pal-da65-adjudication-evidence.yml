name: One-shot PAL da65 adjudication

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/run_pal_da65_adjudication.py"
      - "tests/unit/test_run_pal_da65_adjudication.py"
      - ".github/workflows/pal-da65-adjudication-evidence.yml"
  workflow_dispatch:

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Build vendored da65
        run: |
          make -C third_party/src/cc65-da65/src da65 -j2
          test -x third_party/src/cc65-da65/bin/da65
      - name: Run bounded da65 probes
        run: |
          python3 tools/run_pal_da65_adjudication.py --da65 third_party/src/cc65-da65/bin/da65
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_run_pal_da65_adjudication -v
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/pal-da65-adjudication.json analysis/generated/pal-da65-adjudication.md
          git diff --cached --quiet || git commit -m "analysis: record PAL da65 adjudication"
          git push origin HEAD:${{ github.head_ref }}

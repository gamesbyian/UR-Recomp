<title id="title">Uniracers reconstructed separated front-face wordmark</title>
<desc id="desc">Editable nine individually closed and separated vector glyphs, recovered from the illustrated three-dimensional Uniracers logo. Front face contours rather than bevel or extruded side silhouettes; gentle rectification applied to the entire set.</desc>
<metadata>Source: user-provided 1424 by 1055 illustration, November 7 2026. Manual cubic-Bezier reconstruction of the implied pre-bevel outer front-face letter geometry; hidden sections reconstructed; letter-level spacing is editable. This is an interpretive first-pass reconstruction and is not a mathematically calibrated camera inverse.</metadata>

name: airborne rotation native/reference differential

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "rom_identity.txt"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "third_party/src/snes9x-libretro/**"
      - "third_party/manifest.json"
      - "tests/input/race-rotation-left.script"
      - "tests/input/race-rotation-right.script"
      - "tests/input/race-rotation-control.script"
      - "tests/input/race-zflip-x.script"
      - "tools/summarize_player_checkpoints.py"
      - "tools/summarize_usjo8_checkpoints.py"
      - "tests/test_summarize_usjo8_checkpoints.py"
      - "tools/summarize_paired_player_slots.py"
      - "tools/compare_wram_checkpoints.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain.json"
      - ".github/workflows/race-rotation-differential.yml"
  push:
    paths:
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "rom_identity.txt"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "third_party/src/snes9x-libretro/**"
      - "third_party/manifest.json"
      - "tests/input/race-rotation-left.script"
      - "tests/input/race-rotation-right.script"
      - "tests/input/race-rotation-control.script"
      - "tests/input/race-zflip-x.script"
      - "tools/summarize_player_checkpoints.py"
      - "tools/summarize_usjo8_checkpoints.py"
      - "tests/test_summarize_usjo8_checkpoints.py"
      - "tools/summarize_paired_player_slots.py"
      - "tools/compare_wram_checkpoints.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain.json"
      - ".github/workflows/race-rotation-differential.yml"

concurrency:
  group: race-rotation-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Test USJO checkpoint summarizer
        run: python3 tests/test_summarize_usjo8_checkpoints.py

      - name: Stage and build repository-owned SNESRecomp framework
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          test -x .tools/src/snesrecomp/build-snesref/snesref

      - name: Build native target
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --no-submodules \
            --generate \
            --no-build
          PROJ="$ROOT/UniracersSNESRecomp"
          cmake -S "$PROJ" -B "$PROJ/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF
          cmake --build "$PROJ/build" -j2
          test -x "$PROJ/build/UniracersSNESRecomp"

      - name: Build pinned Snes9x reference core
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2

      - name: Run native rotation intervention and control
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for kind in left right control x; do
            if [ "$kind" = x ]; then
              SCRIPT="$GITHUB_WORKSPACE/tests/input/race-zflip-x.script"
            else
              SCRIPT="$GITHUB_WORKSPACE/tests/input/race-rotation-${kind}.script"
            fi
            DUMPS="$RUNNER_TEMP/native-rotation-${kind}-dumps"
            LOG="$RUNNER_TEMP/native-rotation-${kind}.log"
            mkdir -p "$DUMPS"
            SNESRECOMP_DUMP_DIR="$DUMPS" SDL_AUDIODRIVER=dummy \
              timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$LOG" 2>&1
            cat "$LOG"
            test -s "$DUMPS/rotation-settle.wram.bin"
          done

      - name: Run reference rotation intervention and control
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for kind in left right control x; do
            if [ "$kind" = x ]; then
              SCRIPT="$GITHUB_WORKSPACE/tests/input/race-zflip-x.script"
            else
              SCRIPT="$GITHUB_WORKSPACE/tests/input/race-rotation-${kind}.script"
            fi
            DUMPS="$RUNNER_TEMP/reference-rotation-${kind}-dumps"
            LOG="$RUNNER_TEMP/reference-rotation-${kind}.log"
            mkdir -p "$DUMPS"
            SNESREF_HEADLESS=1 \
            SNESREF_FAST=1 \
            SNESREF_WRAM_FILL=0 \
            SNESREF_SCRIPT="$SCRIPT" \
            SNESREF_DUMP_DIR="$DUMPS" \
              "$EXE" "$CORE" "$ROM" >"$LOG" 2>&1
            cat "$LOG"
            test -s "$DUMPS/rotation-settle.wram.bin"
          done

      - name: Summarize rotation semantics
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINTS=(
            --checkpoint accel-180
            --checkpoint rotation-pre
            --checkpoint rotation-input-008
            --checkpoint rotation-post-008
            --checkpoint rotation-post-016
            --checkpoint rotation-release-016
            --checkpoint rotation-settle
          )
          for engine in native reference; do
            for kind in left right control x; do
              python3 tools/summarize_player_checkpoints.py \
                "$RUNNER_TEMP/${engine}-rotation-${kind}-dumps" \
                "${CHECKPOINTS[@]}" \
                --json-out "$RUNNER_TEMP/${engine}-rotation-${kind}-state.json" \
                | tee "$RUNNER_TEMP/${engine}-rotation-${kind}-state.txt"
            done
          done

          python3 - \
            "$RUNNER_TEMP/native-rotation-left-state.json" "$RUNNER_TEMP/reference-rotation-left-state.json" \
            "$RUNNER_TEMP/native-rotation-right-state.json" "$RUNNER_TEMP/reference-rotation-right-state.json" \
            "$RUNNER_TEMP/native-rotation-control-state.json" "$RUNNER_TEMP/reference-rotation-control-state.json" \
            "$RUNNER_TEMP/native-rotation-x-state.json" "$RUNNER_TEMP/reference-rotation-x-state.json" <<'PY'
          import json, pathlib, sys
          nl, rl, nr, rr, nc, rc, nx, rx=[json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          fields=["x_pos","y_pos","x_speed","y_speed","air_effective","pitch_effective"]
          for label,a,b in (
              ("left native/reference",nl,rl),
              ("right native/reference",nr,rr),
              ("control native/reference",nc,rc),
              ("X native/reference",nx,rx),
          ):
              print("==",label,"==")
              for cp in a:
                  diff={k:(a[cp][k],b[cp][k]) for k in fields if a[cp][k]!=b[cp][k]}
                  print(cp, "MATCH" if not diff else diff)
                  if diff:
                      raise SystemExit(1)
          for label,a in (("L",nl),("R",nr),("X",nx)):
              print(f"== native {label} causal semantic deltas ==")
              for cp in a:
                  diff={k:(a[cp][k],nc[cp][k]) for k in fields if a[cp][k]!=nc[cp][k]}
                  print(cp, diff or "IDENTICAL")
          PY

      - name: Probe recovered USJO v8 RAM semantics
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINTS=(
            --checkpoint accel-180
            --checkpoint rotation-pre
            --checkpoint rotation-input-008
            --checkpoint rotation-post-008
            --checkpoint rotation-post-016
            --checkpoint rotation-release-016
            --checkpoint rotation-settle
          )
          for engine in native reference; do
            for kind in left right control x; do
              python3 tools/summarize_usjo8_checkpoints.py \
                "$RUNNER_TEMP/${engine}-rotation-${kind}-dumps" \
                "${CHECKPOINTS[@]}" \
                --json-out "$RUNNER_TEMP/${engine}-rotation-${kind}-usjo8.json" \
                | tee "$RUNNER_TEMP/${engine}-rotation-${kind}-usjo8.txt"
            done
          done

          python3 - \
            "$RUNNER_TEMP/native-rotation-left-usjo8.json" "$RUNNER_TEMP/reference-rotation-left-usjo8.json" \
            "$RUNNER_TEMP/native-rotation-right-usjo8.json" "$RUNNER_TEMP/reference-rotation-right-usjo8.json" \
            "$RUNNER_TEMP/native-rotation-control-usjo8.json" "$RUNNER_TEMP/reference-rotation-control-usjo8.json" \
            "$RUNNER_TEMP/native-rotation-x-usjo8.json" "$RUNNER_TEMP/reference-rotation-x-usjo8.json" <<'PY'
          import json, pathlib, sys
          nl, rl, nr, rr, nc, rc, nx, rx=[json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          for label,a,b in (
              ("left native/reference", nl, rl),
              ("right native/reference", nr, rr),
              ("control native/reference", nc, rc),
              ("X native/reference", nx, rx),
          ):
              for cp in a:
                  if a[cp] != b[cp]:
                      raise SystemExit(f"{label} USJO mismatch at {cp}: native={a[cp]} reference={b[cp]}")
          for label,a in (("left",nl),("right",nr),("x",nx)):
              print(f"== USJO {label} vs control ==")
              for cp,row in a.items():
                  delta={k:(row[k],nc[cp][k]) for k in row if row[k] != nc[cp][k]}
                  print(cp, delta or "IDENTICAL")
          PY

      - name: Compare airborne interventions against matched control
        shell: bash
        run: |
          set -euo pipefail
          for engine in native reference; do
            for kind in left right x; do
              python3 tools/compare_wram_checkpoints.py \
                "$RUNNER_TEMP/${engine}-rotation-${kind}-dumps" "$RUNNER_TEMP/${engine}-rotation-control-dumps" \
                --label-a "${kind}" --label-b jump-only --limit 100 \
                --checkpoint rotation-pre \
                --checkpoint rotation-input-008 \
                --checkpoint rotation-post-008 \
                --checkpoint rotation-post-016 \
                --checkpoint rotation-release-016 \
                --checkpoint rotation-settle \
                --json-out "$RUNNER_TEMP/${engine}-rotation-${kind}-effect.json" \
                | tee "$RUNNER_TEMP/${engine}-rotation-${kind}-effect.txt"
            done
          done

      - name: Upload rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-airborne-rotation
          path: |
            ${{ runner.temp }}/native-rotation-*.log
            ${{ runner.temp }}/reference-rotation-*.log
            ${{ runner.temp }}/native-rotation-*-state.json
            ${{ runner.temp }}/reference-rotation-*-state.json
            ${{ runner.temp }}/native-rotation-*-state.txt
            ${{ runner.temp }}/reference-rotation-*-state.txt
            ${{ runner.temp }}/native-rotation-*-usjo8.json
            ${{ runner.temp }}/reference-rotation-*-usjo8.json
            ${{ runner.temp }}/native-rotation-*-usjo8.txt
            ${{ runner.temp }}/reference-rotation-*-usjo8.txt
            ${{ runner.temp }}/native-rotation-*-effect.json
            ${{ runner.temp }}/reference-rotation-*-effect.json
            ${{ runner.temp }}/native-rotation-*-effect.txt
            ${{ runner.temp }}/reference-rotation-*-effect.txt
            ${{ runner.temp }}/native-rotation-*-dumps/
            ${{ runner.temp }}/reference-rotation-*-dumps/
          if-no-files-found: warn
          retention-days: 7

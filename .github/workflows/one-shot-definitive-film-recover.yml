name: One-shot publish inspected definitive film from immutable CI artifact
on:
  push:
    branches: [media/definitive-trailer-assembly-20261010]
    paths: [.github/workflows/one-shot-definitive-film-recover.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: ur-final-film-artifact-recovery
  cancel-in-progress: false
jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact media from successful source-locked render stage
        uses: actions/download-artifact@v4
        with:
          name: ur-definitive-recruitment-media-review
          run-id: 38108580268
          github-token: ${{ github.token }}
          path: media/showcase/2026-10-10/recruitment/definitive-film/
      - name: Install decode-only verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Assert unchanged render hashes and independently decode output review witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('media/showcase/2026-10-10/recruitment/definitive-film')
          src=json.loads((root/'definitive-trailer-provenance.json').read_text())
          assert src['schema']=='UR-RECRUITMENT-FINAL-MEDIA/1'
          assert src['film_duration_seconds']==58 and src['fps']=='60/1'
          assert src['editorial_splices_not_continuous_title_to_race']
          assert src['technical_art_segments_are_editorial_not_in_game_graphics']
          assert not src['remastered_widescreen_claim'] and not src['finished_beta_claim'] and not src['continuous_4k_claim']
          assert len(src['timeline'])==9 and sum(x['frame_count'] for x in src['timeline'])==3480
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          expected={
           'ur-recomp-definitive-recruitment-58s-1080p.mp4':((1920,1080),3480,[90,510,1020,1390,1860,2160,2530,3000,3420]),
           'ur-recomp-recruitment-vertical-20s-1080x1920.mp4':((1080,1920),1200,[90,420,690,990,1160])
          }
          witnesses={}
          for file,(size,frames,ordinals) in expected.items():
            video=root/file
            assert sha(video)==src['output_sha256'][file],file
            stream=json.loads(subprocess.check_output(['ffprobe','-v','error',
              '-count_frames','-select_streams','v:0','-show_entries',
              'stream=width,height,r_frame_rate,nb_read_frames','-of','json',
              str(video)]))['streams'][0]
            assert (stream['width'],stream['height'],stream['r_frame_rate'],int(stream['nb_read_frames']))==(*size,'60/1',frames),(file,stream)
            for ordinal in ordinals:
              name=file.removesuffix('.mp4')+f'-frame-{ordinal:04d}.png'
              target=root/name
              subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
                 '-i',str(video),'-vf',f'select=eq(n\\,{ordinal})','-vsync','vfr',
                 '-frames:v','1',str(target)],check=True)
              with Image.open(target) as im:
                assert im.size==size, (target,im.size)
                im.verify()
              assert target.stat().st_size>1024, (name,target.stat().st_size)
              witnesses[name]=sha(target)
          poster=root/'ur-recomp-recruitment-final-poster.png'
          assert sha(poster)==src['output_sha256'][poster.name]
          with Image.open(poster) as im:
             assert im.size==(1920,1080)
             im.verify()
          (root/'render-review-provenance.json').write_text(json.dumps({
            'schema':'UR-RECRUITMENT-INDEPENDENT-DECODED-OUTPUT-WITNESSES/1',
            'review_images_sha256':witnesses,
            'source_manifest_sha256':sha(root/'definitive-trailer-provenance.json'),
            'status':'source_checked_pending_independent_final_screening',
            'media_only':True},sort_keys=True,indent=2)+'\n')
          print('PASS: 58s 3480 frames, portrait 20s 1200 frames, source poster,',len(witnesses),'independent decoded frame receipts')
          PY
      - name: Retain inspected render candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-definitive-recruitment-accepted-video-candidate
          path: media/showcase/2026-10-10/recruitment/definitive-film/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit exact binary outputs and retire BOTH one-shot jobs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/2026-10-10/recruitment/definitive-film/
          git rm -f .github/workflows/one-shot-definitive-film-encode.yml
          git rm -f .github/workflows/one-shot-definitive-film-recover.yml
          git commit -m "media: publish source-checked definitive master, vertical short, poster, 14 independently decoded witnesses"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: QA-02/03 real-process recovery cohort

# Manual research/QA; actual process deaths, filesystem faults and restoration.
# This is not complete guest gameplay, independent emulator or hardware proof.
on:
  workflow_dispatch:
    inputs:
      iterations_per_scenario:
        description: "Fresh separate-process journeys per scenario (five scenarios)"
        type: choice
        required: true
        default: "100"
        options: ["10", "100", "500"]
      seed:
        description: "Deterministic bounded fault-boundary jitter seed"
        required: true
        default: "20261011"

  workflow_call:
    inputs:
      iterations_per_scenario:
        description: "Bounded per-shard repeat count for manual parent campaign"
        required: true
        type: string
      seed:
        description: "Immutable parent-selected seed"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa02-process-recovery-cohort-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      binary_sha256: ${{ steps.digest.outputs.binary_sha256 }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate campaign contracts before compiling
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/unit -p test_qa02_recovery_campaign.py
      - name: Compile existing production fault fixture once
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa02_recovery_campaign.py build \
            --exe "$RUNNER_TEMP/recovery-binary/qa02-fixture-hardkill"
      - name: Bind immutable binary identity
        id: digest
        run: |
          set -euo pipefail
          digest=$(sha256sum "$RUNNER_TEMP/recovery-binary/qa02-fixture-hardkill" | cut -d' ' -f1)
          echo "binary_sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### QA-02/03 process recovery cohort"
            echo "Source revision: $GITHUB_SHA"
            echo "Compiled production fixture SHA-256: $digest"
            echo "Neither the Windows ZIP nor original/native gameplay/hardware is exercised."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish one reusable producer executable
        uses: actions/upload-artifact@v4
        with:
          name: qa02-store-fixture-shared-binary
          path: ${{ runner.temp }}/recovery-binary/
          retention-days: 7
          if-no-files-found: error

  scenarios:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { suite: c09-orphan, index: 0 }
          - { suite: c14-c15-receipt, index: 1 }
          - { suite: qa03-midseries, index: 2 }
          - { suite: hardkill-owner, index: 3 }
          - { suite: c16-storage-outage, index: 4 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact shared store executable
        uses: actions/download-artifact@v4
        with:
          name: qa02-store-fixture-shared-binary
          path: ${{ runner.temp }}/recovery-binary/
      - name: Repeat real OS-process faults against isolated user-data roots
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations_per_scenario }}
          SEED: ${{ inputs.seed }}
          SUITE: ${{ matrix.suite }}
          SUITE_INDEX: ${{ matrix.index }}
          BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SEED" =~ ^[0-9]{1,8}$ ]] || { echo "Invalid bounded seed"; exit 2; }
          [[ "$ITERATIONS" = 10 || "$ITERATIONS" = 100 || "$ITERATIONS" = 500 ]] || exit 2
          chmod +x "$RUNNER_TEMP/recovery-binary/qa02-fixture-hardkill"
          python3 tools/qa02_recovery_campaign.py run \
            --exe "$RUNNER_TEMP/recovery-binary/qa02-fixture-hardkill" \
            --source-sha "$GITHUB_SHA" --binary-sha "$BINARY_SHA256" \
            --suite "$SUITE" --iterations "$ITERATIONS" \
            --seed "$((SEED + SUITE_INDEX * 1009))" \
            --work "$RUNNER_TEMP/recovery-work" \
            --out "$RUNNER_TEMP/recovery-result/result.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("### "+d["suite"]+"\n\n"+str(d["passed_iterations"])+"/"+str(d["requested_iterations"])+" passed; "+str(d["failed_iterations"])+" failed.")' "$RUNNER_TEMP/recovery-result/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Always publish compact result, never user-data roots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa02-recovery-${{ matrix.suite }}
          path: ${{ runner.temp }}/recovery-result/result.json
          retention-days: 14
          if-no-files-found: warn

  aggregate:
    needs: [build, scenarios]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download actual cohort receipts (including partial runs)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: qa02-recovery-*
          path: ${{ runner.temp }}/recovery-receipts/
          merge-multiple: false
      - name: Reject missing results, false passes, impossible counts or stale binary
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations_per_scenario }}
          SEED: ${{ inputs.seed }}
          BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-receipts"
          python3 tools/qa02_recovery_campaign.py aggregate \
            --results-dir "$RUNNER_TEMP/recovery-receipts" \
            --source-sha "$GITHUB_SHA" --binary-sha "$BINARY_SHA256" \
            --iterations "$ITERATIONS" --seed "$SEED" \
            --out "$RUNNER_TEMP/recovery-aggregate/result.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Always retain final machine-readable cohort result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa02-recovery-aggregate
          path: ${{ runner.temp }}/recovery-aggregate/result.json
          retention-days: 14
          if-no-files-found: warn

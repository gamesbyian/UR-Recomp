name: Agent control and recovery contract

on:
  pull_request:
    paths:
      - "docs/HOURLY-AGENT-LINES.md"
      - "docs/recovery/agent-candidates.json"
      - "docs/recovery/publication-incidents.json"
      - "docs/operations/main-history-custody.json"
      - ".github/workflows/agent-control-contract.yml"
  workflow_dispatch:
    inputs:
      live_preflight:
        description: "Opt-in read-only live PR/CI/release preflight (no CI or QA dispatch)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: agent-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Reject ambiguous ownership and false recovery acceptance
        run: |
          python3 -m unittest -v tests.unit.test_agent_control tests.unit.test_validate_history_custody tests.unit.test_ops_live_status tests.unit.test_validate_publication_incidents
          python3 tools/validate_history_custody.py
          python3 tools/agent_control.py --check
          python3 tools/validate_publication_incidents.py
      - name: Bounded control-plane summary
        if: success()
        run: python3 tools/agent_control.py >> "$GITHUB_STEP_SUMMARY"
      - name: Live read-only release preflight (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_preflight == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/agent_release_control.py --live --lane release-qa --gate QA-04 \
            --json-out "$RUNNER_TEMP/agent-live-preflight.json" \
            --markdown-out "$RUNNER_TEMP/agent-live-preflight.md"
          cat "$RUNNER_TEMP/agent-live-preflight.md" >> "$GITHUB_STEP_SUMMARY"

name: One-shot October 19 flagship portrait visual polish
on:
  push:
    branches: [media/oct19-flagship-recruitment-film]
    paths: [.github/workflows/one-shot-oct19-flagship-social-ambient.yml]
permissions:
  contents: write
concurrency:
  group: ur-oct19-flagship-portrait-ambient
  cancel-in-progress: false
jobs:
  upscale-social-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install lightweight video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          python3 -m py_compile tools/showcase/upgrade_flagship_vertical_20261019.py
      - name: Preserve original source, design animated blurred editorial ambience
        run: |
          python3 tools/showcase/upgrade_flagship_vertical_20261019.py \
            --outdir media/showcase/2026-10-19/flagship
      - name: Independent hashes, source/content boundaries and selected frame evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageStat
          root=Path('media/showcase/2026-10-19/flagship')
          p=json.loads((root/'flagship-social-ambient-provenance.json').read_text())
          sha=lambda x:hashlib.sha256(Path(x).read_bytes()).hexdigest()
          assert p['source_sha256']==sha(root/p['source_name'])
          assert p['out_sha256']==sha(root/p['out_name'])
          assert p['visible_game_source_area_xywh']==[0,656,1080,608]
          assert p['editorial_blurred_matte'] and p['original_fitted_gameplay_geometry_preserved']
          assert not p['authentic_extra_world_pixels_claimed'] and not p['physical_4k_video_claimed']
          clip=root/p['out_name']
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-count_frames',
             '-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate,nb_read_frames',
             '-of','json',str(clip)]))['streams'][0]
          assert (d['width'],d['height'],d['r_frame_rate'],int(d['nb_read_frames']))==(1080,1920,'60/1',1620)
          ordinals=[30,180,540,840,1140,1480]
          expr='+'.join('eq(n\\,'+str(n)+')' for n in ordinals)
          temp=root/'ambient-review-%02d.png'
          subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
            '-i',str(clip),'-vf',f'select={expr}','-fps_mode','vfr','-frames:v',
            str(len(ordinals)),'-start_number','0',str(temp)],check=True)
          witnesses={}
          for i,ordinal in enumerate(ordinals):
            file=root/f'ambient-review-{i:02d}.png'
            assert file.exists()
            with Image.open(file) as im:
              assert im.size==(1080,1920)
              im.load()
              assert max(ImageStat.Stat(im.crop((0,656,1080,1264))).mean)>15
            with Image.open(file) as im:im.verify()
            witnesses[file.name]=sha(file)
          p['decoded_independent_frame_sha256']=witnesses
          p['review_status']='SHA/fps/frame/drawable and six independent decoded witnesses passed; visual screening still separate'
          (root/'flagship-social-ambient-provenance.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          print('SIX_SCREEN_WITNESSES_ACCEPTED',p['out_sha256'])
          PY
      - name: Preserve video review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-oct19-social-ambient-review
          path: media/showcase/2026-10-19/flagship/ambient-review-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish new portrait design and remove temporary job
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/2026-10-19/flagship/
          git rm -f .github/workflows/one-shot-oct19-flagship-social-ambient.yml
          git commit -m "media: publish inspected 27s ambient portrait and decoded witnesses; retire one-shot"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: +8 Widescreen composition matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/analyze_widescreen_composition_matrix.py"
      - ".github/workflows/widescreen-composition-matrix.yml"

concurrency:
  group: widescreen-composition-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Build diagnostic target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" --name "Uniracers" --players 2 --yes --no-ci \
            --no-fetch-boxart --no-recomp-ui --no-netplay --no-github \
            --no-submodules --generate --no-build
          PROJ="$ROOT/UniracersSNESRecomp"
          python3 tools/patch_widescreen_probe_host.py "$PROJ/src/main.c"
          cmake -S "$PROJ" -B "$PROJ/build" -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF
          cmake --build "$PROJ/build" -j2

      - name: Capture layer interaction matrix
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/object-activation-dragster-tail.script"
          ROOT="$RUNNER_TEMP/widescreen-composition-matrix"
          CONFIG="$RUNNER_TEMP/widescreen-matrix.ini"
          cat >"$CONFIG" <<'EOF'
          [Graphics]
          NewRenderer = 1
          NoSpriteLimits = 0
          [General]
          DisableFrameDelay = 1
          Autosave = 0
          SkipLauncher = 1
          [Sound]
          EnableAudio = 0
          EOF
          for mask in 16 17 18 19 20 21 22 23; do
            for margin in 0 8; do
              CASE="$ROOT/mask-$mask/margin-$margin"
              mkdir -p "$CASE/state" "$CASE/frames"
              SNESRECOMP_WS_EXTRA="$margin" \
              SNESRECOMP_LAYER_MASK="$mask" \
              SNESRECOMP_DUMP_DIR="$CASE/state" \
              SNESRECOMP_FRAMEDUMP_PIXELS=1 \
              SNESRECOMP_FRAMEDUMP_START=2888 \
              SNESRECOMP_FRAMEDUMP_END=2902 \
              SDL_AUDIODRIVER=dummy \
                timeout 210s xvfb-run -a "$EXE" "$ROM" --config "$CONFIG" \
                --no-launcher --script "$SCRIPT" --framedump "$CASE/frames" \
                >"$CASE/run.log" 2>&1
            done
          done

      - name: Analyze minimal reproducing layer set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          python3 tools/analyze_widescreen_composition_matrix.py \
            "$RUNNER_TEMP/widescreen-composition-matrix" \
            --json-out analysis/generated/widescreen-plus8-composition-matrix.json \
            --md-out analysis/generated/widescreen-plus8-composition-matrix.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("analysis/generated/widescreen-plus8-composition-matrix.json").read_text())
          if any(r["guest_frame_delta"] != -3 for r in d["rows"]):
              raise SystemExit("event-relative cadence changed")
          if 23 not in d["reproducing_masks_at_168"]:
              raise SystemExit("full race layer set no longer reproduces object-tail-168")
          print("minimal reproducing masks:", d["minimal_reproducing_masks_at_168"])
          PY

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-widescreen-composition-matrix
          path: |
            ${{ runner.temp }}/widescreen-composition-matrix/mask-*/margin-*/run.log
            analysis/generated/widescreen-plus8-composition-matrix.*
          if-no-files-found: warn
          retention-days: 5

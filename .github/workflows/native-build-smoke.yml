          # from the identical state, and the state it leaves for later steps.
          SAVES="$(dirname "$EXE")/saves"
          rm -rf "$RUNNER_TEMP/ws-saves-pre" "$RUNNER_TEMP/ws-saves-post"
          if [ -d "$SAVES" ]; then cp -a "$SAVES" "$RUNNER_TEMP/ws-saves-pre"; fi

name: QA-01 temporary actual 2014 Zoo to next Bowl entry

# Bounded PR-only source-original and native research. REMOVE before merge.
on:
  pull_request:
    paths:
      - .github/workflows/qa01-zoo-next-bowl-one-shot-20261015.yml
      - tools/probe_original_event_complete.py
      - tests/unit/test_qa01_zoo_next_bowl.py
      - .github/workflows/qa01-event-campaign.yml

permissions:
  contents: read

concurrency:
  group: qa01-source-next-bowl-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  next-source-bowl:
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      source_followthrough: true
      zoo_next_bowl: true
      baldosa_refresh_beam_rate: true
      zoo_terminal_phase: false
      qa01_apu_phase: false
      qa01_cold_guest_reload: false

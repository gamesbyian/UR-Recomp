name: Evaluate reduced da65 closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cc65-da65-closure-eval.yml"
      - "tools/evaluate_cc65_da65_closure.py"
      - "tests/unit/test_evaluate_cc65_da65_closure.py"

concurrency:
  group: cc65-da65-closure-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned cc65 revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/cc65/cc65.git "$RUNNER_TEMP/cc65"
          git -C "$RUNNER_TEMP/cc65" checkout d8a486acdef93ea1ba432a6a35b96cf1b797bda5
          test "$(git -C "$RUNNER_TEMP/cc65" rev-parse HEAD)" = d8a486acdef93ea1ba432a6a35b96cf1b797bda5

      - name: Build and measure reduced closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_cc65_da65_closure.py             "$RUNNER_TEMP/cc65"             "$RUNNER_TEMP/cc65-da65-closure"             --json-out "$RUNNER_TEMP/cc65-da65-closure.json"             --jobs 2             | tee "$RUNNER_TEMP/cc65-da65-closure.txt"

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cc65-da65-reduced-closure-evaluation
          path: |
            ${{ runner.temp }}/cc65-da65-closure.json
            ${{ runner.temp }}/cc65-da65-closure.txt
          retention-days: 7

name: One-shot vendor SNESRecomp analyzer Cargo closure

on:
  push:
    paths:
      - ".github/workflows/vendor-snesrecomp-analyzer-cargo-one-shot.yml"

permissions:
  contents: write

jobs:
  vendor:
    if: github.ref == 'refs/heads/chatgpt/snesrecomp-c4-analyzer-cargo-2026-09-29'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/snesrecomp-c4-analyzer-cargo-2026-09-29
          fetch-depth: 0

      - name: Stage exact repository-owned SNESRecomp archive
        run: python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only

      - name: Vendor locked analyzer crates
        shell: bash
        run: |
          set -euo pipefail
          CRATE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/recompiler-rs"
          DEST="$GITHUB_WORKSPACE/third_party/cargo/snesrecomp-analyzer/vendor"
          rm -rf "$GITHUB_WORKSPACE/third_party/cargo/snesrecomp-analyzer"
          mkdir -p "$DEST"
          cd "$CRATE"
          cargo vendor --locked --versioned-dirs "$DEST" > "$RUNNER_TEMP/cargo-config.txt"
          cp Cargo.lock "$GITHUB_WORKSPACE/third_party/cargo/snesrecomp-analyzer/Cargo.lock"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("third_party/cargo/snesrecomp-analyzer")
          vendor=root/"vendor"
          packages=sorted(p.name for p in vendor.iterdir() if p.is_dir())
          files=[p for p in vendor.rglob("*") if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          print("packages="+str(len(packages)))
          print("files="+str(len(files)))
          print("bytes="+str(total))
          print("\n".join(packages))
          (root/"VENDOR-METADATA.txt").write_text(
              f"packages={len(packages)}\nfiles={len(files)}\nbytes={total}\n"+
              "\n".join(packages)+"\n",
              encoding="utf-8")
          PY

      - name: Write repository-local Cargo source config
        shell: bash
        run: |
          set -euo pipefail
          cat > third_party/cargo/snesrecomp-analyzer/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "../vendor"

          [net]
          offline = true
          EOF

      - name: Prove isolated offline analyzer build
        shell: bash
        run: |
          set -euo pipefail
          CRATE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/recompiler-rs"
          mkdir -p "$CRATE/.cargo"
          cp third_party/cargo/snesrecomp-analyzer/config.toml "$CRATE/.cargo/config.toml"
          rm -rf "$CRATE/vendor"
          cp -a third_party/cargo/snesrecomp-analyzer/vendor "$CRATE/vendor"
          rm -rf "$CRATE/target"
          cd "$CRATE"
          CARGO_HOME="$RUNNER_TEMP/empty-cargo-home" CARGO_NET_OFFLINE=true \
            cargo build --locked --offline --release --bin snesrecomp-analyze
          test -x "$CRATE/target/release/snesrecomp-analyze"

      - name: Commit Cargo closure
        shell: bash
        run: |
          set -euo pipefail
          git add third_party/cargo/snesrecomp-analyzer
          git diff --cached --quiet && { echo "Cargo closure already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor: add SNESRecomp analyzer Cargo closure"
          git push origin HEAD:chatgpt/snesrecomp-c4-analyzer-cargo-2026-09-29

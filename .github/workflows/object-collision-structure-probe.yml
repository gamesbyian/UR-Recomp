name: Object collision structure probe
on:
  push:
    branches:
      - chatgpt/pal-subregion-survivor-refinement-2026-09-30
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/analyze_object_collision_structure_island.py
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/object-collision-structure-island.json analysis/generated/object-collision-structure-island.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record object collision structure island [skip ci]"
            git push
          fi

name: One-shot final video artifact recovery and visual QA
on:
  push:
    branches: [media/definitive-trailer-assembly-20261010]
    paths: [.github/workflows/one-shot-recruitment-final-recovery.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: ur-recruitment-final-recovery
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Synchronize currently accepted main source media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Recover exact previously encoded corrected title films
        uses: actions/download-artifact@v4
        with:
          run-id: 38110655383
          name: ur-recruitment-final-title-polish
          github-token: ${{ github.token }}
          path: media/showcase/2026-10-10/recruitment/definitive-film/
      - name: Install decode-only dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Regenerate HUD-safe poster and verify all 16 independent decoded frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess,os
          from pathlib import Path
          from PIL import Image,ImageStat
          root=Path('media/showcase/2026-10-10/recruitment/definitive-film')
          mpath=root/'definitive-trailer-provenance.json'
          x=json.loads(mpath.read_text())
          assert x['schema']=='UR-RECRUITMENT-FINAL-MEDIA/1'
          assert x['film_duration_seconds']==58 and x['fps']=='60/1'
          assert len(x['timeline'])==9 and sum(y['frame_count'] for y in x['timeline'])==3480
          assert x['editorial_splices_not_continuous_title_to_race']
          assert x['technical_art_segments_are_editorial_not_in_game_graphics']
          assert not x['remastered_widescreen_claim'] and not x['finished_beta_claim'] and not x['continuous_4k_claim']
          title=x['original_title_internal_edit']
          assert title['horizontal_source_ordinals']==[[270,359],[420,569]]
          assert title['vertical_source_ordinals']==[[270,359],[420,449]]
          assert not title['faked_gameplay_frames']
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          film=root/'ur-recomp-definitive-recruitment-58s-1080p.mp4'
          portrait=root/'ur-recomp-recruitment-vertical-20s-1080x1920.mp4'
          for f in (film,portrait):
            assert sha(f)==x['output_sha256'][f.name],(f,sha(f),x['output_sha256'][f.name])
          poster=root/'ur-recomp-recruitment-final-poster.png'
          subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
            '-ss','48','-i',str(film),'-vf',
            "scale=1700:956:flags=neighbor,pad=1920:1080:110:62:0x091421,"
            "drawtext=text='UNIRACERS RECOMP':fontsize=48:fontcolor=white:"
            "x=(w-text_w)/2:y=5,"
            "drawtext=text='REAL NATIVE GAMEPLAY - HELP BUILD WHAT COMES NEXT':"
            "fontsize=27:fontcolor=white:x=(w-text_w)/2:y=1040",
            '-frames:v','1',str(poster)],check=True)
          with Image.open(poster) as im:
            assert im.size==(1920,1080)
            im.load()
            assert max(ImageStat.Stat(im.crop((0,0,1920,62))).mean)>12
            assert max(ImageStat.Stat(im.crop((0,1018,1920,1080))).mean)>12
          with Image.open(poster) as im: im.verify()
          x['output_sha256'][poster.name]=sha(poster)
          x['poster_hud_policy']="Editorial typography on separate top/bottom margins, gameplay fully visible between"
          mpath.write_text(json.dumps(x,sort_keys=True,indent=2)+'\n')
          # Recompute output witnesses directly from the final encoded movies.
          for junk in root.glob('*-frame-*.png'): junk.unlink()
          for junk in root.glob('*.sample-*.png'): junk.unlink()
          cuts={
            film.name: ((1920,1080),3480,[15,90,150,510,1020,1390,1860,2160,2530,3000,3420]),
            portrait.name: ((1080,1920),1200,[15,90,105,420,690,990,1160])
          }
          receipts={}
          for file,(dimensions,framecount,ordinals) in cuts.items():
            movie=root/file
            d=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-count_frames','-select_streams','v:0','-show_entries',
              'stream=width,height,r_frame_rate,nb_read_frames','-of','json',str(movie)
            ]))['streams'][0]
            assert (d['width'],d['height'],d['r_frame_rate'],int(d['nb_read_frames']))==(*dimensions,'60/1',framecount), (file,d)
            exp='+'.join(f'eq(n\\,{n})' for n in ordinals)
            temp=root/(file+'.recovery-%02d.png')
            subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
              '-i',str(movie),'-vf',f'select={exp}','-vsync','vfr','-frames:v',str(len(ordinals)),
              '-start_number','0',str(temp)],check=True)
            for i,n in enumerate(ordinals):
              a=root/(file+f'.recovery-{i:02d}.png')
              b=root/(file.removesuffix('.mp4')+f'-frame-{n:04d}.png')
              assert a.exists(),(file,n)
              os.replace(a,b)
              with Image.open(b) as im:
                assert im.size==dimensions
                im.load()
                if n in (15,90,150) and file==film.name:
                  region=im.crop((210,50,1700,990))
                  assert max(ImageStat.Stat(region).mean)>20,('black horizontal title or menu',n)
                if n in (15,90,105) and file==portrait.name:
                  region=im.crop((100,656,980,1264))
                  assert max(ImageStat.Stat(region).mean)>20,('black vertical title or menu',n)
              with Image.open(b) as im: im.verify()
              assert b.stat().st_size>1024
              receipts[b.name]=sha(b)
          review=root/'render-review-provenance.json'
          review.write_text(json.dumps({
            'schema':'UR-RECRUITMENT-INDEPENDENT-DECODED-OUTPUT-WITNESSES/1',
            'review_images_sha256':receipts,
            'source_manifest_sha256':sha(mpath),
            'exact_frame_numbers_verified':True,
            'visible_title_and_menu_first_four_seconds':True,
            'visible_title_and_menu_first_two_seconds_portrait':True,
            'status':'source_checked_pending_final_visual_screening',
            'model_or_human_visual_screening':'pending',
            'media_only':True
          },sort_keys=True,indent=2)+'\n')
          print('PASS: immutable 58s and 20s video SHAs, 18 decoded frames, nonblack authentic title/menu source segments, HUD-safe poster')
          print('VIDEO_SHA256',x['output_sha256'])
          PY
      - name: Upload exact output and source evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-recruitment-final-verified-candidate
          path: media/showcase/2026-10-10/recruitment/definitive-film/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish audited media and remove both completed one-shot jobs
        run: |
          set -euo pipefail
          git add media/showcase/2026-10-10/recruitment/definitive-film/
          git rm -f .github/workflows/one-shot-recruitment-title-polish.yml
          git rm -f .github/workflows/one-shot-recruitment-final-recovery.yml
          git commit -m "media: publish verified vivid-title master, vertical short and HUD-safe poster"
          git push origin "HEAD:${GITHUB_REF_NAME}"

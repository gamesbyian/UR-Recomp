          # authoritative player composition state; keep whole-frame pixel
          # equality strict for every aligned witness.
          python3 tools/check_racer_hd_wide_visual_parity.py \
            --original-dir "$RUNNER_TEMP/racer-wide-original-frames" \
            --original-log "$RUNNER_TEMP/racer-wide-original.log" \
            --hd-dir "$RUNNER_TEMP/racer-wide-hd-frames" \
            --hd-log "$RUNNER_TEMP/racer-wide-hd.log" \
            --json-out "$RUNNER_TEMP/racer-wide-parity.json" \
            | tee "$RUNNER_TEMP/racer-wide-parity.txt"


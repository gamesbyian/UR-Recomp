name: Windows Modern Restart audio proof

on:
  pull_request:
    paths:
      - ".github/workflows/windows-modern-restart-audio-probe.yml"
      - "tools/capture_modern_restart_audio.py"
      - "tools/capture_unpaused_race_audio_control.py"
      - "tools/summarize_audio_restart_keymap_ab.py"
      - "tests/unit/test_audio_restart_keymap_ab.py"
      - "tests/unit/test_capture_unpaused_race_audio_control.py"
      - "tools/capture_modern_paused_audio.py"
      - "tests/unit/test_capture_modern_restart_audio.py"
      - "tests/input/audio-modern-restart.script"
      - "docs/AUDIO-MODERN-RESTART-PROBE.md"
  workflow_dispatch:

# Audio-only evidence; never rebuild game or compete with Windows packaging.
concurrency:
  group: windows-modern-restart-audio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  packaged-restart-audio:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select already successful first-party main Windows package
        id: source-package
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "windows-native-smoke.yml",
              branch: "main", status: "success", per_page: 10
            });
            const source = data.workflow_runs.find(run =>
              run.conclusion === "success" &&
              run.head_branch === "main" &&
              run.head_repository?.full_name === owner + "/" + repo
            );
            if (!source) {
              core.setFailed("No successful first-party main Windows source package");
            } else {
              core.setOutput("run_id", String(source.id));
              core.info("Using verified main package from " + source.id);
            }

      - name: Download verified portable package; no game recompilation
        uses: actions/download-artifact@v4
        with:
          name: ur-recomp-windows-x64-portable
          repository: ${{ github.repository }}
          run-id: ${{ steps.source-package.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audio-source

      - name: Prove packaged real Win32 Down/Enter Restart restores stereo
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/audio-source/UR-Recomp-Windows-x64.zip"
          EXTRACT="$RUNNER_TEMP/audio-restart-package"
          python tools/assemble_windows_package.py verify-archive --archive "$ARCHIVE"
          python -m zipfile -e "$ARCHIVE" "$EXTRACT"
          PACKAGE="$EXTRACT/UR-Recomp-Windows-x64"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"

          LOG="$RUNNER_TEMP/audio-modern-restart-native.log"
          PCM="$RUNNER_TEMP/audio-modern-restart-device.raw"
          ROOT="$RUNNER_TEMP/audio-modern-restart-user"
          OUT="$RUNNER_TEMP/audio-modern-restart-proof.json"
          STATS="$RUNNER_TEMP/audio-modern-restart-queue-stats.txt"
          STATS_WIN="$(cygpath -w "$STATS")"
          LAUNCHER_WIN="$(cygpath -w "$PACKAGE/run-uniracers.cmd")"
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tests/input/audio-modern-restart.script")"
          LOG_WIN="$(cygpath -w "$LOG")"
          PCM_WIN="$(cygpath -w "$PCM")"
          ROOT_WIN="$(cygpath -w "$ROOT")"
          rm -rf "$ROOT" "$PCM"
          mkdir -p "$ROOT"
          trap 'rm -f "$PCM"' EXIT
          set +e
          SDL_VIDEO_DRIVER=windows \
          SDL_VIDEODRIVER=windows \
          SDL_AUDIO_DRIVER=disk \
          SDL_AUDIO_DISK_OUTPUT_FILE="$PCM_WIN" \
          SDL_AUDIO_FORMAT=S16LE \
          SDL_AUDIO_CHANNELS=2 \
          SDL_AUDIO_FREQUENCY=44100 \
          SDL_AUDIO_DISK_TIMESCALE=1.0 \
          UR_PRODUCT_DIAGNOSTICS=1 \
          SNESRECOMP_AUDIO_STATS="$STATS_WIN" \
          UR_PAUSE_OPEN_ACCEPTANCE=1 \
          UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
            python -m tools.capture_modern_restart_audio \
              "$LAUNCHER_WIN" "$SCRIPT_WIN" "$LOG_WIN" "$PCM_WIN" \
              --json-out "$OUT"
          AUDIO_RC=$?
          set -e
          # Retain real Release APU and SDL callback counters even if Restart
          # playback is silent. The analysis is independent of the PCM gate.
          if test -s "$STATS"; then
            python tools/analyze_snesrecomp_audio_stats.py "$STATS" \
              --json-out "$RUNNER_TEMP/audio-modern-restart-queue.json"
          fi
          if test "$AUDIO_RC" -ne 0; then
            echo "WINDOWS_MODERN_RESTART_AUDIO FAIL rc=$AUDIO_RC (diagnostic evidence retained)"
            exit "$AUDIO_RC"
          fi
          python tools/analyze_sdl_disk_audio.py "$LOG_WIN" "$PCM_WIN" \
            --min-duration-seconds 15 \
            --min-channel-rms 50 \
            --tail-seconds 1.0 --min-tail-rms 50 --min-tail-channel-rms 50 \
            --json-out "$RUNNER_TEMP/audio-modern-restart-whole-output.json"
          test -s "$OUT"
          echo "WINDOWS_REAL_MODERN_RESTART_AUDIO PASS"
          rm -f "$PCM"

      - name: Capture independent uninterrupted 1P race audio control
        if: always()
        run: |
          set -euo pipefail
          # The failed Restart test itself deliberately remains red. Keep
          # this independent control to distinguish normal race music decay
          # from a rollback-generated silent DSP stream.
          PACKAGE="$RUNNER_TEMP/audio-restart-package/UR-Recomp-Windows-x64"
          if ! test -f "$PACKAGE/run-uniracers.cmd"; then
            echo "Audio control unavailable: packaged game not extracted"
            exit 1
          fi
          LOG="$RUNNER_TEMP/audio-unpaused-control-native.log"
          PCM="$RUNNER_TEMP/audio-unpaused-control-device.raw"
          ROOT="$RUNNER_TEMP/audio-unpaused-control-user"
          OUT="$RUNNER_TEMP/audio-unpaused-control-report.json"
          mkdir -p "$ROOT"
          trap 'rm -f "$PCM"' EXIT
          LAUNCHER_WIN="$(cygpath -w "$PACKAGE/run-uniracers.cmd")"
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tests/input/audio-modern-restart.script")"
          LOG_WIN="$(cygpath -w "$LOG")"
          PCM_WIN="$(cygpath -w "$PCM")"
          ROOT_WIN="$(cygpath -w "$ROOT")"
          SDL_VIDEO_DRIVER=windows \
          SDL_VIDEODRIVER=windows \
          SDL_AUDIO_DRIVER=disk \
          SDL_AUDIO_DISK_OUTPUT_FILE="$PCM_WIN" \
          SDL_AUDIO_FORMAT=S16LE \
          SDL_AUDIO_CHANNELS=2 \
          SDL_AUDIO_FREQUENCY=44100 \
          SDL_AUDIO_DISK_TIMESCALE=1.0 \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
            python -m tools.capture_unpaused_race_audio_control \
              "$LAUNCHER_WIN" "$SCRIPT_WIN" "$LOG_WIN" "$PCM_WIN" \
              --json-out "$OUT"
          rm -f "$PCM"

      - name: Diagnose possible stock guest Start key leakage after Modern Restart
        if: always()
        run: |
          set -euo pipefail
          # Hypothesis: Return is the framework's default guest SNES Start
          # key *and* the Modern Restart confirm key. Test the SAME packaged
          # executable and unchanged guest script with only the DISPOSABLE
          # framework user-root keybinds.ini Start mapping changed. No global
          # keybind/product/frontend edits; actual menu Return stays Return.
          PACKAGE="$RUNNER_TEMP/audio-restart-package/UR-Recomp-Windows-x64"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"
          LAUNCHER_WIN="$(cygpath -w "$PACKAGE/run-uniracers.cmd")"
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tests/input/audio-modern-restart.script")"
          # Interleave matched pairs to reduce confounding from runner load
          # or execution order: Return-1/None-1, Return-2/None-2, etc.
          for I in 1 2 3; do
            for ARM in start-return start-unbound; do
              START_KEY=Return
              if test "$ARM" = start-unbound; then START_KEY=None; fi
              ROOT="$RUNNER_TEMP/restart-keymap-user-$ARM-$I"
              PCM="$RUNNER_TEMP/restart-keymap-$ARM-$I.raw"
              LOG="$RUNNER_TEMP/restart-keymap-$ARM-$I.log"
              OUT="$RUNNER_TEMP/restart-keymap-$ARM-$I.json"
              rm -rf "$ROOT" "$PCM"
              mkdir -p "$ROOT"
              if test "$START_KEY" = None; then
                printf '[player1]\nstart = None\n[player2]\nstart = None\n' >"$ROOT/keybinds.ini"
              else
                printf '[player1]\nstart = Return\n[player2]\nstart = Return\n' >"$ROOT/keybinds.ini"
              fi
              grep -Eq "^start = $START_KEY$" "$ROOT/keybinds.ini"
              ROOT_WIN="$(cygpath -w "$ROOT")"
              PCM_WIN="$(cygpath -w "$PCM")"
              LOG_WIN="$(cygpath -w "$LOG")"
              set +e
              SDL_VIDEO_DRIVER=windows \
              SDL_VIDEODRIVER=windows \
              SDL_AUDIO_DRIVER=disk \
              SDL_AUDIO_DISK_OUTPUT_FILE="$PCM_WIN" \
              SDL_AUDIO_FORMAT=S16LE \
              SDL_AUDIO_CHANNELS=2 \
              SDL_AUDIO_FREQUENCY=44100 \
              SDL_AUDIO_DISK_TIMESCALE=1.0 \
              UR_PRODUCT_DIAGNOSTICS=1 \
              UR_PAUSE_OPEN_ACCEPTANCE=1 \
              UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
                python -m tools.capture_modern_restart_audio \
                  "$LAUNCHER_WIN" "$SCRIPT_WIN" "$LOG_WIN" "$PCM_WIN" \
                  --json-out "$OUT"
              RC=$?
              set -e
              rm -f "$PCM"
              # A silent Restart is expected diagnostic evidence, not
              # a valid reason to skip the other A/B trial processes.
              # Unrelated errors or a missing verified report remain fatal.
              test -s "$OUT"
              # Explicitly prove this *particular* Windows process loaded the
              # disposable keymap from its selected root, not an exe-local
              # default. Otherwise the two arms would not be a valid A/B.
              grep -Fq "[Keybinds] Loaded keybinds.ini" "$LOG"
              grep -Fq "Config/saves anchored to user data '$ROOT_WIN'" "$LOG"
              if test "$RC" -eq 0; then
                echo "RESTART_KEYMAP_TRIAL arm=$ARM index=$I audible=1"
              else
                echo "RESTART_KEYMAP_TRIAL arm=$ARM index=$I recovery_not_confirmed=1"
              fi
            done
          done
          python -m tools.summarize_audio_restart_keymap_ab "$RUNNER_TEMP" \
            --json-out "$RUNNER_TEMP/restart-keymap-comparison.json"
          echo "WINDOWS_RESTART_GUEST_START_KEY_AB PASS source=real_packaged_sdl3 descriptive=1"

      - name: Retain bounded audio provenance without copyrighted PCM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-restart-audio-evidence
          path: |
            ${{ runner.temp }}/audio-modern-restart-native.log
            ${{ runner.temp }}/audio-modern-restart-proof.json
            ${{ runner.temp }}/audio-modern-restart-whole-output.json
            ${{ runner.temp }}/audio-modern-restart-queue-stats.txt
            ${{ runner.temp }}/audio-modern-restart-queue.json
            ${{ runner.temp }}/audio-unpaused-control-native.log
            ${{ runner.temp }}/audio-unpaused-control-report.json
            ${{ runner.temp }}/restart-keymap-*.log
            ${{ runner.temp }}/restart-keymap-*.json
          if-no-files-found: warn
          retention-days: 5

name: WRAM motion lineage refresh

on:
  push:
    branches:
      - chatgpt/pal-subregion-survivor-refinement-2026-09-30

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WRAM motion atlas
        run: python3 tools/build_wram_motion_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: wram-motion-atlas
          path: |
            analysis/generated/wram-motion-atlas.json
            analysis/generated/wram-motion-atlas.md
          if-no-files-found: error

name: RF089 original pinned compile (one shot)
# Retry after original C compile caught literal escaped newlines in injected helper.
on:
  push:
    branches:
      - agent1/ur-cpu-cause-rf089-original-echo-20261027
    paths:
      - .github/workflows/qa01-rf089-original-compile-once.yml
permissions:
  contents: read
jobs:
  pinned-original-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Stage RF083/RF089 and compile pinned original Snes9x
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests/unit -p test_qa01_rf083_original_sound_dp_first_writer.py -v
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          CORE_SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          test -s "$CORE_SRC/cpuexec.cpp"
          python3 tools/qa01_rf083_original_sound_dp_first_writer.py --root "$CORE_SRC"
          grep -Fq 'rf089_z0=(unsigned)(ICPU._Zero==0)' "$CORE_SRC/cpuexec.cpp"
          grep -Fq 'QA01RF089ORIG seq=' "$CORE_SRC/cpuexec.cpp"
          make -C "$CORE_SRC/libretro" clean
          make -C "$CORE_SRC/libretro" -j2
          test -s "$CORE_SRC/libretro/snes9x_libretro.so"
          mkdir -p "$RUNNER_TEMP/rf089"
          sha256sum "$CORE_SRC/cpuexec.cpp" > "$RUNNER_TEMP/rf089/patched-original-cpuexec-sha256.txt"
          sha256sum "$CORE_SRC/libretro/snes9x_libretro.so" > "$RUNNER_TEMP/rf089/original-core-sha256.txt"
          printf 'source=%s\nRF083+RF089 compiled; no ROM executed, no parity or release acceptance.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/rf089/README.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: qa01-rf089-pinned-original-compile-receipt
          path: ${{ runner.temp }}/rf089/
          if-no-files-found: error
          retention-days: 14

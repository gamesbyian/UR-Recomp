      - "tests/unit/test_baldosa_native_options_probe.py"
      - "tests/unit/test_baldosa_modern_options_spike.py"
      - "native/product/baldosa_native_options.hpp"
      - "tests/native/baldosa_native_options_test.cpp"
      - "tests/unit/test_baldosa_native_options_cpp.py"
      - "tools/baldosa_native_modern_root.cpp"
      - "tools/baldosa_modern_profile_activation.cpp"
      - "tools/baldosa_modern_profile_native_fixture.cpp"
      - "tests/native/baldosa_modern_profile_activation_test.cpp"
      - "tests/unit/test_baldosa_modern_profile_activation_spike.py"
      - "tools/check_windows_portable_binary.py"
      - "tools/check_windows_pe_timestamp.py"
      - "tests/unit/test_check_windows_pe_timestamp.py"
      - "tools/assemble_baldosa_windows_candidate.py"
      - "tools/bind_baldosa_candidate_receipt.py"
      - "tests/unit/test_bind_baldosa_candidate_receipt.py"
      - "tools/audit_baldosa_romless_candidate.py"
      - "tools/verify_baldosa_windows_extracted_launcher.py"
      - "tests/unit/test_assemble_baldosa_windows_candidate.py"
      - "tests/unit/test_audit_baldosa_romless_candidate.py"
      - "native/product/modern_session_c_api.*"
      - "native/product/modern_session_runtime.*"
      - "native/product/session_runtime_adapter.*"
      - "native/product/baldosa_modern_session_binding.hpp"

      # These first-party units are injected directly by the pinned Baldosa
      # CMake stage into the actual Windows game/QA fixture. Keep this exact
      # invalidation closure aligned with the existing staging adapters; a
      # changed source/header must not inherit an unrelated green Windows ZIP.
      - "native/presentation/racer_guest_snapshot.*"
      - "native/presentation/racer_replacement_selector.*"
      - "native/product/baldosa_execution_backend.hpp"
      - "native/product/baldosa_guest_result_observer.*"

name: One-shot Europe semantic edge evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/verify_europe_semantic_edges.py"
      - "tests/unit/test_verify_europe_semantic_edges.py"
      - ".github/workflows/europe-semantic-edges-evidence.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Run edge discriminators
        run: python3 tools/verify_europe_semantic_edges.py
      - name: Regenerate cross-build correspondence
        run: python3 tools/build_cross_build_symbol_correspondence.py
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_verify_europe_semantic_edges -v
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/europe-hud-finish-discriminators.json analysis/generated/europe-hud-finish-discriminators.md analysis/generated/cross-build-symbol-correspondence.json analysis/generated/cross-build-symbol-correspondence.md
          git diff --cached --quiet || git commit -m "analysis: record Europe semantic edge evidence"
          git push origin HEAD:${{ github.head_ref }}

name: One-shot empty-subscreen color-math A/B

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/patches/snes9x-empty-subscreen-backdrop-experiment.patch"
      - "tools/compare_framebuffers.py"
      - ".github/workflows/color-math-fallback-ab.yml"

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build baseline reference stack
        run: |
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/baseline"
          mkdir -p "$D"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script" \
          SNESREF_DUMP_DIR="$D" \
            "$RUNNER_TEMP/snesref-build/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"

      - name: Apply historical fallback perturbation and rebuild
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          PATCH="$GITHUB_WORKSPACE/tools/patches/snes9x-empty-subscreen-backdrop-experiment.patch"
          git -C "$SRC" apply --check "$PATCH"
          git -C "$SRC" apply "$PATCH"
          make -C "$SRC/libretro" clean
          make -C "$SRC/libretro" -j2

      - name: Capture backdrop-fallback variant
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/backdrop"
          mkdir -p "$D"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script" \
          SNESREF_DUMP_DIR="$D" \
            "$RUNNER_TEMP/snesref-build/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"

      - name: Reduce framebuffer differences
        run: |
          python3 tools/compare_framebuffers.py \
            "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/backdrop" \
            --json-out color-math-fallback-ab.json
          cat color-math-fallback-ab.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-math-fallback-ab
          path: |
            color-math-fallback-ab.json
            ${{ runner.temp }}/baseline/*.fb.bgrx
            ${{ runner.temp }}/backdrop/*.fb.bgrx
          retention-days: 7

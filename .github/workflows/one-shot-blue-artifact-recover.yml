name: One-shot blue edit artifact recovery without reencode
on:
  push:
    branches: [media/blue-art-direction-recruitment-20261020]
    paths: [.github/workflows/one-shot-blue-artifact-recover.yml]
permissions:
  actions: read
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: ur-blue-trailer-review
          run-id: 39379993935
          github-token: ${{ github.token }}
          path: media/showcase/2026-10-20/blue-cut/
      - name: Validate exact previously accepted manifests
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("media/showcase/2026-10-20/blue-cut")
          x=json.loads((root/"flagship-provenance.json").read_text())
          assert x["total_horizontal_frames"]==4500
          assert x["total_vertical_frames"]==1380
          assert all(s["source"]!="modern" for s in x["horizontal_shots"])
          assert len(list(root.glob("*-frame-*.png")))==16
          for name,sha in x["output_sha256"].items():
              p=root/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
          print("ACCEPTED_RENDER_RECOVERED",x["output_sha256"])
          PY
      - name: Publish media on current branch and remove one-shot workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/2026-10-20/blue-cut/
          git rm -f .github/workflows/one-shot-blue-recruitment.yml
          git rm -f .github/workflows/one-shot-blue-artifact-recover.yml
          git diff --cached --check
          git commit -m "media: publish 75s blue box-art editorial trailer and 23s short without redundant encode"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

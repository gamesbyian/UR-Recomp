name: Windows native build and boot smoke

# Windows x64 is the primary consumer target (docs/PLATFORM-TARGETS.md). This
# gate proves that the same repository-owned framework stage, patch stack,
# generation path and modern product host build on Windows against the
# canonical SDL3 backend (repository-owned SDL 3.4.10 source, no download),
# then boots the canonical ROM to the main menu and replays the race-result
# route headlessly. The Visual Studio ClangCL toolset is used because the
# framework relies on GCC/Clang attributes that MSVC's cl.exe rejects.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/archives/SDL3-3.4.10.tar.gz"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/patches/snesrecomp-title-input-filter.patch"
      - "tools/patches/snesrecomp-source-gamepad-hook.patch"
      - "tools/patches/snesrecomp-user-data-root.patch"
      - "tools/patches/snesrecomp-user-data-launcher-assets.patch"
      - "tools/patches/snesrecomp-mod-state-root.patch"
      - "tools/patches/snesrecomp-user-rom-cache.patch"
      - "tools/patches/snesrecomp-user-netplay-identity.patch"
      - "tools/patches/snesrecomp-paused-overlay-present.patch"
      - "tools/patches/snesrecomp-host-frame-hold.patch"
      - "tools/toolchain-entries/sdl3.json"
      - "tools/patch_modern_product_host.py"
      - "tools/assemble_windows_package.py"
      - "tools/Test-URRecompPortable.ps1"
      - "tools/check_windows_portable_binary.py"
      - "tools/verify_rom.py"
      - "tools/check_result_screen_time.py"
      - "tests/input/ui-race-result-route.script"
      - "tests/unit/test_assemble_windows_package.py"
      - "tests/unit/test_windows_package_streaming_bounds.py"
      - "tests/unit/test_windows_clean_machine_verifier_policy.py"
      - "tests/unit/test_windows_portable_binary.py"
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "native/product/**"
      - "native/presentation/**"
      - "native/title/**"

concurrency:
  group: windows-native-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Project patches are hash-pinned; Windows Git's autocrlf would rewrite them.
      - name: Keep checkout bytes exact
        run: git config --global core.autocrlf false

      - name: Check out project
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical ROM and package contracts
        run: |
          python tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python -m unittest tests.unit.test_assemble_windows_package tests.unit.test_windows_package_streaming_bounds tests.unit.test_windows_portable_binary tests.unit.test_windows_clean_machine_verifier_policy

      - name: Stage repository-owned SNESRecomp framework
        run: |
          set -euo pipefail
          python tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          python tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only
          test -f .tools/src/sdl3/SDL3-3.4.10/CMakeLists.txt
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh
          test -f .tools/src/snesrecomp/runner/runner.cmake

      - name: Scaffold and generate
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-recomp-build"
          mkdir -p "$TMP"
          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --generate \
              --no-build
          ROOT="$TMP/UniracersSNESRecomp"
          python "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py" \
            "$ROOT/src/main.c" \
            --game-rtl "$ROOT/src/game_rtl.c" \
            --cmake "$ROOT/CMakeLists.txt"
          grep -q "ur_uniracers_product_after_run_frame" "$ROOT/src/main.c"
          grep -q "hardware_reset = &GameHardwareReset" "$ROOT/src/game_rtl.c"

      - name: Configure and build (Visual Studio, ClangCL, SDL3)
        run: |
          set -euo pipefail
          # CMake embeds these paths in generated scripts; backslashes in
          # D:\a\... would be parsed as escapes, so pass mixed (C:/...) form.
          WS="$(cygpath -m "$GITHUB_WORKSPACE")"
          FRAMEWORK="$WS/.tools/src/snesrecomp"
          ROOT="$(cygpath -m "$RUNNER_TEMP")/ur-recomp-build/UniracersSNESRecomp"
          cmake -S "$ROOT" -B "$ROOT/build" -G "Visual Studio 17 2022" -A x64 -T ClangCL \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DSNESRECOMP_SDL3_SOURCE_DIR="$WS/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" --config Release --parallel 4
          EXE="$(find "$ROOT/build" -name 'UniracersSNESRecomp.exe' -path '*Release*' | head -n1)"
          test -n "$EXE"
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          ls -la "$(dirname "$EXE")"

          # Portable-package runtime boundary: SDL is static, and the app must
          # not require a separately installed Visual C++ Redistributable.
          EXE_WIN="$(cygpath -w "$EXE")"
          export EXE_WIN
          powershell.exe -NoProfile -Command '
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -property installationPath
            if (-not $vs) { throw "Visual Studio installation not found" }
            $toolsRoot = Join-Path $vs "VC\Tools\MSVC"
            $tools = Get-ChildItem -LiteralPath $toolsRoot -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $tools) { throw "MSVC tools directory not found" }
            $dumpbin = Join-Path $tools.FullName "bin\Hostx64\x64\dumpbin.exe"
            if (-not (Test-Path -LiteralPath $dumpbin)) { throw "dumpbin.exe not found" }
            & $dumpbin /dependents $env:EXE_WIN
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ' | tee "$RUNNER_TEMP/windows-runtime-dependencies.log"
          if grep -Eiq '(MSVCP[0-9_]*|VCRUNTIME[0-9_]*)\.dll'               "$RUNNER_TEMP/windows-runtime-dependencies.log"; then
            echo "Portable executable unexpectedly depends on the Visual C++ Redistributable." >&2
            exit 1
          fi
          # A Visual Studio runner has DLLs a clean player machine does not.
          # Audit the final PE against an explicit Windows-inbox import policy.
          python tools/check_windows_portable_binary.py \
            --exe "$EXE" \
            --dependencies "$RUNNER_TEMP/windows-runtime-dependencies.log"

      - name: Assemble and verify portable Windows package
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/UR-Recomp-Windows-x64"
          python tools/assemble_windows_package.py assemble \
            --build-dir "$(dirname "$EXE")" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --output "$PACKAGE" \
            --source-revision "$GITHUB_SHA"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"
          python tools/verify_rom.py "$PACKAGE/Uniracers_USA.sfc"
          ARCHIVE="$RUNNER_TEMP/UR-Recomp-Windows-x64.zip"
          python tools/assemble_windows_package.py archive \
            --package "$PACKAGE" \
            --output "$ARCHIVE"
          python tools/assemble_windows_package.py verify-archive \
            --archive "$ARCHIVE"
          REPRO_ARCHIVE="$RUNNER_TEMP/UR-Recomp-Windows-x64-repro.zip"
          python tools/assemble_windows_package.py archive \
            --package "$PACKAGE" \
            --output "$REPRO_ARCHIVE"
          cmp "$ARCHIVE" "$REPRO_ARCHIVE"
          CHECKSUM="$ARCHIVE.sha256"
          python tools/assemble_windows_package.py checksum-archive \
            --archive "$ARCHIVE" \
            --output "$CHECKSUM"
          test -s "$CHECKSUM"
          python tools/assemble_windows_package.py verify-archive-checksum \
            --archive "$ARCHIVE" \
            --checksum "$CHECKSUM"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "PACKAGE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "PACKAGE_ARCHIVE_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          test -f "$PACKAGE/UniracersSNESRecomp.exe"
          test -f "$PACKAGE/Uniracers_USA.sfc"
          test -f "$PACKAGE/rom.cfg"
          test -f "$PACKAGE/run-uniracers.cmd"
          test -f "$PACKAGE/PACKAGE-MANIFEST.json"

      - name: Independently verify portable ZIP with stock Windows PowerShell
        run: |
          set -euo pipefail
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tools/Test-URRecompPortable.ps1")"
          ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          CHECKSUM_WIN="$(cygpath -w "$PACKAGE_ARCHIVE_CHECKSUM")"
          PROBE_WIN="$(cygpath -w "$RUNNER_TEMP/standalone windows verifier")"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "$SCRIPT_WIN" \
            -Archive "$ARCHIVE_WIN" \
            -Checksum "$CHECKSUM_WIN" \
            -Destination "$PROBE_WIN" \
            | tee "$RUNNER_TEMP/standalone-windows-verifier.log"
          grep -Fq "UR_PORTABLE_ARCHIVE_VERIFIED" "$RUNNER_TEMP/standalone-windows-verifier.log"
          grep -Fq "UR_PORTABLE_MANIFEST_VERIFIED" "$RUNNER_TEMP/standalone-windows-verifier.log"
          grep -Fq "UR_PORTABLE_CLEAN_MACHINE_PACKAGE_OK" "$RUNNER_TEMP/standalone-windows-verifier.log"
          # Deliver the exact tested standalone verifier with the ZIP pair.
          cp "$GITHUB_WORKSPACE/tools/Test-URRecompPortable.ps1" \
            "$RUNNER_TEMP/Test-URRecompPortable.ps1"

      - name: Clean-package boot and per-user state anchoring
        run: |
          set -euo pipefail
          DUMPS="$RUNNER_TEMP/package-boot-dumps"
          CALLER="$RUNNER_TEMP/package launch caller"
          EXTRACT="$RUNNER_TEMP/package extracted"
          USER_DATA="$RUNNER_TEMP/package user data"
          SCRIPT="$RUNNER_TEMP/package-boot.script"
          mkdir -p "$DUMPS" "$CALLER" "$EXTRACT"
          rm -rf "$USER_DATA"
          # Use Windows' native archive reader for actual ZIP distribution.
          PACKAGE_ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          EXTRACT_WIN="$(cygpath -w "$EXTRACT")"
          PACKAGE_ARCHIVE_WIN="$PACKAGE_ARCHIVE_WIN" EXTRACT_WIN="$EXTRACT_WIN" \
            powershell.exe -NoProfile -NonInteractive -Command \
              '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:PACKAGE_ARCHIVE_WIN -DestinationPath $env:EXTRACT_WIN -Force'
          TEST_PACKAGE="$EXTRACT/UR-Recomp-Windows-x64"
          echo "TEST_PACKAGE=$TEST_PACKAGE" >> "$GITHUB_ENV"
          echo "PACKAGE_USER_DATA=$USER_DATA" >> "$GITHUB_ENV"
          test -f "$TEST_PACKAGE/PACKAGE-MANIFEST.json"
          python tools/verify_rom.py "$TEST_PACKAGE/Uniracers_USA.sfc"
          printf 'until 009F == D7 3600\nwait 30\ndump package-main-menu\nquit\n' > "$SCRIPT"

          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          USER_DATA_WIN="$(cygpath -w "$USER_DATA")"
          SCRIPT_WIN="$(cygpath -w "$SCRIPT")"
          DUMPS_WIN="$(cygpath -w "$DUMPS")"

          set +e
          (
            cd "$CALLER"
            SDL_VIDEODRIVER=offscreen \
            SDL_AUDIODRIVER=dummy \
            SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
            UR_RECOMP_USER_DATA_ROOT="$USER_DATA_WIN" \
              timeout 300 powershell.exe -NoProfile -Command \
                "& '${PACKAGE_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
                >"$RUNNER_TEMP/package-boot.log" 2>&1
          )
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-boot.log"
          test "$RC" -eq 0

          python - "$DUMPS/package-main-menu.wram.bin" <<'PY'
          import pathlib, sys
          wram = pathlib.Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, f"packaged main menu not reached: $9F=0x{wram[0x9F]:02X}"
          print("WINDOWS_PACKAGE_BOOT_MAIN_MENU ok")
          PY

          test -f "$USER_DATA/config.ini"
          test -f "$USER_DATA/keybinds.ini"
          test -f "$USER_DATA/mod-state.toml"
          test -d "$USER_DATA/saves"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$TEST_PACKAGE/keybinds.ini"
          test ! -e "$TEST_PACKAGE/saves"
          test ! -e "$CALLER/config.ini"
          test ! -e "$CALLER/keybinds.ini"
          grep -Fq "Config/saves anchored to user data" "$RUNNER_TEMP/package-boot.log"
          grep -Fq "$USER_DATA_WIN" "$RUNNER_TEMP/package-boot.log"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"
          python tools/assemble_windows_package.py verify-archive \
            --archive "$PACKAGE_ARCHIVE"
          echo "WINDOWS_PACKAGE_USER_DATA_ANCHOR ok"

      - name: Real packaged game under CMD-special paths
        run: |
          set -euo pipefail
          # Invoke the exact shipped verifier in launch mode. It uses native
          # Expand-Archive internally and boots the actual product executable.
          # This catches path quoting failures that a harmless cmd stub cannot.
          SPECIAL_EXTRACT="$RUNNER_TEMP/package & bang! (installed)"
          SPECIAL_DUMPS="$RUNNER_TEMP/package-special-path-dumps"
          test ! -e "$SPECIAL_EXTRACT"
          mkdir -p "$SPECIAL_DUMPS"
          VERIFIER_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tools/Test-URRecompPortable.ps1")"
          ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          CHECKSUM_WIN="$(cygpath -w "$PACKAGE_ARCHIVE_CHECKSUM")"
          EXTRACT_WIN="$(cygpath -w "$SPECIAL_EXTRACT")"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          DUMPS_WIN="$(cygpath -w "$SPECIAL_DUMPS")"
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
            timeout 300 powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass \
              -File "$VERIFIER_WIN" -Archive "$ARCHIVE_WIN" \
              -Checksum "$CHECKSUM_WIN" -Destination "$EXTRACT_WIN" \
              -InputScript "$SCRIPT_WIN" \
              | tee "$RUNNER_TEMP/package-special-path-verifier.log"
          grep -Fq "UR_PORTABLE_REAL_WINDOWS_LAUNCH_EXITED_OK" "$RUNNER_TEMP/package-special-path-verifier.log"
          grep -Fq "UR_PORTABLE_CLEAN_MACHINE_PACKAGE_OK" "$RUNNER_TEMP/package-special-path-verifier.log"

          SPECIAL_PACKAGE="$SPECIAL_EXTRACT/UR-Recomp-Windows-x64"
          SPECIAL_USER="$SPECIAL_EXTRACT/isolated-user-data"
          SPECIAL_CALLER="$SPECIAL_EXTRACT/unrelated launch working directory"
          PACKAGE_WIN="$(cygpath -w "$SPECIAL_PACKAGE")"
          USER_WIN="$(cygpath -w "$SPECIAL_USER")"
          STARTUP_LOG="$SPECIAL_USER/diagnostics/startup.log"
          test -f "$STARTUP_LOG"
          grep -Fq "package_root=$PACKAGE_WIN" "$STARTUP_LOG"
          grep -Fq "user_data_root=$USER_WIN" "$STARTUP_LOG"
          grep -Fq "process_exit=0" "$STARTUP_LOG"
          test ! -e "$SPECIAL_CALLER/config.ini"
          test ! -e "$SPECIAL_CALLER/keybinds.ini"
          test ! -e "$SPECIAL_CALLER/saves"
          test ! -e "$SPECIAL_PACKAGE/config.ini"
          test ! -e "$SPECIAL_PACKAGE/saves"
          python - "$SPECIAL_DUMPS/package-main-menu.wram.bin" <<'PY'
          from pathlib import Path
          import sys
          wram = Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, "special-path packaged main menu not reached"
          print("WINDOWS_PACKAGE_SPECIAL_PATH_MAIN_MENU ok")
          PY
          python tools/assemble_windows_package.py verify --package "$SPECIAL_PACKAGE"
          echo "WINDOWS_PACKAGE_SPECIAL_PATH_ISOLATION ok"

      - name: Normal Windows APPDATA clean-user launch
        run: |
          set -euo pipefail
          # Exercise a player launch with NO explicit UR_RECOMP_USER_DATA_ROOT.
          # The normal profile Roaming root is authoritative for first boot.
          APPDATA_DIR="$RUNNER_TEMP/default player roaming data"
          DEFAULT_USER_DATA="$APPDATA_DIR/gamesbyian/UR-Recomp"
          DEFAULT_CALLER="$RUNNER_TEMP/default launch caller"
          DEFAULT_DUMPS="$RUNNER_TEMP/default appdata boot dumps"
          mkdir -p "$APPDATA_DIR" "$DEFAULT_CALLER" "$DEFAULT_DUMPS"
          test ! -e "$DEFAULT_USER_DATA"
          APPDATA_WIN="$(cygpath -w "$APPDATA_DIR")"
          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          DUMPS_WIN="$(cygpath -w "$DEFAULT_DUMPS")"
          DEFAULT_USER_WIN="$(cygpath -w "$DEFAULT_USER_DATA")"

          set +e
          (
            cd "$DEFAULT_CALLER"
            env -u UR_RECOMP_USER_DATA_ROOT \
              APPDATA="$APPDATA_WIN" \
              SDL_VIDEODRIVER=offscreen \
              SDL_AUDIODRIVER=dummy \
              SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
                timeout 300 powershell.exe -NoProfile -Command \
                  "& '${PACKAGE_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
                  >"$RUNNER_TEMP/package-default-appdata-boot.log" 2>&1
          )
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-default-appdata-boot.log"
          test "$RC" -eq 0
          python - "$DEFAULT_DUMPS/package-main-menu.wram.bin" <<'PY'
          import pathlib, sys
          wram = pathlib.Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, "default APPDATA packaged main menu not reached"
          print("WINDOWS_PACKAGE_DEFAULT_APPDATA_MAIN_MENU ok")
          PY
          test -f "$DEFAULT_USER_DATA/config.ini"
          test -f "$DEFAULT_USER_DATA/keybinds.ini"
          test -f "$DEFAULT_USER_DATA/mod-state.toml"
          test -d "$DEFAULT_USER_DATA/saves"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$TEST_PACKAGE/saves"
          test ! -e "$DEFAULT_CALLER/config.ini"
          grep -Fq "Config/saves anchored to user data" "$RUNNER_TEMP/package-default-appdata-boot.log"
          grep -Fq "$DEFAULT_USER_WIN" "$RUNNER_TEMP/package-default-appdata-boot.log"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"
          echo "WINDOWS_PACKAGE_DEFAULT_APPDATA_ROOT ok"

      - name: Extracted-package race-result acceptance
        run: |
          set -euo pipefail
          DUMPS="$RUNNER_TEMP/package-race-result-dumps"
          mkdir -p "$DUMPS"
          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          USER_DATA_WIN="$(cygpath -w "$PACKAGE_USER_DATA")"
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tests/input/ui-race-result-route.script")"
          DUMPS_WIN="$(cygpath -w "$DUMPS")"

          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
          UR_RECOMP_USER_DATA_ROOT="$USER_DATA_WIN" \
            timeout 600 powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-race-result.log" 2>&1
          RC=$?
          set -e
          tail -n 50 "$RUNNER_TEMP/package-race-result.log"
          test "$RC" -eq 0
          python tools/check_result_screen_time.py \
            --dump-dir "$DUMPS" \
            --checkpoint race-results
          grep -Fq "Config/saves anchored to user data" "$RUNNER_TEMP/package-race-result.log"
          grep -Fq "$USER_DATA_WIN" "$RUNNER_TEMP/package-race-result.log"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"
          echo "WINDOWS_PACKAGE_RACE_RESULT ok"

      - name: Extracted-package Win32 window and default renderer smoke
        run: |
          set -euo pipefail
          # Offscreen SDL boot validates deterministic game progress but never
          # enters Windows' actual window/render-device initialization path.
          # Use the same released ZIP payload, not the generated build tree.
          WIN32_DUMPS="$RUNNER_TEMP/package-win32-window-dumps"
          WIN32_USER="$RUNNER_TEMP/package win32 user data"
          WIN32_CALLER="$RUNNER_TEMP/package win32 launch caller"
          mkdir -p "$WIN32_DUMPS" "$WIN32_CALLER"
          rm -rf "$WIN32_USER"
          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          USER_WIN="$(cygpath -w "$WIN32_USER")"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          DUMPS_WIN="$(cygpath -w "$WIN32_DUMPS")"

          set +e
          (
            cd "$WIN32_CALLER"
            SDL_VIDEODRIVER=windows \
            SDL_AUDIODRIVER=dummy \
            SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
            UR_RECOMP_USER_DATA_ROOT="$USER_WIN" \
              timeout 300 powershell.exe -NoProfile -Command \
                "& '${PACKAGE_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
                >"$RUNNER_TEMP/package-win32-window.log" 2>&1
          )
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-win32-window.log"
          test "$RC" -eq 0
          python - "$WIN32_DUMPS/package-main-menu.wram.bin" <<'PY'
          import pathlib, sys
          wram = pathlib.Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, "packaged Win32 renderer main menu not reached"
          print("WINDOWS_PACKAGE_WIN32_RENDERER_MAIN_MENU ok")
          PY
          test -f "$WIN32_USER/config.ini"
          test -d "$WIN32_USER/saves"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$WIN32_CALLER/config.ini"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"
          echo "WINDOWS_PACKAGE_WIN32_RENDERER ok"

      - name: QA-09 packaged Windows controller-only root and modal return
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa09-root-user"
          printf 'seen-v1\n' > "$RUNNER_TEMP/qa09-root-welcome.seen"
          LAUNCHER_WIN="$(cygpath -w "$TEST_PACKAGE/run-uniracers.cmd")"
          ROOT_WIN="$(cygpath -w "$RUNNER_TEMP/qa09-root-user")"
          ONBOARDING_WIN="$(cygpath -w "$RUNNER_TEMP/qa09-root-welcome.seen")"
          LOG="$RUNNER_TEMP/qa09-root-win32.log"
          UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
          UR_ONBOARDING_STATE_PATH="$ONBOARDING_WIN" \
            python -m tools.qa09_windows_root_pad_probe \
              "$LAUNCHER_WIN" "$LOG"
          grep -q 'UR_MAIN_MENU_PAD_ACCEPTANCE PRESSED button=x step=0' "$LOG"
          grep -q 'UR_PROFILE_UI OPENED' "$LOG"
          grep -q 'UR_PRACTICE_PICKER CANCELLED' "$LOG"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"
          echo "WINDOWS_QA09_ROOT_PACKAGE=passed"

      - name: QA-05 packaged Windows default-Return Restart audio and Start-input witness
        run: |
          set -euo pipefail
          LAUNCHER_WIN="$(cygpath -w "$TEST_PACKAGE/run-uniracers.cmd")"
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tests/input/audio-modern-restart.script")"
          for attempt in 1 2 3 4 5; do
            ROOT="$RUNNER_TEMP/qa05-restart-user-$attempt"
            LOG="$RUNNER_TEMP/qa05-restart-$attempt.log"
            PCM="$RUNNER_TEMP/qa05-restart-$attempt.raw"
            JSON="$RUNNER_TEMP/qa05-restart-$attempt.json"
            mkdir -p "$ROOT"
            ROOT_WIN="$(cygpath -w "$ROOT")"
            LOG_WIN="$(cygpath -w "$LOG")"
            PCM_WIN="$(cygpath -w "$PCM")"
            JSON_WIN="$(cygpath -w "$JSON")"
            SDL_VIDEODRIVER=windows \
            SDL_AUDIO_DRIVER=disk \
            SDL_AUDIO_DISK_OUTPUT_FILE="$PCM_WIN" \
            SDL_AUDIO_FORMAT=S16LE \
            SDL_AUDIO_CHANNELS=2 \
            SDL_AUDIO_FREQUENCY=44100 \
            SDL_AUDIO_DISK_TIMESCALE=1.0 \
            UR_EXECUTION_MODE=modern \
            UR_PRODUCT_DIAGNOSTICS=1 \
            UR_PAUSE_OPEN_ACCEPTANCE=1 \
            UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
              python -m tools.capture_modern_restart_audio \
                "$LAUNCHER_WIN" "$SCRIPT_WIN" "$LOG_WIN" "$PCM_WIN" \
                --json-out "$JSON_WIN"
            python - "$LOG" "$JSON" <<'PY'
          import json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          evidence = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert evidence.get("recovery_confirmed") is True
          probes = re.findall(r"(?m)^UR_RESTART_INPUT raw=([0-9A-F]+) guest=([0-9A-F]+) return_held=([01]) release_waiting=([01])", log)
          assert probes, "default-Return Restart did not report a guest-word witness"
          for raw, guest, held, waiting in probes:
              if waiting == "1":
                  assert not (int(guest, 16) & 0x1000), "host confirmation leaked guest Start"
          print("UR_QA05_RESTART_GUEST_WORD=passed")
          PY
            rm -f "$PCM"
            echo "UR_QA05_RESTART_AUDIBLE_ATTEMPT=$attempt/5 passed"
          done
          echo "WINDOWS_QA05_DEFAULT_RETURN_AUDIO=5/5"

      - name: Package refresh preserves user data
        run: |
          set -euo pipefail
          test -f "$PACKAGE_USER_DATA/config.ini"
          test -f "$PACKAGE_USER_DATA/keybinds.ini"
          mkdir -p "$PACKAGE_USER_DATA/runs/default" "$PACKAGE_USER_DATA/multiplayer-runs" "$PACKAGE_USER_DATA/saves/profile-default"
          printf 'modern-settings-upgrade-marker\n' > "$PACKAGE_USER_DATA/host-state-v1.txt"
          printf 'profile-catalog-upgrade-marker\n' > "$PACKAGE_USER_DATA/profiles-v1.txt"
          printf 'profile-state-upgrade-marker\n' > "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt"

name: Native racer presentation acceptance

on:
  pull_request:
    paths:
      - "native/presentation/**"
      - "tools/apply_native_racer_presentation_probe.py"
      - "tools/summarize_racer_semantic_trace.py"
      - "tests/unit/test_apply_native_racer_presentation_probe.py"
      - "tests/unit/test_summarize_racer_semantic_trace.py"
      - "tests/native/racer_hd_presenter_test.cpp"
      - "tests/native/racer_replacement_selector_test.cpp"
      - "tests/native/racer_oam_placement_test.cpp"
      - "tests/input/two-player-first-race-observe.script"
      - "tests/input/two-player-first-race.input"
      - ".github/workflows/racer-native-presentation-acceptance.yml"

concurrency:
  group: racer-native-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Verify selector, placement, and orientation contracts
        shell: bash
        run: |
          set -euo pipefail
          CXX="${CXX:-c++}"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_replacement_selector_test.cpp             native/presentation/racer_replacement_selector.cpp             -o "$RUNNER_TEMP/racer-selector-test"
          "$RUNNER_TEMP/racer-selector-test"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_oam_placement_test.cpp             native/presentation/racer_oam_placement.cpp             -o "$RUNNER_TEMP/racer-oam-test"
          "$RUNNER_TEMP/racer-oam-test"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_hd_presenter_test.cpp             native/presentation/racer_replacement_selector.cpp             -o "$RUNNER_TEMP/racer-hd-presenter-test"
          "$RUNNER_TEMP/racer-hd-presenter-test"

      - name: Stage pinned SNESRecomp
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          # bootstrap_toolchain now applies the repository-owned patch stack
          # even for clone-only staging; do not apply input-file.patch twice.
          grep -F 'HostGetenv("INPUT_FILE")' "$FRAMEWORK/runner/src/desktop/host_main.c"

      - name: Scaffold and inject presentation probe
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/racer-presentation-acceptance"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay \
              --no-github --no-submodules --generate --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          python3 tools/apply_native_racer_presentation_probe.py "$ROOT"

          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF \
            -DUR_RECOMP_SOURCE_ROOT="$GITHUB_WORKSPACE"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Run Original and HD draw-frame acceptance routes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/racer-presentation-acceptance/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"
          INPUT="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"
          ORIGINAL_A_LOG="$RUNNER_TEMP/racer-original-a.log"
          ORIGINAL_B_LOG="$RUNNER_TEMP/racer-original-b.log"
          HD_LOG="$RUNNER_TEMP/racer-hd.log"
          ORIGINAL_A_DUMPS="$RUNNER_TEMP/racer-original-a-dumps"
          ORIGINAL_B_DUMPS="$RUNNER_TEMP/racer-original-b-dumps"
          HD_DUMPS="$RUNNER_TEMP/racer-hd-dumps"
          ORIGINAL_A_SHOT="$RUNNER_TEMP/racer-original-a-1220.ppm"
          ORIGINAL_B_SHOT="$RUNNER_TEMP/racer-original-b-1220.ppm"
          HD_SHOT="$RUNNER_TEMP/racer-hd-1220.ppm"
          mkdir -p "$ORIGINAL_A_DUMPS" "$ORIGINAL_B_DUMPS" "$HD_DUMPS"

          run_route() {
            local mode="$1" log="$2" dumps="$3" shot="$4"
            shift 4
            set +e
            env "$@" \
              SNESRECOMP_DUMP_DIR="$dumps" \
              SNESRECOMP_INPUT_FILE="$INPUT" \
              SNESRECOMP_SCREENSHOT="$shot" \
              SNESRECOMP_SCREENSHOT_FRAME=1220 \
              SDL_AUDIODRIVER=dummy \
              timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" >"$log" 2>&1
            local status=$?
            set -e
            cat "$log"
            if [ "$status" -ne 0 ]; then
              echo "::error::$mode native route exited with status $status"
              exit "$status"
            fi
          }

          run_route Original-A "$ORIGINAL_A_LOG" "$ORIGINAL_A_DUMPS" "$ORIGINAL_A_SHOT"
          run_route Original-B "$ORIGINAL_B_LOG" "$ORIGINAL_B_DUMPS" "$ORIGINAL_B_SHOT"
          run_route HD "$HD_LOG" "$HD_DUMPS" "$HD_SHOT" UR_RACER_HD=1

          for stem in original-a original-b hd; do
            python3 tools/summarize_racer_semantic_trace.py \
              "$RUNNER_TEMP/racer-$stem.log" \
              --json-out "$RUNNER_TEMP/racer-$stem-semantic-trace.json" \
              > "$RUNNER_TEMP/racer-$stem-semantic-trace.txt"
          done

          python3 - \
            "$RUNNER_TEMP/racer-original-a-semantic-trace.json" \
            "$RUNNER_TEMP/racer-original-b-semantic-trace.json" \
            "$RUNNER_TEMP/racer-hd-semantic-trace.json" <<'PY'
          import json, pathlib, sys
          reports = [json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          assert all(r["contiguous"] for r in reports)
          assert all(r["frame_window"] == [1180, 1620] for r in reports)
          assert all(r["frames_observed"] == 441 for r in reports)
          assert reports[0] == reports[1] == reports[2], (
              "Original/HD semantic timelines diverged"
          )
          for player in ("p1", "p2"):
              print(
                  "UR_RACER_SEMANTIC_TRACE PASS "
                  f"player={player} unique={len(reports[0]['players'][player]['unique_primary_ids'])} "
                  f"runs={len(reports[0]['players'][player]['runs'])} "
                  f"transitions={len(reports[0]['players'][player]['transitions'])}"
              )

          neighborhoods = {
              n["representation_id"]: n
              for n in reports[0]["registered_state_neighborhoods"]
          }
          expected = {
              "ordinary-racer-0x0541-p1-sync-reference": {
                  "hit_frames": [1220, 1470],
                  "previous_primary_counts": {"0x0541": 2},
                  "next_primary_counts": {"0x0542": 2},
              },
              "ordinary-racer-0x0540-p2-sync-reference": {
                  "hit_frames": [1220, 1470],
                  "previous_primary_counts": {"0x0540": 2},
                  "next_primary_counts": {"0x0540": 1, "0x057F": 1},
              },
              "ordinary-racer-0x057D-p1-adjacent-reference": {
                  "hit_frames": [1207, 1208, 1209, 1210, 1211, 1212, 1304, 1382, 1383, 1384],
                  "previous_primary_counts": {"0x057D": 9, "0x057E": 1},
                  "next_primary_counts": {"0x057D": 7, "0x057E": 3},
              },
              "ordinary-racer-0x0543-p2-adjacent-reference": {
                  "hit_frames": [1207, 1208, 1209, 1210, 1211, 1212, 1304, 1382, 1383, 1384],
                  "previous_primary_counts": {"0x0542": 2, "0x0543": 8},
                  "next_primary_counts": {"0x0543": 8, "0x0544": 2},
              },
              "ordinary-racer-0x057E-p1-sync-reference": {
                  "hit_frames": [1305, 1385, 1421],
                  "previous_primary_counts": {"0x057D": 2, "0x057F": 1},
                  "next_primary_counts": {"0x057D": 1, "0x057E": 2},
              },
              "ordinary-racer-0x0544-p2-sync-reference": {
                  "hit_frames": [1305, 1385, 1421],
                  "previous_primary_counts": {"0x0543": 2, "0x0544": 1},
                  "next_primary_counts": {"0x0543": 1, "0x0544": 2},
              },
          }
          for representation_id, wanted in expected.items():
              got = neighborhoods[representation_id]
              for key, value in wanted.items():
                  assert got[key] == value, (representation_id, key, got[key], value)
              print(
                  "UR_RACER_REGISTERED_NEIGHBORHOOD PASS "
                  f"representation={representation_id} hits={got['hit_frames']} "
                  f"before={got['previous_primary_counts']} "
                  f"after={got['next_primary_counts']}"
              )
          PY

          # Diagnose the fixture's own cross-process WRAM stability before
          # attributing any byte to presentation mode.
          python3 - \
            "$ORIGINAL_A_DUMPS/two-player-race-1220.wram.bin" \
            "$ORIGINAL_B_DUMPS/two-player-race-1220.wram.bin" \
            "$HD_DUMPS/two-player-race-1220.wram.bin" <<'PY'
          import pathlib
          import sys

          blobs = [pathlib.Path(p).read_bytes() for p in sys.argv[1:]]
          labels = ["original-a", "original-b", "hd"]
          if any(len(b) != len(blobs[0]) for b in blobs):
              raise SystemExit("WRAM checkpoint sizes differ")

          def diff(a, b):
              return [(i, x, y) for i, (x, y) in enumerate(zip(a, b)) if x != y]

          ab = diff(blobs[0], blobs[1])
          ah = diff(blobs[0], blobs[2])
          bh = diff(blobs[1], blobs[2])
          for name, rows in [("original-a_vs_b", ab), ("original-a_vs_hd", ah), ("original-b_vs_hd", bh)]:
              preview = ",".join(f"{i:04X}:{x:02X}>{y:02X}" for i, x, y in rows[:32])
              print(f"UR_RACER_WRAM_DIFF {name} count={len(rows)} first={preview or 'none'}")

          baseline_variable = {i for i, _, _ in ab}
          hd_on_stable = [
              (i, blobs[1][i], blobs[2][i])
              for i in range(len(blobs[0]))
              if i not in baseline_variable and blobs[1][i] != blobs[2][i]
          ]
          if hd_on_stable:
              preview = ",".join(
                  f"{i:04X}:{x:02X}>{y:02X}" for i, x, y in hd_on_stable[:32]
              )
              raise SystemExit(
                  "HD changed WRAM outside the disabled-control variability set: " + preview
              )

          import json
          schema = json.loads(
              pathlib.Path("analysis/data/state-schema.json").read_text()
          )
          semantic_diffs = []
          for entry in schema["entries"]:
              addr = entry.get("address", "")
              width = entry.get("width", "")
              if not addr.startswith("7E:"):
                  continue
              try:
                  off = int(addr[3:], 16)
              except ValueError:
                  continue
              n = 1 if width.startswith("8-bit") else 2 if width.startswith(("16-bit", "signed 16-bit")) else 0
              if not n or off + n > len(blobs[0]):
                  continue
              va = blobs[0][off:off+n]
              vb = blobs[1][off:off+n]
              vh = blobs[2][off:off+n]
              if not (va == vb == vh):
                  semantic_diffs.append(
                      (entry["id"], va.hex(), vb.hex(), vh.hex())
                  )
          if semantic_diffs:
              raise SystemExit(
                  "promoted semantic WRAM differs across control/HD: "
                  + repr(semantic_diffs[:20])
              )

          print(
              "UR_RACER_WRAM_STABLE PASS "
              f"baseline_variable_bytes={len(baseline_variable)} "
              "hd_differences_outside_baseline=0 promoted_semantic_differences=0"
          )
          PY

          # The selector reaches the retained synchronized tuple in all runs.
          grep -F "UR_RACER_PRESENTATION_PROBE PASS" "$ORIGINAL_A_LOG"
          grep -F "UR_RACER_PRESENTATION_PROBE PASS" "$ORIGINAL_B_LOG"
          grep -F "UR_RACER_PRESENTATION_PROBE PASS" "$HD_LOG"
          grep -F "p1_primary=0541" "$HD_LOG"
          grep -F "p2_primary=0540" "$HD_LOG"
          grep -F "p1_companion=0D0D" "$HD_LOG"
          grep -F "p1_gate=0001" "$HD_LOG"
          grep -F "selected=remastered" "$HD_LOG"

          # Only the enabled run may enter the host draw-frame substitution.
          if grep -F "UR_RACER_HD_DRAW PASS" "$ORIGINAL_A_LOG" || \
             grep -F "UR_RACER_HD_DRAW PASS" "$ORIGINAL_B_LOG"; then
            echo "::error::Original control unexpectedly drew an HD replacement"
            exit 1
          fi
          grep -F "UR_RACER_HD_DRAW PASS" "$HD_LOG"
          grep -F "semantic=0541 viewport=top slot=98" "$HD_LOG"
          grep -F "semantic=0540 viewport=top slot=99" "$HD_LOG"
          grep -F "semantic=0541 viewport=bottom slot=97" "$HD_LOG"
          grep -F "semantic=0540 viewport=bottom slot=96" "$HD_LOG"
          grep -F "frame=1306 semantic=057E viewport=top slot=98" "$HD_LOG"
          grep -F "frame=1306 semantic=0544 viewport=top slot=99" "$HD_LOG"
          grep -F "frame=1306 semantic=057E viewport=bottom slot=97" "$HD_LOG"
          grep -F "frame=1306 semantic=0544 viewport=bottom slot=96" "$HD_LOG"
          grep -F "frame=1205 semantic=057E viewport=top slot=98" "$HD_LOG"
          grep -F "frame=1205 semantic=0543 viewport=top slot=99" "$HD_LOG"
          grep -F "frame=1205 semantic=057E viewport=bottom slot=97" "$HD_LOG"
          grep -F "frame=1205 semantic=0543 viewport=bottom slot=96" "$HD_LOG"
          grep -F "semantic=057D viewport=top slot=98" "$HD_LOG"
          grep -F "semantic=0543 viewport=top slot=99" "$HD_LOG"
          grep -F "semantic=057D viewport=bottom slot=97" "$HD_LOG"
          grep -F "semantic=0543 viewport=bottom slot=96" "$HD_LOG"
          grep -F "semantic=057E viewport=top slot=98" "$HD_LOG"
          grep -F "semantic=0544 viewport=top slot=99" "$HD_LOG"
          grep -F "semantic=057E viewport=bottom slot=97" "$HD_LOG"
          grep -F "semantic=0544 viewport=bottom slot=96" "$HD_LOG"
          grep -F "guest_state_unchanged=1" "$HD_LOG"

          python3 - "$ORIGINAL_A_SHOT" "$ORIGINAL_B_SHOT" "$HD_SHOT" <<'PY'
          import hashlib
          import pathlib
          import sys

          def ppm(path):
              data = pathlib.Path(path).read_bytes()
              header, payload = data.split(b"\n255\n", 1)
              lines = header.splitlines()
              if lines[0] != b"P6":
                  raise SystemExit(f"not P6: {path}")
              dims = tuple(map(int, lines[1].split()))
              return dims, payload, hashlib.sha256(data).hexdigest()

          ad, ap, ah = ppm(sys.argv[1])
          bd, bp, bh = ppm(sys.argv[2])
          hd, hp, hh = ppm(sys.argv[3])
          assert ad == (256, 224), ad
          assert bd == (256, 224), bd
          assert hd == (256, 224), hd
          assert ah == bh and ap == bp, "disabled Original screenshots are not deterministic"
          assert ah != hh, "enabled replacement screenshot is byte-identical to Original"
          assert ap != hp, "enabled replacement did not alter presented pixels"
          print(f"UR_RACER_HD_VISUAL PASS original_sha256={ah} hd_sha256={hh}")
          PY

      - name: Upload compact acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-racer-presentation-acceptance
          path: |
            ${{ runner.temp }}/racer-original-a.log
            ${{ runner.temp }}/racer-original-b.log
            ${{ runner.temp }}/racer-hd.log
            ${{ runner.temp }}/racer-original-a-1220.ppm
            ${{ runner.temp }}/racer-original-b-1220.ppm
            ${{ runner.temp }}/racer-hd-1220.ppm
            ${{ runner.temp }}/racer-original-a-semantic-trace.json
            ${{ runner.temp }}/racer-original-b-semantic-trace.json
            ${{ runner.temp }}/racer-hd-semantic-trace.json
            ${{ runner.temp }}/racer-original-a-semantic-trace.txt
            ${{ runner.temp }}/racer-original-b-semantic-trace.txt
            ${{ runner.temp }}/racer-hd-semantic-trace.txt
          if-no-files-found: warn
          retention-days: 7

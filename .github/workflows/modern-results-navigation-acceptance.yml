name: Modern results navigation acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/product/uniracers_modern_host.cpp"
      - "native/product/modern_results_navigation.hpp"
      - "native/product/modern_tour_continue.hpp"
      - "native/product/modern_tour_entry_policy.hpp"
      - "native/product/next_event_derivation.hpp"
      - "native/title/uniracers_tour_resume.*"
      - "tests/native/run_modern_results_navigation_acceptance.sh"
      - "tests/native/modern_results_navigation_test.cpp"
      - "tests/native/modern_tour_continue_test.cpp"
      - "tests/unit/test_modern_results_navigation_cpp.py"
      - "tests/unit/test_modern_results_navigation_host_contract.py"
      - "tests/input/modern-results-navigation*.script"
      - "tests/input/modern-practice-repeat-results.script"
      - "tools/patch_modern_product_host.py"
      - "tools/prepare_native_widescreen_product.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/toolchain-entries/sdl3.json"
      - ".github/workflows/modern-results-navigation-acceptance.yml"

concurrency:
  group: modern-results-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install desktop build dependencies
        shell: bash
        run: |
          cmake --version
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Stage framework and SDL3
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          python3 tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only

      - name: Scaffold and build Modern native host
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-results-navigation"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay \
              --no-github --no-submodules --no-generate --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 "$GITHUB_WORKSPACE/tools/prepare_native_widescreen_product.py" \
            --framework "$FRAMEWORK" --project "$ROOT" --rom "$ROM" \
            --json-out "$RUNNER_TEMP/results-navigation-prepare.json"
          python3 "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py" \
            "$ROOT/src/main.c" \
            --game-rtl "$ROOT/src/game_rtl.c" \
            --cmake "$ROOT/CMakeLists.txt"

          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON \
            -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Run deterministic results-navigation model tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.unit.test_modern_results_navigation_cpp \
            tests.unit.test_modern_tour_continue_cpp \
            tests.unit.test_modern_results_navigation_host_contract

      - name: Prove real Modern results routes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-results-navigation/UniracersSNESRecomp"
          bash "$GITHUB_WORKSPACE/tests/native/run_modern_results_navigation_acceptance.sh" \
            "$ROOT/build/UniracersSNESRecomp" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            "$RUNNER_TEMP/results-navigation"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-results-navigation-acceptance
          path: |
            ${{ runner.temp }}/results-navigation/*.log
            ${{ runner.temp }}/results-navigation/*-dumps/
            ${{ runner.temp }}/results-navigation/*-profile/
          if-no-files-found: warn
          retention-days: 7

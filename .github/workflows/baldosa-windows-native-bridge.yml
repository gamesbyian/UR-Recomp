            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --zip "$RUNNER_TEMP/baldosa-native-romless/UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip" \
            --zip-sha256-file "$RUNNER_TEMP/baldosa-native-romless/UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip.sha256" \
            --revision "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/baldosa-candidate-binding/candidate-binding.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prove extracted CMD launcher, ROM gates and isolated user SRAM

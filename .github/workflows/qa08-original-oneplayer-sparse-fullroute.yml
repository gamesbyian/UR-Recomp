name: QA-08 one-shot original Snes9x 1P whole-event sparse raster reference
# Independently executed original 2014 Snes9x source for moving, transitions,
# finish/result/return. One original 5447-frame process samples 261 actual
# full 256x224 callbacks, no continuous image synthesis or 216-high crop.
on:
  pull_request:
    paths:
      - ".github/workflows/qa08-original-oneplayer-sparse-fullroute.yml"
      - "tools/qa08_original_oneplayer_sparse_fullroute_manifest.py"
      - "tests/unit/test_qa08_original_oneplayer_sparse_fullroute_manifest.py"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: qa08-one-original-sparse-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-oneplayer-261-source-frames:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Guard real original USA retail ROM, core pin and exact 1P script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          cmp baldosa/tests/routes/race_1p.txt reference/imported/reverse-engineering/baldosa-uniracers-recomp/tests/routes/race_1p.txt
          mkdir -p "$RUNNER_TEMP/qa08-original-oneplayer-sparse/frames"
          grep -v '^turbo ' baldosa/tests/routes/race_1p.txt > "$RUNNER_TEMP/qa08-original-oneplayer-sparse/qa08-original-1p.script"
          python3 -m unittest tests.unit.test_qa08_original_oneplayer_sparse_fullroute_manifest

      - name: Build the same project-pinned original Snes9x core and snesref once
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libsdl2-dev
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          make -C "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro" -j 2
          test -s "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          cmake -S baldosa/snesrecomp/tools/snesref -B "$RUNNER_TEMP/qa08-snesref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qa08-snesref" -j 2
          test -x "$RUNNER_TEMP/qa08-snesref/snesref"

      - name: Run one authentic original 1P route and retain every 16th source callback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa08-original-oneplayer-dumps"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$RUNNER_TEMP/qa08-original-oneplayer-sparse/qa08-original-1p.script" \
          SNESREF_DUMP_DIR="$RUNNER_TEMP/qa08-original-oneplayer-dumps" \
          SNESREF_FRAME_DUMP_DIR="$RUNNER_TEMP/qa08-original-oneplayer-sparse/frames" \
          SNESREF_FRAME_DUMP_NATIVE=1 SNESREF_FRAME_DUMP_FROM=1279 \
          SNESREF_FRAME_DUMP_TO=5439 SNESREF_FRAME_DUMP_STEP=16 \
          timeout 220 "$RUNNER_TEMP/qa08-snesref/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            > "$RUNNER_TEMP/qa08-original-oneplayer-sparse/original.log" 2>&1
          python3 tools/qa08_original_oneplayer_sparse_fullroute_manifest.py \
            --frames "$RUNNER_TEMP/qa08-original-oneplayer-sparse/frames" \
            --script "$RUNNER_TEMP/qa08-original-oneplayer-sparse/qa08-original-1p.script" \
            --log "$RUNNER_TEMP/qa08-original-oneplayer-sparse/original.log" \
            --rom reference/roms/retail/Uniracers_USA.sfc \
            --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            --out "$RUNNER_TEMP/qa08-original-oneplayer-sparse/qa08-original-1p-sparse.json"
          echo "Observed exact original Snes9x 256x224 PPU source through 1P entry/moving/finish/return. No native phase or release gate inferred." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain only immutable original BGRX sources, inputs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa08-original-1p-sparse-real-raster-window
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa08-original-oneplayer-sparse/qa08-original-1p-sparse.json
            ${{ runner.temp }}/qa08-original-oneplayer-sparse/qa08-original-1p.script
            ${{ runner.temp }}/qa08-original-oneplayer-sparse/original.log
            ${{ runner.temp }}/qa08-original-oneplayer-sparse/frames/*.raw

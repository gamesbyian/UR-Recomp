name: Recover historical Uniracers bot artifacts

on:
  push:
    paths:
      - tools/recover_uniracers_bot.py
      - .github/workflows/recover-uniracers-bot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe archives and recover payloads
        run: python3 tools/recover_uniracers_bot.py
      - name: Show report
        run: cat references/recovered/tas-bot/recovery-report.md
      - name: Commit recovery evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f references/recovered/tas-bot/
          if git diff --cached --quiet; then
            echo "No recovery evidence changed."
            exit 0
          fi
          git commit -m "Record historical Uniracers bot recovery probe"
          git pull --rebase origin main
          git push origin HEAD:main

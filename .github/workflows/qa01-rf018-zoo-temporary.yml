name: TEMP QA01 RF-018 source Zoo +5040 A/B treatment

# One source-qualified, original/native Zoo RF-018 treatment against
# two already retained RF-015/017 baseline case artifacts (PR #1690).
# Remove this file as soon as its one hosted treatment is finished.
on:
  pull_request:
    paths:
      - ".github/workflows/qa01-rf018-zoo-temporary.yml"

permissions:
  contents: read

concurrency:
  group: qa01-zoo-rf018-temporary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-original-rf018-only-treatment:
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      zoo_race_mesh: true
      zoo_dp_window: true
      zoo_terminal_phase: true
      source_followthrough: true
      zoo_next_bowl: true
      baldosa_refresh_beam_rate: true
      baldosa_io_clock_order: true
      baldosa_dp_pointer_once: true
      baldosa_spc_reference_rate: false
      baldosa_hdma_cpu_stall: false
      qa01_apu_phase: false
      qa01_cold_guest_reload: false

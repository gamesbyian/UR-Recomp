name: QA-01 temporary cold guest rank-record experiment

# PR-only original/native research; remove before merge.
on:
  pull_request:
    paths:
      - .github/workflows/qa01-zoo-cold-guest-one-shot-20261015.yml
      - .github/workflows/qa01-event-campaign.yml
      - tools/qa01_cold_result_record.py
      - tests/unit/test_qa01_cold_result_record.py

permissions:
  contents: read

concurrency:
  group: qa01-zoo-cold-guest-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-zoo:
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      source_followthrough: true
      baldosa_refresh_beam_rate: true
      qa01_cold_guest_reload: true
      zoo_terminal_phase: false
      qa01_apu_phase: false

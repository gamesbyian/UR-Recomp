name: Cumulative research campaigns (seven independent lanes)

# One serialized, source-bound run at a time, no canceled expensive experiments.
# The seven-family coordinator is manual-only during integration-first work.
# Three recent scheduled attempts failed before creating a job; see runbook.
# Manual dispatch can choose any lane and a bounded real-work budget.
# Only this coordinator writes to research/qa-cumulative-ledger.
# Runner-aware admission runs BEFORE seed reservation: a deferred run reserves
# nothing, writes no ledger row and occupies one small runner for ~1 minute.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Research family (auto chooses next lane)"
        required: true
        type: choice
        default: auto
        options: [auto, native-2p, windows, fault-recovery, graphics, performance, original-native, frontier]
      wall_minutes_per_shard:
        description: "Real native/fault workload budget (graphics/performance included)"
        type: choice
        required: true
        default: "15"
        options: ["15", "60", "120"]
      windows_trials_per_shard:
        description: "Real Windows producer repetitions, not unique controller trajectories"
        type: choice
        required: true
        default: "3"
        options: ["1", "3", "10", "30", "60"]
      frontier_parallel:
        description: "Concurrent frontier experiment shards: 2 normal, 1 spare-capacity, 4 dedicated"
        type: choice
        required: true
        default: "2"
        options: ["1", "2", "4"]
      frontier_cases:
        description: "Actual real native state-space cases (up to 10,000), manual large batches"
        type: choice
        required: true
        default: "100"
        options: ["100", "1000", "10000"]
      frontier_series:
        description: "Frontier only: open a resumable 1,000/10,000-case series of immutable batches, or continue the open one"
        type: choice
        required: true
        default: none
        options: [none, new-1000, new-10000, continue]
      admission:
        description: "auto: defer/downsize when agent CI needs runners; force: operator override"
        type: choice
        required: true
        default: auto
        options: [auto, force]

permissions:
  contents: write
  # Read-only queue inspection for admission and runner-usage receipts.
  actions: read

# This group has no github.ref suffix. A single writer serializes ALL
# seed reservations + immutable evidence on any ref, including scheduled runs.
concurrency:
  group: qa-cumulative-research-single-ledger-writer
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      # Empty when admission deferred: every producer and the writer skip.
      campaign: ${{ steps.plan.outputs.campaign }}
      frontier_parallel: ${{ steps.admission.outputs.frontier_parallel }}
      base_seed: ${{ steps.plan.outputs.base_seed }}
      minutes: ${{ steps.plan.outputs.minutes }}
      windows_trials: ${{ steps.plan.outputs.windows_trials }}
      frontier_cases: ${{ steps.plan.outputs.frontier_cases }}
      frontier_prior: ${{ steps.plan.outputs.frontier_prior }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - name: Checkout exact coordinator and original research implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read cumulative ledger at separate evidence-only branch
        uses: actions/checkout@v4
        with:
          ref: research/qa-cumulative-ledger
          path: research-evidence
          sparse-checkout: |
            .github/qa-cumulative
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Snapshot this repository's Actions queue (advisory, not a reservation)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/research_admission.py snapshot \
            --repo "$GITHUB_REPOSITORY" --exclude-run-id "$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/cumulative-admission/snapshot.json"
      - name: Runner-aware admission and failure-aware lane selection
        id: admission
        shell: bash
        env:
          SELECTED: ${{ inputs.campaign || 'auto' }}
          ADMISSION: ${{ inputs.admission || 'auto' }}
          PARALLEL: ${{ inputs.frontier_parallel || '2' }}
          MINUTES: ${{ inputs.wall_minutes_per_shard || '15' }}
          WINDOWS_TRIALS: ${{ inputs.windows_trials_per_shard || '3' }}
          FRONTIER_CASES: ${{ inputs.frontier_cases || '100' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/unit -p test_research_admission.py
          python3 tools/research_admission.py decide \
            --ledger research-evidence/.github/qa-cumulative/ledger.json \
            --snapshot "$RUNNER_TEMP/cumulative-admission/snapshot.json" \
            --selected "$SELECTED" --event "$GITHUB_EVENT_NAME" --admission "$ADMISSION" \
            --frontier-parallel "$PARALLEL" --frontier-cases "$FRONTIER_CASES" \
            --minutes "$MINUTES" --windows-trials "$WINDOWS_TRIALS" \
            --out "$RUNNER_TEMP/cumulative-admission/decision.json" \
            --gha-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain admission receipt (including deferrals)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-cumulative-admission
          path: ${{ runner.temp }}/cumulative-admission/
          retention-days: 14
          if-no-files-found: warn
      - name: Verify ledger signatures and reserve unique non-overlapping seed window
        if: ${{ steps.admission.outputs.admitted == 'true' }}
        id: plan
        shell: bash
        env:
          SELECTED: ${{ steps.admission.outputs.campaign }}
          PRODUCER_DIGEST: ${{ steps.admission.outputs.producer_digest }}
          MINUTES: ${{ inputs.wall_minutes_per_shard || '15' }}
          WINDOWS_TRIALS: ${{ inputs.windows_trials_per_shard || '3' }}
          FRONTIER_CASES: ${{ inputs.frontier_cases || '100' }}
          SERIES: ${{ inputs.frontier_series || 'none' }}
        run: |
          set -euo pipefail
          case "$SERIES" in
            none) SERIES_MODE=none; SERIES_TARGET=0 ;;
            new-1000) SERIES_MODE=new; SERIES_TARGET=1000 ;;
            new-10000) SERIES_MODE=new; SERIES_TARGET=10000 ;;
            continue) SERIES_MODE=continue; SERIES_TARGET=0 ;;
            *) echo "unknown frontier series mode" >&2; exit 2 ;;
          esac
          python3 -m unittest discover -s tests/unit -p test_qa_cumulative_ledger.py
          python3 -m unittest discover -s tests/unit -p test_research_series.py
          python3 tools/qa_cumulative_ledger.py plan \
            --ledger research-evidence/.github/qa-cumulative/ledger.json \
            --selected "$SELECTED" --source-sha "$GITHUB_SHA" \
            --minutes "$MINUTES" --windows-trials "$WINDOWS_TRIALS" \
            --frontier-cases "$FRONTIER_CASES" \
            --run-id "$GITHUB_RUN_ID" --producer-digest "$PRODUCER_DIGEST" \
            --series "$SERIES_MODE" --series-target "$SERIES_TARGET" \
            --out "$RUNNER_TEMP/cumulative-plan/plan.json" \
            --gha-output "$GITHUB_OUTPUT"
      - name: Immutable plan receipt
        if: ${{ steps.admission.outputs.admitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-cumulative-plan
          path: ${{ runner.temp }}/cumulative-plan/plan.json
          retention-days: 14
          if-no-files-found: error

  native-2p:
    if: ${{ needs.reserve.outputs.campaign == 'native-2p' }}
    needs: reserve
    uses: ./.github/workflows/qa02-native-2p-seeded-endurance.yml
    with:
      wall_minutes_per_shard: ${{ needs.reserve.outputs.minutes }}
      base_seed: ${{ needs.reserve.outputs.base_seed }}

  windows:
    if: ${{ needs.reserve.outputs.campaign == 'windows' }}
    needs: reserve
    uses: ./.github/workflows/baldosa-windows-reliability-campaign.yml
    with:
      trials_per_shard: ${{ needs.reserve.outputs.windows_trials }}

  fault-recovery:
    if: ${{ needs.reserve.outputs.campaign == 'fault-recovery' }}
    needs: reserve
    uses: ./.github/workflows/qa02-real-fault-endurance.yml
    with:
      wall_minutes_per_shard: ${{ needs.reserve.outputs.minutes }}
      base_seed: ${{ needs.reserve.outputs.base_seed }}

  graphics:
    if: ${{ needs.reserve.outputs.campaign == 'graphics' }}
    needs: reserve
    uses: ./.github/workflows/qa-cumulative-native-metrics.yml
    with:
      mode: graphics
      wall_minutes_per_shard: ${{ needs.reserve.outputs.minutes }}
      base_seed: ${{ needs.reserve.outputs.base_seed }}

  performance:
    if: ${{ needs.reserve.outputs.campaign == 'performance' }}
    needs: reserve
    uses: ./.github/workflows/qa-cumulative-native-metrics.yml
    with:
      mode: performance
      wall_minutes_per_shard: ${{ needs.reserve.outputs.minutes }}
      base_seed: ${{ needs.reserve.outputs.base_seed }}

  original-native:
    if: ${{ needs.reserve.outputs.campaign == 'original-native' }}
    needs: reserve
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: all
      zoo_terminal_phase: false

  frontier:
    if: ${{ needs.reserve.outputs.campaign == 'frontier' }}
    needs: reserve
    uses: ./.github/workflows/qa-adaptive-frontier.yml
    with:
      cases: ${{ needs.reserve.outputs.frontier_cases }}
      base_seed: ${{ needs.reserve.outputs.base_seed }}
      strategy_prior_json: ${{ needs.reserve.outputs.frontier_prior }}
      # Admission may only lower shard parallelism; cases/seeds/plan are fixed.
      max_parallel: ${{ needs.reserve.outputs.frontier_parallel }}

  commit-evidence:
    if: ${{ always() && needs.reserve.result == 'success' && needs.reserve.outputs.campaign != '' }}
    needs: [reserve, native-2p, windows, fault-recovery, graphics, performance, original-native, frontier]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout research verifier at exact workload source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout append-only evidence branch with GitHub Actions credentials
        uses: actions/checkout@v4
        with:
          ref: research/qa-cumulative-ledger
          path: research-evidence
          sparse-checkout: |
            .github/qa-cumulative
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Retrieve exact seed reservation
        uses: actions/download-artifact@v4
        with:
          name: qa-cumulative-plan
          path: ${{ runner.temp }}/cumulative-plan
      - name: Classify completed research family and expected source-owned receipt
        id: target
        shell: bash
        env:
          SELECTED: ${{ needs.reserve.outputs.campaign }}
          NATIVE_RESULT: ${{ needs.native-2p.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          FAULT_RESULT: ${{ needs.fault-recovery.result }}
          GRAPHICS_RESULT: ${{ needs.graphics.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          ORIGINAL_RESULT: ${{ needs.original-native.result }}
          FRONTIER_RESULT: ${{ needs.frontier.result }}
        run: |
          set -euo pipefail
          case "$SELECTED" in
            native-2p)
              artifact=native-2p-endurance-aggregate
              filename=result.json
              status="$NATIVE_RESULT"
              ;;
            windows)
              artifact=qa-win32-reliability-aggregate
              filename=result.json
              status="$WINDOWS_RESULT"
              ;;
            fault-recovery)
              artifact=qa02-real-fault-endurance-aggregate
              filename=result.json
              status="$FAULT_RESULT"
              ;;
            graphics)
              artifact=qa-cumulative-graphics-aggregate
              filename=result.json
              status="$GRAPHICS_RESULT"
              ;;
            performance)
              artifact=qa-cumulative-performance-aggregate
              filename=result.json
              status="$PERFORMANCE_RESULT"
              ;;
            original-native)
              artifact=qa01-campaign-aggregate
              filename=campaign-result.json
              status="$ORIGINAL_RESULT"
              ;;
            frontier)
              artifact=qa-frontier-aggregate
              filename=result.json
              status="$FRONTIER_RESULT"
              ;;
            *) echo "unknown selected research workflow"; exit 2 ;;
          esac
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Source-owned $SELECTED workflow result: $status"
      - name: Retrieve source-owned aggregate even if underlying workload failed
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.target.outputs.artifact }}
          path: ${{ runner.temp }}/cumulative-producer
      - name: Measure runner-minutes consumed by this run's jobs (operational cost)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/research_admission.py usage \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --exclude-job commit-evidence \
            --out "$RUNNER_TEMP/cumulative-usage/usage.json"
      - name: Validate exact source/seed receipts and prepare new ledger revision
        id: classify
        shell: bash
        env:
          JOB_RESULT: ${{ steps.target.outputs.status }}
          AGGREGATE_FILE: ${{ steps.target.outputs.filename }}
        run: |
          set -euo pipefail
          set +e
          python3 tools/qa_cumulative_ledger.py append \
            --ledger research-evidence/.github/qa-cumulative/ledger.json \
            --plan "$RUNNER_TEMP/cumulative-plan/plan.json" \
            --aggregate "$RUNNER_TEMP/cumulative-producer/$AGGREGATE_FILE" \
            --job-result "$JOB_RESULT" \
            --usage "$RUNNER_TEMP/cumulative-usage/usage.json" \
            --out research-evidence/.github/qa-cumulative/ledger.json \
            --receipt "$RUNNER_TEMP/cumulative-final/record.json"
          classified=$?
          set -e
          # Incomplete and failed runs MUST still consume their seed reservation.
          echo "classified_rc=$classified" >> "$GITHUB_OUTPUT"
          test -s "$RUNNER_TEMP/cumulative-final/record.json"
      - name: Atomically append result (including scientific failures) to evidence branch
        shell: bash
        run: |
          set -euo pipefail
          cd research-evidence
          git config user.name "ur-cumulative-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/qa-cumulative/ledger.json
          git diff --cached --quiet && { echo "No new reserved research evidence"; exit 1; }
          git commit -m "research: record ${{ needs.reserve.outputs.campaign }} run ${{ github.run_id }} (no release credit)"
          # Serialized coordinator protects the read-then-append transaction.
          # This is a normal non-force, fail-closed push. No silent overwrite.
          git push origin HEAD:refs/heads/research/qa-cumulative-ledger
      - name: Publish derived cumulative yield view (read-only, no credit)
        # Only after the ledger push succeeded, so it describes committed state.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research_yield.py \
            --ledger research-evidence/.github/qa-cumulative/ledger.json \
            --out-json "$RUNNER_TEMP/cumulative-final/yield.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain proposed recorded outcome independently of push availability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-cumulative-final-receipt
          path: |
            ${{ runner.temp }}/cumulative-final/record.json
            ${{ runner.temp }}/cumulative-final/yield.json
          retention-days: 30
          if-no-files-found: warn
      - name: Scientific failures must remain red after their receipt is safely committed
        shell: bash
        env:
          CLASSIFIED_RC: ${{ steps.classify.outputs.classified_rc }}
        run: |
          set -euo pipefail
          test "$CLASSIFIED_RC" = 0
          echo "Cumulative source-bound record committed; no release or hardware credit"

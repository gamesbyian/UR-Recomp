name: multiplayer first-left writer trace
# Temporary bounded diagnostic. Remove after evidence is harvested into PR/docs.

on:
  pull_request:
    paths:
      - ".github/workflows/multiplayer-first-left-writer-trace.yml"
      - "tools/trace_native_wram_writers.py"
      - "tests/input/two-player-first-race.input"

concurrency:
  group: multiplayer-first-left-writer-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Generate and build trace target
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/trace-project"
          mkdir -p "$ROOT"
          sh snesrecomp/tools/new_project/setup_project.sh \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --generate \
            --snesrecomp-ref cd5875cbdaf19f5e324272b1f8051d671fce9215

          PROJECT="$ROOT/UniracersSNESRecomp"
          python3 - "$PROJECT/src/host_contract.c" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          marker="#include <stdint.h>\n"
          if marker not in s:
              raise SystemExit("host_contract.c include marker not found")
          s=s.replace(marker, marker+"\n#if !defined(SNESRECOMP_TRACE) || !SNESRECOMP_TRACE\n", 1)
          s+="\n#endif /* production debug-hook stubs */\n"
          p.write_text(s)
          PY

          cmake -S "$PROJECT" -B "$PROJECT/build-trace" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ENABLE_TRACE=ON
          cmake --build "$PROJECT/build-trace" -j2

      - name: Capture first-left writer scopes through frame 1533
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/trace-project/UniracersSNESRecomp"
          EXE="$PROJECT/build-trace/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          INPUT="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"
          LOG="$RUNNER_TEMP/native-left-writers-host.log"
          OUT="$RUNNER_TEMP/native-left-writers.json"

          SNESRECOMP_DEBUG_PORT=4377 \
          SNESRECOMP_INPUT_FILE="$INPUT" \
          SDL_AUDIODRIVER=dummy \
            timeout 300s xvfb-run -a "$EXE" "$ROM" --paused >"$LOG" 2>&1 &
          HOST_PID=$!
          trap 'kill "$HOST_PID" 2>/dev/null || true' EXIT

          python3 tools/trace_native_wram_writers.py \
            --port 4377 \
            --max-frames 1300 \
            --coarse-until 1100 \
            --continue-until 1533 \
            --address 0x0F9F \
            --address 0x0FA0 \
            --address 0x04B7 \
            --address 0x04B8 \
            --address 0x04B9 \
            --address 0x04BA \
            --json-out "$OUT" | tee "$RUNNER_TEMP/native-left-writers.txt"

          kill "$HOST_PID" 2>/dev/null || true
          wait "$HOST_PID" 2>/dev/null || true
          trap - EXIT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-first-left-writer-trace
          path: |
            ${{ runner.temp }}/native-left-writers-host.log
            ${{ runner.temp }}/native-left-writers.json
            ${{ runner.temp }}/native-left-writers.txt
          retention-days: 3

            --zip "$RUNNER_TEMP/baldosa-native-romless/UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip" \
            --rom "reference/roms/retail/Uniracers_USA.sfc" \
            --out "$RUNNER_TEMP/Baldosa Native Extracted Launcher QA" \
            --timeout 80 --expected-revision "$GITHUB_SHA"
          echo "PASS: actual ROM-free ZIP extracted on Windows; double-click CMD rejects missing/wrong ROM and package-local/relative saves, accepts valid personal ROM, opens shared Modern root and saves exact native SRAM outside extracted executable directory. No ROM or saved data uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain ROM-free Windows candidate only (no ROM or SRAM)

name: One-shot Sayans text-layout callsites

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sayans-layout-callsites.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Scan candidate entry points
        run: |
          ROM="reference/roms/retail/Uniracers_USA.sfc"
          mkdir -p layout-callsites
          python3 tools/find_65816_call_sites.py "$ROM" 03:8971 --context 24 --json-out layout-callsites/calls-03-8971.json
          python3 tools/find_65816_call_sites.py "$ROM" 03:895B --context 24 --json-out layout-callsites/calls-03-895b.json
          python3 tools/find_65816_call_sites.py "$ROM" 00:8C41 --context 24 --json-out layout-callsites/calls-00-8c41.json
          cat layout-callsites/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: sayans-layout-callsites
          path: layout-callsites/

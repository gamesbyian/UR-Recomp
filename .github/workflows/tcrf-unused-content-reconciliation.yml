name: TCRF unused-content ROM reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/tcrf-rom-reconciliation-2026-10-02
    paths:
      - "tools/reconcile_tcrf_unused_content.py"
      - "tests/unit/test_reconcile_tcrf_unused_content.py"
      - ".github/workflows/tcrf-unused-content-reconciliation.yml"

concurrency:
  group: tcrf-unused-content-reconciliation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical ROM and unit tests
        run: |
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 -m unittest tests.unit.test_reconcile_tcrf_unused_content
      - name: Reconcile fixed-offset claims
        run: |
          python3 tools/reconcile_tcrf_unused_content.py             "reference/roms/retail/Uniracers_USA.sfc"             --out analysis/generated/tcrf-unused-content-rom-reconciliation.json
      - name: Persist reconciliation evidence
        run: |
          set -euo pipefail
          git add analysis/generated/tcrf-unused-content-rom-reconciliation.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record TCRF unused-content ROM reconciliation"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: tcrf-unused-content-rom-reconciliation
          path: analysis/generated/tcrf-unused-content-rom-reconciliation.json
          retention-days: 7

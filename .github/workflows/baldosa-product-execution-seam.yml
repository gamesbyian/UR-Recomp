name: Baldosa Modern native execution seam

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/product/baldosa_execution_backend.hpp"
      - "native/product/modern_host_input_release_latch.hpp"
      - "tools/baldosa_native_product_execution.cpp"
      - "tools/baldosa_product_execution_spike.py"
      - "tests/native/baldosa_execution_backend_test.cpp"
      - "tests/unit/test_baldosa_product_execution_spike.py"
      - ".github/workflows/baldosa-product-execution-seam.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baldosa-product-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-and-staging:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Native product lifecycle and P1/P2 held release
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -I native/product \
            tests/native/baldosa_execution_backend_test.cpp \
            -o "$RUNNER_TEMP/baldosa-execution-backend-test"
          "$RUNNER_TEMP/baldosa-execution-backend-test"
          echo "PASS: C++ lifecycle rejection/acknowledgement and two-seat release" >> "$GITHUB_STEP_SUMMARY"
      - name: Pinned native host guarded injection
        run: |
          set -euo pipefail
          python3 tests/unit/test_baldosa_product_execution_spike.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -I native/product \
            -c tools/baldosa_native_product_execution.cpp \
            -o "$RUNNER_TEMP/baldosa_native_product_execution.o"
          echo "PASS: injected C ABI translation unit compiles independently" >> "$GITHUB_STEP_SUMMARY"

  # This is a targeted, one-route AOT integration gate, not a second
  # complete-event or HD presentation campaign. Only run native when the
  # draft graduates; the cheap unit gate runs on every relevant candidate.
  pinned-human-input-route:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SNESRECOMP_ROM: ${{ github.workspace }}/reference/roms/retail/Uniracers_USA.sfc
      SDL_AUDIODRIVER: dummy
      PIXELS: "0"
      KEEP_WRAM: "0"
      TMO: "45"
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned ROM and third-party sources
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478" "$SNESRECOMP_ROM" | sha256sum -c -
          python3 tools/verify_rom.py "$SNESRECOMP_ROM"
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Verify unchanged input baseline
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          git -C baldosa submodule status --recursive
      - name: Install pinned host SDL2/X11 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ninja-build pkg-config libsdl2-dev libgl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgles-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev xvfb x11-utils
      - name: Baseline pinned executable with two-player route
        shell: bash
        run: |
          set -euo pipefail
          cmake -S baldosa -B baldosa/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SDL3_FETCH=OFF \
            -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          test -x baldosa/build/UniracersSNESRecomp
          printf '%s\n' '[Sound]' 'EnableAudio = 0' > baldosa/build/config.ini
          Xvfb :99 -screen 0 1280x720x24 -ac > "$RUNNER_TEMP/baldosa-xvfb.log" 2>&1 &
          export DISPLAY=:99
          for i in 1 2 3 4 5; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null
          cat > "$RUNNER_TEMP/ur-baldosa-x11" <<'SH'
          #!/usr/bin/env sh
          export SDL_VIDEODRIVER=x11
          exec "$BALDOSA_REAL_BIN" "$@"
          SH
          chmod +x "$RUNNER_TEMP/ur-baldosa-x11"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export BIN="$RUNNER_TEMP/ur-baldosa-x11"
          mkdir -p "$RUNNER_TEMP/ur-baldosa-input"
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/ur-baldosa-input/original"
          test -s "$RUNNER_TEMP/ur-baldosa-input/original/fd/crc.txt"
      - name: Compile and exercise live human-only input bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          # Idempotence: staging twice changes no source after first attempt.
          python3 tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          cmake -S baldosa -B baldosa/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SDL3_FETCH=OFF \
            -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          export DISPLAY=:99
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export BIN="$RUNNER_TEMP/ur-baldosa-x11"
          export UR_BALDOSA_PRODUCT_INPUT_DIAGNOSTICS=1
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/ur-baldosa-input/modern_seam"
          grep -q 'UR_BALDOSA_PRODUCT_INPUT frame=0 ' \
            "$RUNNER_TEMP/ur-baldosa-input/modern_seam/log.txt"
          grep -q 'UR_BALDOSA_PRODUCT_INPUT frame=479 ' \
            "$RUNNER_TEMP/ur-baldosa-input/modern_seam/log.txt"
          cmp "$RUNNER_TEMP/ur-baldosa-input/original/fd/crc.txt" \
            "$RUNNER_TEMP/ur-baldosa-input/modern_seam/fd/crc.txt"
          echo "PASS: actual 2P native Baldosa execution with mapped human callback; CRC identical to pinned unchanged guest" >> "$GITHUB_STEP_SUMMARY"
          tail -n 12 "$RUNNER_TEMP/ur-baldosa-input/modern_seam/log.txt"

      - name: UI Stunt result reconnaissance
        if: matrix.shard == 'a'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/ui-stunt-result-route.script"

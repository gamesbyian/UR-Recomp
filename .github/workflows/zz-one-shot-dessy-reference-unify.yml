name: One-shot Dessy intake and reference root consolidation
on:
  push:
    branches:
      - chatgpt/dessy-intake-and-reference-unify-2026-09-30

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dessy-intake-and-reference-unify-2026-09-30
          fetch-depth: 0

      - name: Consolidate on singular reference root and unpack Dessy archive
        shell: bash
        run: |
          set -euo pipefail

          test -f "references/imported/Uniracers Stuff.zip"

          rm -rf /tmp/dessy-intake
          mkdir -p /tmp/dessy-intake
          unzip -q "references/imported/Uniracers Stuff.zip" -d /tmp/dessy-intake

          mkdir -p reference
          for item in references/*; do
            git mv "$item" reference/
          done
          rmdir references

          dest="reference/imported/reverse-engineering/dessyreqt"
          mkdir -p "$dest"
          cp -a /tmp/dessy-intake/. "$dest"/
          git rm -f "reference/imported/Uniracers Stuff.zip"

          while IFS= read -r -d '' file; do
            perl -0pi -e 's#references/#reference/#g' "$file"
          done < <(git grep -Ilz 'references/' -- ':!.github/workflows/**' ':!reference/imported/**' || true)

          git add -A
          git status --short

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Import Dessyreqt archive and unify reference roots"
          git push origin HEAD:chatgpt/dessy-intake-and-reference-unify-2026-09-30

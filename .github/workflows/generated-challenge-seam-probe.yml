name: Generated challenge seam probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify extraction helpers
        run: |
          python3 -m unittest \
            tests.unit.test_extract_generated_challenge_qualification \
            tests.unit.test_extract_stunt_qualify_table

      - name: Stage SNESRecomp
        run: |
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh

      - name: Generate shipping AOT and retain qualification body
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/challenge-seam"
          mkdir -p "$TMP"
          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay \
              --no-github --no-submodules --no-generate --no-build
          ROOT="$TMP/UniracersSNESRecomp"
          python3 "$GITHUB_WORKSPACE/tools/prepare_native_widescreen_product.py" \
            --framework "$FRAMEWORK" \
            --project "$ROOT" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --json-out "$RUNNER_TEMP/challenge-prepare.json"
          grep -q '"challenge_generation_writer"' "$RUNNER_TEMP/challenge-prepare.json"
          mkdir -p analysis/generated
          python3 tools/extract_generated_challenge_qualification.py \
            "$ROOT/src/gen" \
            --out analysis/generated/generated-challenge-qualification.json
          python3 tools/extract_stunt_qualify_table.py \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --out analysis/generated/stunt-qualify-table.json

      - name: Upload seam evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-challenge-seam-probe
          path: |
            analysis/generated/generated-challenge-qualification.json
            analysis/generated/stunt-qualify-table.json
            ${{ runner.temp }}/challenge-prepare.json
          if-no-files-found: warn
          retention-days: 7

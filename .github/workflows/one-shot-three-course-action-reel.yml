name: One-shot genuine three-course racing reel
on:
  push:
    branches: [media/oct19-dynamic-native-racing]
    paths: [.github/workflows/one-shot-three-course-action-reel.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install encode and independent decode verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Render only exact authenticated native frames
        run: |
          set -euo pipefail
          root=media/showcase/2026-10-19/dynamic-native-2p
          python3 tools/showcase/build_dynamic_three_course_reel.py \
            --source-dir "$root" --out-dir "$root"
      - name: Verify delivered 15s footage and representative source frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('media/showcase/2026-10-19/dynamic-native-2p')
          record=json.loads((root/'dynamic-three-course-reel-provenance.json').read_text())
          video=root/record['output_file']
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert record['schema']=='UR-GENUINE-DYNAMIC-THREE-COURSE-SOURCE-REEL/1'
          assert sha(video)==record['output_sha256']
          assert record['total_frames']==900 and len(record['shots'])==3
          assert record['no_interpolation'] and record['distinct_original_guest_sessions']
          assert not record['has_certified_closed_loop'] and not record['has_certified_Hill_Climb']
          witnesses={}
          for ordinal in (150,450,750):
            output=root/f'dynamic-action-reel-source-frame-{ordinal:04d}.png'
            subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
              '-i',str(video),'-vf',f"select=eq(n\\,{ordinal})",
              '-vsync','vfr','-frames:v','1',str(output)],check=True)
            with Image.open(output) as im:
              assert im.size==(1920,1080)
              im.load()
            with Image.open(output) as im:im.verify()
            witnesses[output.name]=sha(output)
          record['decoded_witness_sha256']=witnesses
          record['review_state']='verified-source-and-three-output-frame-samples; independent full-film human screening not claimed'
          (root/'dynamic-three-course-reel-provenance.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          print('SOURCE_AUTHENTIC_900_FRAME_ACTION_REEL_PASS',record['output_sha256'])
          PY
      - name: Save and retire one-shot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/showcase/2026-10-19/dynamic-native-2p/
          git rm -f .github/workflows/one-shot-three-course-action-reel.yml
          git commit -m 'media: publish authentic three-course 15s racing reel and visual source receipts'
          git push origin "HEAD:${GITHUB_REF_NAME}"

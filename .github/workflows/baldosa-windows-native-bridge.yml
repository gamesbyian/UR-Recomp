      # successful source run and contains only two CI-owned pair bytes.
      - name: Retain bounded pre-Records raw pair in separate source artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baldosa-win32-pre-records-pair-evidence
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/UR Baldosa Win32 Pause Route/native_player_created_2p_records/ci-owned-pre-records-pair/

      # Keep fault-cut logs OUTSIDE QA-12 strict real-match source ZIP.

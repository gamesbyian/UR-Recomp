name: "Research: race-relative paired original/native replay"

# Classification: manual research (never PR/push/schedule). Replays named
# frontier cases on the shared Modern native candidate AND on original-USA
# reference cores (Snes9x, Beetle-bsnes) at a per-case MEASURED race-entry
# lag, comparing every decoded source field and all semantic WRAM exactly.
# Optional declared finish stimulus exercises the 2P result handoff (RF-012);
# a lag-frame and a blank-screen census of the stock route cover RF-014.
# With include_baldosa (default true) the pinned product guest
# (gamesbyian/uniracers-recomp 10b864b, snesrecomp fork 075fbe4) is built once
# with the research two-seat input shim and replayed on Snes9x and the
# WRAM-exposing high-accuracy bsnes core (RF-015), plus both censuses.
# One candidate build, one Baldosa build, one paired job; no acceptance fan-out.
# Grants no gameplay, original-parity or release credit.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Space-separated seed:arm list (max 12), e.g. 50036056:rotation 50012000:balanced"
        required: true
        default: "50036056:rotation 50012000:balanced 50024003:alternating"
      finish_hold:
        description: "Frames of the declared both-Right finish stimulus (0 = mid-race only)"
        required: true
        default: "4000"
      lag:
        description: "Declared Modern-native-minus-reference entry lag; each case also measures it"
        required: true
        default: "2"
      include_baldosa:
        description: "Also build and replay the pinned Baldosa product guest (lag 0, Snes9x and bsnes)"
        required: true
        default: "true"

permissions:
  contents: read

concurrency:
  group: research-race-relative-paired-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/modern-shared-native-acceptance.yml
    with:
      canonical_candidate: false
      candidate_only: true

  baldosa:
    if: ${{ inputs.include_baldosa == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check out the pinned Baldosa product guest
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Build the disposable Baldosa guest with the research two-seat input shim
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ninja-build pkg-config build-essential cmake libsdl2-dev \
            libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev
          # Research-only host transport in a throwaway checkout; no guest, PPU or save change.
          python3 tools/research_baldosa_2p_input_patch.py \
            --host baldosa/snesrecomp/runner/src/desktop/host_main.c
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j3
          mkdir -p "$RUNNER_TEMP/baldosa-out"
          install -m 755 baldosa/build/UniracersSNESRecomp "$RUNNER_TEMP/baldosa-out/UniracersSNESRecomp"
          (cd "$RUNNER_TEMP/baldosa-out" && sha256sum UniracersSNESRecomp > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: research-baldosa-2p-shim-guest
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/baldosa-out/

  paired:
    needs: [candidate, baldosa]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.baldosa.result == 'success' || needs.baldosa.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate request
        shell: bash
        env:
          CASES: ${{ inputs.cases }}
          HOLD: ${{ inputs.finish_hold }}
          LAG: ${{ inputs.lag }}
          BALDOSA: ${{ inputs.include_baldosa }}
        run: |
          set -euo pipefail
          [[ "$BALDOSA" =~ ^(true|false)$ ]] || { echo "invalid include_baldosa" >&2; exit 2; }
          [[ "$HOLD" =~ ^[0-9]{1,5}$ ]] || { echo "invalid finish_hold" >&2; exit 2; }
          [[ "$LAG" =~ ^[0-8]$ ]] || { echo "invalid lag" >&2; exit 2; }
          n=0
          for c in $CASES; do
            [[ "$c" =~ ^[0-9]{8}:(balanced|p1-focus|p2-focus|alternating|rotation)$ ]] \
              || { echo "invalid case $c" >&2; exit 2; }
            n=$((n + 1))
          done
          (( n >= 1 && n <= 12 )) || { echo "1-12 cases" >&2; exit 2; }
      - name: Install reference and headless runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            xvfb build-essential cmake pkg-config libsdl2-dev
          if [ "${{ inputs.include_baldosa }}" = true ]; then
            # Runtime libraries the Baldosa guest links dynamically (built on the baldosa job).
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
              libgl1 libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxss1 \
              libwayland-client0 libxkbcommon0 libegl1 libgles2 libdrm2 libgbm1 \
              libasound2t64 libpulse0 libudev1 libdbus-1-3
          fi
      - name: Build original reference cores and snesref
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          git -C snesrecomp apply "$GITHUB_WORKSPACE/tools/patches/snesrecomp-dual-controller-input.patch"
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          python3 tools/bootstrap_toolchain.py --tool beetle-bsnes-libretro --jobs 2
          python3 tools/bootstrap_toolchain.py --tool bsnes-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2
      - uses: actions/download-artifact@v4
        with:
          name: shared-modern-native-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        if: ${{ inputs.include_baldosa == 'true' }}
        with:
          name: research-baldosa-2p-shim-guest
          path: ${{ runner.temp }}/baldosa-guest
      - name: Fetch the signed frontier ledger (read-only)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin research/qa-cumulative-ledger
          git show FETCH_HEAD:.github/qa-cumulative/ledger.json > "$RUNNER_TEMP/ledger.json"
      - name: Paired race-relative replay on both reference cores
        shell: bash
        env:
          CASES: ${{ inputs.cases }}
          HOLD: ${{ inputs.finish_hold }}
          LAG: ${{ inputs.lag }}
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/candidate/shared-modern-native.tar.gz" -C "$RUNNER_TEMP"
          EXE="$RUNNER_TEMP/shared-modern-native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          test -x "$EXE"
          FRAMES="1128-1140,1620-4000/60,4001-7000"
          [ "$HOLD" = 0 ] && FRAMES="1128-1140,1620-3420/30"
          OUT="$RUNNER_TEMP/paired"
          mkdir -p "$OUT/snes9x" "$OUT/beetle"
          for c in $CASES; do
            seed="${c%%:*}"; arm="${c##*:}"
            for core in snes9x beetle; do
              case "$core" in
                snes9x) SO=.tools/src/snes9x-libretro/libretro/snes9x_libretro.so ;;
                beetle) SO=.tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so ;;
              esac
              python3 tools/qa_frontier_original_crosscheck.py paired \
                --ledger "$RUNNER_TEMP/ledger.json" \
                --snesref "$RUNNER_TEMP/snesref-build/snesref" --core "$SO" \
                --native-exe "$EXE" --seed "$seed" --arm "$arm" --lag "$LAG" \
                --finish-hold "$HOLD" --frames "$FRAMES" \
                --work "$RUNNER_TEMP/work/$core-$seed" --out "$OUT/$core/$seed.json"
            done
          done
          for core in snes9x beetle; do
            args=()
            for f in "$OUT/$core"/*.json; do args+=(--paired "$f"); done
            python3 tools/qa_frontier_original_crosscheck.py summarize "${args[@]}" \
              --out "$OUT/summary-$core.json"
          done
      - name: Paired race-relative replay of the Baldosa product guest (lag 0)
        if: ${{ inputs.include_baldosa == 'true' }}
        shell: bash
        env:
          CASES: ${{ inputs.cases }}
          HOLD: ${{ inputs.finish_hold }}
        run: |
          set -euo pipefail
          BEXE="$RUNNER_TEMP/baldosa-guest/UniracersSNESRecomp"
          chmod +x "$BEXE"
          (cd "$RUNNER_TEMP/baldosa-guest" && sha256sum -c SHA256SUMS)
          FRAMES="1128-1140,1620-4800/60,4801-6400"
          [ "$HOLD" = 0 ] && FRAMES="1128-1140,1620-3420/30"
          OUT="$RUNNER_TEMP/paired"
          mkdir -p "$OUT/baldosa-snes9x" "$OUT/baldosa-bsnes"
          for c in $CASES; do
            seed="${c%%:*}"; arm="${c##*:}"
            for core in snes9x bsnes; do
              case "$core" in
                snes9x) SO=.tools/src/snes9x-libretro/libretro/snes9x_libretro.so ;;
                bsnes) SO=.tools/src/bsnes-libretro/bsnes_libretro.so ;;
              esac
              # Raw dumps are deleted by default; Baldosa adds ~2 MB/frame of APU log.
              python3 tools/qa_frontier_original_crosscheck.py paired \
                --ledger "$RUNNER_TEMP/ledger.json" \
                --snesref "$RUNNER_TEMP/snesref-build/snesref" --core "$SO" \
                --native-launcher baldosa --native-exe "$BEXE" \
                --seed "$seed" --arm "$arm" --lag 0 \
                --finish-hold "$HOLD" --frames "$FRAMES" \
                --work "$RUNNER_TEMP/work/baldosa-$core-$seed" \
                --out "$OUT/baldosa-$core/$seed.json"
            done
          done
          for core in snes9x bsnes; do
            args=()
            for f in "$OUT/baldosa-$core"/*.json; do args+=(--paired "$f"); done
            python3 tools/qa_frontier_original_crosscheck.py summarize "${args[@]}" \
              --out "$OUT/summary-baldosa-$core.json"
          done
      - name: Lag-frame and blank-screen census on the stock 2P route
        shell: bash
        env:
          BALDOSA: ${{ inputs.include_baldosa }}
        run: |
          set -euo pipefail
          BARGS=()
          if [ "$BALDOSA" = true ]; then BARGS=(--baldosa-exe "$RUNNER_TEMP/baldosa-guest/UniracersSNESRecomp"); fi
          EXE="$RUNNER_TEMP/shared-modern-native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          OUT="$RUNNER_TEMP/paired"
          REF="$RUNNER_TEMP/snesref-build/snesref"
          python3 tools/qa_lag_frame_census.py --snesref "$REF" \
            --core .tools/src/snes9x-libretro/libretro/snes9x_libretro.so \
            --core .tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so \
            --native-exe "$EXE" "${BARGS[@]}" --work "$RUNNER_TEMP/work/lag" --out "$OUT/lag-stock.json"
          # Framebuffer-only, so the high-accuracy bsnes core (no system RAM) is the reference.
          python3 tools/qa_blank_screen_census.py --snesref "$REF" \
            --core .tools/src/bsnes-libretro/bsnes_libretro.so \
            --core .tools/src/snes9x-libretro/libretro/snes9x_libretro.so \
            --core .tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so \
            --native-exe "$EXE" "${BARGS[@]}" --frames 2-1250 \
            --work "$RUNNER_TEMP/work/blank" --out "$OUT/blank-stock.json"
      - name: Publish compact SHA-bound result
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/paired" > "$RUNNER_TEMP/paired/summary.md" <<'PY'
          import json, sys, pathlib
          root = pathlib.Path(sys.argv[1])
          print("### Race-relative paired original/native replay\n")
          print("| Core | Seed | Arm | Entry native/ref | Lag ok | Disposition | 0x84 frames native/ref |")
          print("| --- | --- | --- | --- | --- | --- | --- |")
          for core in ("snes9x", "beetle"):
              s = json.loads((root / f"summary-{core}.json").read_text())
              for p in s["paired_exact"]:
                  t = p.get("terminal") or {}
                  dur = (f'{t["native"]["result_phase_frames"]}/{t["original"]["result_phase_frames"]}'
                         if t else "-")
                  e = p["measured_entry_host"]
                  print(f'| {core} | {p["seed"]} | {p["arm"]} | {e["native"]}/{e["original"]} '
                        f'| {p["declared_lag_confirmed"]} | {p["disposition"]} | {dur} |')
          for core in ("snes9x", "bsnes"):
              f = root / f"summary-baldosa-{core}.json"
              if not f.exists():
                  continue
              s = json.loads(f.read_text())
              for p in s["paired_exact"]:
                  t = p.get("terminal") or {}
                  dur = (f'{t["native"]["result_phase_frames"]}/{t["original"]["result_phase_frames"]}'
                         if t else "-")
                  e = p["measured_entry_host"]
                  print(f'| baldosa vs {core} | {p["seed"]} | {p["arm"]} | {e["native"]}/{e["original"]} '
                        f'| {p["declared_lag_confirmed"]} | {p["disposition"]} | {dur} |')
          lag = json.loads((root / "lag-stock.json").read_text())
          print("\n| Stock 2P route, host 2-1126 | Vblank-wait passes (7E:00C6) |")
          print("| --- | ---: |")
          for name, n in sorted(lag["game_frames"].items()):
              print(f"| {name} | {n} |")
          blank = json.loads((root / "blank-stock.json").read_text())
          print("\n| Engine | Black-screen runs, host 2-1250 |")
          print("| --- | --- |")
          for name, runs in sorted(blank["dark_runs"].items()):
              print(f"| {name} | {runs} |")
          print("\n**Research observation only; no original-parity or release credit.**")
          PY
          BINPUTS=()
          for f in "$RUNNER_TEMP"/paired/summary-baldosa-*.json; do
            [ -e "$f" ] && BINPUTS+=(--input "$f")
          done
          python3 tools/publish_experiment_result.py \
            --name research-race-relative-paired \
            --question "Do native and original agree at the measured race-relative frame, and how long is each engine's 2P result phase?" \
            --result "$RUNNER_TEMP/paired/summary-snes9x.json" \
            --input "$RUNNER_TEMP/paired/summary-beetle.json" \
            --input "$RUNNER_TEMP/paired/lag-stock.json" \
            --input "$RUNNER_TEMP/paired/blank-stock.json" \
            "${BINPUTS[@]}" \
            --source-summary "$RUNNER_TEMP/paired/summary.md" \
            --out "$RUNNER_TEMP/paired/receipt.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Retain compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-race-relative-paired
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/paired/summary-*.json
            ${{ runner.temp }}/paired/lag-stock.json
            ${{ runner.temp }}/paired/blank-stock.json
            ${{ runner.temp }}/paired/summary.md
            ${{ runner.temp }}/paired/receipt.json
            ${{ runner.temp }}/paired/snes9x/*.json
            ${{ runner.temp }}/paired/beetle/*.json
            ${{ runner.temp }}/paired/baldosa-*/*.json

name: QA-08 identify two isolated finish RGB5 pixels from real archives

# ONE read-only lookup against source-pin 2014 Snes9x and exact current
# b8722af Windows; no new original/Windows process and no gameplay/PPU patch.
on:
  # Source corpora and pass results are SHA-pinned and 90-day retained;
  # source emulator/Win32 rebuilding and archived math analysis are explicit opt-ins only.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qa08-two-isolated-finish-archived-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-finish-isolated:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1649 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reuse SHA-validated 90-day source archive only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/finish/original" "$RUNNER_TEMP/finish/windows"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/12075111053/zip" \
            -o "$RUNNER_TEMP/finish/retained-90day.zip"
          cd "$RUNNER_TEMP/finish"
          echo "3475ee87b5b20768f9377d8d1c787927955c33ee6d4388dae008f5486a81370e  retained-90day.zip" | sha256sum -c -
          unzip -q retained-90day.zip -d retained
          (cd retained; printf '%s\n' \
            "72b7b152d08d8abb3636053bfd132db64926a5bf188f4dbba7e30b20d9583e9e  original.zip" \
            "4f766de13c702a108279293df4613538d8b49cbd1ecbc0876533c5f01f09293c  latest-windows.zip" \
            "f01ab5a4888c227f306a0b9cd89e67710a4b41cad4c22867072280a17811fa82  prior-windows.zip" \
            | sha256sum -c -)
          unzip -q retained/original.zip -d original
          unzip -q retained/latest-windows.zip -d windows
      - name: Verify source code and independently classify both exact finish pixels
        run: |
          set -euo pipefail
          python3 -m unittest tests.unit.test_qa08_two_isolated_finish_pixels
          python3 tools/qa08_two_isolated_finish_pixels.py \
            --original-dir "$RUNNER_TEMP/finish/original" \
            --windows-dir "$RUNNER_TEMP/finish/windows" \
            --route "reference/imported/reverse-engineering/baldosa-uniracers-recomp/tests/routes/race_2p.txt" \
            --out "$RUNNER_TEMP/finish/qa08-two-isolated-finish-pixel-report.json"
          python3 - "$RUNNER_TEMP/finish/qa08-two-isolated-finish-pixel-report.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert len(j["isolated_source_pixels"])==2
          assert [x["native_guest"] for x in j["isolated_source_pixels"]]==[3792,3872]
          assert j["source_original_effective_PPU_OBJ_window_math_proven"] is False
          with open(sys.argv[2],"a",encoding="utf8") as o:
              o.write("### Exact two source-isolated 2P finish pixels\n")
              for row in j["isolated_source_pixels"]:
                  o.write(f"Native guest {row['native_guest']}, pixel ({row['x']},{row['y']}): original RGB5-expanded {row['original_RGB5_expanded']}, actual Windows {row['windows_RGB8']}. Surrounding frame pairs remain full-raster exact.\n")
              o.write("Source-only, not hardware, sprite/window source or release acceptance.\n")
          PY
      - name: Retain source-local 5x5 pixel windows and exact image hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa08-authentic-two-finish-pixels
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/finish/qa08-two-isolated-finish-pixel-report.json

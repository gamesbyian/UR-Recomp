name: ART-4K original actual OAM one-off source census

on:
  pull_request:
    paths:
      - 'tools/art/audit_original_mesen_oam_descriptors.py'
      - 'tests/unit/test_audit_original_mesen_oam_descriptors.py'
      - '.github/workflows/art4k-original-oam-source-once.yml'

permissions:
  contents: read
  actions: read

jobs:
  original-oam-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source OAM 2-bit table synthetic controls
        run: python3 -m unittest tests.unit.test_audit_original_mesen_oam_descriptors
      - name: Re-read exact original Mesen held-frame archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/13196973168/zip" \
            --output "$RUNNER_TEMP/original-mesen-ppu.zip"
          printf '%s  %s\n' \
            "a1aa2d04ca936a031d6f46d821d4ece14a7bdbad03b4774f7ab705d275cef6cc" \
            "$RUNNER_TEMP/original-mesen-ppu.zip" | sha256sum --check
          python3 -m tools.art.audit_original_mesen_oam_descriptors \
            --original-raw-archive "$RUNNER_TEMP/original-mesen-ppu.zip" \
            --out "$RUNNER_TEMP/original-oam-descriptors.json"
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"original-oam-descriptors.json").read_text())
          a,b=r["per_original_held_frame"]
          assert a["modal_original_descriptor_slots"]==123
          assert b["modal_original_descriptor_slots"]==123
          assert a["different_from_modal_original_oam_slots"]==[0,96,97,98,99]
          assert b["different_from_modal_original_oam_slots"]==[0,96,97,98,99]
          assert r["source_PPU_bytes_changed_between_held_ticks"]=={"oam":0,"vram":38,"cgram":17}
          assert not r["original_racer_identity_from_oam_verified"]
          assert not r["source_OBSEL_sprite_pixel_sizes_verified"]
          print("AUTHENTIC_ORIGINAL_MESENCE_OAM_WORDS",123,5,0,38,17)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: art4k-original-mesen-oam-words-${{ github.run_id }}
          path: ${{ runner.temp }}/original-oam-descriptors.json
          retention-days: 7
          if-no-files-found: error

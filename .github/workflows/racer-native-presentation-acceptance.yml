          import json, pathlib, sys
          current = json.loads(pathlib.Path(sys.argv[1]).read_text())
          retained = json.loads(pathlib.Path(sys.argv[2]).read_text())
          dossier = json.loads(pathlib.Path(sys.argv[3]).read_text())

name: Native racer presentation acceptance

on:
  pull_request:
    paths:
      - "native/presentation/**"
      - "tools/apply_native_racer_presentation_probe.py"
      - "tools/summarize_racer_semantic_trace.py"
      - "tools/build_racer_hd_asset_dossier.py"
      - "tools/build_racer_pose_equivalence.py"
      - "tools/build_racer_hd_review_packet.py"
      - "tools/build_racer_hd_shipping_readiness.py"
      - "analysis/data/racer-hd-art-approval.json"
      - "tests/unit/test_build_racer_hd_asset_dossier.py"
      - "tests/unit/test_build_racer_pose_equivalence.py"
      - "tests/unit/test_build_racer_hd_review_packet.py"
      - "tests/unit/test_build_racer_hd_shipping_readiness.py"
      - "tests/unit/test_apply_native_racer_presentation_probe.py"
      - "tests/unit/test_summarize_racer_semantic_trace.py"
      - "tests/native/racer_hd_presenter_test.cpp"
      - "tests/native/racer_replacement_selector_test.cpp"
      - "tests/native/racer_oam_placement_test.cpp"
      - "tests/input/two-player-first-race-observe.script"
      - "tests/input/two-player-first-race.input"
      - ".github/workflows/racer-native-presentation-acceptance.yml"

concurrency:
  group: racer-native-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Verify selector, placement, and orientation contracts
        shell: bash
        run: |
          set -euo pipefail
          CXX="${CXX:-c++}"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_replacement_selector_test.cpp             native/presentation/racer_replacement_selector.cpp             -o "$RUNNER_TEMP/racer-selector-test"
          "$RUNNER_TEMP/racer-selector-test"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_oam_placement_test.cpp             native/presentation/racer_oam_placement.cpp             -o "$RUNNER_TEMP/racer-oam-test"
          "$RUNNER_TEMP/racer-oam-test"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_hd_presenter_test.cpp             native/presentation/racer_replacement_selector.cpp             -o "$RUNNER_TEMP/racer-hd-presenter-test"
          "$RUNNER_TEMP/racer-hd-presenter-test"

      - name: Stage pinned SNESRecomp
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          # bootstrap_toolchain now applies the repository-owned patch stack
          # even for clone-only staging; do not apply input-file.patch twice.
          grep -F 'HostGetenv("INPUT_FILE")' "$FRAMEWORK/runner/src/desktop/host_main.c"

      - name: Scaffold and inject presentation probe
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/racer-presentation-acceptance"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay \
              --no-github --no-submodules --generate --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          python3 tools/apply_native_racer_presentation_probe.py "$ROOT"

          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF \
            -DUR_RECOMP_SOURCE_ROOT="$GITHUB_WORKSPACE"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Run Original and HD draw-frame acceptance routes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/racer-presentation-acceptance/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"
          INPUT="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"
          ORIGINAL_A_LOG="$RUNNER_TEMP/racer-original-a.log"
          ORIGINAL_B_LOG="$RUNNER_TEMP/racer-original-b.log"
          HD_LOG="$RUNNER_TEMP/racer-hd.log"
          ORIGINAL_A_DUMPS="$RUNNER_TEMP/racer-original-a-dumps"
          ORIGINAL_B_DUMPS="$RUNNER_TEMP/racer-original-b-dumps"
          HD_DUMPS="$RUNNER_TEMP/racer-hd-dumps"
          ORIGINAL_A_SHOT="$RUNNER_TEMP/racer-original-a-1220.ppm"
          ORIGINAL_B_SHOT="$RUNNER_TEMP/racer-original-b-1220.ppm"
          HD_SHOT="$RUNNER_TEMP/racer-hd-1220.ppm"
          mkdir -p "$ORIGINAL_A_DUMPS" "$ORIGINAL_B_DUMPS" "$HD_DUMPS"

          run_route() {
            local mode="$1" log="$2" dumps="$3" shot="$4"
            shift 4
            set +e
            env "$@" \
              SNESRECOMP_DUMP_DIR="$dumps" \
              SNESRECOMP_INPUT_FILE="$INPUT" \
              SNESRECOMP_SCREENSHOT="$shot" \
              SNESRECOMP_SCREENSHOT_FRAME=1220 \
              SDL_AUDIODRIVER=dummy \
              timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" >"$log" 2>&1
            local status=$?
            set -e
            cat "$log"
            if [ "$status" -ne 0 ]; then
              echo "::error::$mode native route exited with status $status"
              exit "$status"
            fi
          }

          run_route Original-A "$ORIGINAL_A_LOG" "$ORIGINAL_A_DUMPS" "$ORIGINAL_A_SHOT"
          run_route Original-B "$ORIGINAL_B_LOG" "$ORIGINAL_B_DUMPS" "$ORIGINAL_B_SHOT"
          run_route HD "$HD_LOG" "$HD_DUMPS" "$HD_SHOT" UR_RACER_HD=1

          for stem in original-a original-b hd; do
            python3 tools/summarize_racer_semantic_trace.py \
              "$RUNNER_TEMP/racer-$stem.log" \
              --json-out "$RUNNER_TEMP/racer-$stem-semantic-trace.json" \
              > "$RUNNER_TEMP/racer-$stem-semantic-trace.txt"
          done

          python3 tools/build_racer_hd_asset_dossier.py \
            "$ROM" \
            --trace "$RUNNER_TEMP/racer-hd-semantic-trace.json" \
            --window-start 1205 \
            --window-end 1220 \
            --output-dir "$RUNNER_TEMP/racer-hd-asset-dossier" \
            > "$RUNNER_TEMP/racer-hd-asset-dossier.txt"

          python3 tools/build_racer_pose_equivalence.py \
            "$RUNNER_TEMP/racer-hd-asset-dossier/manifest.json" \
            --out "$RUNNER_TEMP/racer-hd-asset-dossier/pose-equivalence.json" \
            > "$RUNNER_TEMP/racer-hd-pose-equivalence.txt"

          python3 tools/build_racer_hd_shipping_readiness.py \
            "$RUNNER_TEMP/racer-hd-asset-dossier/pose-equivalence.json" \
            --decisions analysis/data/racer-hd-art-approval.json \
            --out "$RUNNER_TEMP/racer-hd-asset-dossier/shipping-readiness.json" \
            > "$RUNNER_TEMP/racer-hd-shipping-readiness.txt"

          python3 tools/build_racer_hd_review_packet.py \
            "$RUNNER_TEMP/racer-hd-asset-dossier/manifest.json" \
            "$RUNNER_TEMP/racer-hd-asset-dossier/pose-equivalence.json" \
            --output-dir "$RUNNER_TEMP/racer-hd-asset-dossier/review" \
            --original-frame "$ORIGINAL_A_SHOT" \
            --hd-frame "$HD_SHOT" \
            --readiness "$RUNNER_TEMP/racer-hd-asset-dossier/shipping-readiness.json" \
            > "$RUNNER_TEMP/racer-hd-review-packet.txt"

          python3 - "$RUNNER_TEMP/racer-hd-asset-dossier/manifest.json" "$RUNNER_TEMP/racer-hd-asset-dossier/pose-equivalence.json" "$RUNNER_TEMP/racer-hd-asset-dossier/review/review-manifest.json" "$RUNNER_TEMP/racer-hd-asset-dossier/shipping-readiness.json" <<'PY'
          import json, pathlib, sys
          dossier = json.loads(pathlib.Path(sys.argv[1]).read_text())
          equivalence = json.loads(pathlib.Path(sys.argv[2]).read_text())
          review_packet = json.loads(pathlib.Path(sys.argv[3]).read_text())
          readiness = json.loads(pathlib.Path(sys.argv[4]).read_text())
          assert dossier["temporal_window"] == {
              "start": 1205,
              "end": 1220,
              "frame_count": 16,
              "source": "registered_composition_coverage from deterministic native semantic trace",
              "all_frames_exactly_registered": True,
          }
          assert dossier["validation"]["ready_for_art_review"] is True
          assert dossier["validation"]["registered_anchors_match_rederived_stock"] is True
          assert dossier["remaining_scope"]["shipping_art_approved"] is False
          assert dossier["representations"]
          assert all(
              rep["art_review"]["evidence_packet_ready"]
              and not rep["art_review"]["shipping_art_approved"]
              and "lighting_space" in rep["art_review"]["resolved_decisions"]
              and "edge_treatment" in rep["art_review"]["resolved_decisions"]
              and "material_classes" in rep["art_review"]["resolved_decisions"]
              and "cast_shadow_policy" in rep["art_review"]["resolved_decisions"]
              and "micro_detail_policy" in rep["art_review"]["resolved_decisions"]
              and "specular_highlight_policy" in rep["art_review"]["resolved_decisions"]
              and rep["art_review"]["pending_decisions"] == []
              and rep["stock_evidence"]["opaque_rgba_histogram"]
              for rep in dossier["representations"]
          )
          authored = [
              rep for rep in dossier["representations"]
              if rep["art_review"]["authored_candidate"] is not None
          ]
          assert len(authored) == 14
          authored_by_id = {rep["representation_id"]: rep for rep in authored}
          assert equivalence["semantic_representation_count"] == 14
          assert equivalence["unique_stock_pose_count"] == 10
          assert equivalence["semantic_registrations_collapsed_by_visual_equivalence"] == 4
          assert equivalence["worklist"]["authored_pose_count"] == 10
          assert equivalence["worklist"]["unauthored_pose_count"] == 0
          assert equivalence["worklist"]["unauthored_pose_ids"] == []
          assert equivalence["worklist"]["conflicting_authored_pose_count"] == 0
          assert equivalence["worklist"]["duplicate_authored_groups"] == []
          assert review_packet["semantic_representation_count"] == 14
          assert review_packet["unique_pose_count"] == 10
          assert review_packet["authored_pose_count"] == 10
          assert review_packet["unauthored_pose_count"] == 0
          assert review_packet["authored_conflict_count"] == 0
          assert len(review_packet["poses"]) == 10
          assert readiness["unique_pose_count"] == 10
          assert readiness["shipping_ready"] is False
          assert readiness["counts"] == {
              "approved": 0,
              "needs_refinement": 2,
              "rejected": 0,
              "unreviewed": 0,
              "changed_since_review": 8,
              "unauthored": 0,
              "authored_conflicts": 0,
          }
          assert review_packet["shipping_readiness"] == {
              "shipping_ready": False,
              "counts": readiness["counts"],
          }
          assert review_packet["live_reference"]["original_dimensions"] == [256, 224]
          assert review_packet["live_reference"]["hd_dimensions"] == [1024, 896]
          review_root = pathlib.Path(sys.argv[3]).parent
          assert (review_root / "index.html").is_file()
          assert (review_root / "live-original.png").is_file()
          assert (review_root / "live-hd.png").is_file()

          baseline = authored_by_id["ordinary-racer-0x0541-p1-sync-reference"]
          candidate = baseline["art_review"]["authored_candidate"]
          assert candidate["approval_status"] == (
              "true-density refinement pass 1: structural fork/spoke detail; still needs shipping-art refinement"
          )
          review = candidate["gameplay_scale_review"]
          assert review["stock_alpha_bounds"] == [22, 3, 39, 38]
          assert review["candidate_alpha_bounds"] == [22, 3, 39, 38]
          assert review["candidate_contact_x2_y2"] == [61, 76]
          assert review["alpha_intersection_pixels"] == 248
          assert review["alpha_union_pixels"] == 359
          assert abs(review["alpha_iou"] - 0.6908077994428969) < 1e-12

          predecessor = authored_by_id[
              "ordinary-racer-0x0541-p1-companion-0D2D-reference"
          ]
          neighbor = predecessor["art_review"]["authored_candidate"]
          assert neighbor["approval_status"] == (
              "true-density refinement pass 1: shared structural fork/spoke detail; still needs shipping-art refinement"
          )
          neighbor_review = neighbor["gameplay_scale_review"]
          assert neighbor_review["stock_alpha_bounds"] == [22, 2, 39, 38]
          assert neighbor_review["candidate_alpha_bounds"] == [22, 2, 39, 38]
          assert neighbor_review["candidate_contact_x2_y2"] == [61, 76]
          assert neighbor_review["alpha_intersection_pixels"] == 254
          assert neighbor_review["alpha_union_pixels"] == 361
          assert abs(neighbor_review["alpha_iou"] - 0.703601108033241) < 1e-12

          reversed = authored_by_id[
              "ordinary-racer-0x0540-p1-predecessor-reference"
          ]
          reversed_candidate = reversed["art_review"]["authored_candidate"]
          assert reversed_candidate["approval_status"] == (
              "motion-reviewed reversed predecessor; not approved shipping art"
          )
          reversed_review = reversed_candidate["gameplay_scale_review"]
          assert reversed_review["stock_alpha_bounds"] == [23, 2, 40, 38]
          assert reversed_review["candidate_alpha_bounds"] == [23, 2, 40, 38]
          assert reversed_review["candidate_contact_x2_y2"] == [63, 76]
          assert reversed_review["candidate_opaque_pixels"] == 305
          assert reversed_review["stock_opaque_pixels"] == 330
          assert reversed_review["alpha_intersection_pixels"] == 270
          assert reversed_review["alpha_union_pixels"] == 365
          assert abs(reversed_review["alpha_iou"] - 0.7397260273972602) < 1e-12

          reused = authored_by_id[
              "ordinary-racer-0x0540-p1-companion-0D2C-with-p2-0542-reference"
          ]
          reused_candidate = reused["art_review"]["authored_candidate"]
          assert reused_candidate["approval_status"] == (
              "accepted context-safe reuse of motion-reviewed frame-1218 asset; not approved shipping art"
          )
          reused_review = reused_candidate["gameplay_scale_review"]
          assert reused_review == reversed_review
          assert reused["stock_evidence"]["rgba_sha256"] == reversed["stock_evidence"]["rgba_sha256"]
          assert reused_candidate["rgba_sha256"] == reversed_candidate["rgba_sha256"]

          repeated = authored_by_id[
              "ordinary-racer-0x057f-p1-with-p2-0542-companion-0D4A-reference"
          ]
          repeated_candidate = repeated["art_review"]["authored_candidate"]
          assert repeated_candidate["approval_status"] == (
              "true-density refinement pass 1: shifted/narrowed saddle mass; still needs shipping-art refinement"
          )
          assert repeated["observed_frames_in_window"] == [1215, 1216]
          repeated_review = repeated_candidate["gameplay_scale_review"]
          assert repeated_review["stock_alpha_bounds"] == [22, 2, 41, 38]
          assert repeated_review["candidate_alpha_bounds"] == [22, 2, 41, 38]
          assert repeated_review["candidate_contact_x2_y2"] == [65, 76]
          assert repeated_review["stock_opaque_pixels"] == 327
          assert repeated_review["candidate_opaque_pixels"] == 315
          assert repeated_review["alpha_intersection_pixels"] == 263
          assert repeated_review["alpha_union_pixels"] == 379
          assert abs(repeated_review["alpha_iou"] - 0.6939313984168866) < 1e-12

          repeated_057e = authored_by_id[
              "ordinary-racer-0x057E-p1-with-p2-0543-reference"
          ]
          repeated_057e_candidate = repeated_057e["art_review"]["authored_candidate"]
          assert repeated_057e_candidate["approval_status"] == (
              "true-density refinement pass 1: shifted/narrowed saddle mass; still needs shipping-art refinement"
          )
          assert repeated_057e["observed_frames_in_window"] == [1205, 1206, 1213, 1214]
          repeated_057e_review = repeated_057e_candidate["gameplay_scale_review"]
          assert repeated_057e_review["stock_alpha_bounds"] == [21, 2, 42, 38]
          assert repeated_057e_review["candidate_alpha_bounds"] == [21, 2, 42, 38]
          assert repeated_057e_review["candidate_contact_x2_y2"] == [67, 76]
          assert repeated_057e_review["stock_opaque_pixels"] == 325
          assert repeated_057e_review["candidate_opaque_pixels"] == 317
          assert repeated_057e_review["alpha_intersection_pixels"] == 252
          assert repeated_057e_review["alpha_union_pixels"] == 390
          assert abs(repeated_057e_review["alpha_iou"] - 0.6461538461538462) < 1e-12

          p2_baseline = authored_by_id[
              "ordinary-racer-0x0540-p2-sync-reference"
          ]
          p2_baseline_candidate = p2_baseline["art_review"]["authored_candidate"]
          assert p2_baseline_candidate["approval_status"] == (
              "motion-reviewed P2 baseline; not approved shipping art"
          )
          p2_baseline_review = p2_baseline_candidate["gameplay_scale_review"]
          assert p2_baseline_review["stock_alpha_bounds"] == [23, 3, 40, 38]
          assert p2_baseline_review["candidate_alpha_bounds"] == [23, 3, 40, 38]
          assert p2_baseline_review["candidate_contact_x2_y2"] == [63, 76]
          assert p2_baseline_review["stock_opaque_pixels"] == 323
          assert p2_baseline_review["candidate_opaque_pixels"] == 304
          assert p2_baseline_review["alpha_intersection_pixels"] == 266
          assert p2_baseline_review["alpha_union_pixels"] == 361
          assert abs(p2_baseline_review["alpha_iou"] - 0.7368421052631579) < 1e-12

          p2_reused = authored_by_id[
              "ordinary-racer-0x0540-p2-with-p1-companion-0D2D-reference"
          ]
          p2_reused_candidate = p2_reused["art_review"]["authored_candidate"]
          assert p2_reused_candidate["approval_status"] == (
              "accepted context-safe reuse of motion-reviewed P2 baseline; not approved shipping art"
          )
          assert p2_reused_candidate["reuse_source_representation_id"] == (
              "ordinary-racer-0x0540-p2-sync-reference"
          )
          assert p2_reused["stock_evidence"]["rgba_sha256"] == p2_baseline["stock_evidence"]["rgba_sha256"]
          assert p2_reused["stock_evidence"]["png_sha256"] == p2_baseline["stock_evidence"]["png_sha256"]
          assert p2_reused_candidate["rgba_sha256"] == p2_baseline_candidate["rgba_sha256"]
          assert p2_reused_candidate["png_sha256"] == p2_baseline_candidate["png_sha256"]
          assert p2_reused_candidate["gameplay_scale_review"] == p2_baseline_review

          p2_predecessor = authored_by_id[
              "ordinary-racer-0x0541-p2-predecessor-reference"
          ]
          p2_predecessor_candidate = p2_predecessor["art_review"]["authored_candidate"]
          assert p2_predecessor_candidate["approval_status"] == (
              "true-density refinement pass 1: shifted/narrowed bridge saddle; still needs shipping-art refinement"
          )
          p2_predecessor_review = p2_predecessor_candidate["gameplay_scale_review"]
          assert p2_predecessor["observed_frames_in_window"] == [1218]
          assert p2_predecessor_review["stock_alpha_bounds"] == [22, 3, 39, 38]
          assert p2_predecessor_review["candidate_alpha_bounds"] == [22, 3, 39, 38]
          assert p2_predecessor_review["candidate_contact_x2_y2"] == [61, 76]
          assert p2_predecessor_review["stock_opaque_pixels"] == 318
          assert p2_predecessor_review["candidate_opaque_pixels"] == 294
          assert p2_predecessor_review["alpha_intersection_pixels"] == 252
          assert p2_predecessor_review["alpha_union_pixels"] == 360
          assert abs(p2_predecessor_review["alpha_iou"] - 0.7) < 1e-12

          p2_0542 = authored_by_id[
              "ordinary-racer-0x0542-p2-with-p1-companion-0D2C-reference"
          ]
          p2_0542_candidate = p2_0542["art_review"]["authored_candidate"]
          assert p2_0542_candidate["approval_status"] == (
              "true-density refinement pass 1: lower-right brace/spoke detail; still needs shipping-art refinement"
          )
          p2_0542_review = p2_0542_candidate["gameplay_scale_review"]
          assert p2_0542["observed_frames_in_window"] == [1217]
          assert p2_0542_review["stock_alpha_bounds"] == [21, 4, 40, 38]
          assert p2_0542_review["candidate_alpha_bounds"] == [21, 4, 40, 38]
          assert p2_0542_review["candidate_contact_x2_y2"] == [59, 76]
          assert p2_0542_review["stock_opaque_pixels"] == 325
          assert p2_0542_review["candidate_opaque_pixels"] == 343
          assert p2_0542_review["alpha_intersection_pixels"] == 276
          assert p2_0542_review["alpha_union_pixels"] == 392
          assert abs(p2_0542_review["alpha_iou"] - 0.7040816326530612) < 1e-12

          p2_0542_reuse = authored_by_id[
              "ordinary-racer-0x0542-p2-with-p1-057F-companion-0D4A-reference"
          ]
          p2_0542_reuse_candidate = p2_0542_reuse["art_review"]["authored_candidate"]
          assert p2_0542_reuse_candidate["approval_status"] == (
              "context-safe reuse of refined P2 0542 asset; still needs shipping-art refinement"
          )
          assert p2_0542_reuse_candidate["reuse_source_representation_id"] == (
              "ordinary-racer-0x0542-p2-with-p1-companion-0D2C-reference"
          )
          assert p2_0542_reuse["stock_evidence"]["rgba_sha256"] == p2_0542["stock_evidence"]["rgba_sha256"]
          assert p2_0542_reuse["stock_evidence"]["png_sha256"] == p2_0542["stock_evidence"]["png_sha256"]
          assert p2_0542_reuse_candidate["rgba_sha256"] == p2_0542_candidate["rgba_sha256"]
          assert p2_0542_reuse_candidate["png_sha256"] == p2_0542_candidate["png_sha256"]
          assert p2_0542_reuse_candidate["gameplay_scale_review"] == p2_0542_review

          p2_0543 = authored_by_id[
              "ordinary-racer-0x0543-p2-adjacent-reference"
          ]
          p2_0543_candidate = p2_0543["art_review"]["authored_candidate"]
          assert p2_0543_candidate["approval_status"] == (
              "true-density refinement pass 1: lower-right brace/spoke detail; still needs shipping-art refinement"
          )
          p2_0543_review = p2_0543_candidate["gameplay_scale_review"]
          assert p2_0543["observed_frames_in_window"] == [1207, 1208, 1209, 1210, 1211, 1212]
          assert p2_0543_review["stock_alpha_bounds"] == [20, 4, 40, 38]
          assert p2_0543_review["candidate_alpha_bounds"] == [20, 4, 40, 38]
          assert p2_0543_review["candidate_contact_x2_y2"] == [57, 76]
          assert p2_0543_review["stock_opaque_pixels"] == 319
          assert p2_0543_review["candidate_opaque_pixels"] == 340

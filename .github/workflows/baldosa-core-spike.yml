            --out "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1872.json"
          python3 - "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1856.json" \
            "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1872.json" <<'PY'
          import json, pathlib, sys
          first, next_frame = [
              json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
              for name in sys.argv[1:]
          ]
          assert first["guest_frame"] == 1856 and first["status"] == "passed", first
          assert next_frame["guest_frame"] == 1872
          assert first["stock_ppu_sha256"] != next_frame["stock_ppu_sha256"], (
              "No independent moving 342-wide source frame"
          )
          print(
              "UR_BALDOSA_WIDE_MOVING_SOURCE PASS "
              f"reference=1856 moving=1872 "
              f"second_status={next_frame['status']} "
              f"second_top_overlap={next_frame['source_overlap_pairs']['98-99']} "
              f"second_bottom_overlap={next_frame['source_overlap_pairs']['96-97']} "
              f"second_source={next_frame['source_alpha_total_across_slots']}"
          )
          PY
          echo "PASS: exact frame-1872 source-OBJ slot provenance across same four source-wide native guest processes" >> "$GITHUB_STEP_SUMMARY"
          # Reuse the pure QA-08 temporal model: capture evidence from the
          # two independently checked source frames already produced above.
          # Changes in slot overlap/RGB are observations, not permission to
          # remove sprites in production. No fifth route or renderer.
          python3 tools/compare_baldosa_wide_obj_frames.py \
            --before "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1856.json" \
            --after "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1872.json" \
            --out "$RUNNER_TEMP/baldosa-evidence/ws342_obj_temporal_1856_1872.json"
          python3 - "$RUNNER_TEMP/baldosa-evidence/ws342_obj_temporal_1856_1872.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["status"] == "observed-not-admitted", data
          assert data["frames"] == [1856, 1872], data
          assert data["safe_to_destructively_replace_original_obj"] is False, data
          assert data["source_pair_overlap_deltas"]["98-99"]["before"] > 0, data
          assert data["source_pair_overlap_deltas"]["96-97"]["before"] > 0, data
          for slot in ("96", "97", "98", "99"):
              assert slot in data["slot_source_deltas"], slot
          print("UR_BALDOSA_WIDE_TEMPORAL_CONTRACT PASS "
                f"frames={data['frames']} "
                "source_provenance=4slots-per-frame safe_hd_admission=0")
          PY
          echo "PASS: independently checked 342-wide moving source temporal deltas retained with conservative HD admission=0" >> "$GITHUB_STEP_SUMMARY"
          # Third temporally distinct 342-wide original source frame.
          # Preserve the exact 1888 per-slot reports and take the next
          # independent step through the already-approved read-only model.
          python3 tools/analyze_baldosa_wide_obj_overlap.py \
            --main-pam "$RUNNER_TEMP/baldosa-ws342-captures/ur-baldosa-ws342-001888.pam" \
            --slot-dir "$RUNNER_TEMP/baldosa-ws342-obj-slots" \
            --reports "$RUNNER_TEMP/baldosa-evidence" \
            --frame 1888 --record-only \
            --out "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1888.json"
          python3 tools/compare_baldosa_wide_obj_frames.py \
            --before "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1872.json" \
            --after "$RUNNER_TEMP/baldosa-evidence/ws342_obj_overlap_frame1888.json" \
            --out "$RUNNER_TEMP/baldosa-evidence/ws342_obj_temporal_1872_1888.json"
          python3 - "$RUNNER_TEMP/baldosa-evidence/ws342_obj_temporal_1856_1872.json" \
            "$RUNNER_TEMP/baldosa-evidence/ws342_obj_temporal_1872_1888.json" <<'PY'
          import json, pathlib, sys
          first, second = [
              json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
              for name in sys.argv[1:]
          ]
          assert first["status"] == second["status"] == "observed-not-admitted"
          assert first["frames"] == [1856, 1872] and second["frames"] == [1872, 1888]
          assert first["safe_to_destructively_replace_original_obj"] is False
          assert second["safe_to_destructively_replace_original_obj"] is False
          for slot in ("96", "97", "98", "99"):
              assert slot in first["slot_source_deltas"]
              assert slot in second["slot_source_deltas"]
          print("UR_BALDOSA_WIDE_THREE_FRAME_SOURCE PASS "
                "frames=1856:1872:1888 all_four_source_slots=1 "
                f"first_overlap_delta={first['source_multi_slot_delta']} "
                f"second_overlap_delta={second['source_multi_slot_delta']} "
                "safe_hd_admission=0")
          PY
          echo "PASS: three moving source frames, exact main-frame hashes and original guest CRCs; no destructive HD capture" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize executable evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Baldosa pinned executable experiment'
            echo ''
            echo '- AOT game: `10b864b9d14a7b7416dd909eb7b054c88faef101`'
            echo '- SNESRecomp: `075fbe4c8e0d97b0013be541795c39cb644a9709`'
            echo '- Compatibility: SDL2 desktop fallback. No modifications to either upstream revision.'
            echo '- ROM: exact USA SHA256; each route has isolated SRAM.'
            echo '- **Route exit codes are only smoke evidence**, not full original/native game-result parity.'
            echo ''
            for name in race_1p race_2p_split zoomzoo_progress; do
              p="$RUNNER_TEMP/baldosa-evidence/$name.exit"
              if test -f "$p"; then echo "- $name: exit $(cat "$p")"
              else echo "- $name: not executed"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"


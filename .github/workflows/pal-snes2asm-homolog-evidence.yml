name: One-shot PAL homolog-alignment evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/align_pal_snes2asm_windows.py"
      - "tests/unit/test_align_pal_snes2asm_windows.py"
      - ".github/workflows/pal-snes2asm-homolog-evidence.yml"
  workflow_dispatch:

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Rescore aligned snes2asm windows
        run: python3 tools/align_pal_snes2asm_windows.py
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_align_pal_snes2asm_windows -v
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/pal-snes2asm-homolog-alignment.json analysis/generated/pal-snes2asm-homolog-alignment.md
          git diff --cached --quiet || git commit -m "analysis: record PAL homolog-aligned snes2asm evidence"
          git push origin HEAD:${{ github.head_ref }}

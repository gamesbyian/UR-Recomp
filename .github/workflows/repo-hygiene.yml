name: Repository hygiene

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/README.md"
      - "docs/SYMBOLS.md"
      - "docs/PERIODIC-REPOSITORY-HYGIENE.md"
      - "docs/TOOL-INTEROPERABILITY.md"
      - "reference/**"
      - "analysis/generated/symbols.json"
      - "analysis/generated/*-symbols*"
      - "third_party/**"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check repository boundaries and generated surfaces
        run: python3 tools/check_repo_hygiene.py
      - name: Advisory actionlint for changed workflow files
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Query the complete PR file census; avoid a large checkout-history fetch.
          # An API failure must not masquerade as "no changed workflows".
          pr_files="$RUNNER_TEMP/actionlint-pr-files.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$pr_files"
          mapfile -t discovered < <(
            grep -E '^\.github/workflows/[^/]+\.ya?ml$' "$pr_files" || true
          )
          # A deleted YAML file no longer exists in the checkout.
          changed=()
          for path in "${discovered[@]}"; do
            if [[ -f "$path" ]]; then
              changed+=("$path")
            fi
          done
          if (( ${#changed[@]} == 0 )); then
            echo "No workflow definitions changed; actionlint not needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=1.7.12
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$tarball"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$tarball" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "### actionlint: changed workflow definitions" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${changed[@]}" >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -oneline "${changed[@]}"

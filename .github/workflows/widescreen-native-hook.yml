name: Native Widescreen runtime hook

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/widescreen-native-hook.yml"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/inspect_native_widescreen_prep_anchor.py"
      - "tools/apply_native_widescreen_hook.py"
      - "tools/patch_widescreen_probe_host.py"
      - "tests/unit/test_widescreen_probe_host_patch.py"
      - "tools/analyze_native_widescreen_hook_acceptance.py"
      - "tools/analyze_widescreen_plus16_capacity_acceptance.py"
      - "tools/build_widescreen_shadow_oracle.py"
      - "tests/unit/test_build_widescreen_shadow_oracle.py"
      - "tools/analyze_native_widescreen_reachability.py"
      - "tests/unit/test_seed_native_widescreen_aot.py"
      - "tests/unit/test_inspect_native_widescreen_prep_anchor.py"
      - "tests/unit/test_apply_native_widescreen_hook.py"
      - "tests/unit/test_analyze_native_widescreen_hook_acceptance.py"
      - "tests/unit/test_analyze_native_widescreen_reachability.py"
      - "tests/input/preparation-emission-race.script"
      - "tests/input/preparation-emission-race-oracle.script"
      - "tests/input/object-liveness-dragster.script"
      - "tools/summarize_object_liveness_probe.py"

concurrency:
  group: widescreen-native-hook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Run focused unit coverage
        run: |
          python3 -m unittest \
            tests.unit.test_seed_native_widescreen_aot \
            tests.unit.test_inspect_native_widescreen_prep_anchor \
            tests.unit.test_apply_native_widescreen_hook \
            tests.unit.test_widescreen_probe_host_patch \
            tests.unit.test_analyze_native_widescreen_hook_acceptance \
            tests.unit.test_analyze_widescreen_plus16_capacity_acceptance \
            tests.unit.test_build_widescreen_shadow_oracle \
            tests.unit.test_analyze_native_widescreen_reachability

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Report preparation-entry call references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          python3 tools/analyze_native_widescreen_reachability.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --json-out analysis/generated/widescreen-native-reachability.json \
            --md-out analysis/generated/widescreen-native-reachability.md
          cat analysis/generated/widescreen-native-reachability.md

      - name: Generate native project and seed preparation wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
            --rom "$ROM" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --no-submodules \
            --generate \
            --no-build
          PROJECT="$ROOT/UniracersSNESRecomp"
          python3 tools/seed_native_widescreen_aot.py "$PROJECT/recomp"
          python3 "$FRAMEWORK/snesrecomp_cli.py" generate \
            --rom "$ROM" \
            --project-root "$PROJECT" \
            --cfg-dir recomp \
            --out-dir src/gen \
            --funcs-h recomp/funcs.h \
            --cfg-roots
          test -d "$PROJECT/src/gen"
          python3 tools/patch_widescreen_probe_host.py "$PROJECT/src/main.c"

      - name: Inspect and apply accepted preparation hook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          python3 tools/inspect_native_widescreen_prep_anchor.py \
            "$PROJECT/src/gen" \
            --radius 48 \
            --json-out analysis/generated/widescreen-native-prep-anchor.json \
            --md-out analysis/generated/widescreen-native-prep-anchor.md
          python3 tools/apply_native_widescreen_hook.py \
            "$PROJECT/src/gen" \
            --json-out analysis/generated/widescreen-native-hook-apply.json
          cat analysis/generated/widescreen-native-prep-anchor.md
          cat analysis/generated/widescreen-native-hook-apply.json

      - name: Build hooked native target
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          python3 "$GITHUB_WORKSPACE/tools/bootstrap_toolchain.py" --offline --tool sdl3 --clone-only
          cmake -S "$PROJECT" -B "$PROJECT/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$PROJECT/build" -j2
          test -x "$PROJECT/build/UniracersSNESRecomp"

      - name: Capture independent later-stock oracle
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          EXE="$PROJECT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race-oracle.script"
          ROOT="$RUNNER_TEMP/ws-native-runs/oracle"
          mkdir -p "$ROOT/dumps"
          SDL_AUDIODRIVER=dummy \
          URRECOMP_WS_MARGIN=0 \
          URRECOMP_WS_NATIVE_TRACE=1 \
          SNESRECOMP_DUMP_DIR="$ROOT/dumps" \
          timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            >"$ROOT/run.log" 2>&1
          python3 tools/build_widescreen_shadow_oracle.py \
            "$ROOT/run.log" "$ROOT/stock-strips.txt"
          test -s "$ROOT/stock-strips.txt"

      - name: Exercise stock and Widescreen depth sweep
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          EXE="$PROJECT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-native-runs"
          ORACLE="$ROOT/oracle/stock-strips.txt"
          mkdir -p "$ROOT"

          for margin in 0 8 16 24 32 48 64 72; do
            OUT="$ROOT/$margin"
            mkdir -p "$OUT/dumps" "$OUT/frames"
            echo "== native Widescreen margin $margin =="
            SDL_AUDIODRIVER=dummy \
            URRECOMP_WS_MARGIN="$margin" \
            URRECOMP_WS_NATIVE_TRACE=1 \
            SNESRECOMP_DUMP_DIR="$OUT/dumps" \
            SNESRECOMP_FRAMEDUMP_PIXELS=1 \
            SNESRECOMP_FRAMEDUMP_START=300 \
            SNESRECOMP_FRAMEDUMP_END=300 \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              --framedump "$OUT/frames" >"$OUT/run.log" 2>&1
            test -s "$OUT/dumps/prep-emission-after-scroll.wram.bin"
            tail -n 30 "$OUT/run.log" || true
          done

      - name: Exercise accepted Authentic 16:9 policy binding
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          EXE="$PROJECT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          OUT="$RUNNER_TEMP/ws-native-runs/policy-authentic-16x9"
          mkdir -p "$OUT/dumps" "$OUT/frames" analysis/generated
          SDL_AUDIODRIVER=dummy \
          URRECOMP_WS_VIEW=authentic-16x9 \
          URRECOMP_WS_SCENE=representative-one-player-race \
          URRECOMP_WS_NATIVE_TRACE=1 \
          SNESRECOMP_DUMP_DIR="$OUT/dumps" \
          SNESRECOMP_FRAMEDUMP_PIXELS=1 \
          SNESRECOMP_FRAMEDUMP_START=300 \
          SNESRECOMP_FRAMEDUMP_END=300 \
          timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            --framedump "$OUT/frames" >"$OUT/run.log" 2>&1
          grep -q "URWS_PREP_EXT margin=48" "$OUT/run.log"
          grep -q "URWS_SHADOW_EXT provider=course-runtime margin=48" "$OUT/run.log"

          FIXED_OUT="$RUNNER_TEMP/ws-native-runs/policy-title-frontend"
          mkdir -p "$FIXED_OUT/frames"
          SDL_AUDIODRIVER=dummy \
          URRECOMP_WS_VIEW=authentic-16x9 \
          URRECOMP_WS_SCENE=title-frontend \
          SNESRECOMP_FRAMEDUMP_PIXELS=1 \
          SNESRECOMP_FRAMEDUMP_START=300 \
          SNESRECOMP_FRAMEDUMP_END=300 \
          timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            --framedump "$FIXED_OUT/frames" >"$FIXED_OUT/run.log" 2>&1

          python3 - "$RUNNER_TEMP/ws-native-runs/0/frames/frame_000300.bmp" \
            "$OUT/frames/frame_000300.bmp" \
            "$FIXED_OUT/frames/frame_000300.bmp" \
            analysis/generated/widescreen-host-viewport-binding.json <<'PY'
          import json, pathlib, struct, sys

          def dimensions(path):
              data=pathlib.Path(path).read_bytes()
              if data[:2] != b"BM" or len(data) < 26:
                  raise SystemExit(f"{path}: not a retained BMP")
              width=struct.unpack_from("<i", data, 18)[0]
              height=abs(struct.unpack_from("<i", data, 22)[0])
              return width, height

          control=dimensions(sys.argv[1])
          candidate=dimensions(sys.argv[2])
          fixed_center=dimensions(sys.argv[3])
          accepted=(
              control==(256,224)
              and candidate==(342,224)
              and fixed_center==(256,224)
          )
          out={
              "schema_version":2,
              "selector":"authentic-16x9",
              "scene_selector":"URRECOMP_WS_SCENE",
              "provider_margin_pixels_per_side":48,
              "stock_control":{"frame_width":control[0],"frame_height":control[1]},
              "widened_race":{"frame_width":candidate[0],"frame_height":candidate[1]},
              "fixed_center_control":{"frame_width":fixed_center[0],"frame_height":fixed_center[1]},
              "widen_allowed_scenes":[
                  "representative-one-player-race",
                  "two-player-race",
              ],
              "output_composition":{
                  "authentic_pixel_aspect":"7:6",
                  "widened_horizontal_fit_correction":"512/513",
                  "fixed_center_width_fraction_at_full_height":"3/4",
              },
              "accepted":accepted,
          }
          pathlib.Path(sys.argv[4]).write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          if not out["accepted"]:
              raise SystemExit("named Widescreen scene policy did not bind expected host composition")
          PY

      - name: Prove host presentation depth through +72
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ws-native-runs"
          python3 tools/analyze_widescreen_plus16_capacity_acceptance.py \
            --log-0 "$ROOT/0/run.log" \
            --dump-0 "$ROOT/0/dumps/prep-emission-after-scroll.wram.bin" \
            --log-8 "$ROOT/8/run.log" \
            --dump-8 "$ROOT/8/dumps/prep-emission-after-scroll.wram.bin" \
            --log-16 "$ROOT/16/run.log" \
            --dump-16 "$ROOT/16/dumps/prep-emission-after-scroll.wram.bin" \
            --log-24 "$ROOT/24/run.log" \
            --dump-24 "$ROOT/24/dumps/prep-emission-after-scroll.wram.bin" \
            --log-32 "$ROOT/32/run.log" \
            --dump-32 "$ROOT/32/dumps/prep-emission-after-scroll.wram.bin" \
            --log-48 "$ROOT/48/run.log" \
            --dump-48 "$ROOT/48/dumps/prep-emission-after-scroll.wram.bin" \
            --log-64 "$ROOT/64/run.log" \
            --dump-64 "$ROOT/64/dumps/prep-emission-after-scroll.wram.bin" \
            --log-72 "$ROOT/72/run.log" \
            --dump-72 "$ROOT/72/dumps/prep-emission-after-scroll.wram.bin" \
            --oracle-log "$ROOT/oracle/run.log" \
            --json-out analysis/generated/widescreen-host-depth-acceptance.json \
            --md-out analysis/generated/widescreen-host-depth-acceptance.md
          cat analysis/generated/widescreen-host-depth-acceptance.md

      - name: Prove +16/+24/+64/+72 gameplay and activation invariance
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          EXE="$PROJECT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/object-liveness-dragster.script"
          ROOT="$RUNNER_TEMP/ws-native-liveness"
          mkdir -p "$ROOT/0/dumps" "$ROOT/16/dumps" "$ROOT/24/dumps" "$ROOT/64/dumps" "$ROOT/72/dumps" analysis/generated

          for margin in 0 16 24 64 72; do
            SDL_AUDIODRIVER=dummy \
            URRECOMP_WS_MARGIN="$margin" \
            URRECOMP_WS_NATIVE_TRACE=1 \
            SNESRECOMP_DUMP_DIR="$ROOT/$margin/dumps" \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$ROOT/$margin/run.log" 2>&1
            python3 tools/summarize_object_liveness_probe.py \
              "$ROOT/$margin/dumps" --json-out "$ROOT/$margin/summary.json" \
              >"$ROOT/$margin/summary.txt"
          done

          python3 - "$ROOT/0/summary.json" "$ROOT/16/summary.json" "$ROOT/24/summary.json" "$ROOT/64/summary.json" "$ROOT/72/summary.json" \
            analysis/generated/widescreen-host-depth-liveness.json <<'PY'
          import json, pathlib, sys
          control=json.loads(pathlib.Path(sys.argv[1]).read_text())
          variants={
              "plus16":json.loads(pathlib.Path(sys.argv[2]).read_text()),
              "plus24":json.loads(pathlib.Path(sys.argv[3]).read_text()),
              "plus64":json.loads(pathlib.Path(sys.argv[4]).read_text()),
              "plus72":json.loads(pathlib.Path(sys.argv[5]).read_text()),
          }
          ar={x["stem"]:x for x in control["rows"]}
          results={}
          for label,wide in variants.items():
              br={x["stem"]:x for x in wide["rows"]}
              common=sorted(set(ar)&set(br)); diffs=[]
              for stem in common:
                  x,y=ar[stem],br[stem]
                  protected={
                      "player":({"x":x["player"]["x"],"y":x["player"]["y"]},
                                {"x":y["player"]["x"],"y":y["player"]["y"]}),
                      "camera":(x["camera"],y["camera"]),
                      "progress":(x["progress"],y["progress"]),
                      "object_map_prefix_hex":(x["object_map_prefix_hex"],y["object_map_prefix_hex"]),
                  }
                  bad={k:{"control":u,label:v} for k,(u,v) in protected.items() if u!=v}
                  if bad: diffs.append({"stem":stem,"differences":bad})
              control_change=control["first_progress_change"]
              wide_change=wide["first_progress_change"]
              same_progress_event=(
                  control_change is not None
                  and wide_change is not None
                  and control_change["stem"]==wide_change["stem"]
                  and control_change["progress"]==wide_change["progress"]
              )
              frame_delta=(
                  wide_change["frame"]-control_change["frame"]
                  if same_progress_event else None
              )
              # The scripted capture can enter the same named semantic checkpoint a
              # couple of host frames apart even when guest-visible protected state is
              # identical. PR #310 run 37143761093 reproduced a -2 frame delta for
              # already-accepted +16 on both attempts, while the event identity and all
              # protected samples remained exact. Keep frame phase bounded and visible,
              # but make semantic identity + protected-state equality the hard contract.
              phase_tolerance_frames=2
              results[label]={
                  "common_samples":len(common),
                  "protected_differences":diffs,
                  "first_progress_change":wide_change,
                  "progress_change_frame_delta":frame_delta,
                  "same_semantic_progress_event":same_progress_event,
                  "phase_tolerance_frames":phase_tolerance_frames,
                  "phase_delta_within_tolerance":(
                      frame_delta is not None and abs(frame_delta) <= phase_tolerance_frames
                  ),
                  "semantic_activation_preserved":(
                      not diffs
                      and same_progress_event
                      and frame_delta is not None
                      and abs(frame_delta) <= phase_tolerance_frames
                  ),
              }
          out={
              "control_first_progress_change":control["first_progress_change"],
              "variants":results,
              "accepted":all(x["semantic_activation_preserved"] for x in results.values()),
          }
          pathlib.Path(sys.argv[6]).write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          if not out["accepted"]:
              raise SystemExit("+16/+24/+64/+72 event-relative liveness diverged")
          PY

      - name: Upload compact native-hook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widescreen-native-hook-evidence
          path: |
            analysis/generated/widescreen-native-reachability.json
            analysis/generated/widescreen-native-reachability.md
            analysis/generated/widescreen-native-prep-anchor.json
            analysis/generated/widescreen-native-prep-anchor.md
            analysis/generated/widescreen-native-hook-apply.json
            analysis/generated/widescreen-host-depth-acceptance.json
            analysis/generated/widescreen-host-depth-acceptance.md
            analysis/generated/widescreen-host-depth-liveness.json
            analysis/generated/widescreen-host-viewport-binding.json
            ${{ runner.temp }}/ws-native-runs/0/frames/frame_000300.bmp
            ${{ runner.temp }}/ws-native-runs/policy-authentic-16x9/frames/frame_000300.bmp
            ${{ runner.temp }}/ws-native-runs/policy-title-frontend/frames/frame_000300.bmp
            ${{ runner.temp }}/ws-native-runs/oracle/run.log
            ${{ runner.temp }}/ws-native-runs/oracle/stock-strips.txt
            ${{ runner.temp }}/ws-native-runs/0/run.log
            ${{ runner.temp }}/ws-native-runs/8/run.log
            ${{ runner.temp }}/ws-native-runs/16/run.log
            ${{ runner.temp }}/ws-native-runs/24/run.log
            ${{ runner.temp }}/ws-native-runs/32/run.log
            ${{ runner.temp }}/ws-native-runs/48/run.log
            ${{ runner.temp }}/ws-native-runs/64/run.log
            ${{ runner.temp }}/ws-native-runs/72/run.log
            ${{ runner.temp }}/ws-native-runs/policy-authentic-16x9/run.log
          if-no-files-found: warn
          retention-days: 7

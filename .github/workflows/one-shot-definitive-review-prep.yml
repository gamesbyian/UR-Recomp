name: One-shot independent companion clip review witnesses
on:
  push:
    branches: [media/definitive-trailer-assembly-20261010]
    paths: [.github/workflows/one-shot-definitive-review-prep.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Retrieve exact independently authored PR media blobs
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 8bfb1e9c7e965c902190b78e9199f9f361b4a59b
          git fetch --no-tags --depth=1 origin 8b77797bfc7d183c4bd14703c7ed1ffb9545d19d
          mkdir -p /tmp/ur-review-inputs
          git show 8bfb1e9c7e965c902190b78e9199f9f361b4a59b:media/showcase/2026-10-10/technical-motion/04-machine-code-to-native.mp4 > /tmp/ur-review-inputs/technical.mp4
          git show 8b77797bfc7d183c4bd14703c7ed1ffb9545d19d:media/showcase/art-reconstruction/2026-10-10/01-original-4x-remastered.mp4 > /tmp/ur-review-inputs/art.mp4
          git show 8b77797bfc7d183c4bd14703c7ed1ffb9545d19d:media/showcase/art-reconstruction/2026-10-10/02-animation-archaeology.mp4 > /tmp/ur-review-inputs/archaeology.mp4
      - name: Independently decode, hash and retain nine inspection frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,subprocess,json
          from pathlib import Path
          src=Path('/tmp/ur-review-inputs')
          out=Path('media/showcase/2026-10-10/recruitment/final-approval')
          out.mkdir(parents=True,exist_ok=True)
          roles={
            'technical': {
              'expected':'ca59e2d4aaf2ee4d0e3bc2999603bb9f6c2fed8a7b56389ef16d643029c390a3',
              'frames':270,'ordinals':[30,135,225],
              'links':['docs/QA08-NATIVE-STOCK-CENTER-PARITY-20261010.md',
                       'media/showcase/2026-10-10/technical-motion/04-provenance.json']},
            'art':{
              'expected':'65a7f55b3801576cefcd5c90483cc22a226be277e9c1454ca612f0d320f26ff5',
              'frames':210,'ordinals':[30,105,165],
              'links':['analysis/data/racer-hd-art-approval.json',
                       'media/showcase/art-reconstruction/2026-10-10/provenance.json']},
            'archaeology':{
              'expected':'f04792d2a5d31dfd3b64d115a699500b0eb9c1a66ed82b4472d7de0c7357dd93',
              'frames':210,'ordinals':[30,105,165],
              'links':['analysis/data/racer-hd-replacement-prototype.json',
                       'media/showcase/art-reconstruction/2026-10-10/provenance.json']}
          }
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          record={'schema':'UR-RECRUITMENT-MEDIA-APPROVAL/1',
                  'accepted_by': None,
                  'status':'candidate_pending_independent_media_review',
                  'technical_sha_source_commit':'8bfb1e9c7e965c902190b78e9199f9f361b4a59b',
                  'art_sha_source_commit':'8b77797bfc7d183c4bd14703c7ed1ffb9545d19d',
                  'clips':{}}
          for role,r in roles.items():
              vid=src/(role+'.mp4')
              assert sha(vid)==r['expected'],role
              stream=json.loads(subprocess.check_output([
                 'ffprobe','-v','error','-count_frames','-select_streams','v:0',
                 '-show_entries','stream=width,height,r_frame_rate,nb_read_frames',
                 '-of','json',str(vid)]))['streams'][0]
              assert (stream['width'],stream['height'],stream['r_frame_rate'],int(stream['nb_read_frames']))==(1920,1080,'30/1',r['frames']),role
              snap={}
              for n in r['ordinals']:
                  p=out/f'{role}-decoded-frame-{n:03d}.png'
                  subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
                    '-i',str(vid),'-vf',f'select=eq(n\\,{n})','-vsync','vfr',
                    '-frames:v','1',str(p)],check=True)
                  assert p.stat().st_size>10000
                  snap[p.name]=sha(p)
              record['clips'][role]={
                  'kind':'editorial_graphic',
                  'approved_for_trailer':False,
                  'sha256':r['expected'],
                  'evidence_links':r['links'],
                  'review_frame_sha256':snap,
                  'verified_fps':'30/1',
                  'verified_frames':r['frames']}
          (out/'approval-pending.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          print('INDEPENDENT_SOURCE_DECODING_PASS',json.dumps({k:v['sha256'] for k,v in record['clips'].items()}))
          PY
      - name: Persist candidates and self-retire this temporary CI workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/2026-10-10/recruitment/final-approval/
          git rm -f .github/workflows/one-shot-definitive-review-prep.yml
          git commit -m "media: retain nine independently decoded companion shot review frames"
          git push origin "HEAD:${GITHUB_REF_NAME}"

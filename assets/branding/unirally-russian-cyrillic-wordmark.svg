  <title id="title">Юниралли | Russian Unirally wordmark</title>
  <desc id="desc">Original editable Cyrillic wordmark for the user-supplied Russian title Юниралли (Yuniralli), with playful rounded curves and the established Uniracers yellow fill and diagonally offset black border.</desc>
  <metadata>Original visual adaptation, not a traced historical Russian release logo. Contains all eight Cyrillic letters: Ю н и р а л л и. Letter paths are independent editable cubic Bezier centerlines, no font dependency, no embedded raster.</metadata>

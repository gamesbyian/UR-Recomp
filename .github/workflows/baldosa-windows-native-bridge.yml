      # Shared source-loaded atomic file, lock and run-record policies.
      - "native/product/local_tournament_atomic_replace.hpp"
      - "native/product/local_tournament_launch_path_lock.hpp"
      - "native/product/run_record_capture_policy.hpp"
      # Genuine first-party transitive includes in native Windows UI, SRAM,
      # Practice and Records. A header-only change invalidates native tests.
      - "native/product/completed_run_ghost_target.hpp"
      - "native/product/modern_overlay_composition.hpp"
      - "native/product/modern_overlay_text_fit.hpp"
      - "native/product/modern_stock_menu_palette.hpp"
      - "native/product/modern_text_catalog.hpp"
      - "native/product/modern_text_layout.hpp"
      - "native/product/quick_practice_availability.hpp"
      - "native/product/quick_practice_catalog.hpp"
      - "native/product/quick_practice_picker.hpp"
      - "native/product/quick_practice_selection.hpp"
      - "native/product/regional_presentation.hpp"
      - "native/product/widescreen_output_composition.hpp"
      - "native/product/multiplayer_match_catalog.*"
      - "native/product/multiplayer_match_record.*"
      - "native/product/multiplayer_match_summary.*"
      - "native/product/output_resolution_policy.*"
      - "native/product/race_restart_anchor.*"
      - "native/product/race_restart_lifecycle.*"
      - "native/product/session_control.*"
      - "native/title/uniracers_course_identity.*"
      - "native/title/uniracers_run_data.*"
      - "native/title/uniracers_two_player_result.*"
      - "tools/baldosa_guest_adapter_spike.py"
      - "tools/baldosa_guest_snapshot_probe.*"
      - "tools/baldosa_native_modern_root.*"
      - "tools/baldosa_native_product_execution.*"
      - "tools/baldosa_native_product_pause_authority.*"
      - "tools/baldosa_product_execution_spike.py"
      - "tools/baldosa_uniracers_hdma_firstline_patch.py"
      - "tools/baldosa_uniracers_brightness_pixel_lut_patch.py"
      - "tools/baldosa_qa08_native_ppu_register_trace_patch.py"
      - "tools/baldosa_qa08_native_cgram_port_chronology_patch.py"
      - "tools/baldosa_qa08_native_inidisp_port_trace_patch.py"
      - "tests/unit/test_baldosa_qa08_native_inidisp_port_trace_patch.py"
      - "tests/unit/test_baldosa_qa08_native_cgram_port_chronology_patch.py"
      - "tools/baldosa_qa08_native_firstline_hdma_readonly_patch.py"
      - "tools/baldosa_uniracers_v0_raster_before_hdma_patch.py"
      - "tools/baldosa_qa08_windows_original_capture.cpp"
      - "tools/baldosa_qa08_windows_source_capture_patch.py"
      - "tools/check_qa08_windows_source_raster.py"
      - "tools/qa08_windows_full_oneplayer_source_coverage.py"
      - "tools/qa08_windows_full_twoplayer_source_coverage.py"
      - "tests/unit/test_baldosa_uniracers_hdma_firstline_patch.py"
      - "tests/unit/test_baldosa_uniracers_brightness_pixel_lut_patch.py"
      - "tests/unit/test_baldosa_qa08_native_ppu_register_trace_patch.py"
      - "tests/unit/test_baldosa_qa08_native_firstline_hdma_readonly_patch.py"
      - "tests/unit/test_baldosa_uniracers_v0_raster_before_hdma_patch.py"
      - "tests/unit/test_baldosa_qa08_windows_source_capture.py"
      - "tests/unit/test_qa08_windows_full_oneplayer_source_coverage.py"
      - "tests/unit/test_qa08_windows_full_twoplayer_source_coverage.py"
      - "tests/unit/test_qa08_integrated_graphics_workflow.py"
  workflow_dispatch:
    inputs:
      parallel_journeys:
        description: "Run existing Win32 journeys with two concurrent workers (serial fallback: false)"
        type: boolean
        required: false
        default: false
      qa08_source_capture:
        description: "Opt in to archived 1P/2P original-PPU captures against same Windows PE"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      parallel_journeys:
        description: "Opt in to source-identical two-worker Windows acceptance pilot"
        required: false
        type: boolean
        default: false
      export_campaign_inputs:
        description: "Export the one source-bound Windows executable and ROMless ZIP for manual cohort reuse"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: baldosa-windows-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out owning UR product bridge
        uses: actions/checkout@v4

      - name: Check out exact pinned native AOT and framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Guard guest CRC, pause witness and Modern mutable-root stage
        run: |
          python tests/unit/test_assemble_baldosa_windows_candidate.py
          python tests/unit/test_bind_baldosa_candidate_receipt.py
          python tests/unit/test_audit_baldosa_romless_candidate.py
          python tests/unit/test_check_windows_pe_timestamp.py
          python tests/unit/test_baldosa_windows_native_pause_route.py
          python tests/unit/test_baldosa_uniracers_hdma_firstline_patch.py
          python tests/unit/test_baldosa_uniracers_brightness_pixel_lut_patch.py
          python tests/unit/test_baldosa_qa08_native_ppu_register_trace_patch.py
          python tests/unit/test_baldosa_qa08_native_cgram_port_chronology_patch.py
          python tests/unit/test_baldosa_qa08_native_inidisp_port_trace_patch.py
          python tests/unit/test_baldosa_qa08_native_firstline_hdma_readonly_patch.py
          python tests/unit/test_baldosa_uniracers_v0_raster_before_hdma_patch.py
          python tests/unit/test_baldosa_qa08_windows_source_capture.py
          python tests/unit/test_qa08_windows_full_oneplayer_source_coverage.py
          python tests/unit/test_qa08_windows_full_twoplayer_source_coverage.py
          python tests/unit/test_qa08_integrated_graphics_workflow.py
          python tests/unit/test_baldosa_native_1p_records_probe.py
          python tests/unit/test_baldosa_native_2p_records_probe.py
          python tests/unit/test_baldosa_native_first_profile_cpp.py
          python tests/unit/test_baldosa_native_first_racer_probe.py
          python tests/unit/test_baldosa_native_second_racer_probe.py
          python tests/unit/test_baldosa_native_first_racer_real_run_probe.py
          python tests/unit/test_baldosa_modern_user_data_spike.py
          python tests/unit/test_baldosa_modern_profile_activation_spike.py
          python tests/unit/test_baldosa_modern_options_spike.py
          python tests/unit/test_baldosa_native_options_cpp.py
          python tests/unit/test_baldosa_native_options_probe.py
          python tests/unit/test_baldosa_native_practice_courses_probe.py
          python tests/unit/test_modern_pause_overlay_presenter.py
          python tests/unit/test_verify_baldosa_extracted_launcher_logs.py

      - name: Verify immutable native source pins
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          test -s baldosa/src/gen/dispatch_v2.c
          git -C baldosa submodule status --recursive

      - name: Stage only the verified UR native boundary
        run: |
          set -euo pipefail
          # RF-015: one DRAM refresh per 1364-clock beam line (source-qualified correction).
          python tools/baldosa_dram_refresh_beam_rate_patch.py --game baldosa
          # QA-08 visual parity CANDIDATE: same all-channel first-line HDMA
          # advance as the original-emulator-pixel-exact 2P experiments.
          # This PR is not merge-ready until independent 1P/transition/result
          # and Windows gameplay visual checks close; do not upstream to
          # cross-title SNESRecomp (Gundam Wing has a distinct HDMA case).
          python tools/baldosa_uniracers_hdma_firstline_patch.py --game baldosa
          python tools/baldosa_uniracers_hdma_firstline_patch.py --game baldosa --apply-candidate
          # Source-only, disabled for players. Inspect the authentic channel7
          # firstline table and descriptor in the exact same title build.
          python tools/baldosa_qa08_native_firstline_hdma_readonly_patch.py --game baldosa
          python tools/baldosa_qa08_native_firstline_hdma_readonly_patch.py --game baldosa --apply-candidate
          # QA-08 source-proven native 2P finish V0 brightness overwrite:
          # replay previous-vblank CPU register journal, including HDMAEN,
          # BEFORE HDMA init/firstline rather than undoing channel7's transfer.
          # Exact title pin, no guest or CPU/APU modifications.
          python tools/baldosa_uniracers_v0_raster_before_hdma_patch.py --game baldosa
          python tools/baldosa_uniracers_v0_raster_before_hdma_patch.py --game baldosa --apply-candidate
          # QA-08 menu/countdown/result raster precision: actual original
          # Snes9x 2014 16x32 five-bit brightness table, Uniracers only.
          # Keep 8-bit rounding effects out of source-authentic Original mode.
          python tools/baldosa_uniracers_brightness_pixel_lut_patch.py --game baldosa
          python tools/baldosa_uniracers_brightness_pixel_lut_patch.py --game baldosa --apply-candidate
          # Only a read-only, exact-frame PPU register witness when QA supplies
          # UR_QA08_WINDOWS_PPU_STATE_TRACE. No player-facing render change.
          python tools/baldosa_qa08_native_ppu_register_trace_patch.py --game baldosa
          python tools/baldosa_qa08_native_ppu_register_trace_patch.py --game baldosa --apply-candidate
          # Source-exact read-only guest->PPU CGRAM writer phase, not a colour
          # or scheduling modification. Narrow frames 5168..5190, 2P only.
          python tools/baldosa_qa08_native_cgram_port_chronology_patch.py --game baldosa
          python tools/baldosa_qa08_native_cgram_port_chronology_patch.py --game baldosa --apply-candidate
          # Source-qualified original blackout: opt-in real $2100 CPU vs
          # raster replay writes around 4016, title-pinned and read-only.
          python tools/baldosa_qa08_native_inidisp_port_trace_patch.py --game baldosa
          python tools/baldosa_qa08_native_inidisp_port_trace_patch.py --game baldosa --apply-candidate
          python tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_pause_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          # QA-08 title source observer is inert until an explicit manual capture.
          python tools/baldosa_qa08_windows_source_capture_patch.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_qa08_windows_source_capture_patch.py --game baldosa --ur-root "$GITHUB_WORKSPACE" --apply-candidate
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_options_spike.py --game baldosa
          python tools/baldosa_modern_options_spike.py --game baldosa
          # No second native core, ROM or alternate product frontend.
          test -s baldosa/src/main.c
          test -s baldosa/snesrecomp/runner/src/desktop/host_main.c

      - name: Use Baldosa's already-proven Windows clang toolchain path
        run: |
          set -euo pipefail
          # Source-bound player candidates must never silently follow mutable latest.
          bash baldosa/snesrecomp/tools/ci/fetch_toolchain.sh --artifact windows-x64 --tag v1.0.14

      - name: Build real native AOT Windows x64 title plus UR host bridges
        run: |
          set -euo pipefail
          # Same toolchain as pinned Baldosa upstream Windows workflow.
          source "${TOOLCHAIN_DIR}/env.sh"
          # Proven original Windows packages differ only in two linked
          # COFF/debug timestamp fields. LLD 22 honors SOURCE_DATE_EPOCH;
          # bind both fields to THIS exact GitHub checkout commit, not wall
          # clock, and do not post-link patch/rewrite tested PE bytes.
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["TOOLCHAIN_DIR"])
          v = json.loads((root / "retcomm-toolchain.json").read_text())
          assert v["version"] == "1.0.14", ("toolchain version drift", v.get("version"))
          PY
          clang --version | head -n1 | grep -F "22.1.8"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]{10}$ ]] || {
            echo "::error::source commit timestamp invalid"; exit 1;
          }
          cmake -S baldosa -B baldosa/build-ur-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_ENABLE_TRACE=OFF
          cmake --build baldosa/build-ur-win --target UniracersSNESRecomp -j 3
          cmake --build baldosa/build-ur-win --target ur-baldosa-modern-profile-fixture -j 3
          test -s baldosa/build-ur-win/UniracersSNESRecomp.exe
          test -s baldosa/build-ur-win/ur-baldosa-modern-profile-fixture.exe
          python tools/check_windows_pe_timestamp.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --source-epoch "$SOURCE_DATE_EPOCH"
          echo "PASS: original linked AMD64 PE COFF/debug timestamps are exact source epoch; no post-link mutation, no release QA credit." >> "$GITHUB_STEP_SUMMARY"

      - name: Admit only a real Windows x64 PE32+ executable
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct
          image = Path("baldosa/build-ur-win/UniracersSNESRecomp.exe").read_bytes()
          assert len(image) > 65536, "empty or placeholder executable"
          assert image[:2] == b"MZ", "missing DOS header"
          pe = struct.unpack_from("<I", image, 0x3c)[0]
          assert image[pe:pe+4] == b"PE\x00\x00", "missing PE signature"
          machine = struct.unpack_from("<H", image, pe + 4)[0]
          magic = struct.unpack_from("<H", image, pe + 24)[0]
          assert machine == 0x8664 and magic == 0x20b, (machine, magic)
          print(f"PASS native Baldosa+UR Windows x64 PE32+: bytes={len(image)}")
          PY
          echo "PASS: pinned Baldosa AOT Windows x64 with existing UR guest/input/native-pause hooks links and produces PE32+" >> "$GITHUB_STEP_SUMMARY"
          echo "NOT TESTED: Modern frontend, runtime interaction, package, per-profile SRAM, Records, replay, ghosts, or complete event." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Baldosa Windows PE needs only clean-machine system DLLs
        run: |
          set -euo pipefail
          # Reuse the SAME verifier as the existing shipping portable ZIP.
          # Windows runners may supply VC/MinGW/SDL DLLs via PATH that the
          # extracted consumer ZIP will not contain.
          EXE_WIN="$(cygpath -w "$GITHUB_WORKSPACE/baldosa/build-ur-win/UniracersSNESRecomp.exe")"
          export EXE_WIN
          powershell.exe -NoProfile -Command '
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -property installationPath
            if (-not $vs) { throw "Visual Studio installation not found" }
            $toolsRoot = Join-Path $vs "VC\Tools\MSVC"
            $tools = Get-ChildItem -LiteralPath $toolsRoot -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $tools) { throw "MSVC tools directory not found" }
            $dumpbin = Join-Path $tools.FullName "bin\Hostx64\x64\dumpbin.exe"
            if (-not (Test-Path -LiteralPath $dumpbin)) { throw "dumpbin.exe not found" }
            & $dumpbin /dependents $env:EXE_WIN
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ' | tee "$RUNNER_TEMP/baldosa-native-pe-dependencies.log"
          python tools/check_windows_portable_binary.py \
            --exe "baldosa/build-ur-win/UniracersSNESRecomp.exe" \
            --dependencies "$RUNNER_TEMP/baldosa-native-pe-dependencies.log"
          echo "PASS: native AOT game imports only stock Windows inbox DLLs; no unsupplied compiler/SDL runtime needed" >> "$GITHUB_STEP_SUMMARY"

      # Same eleven original scripts and output paths are executed by the
      # bounded runner below, not reimplemented. The baseline owns its root
      # and seed; PR-head pilot begins independent routes after root creation
      # while 1P/2P Records still await the exact baseline 8KiB SRAM.
      # Existing manual/call opt-in remains proven two-worker post-baseline.
      # Full original serial fallback remains available.
      - name: Pilot parallel authentic Windows journeys against one pinned candidate
        if: ${{ github.event_name == 'pull_request' || inputs.parallel_journeys == true }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python tools/run_baldosa_parallel_windows_journeys.py \
              --workers 3 --overlap-baseline \
              --out "$RUNNER_TEMP/baldosa-parallel-journeys"
          else
            python tools/run_baldosa_parallel_windows_journeys.py \
              --workers 2 --out "$RUNNER_TEMP/baldosa-parallel-journeys"

# One bounded Windows x64 build of the exact pinned Baldosa AOT title with
# UR's existing guest observer, human input and acknowledged pause bridge.
# Does not assert a packaged Modern product or course/event completion.
name: Baldosa native Windows x64 bridge feasibility


name: Windows Local Tournament package acceptance

# The reviewer nominates exact main source. The fresh build verifies and
# fingerprints its own ZIP within the same run, without assuming byte-identical
# compiler/linker output or downloading a ROM-bearing artifact.
on:
  workflow_dispatch:
    inputs:
      candidate_commit_sha:
        description: "Independently nominated main commit (40 lowercase hex); dispatch that exact main revision"
        required: true

concurrency:
  group: windows-local-tournament-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  same-run-tournament:
    uses: ./.github/workflows/windows-native-smoke.yml
    with:
      run_tournament_acceptance: true
      candidate_commit_sha: ${{ inputs.candidate_commit_sha }}

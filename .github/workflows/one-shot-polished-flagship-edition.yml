name: One-shot polished flagship film edition
on:
  push:
    branches: [media/polished-editorial-frames-20261019]
    paths: [.github/workflows/one-shot-polished-flagship-edition.yml]
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: FFmpeg plus Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Render source-verified 85-second film with redesigned cards
        run: |
          python3 tools/showcase/build_flagship_recruitment_20261019.py \
            --outdir media/showcase/2026-10-19/flagship/polished-edition
      - name: Verify frame cadence, source identities and review stills
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('media/showcase/2026-10-19/flagship/polished-edition')
          x=json.loads((root/'flagship-provenance.json').read_text())
          assert x['schema']=='UR-FLAGSHIP-RECRUITMENT/1'
          assert x['total_horizontal_frames']==5100 and x['total_vertical_frames']==1620
          assert len(x['horizontal_shots'])==15 and x['no_interpolation']
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          shots={
            'ur-recomp-flagship-85s-1080p.mp4':((1920,1080),5100,[1500,3150,4860]),
            'ur-recomp-flagship-27s-vertical.mp4':((1080,1920),1620,[1500]),
          }
          output={}
          for name,(size,frames,ordinals) in shots.items():
            p=root/name
            assert sha(p)==x['output_sha256'][name]
            v=json.loads(subprocess.check_output(['ffprobe','-v','error','-count_frames',
              '-select_streams','v:0','-show_entries',
              'stream=width,height,r_frame_rate,nb_read_frames','-of','json',str(p)]))['streams'][0]
            assert (v['width'],v['height'],v['r_frame_rate'],int(v['nb_read_frames']))==(*size,'60/1',frames)
            for n in ordinals:
              path=root/(name.removesuffix('.mp4')+f'-review-{n}.png')
              subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
                '-i',str(p),'-vf',f'select=eq(n\\,{n})','-frames:v','1','-fps_mode','vfr',str(path)],check=True)
              with Image.open(path) as im:
                assert im.size==size
                im.verify()
              output[path.name]=sha(path)
          (root/'polished-edition-review.json').write_text(json.dumps({
            'schema':'UR-FLAGSHIP-POLISHED-RENDER-QA/1',
            'source_manifest_sha256':sha(root/'flagship-provenance.json'),
            'review_sha256':output,'no_new_gameplay_frames':True,
            'editorial_cards_changed_only':True,'human_full_screening':False
          },sort_keys=True,indent=2)+'\n')
          print('POLISHED_FLAGSHIP_VIDEO_CADENCE_SOURCE_SHA_PASS')
          PY
      - name: Publish new edition without changing original master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/2026-10-19/flagship/polished-edition/
          git rm -f .github/workflows/one-shot-polished-flagship-edition.yml
          git commit -m "media: publish polished 85s film edition and source-qualified review"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

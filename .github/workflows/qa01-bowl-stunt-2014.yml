name: QA-01 experimental original 2014 Switcher Race B paired native candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/qa01-switcher-stunt-2014.yml"
      - "tools/probe_original_event_complete.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snes9x-libretro.json"
      - "tests/unit/test_probe_original_event_complete.py"

permissions:
  contents: read

concurrency:
  group: qa01-original-bowl-stunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-native-switcher-race-b:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out canonical original USA source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out pinned Baldosa native guest plus framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Prove exact original input and pinned guest identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          test -s reference/imported/tas-bots/dessyreqt-4250-submission.smv
          python3 -m unittest discover -s tests/unit -p test_probe_original_event_complete.py

      - name: Build one original Snes9x and one native Baldosa guest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config build-essential cmake libsdl2-dev \
            libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev xvfb
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          cmake -S baldosa/snesrecomp/tools/snesref \
            -B "$RUNNER_TEMP/switcher-snesref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/switcher-snesref" -j2
          # QA-only input-file transport already validated in the Zoo route.
          # Absolutely no guest code, original ROM, SRAM or gameplay edit.
          python3 tools/baldosa_qa_dense_scene_input_patch.py \
            --host baldosa/snesrecomp/runner/src/desktop/host_main.c
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j3
          test -x baldosa/build/UniracersSNESRecomp
          test -x "$RUNNER_TEMP/switcher-snesref/snesref"

      - name: Independent source-original Switcher Race B then paired stock-entry native replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa01-switcher"
          set +e
          python3 tools/probe_original_event_complete.py \
            --case switcher \
            --native-backend pinned-baldosa \
            --source-horizon 22000 \
            --snesref "$RUNNER_TEMP/switcher-snesref/snesref" \
            --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            --native "$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --work-dir "$RUNNER_TEMP/qa01-switcher" \
            --json-out "$RUNNER_TEMP/qa01-switcher/switcher-report.json" \
            > "$RUNNER_TEMP/qa01-switcher/attempt.log" 2>&1
          rc=$?
          set -e
          echo "Producer exit code: $rc (0 means a comparator candidate only; failure or mismatch remains evidence, never release QA admission)"
          tail -n 130 "$RUNNER_TEMP/qa01-switcher/attempt.log"
          if [ -s "$RUNNER_TEMP/qa01-switcher/switcher-report.json" ]; then
            python3 - "$RUNNER_TEMP/qa01-switcher/switcher-report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps({
            "course":d.get("course_id"),
            "native_backend":d.get("native_backend"),
            "source":{k:v for k,v in d.get("original_source_event",{}).items() if k!="original_source_entry"},
            "entry_equivalent":d.get("comparison",{}).get("fresh_guest_entry_equivalent"),
            "first_disagreement":d.get("comparison",{}).get("first_sample_disagreement"),
            "settled_race_time_text_equal":d.get("comparison",{}).get("rendered_result_and_score_text_matched"),
            "full_event_frame_parity_candidate":d.get("comparison",{}).get("paired_event_candidate",False),
                        "diagnostic_success_not_admission":d.get("comparison",{}).get("diagnostic_exit_success_without_full_event_parity",False),
            "terminal_frames_guest_relative":d.get("comparison",{}).get("terminal_result_guest_frame"),
            "tally_anchored_guest_phase":d.get("tally_anchored_guest_phase"),
            "p1_timed_result":d.get("comparison",{}).get("timed_race_or_circuit_result_visible"),
            "official_admitted_usa_events":0
          },indent=2))
          PY
          fi
          exit "$rc"

      - name: Retain bounded Switcher diagnostic logs and non-ROM metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa01-switcher-scored-stunt-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa01-switcher/attempt.log
            ${{ runner.temp }}/qa01-switcher/switcher-report.json
            ${{ runner.temp }}/qa01-switcher/switcher/source/source-scan.log
            ${{ runner.temp }}/qa01-switcher/switcher/source/source-event-diagnostic.json
            ${{ runner.temp }}/qa01-switcher/switcher/source/source-entry.log
            ${{ runner.temp }}/qa01-switcher/switcher/calibration/reference.log
            ${{ runner.temp }}/qa01-switcher/switcher/calibration/native.log
            ${{ runner.temp }}/qa01-switcher/switcher/replay/reference.log
            ${{ runner.temp }}/qa01-switcher/switcher/replay/native.log
            ${{ runner.temp }}/qa01-switcher/switcher/original-movie-meta.json

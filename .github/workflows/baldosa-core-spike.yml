              "schema_version": 1,
              "guest_crc_equal_to_stock": True,
              "guest_frames": len(guest_crcs),
              "pre_race_mode_samples": modes,
              "wide_preparations": len(prep),
              "calibrated_wide_preparations": sum(p[1] == "1" for p in prep),
              "wide_presents": len(present),
              "wide_captures": seen,
              "distinct_wide_images": len({x["sha256"] for x in seen}),
              "nontrivial_four_margin_images": sum(x["four_margins_nontrivial"] for x in seen),
              "status": ("observed-live-moving-world" if
                         len({x["sha256"] for x in seen}) >= 2 and
                         sum(x["four_margins_nontrivial"] for x in seen) >= 2
                         else "blocked-no-verified-moving-world"),
              "release_1p_world_acceptance": False,
              "physical_4k_acceptance": False,

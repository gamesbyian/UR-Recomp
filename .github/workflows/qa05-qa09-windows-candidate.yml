name: QA-05/09 Windows candidate package

# PR-only validation for the frontend shipping lane. The existing Windows
# package workflow remains main-push-only for the distributable release;
# workflow_call reuses its exact build, ZIP and real Win32 acceptance with
# no second package-building implementation.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/qa05-qa09-windows-candidate.yml"
      - ".github/workflows/windows-native-smoke.yml"
      - "tools/devnode_benchmark/prepare_sdl3_cache.py"
      # Compiler generator/job-count changes need actual hosted Windows PE,
      # package/QA parity before the trusted-main HP machine can trial them.
      - "tools/devnode_benchmark/verify_hp_ninja.py"
      - "tools/ci/ninja_package_canary.cmd"
      - "tests/unit/test_hp_ninja_manual_policy.py"
      - "native/product/uniracers_modern_host.cpp"
      - "native/product/modern_restart_key_release.hpp"
      - "tools/qa09_windows_root_pad_probe.py"
      # Real Win32/SDL QA-05 acceptance changes must exercise their own
      # hosted Windows route before merge, not just a Linux source test.
      - "tools/ci/qa05_restart_attempt.sh"
      - "tools/ci/windows_package_race_result.sh"
      - "tests/unit/test_hp_race_overlap_policy.py"
      - "tools/capture_modern_restart_audio.py"
      - "tools/capture_modern_resume_audio.py"
      - "tools/capture_modern_paused_audio.py"
      - "tools/analyze_sdl_audio_envelope.py"
      - "tools/qa05_restart_input_guard.py"
      - "tests/input/audio-modern-restart.script"
      - "tests/native/run_modern_root_acceptance.sh"
  workflow_dispatch:

concurrency:
  group: qa05-qa09-windows-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/windows-native-smoke.yml
    with:
      # Exercise owner HP compiler properties on a hosted Windows VM.
      # The reusable run_on_hp input stays false: no PR can reach the
      # personal runner or run HP-only setup/telemetry steps.
      test_hp_compiler_profile: true

      - "native/product/completed_run_record.*"
      - "native/product/completed_run_store.*"
      - "native/product/host_product_state.*"
      - "native/product/host_product_store.*"
      - "native/product/host_profile_catalog.*"
      - "native/product/host_profile_runtime.*"
      - "native/product/host_profile_state.*"

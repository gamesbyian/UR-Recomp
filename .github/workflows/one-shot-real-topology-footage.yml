name: One-shot native topology footage (menu-state corrected)
on:
  push:
    branches: [media/oct19-dynamic-native-racing]
    paths:
      - .github/workflows/one-shot-real-topology-footage.yml
permissions:
  contents: write
concurrency:
  group: ur-native-topology-video-20261019
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Install bounded native capture dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            ninja-build cmake pkg-config libsdl2-dev libgl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            xvfb x11-utils ffmpeg python3-pil
      - name: Run genuine source-state course and control/recording capture
        run: |
          bash tools/showcase/run_dynamic_native_capture.sh \
            "$GITHUB_WORKSPACE/baldosa" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            "$RUNNER_TEMP/ur-topology-capture" --topology-hill
      - name: Retain raw evidence on failed or successful capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-2p-course-topology-source-witnesses
          path: |
            ${{ runner.temp }}/ur-topology-capture/published/
            ${{ runner.temp }}/ur-topology-capture/routes/
            ${{ runner.temp }}/ur-topology-capture/working/*/log.txt
            ${{ runner.temp }}/ur-topology-capture/working/*/dump/*.wram.bin
          retention-days: 14
          if-no-files-found: warn
      - name: Publish only fully checked real footage; remove disposable workflow
        run: |
          set -euo pipefail
          dest=media/showcase/2026-10-19/dynamic-native-2p
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/ur-topology-capture/published/"* "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git rm -f .github/workflows/one-shot-real-topology-footage.yml
          git commit -m "media: publish real verified loop ramp hill and stunt source-capture candidates"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: One-shot regional racer slot discovery

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/discover_regional_racer_slots.py"
      - "tests/unit/test_discover_regional_racer_slots.py"
      - ".github/workflows/regional-racer-slot-evidence.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Discover regional racer slots
        run: python3 tools/discover_regional_racer_slots.py
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_discover_regional_racer_slots -v
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/regional-racer-slot-discovery.json analysis/generated/regional-racer-slot-discovery.md
          git diff --cached --quiet || git commit -m "analysis: record regional racer slot discovery"
          git push origin HEAD:${{ github.head_ref }}

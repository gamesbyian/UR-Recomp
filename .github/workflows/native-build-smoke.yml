      - name: Modern ghost target profile persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          ROOT="$RUNNER_TEMP/ghost-target-profile"
          STATE="$ROOT/host-state-v6.txt"
          PROFILE_ROOT="$ROOT/profile-save"
          PROFILE_STATE="$PROFILE_ROOT/host-profile.txt"
          FIRST_LOG="$ROOT/previous.log"
          SECOND_LOG="$ROOT/personal-best.log"
          AUTH_LOG="$ROOT/authentic.log"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/first-dumps" "$ROOT/second-dumps" "$PROFILE_ROOT"

          cat >"$STATE" <<'STATEEOF'
          UR-HOST-STATE/6
          profile=ghost-acceptance
          pause_on_focus_loss=1
          vibration_enabled=1
          STATEEOF

          drive_ghost_row() {
            local log="$1"
            local dumps="$2"
            timeout 90s xvfb-run -a bash -c '
              set -euo pipefail
              export SDL_AUDIODRIVER=dummy
              export UR_PRODUCT_DIAGNOSTICS=1
              export UR_HOST_STATE_PATH="'"$STATE"'"
              export UR_PROFILE_SAVE_ROOT="'"$PROFILE_ROOT"'"
              export SNESRECOMP_DUMP_DIR="'"$dumps"'"
              "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$log"'" 2>&1 &
              PID=$!

              for _ in $(seq 1 600); do
                [ -s "'"$dumps"'/race-entered.wram.bin" ] && break
                kill -0 "$PID" 2>/dev/null || exit 1
                sleep 0.1
              done
              [ -s "'"$dumps"'/race-entered.wram.bin" ]

              WIN=""
              for _ in $(seq 1 100); do
                WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
                [ -n "$WIN" ] && break
                sleep 0.1
              done
              [ -n "$WIN" ]

              xdotool windowfocus "$WIN"
              xdotool key Escape
              sleep 0.3

              # Active race exposes Resume -> Restart -> Options.
              xdotool key Down
              xdotool key Down
              xdotool key Return
              for _ in $(seq 1 100); do
                grep -q "UR_PAUSE_OPTIONS OPENED" "'"$log"'" && break
                kill -0 "$PID" 2>/dev/null || exit 1
                sleep 0.1
              done
              grep -q "UR_PAUSE_OPTIONS OPENED" "'"$log"'"

              # Options starts at Focus Pause. Ghost is the seventh row.
              for _ in 1 2 3 4 5 6; do xdotool key Down; done
              xdotool key Return

              for _ in $(seq 1 100); do
                grep -q "UR_RUN_GHOST TARGET_SELECTED" "'"$log"'" && break
                kill -0 "$PID" 2>/dev/null || exit 1
                sleep 0.1
              done
              grep -q "UR_RUN_GHOST TARGET_SELECTED" "'"$log"'"

              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            '
          }

          drive_ghost_row "$FIRST_LOG" "$ROOT/first-dumps"
          test -s "$PROFILE_STATE"
          grep -q "^profile=ghost-acceptance$" "$PROFILE_STATE"
          grep -q "^ghost_target=previous$" "$PROFILE_STATE"
          grep -q "UR_RUN_GHOST TARGET_SELECTED target=previous" "$FIRST_LOG"
          grep -q "UR_PROFILE_SAVE_ROOT APPLIED profile=ghost-acceptance root=$PROFILE_ROOT" "$FIRST_LOG"

          # Fresh process: if Previous was truly loaded from the profile,
          # one more activation advances to Personal Best rather than Previous.
          drive_ghost_row "$SECOND_LOG" "$ROOT/second-dumps"
          grep -q "^ghost_target=personal-best$" "$PROFILE_STATE"
          grep -q "UR_RUN_GHOST TARGET_SELECTED target=personal-best" "$SECOND_LOG"
          cp "$PROFILE_STATE" "$ROOT/profile-before-authentic.txt"

          set +e
          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_EXECUTION_MODE=authentic \
          UR_HOST_STATE_PATH="$STATE" \
          UR_PROFILE_SAVE_ROOT="$PROFILE_ROOT" \
          timeout 6s xvfb-run -a "$EXE" "$ROM" >"$AUTH_LOG" 2>&1
          AUTH_STATUS=$?
          set -e
          if [ "$AUTH_STATUS" -ne 0 ] && [ "$AUTH_STATUS" -ne 124 ]; then
            cat "$AUTH_LOG"
            exit "$AUTH_STATUS"
          fi
          cmp "$ROOT/profile-before-authentic.txt" "$PROFILE_STATE"
          grep -q "UR_PROFILE_SAVE_ROOT AUTHENTIC_DEFAULT root=saves" "$AUTH_LOG"
          if grep -q "UR_RUN_GHOST TARGET_SELECTED" "$AUTH_LOG"; then
            echo "::error::Authentic mode changed the Modern ghost target"
            exit 1
          fi

          echo "== persisted ghost profile =="
          cat "$PROFILE_STATE"
          echo "== Previous selection diagnostics =="
          grep "UR_RUN_GHOST TARGET_SELECTED" "$FIRST_LOG"
          echo "== Personal Best selection diagnostics =="
          grep "UR_RUN_GHOST TARGET_SELECTED" "$SECOND_LOG"
          echo "UR_GHOST_TARGET_PROFILE_RESULT=previous_then_personal_best_persisted_and_authentic_inert"

      - name: Shipping Widescreen composition acceptance

name: QA01 genuine Bowl continuous-frame archival qualification

on:
  pull_request:
    paths:
      - ".github/workflows/qa01-authentic-frame-qualification.yml"
      - "tools/qa01_frame_fingerprint.py"
      - "tools/qa01_verify_frame_capture.py"
      - "tools/qa01_frame_capture_replay.py"
      - "tools/qa01_qualify_authentic_bowl_frames.py"
      - "tools/qa01_frame_delta_atlas.py"
      - "tools/qa01_zoo_archived_frame_atlas.py"
      - "tools/qa01_independent_zoo_capture_ab_archive.py"
      - "tests/unit/test_qa01_frame_delta_atlas.py"
      - "tests/unit/test_qa01_zoo_archived_frame_atlas.py"
      - "tests/unit/test_qa01_continuous_frame_capture.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qa01-genuine-frame-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-immutable-bowl-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: ROM-free frame and adversarial audit tests
        run: |
          set -euo pipefail
          python3 -m unittest tests.unit.test_qa01_continuous_frame_capture tests.unit.test_qa01_fidelity_evidence_pilots tests.unit.test_qa01_frame_delta_atlas tests.unit.test_qa01_zoo_archived_frame_atlas -v

      - name: Reopen exact real original/native 2014 Bowl evidence archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa01-archive"
          # The forensic consumer itself creates the verdict root, and
          # refuses any preexisting destination to prevent mixing runs.
          # This is GitHub's immutable 39168164480 / 12151357791 evidence,
          # not a newly simulated race or a generated ROM-free fixture.
          curl --fail --show-error --silent --location --retry 2 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --output "$RUNNER_TEMP/qa01-archive/genuine-bowl.zip" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/12151357791/zip"
          sha256sum "$RUNNER_TEMP/qa01-archive/genuine-bowl.zip"
          python3 tools/qa01_qualify_authentic_bowl_frames.py \
            --archive "$RUNNER_TEMP/qa01-archive/genuine-bowl.zip" \
            --output "$RUNNER_TEMP/qa01-verdict"
          python3 - "$RUNNER_TEMP/qa01-verdict/qualification.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["genuine_consecutive_raw_frame_pairs"]==8
          assert d["unmasked_wram_byte_difference_occurrences"]==2747
          assert d["unmasked_sram_byte_difference_occurrences"]==24
          assert d["new_emulator_execution_performed"] is False
          assert d["whole_race_continuous_coverage"] is False
          assert d["USA_events_accepted"]==0
          print("Genuine original/native 32-file eight-frame independent audit: qualified (bounded, 0/45)")
          PY

      - name: Independently rederive observed physical-address deltas from same genuine Bowl source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qa01-verdict"
          python3 tools/qa01_frame_delta_atlas.py \
            --fingerprints "$ROOT/frame-fingerprints.json" \
            --retained-raw "$ROOT/retained" \
            --output "$ROOT/independent-frame-delta-atlas.json"
          python3 - "$ROOT/independent-frame-delta-atlas.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["full_original_native_raw_frame_pairs_independently_reopened"]==8
          assert r["equal_digest_only_frame_pairs_not_independently_reopened"]==[]
          assert r["unmasked_original_native_byte_occurrences"]=={
              "wram":2747,"sram":24}
          assert r["first_genuinely_consumed_CPU_or_SPC_divergence_proven"] is False
          assert r["accepted_USA_events"]==0
          print("Real Bowl independent WRAM/SRAM delta atlas qualified, no causal credit")
          PY

      - name: Re-open exact original Zoom Zoo nine-frame A/B archive without game execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa01-zoo-authenticated"
          curl --fail --show-error --silent --location --retry 2 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --output "$RUNNER_TEMP/qa01-zoo-authenticated/real-zoo-ab.zip" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/12167633197/zip"
          python3 tools/qa01_zoo_archived_frame_atlas.py \
            --archive "$RUNNER_TEMP/qa01-zoo-authenticated/real-zoo-ab.zip" \
            --output "$RUNNER_TEMP/qa01-zoo-authenticated/independent-atlas.json"
          python3 - "$RUNNER_TEMP/qa01-zoo-authenticated/independent-atlas.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          t=report["atlas"]
          assert t["window"]=={"start":5034,"end":5042}
          assert t["full_original_native_raw_frame_pairs_independently_reopened"]==8
          assert t["equal_digest_only_frame_pairs_not_independently_reopened"]==[5039]
          assert t["unmasked_original_native_byte_occurrences"]=={
              "wram":13, "sram":0}
          assert {k:(v["occurrences"],v["frames"])
                  for k,v in t["per_address_occurrences"].items()}=={
              "7E:01EE":(5,[5034,5035,5036,5037,5038]),
              "7E:01F1":(2,[5036,5037]),
              "7E:0063":(3,[5040,5041,5042]),
              "7E:0069":(3,[5040,5041,5042])}
          assert report["independent_original_native_archive_adjudication"]=="HOLD"
          assert report["accepted_USA_events"]==0
          print("Genuine original/native Zoo nine-frame A/B raw atlas: 13 WRAM, no event")
          PY

      - name: Retain only small authenticated offline receipts, never bulk memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa01-genuine-bowl-contiguous-8-review
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa01-verdict/qualification.json
            ${{ runner.temp }}/qa01-verdict/independent-review.json
            ${{ runner.temp }}/qa01-verdict/frame-fingerprints.json
            ${{ runner.temp }}/qa01-verdict/independent-frame-delta-atlas.json
            ${{ runner.temp }}/qa01-zoo-authenticated/independent-atlas.json

name: Windows Modern Resume audio proof

on:
  pull_request:
    paths:
      - ".github/workflows/windows-modern-resume-audio-probe.yml"
      - "tools/capture_modern_resume_audio.py"
      - "tools/capture_modern_paused_audio.py"
      - "tests/unit/test_capture_modern_resume_audio.py"
      - "tests/input/modern-focus-pause.script"
  workflow_dispatch:

# Audio-only evidence; never rebuild game or compete with Windows packaging.
concurrency:
  group: windows-modern-resume-audio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  packaged-resume-audio:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select already successful first-party main Windows package
        id: source-package
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "windows-native-smoke.yml",
              branch: "main", status: "success", per_page: 10
            });
            // The canonical Windows producer retains only ROM-free diagnostics.
            // Never infer availability from a green run or request a forbidden ROM ZIP.
            const candidates = data.workflow_runs.filter(run =>
              run.conclusion === "success" &&
              run.head_branch === "main" &&
              run.head_repository?.full_name === owner + "/" + repo &&
              /^[0-9a-f]{40}$/.test(run.head_sha || "")
            );
            let source = null;
            for (const run of candidates) {
              const { data: kept } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100
              });
              if (kept.artifacts.some(a =>
                a.name === "windows-native-smoke" && !a.expired &&
                a.size_in_bytes > 0
              )) {
                source = run;
                break;
              }
            }
            if (!source) {
              core.setFailed(
                "No successful first-party main Windows smoke run retains " +
                "ROM-free source evidence suitable for exact local reconstruction."
              );
            } else {
              core.setOutput("run_id", String(source.id));
              core.setOutput("source_sha", source.head_sha);
              core.info("Using exact first-party ROM-free source from run " +
                source.id + " SHA=" + source.head_sha);
            }

      - name: Download first-party ROM-free PE and original package hashes
        uses: actions/download-artifact@v4
        with:
          name: windows-native-smoke
          repository: ${{ github.repository }}
          run-id: ${{ steps.source-package.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audio-source

      - name: Reconstruct exact original ZIP locally from ROM-free evidence
        run: |
          set -euo pipefail
          python tools/verify_rom.py "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python -m tools.ci.rehydrate_windows_romfree_package \
            --artifact-root "$RUNNER_TEMP/audio-source" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --archive "$RUNNER_TEMP/audio-source/UR-Recomp-Windows-x64.zip" \
            --expected-source "${{ steps.source-package.outputs.source_sha }}"

      - name: Prove packaged Modern frozen pause then real Win32 Resume stereo recovery
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/audio-source/UR-Recomp-Windows-x64.zip"
          EXTRACT="$RUNNER_TEMP/audio-resume-package"
          python tools/assemble_windows_package.py verify-archive --archive "$ARCHIVE"
          python -m zipfile -e "$ARCHIVE" "$EXTRACT"
          PACKAGE="$EXTRACT/UR-Recomp-Windows-x64"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"

          LOG="$RUNNER_TEMP/audio-modern-resume-native.log"
          PCM="$RUNNER_TEMP/audio-modern-resume-device.raw"
          ROOT="$RUNNER_TEMP/audio-modern-resume-user"
          OUT="$RUNNER_TEMP/audio-modern-resume-proof.json"
          LAUNCHER_WIN="$(cygpath -w "$PACKAGE/run-uniracers.cmd")"
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script")"
          LOG_WIN="$(cygpath -w "$LOG")"
          PCM_WIN="$(cygpath -w "$PCM")"
          ROOT_WIN="$(cygpath -w "$ROOT")"
          rm -rf "$ROOT" "$PCM"
          mkdir -p "$ROOT"
          trap 'rm -f "$PCM"' EXIT
          SDL_VIDEO_DRIVER=windows \
          SDL_VIDEODRIVER=windows \
          SDL_AUDIO_DRIVER=disk \
          SDL_AUDIO_DISK_OUTPUT_FILE="$PCM_WIN" \
          SDL_AUDIO_FORMAT=S16LE \
          SDL_AUDIO_CHANNELS=2 \
          SDL_AUDIO_FREQUENCY=44100 \
          SDL_AUDIO_DISK_TIMESCALE=1.0 \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_PAUSE_OPEN_ACCEPTANCE=1 \
          UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
            python -m tools.capture_modern_resume_audio \
              "$LAUNCHER_WIN" "$SCRIPT_WIN" "$LOG_WIN" "$PCM_WIN" \
              --json-out "$OUT"
          python tools/analyze_sdl_disk_audio.py "$LOG_WIN" "$PCM_WIN" \
            --min-duration-seconds 15 \
            --min-channel-rms 50 \
            --tail-seconds 1.0 --min-tail-rms 50 --min-tail-channel-rms 50 \
            --json-out "$RUNNER_TEMP/audio-modern-resume-whole-output.json"
          test -s "$OUT"
          echo "WINDOWS_REAL_MODERN_RESUME_AUDIO PASS"
          rm -f "$PCM"

      - name: Retain bounded audio provenance without copyrighted PCM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-resume-audio-evidence
          path: |
            ${{ runner.temp }}/audio-modern-resume-native.log
            ${{ runner.temp }}/audio-modern-resume-proof.json
            ${{ runner.temp }}/audio-modern-resume-whole-output.json
          if-no-files-found: warn
          retention-days: 5

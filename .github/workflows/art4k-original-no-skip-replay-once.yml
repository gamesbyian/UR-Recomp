name: ART-4K original Mesen no-frame-skip replay discriminator

on:
  pull_request:
    paths:
      - '.github/workflows/art4k-original-no-skip-replay-once.yml'
  workflow_dispatch:

concurrency:
  group: art4k-no-skip-original-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  MESENCE_REVISION: a60e79feb4d6dcced5922d636f9211837d01e381
  MESENCE_INPUT_PATCH_REV: v2

jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev xvfb unzip curl clang

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Restore pinned MesenCE binary cache
        id: mesence-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mesence-cache
          key: mesence-linux-x64-${{ env.MESENCE_REVISION }}-${{ env.MESENCE_INPUT_PATCH_REV }}

      - name: Fetch pinned MesenCE source
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/nesdev-org/MesenCE.git "$RUNNER_TEMP/MesenCE"
          git -C "$RUNNER_TEMP/MesenCE" checkout --detach "$MESENCE_REVISION"
          test "$(git -C "$RUNNER_TEMP/MesenCE" rev-parse HEAD)" = "$MESENCE_REVISION"
          git -C "$RUNNER_TEMP/MesenCE" apply --unidiff-zero             "$GITHUB_WORKSPACE/third_party/src/mesen-for-ai/patches/mesence-lua-input-subport.patch"

      - name: Stage MesenCE librashader dependency
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/MesenCE"
          curl -fL --retry 3             "https://nightly.link/SourMesen/librashader/workflows/build/Mesen/librashader-x64-ubuntu.zip"             -o "$RUNNER_TEMP/librashader.zip"
          rm -rf "$RUNNER_TEMP/librashader"
          mkdir -p "$RUNNER_TEMP/librashader"
          unzip -q "$RUNNER_TEMP/librashader.zip" -d "$RUNNER_TEMP/librashader"
          LIB="$(find "$RUNNER_TEMP/librashader" -type f -name librashader.so -print -quit)"
          test -n "$LIB"
          mkdir -p UI/Dependencies
          cp "$LIB" UI/Dependencies/librashader.so

      - name: Build pinned MesenCE
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -C "$RUNNER_TEMP/MesenCE" -j2 -O LTO=true STATICLINK=true SYSTEM_LIBEVDEV=false
          PUBLISH="$RUNNER_TEMP/MesenCE/bin/linux-x64/Release/linux-x64/publish"
          test -x "$PUBLISH/Mesen"
          rm -rf "$RUNNER_TEMP/mesence-cache"
          mkdir -p "$RUNNER_TEMP/mesence-cache"
          cp -a "$PUBLISH/." "$RUNNER_TEMP/mesence-cache/"



      - name: Stage controlled source-only Mesen without SNES frame skipping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,shutil
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"mesen-for-ai-no-skip"
          shutil.copytree(Path("third_party/src/mesen-for-ai"),root)
          script=root/"scripts/run_headless.sh"
          before=script.read_text()
          old='"Snes": {\n    "RamPowerOnState"'
          new='"Snes": {\n    "DisableFrameSkipping": true,\n    "RamPowerOnState"'
          assert before.count(old)==1, "pinned source SNES settings shape changed"
          after=before.replace(old,new)
          assert after.count('"DisableFrameSkipping": true')==1
          script.write_text(after)
          print("RUN_LOCAL_HEADLESS_SNESCAN_DISABLE_FRAME_SKIPPING")
          print("source_runner_sha_before",hashlib.sha256(before.encode()).hexdigest())
          print("source_runner_sha_after",hashlib.sha256(after.encode()).hexdigest())
          PY

      - name: Execute two independently started original ROM screenshot captures
        shell: bash
        run: |
          set -euo pipefail
          for label in first second; do
            timeout 330s xvfb-run -a python3 -m tools.art.capture_original_mesen_ppu_raw \
              --rom reference/roms/retail/Uniracers_USA.sfc \
              --input-file tests/input/two-player-first-race.input \
              --mesen-for-ai-repo "$RUNNER_TEMP/mesen-for-ai-no-skip" \
              --mesen-executable "$RUNNER_TEMP/mesence-cache/Mesen" \
              --advance-frames 1218 --capture-frames 2 --include-held-framebuffer \
              --out-dir "$RUNNER_TEMP/art4k-no-skip-$label"
          done

      - name: Compare original source PPU memory and pixel replay without assuming success
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from tools.art.capture_original_mesen_ppu_raw import validate_snapshot_files
          root=Path(os.environ["RUNNER_TEMP"])
          runs={}
          for label in ("first","second"):
              folder=root/f"art4k-no-skip-{label}"
              report=json.loads((folder/"manifest.json").read_text())
              validate_snapshot_files(folder,report)
              assert [f["emulator_bridge_frame"] for f in report["frames"]]==[1219,1220]
              assert not report["source_held_display_to_current_PPU_scanout_phase_independently_aligned"]
              runs[label]=report
          def rgb(label,frame):
              return (root/f"art4k-no-skip-{label}"/f"frame-{frame:06d}-held-display.ppm").read_bytes().split(b"255\n",1)[1]
          def changed(a,b):
              assert len(a)==len(b)==256*239*3
              return sum(a[i:i+3]!=b[i:i+3] for i in range(0,len(a),3))
          expected={
              1219:{"oam":"14b0cfa18b3bd1c7ca0a1459490047d6b57a95eccdf4d258cff249265ee083f7",
                    "vram":"796ced408df88bb91773b49ac1df071896e281c01a5a21884756d5688504eef6",
                    "cgram":"02dfb109cad83e68f24610182fbecc68cfa56b958825ad97078ee5d9cfd70cef"},
              1220:{"oam":"14b0cfa18b3bd1c7ca0a1459490047d6b57a95eccdf4d258cff249265ee083f7",
                    "vram":"7717563af995ca40a32e60782c4bdad34e4666969481bd133b9b01b74f3ce624",
                    "cgram":"9e857e315148893c0746b537fb700feaa5dc90a4e1ff3714a646794ca730f1a5"}
          }
          same_original_raw=True
          matched_earlier_raw=True
          for tick in (1219,1220):
              memory={label:next(f for f in run["frames"] if f["emulator_bridge_frame"]==tick)
                      ["raw_original_snes_ppu_memory"] for label,run in runs.items()}
              for k in ("oam","vram","cgram"):
                  digests=[memory[label][k]["sha256"] for label in ("first","second")]
                  same_original_raw &= digests[0]==digests[1]
                  matched_earlier_raw &= digests[0]==expected[tick][k] and digests[1]==expected[tick][k]
          cross={str(tick):changed(rgb("first",tick),rgb("second",tick)) for tick in (1219,1220)}
          within={label:changed(rgb(label,1219),rgb(label,1220)) for label in ("first","second")}
          result={
              "schema":"UR-ART4K-MESEN-DISABLE-FRAMESKIPPING-ORIGINAL-REPLAY-TEST/1",
              "original_usa_rom_sha256":runs["first"]["original_USA_ROM_sha256"],
              "original_replay_sha256":runs["first"]["original_input_replay_sha256"],
              "mesen_emulator_executable_sha256":runs["first"]["actual_emulator_executable_sha256"],
              "local_runner_requested_snes_disable_frame_skipping":True,
              "local_runner_original_vendored_source_tree_changed":False,
              "source_original_raw_PPU_sha_identical_across_two_runs":bool(same_original_raw),
              "source_original_raw_PPU_sha_matches_earlier_runs":bool(matched_earlier_raw),
              "cross_run_changed_screen_pixels_by_tick":cross,
              "within_run_changed_screen_pixels_by_run":within,
              "original_held_RGB_reproducible_both_ticks":all(x==0 for x in cross.values()),
              "same_original_scanout_phase_proved":False,
              "source_original_3d_rig_or_anatomy_verified":False,
              "owner_likeness_approved":False,
          }
          (root/"art4k-no-skip-comparison.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("ORIGINAL_SNES_DISABLE_FRAME_SKIP_REPLAY",json.dumps(result,sort_keys=True))
          PY

      - name: Preserve bounded raw original experiment and SHA verdict
        uses: actions/upload-artifact@v4
        with:
          name: art4k-original-no-skip-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/art4k-no-skip-first/
            ${{ runner.temp }}/art4k-no-skip-second/
            ${{ runner.temp }}/art4k-no-skip-comparison.json
          retention-days: 7
          if-no-files-found: error

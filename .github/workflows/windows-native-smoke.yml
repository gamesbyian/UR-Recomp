          UR_RECOMP_USER_DATA_ROOT="$BROKEN_ROM_USER_WIN" \
            powershell.exe -NoProfile -Command \
            "& '${BROKEN_ROM_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
            >"$RUNNER_TEMP/package-missing-rom.log" 2>&1

name: Owner HP native Windows full smoke (manual experiment)
on:
  push:
    branches: [ops/hp-windows-native-smoke-experiment-20261029]
    paths:
      - ".github/workflows/owner-hp-windows-native-smoke.yml"
      - "tests/unit/test_assemble_windows_package.py"
      - "tools/devnode_benchmark/prepare_rust.ps1"
      - "tools/devnode_benchmark/prepare_python.ps1"
  workflow_dispatch:
    inputs:
      run_full_smoke:
        description: "Explicitly authorize the expensive native build after HP health passes"
        type: boolean
        required: false
        default: false

concurrency:
  # Direct smoke and the QA-05/09 reusable caller may run for the same PR.
  # Distinguish their cancellation scopes by caller workflow.
  group: owner-hp-native-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hp-health:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Read-only runner health and Windows commit limit
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ine 'hpmini-ur-recomp') { throw 'Unexpected self-hosted runner identity' }
          $os = Get-CimInstance Win32_OperatingSystem
          $freeVirtualMB = [math]::Round($os.FreeVirtualMemory / 1024)
          $totalVirtualMB = [math]::Round($os.TotalVirtualMemorySize / 1024)
          $freePhysicalMB = [math]::Round($os.FreePhysicalMemory / 1024)
          Write-Output "HP_HEALTH runner=$env:RUNNER_NAME commit_free_mb=$freeVirtualMB commit_total_mb=$totalVirtualMB physical_free_mb=$freePhysicalMB"
          Get-CimInstance Win32_PageFileUsage | ForEach-Object {
            Write-Output "HP_PAGEFILE name=$($_.Name) allocated_mb=$($_.AllocatedBaseSize) used_mb=$($_.CurrentUsage) peak_mb=$($_.PeakUsage)"
          }
          # The owner's HP is a personal computer. Never publish process names.
          $processes = @(Get-Process)
          $top = @($processes | Sort-Object -Property PrivateMemorySize64 -Descending | Select-Object -First 8)
          $topBytes = ($top | Measure-Object -Property PrivateMemorySize64 -Sum).Sum
          Write-Output ("HP_PROCESS_PRESSURE process_count={0} largest_8_private_mb={1}" -f $processes.Count, [math]::Round($topBytes / 1MB))
          Get-CimInstance Win32_ComputerSystem | ForEach-Object {
            Write-Output "HP_SYSTEM total_physical_mb=$([math]::Round($_.TotalPhysicalMemory / 1MB)) automatic_pagefile=$($_.AutomaticManagedPagefile)"
          }
          if ($os.FreeVirtualMemory -lt 2097152) {
            throw 'HP_HEALTH_COMMIT_LIMIT: under 2048 MiB of free virtual memory; do not attempt full build'
          }
          # Inspect only System event metadata, not sensitive event messages.
          Write-Output ("HP_LAST_BOOT_UTC " + $os.LastBootUpTime.ToUniversalTime().ToString('o'))
          try {
            $events = @(Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddHours(-48); Id=@(41,6008,1001,6005,6006,2004,18,19,17,7,51,55)} -MaxEvents 250 -ErrorAction Stop |
              Where-Object {
                $_.ProviderName -match '^(Microsoft-Windows-Kernel-Power|EventLog|Microsoft-Windows-WER-SystemErrorReporting|Microsoft-Windows-Resource-Exhaustion-Detector|Microsoft-Windows-WHEA-Logger|disk|Ntfs)$'
              } | Select-Object -First 20)
            foreach ($ev in $events) {
              Write-Output ("HP_EVENT timestamp_utc={0} id={1} provider={2}" -f $ev.TimeCreated.ToUniversalTime().ToString('o'), $ev.Id, $ev.ProviderName)
            }
            if ($events.Count -eq 0) { Write-Output 'HP_EVENT no matching System events in inspected range' }
          } catch {
            Write-Output ("HP_EVENT_UNAVAILABLE " + $_.Exception.GetType().Name)
          }
          # Review only project-specific memory samples from previous runs.
          $history = Join-Path $env:RUNNER_WORKSPACE '.ur-recomp-hp-native-monitor'
          if (Test-Path -LiteralPath $history) {
            Get-ChildItem -LiteralPath $history -Filter '*.csv' -File |
              Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 3 | ForEach-Object {
                $samples = @(Import-Csv -LiteralPath $_.FullName)
                $min = if ($samples.Count -gt 0) { ($samples | Measure-Object -Property free_commit_mb -Minimum).Minimum } else { 'none' }
                $stopFile = [IO.Path]::ChangeExtension($_.FullName, '.stop')
                $state = if (Test-Path -LiteralPath $stopFile) { 'stopped' } else { 'incomplete_or_interrupted' }
                Write-Output ("HP_PREVIOUS_MONITOR file={0} samples={1} minimum_free_commit_mb={2} state={3}" -f $_.Name, $samples.Count, $min, $state)
              }
          }
          Write-Output 'HP_HEALTH PASS (read-only, no compiler invoked)'

  windows:
    needs: hp-health
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_smoke == true }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require known HP physical runner
        shell: cmd
        run: |
          if /I not "%RUNNER_NAME%"=="hpmini-ur-recomp" (
            echo This isolated test requires the owner's HP, not a generic self-hosted Windows runner.
            exit /b 7
          )
      - name: Expose Git Bash to the service account
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      # Project patches are hash-pinned; Windows Git's autocrlf would rewrite them.
      - name: Keep checkout bytes exact
        run: git config --global core.autocrlf false

      - name: Check out project
        uses: actions/checkout@v4
        # actions/checkout temporarily substitutes HOME on Windows. An earlier
        # global core.autocrlf=false does not reach its git.exe subprocesses.
        # These Git-supported process-local config variables preserve original
        # blob bytes for pinned Cargo locks and patch/hash contracts.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'

      - name: Rehydrate tracked source bytes from Git's canonical index
        shell: bash
        run: |
          set -euo pipefail
          # The persistent Windows worktree can retain CRLF files from a
          # previous checkout even when this job explicitly sets autocrlf=false.
          # Force the tracked files back to their pinned Git blob form.
          git -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          git status --short
      - name: Install service-accessible Python and expose CMake
        shell: cmd
        run: |
          echo C:\Program Files\CMake\bin>>"%GITHUB_PATH%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/devnode_benchmark/prepare_python.ps1
      - name: Preflight ClangCL generator on owner HP
        shell: cmd
        run: |
          cmake -S tools/devnode_benchmark -B "%RUNNER_TEMP%\ur-clangcl-preflight" -G "Visual Studio 17 2022" -A x64 -T ClangCL
          if errorlevel 1 exit /b 1
          cmake --build "%RUNNER_TEMP%\ur-clangcl-preflight" --config Debug --parallel 4
          if errorlevel 1 exit /b 1


      - name: Validate independently nominated same-source tournament candidate
        if: inputs.run_tournament_acceptance
        env:
          QA_APPROVED_SHA: ${{ inputs.candidate_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Tournament candidate must be dispatched on main" >&2; exit 1; }
          [[ "$QA_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid approved source SHA" >&2; exit 1; }
          [[ "$GITHUB_SHA" == "$QA_APPROVED_SHA" ]] || { echo "Checked-out source differs from independent nomination" >&2; exit 1; }

      - name: Verify canonical ROM and package contracts
        run: |
          python tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python -m unittest tests.unit.test_assemble_windows_package tests.unit.test_windows_package_streaming_bounds tests.unit.test_windows_portable_binary tests.unit.test_windows_clean_machine_verifier_policy

      - name: Restore pinned toolchain text directly from Git object bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import tarfile

          def from_index(rel):
              return subprocess.check_output(["git", "cat-file", "blob", "HEAD:" + rel])

          lock_rel = "third_party/cargo/snesrecomp-analyzer/Cargo.lock"
          archive = Path("third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz")
          with tarfile.open(archive, "r:gz") as tar:
              matches = [m for m in tar.getmembers() if m.name.endswith("recompiler-rs/Cargo.lock")]
              if len(matches) != 1:
                  raise SystemExit("Pinned archive must contain exactly one recompiler-rs/Cargo.lock")
              expected_lock = tar.extractfile(matches[0]).read()

          actual_lock = from_index(lock_rel)
          if actual_lock != expected_lock:
              raise SystemExit("Git object Cargo.lock differs from upstream pinned archive")
          entries = [lock_rel]
          for tool in ("snesrecomp", "sdl3"):
              manifest = json.loads(Path("tools/toolchain-entries", tool + ".json").read_text())
              for patch in manifest.get("patches", []):
                  rel = patch["path"]
                  original = from_index(rel)
                  if hashlib.sha256(original).hexdigest() != patch["sha256"]:
                      raise SystemExit("Git blob does not match hash-pinned patch: " + rel)
                  entries.append(rel)
          repaired = []
          for rel in sorted(set(entries)):
              path = Path(rel)
              canonical = from_index(rel)
              if path.read_bytes() != canonical:
                  path.write_bytes(canonical)
                  repaired.append(rel)
          if Path(lock_rel).read_bytes() != expected_lock:
              raise SystemExit("Cargo.lock was not restored byte-exactly")

          # Git for Windows can CRLF-transform files in vendored Rust crates,
          # invalidating Cargo's own .cargo-checksum.json SHA-256 inventory.
          # Restore the *exact committed Git objects* via git archive, which
          # streams blobs without working-tree newline conversion.
          import tempfile
          vendor_prefix = "third_party/cargo/snesrecomp-analyzer/vendor/"
          vendor_count = 0
          vendor_fixed = 0
          with tempfile.TemporaryFile() as snapshot:
              subprocess.run(
                  ["git", "archive", "--format=tar", "HEAD", vendor_prefix.rstrip("/")],
                  stdout=snapshot, check=True,
              )
              snapshot.seek(0)
              with tarfile.open(fileobj=snapshot, mode="r:") as vendor_archive:
                  for member in vendor_archive:
                      rel = member.name.replace(chr(92), "/")
                      if not rel.startswith(vendor_prefix):
                          # git archive includes ancestor directory headers,
                          # e.g. third_party/ and third_party/cargo/.
                          if member.isdir() and vendor_prefix.startswith(rel.rstrip("/") + "/"):
                              continue
                          raise SystemExit("Unexpected path in committed Cargo vendor snapshot: " + rel)
                      if member.isdir():
                          continue
                      if not member.isfile():
                          raise SystemExit("Unsupported non-file in pinned Cargo vendor snapshot: " + rel)
                      dest = Path(rel)
                      if ".." in dest.parts:
                          raise SystemExit("Invalid traversal in pinned Cargo vendor snapshot")
                      if not dest.is_file():
                          raise SystemExit("Vendored source file absent after checkout: " + rel)
                      contents = vendor_archive.extractfile(member).read()
                      vendor_count += 1
                      if dest.read_bytes() != contents:
                          dest.write_bytes(contents)
                          vendor_fixed += 1
          if not vendor_count:
              raise SystemExit("Pinned Cargo vendor snapshot was empty")
          print("Pinned Git bytes verified; corrected", len(repaired), "lock/patch assets.")
          print("Cargo vendor files verified:", vendor_count,
                "checkout-transformed files restored:", vendor_fixed)
          for rel in repaired:
              print("checkout bytes restored:", rel)
          PY
      - name: Diagnose HP Windows memory-commit capacity before native work
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $pagefiles = @(Get-CimInstance -ClassName Win32_PageFileUsage)
          $totalMB = [math]::Round($os.TotalVirtualMemorySize / 1024)
          $freeMB = [math]::Round($os.FreeVirtualMemory / 1024)
          $physicalMB = [math]::Round($os.FreePhysicalMemory / 1024)
          Write-Output "HP_MEMORY_COMMIT total_mb=$totalMB free_mb=$freeMB free_physical_mb=$physicalMB"
          foreach ($pagefile in $pagefiles) {
            Write-Output ("HP_PAGEFILE name={0} allocated_mb={1} current_mb={2} peak_mb={3}" -f $pagefile.Name, $pagefile.AllocatedBaseSize, $pagefile.CurrentUsage, $pagefile.PeakUsage)
          }
          # No user application names, paths, or process IDs in public CI logs.
          $processes = @(Get-Process)
          $top = @($processes | Sort-Object -Property PrivateMemorySize64 -Descending | Select-Object -First 8)
          $topBytes = ($top | Measure-Object -Property PrivateMemorySize64 -Sum).Sum
          Write-Output ("HP_PROCESS_PRESSURE process_count={0} largest_8_private_mb={1}" -f $processes.Count, [math]::Round($topBytes / 1MB))
          # Windows ERROR_COMMITMENT_LIMIT (1455) previously prevented even
          # git apply and the artifact uploader from allocating memory. Leave
          # legitimate pagefile configuration to the HP owner, fail early and
          # explicitly rather than starting an unqualified native build.
          # A 2 GiB buffer was insufficient on this 16 GiB HP: WinError 1455
          # and Event 2004 occurred before a hard freeze. Be conservative.
          if ($os.FreeVirtualMemory -lt 6291456) {
            throw "HP_MEMORY_COMMIT_INSUFFICIENT: less than 6144 MiB virtual commit headroom; skip native build."
          }
          # A quiet period is needed after event ID 2004 even when memory has
          # recovered after reboot. Never alter the owner's pagefile here.
          try {
            $recent = @(Get-WinEvent -FilterHashtable @{
              LogName='System'; StartTime=(Get-Date).AddHours(-1); Id=2004
            } -ErrorAction Stop | Where-Object {
              $_.ProviderName -eq 'Microsoft-Windows-Resource-Exhaustion-Detector'
            })
            if ($recent.Count -gt 0) {
              throw "HP_MEMORY_RECENT_EXHAUSTION: Windows recorded Event 2004 in the past hour; defer the native build."
            }
          } catch {
            if ($_.Exception.Message -match '^HP_MEMORY_RECENT_EXHAUSTION:') { throw }
            # Get-WinEvent throws for zero matches. Other failures should not
            # silently authorize expensive work.
            if ($_.Exception.Message -notmatch 'No events were found') {
              throw "HP_MEMORY_EVENT_CHECK_UNAVAILABLE: $($_.Exception.GetType().Name)"
            }
          }

      - name: Start bounded memory telemetry during native work
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Persist outside RUNNER_TEMP, which may be erased on runner restart.
          $root = Join-Path $env:RUNNER_WORKSPACE '.ur-recomp-hp-native-monitor'
          New-Item -Path $root -ItemType Directory -Force | Out-Null
          $stem = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $telemetry = Join-Path $root "$stem.csv"
          $stop = Join-Path $root "$stem.stop"
          Remove-Item -LiteralPath $telemetry, $stop -ErrorAction SilentlyContinue
          $script = Join-Path $env:RUNNER_TEMP 'hp-commit-pressure-monitor.ps1'
          @'
          param([string]$OutputPath, [string]$StopPath)
          $deadline = (Get-Date).AddMinutes(35)
          'timestamp_utc,free_commit_mb,total_commit_mb,free_physical_mb' | Set-Content -LiteralPath $OutputPath -Encoding ASCII
          while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $StopPath)) {
            try {
              $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
              $stamp = (Get-Date).ToUniversalTime().ToString('o')
              '{0},{1},{2},{3}' -f $stamp, [math]::Round($os.FreeVirtualMemory / 1024), [math]::Round($os.TotalVirtualMemorySize / 1024), [math]::Round($os.FreePhysicalMemory / 1024) | Add-Content -LiteralPath $OutputPath -Encoding ASCII
            } catch {
              ('HP_TELEMETRY_ERROR ' + $_.Exception.Message) | Add-Content -LiteralPath ($OutputPath + '.errors')
            }
            Start-Sleep -Seconds 10
          }
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          # Start-Process joins argument arrays without reliably quoting paths.
          # The HP runner work directory may contain spaces.
          $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$script`" -OutputPath `"$telemetry`" -StopPath `"$stop`""
          $p = Start-Process powershell.exe -ArgumentList $arguments -WindowStyle Hidden -PassThru
          Write-Output "HP_TELEMETRY_STARTED pid=$($p.Id) interval_seconds=10 max_minutes=35"

      - name: Stage repository-owned SNESRecomp framework
        run: |
          set -euo pipefail
          python tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          python tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only
          test -f .tools/src/sdl3/SDL3-3.4.10/CMakeLists.txt
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh
          test -f .tools/src/snesrecomp/runner/runner.cmake

      - name: Prepare pinned Windows Rust and Cargo for native analyzer
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/devnode_benchmark/prepare_rust.ps1
      - name: Scaffold and generate
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-recomp-build"
          mkdir -p "$TMP"
          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --generate \
              --no-build
          ROOT="$TMP/UniracersSNESRecomp"
          python "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py" \
            "$ROOT/src/main.c" \
            --game-rtl "$ROOT/src/game_rtl.c" \
            --cmake "$ROOT/CMakeLists.txt"
          # setup_project.sh can warn on a failed generator and still return 0.
          # A green source-generation stage must include real generated files.
          test -n "$(find "$ROOT/src/gen" -type f -print -quit)"
          grep -q "ur_uniracers_product_after_run_frame" "$ROOT/src/main.c"
          grep -q "hardware_reset = &GameHardwareReset" "$ROOT/src/game_rtl.c"

      - name: Configure and build (Visual Studio, ClangCL, SDL3)
        run: |
          # Some quoted source is deliberately interpreted by a downstream tool.
          set -euo pipefail
          # CMake embeds these paths in generated scripts; backslashes in
          # D:\a\... would be parsed as escapes, so pass mixed (C:/...) form.
          WS="$(cygpath -m "$GITHUB_WORKSPACE")"
          FRAMEWORK="$WS/.tools/src/snesrecomp"
          ROOT="$(cygpath -m "$RUNNER_TEMP")/ur-recomp-build/UniracersSNESRecomp"
          cmake -S "$ROOT" -B "$ROOT/build" -G "Visual Studio 17 2022" -A x64 -T ClangCL \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DSNESRECOMP_SDL3_SOURCE_DIR="$WS/.tools/src/sdl3/SDL3-3.4.10"
          # Cap concurrent compiler processes after Windows logged three
          # resource-exhaustion events and an unexpected reboot.
          cmake --build "$ROOT/build" --config Release --parallel 2
          EXE="$(find "$ROOT/build" -name 'UniracersSNESRecomp.exe' -path '*Release*' | head -n1)"
          test -n "$EXE"
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          ls -la "$(dirname "$EXE")"

          # Portable-package runtime boundary: SDL is static, and the app must
          # not require a separately installed Visual C++ Redistributable.
          EXE_WIN="$(cygpath -w "$EXE")"
          export EXE_WIN
          # PowerShell $ variables are literal source in the outer Bash process.
          # shellcheck disable=SC2016
          powershell.exe -NoProfile -Command '
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products '*' -property installationPath
            # Include standalone BuildTools, which vswhere excludes by default.
            if (-not $vs) {
              $buildTools = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\2022\BuildTools"
              if (Test-Path -LiteralPath (Join-Path $buildTools "VC\Tools\MSVC")) {
                $vs = $buildTools
              }
            }
            if (-not $vs) { throw "Visual Studio Build Tools installation not found" }
            $toolsRoot = Join-Path $vs "VC\Tools\MSVC"
            $tools = Get-ChildItem -LiteralPath $toolsRoot -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $tools) { throw "MSVC tools directory not found" }
            $dumpbin = Join-Path $tools.FullName "bin\Hostx64\x64\dumpbin.exe"
            if (-not (Test-Path -LiteralPath $dumpbin)) { throw "dumpbin.exe not found" }
            & $dumpbin /dependents $env:EXE_WIN
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ' | tee "$RUNNER_TEMP/windows-runtime-dependencies.log"
          if grep -Eiq '(MSVCP[0-9_]*|VCRUNTIME[0-9_]*)\.dll'               "$RUNNER_TEMP/windows-runtime-dependencies.log"; then
            echo "Portable executable unexpectedly depends on the Visual C++ Redistributable." >&2
            exit 1
          fi
          # A Visual Studio runner has DLLs a clean player machine does not.
          # Audit the final PE against an explicit Windows-inbox import policy.
          python tools/check_windows_portable_binary.py \
            --exe "$EXE" \
            --dependencies "$RUNNER_TEMP/windows-runtime-dependencies.log"

      - name: Assemble and verify portable Windows package
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/UR-Recomp-Windows-x64"
          python tools/assemble_windows_package.py assemble \
            --build-dir "$(dirname "$EXE")" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --output "$PACKAGE" \
            --source-revision "$GITHUB_SHA"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"
          python tools/verify_rom.py "$PACKAGE/Uniracers_USA.sfc"
          ARCHIVE="$RUNNER_TEMP/UR-Recomp-Windows-x64.zip"
          python tools/assemble_windows_package.py archive \
            --package "$PACKAGE" \
            --output "$ARCHIVE"
          python tools/assemble_windows_package.py verify-archive \
            --archive "$ARCHIVE"
          REPRO_ARCHIVE="$RUNNER_TEMP/UR-Recomp-Windows-x64-repro.zip"
          python tools/assemble_windows_package.py archive \
            --package "$PACKAGE" \
            --output "$REPRO_ARCHIVE"
          cmp "$ARCHIVE" "$REPRO_ARCHIVE"
          CHECKSUM="$ARCHIVE.sha256"
          python tools/assemble_windows_package.py checksum-archive \
            --archive "$ARCHIVE" \
            --output "$CHECKSUM"
          test -s "$CHECKSUM"
          python tools/assemble_windows_package.py verify-archive-checksum \
            --archive "$ARCHIVE" \
            --checksum "$CHECKSUM"
          {
            echo "PACKAGE=$PACKAGE"
            echo "PACKAGE_ARCHIVE=$ARCHIVE"
            echo "PACKAGE_ARCHIVE_CHECKSUM=$CHECKSUM"
          } >> "$GITHUB_ENV"
          test -f "$PACKAGE/UniracersSNESRecomp.exe"
          test -f "$PACKAGE/Uniracers_USA.sfc"
          test -f "$PACKAGE/rom.cfg"
          test -f "$PACKAGE/run-uniracers.cmd"
          test -f "$PACKAGE/PACKAGE-MANIFEST.json"

      - name: Stage ROM-free executable for independent audit
        run: |
          set -euo pipefail
          python -m unittest -v tests.unit.test_stage_windows_smoke_romfree_exe
          python tools/ci/stage_windows_smoke_romfree_exe.py \
            --package "$PACKAGE" \
            --archive "$PACKAGE_ARCHIVE" \
            --checksum "$PACKAGE_ARCHIVE_CHECKSUM" \
            --source "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/windows-romfree-binary"
          echo "ROM-free exact PE and source/ZIP binding staged; full ROM-bearing package remains on runner." >> "$GITHUB_STEP_SUMMARY"

      - name: Independently verify portable ZIP with stock Windows PowerShell
        run: |
          set -euo pipefail
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tools/Test-URRecompPortable.ps1")"
          ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          CHECKSUM_WIN="$(cygpath -w "$PACKAGE_ARCHIVE_CHECKSUM")"
          PROBE_WIN="$(cygpath -w "$RUNNER_TEMP/standalone windows verifier")"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "$SCRIPT_WIN" \
            -Archive "$ARCHIVE_WIN" \
            -Checksum "$CHECKSUM_WIN" \
            -Destination "$PROBE_WIN" \
            | tee "$RUNNER_TEMP/standalone-windows-verifier.log"
          grep -Fq "UR_PORTABLE_ARCHIVE_VERIFIED" "$RUNNER_TEMP/standalone-windows-verifier.log"
          grep -Fq "UR_PORTABLE_MANIFEST_VERIFIED" "$RUNNER_TEMP/standalone-windows-verifier.log"
          grep -Fq "UR_PORTABLE_CLEAN_MACHINE_PACKAGE_OK" "$RUNNER_TEMP/standalone-windows-verifier.log"
          # Deliver the exact tested standalone verifier with the ZIP pair.
          cp "$GITHUB_WORKSPACE/tools/Test-URRecompPortable.ps1" \
            "$RUNNER_TEMP/Test-URRecompPortable.ps1"

      - name: Clean-package boot and per-user state anchoring
        run: |
          # PowerShell source remains literal until executed by PowerShell.
          set -euo pipefail
          DUMPS="$RUNNER_TEMP/package-boot-dumps"
          CALLER="$RUNNER_TEMP/package launch caller"
          EXTRACT="$RUNNER_TEMP/package extracted"
          USER_DATA="$RUNNER_TEMP/package user data"
          SCRIPT="$RUNNER_TEMP/package-boot.script"
          mkdir -p "$DUMPS" "$CALLER" "$EXTRACT"
          rm -rf "$USER_DATA"
          # Use Windows' native archive reader for actual ZIP distribution.
          PACKAGE_ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          EXTRACT_WIN="$(cygpath -w "$EXTRACT")"
          # PowerShell expands the literal $env variables after handoff.
          # shellcheck disable=SC2016
          PACKAGE_ARCHIVE_WIN="$PACKAGE_ARCHIVE_WIN" EXTRACT_WIN="$EXTRACT_WIN" \
            powershell.exe -NoProfile -NonInteractive -Command \
              '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:PACKAGE_ARCHIVE_WIN -DestinationPath $env:EXTRACT_WIN -Force'
          TEST_PACKAGE="$EXTRACT/UR-Recomp-Windows-x64"
          echo "TEST_PACKAGE=$TEST_PACKAGE" >> "$GITHUB_ENV"
          echo "PACKAGE_USER_DATA=$USER_DATA" >> "$GITHUB_ENV"
          test -f "$TEST_PACKAGE/PACKAGE-MANIFEST.json"
          python tools/verify_rom.py "$TEST_PACKAGE/Uniracers_USA.sfc"
          printf 'until 009F == D7 3600\nwait 30\ndump package-main-menu\nquit\n' > "$SCRIPT"

          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          USER_DATA_WIN="$(cygpath -w "$USER_DATA")"
          SCRIPT_WIN="$(cygpath -w "$SCRIPT")"
          DUMPS_WIN="$(cygpath -w "$DUMPS")"

          set +e
          (
            cd "$CALLER"
            SDL_VIDEODRIVER=offscreen \
            SDL_AUDIODRIVER=dummy \
            SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
            UR_RECOMP_USER_DATA_ROOT="$USER_DATA_WIN" \
              timeout 300 powershell.exe -NoProfile -Command \
                "& '${PACKAGE_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
                >"$RUNNER_TEMP/package-boot.log" 2>&1
          )
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-boot.log"
          test "$RC" -eq 0

          python - "$DUMPS/package-main-menu.wram.bin" <<'PY'
          import pathlib, sys
          wram = pathlib.Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, f"packaged main menu not reached: $9F=0x{wram[0x9F]:02X}"
          print("WINDOWS_PACKAGE_BOOT_MAIN_MENU ok")
          PY

          test -f "$USER_DATA/config.ini"
          test -f "$USER_DATA/keybinds.ini"
          test -f "$USER_DATA/mod-state.toml"
          test -d "$USER_DATA/saves"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$TEST_PACKAGE/keybinds.ini"
          test ! -e "$TEST_PACKAGE/saves"
          test ! -e "$CALLER/config.ini"
          test ! -e "$CALLER/keybinds.ini"
          grep -Fq "Config/saves anchored to user data" "$RUNNER_TEMP/package-boot.log"
          grep -Fq "$USER_DATA_WIN" "$RUNNER_TEMP/package-boot.log"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"
          python tools/assemble_windows_package.py verify-archive \
            --archive "$PACKAGE_ARCHIVE"
          echo "WINDOWS_PACKAGE_USER_DATA_ANCHOR ok"

      - name: Real packaged game under CMD-special paths
        run: |
          set -euo pipefail
          # Invoke the exact shipped verifier in launch mode. It uses native
          # Expand-Archive internally and boots the actual product executable.
          # This catches path quoting failures that a harmless cmd stub cannot.
          SPECIAL_EXTRACT="$RUNNER_TEMP/package & bang! (installed)"
          SPECIAL_DUMPS="$RUNNER_TEMP/package-special-path-dumps"
          test ! -e "$SPECIAL_EXTRACT"
          mkdir -p "$SPECIAL_DUMPS"
          VERIFIER_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tools/Test-URRecompPortable.ps1")"
          ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          CHECKSUM_WIN="$(cygpath -w "$PACKAGE_ARCHIVE_CHECKSUM")"
          EXTRACT_WIN="$(cygpath -w "$SPECIAL_EXTRACT")"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          DUMPS_WIN="$(cygpath -w "$SPECIAL_DUMPS")"
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
            timeout 300 powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass \
              -File "$VERIFIER_WIN" -Archive "$ARCHIVE_WIN" \
              -Checksum "$CHECKSUM_WIN" -Destination "$EXTRACT_WIN" \
              -InputScript "$SCRIPT_WIN" \
              | tee "$RUNNER_TEMP/package-special-path-verifier.log"
          grep -Fq "UR_PORTABLE_REAL_WINDOWS_LAUNCH_EXITED_OK" "$RUNNER_TEMP/package-special-path-verifier.log"
          grep -Fq "UR_PORTABLE_CLEAN_MACHINE_PACKAGE_OK" "$RUNNER_TEMP/package-special-path-verifier.log"

          SPECIAL_PACKAGE="$SPECIAL_EXTRACT/UR-Recomp-Windows-x64"
          SPECIAL_USER="$SPECIAL_EXTRACT/isolated-user-data"
          SPECIAL_CALLER="$SPECIAL_EXTRACT/unrelated launch working directory"
          PACKAGE_WIN="$(cygpath -w "$SPECIAL_PACKAGE")"
          USER_WIN="$(cygpath -w "$SPECIAL_USER")"
          STARTUP_LOG="$SPECIAL_USER/diagnostics/startup.log"
          test -f "$STARTUP_LOG"
          grep -Fq "package_root=$PACKAGE_WIN" "$STARTUP_LOG"
          grep -Fq "user_data_root=$USER_WIN" "$STARTUP_LOG"
          grep -Fq "process_exit=0" "$STARTUP_LOG"
          test ! -e "$SPECIAL_CALLER/config.ini"
          test ! -e "$SPECIAL_CALLER/keybinds.ini"
          test ! -e "$SPECIAL_CALLER/saves"
          test ! -e "$SPECIAL_PACKAGE/config.ini"
          test ! -e "$SPECIAL_PACKAGE/saves"
          python - "$SPECIAL_DUMPS/package-main-menu.wram.bin" <<'PY'
          from pathlib import Path
          import sys
          wram = Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, "special-path packaged main menu not reached"
          print("WINDOWS_PACKAGE_SPECIAL_PATH_MAIN_MENU ok")
          PY
          python tools/assemble_windows_package.py verify --package "$SPECIAL_PACKAGE"
          echo "WINDOWS_PACKAGE_SPECIAL_PATH_ISOLATION ok"

      - name: Read-only portable directory and Unicode user-data cold boots
        run: |
          # Quoted PowerShell source is intentionally literal at the Bash boundary.
          set -euo pipefail
          # Exercise the actual extracted shipping launcher twice. Deny NTFS
          # writes to the disposable install tree, not merely its file attributes;
          # user data must remain writable at a separate non-ASCII Windows path.
          RO_PACKAGE="$RUNNER_TEMP/read-only portable/UR-Recomp-Windows-x64"
          RO_USER="$RUNNER_TEMP/portable user café 雪"
          RO_CALLER="$RUNNER_TEMP/read-only unrelated caller"
          RO_DUMPS="$RUNNER_TEMP/read-only portable dumps"
          test ! -e "$RO_PACKAGE"
          test ! -e "$RO_USER"
          mkdir -p "$(dirname "$RO_PACKAGE")" "$RO_CALLER" "$RO_DUMPS"
          cp -R "$TEST_PACKAGE" "$RO_PACKAGE"
          RO_PACKAGE_WIN="$(cygpath -w "$RO_PACKAGE")"
          export RO_PACKAGE_WIN
          RO_USER_WIN="$(cygpath -w "$RO_USER")"
          RO_SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          export RO_SCRIPT_WIN
          RO_DUMPS_WIN="$(cygpath -w "$RO_DUMPS")"

          cleanup_readonly() {
            # PowerShell $ variables are literal source in the outer Bash process.
          # shellcheck disable=SC2016
          powershell.exe -NoProfile -NonInteractive -Command '
              $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
              & icacls.exe $env:RO_PACKAGE_WIN /remove:d ("*" + $sid) /T | Out-Null
              exit $LASTEXITCODE
            ' || true
          }
          trap cleanup_readonly EXIT
          # PowerShell $ variables are literal source in the outer Bash process.
          # shellcheck disable=SC2016
          powershell.exe -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            & icacls.exe $env:RO_PACKAGE_WIN /deny ("*" + $sid + ":(WD,AD,WA,WEA)") /T | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            try {
              [IO.File]::WriteAllText((Join-Path $env:RO_PACKAGE_WIN "write-probe.txt"), "unexpected")
              throw "Install tree unexpectedly writable"
            } catch [System.UnauthorizedAccessException] {
              Write-Output "WINDOWS_READONLY_INSTALL_DENIAL_VERIFIED"
            }
          '
          for boot in 1 2; do
            # Require each launch to produce its own fresh main-menu witness.
            rm -f "$RO_DUMPS/package-main-menu.wram.bin"
            set +e
            (
              cd "$RO_CALLER"
              # PowerShell $env references remain literal until the child command.
              # shellcheck disable=SC2016
              SDL_VIDEODRIVER=offscreen \
              SDL_AUDIODRIVER=dummy \
              SNESRECOMP_DUMP_DIR="$RO_DUMPS_WIN" \
              UR_RECOMP_USER_DATA_ROOT="$RO_USER_WIN" \
                timeout 300 powershell.exe -NoProfile -NonInteractive -Command \
                  '& (Join-Path $env:RO_PACKAGE_WIN "run-uniracers.cmd") --script $env:RO_SCRIPT_WIN; exit $LASTEXITCODE' \
                  >"$RUNNER_TEMP/read-only-unicode-boot-$boot.log" 2>&1
            )
            RO_RC=$?
            set -e
            cat "$RUNNER_TEMP/read-only-unicode-boot-$boot.log"
            test "$RO_RC" -eq 0
            grep -Fq "Config/saves anchored to user data" "$RUNNER_TEMP/read-only-unicode-boot-$boot.log"
            test -s "$RO_DUMPS/package-main-menu.wram.bin"
            python - "$RO_DUMPS/package-main-menu.wram.bin" <<'PY'
          from pathlib import Path
          import sys
          wram = Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, "read-only Unicode-path boot missed main menu"
          PY
            test -f "$RO_USER/config.ini"
            test -f "$RO_USER/keybinds.ini"
            test -f "$RO_USER/mod-state.toml"
            test -d "$RO_USER/saves"
            test ! -e "$RO_PACKAGE/config.ini"
            test ! -e "$RO_PACKAGE/keybinds.ini"
            test ! -e "$RO_PACKAGE/saves"
            test ! -e "$RO_CALLER/config.ini"
            python tools/assemble_windows_package.py verify --package "$RO_PACKAGE"
            if [ "$boot" -eq 1 ]; then
              FIRST_CONFIG_SHA="$(sha256sum "$RO_USER/config.ini" | cut -d' ' -f1)"
              FIRST_KEYS_SHA="$(sha256sum "$RO_USER/keybinds.ini" | cut -d' ' -f1)"
            fi
          done
          test "$FIRST_CONFIG_SHA" = "$(sha256sum "$RO_USER/config.ini" | cut -d' ' -f1)"
          test "$FIRST_KEYS_SHA" = "$(sha256sum "$RO_USER/keybinds.ini" | cut -d' ' -f1)"
          echo "WINDOWS_READONLY_UNICODE_TWO_COLD_BOOTS ok"


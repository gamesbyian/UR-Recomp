                  assert after and after["f"]==str(frame)
                  assert after["tier"]=="aot" and after["guestPC"]=="82D4EE"
                  frame_ordinals[str(frame)]=[entry["seq"],done["seq"],after["seq"]]
              rf74=json.loads(c.read("rf074-native-resume-origin.json"))

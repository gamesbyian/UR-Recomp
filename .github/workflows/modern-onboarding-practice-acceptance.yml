name: Modern onboarding and practice acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      canonical_candidate:
        description: Reuse the caller run's canonical Modern native candidate
        required: false
        type: boolean
        default: false

concurrency:
  group: modern-onboarding-practice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download canonical Modern native candidate
        if: ${{ inputs.canonical_candidate == true }}
        uses: actions/download-artifact@v4
        with:
          name: modern-native-canonical-candidate
          path: ${{ runner.temp }}/modern-native-canonical-artifact

      - name: Bridge canonical candidate into Onboarding artifact contract
        if: ${{ inputs.canonical_candidate == true }}
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/modern-native-canonical-artifact/modern-native-canonical.tar.gz" -C "$RUNNER_TEMP"
          ROOT="$RUNNER_TEMP/modern-native-canonical/UniracersSNESRecomp"
          test -x "$ROOT/build/UniracersSNESRecomp"
          grep -q "ur_uniracers_product_after_run_frame" "$ROOT/src/main.c"
          grep -q "uniracers_modern_host.cpp" "$ROOT/CMakeLists.txt"
          rm -rf "$RUNNER_TEMP/ur-onboarding-practice"
          mv "$RUNNER_TEMP/modern-native-canonical" "$RUNNER_TEMP/ur-onboarding-practice"
          tar -czf "$RUNNER_TEMP/modern-native-candidate.tar.gz" \
            -C "$RUNNER_TEMP" ur-onboarding-practice

      - name: Upload bridged Modern native candidate
        if: ${{ inputs.canonical_candidate == true }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-onboarding-native-candidate
          path: ${{ runner.temp }}/modern-native-candidate.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Install desktop build dependencies
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          cmake --version
          ninja --version
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config xvfb xdotool \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Stage framework and SDL3
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          python3 tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only

      - name: Scaffold and build Modern native host
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-onboarding-practice"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK"             sh "$FRAMEWORK/tools/new_project/setup_project.sh"               --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"               --dir "$TMP"               --name "Uniracers"               --players 2               --yes --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay               --no-github --no-submodules --no-generate --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 "$GITHUB_WORKSPACE/tools/prepare_native_widescreen_product.py"             --framework "$FRAMEWORK" --project "$ROOT" --rom "$ROM"             --json-out "$RUNNER_TEMP/widescreen-product-prepare.json"
          python3 "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py"             "$ROOT/src/main.c"             --game-rtl "$ROOT/src/game_rtl.c"             --cmake "$ROOT/CMakeLists.txt"

          cmake -S "$ROOT" -B "$ROOT/build"             -DCMAKE_BUILD_TYPE=Release             -DSNESRECOMP_ROOT="$FRAMEWORK"             -DSNESRECOMP_SDL_BACKEND=SDL3             -DSNESRECOMP_SDL3_FETCH=ON             -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"


      - name: Package Modern native candidate
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/modern-native-candidate.tar.gz"             -C "$RUNNER_TEMP" ur-onboarding-practice
          test -s "$RUNNER_TEMP/modern-native-candidate.tar.gz"

      - name: Upload Modern native candidate
        if: ${{ inputs.canonical_candidate != true }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-onboarding-native-candidate
          path: ${{ runner.temp }}/modern-native-candidate.tar.gz
          if-no-files-found: error
          retention-days: 1

  core-acceptance:
    needs: build
    name: core-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [onboarding-rematch, practice, system]
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install native runtime dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xdotool

      - name: Download Modern native candidate
        uses: actions/download-artifact@v4
        with:
          name: modern-onboarding-native-candidate
          path: ${{ runner.temp }}/modern-native-candidate-artifact

      - name: Restore Modern native candidate
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/modern-native-candidate-artifact/modern-native-candidate.tar.gz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp/build/UniracersSNESRecomp"

      - name: Seed dismissed onboarding for independent core shards
        if: matrix.shard != 'onboarding-rematch'
        run: printf 'seen-v1\n' > "$RUNNER_TEMP/onboarding.seen"

      - name: Prove first-run onboarding and dismissal persistence
        if: matrix.shard == 'onboarding-rematch'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          MARKER="$RUNNER_TEMP/onboarding.seen"
          FIRST="$RUNNER_TEMP/onboarding-first.log"
          SECOND="$RUNNER_TEMP/onboarding-second.log"

          rm -f "$MARKER"
          SDL_AUDIODRIVER=dummy           UR_PRODUCT_DIAGNOSTICS=1           UR_ONBOARDING_STATE_PATH="$MARKER"           UR_ONBOARDING_ACCEPTANCE=1             timeout 120s xvfb-run -a "$EXE" "$ROM"               --script "$GITHUB_WORKSPACE/tests/input/modern-main-menu.script"               >"$FIRST" 2>&1

          cat "$FIRST"
          grep -q "UR_ONBOARDING SHOWN first_run=1" "$FIRST"
          grep -q "UR_ONBOARDING BINDINGS keyboard_left=" "$FIRST"
          grep -Eq "UR_ONBOARDING BINDINGS .*keyboard_jump=[^ ]+ .*pad_jump=[^ ]+" "$FIRST"
          grep -q "UR_ONBOARDING DISMISSED" "$FIRST"
          test -s "$MARKER"

          SDL_AUDIODRIVER=dummy           UR_PRODUCT_DIAGNOSTICS=1           UR_ONBOARDING_STATE_PATH="$MARKER"             timeout 120s xvfb-run -a "$EXE" "$ROM"               --script "$GITHUB_WORKSPACE/tests/input/modern-main-menu.script"               >"$SECOND" 2>&1

          cat "$SECOND"
          grep -q "UR_ONBOARDING HIDDEN first_run=0" "$SECOND"
          ! grep -q "UR_ONBOARDING SHOWN" "$SECOND"

      - name: Prove Quick Practice routing can cancel safely
        if: matrix.shard == 'practice'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-practice-cancel.script"
          LOG="$RUNNER_TEMP/practice-cancel.log"
          DUMPS="$RUNNER_TEMP/practice-cancel-dumps"
          MARKER="$RUNNER_TEMP/onboarding.seen"
          PRACTICE_ROOT="$RUNNER_TEMP/practice-cancel-save"
          PRACTICE_INPUT="$RUNNER_TEMP/practice-cancel-input.txt"

          rm -rf "$DUMPS" "$PRACTICE_ROOT"
          mkdir -p "$DUMPS" "$PRACTICE_ROOT"

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_ONBOARDING_STATE_PATH="$MARKER" \
          UR_PRACTICE_SAVE_ROOT="$PRACTICE_ROOT" \
          UR_PRACTICE_INPUT_PATH="$PRACTICE_INPUT" \
          UR_PRACTICE_ACCEPTANCE=1 \
          UR_PRACTICE_CANCEL_ACCEPTANCE=1 \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_PRACTICE STARTED" "$LOG"
          grep -q "UR_PRACTICE ROUTE_CANCELLED" "$LOG"
          grep -q "UR_PRACTICE RESTORED" "$LOG"
          grep -q "UR_EXIT_FRONTEND FRONTEND_READY menu=D7" "$LOG"
          ! grep -q "UR_PRACTICE RACE_READY" "$LOG"
          ! grep -q "UR_PROFILE_AUTOSAVE RESULT" "$LOG"

          START_DIGEST="$(grep 'UR_PRACTICE STARTED' "$LOG" | tail -1 | sed -E 's/.*sram=([0-9A-F]+).*/\1/')"
          RESTORE_DIGEST="$(grep 'UR_PRACTICE RESTORED' "$LOG" | tail -1 | sed -E 's/.*sram=([0-9A-F]+).*/\1/')"
          test -n "$START_DIGEST"
          test "$START_DIGEST" = "$RESTORE_DIGEST"

          python3 - "$DUMPS/practice-cancel-routing.wram.bin" "$DUMPS/practice-cancel-returned-main.wram.bin" <<'PY'
          from pathlib import Path
          import sys

          routing = Path(sys.argv[1]).read_bytes()
          returned = Path(sys.argv[2]).read_bytes()
          if routing[0x009F] != 0x3C or routing[0x0313] == 1:
              raise SystemExit("cancel was not issued during stock rider-select routing")
          if returned[0x009F] != 0xD7 or returned[0x0313] == 1:
              raise SystemExit("cancel did not return to settled Modern main menu")
          print("UR_PRACTICE_CANCEL_RESULT=restored frontend=main race_entered=0")
          PY
      - name: Prove one-action completed-race rematch
        if: matrix.shard == 'onboarding-rematch'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-fast-repeat-results.script"
          LOG="$RUNNER_TEMP/fast-rematch.log"
          DUMPS="$RUNNER_TEMP/fast-rematch-dumps"

          rm -rf "$DUMPS"
          mkdir -p "$DUMPS"

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_FAST_REPEAT_ACCEPTANCE=1 \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_FAST_NAV REMATCH" "$LOG"
          grep -q "UR_FAST_NAV REPEAT_VERIFIED sram_equal=1 course_equal=1 practice=0" "$LOG"

          python3 - "$DUMPS/race-results.wram.bin" "$DUMPS/fast-repeat-race-entered.wram.bin" <<'PY'
          from pathlib import Path
          import sys

          before = Path(sys.argv[1]).read_bytes()
          repeated = Path(sys.argv[2]).read_bytes()
          if repeated[0x0313] != 1:
              raise SystemExit("rematch did not re-enter authoritative active race")
          if before[0x00CE] != repeated[0x00CE]:
              raise SystemExit(
                  f"course changed across rematch: "
                  f"{before[0x00CE]:02X}->{repeated[0x00CE]:02X}")
          print(
              "UR_FAST_REPEAT_RESULT=completed_race_rematch "
              f"course={repeated[0x00CE]:02X} state_leakage=0")
          PY
      - name: Prove one-action Quick Practice repeat preserves isolation
        if: matrix.shard == 'practice'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-practice-repeat-results.script"
          LOG="$RUNNER_TEMP/practice-repeat.log"
          DUMPS="$RUNNER_TEMP/practice-repeat-dumps"
          MARKER="$RUNNER_TEMP/onboarding.seen"
          PRACTICE_ROOT="$RUNNER_TEMP/practice-repeat-save"
          PRACTICE_INPUT="$RUNNER_TEMP/practice-repeat-input.txt"

          rm -rf "$DUMPS" "$PRACTICE_ROOT"
          mkdir -p "$DUMPS" "$PRACTICE_ROOT"

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_ONBOARDING_STATE_PATH="$MARKER" \
          UR_PRACTICE_ACCEPTANCE=1 \
          UR_PRACTICE_SAVE_ROOT="$PRACTICE_ROOT" \
          UR_PRACTICE_INPUT_PATH="$PRACTICE_INPUT" \
          UR_FAST_REPEAT_ACCEPTANCE=1 \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
            timeout 150s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_FAST_NAV REPEAT_PRACTICE" "$LOG"
          grep -q "UR_FAST_NAV REPEAT_VERIFIED sram_equal=1 course_equal=1 practice=1" "$LOG"
          grep -q "script .* dump practice-repeat-results ok" "$LOG"
          grep -q "script .* dump practice-repeat-second-race ok" "$LOG"
          ! grep -q "UR_PROFILE_AUTOSAVE RESULT" "$LOG"

          python3 - \
            "$DUMPS/practice-repeat-first-race.wram.bin" \
            "$DUMPS/practice-repeat-second-race.wram.bin" <<'PY'
          from pathlib import Path
          import sys

          first = Path(sys.argv[1]).read_bytes()
          second = Path(sys.argv[2]).read_bytes()
          if first[0x0313] != 1 or second[0x0313] != 1:
              raise SystemExit("Quick Practice repeat did not re-enter an active race")
          if first[0x00CE] != second[0x00CE]:
              raise SystemExit(
                  f"Quick Practice repeat changed course identity byte: "
                  f"{first[0x00CE]:02X}->{second[0x00CE]:02X}")
          print(
              "UR_PRACTICE_REPEAT_RESULT=one_action_repeat "
              "same_course=1 state_leakage=0")
          PY
      - name: Prove Recent Course relaunch uses isolated Quick Practice
        if: matrix.shard == 'system'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-recent-course-practice.script"
          LOG="$RUNNER_TEMP/recent-course.log"
          DUMPS="$RUNNER_TEMP/recent-course-dumps"
          PRACTICE_ROOT="$RUNNER_TEMP/recent-course-practice-save"
          PRACTICE_INPUT="$RUNNER_TEMP/recent-course-practice-input.txt"

          rm -rf "$DUMPS" "$PRACTICE_ROOT"
          mkdir -p "$DUMPS" "$PRACTICE_ROOT"

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_EXIT_FRONTEND_ACCEPTANCE=active \
          UR_RECENT_COURSE_ACCEPTANCE=1 \
          UR_PRACTICE_SAVE_ROOT="$PRACTICE_ROOT" \
          UR_PRACTICE_INPUT_PATH="$PRACTICE_INPUT" \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
            timeout 150s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_EXIT_FRONTEND FRONTEND_READY menu=D7" "$LOG"
          grep -q "UR_FAST_NAV RECENT_OBSERVED track=" "$LOG"
          grep -q "UR_FAST_NAV RECENT_PRACTICE track=" "$LOG"
          grep -q "UR_PRACTICE STARTED .* track=" "$LOG"
          grep -q "UR_PRACTICE RACE_READY" "$LOG"

          OBSERVED_TRACK="$(grep 'UR_FAST_NAV RECENT_OBSERVED track=' "$LOG" | tail -1 | sed -E 's/.*track=([0-9]+).*/\1/')"
          LAUNCHED_TRACK="$(grep 'UR_FAST_NAV RECENT_PRACTICE track=' "$LOG" | tail -1 | sed -E 's/.*track=([0-9]+).*/\1/')"
          PRACTICE_TRACK="$(grep 'UR_PRACTICE STARTED .* track=' "$LOG" | tail -1 | sed -E 's/.*track=([0-9]+).*/\1/')"
          test -n "$OBSERVED_TRACK"
          test "$OBSERVED_TRACK" = "$LAUNCHED_TRACK"
          test "$OBSERVED_TRACK" = "$PRACTICE_TRACK"
          ! grep -q "UR_PROFILE_AUTOSAVE RESULT" "$LOG"

          python3 - \
            "$DUMPS/recent-source-race.wram.bin" \
            "$DUMPS/recent-returned-main.wram.bin" \
            "$DUMPS/recent-practice-race.wram.bin" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_bytes()
          main = Path(sys.argv[2]).read_bytes()
          repeated = Path(sys.argv[3]).read_bytes()
          if source[0x0313] != 1 or repeated[0x0313] != 1:
              raise SystemExit("Recent Course did not connect two authoritative races")
          if main[0x009F] != 0xD7 or main[0x0313] == 1:
              raise SystemExit("Recent Course shortcut was not launched from settled main menu")
          if source[0x00CE] != repeated[0x00CE]:
              raise SystemExit(
                  f"Recent Course changed course identity byte: "
                  f"{source[0x00CE]:02X}->{repeated[0x00CE]:02X}")
          print(
              "UR_RECENT_COURSE_RESULT=same_authoritative_course "
              "isolated_practice=1 direct_state_write=0")
          PY
      - name: Prove controller removal releases input and pauses only Modern
        if: matrix.shard == 'system'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          MODERN_LOG="$RUNNER_TEMP/controller-hotplug-modern.log"
          AUTHENTIC_LOG="$RUNNER_TEMP/controller-hotplug-authentic.log"

          # A real SDL virtual gamepad is attached during an authoritative
          # race, holds a mapped direction until it reaches the human input
          # word, and is unplugged while still held. The title ends the run.
          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_CONTROLLER_HOTPLUG_ACCEPTANCE=1 \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$MODERN_LOG" 2>&1

          cat "$MODERN_LOG"
          grep -q "UR_CONTROLLER SEAT_CONNECTED seat=1" "$MODERN_LOG"
          grep -Eq "UR_CONTROLLER_HOTPLUG_ACCEPTANCE HELD bits=[0-9A-F]{3}" "$MODERN_LOG"
          grep -q "UR_CONTROLLER SEAT_DISCONNECTED seat=1" "$MODERN_LOG"
          grep -q "UR_CONTROLLER DISCONNECT_PAUSED" "$MODERN_LOG"
          grep -Eq "UR_CONTROLLER_HOTPLUG_ACCEPTANCE RELEASED held=[0-9A-F]{3} after=000 seat_connected=0 paused=1 modern=1" "$MODERN_LOG"
          grep -q "UR_CONTROLLER_HOTPLUG_ACCEPTANCE RECONNECTED seat=1 paused=1 notice=P1 CONTROLLER RECONNECTED" "$MODERN_LOG"

          SDL_AUDIODRIVER=dummy \
          UR_EXECUTION_MODE=authentic \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_CONTROLLER_HOTPLUG_ACCEPTANCE=1 \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$AUTHENTIC_LOG" 2>&1

          cat "$AUTHENTIC_LOG"
          grep -q "UR_HOST_STATE AUTHENTIC_INERT" "$AUTHENTIC_LOG"
          grep -Eq "UR_CONTROLLER_HOTPLUG_ACCEPTANCE RELEASED held=[0-9A-F]{3} after=000 seat_connected=0 paused=0 modern=0" "$AUTHENTIC_LOG"
          ! grep -q "UR_CONTROLLER DISCONNECT_PAUSED" "$AUTHENTIC_LOG"

      - name: Prove authoritative quick practice and SRAM restoration
        if: matrix.shard == 'practice'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          LOG="$RUNNER_TEMP/practice.log"
          MARKER="$RUNNER_TEMP/onboarding.seen"
          PRACTICE_ROOT="$RUNNER_TEMP/practice-save"
          PRACTICE_INPUT="$RUNNER_TEMP/practice-input.txt"
          PRACTICE_RUN="$RUNNER_TEMP/practice-should-not-exist.urrun"

          mkdir -p "$PRACTICE_ROOT"
          rm -f "$PRACTICE_RUN" "$PRACTICE_RUN.input" "$PRACTICE_RUN.urghost"
          SDL_AUDIODRIVER=dummy           UR_PRODUCT_DIAGNOSTICS=1           UR_ONBOARDING_STATE_PATH="$MARKER"           UR_PRACTICE_ACCEPTANCE=1           UR_PRACTICE_SAVE_ROOT="$PRACTICE_ROOT"           UR_PRACTICE_INPUT_PATH="$PRACTICE_INPUT"           UR_RUN_RECORD_CAPTURE_PATH="$PRACTICE_RUN"           UR_EXIT_FRONTEND_ACCEPTANCE=active             timeout 150s xvfb-run -a "$EXE" "$ROM"               --script "$GITHUB_WORKSPACE/tests/input/modern-practice-route.script"               >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_PRACTICE STARTED" "$LOG"
          grep -q "UR_PRACTICE ACCEPT stage=main" "$LOG"
          grep -q "UR_PRACTICE RACE_READY" "$LOG"
          grep -q "UR_PRACTICE RESTORED" "$LOG"
          grep -q "UR_EXIT_FRONTEND FRONTEND_READY menu=D7" "$LOG"
          grep -q "script .* dump practice-race-entered ok" "$LOG"
          grep -q "script .* dump practice-returned-main ok" "$LOG"

          START_DIGEST="$(grep 'UR_PRACTICE STARTED' "$LOG" | tail -1 | sed -E 's/.*sram=([0-9A-F]+).*/\1/')"
          RESTORE_DIGEST="$(grep 'UR_PRACTICE RESTORED' "$LOG" | tail -1 | sed -E 's/.*sram=([0-9A-F]+).*/\1/')"
          test -n "$START_DIGEST"
          test "$START_DIGEST" = "$RESTORE_DIGEST"
          ! grep -q "UR_PROFILE_AUTOSAVE RESULT" "$LOG"
          test ! -e "$PRACTICE_RUN"
          test ! -e "$PRACTICE_RUN.input"
          test ! -e "$PRACTICE_RUN.urghost"

      - name: Prove Authentic mode remains inert
        if: matrix.shard == 'onboarding-rematch'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          LOG="$RUNNER_TEMP/authentic.log"

          SDL_AUDIODRIVER=dummy           UR_EXECUTION_MODE=authentic           UR_PRODUCT_DIAGNOSTICS=1           UR_PRACTICE_ACCEPTANCE=1           UR_ONBOARDING_ACCEPTANCE=1             timeout 120s xvfb-run -a "$EXE" "$ROM"               --script "$GITHUB_WORKSPACE/tests/input/modern-main-menu.script"               >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_HOST_STATE AUTHENTIC_INERT" "$LOG"
          ! grep -q "UR_ONBOARDING SHOWN" "$LOG"
          ! grep -q "UR_PRACTICE STARTED" "$LOG"

      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-onboarding-core-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/onboarding-first.log
            ${{ runner.temp }}/onboarding-second.log
            ${{ runner.temp }}/practice.log
            ${{ runner.temp }}/practice-cancel.log
            ${{ runner.temp }}/practice-cancel-dumps/
            ${{ runner.temp }}/fast-rematch.log
            ${{ runner.temp }}/fast-rematch-dumps/
            ${{ runner.temp }}/practice-repeat.log
            ${{ runner.temp }}/practice-repeat-dumps/
            ${{ runner.temp }}/recent-course.log
            ${{ runner.temp }}/recent-course-dumps/
            ${{ runner.temp }}/controller-hotplug-modern.log
            ${{ runner.temp }}/controller-hotplug-authentic.log
            ${{ runner.temp }}/tour-entry/*.log
            ${{ runner.temp }}/next-event/*.log
            ${{ runner.temp }}/recent-persistence/*.log
            ${{ runner.temp }}/practice-picker/*.log
            ${{ runner.temp }}/tour-overview/*.log
            ${{ runner.temp }}/frontend-options/*.log
            ${{ runner.temp }}/frontend-controls/*.log
            ${{ runner.temp }}/vibration-parity/*.log
            ${{ runner.temp }}/vibration-aux/*.log
            ${{ runner.temp }}/volume/*.log
            ${{ runner.temp }}/pad-glyphs/*.log
            ${{ runner.temp }}/two-player-join/*.log
            ${{ runner.temp }}/parallel-modern-acceptance/*.log
            ${{ runner.temp }}/authentic.log
          if-no-files-found: warn
          retention-days: 7

  independent-acceptance:
    needs: build
    name: independent-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [tour-a, tour-b, feedback-parity, feedback-aux, multiplayer]
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install native runtime dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xdotool

      - name: Download Modern native candidate
        uses: actions/download-artifact@v4
        with:
          name: modern-onboarding-native-candidate
          path: ${{ runner.temp }}/modern-native-candidate-artifact

      - name: Restore Modern native candidate
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/modern-native-candidate-artifact/modern-native-candidate.tar.gz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp/build/UniracersSNESRecomp"

      - name: Run independent Modern acceptance shard
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-onboarding-practice/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SHARD="${{ matrix.shard }}"
          DRIVER="$RUNNER_TEMP/independent-$SHARD"
          mkdir -p "$DRIVER"

          run_case() {
            local name="$1"
            local script="$2"
            local work="$3"
            shift 3
            echo "===== $name ====="
            bash "$GITHUB_WORKSPACE/tests/native/$script" "$EXE" "$ROM" "$RUNNER_TEMP/$work" "$@"               2>&1 | tee "$DRIVER/$name.log"
          }

          case "$SHARD" in
            tour-a)
              run_case recent-persistence run_modern_recent_course_persistence_acceptance.sh recent-persistence
              run_case practice-picker run_modern_practice_picker_acceptance.sh practice-picker
              run_case tour-overview run_modern_tour_overview_acceptance.sh tour-overview
              ;;
            tour-b)
              run_case tour-entry run_modern_tour_entry_acceptance.sh tour-entry
              run_case next-event run_modern_next_event_acceptance.sh next-event
              run_case frontend-options run_modern_frontend_options_acceptance.sh frontend-options
              run_case frontend-controls run_modern_frontend_controls_acceptance.sh frontend-controls
              ;;
            feedback-parity)
              run_case vibration-parity run_modern_vibration_acceptance.sh vibration-parity parity
              ;;
            feedback-aux)
              run_case vibration-aux run_modern_vibration_acceptance.sh vibration-aux aux
              run_case volume run_modern_volume_acceptance.sh volume
              run_case pad-glyphs run_modern_pad_glyph_acceptance.sh pad-glyphs
              ;;
            multiplayer)
              run_case two-player-join run_modern_two_player_join_acceptance.sh two-player-join
              ;;
            *)
              echo "::error::Unknown independent acceptance shard: $SHARD"
              exit 2
              ;;
          esac

      - name: Upload independent acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-onboarding-independent-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/independent-${{ matrix.shard }}/*.log
            ${{ runner.temp }}/tour-entry/*.log
            ${{ runner.temp }}/next-event/*.log
            ${{ runner.temp }}/recent-persistence/*.log
            ${{ runner.temp }}/practice-picker/*.log
            ${{ runner.temp }}/tour-overview/*.log
            ${{ runner.temp }}/frontend-options/*.log
            ${{ runner.temp }}/frontend-controls/*.log
            ${{ runner.temp }}/vibration/*.log
            ${{ runner.temp }}/volume/*.log
            ${{ runner.temp }}/pad-glyphs/*.log
            ${{ runner.temp }}/two-player-join/*.log
          if-no-files-found: warn
          retention-days: 7

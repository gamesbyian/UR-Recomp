      - name: QA-05 packaged Windows default-Return Restart audio and Start-input witness
        run: |
          set -euo pipefail
          LAUNCHER_WIN="$(cygpath -w "$TEST_PACKAGE/run-uniracers.cmd")"
          SCRIPT_WIN="$(cygpath -w "$GITHUB_WORKSPACE/tests/input/audio-modern-restart.script")"
          for attempt in 1 2 3 4 5; do
            ROOT="$RUNNER_TEMP/qa05-restart-user-$attempt"
            LOG="$RUNNER_TEMP/qa05-restart-$attempt.log"
            PCM="$RUNNER_TEMP/qa05-restart-$attempt.raw"
            JSON="$RUNNER_TEMP/qa05-restart-$attempt.json"
            # The self-hosted runner's service desktop does not guarantee a
            # foreground keyboard focus. A legitimate focus-loss auto-pause
            # would freeze the guest before the scripted race checkpoint.
            # This test owns its per-attempt settings; regular players retain
            # their default pause-on-focus-loss behavior.
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            printf 'UR-HOST-STATE/6\nprofile=\npause_on_focus_loss=0\nvibration_enabled=1\n' > "$ROOT/host-state-v1.txt"
            printf 'seen-v1\n' > "$ROOT/qa05-onboarding.seen"
            ROOT_WIN="$(cygpath -w "$ROOT")"
            ONBOARDING_WIN="$(cygpath -w "$ROOT/qa05-onboarding.seen")"
            LOG_WIN="$(cygpath -w "$LOG")"
            PCM_WIN="$(cygpath -w "$PCM")"
            JSON_WIN="$(cygpath -w "$JSON")"
            SDL_VIDEODRIVER=windows \
            SDL_AUDIO_DRIVER=disk \
            SDL_AUDIO_DISK_OUTPUT_FILE="$PCM_WIN" \
            SDL_AUDIO_FORMAT=S16LE \
            SDL_AUDIO_CHANNELS=2 \
            SDL_AUDIO_FREQUENCY=44100 \
            SDL_AUDIO_DISK_TIMESCALE=1.0 \
            UR_EXECUTION_MODE=modern \
            UR_PRODUCT_DIAGNOSTICS=1 \
            UR_PAUSE_OPEN_ACCEPTANCE=1 \
            UR_ONBOARDING_STATE_PATH="$ONBOARDING_WIN" \
            UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
              python -m tools.capture_modern_restart_audio \
                "$LAUNCHER_WIN" "$SCRIPT_WIN" "$LOG_WIN" "$PCM_WIN" \
                --json-out "$JSON_WIN"
            python - "$JSON" <<'PY'
          import json, pathlib, sys
          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert evidence.get("recovery_confirmed") is True
          PY
            # Inspect all twelve post-Restart guest samples, even if the
            # release latch incorrectly disarms before the final sample.
            python -m tools.qa05_restart_input_guard "$LOG"
            grep -Eq 'UR_HOST_STATE LOADED .*pause_on_focus_loss=0 ' "$LOG"
            grep -Fq 'UR_ONBOARDING HIDDEN first_run=0' "$LOG"
            if grep -Fq 'UR_FOCUS_PAUSE APPLIED' "$LOG"; then
              echo "Unexpected focus-loss auto-pause in QA-05" >&2
              exit 1
            fi
            rm -f "$PCM"
            echo "UR_QA05_RESTART_AUDIBLE_ATTEMPT=$attempt/5 passed"
          done
          echo "WINDOWS_QA05_DEFAULT_RETURN_AUDIO=5/5"

      - name: Package refresh preserves user data
        run: |
          # Quoted PowerShell strings are intentionally passed without Bash expansion.
          set -euo pipefail
          test -f "$PACKAGE_USER_DATA/config.ini"
          test -f "$PACKAGE_USER_DATA/keybinds.ini"
          mkdir -p "$PACKAGE_USER_DATA/runs/default" "$PACKAGE_USER_DATA/multiplayer-runs" "$PACKAGE_USER_DATA/saves/profile-default"
          printf 'modern-settings-upgrade-marker\n' > "$PACKAGE_USER_DATA/host-state-v1.txt"
          printf 'profile-catalog-upgrade-marker\n' > "$PACKAGE_USER_DATA/profiles-v1.txt"
          printf 'profile-state-upgrade-marker\n' > "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt"
          printf 'run-upgrade-marker\n' > "$PACKAGE_USER_DATA/runs/default/package-refresh-marker.urrun"
          printf 'multiplayer-run-upgrade-marker\n' > "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urrun"
          printf 'multiplayer-match-upgrade-marker\n' > "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urmatch"
          printf '# package-refresh-binding-marker\n' >> "$PACKAGE_USER_DATA/keybinds.ini"
          printf '# package-refresh-settings-marker\n' >> "$PACKAGE_USER_DATA/config.ini"
          printf '# package-refresh-mod-marker\n' >> "$PACKAGE_USER_DATA/mod-state.toml"

          CONFIG_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/config.ini" | cut -d' ' -f1)"
          KEYBINDS_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/keybinds.ini" | cut -d' ' -f1)"
          MOD_STATE_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/mod-state.toml" | cut -d' ' -f1)"
          MODERN_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/host-state-v1.txt" | cut -d' ' -f1)"
          PROFILE_CATALOG_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/profiles-v1.txt" | cut -d' ' -f1)"
          PROFILE_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt" | cut -d' ' -f1)"
          RUN_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/runs/default/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_RUN_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_MATCH_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urmatch" | cut -d' ' -f1)"

          rm -rf "$TEST_PACKAGE"
          # Package replacement must use the same Windows extraction path.
          PACKAGE_ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          EXTRACT_WIN="$(cygpath -w "$(dirname "$TEST_PACKAGE")")"
          # PowerShell expands the literal $env variables after handoff.
          # shellcheck disable=SC2016
          PACKAGE_ARCHIVE_WIN="$PACKAGE_ARCHIVE_WIN" EXTRACT_WIN="$EXTRACT_WIN" \
            powershell.exe -NoProfile -NonInteractive -Command \
              '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:PACKAGE_ARCHIVE_WIN -DestinationPath $env:EXTRACT_WIN -Force'

          CONFIG_AFTER="$(sha256sum "$PACKAGE_USER_DATA/config.ini" | cut -d' ' -f1)"
          KEYBINDS_AFTER="$(sha256sum "$PACKAGE_USER_DATA/keybinds.ini" | cut -d' ' -f1)"
          MOD_STATE_AFTER="$(sha256sum "$PACKAGE_USER_DATA/mod-state.toml" | cut -d' ' -f1)"
          MODERN_AFTER="$(sha256sum "$PACKAGE_USER_DATA/host-state-v1.txt" | cut -d' ' -f1)"
          PROFILE_CATALOG_AFTER="$(sha256sum "$PACKAGE_USER_DATA/profiles-v1.txt" | cut -d' ' -f1)"
          PROFILE_AFTER="$(sha256sum "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt" | cut -d' ' -f1)"
          RUN_AFTER="$(sha256sum "$PACKAGE_USER_DATA/runs/default/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_RUN_AFTER="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_MATCH_AFTER="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urmatch" | cut -d' ' -f1)"
          test "$CONFIG_BEFORE" = "$CONFIG_AFTER"
          test "$KEYBINDS_BEFORE" = "$KEYBINDS_AFTER"
          test "$MOD_STATE_BEFORE" = "$MOD_STATE_AFTER"
          test "$MODERN_BEFORE" = "$MODERN_AFTER"
          test "$PROFILE_CATALOG_BEFORE" = "$PROFILE_CATALOG_AFTER"
          test "$PROFILE_BEFORE" = "$PROFILE_AFTER"
          test "$RUN_BEFORE" = "$RUN_AFTER"
          test "$MULTIPLAYER_RUN_BEFORE" = "$MULTIPLAYER_RUN_AFTER"
          test "$MULTIPLAYER_MATCH_BEFORE" = "$MULTIPLAYER_MATCH_AFTER"
          grep -Fq "profile-catalog-upgrade-marker" "$PACKAGE_USER_DATA/profiles-v1.txt"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$TEST_PACKAGE/keybinds.ini"
          test ! -e "$TEST_PACKAGE/saves"

          REFRESH_DUMPS="$RUNNER_TEMP/package-refresh-dumps"
          mkdir -p "$REFRESH_DUMPS"
          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          USER_DATA_WIN="$(cygpath -w "$PACKAGE_USER_DATA")"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          REFRESH_DUMPS_WIN="$(cygpath -w "$REFRESH_DUMPS")"
          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_DUMP_DIR="$REFRESH_DUMPS_WIN" \
          UR_RECOMP_USER_DATA_ROOT="$USER_DATA_WIN" \
            timeout 300 powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-refresh-boot.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-refresh-boot.log"
          test "$RC" -eq 0
          grep -Fq "Config/saves anchored to user data" "$RUNNER_TEMP/package-refresh-boot.log"
          grep -Fq "$USER_DATA_WIN" "$RUNNER_TEMP/package-refresh-boot.log"
          test "$MODERN_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/host-state-v1.txt" | cut -d' ' -f1)"
          test "$PROFILE_CATALOG_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/profiles-v1.txt" | cut -d' ' -f1)"
          test "$PROFILE_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt" | cut -d' ' -f1)"
          test "$RUN_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/runs/default/package-refresh-marker.urrun" | cut -d' ' -f1)"
          test "$MULTIPLAYER_RUN_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urrun" | cut -d' ' -f1)"
          test "$MULTIPLAYER_MATCH_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urmatch" | cut -d' ' -f1)"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$TEST_PACKAGE/keybinds.ini"
          test ! -e "$TEST_PACKAGE/saves"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"

          python tools/assemble_windows_package.py verify-archive \
            --archive "$PACKAGE_ARCHIVE"
          echo "WINDOWS_PACKAGE_REFRESH_USER_DATA_PRESERVED ok"

      - name: Legacy portable state migrates once
        run: |
          set -euo pipefail
          LEGACY="$RUNNER_TEMP/package-legacy"
          MIGRATED="$RUNNER_TEMP/package-migrated-user-data"
          rm -rf "$LEGACY" "$MIGRATED"
          cp -R "$TEST_PACKAGE" "$LEGACY"
          cp "$PACKAGE_USER_DATA/config.ini" "$LEGACY/config.ini"
          cp "$PACKAGE_USER_DATA/keybinds.ini" "$LEGACY/keybinds.ini"
          mkdir -p "$LEGACY/mods/preloaded"
          cp "$PACKAGE_USER_DATA/mod-state.toml" "$LEGACY/mods/preloaded/state.toml"
          mkdir -p "$LEGACY/saves"
          printf 'legacy-sram-marker\n' > "$LEGACY/saves/legacy-marker.srm"

          LEGACY_CONFIG="$(sha256sum "$LEGACY/config.ini" | cut -d' ' -f1)"
          LEGACY_KEYS="$(sha256sum "$LEGACY/keybinds.ini" | cut -d' ' -f1)"
          LEGACY_MOD="$(sha256sum "$LEGACY/mods/preloaded/state.toml" | cut -d' ' -f1)"
          LEGACY_SAVE="$(sha256sum "$LEGACY/saves/legacy-marker.srm" | cut -d' ' -f1)"
          LEGACY_WIN="$(cygpath -w "$LEGACY")"
          MIGRATED_WIN="$(cygpath -w "$MIGRATED")"
          powershell.exe -NoProfile -Command \
            "(Get-Item -LiteralPath '${LEGACY_WIN}\\config.ini').IsReadOnly = \$true; (Get-Item -LiteralPath '${LEGACY_WIN}\\keybinds.ini').IsReadOnly = \$true; (Get-Item -LiteralPath '${LEGACY_WIN}\\mods\\preloaded\\state.toml').IsReadOnly = \$true; (Get-Item -LiteralPath '${LEGACY_WIN}\\saves\\legacy-marker.srm').IsReadOnly = \$true"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          DUMPS="$RUNNER_TEMP/package-migration-dumps"
          DUMPS_WIN="$(cygpath -w "$DUMPS")"
          mkdir -p "$DUMPS"
          mkdir -p "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-saves.migrate.tmp/stale.srm"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"

          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
          UR_RECOMP_USER_DATA_ROOT="$MIGRATED_WIN" \
            timeout 300 powershell.exe -NoProfile -Command \
              "& '${LEGACY_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-migration.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-migration.log"
          test "$RC" -eq 0
          test -f "$MIGRATED/config.ini"
          test -f "$MIGRATED/keybinds.ini"
          test -f "$MIGRATED/mod-state.toml"
          test -f "$MIGRATED/saves/legacy-marker.srm"
          grep -Fq "legacy-sram-marker" "$MIGRATED/saves/legacy-marker.srm"
          powershell.exe -NoProfile -Command \
            "if ((Get-Item -LiteralPath '${MIGRATED_WIN}\\config.ini').IsReadOnly -or (Get-Item -LiteralPath '${MIGRATED_WIN}\\keybinds.ini').IsReadOnly -or (Get-Item -LiteralPath '${MIGRATED_WIN}\\mod-state.toml').IsReadOnly -or (Get-Item -LiteralPath '${MIGRATED_WIN}\\saves\\legacy-marker.srm').IsReadOnly) { exit 1 }"
          test -d "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-saves.migrate.tmp/stale.srm"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"
          test "$LEGACY_CONFIG" = "$(sha256sum "$LEGACY/config.ini" | cut -d' ' -f1)"
          test "$LEGACY_KEYS" = "$(sha256sum "$LEGACY/keybinds.ini" | cut -d' ' -f1)"
          test "$LEGACY_MOD" = "$(sha256sum "$LEGACY/mods/preloaded/state.toml" | cut -d' ' -f1)"
          test "$LEGACY_SAVE" = "$(sha256sum "$LEGACY/saves/legacy-marker.srm" | cut -d' ' -f1)"

          powershell.exe -NoProfile -Command \
            "(Get-Item -LiteralPath '${LEGACY_WIN}\\config.ini').IsReadOnly = \$false; (Get-Item -LiteralPath '${LEGACY_WIN}\\keybinds.ini').IsReadOnly = \$false; (Get-Item -LiteralPath '${LEGACY_WIN}\\mods\\preloaded\\state.toml').IsReadOnly = \$false; (Get-Item -LiteralPath '${LEGACY_WIN}\\saves\\legacy-marker.srm').IsReadOnly = \$false"
          printf '# legacy-source-must-not-remigrate-config\n' >> "$LEGACY/config.ini"
          printf '# legacy-source-must-not-remigrate-keybinds\n' >> "$LEGACY/keybinds.ini"
          printf 'legacy-source-must-not-remigrate-save\n' > "$LEGACY/saves/legacy-marker.srm"
          printf '# legacy-source-must-not-remigrate-mod\n' >> "$LEGACY/mods/preloaded/state.toml"
          printf 'destination-wins\n' > "$MIGRATED/saves/legacy-marker.srm"
          mkdir -p "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-saves.migrate.tmp/stale.srm"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"
          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          UR_RECOMP_USER_DATA_ROOT="$MIGRATED_WIN" \
            timeout 300 powershell.exe -NoProfile -Command \
              "& '${LEGACY_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-migration-second.log" 2>&1
          RC=$?
          set -e
          test "$RC" -eq 0
          test -f "$MIGRATED/config.ini"
          test -f "$MIGRATED/keybinds.ini"
          test -f "$MIGRATED/mod-state.toml"
          if grep -Fq "legacy-source-must-not-remigrate-config" "$MIGRATED/config.ini"; then
            echo "::error::Forbidden acceptance diagnostic" >&2
            exit 1
          elif [ "$?" -ne 1 ]; then
            echo "::error::Could not inspect acceptance diagnostic" >&2
            exit 1
          fi
          if grep -Fq "legacy-source-must-not-remigrate-keybinds" "$MIGRATED/keybinds.ini"; then
            echo "::error::Forbidden acceptance diagnostic" >&2
            exit 1
          elif [ "$?" -ne 1 ]; then
            echo "::error::Could not inspect acceptance diagnostic" >&2
            exit 1
          fi
          grep -Fq "destination-wins" "$MIGRATED/saves/legacy-marker.srm"
          if grep -Fq "legacy-source-must-not-remigrate-save" "$MIGRATED/saves/legacy-marker.srm"; then
            echo "::error::Forbidden acceptance diagnostic" >&2
            exit 1
          elif [ "$?" -ne 1 ]; then
            echo "::error::Could not inspect acceptance diagnostic" >&2
            exit 1
          fi
          if grep -Fq "legacy-source-must-not-remigrate-mod" "$MIGRATED/mod-state.toml"; then
            echo "::error::Forbidden acceptance diagnostic" >&2
            exit 1
          elif [ "$?" -ne 1 ]; then
            echo "::error::Could not inspect acceptance diagnostic" >&2
            exit 1
          fi
          test -d "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-saves.migrate.tmp/stale.srm"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          printf 'stale-temp\n' | cmp -s - "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"
          echo "WINDOWS_PACKAGE_LEGACY_MIGRATION ok"

      - name: Boot to main menu
        run: |
          set -euo pipefail
          DUMPS="$RUNNER_TEMP/boot-dumps"
          mkdir -p "$DUMPS"
          printf 'until 009F == D7 3600\nwait 30\ndump boot-main-menu\nquit\n' > "$RUNNER_TEMP/boot.script"
          rm -rf "$(dirname "$EXE")/saves"
          set +e
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy SNESRECOMP_DUMP_DIR="$DUMPS" \
            timeout 300 "$EXE" "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --script "$RUNNER_TEMP/boot.script" >"$RUNNER_TEMP/boot.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/boot.log"
          test "$RC" -eq 0
          python - "$DUMPS/boot-main-menu.wram.bin" <<'PY'
          import pathlib, sys
          wram = pathlib.Path(sys.argv[1]).read_bytes()
          assert wram[0x9F] == 0xD7, f"main menu not reached: $9F=0x{wram[0x9F]:02X}"
          print("WINDOWS_BOOT_MAIN_MENU ok")
          PY

      - name: Representative package startup diagnostics
        run: |
          set -euo pipefail
          assert_bounded_startup_log() {
            local log="$1"
            test -f "$log"
            echo "===== retained startup log: $log ====="
            cat "$log"
            test "$(wc -l < "$log")" -le 12
          }


          BROKEN_ROM="$RUNNER_TEMP/UR-Recomp-Windows-x64-missing-rom"
          cp -R "$TEST_PACKAGE" "$BROKEN_ROM"
          rm "$BROKEN_ROM/Uniracers_USA.sfc"
          BROKEN_ROM_WIN="$(cygpath -w "$BROKEN_ROM")"
          BROKEN_ROM_USER="$RUNNER_TEMP/package-missing-rom-user"
          rm -rf "$BROKEN_ROM_USER"
          BROKEN_ROM_USER_WIN="$(cygpath -w "$BROKEN_ROM_USER")"
          set +e
          UR_RECOMP_USER_DATA_ROOT="$BROKEN_ROM_USER_WIN" \
            powershell.exe -NoProfile -Command \
            "& '${BROKEN_ROM_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
            >"$RUNNER_TEMP/package-missing-rom.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-missing-rom.log"
          test "$RC" -eq 2
          test "$(grep -Fc "UR-STARTUP-ROM-MISSING:" "$RUNNER_TEMP/package-missing-rom.log")" -eq 1
          BROKEN_ROM_LOG="$BROKEN_ROM_USER/diagnostics/startup.log"
          assert_bounded_startup_log "$BROKEN_ROM_LOG"
          test "$(grep -Fc "code=UR-STARTUP-ROM-MISSING" "$BROKEN_ROM_LOG")" -eq 1
          grep -Fq "subsystem=rom" "$BROKEN_ROM_LOG"
          grep -Fq "result=fatal" "$BROKEN_ROM_LOG"

          BROKEN_DATA="$RUNNER_TEMP/UR-Recomp-Windows-x64-missing-runtime"
          cp -R "$TEST_PACKAGE" "$BROKEN_DATA"
          rm -rf "$BROKEN_DATA/mods"
          BROKEN_DATA_WIN="$(cygpath -w "$BROKEN_DATA")"
          BROKEN_DATA_USER="$RUNNER_TEMP/package-missing-runtime-user"
          rm -rf "$BROKEN_DATA_USER"
          BROKEN_DATA_USER_WIN="$(cygpath -w "$BROKEN_DATA_USER")"
          set +e
          UR_RECOMP_USER_DATA_ROOT="$BROKEN_DATA_USER_WIN" \
            powershell.exe -NoProfile -Command \
            "& '${BROKEN_DATA_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
            >"$RUNNER_TEMP/package-missing-runtime.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-missing-runtime.log"
          test "$RC" -eq 2
          test "$(grep -Fc "UR-STARTUP-RUNTIME-DATA:" "$RUNNER_TEMP/package-missing-runtime.log")" -eq 1
          BROKEN_DATA_LOG="$BROKEN_DATA_USER/diagnostics/startup.log"
          assert_bounded_startup_log "$BROKEN_DATA_LOG"
          test "$(grep -Fc "code=UR-STARTUP-RUNTIME-DATA" "$BROKEN_DATA_LOG")" -eq 1
          grep -Fq "subsystem=runtime-data" "$BROKEN_DATA_LOG"
          grep -Fq "result=fatal" "$BROKEN_DATA_LOG"

          EMPTY_MODS="$RUNNER_TEMP/UR-Recomp-Windows-x64-empty-mods"
          cp -R "$TEST_PACKAGE" "$EMPTY_MODS"
          rm -rf "$EMPTY_MODS/mods"
          mkdir -p "$EMPTY_MODS/mods/preloaded/packages"
          EMPTY_MODS_WIN="$(cygpath -w "$EMPTY_MODS")"
          EMPTY_MODS_USER="$RUNNER_TEMP/package-empty-mods-user"
          rm -rf "$EMPTY_MODS_USER"
          EMPTY_MODS_USER_WIN="$(cygpath -w "$EMPTY_MODS_USER")"
          set +e
          UR_RECOMP_USER_DATA_ROOT="$EMPTY_MODS_USER_WIN" \
            powershell.exe -NoProfile -Command \
            "& '${EMPTY_MODS_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
            >"$RUNNER_TEMP/package-empty-mods.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-empty-mods.log"
          test "$RC" -eq 2
          test "$(grep -Fc "UR-STARTUP-RUNTIME-DATA:" "$RUNNER_TEMP/package-empty-mods.log")" -eq 1
          EMPTY_MODS_LOG="$EMPTY_MODS_USER/diagnostics/startup.log"
          assert_bounded_startup_log "$EMPTY_MODS_LOG"
          test "$(grep -Fc "code=UR-STARTUP-RUNTIME-DATA" "$EMPTY_MODS_LOG")" -eq 1
          grep -Fq "Required package directory is empty: mods" "$RUNNER_TEMP/package-empty-mods.log"

          BAD_ROOT="$RUNNER_TEMP/not-a-user-data-directory"
          printf 'not a directory\n' > "$BAD_ROOT"
          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          BAD_ROOT_WIN="$(cygpath -w "$BAD_ROOT")"
          set +e
          UR_RECOMP_USER_DATA_ROOT="$BAD_ROOT_WIN" \
            powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-unwritable-root.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-unwritable-root.log"
          test "$RC" -eq 3
          grep -Fq "UR-STARTUP-SAVE-ROOT:" "$RUNNER_TEMP/package-unwritable-root.log"

          set +e
          env -u UR_RECOMP_USER_DATA_ROOT -u APPDATA \
            powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-missing-appdata.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-missing-appdata.log"
          test "$RC" -eq 3
          grep -Fq "UR-STARTUP-SAVE-ROOT:" "$RUNNER_TEMP/package-missing-appdata.log"
          grep -Fq "APPDATA is unavailable" "$RUNNER_TEMP/package-missing-appdata.log"

          BAD_TYPE_ROOT="$RUNNER_TEMP/package-bad-type-user-data"
          rm -rf "$BAD_TYPE_ROOT"
          mkdir -p "$BAD_TYPE_ROOT/config.ini"
          BAD_TYPE_ROOT_WIN="$(cygpath -w "$BAD_TYPE_ROOT")"
          set +e
          UR_RECOMP_USER_DATA_ROOT="$BAD_TYPE_ROOT_WIN" \
            powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-bad-type-root.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-bad-type-root.log"
          test "$RC" -eq 3
          grep -Fq "UR-STARTUP-SAVE-ROOT:" "$RUNNER_TEMP/package-bad-type-root.log"
          grep -Fq "User data config.ini is a directory" "$RUNNER_TEMP/package-bad-type-root.log"

          set +e
          UR_RECOMP_USER_DATA_ROOT="relative-user-data" \
            powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-relative-root.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-relative-root.log"
          test "$RC" -eq 3
          grep -Fq "UR-STARTUP-SAVE-ROOT:" "$RUNNER_TEMP/package-relative-root.log"
          grep -Fq "must be an absolute Windows path" "$RUNNER_TEMP/package-relative-root.log"
          test ! -e "$TEST_PACKAGE/relative-user-data"

          set +e
          env -u UR_RECOMP_USER_DATA_ROOT APPDATA="relative-appdata" \
            powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-relative-appdata.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-relative-appdata.log"
          test "$RC" -eq 3
          grep -Fq "UR-STARTUP-SAVE-ROOT:" "$RUNNER_TEMP/package-relative-appdata.log"
          grep -Fq "resolved user data root must be an absolute Windows path" "$RUNNER_TEMP/package-relative-appdata.log"
          test ! -e "$TEST_PACKAGE/relative-appdata"

          INSIDE_ROOT_WIN="$(cygpath -w "$TEST_PACKAGE/user-data")"
          set +e
          UR_RECOMP_USER_DATA_ROOT="$INSIDE_ROOT_WIN" \
            powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-inside-root.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-inside-root.log"
          test "$RC" -eq 3
          grep -Fq "UR-STARTUP-SAVE-ROOT:" "$RUNNER_TEMP/package-inside-root.log"
          grep -Fq "must be outside the extracted package" "$RUNNER_TEMP/package-inside-root.log"
          test ! -e "$TEST_PACKAGE/user-data"

          BAD_IMAGE="$RUNNER_TEMP/UR-Recomp-Windows-x64-invalid-rom"
          INVALID_USER="$RUNNER_TEMP/package-invalid-rom-user!data"
          cp -R "$TEST_PACKAGE" "$BAD_IMAGE"
          python - "$BAD_IMAGE/Uniracers_USA.sfc" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          data[0] ^= 0xFF
          path.write_bytes(data)
          PY
          BAD_IMAGE_WIN="$(cygpath -w "$BAD_IMAGE")"
          INVALID_USER_WIN="$(cygpath -w "$INVALID_USER")"
          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          UR_RECOMP_USER_DATA_ROOT="$INVALID_USER_WIN" \
            timeout 60 powershell.exe -NoProfile -Command \
              "& '${BAD_IMAGE_WIN}\\run-uniracers.cmd' --no-launcher; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-invalid-rom.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-invalid-rom.log"
          test "$RC" -ne 0
          test "$(grep -Fc "UR-STARTUP-ROM-INVALID:" "$RUNNER_TEMP/package-invalid-rom.log")" -eq 1
          test -d "$INVALID_USER"
          INVALID_LOG="$INVALID_USER/diagnostics/startup.log"
          assert_bounded_startup_log "$INVALID_LOG"
          test "$(grep -Fc "code=UR-STARTUP-ROM-INVALID" "$INVALID_LOG")" -eq 1
          grep -Fq "build_revision=" "$INVALID_LOG"
          grep -Fq "architecture=x64" "$INVALID_LOG"
          grep -Fq "subsystem=rom" "$INVALID_LOG"
          grep -Fq "result=fatal" "$INVALID_LOG"

          VIDEO_USER="$RUNNER_TEMP/package-video-failure-user"
          rm -rf "$VIDEO_USER"
          VIDEO_USER_WIN="$(cygpath -w "$VIDEO_USER")"
          set +e
          SDL_VIDEODRIVER=ur_invalid_video_driver \
          SDL_AUDIODRIVER=dummy \
          UR_RECOMP_USER_DATA_ROOT="$VIDEO_USER_WIN" \
            timeout 60 powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd' --no-launcher; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-video-failure.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-video-failure.log"
          test "$RC" -ne 0
          test "$(grep -Fc "UR-STARTUP-VIDEO:" "$RUNNER_TEMP/package-video-failure.log")" -eq 1
          VIDEO_LOG="$VIDEO_USER/diagnostics/startup.log"
          assert_bounded_startup_log "$VIDEO_LOG"
          test "$(grep -Fc "schema=ur-startup-log-v1" "$VIDEO_LOG")" -eq 1
          test "$(grep -Fc "build_revision=" "$VIDEO_LOG")" -eq 1
          test "$(grep -Fc "architecture=x64" "$VIDEO_LOG")" -eq 1
          test "$(grep -Fc "code=UR-STARTUP-VIDEO" "$VIDEO_LOG")" -eq 1
          grep -Fq "subsystem=video" "$VIDEO_LOG"
          test "$(grep -Fc "result=fatal" "$VIDEO_LOG")" -eq 1
          test "$(grep -Fc "process_exit=" "$VIDEO_LOG")" -eq 1

          AUDIO_USER="$RUNNER_TEMP/package-audio-failure-user"
          rm -rf "$AUDIO_USER"
          AUDIO_USER_WIN="$(cygpath -w "$AUDIO_USER")"
          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=ur_invalid_audio_driver \
          UR_RECOMP_USER_DATA_ROOT="$AUDIO_USER_WIN" \
            timeout 60 powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd' --no-launcher; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-audio-failure.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-audio-failure.log"
          test "$RC" -ne 0
          test "$(grep -Fc "UR-STARTUP-AUDIO:" "$RUNNER_TEMP/package-audio-failure.log")" -eq 1
          AUDIO_LOG="$AUDIO_USER/diagnostics/startup.log"
          assert_bounded_startup_log "$AUDIO_LOG"
          test "$(grep -Fc "schema=ur-startup-log-v1" "$AUDIO_LOG")" -eq 1
          test "$(grep -Fc "build_revision=" "$AUDIO_LOG")" -eq 1
          test "$(grep -Fc "architecture=x64" "$AUDIO_LOG")" -eq 1
          test "$(grep -Fc "code=UR-STARTUP-AUDIO" "$AUDIO_LOG")" -eq 1
          grep -Fq "subsystem=audio" "$AUDIO_LOG"
          test "$(grep -Fc "result=fatal" "$AUDIO_LOG")" -eq 1
          test "$(grep -Fc "process_exit=" "$AUDIO_LOG")" -eq 1

          echo "WINDOWS_PACKAGE_STARTUP_DIAGNOSTICS ok"

      - name: Same-run packaged Local Tournament acceptance (manual opt-in)
        if: inputs.run_tournament_acceptance
        env:
          QA_APPROVED_SHA: ${{ inputs.candidate_commit_sha }}
          QA_SMOKE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Independently nominate main source; fingerprint only the exact
          # current-run ZIP after validating it, without assuming linker
          # reproducibility across separate Windows runners.
          python tools/assemble_windows_package.py verify-archive-checksum \
            --archive "$PACKAGE_ARCHIVE" --checksum "$PACKAGE_ARCHIVE_CHECKSUM"
          python tools/assemble_windows_package.py verify-archive \
            --archive "$PACKAGE_ARCHIVE"
          ACTUAL_ZIP_SHA256="$(sha256sum "$PACKAGE_ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$ACTUAL_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          QA_APPROVED_ZIP_SHA256="$ACTUAL_ZIP_SHA256"
          test "$QA_APPROVED_SHA" = "$GITHUB_SHA"
          test -d "$TEST_PACKAGE"
          test ! -e "$RUNNER_TEMP/tournament-work"
          printf 'schema=ur-windows-qa-candidate/1\nbackend=snesrecomp\nsmoke_run_id=%s\nsource_commit=%s\ninner_zip_sha256=%s\nqa_harness_commit=%s\n' \
            "$QA_SMOKE_RUN_ID" "$QA_APPROVED_SHA" "$QA_APPROVED_ZIP_SHA256" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/windows-tournament-candidate.txt"
          bash tests/native/run_windows_local_tournament_package_acceptance.sh \
            "$TEST_PACKAGE" "$RUNNER_TEMP/tournament-work"
          python tools/verify_windows_tournament_acceptance_receipt.py \
            --work "$RUNNER_TEMP/tournament-work" \
            --candidate "$RUNNER_TEMP/windows-tournament-candidate.txt" \
            --expected-source "$QA_APPROVED_SHA" \
            --expected-zip-sha256 "$QA_APPROVED_ZIP_SHA256" \
            --expected-harness-sha "$GITHUB_SHA" \
            --expected-smoke-run-id "$QA_SMOKE_RUN_ID" \
            --output-envelope "$RUNNER_TEMP/tournament-qa-envelope.json" \
            | tee "$RUNNER_TEMP/tournament-receipt-verification.log"
          python tools/evidence_contract.py "$RUNNER_TEMP/tournament-qa-envelope.json"

      # ROM-bearing packages are verified internally, never uploaded.
      - name: Stop and summarize bounded memory telemetry
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_WORKSPACE '.ur-recomp-hp-native-monitor'
          if (-not (Test-Path -LiteralPath $root)) {
            Write-Output 'HP_TELEMETRY MISSING (monitor not started)'
            exit 0
          }
          $stem = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $stop = Join-Path $root "$stem.stop"
          New-Item -Path $stop -ItemType File -Force | Out-Null
          $csv = Join-Path $root "$stem.csv"
          if (Test-Path -LiteralPath $csv) {
            # Upload an isolated copy; the durable original survives job cleanup.
            Copy-Item -LiteralPath $csv -Destination (Join-Path $env:RUNNER_TEMP 'hp-commit-pressure.csv') -Force
            if (Test-Path -LiteralPath ($csv + '.errors')) {
              Copy-Item -LiteralPath ($csv + '.errors') -Destination (Join-Path $env:RUNNER_TEMP 'hp-commit-pressure.csv.errors') -Force
            }
            $samples = @(Import-Csv -LiteralPath $csv)
            if ($samples.Count -gt 0) {
              $minimum = ($samples | Measure-Object -Property free_commit_mb -Minimum).Minimum
              Write-Output "HP_TELEMETRY samples=$($samples.Count) minimum_free_commit_mb=$minimum"
            } else {
              Write-Output 'HP_TELEMETRY EMPTY'
            }
          } else {
            Write-Output 'HP_TELEMETRY MISSING (earlier job interruption possible)'
          }

      - name: Verify archive-free Windows artifact upload policy
        if: always()
        shell: bash
        run: |
          python tools/ci/check_windows_smoke_upload_policy.py
          python tools/ci/check_windows_smoke_upload_policy.py --self-test

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-smoke
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/hp-commit-pressure.csv
            ${{ runner.temp }}/hp-commit-pressure.csv.errors
            ${{ runner.temp }}/boot-dumps/
            ${{ runner.temp }}/race-result-dumps/race-results.*
            ${{ runner.temp }}/package-boot-dumps/
            ${{ runner.temp }}/package-race-result-dumps/race-results.*
            ${{ runner.temp }}/UR-Recomp-Windows-x64/PACKAGE-MANIFEST.json
            ${{ runner.temp }}/UR-Recomp-Windows-x64.zip.sha256
            ${{ runner.temp }}/windows-romfree-binary/UniracersSNESRecomp.exe
            ${{ runner.temp }}/windows-romfree-binary/binding.json
            ${{ runner.temp }}/windows-tournament-candidate.txt
            ${{ runner.temp }}/tournament-qa-envelope.json
            !${{ runner.temp }}/**/*.sram.bin
          if-no-files-found: warn
          retention-days: 7


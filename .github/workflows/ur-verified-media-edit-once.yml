name: UR verified continuous recruitment edits ONE-SHOT (never merge workflow)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ur-verified-media-edit-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: ur-verified-media-edits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  edit:
    if: github.event.pull_request.head.ref == 'media/continuous-recruitment-edits-20261010'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      MEDIA_SOURCE_RUN: "38089655141"
      SOURCE_BRANCH: media/continuous-native-sdl-capture-20261010
    steps:
      - name: Check out verified editor branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Install lightweight FFmpeg editing dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Resolve committed genuine gameplay from the other media-only PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/native-verified-source"
          src="media/showcase/2026-10-10/recruitment/continuous"
          mkdir -p "$RUNNER_TEMP/verified-source"
          git show "origin/native-verified-source:$src/ur-native-2p-clean-600f.mp4" \
            > "$RUNNER_TEMP/verified-source/ur-native-2p-clean-600f.mp4"
          git show "origin/native-verified-source:$src/native-continuous-provenance.json" \
            > "$RUNNER_TEMP/verified-source/native-continuous-provenance.json"
          git show "origin/native-verified-source:$src/ur-native-2p-poster-source.png" \
            > "$RUNNER_TEMP/verified-source/ur-native-2p-poster-source.png"
          test -s "$RUNNER_TEMP/verified-source/ur-native-2p-clean-600f.mp4"
          python3 - "$RUNNER_TEMP/verified-source/native-continuous-provenance.json" \
            "$RUNNER_TEMP/verified-source/ur-native-2p-clean-600f.mp4" <<'PY'
          import hashlib,json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert m["status"]=="verified_consecutive_host_presentations"
          assert m["consecutive_host_presentations"]==600
          assert m["guest_frame_start"]==2100 and m["guest_frame_end"]==2699
          assert m["control_guest_crc_sha256"]==m["recorded_guest_crc_sha256"]
          assert hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()==(
            m["published_sha256"]["ur-native-2p-clean-600f.mp4"])
          print("Source video SHA / guest continuity / CRC parity intact")
          PY

      - name: Recover the FFV1 lossless master from the existing accepted CI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lossless"
          gh run download "$MEDIA_SOURCE_RUN" \
            --repo gamesbyian/UR-Recomp \
            --name "ur-native-continuous-2p-one-shot-$MEDIA_SOURCE_RUN" \
            --dir "$RUNNER_TEMP/lossless"
          master=$(find "$RUNNER_TEMP/lossless" -name '*.mkv' -type f -print -quit)
          test -n "$master"
          cp "$master" "$RUNNER_TEMP/verified-source/lossless-original.mkv"
          python3 - "$RUNNER_TEMP/verified-source" <<'PY'
          import hashlib,json,pathlib,sys
          folder=pathlib.Path(sys.argv[1])
          manifest=json.loads((folder/"native-continuous-provenance.json").read_text())
          found=hashlib.sha256((folder/"lossless-original.mkv").read_bytes()).hexdigest()
          assert found==manifest["master"]["sha256"], (found,manifest["master"]["sha256"])
          print("Exact lossless source archive SHA matched:",found)
          PY

      - name: Extract and inspect five genuine consecutive-source moments
        shell: bash
        run: |
          set -euo pipefail
          master="$RUNNER_TEMP/verified-source/lossless-original.mkv"
          out="$RUNNER_TEMP/source-moments"
          mkdir -p "$out"
          for n in 0 150 300 450 599; do
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "$master" \
              -vf "select=eq(n\\,$n)" -vsync vfr -frames:v 1 \
              "$out/source-ordinal-$(printf '%03d' "$n").png"
          done
          python3 - "$master" "$out" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          master=pathlib.Path(sys.argv[1]); dest=pathlib.Path(sys.argv[2])
          w,h=960,540
          selected=[0,150,300,450,599]
          filt="select="+ "+".join(f"eq(n\\,{n})" for n in selected)
          stream=subprocess.run([
            "ffmpeg","-nostdin","-hide_banner","-loglevel","error",
            "-i",str(master),"-vf",filt,"-vsync","vfr",
            "-f","rawvideo","-pix_fmt","rgb24","pipe:1"
          ],check=True,capture_output=True).stdout
          step=w*h*3
          assert len(stream)==5*step, ("Missing actual decoded source moments",len(stream))
          frames=[stream[i*step:(i+1)*step] for i in range(5)]
          counts=[]
          for a,b in zip(frames,frames[1:]):
            count=sum(a[i:i+3]!=b[i:i+3] for i in range(0,step,3))
            counts.append(count)
          assert all(n > 1000 for n in counts), ("Video changes too little",counts)
          result={
            "status":"five_distinct_real_lossless_source_frames",
            "source_dimensions":[w,h],
            "source_ordinals":selected,
            "guest_frames":[2100+n for n in selected],
            "changed_pixels_between_sampled_moments":counts,
            "sampling":"Real decoded FFV1 frames only; no temporal interpolation",
            "source_mkv_sha256":hashlib.sha256(master.read_bytes()).hexdigest(),
            "source_png_sha256":{
              p.name:hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(dest.glob("*.png"))
            }
          }
          (dest/"visual-motion-review.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Render source-led 1080p horizontal and 720p vertical recruitment edits
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import PIL' || python3 -m pip install --user Pillow
          mkdir -p "$RUNNER_TEMP/recruitment-edits"
          python3 tools/showcase/build_continuous_recruitment_edits.py \
            --clip "$RUNNER_TEMP/verified-source/ur-native-2p-clean-600f.mp4" \
            --provenance "$RUNNER_TEMP/verified-source/native-continuous-provenance.json" \
            --teaser media/showcase/2026-10-10/recruitment/ur-recomp-recruitment-teaser-20261010.mp4 \
            --vertical media/showcase/2026-10-10/recruitment/ur-recomp-recruitment-short-vertical-20261010.mp4 \
            --outdir "$RUNNER_TEMP/recruitment-edits"
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,nb_read_frames,r_frame_rate \
            -of json "$RUNNER_TEMP/recruitment-edits/ur-recomp-recruitment-continuous-20261010.mp4"

      - name: Preserve edited videos, sample witnesses and visual review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-continuous-recruitment-edits-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/recruitment-edits/
            ${{ runner.temp }}/source-moments/

      - name: Commit accepted edits and real visual witnesses to draft media PR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          target="media/showcase/2026-10-10/recruitment/continuous-edits"
          mkdir -p "$target"
          cp "$RUNNER_TEMP/recruitment-edits/"* "$target/"
          cp "$RUNNER_TEMP/source-moments/"* "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git diff --cached --check
          git commit -m "media: publish validated real-gameplay recruitment edits and motion witnesses"
          git push origin HEAD:refs/heads/media/continuous-recruitment-edits-20261010

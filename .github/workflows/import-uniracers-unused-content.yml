name: One-shot unused-content reference intake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-uniracers-unused-content.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download reference artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference/imported/tcrf reference/imported/audio/zophar reference/imported/audio

          # Musical Artifacts' own Rails download route. This should reproduce the
          # exact SF2 supplied by the user; validate that identity below.
          curl -fL --retry 3 \
            "https://musical-artifacts.com/artifacts/8387/Uniracers.sf2" \
            -o reference/imported/audio/Uniracers.sf2 || rm -f reference/imported/audio/Uniracers.sf2

          # Zophar hosts the same KungFuFurby Uniracers SPC rip and downloadable
          # renders without TCRF's automated-download block.
          curl -fL --retry 3 \
            "https://fi.zophar.net/soundfiles/nintendo-snes-spc/uniracers/91%20Unused%20Song%201.mp3" \
            -o "reference/imported/audio/zophar/91 Unused Song 1.mp3"
          curl -fL --retry 3 \
            "https://fi.zophar.net/soundfiles/nintendo-snes-spc/uniracers/91%20Unused%20Song%202.mp3" \
            -o "reference/imported/audio/zophar/91 Unused Song 2.mp3"
          curl -fL --retry 3 \
            "https://fi.zophar.net/soundfiles/nintendo-snes-spc/uniracers/Uniracers%20%28EMU%29.zophar.zip" \
            -o "reference/imported/audio/zophar/Uniracers (EMU).zophar.zip"

          # TCRF blocks its /images/ CDN from GitHub-hosted runners. Try both the
          # direct and MediaWiki redirect routes, but don't discard the rest of the
          # corpus if Cloudflare refuses them.
          if ! curl -fL --retry 2 -e "https://tcrf.net/Uniracers" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36" \
            "https://tcrf.net/Special:Redirect/file/Uniracers-Decomp.png" \
            -o reference/imported/tcrf/Uniracers-Decomp.png; then
            rm -f reference/imported/tcrf/Uniracers-Decomp.png
          fi

      - name: Validate downloads
        shell: bash
        run: |
          set -euo pipefail
          test -s "reference/imported/audio/zophar/91 Unused Song 1.mp3"
          test -s "reference/imported/audio/zophar/91 Unused Song 2.mp3"
          test -s "reference/imported/audio/zophar/Uniracers (EMU).zophar.zip"
          file "reference/imported/audio/zophar/91 Unused Song 1.mp3" | grep -qi 'audio\|mpeg'
          file "reference/imported/audio/zophar/91 Unused Song 2.mp3" | grep -qi 'audio\|mpeg'
          unzip -t "reference/imported/audio/zophar/Uniracers (EMU).zophar.zip" >/dev/null

          if test -f reference/imported/audio/Uniracers.sf2; then
            test "$(sha256sum reference/imported/audio/Uniracers.sf2 | cut -d' ' -f1)" = \
              "e6e05bd70a6d04dd131c2aa579622a22f589d0f7886f3af3ef6a24f7c819c2c4"
            file reference/imported/audio/Uniracers.sf2 | grep -qi 'SoundFont'
          fi

          echo "Downloaded source hashes:"
          sha256sum reference/imported/audio/zophar/*
          if test -f reference/imported/audio/Uniracers.sf2; then
            sha256sum reference/imported/audio/Uniracers.sf2
          fi
          if test -f reference/imported/tcrf/Uniracers-Decomp.png; then
            sha256sum reference/imported/tcrf/Uniracers-Decomp.png
          fi

          echo "User-upload derivative hashes for comparison:"
          echo "2d604a47c06fddbbbad53f064c289faa07e454182be7597f9bdd3ae364e95173  Uniracers1.ogg.mp3"
          echo "00cd6be4330ffb503fd5726858734a2ebf5e16825ae2424d3e580ca25c06711e  Uniracers2.ogg.mp3"

      - name: Update provenance note and imported-corpus manifest
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path(".")
          manifest_path = root / "reference/imported/MANIFEST.json"
          manifest = json.loads(manifest_path.read_text())
          candidates = {
              "reference/imported/audio/Uniracers.sf2": "soundfont-reference",
              "reference/imported/tcrf/Uniracers-Decomp.png": "graphics-reference",
              "reference/imported/audio/zophar/91 Unused Song 1.mp3": "unused-audio-reference",
              "reference/imported/audio/zophar/91 Unused Song 2.mp3": "unused-audio-reference",
              "reference/imported/audio/zophar/Uniracers (EMU).zophar.zip": "spc-archive-reference",
          }
          by_path = {entry["path"]: entry for entry in manifest["entries"]}
          rows = []
          for rel, category in candidates.items():
              p = root / rel
              if not p.exists():
                  continue
              data = p.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              entry = {
                  "path": rel,
                  "category": category,
                  "size": len(data),
                  "git_blob_sha1": subprocess.check_output(
                      ["git", "hash-object", rel], text=True
                  ).strip(),
                  "external_sha256": sha256,
                  "review_status": "preservation-only",
              }
              by_path[rel] = entry
              rows.append((rel, len(data), sha256))
          manifest["entries"] = sorted(by_path.values(), key=lambda e: e["path"])
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          note_path = root / "reference/notes/tcrf-unused-content.md"
          note = note_path.read_text()
          note += "\n## Completed binary intake\n\n"
          note += "The first TCRF-direct runner attempt was blocked by HTTP 403 before writing binaries. "
          note += "The repaired intake preserved the source-quality audio corpus from Zophar's copy of the same KungFuFurby rip, "
          note += "including the complete SPC archive. The chat-supplied MP3 derivatives remain fingerprinted above for identity comparison.\n\n"
          note += "| Repository file | Bytes | SHA-256 |\n|---|---:|---|\n"
          for rel, size, sha256 in rows:
              note += f"| \`{rel}\` | {size} | \`{sha256}\` |\n"
          if not (root / "reference/imported/tcrf/Uniracers-Decomp.png").exists():
              note += "\nTCRF continued to block automated retrieval of the raw \`Uniracers-Decomp.png\` media file. "
              note += "The user-supplied rendered copy remains fingerprinted in this note; the ROM itself remains the authority for reproducing the underlying unused tile graphic.\n"
          if not (root / "reference/imported/audio/Uniracers.sf2").exists():
              note += "\nMusical Artifacts blocked automated retrieval of artifact 8387 from the runner. "
              note += "The exact user-supplied SoundFont remains fingerprinted above pending direct-byte ingestion through a binary-capable route.\n"
          note_path.write_text(note)

      - name: Remove one-shot workflow and commit preserved evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-uniracers-unused-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/imported reference/notes/tcrf-unused-content.md .github/workflows/import-uniracers-unused-content.yml
          git commit -m "reference: preserve Uniracers unused-content artifacts"
          git push origin HEAD:main

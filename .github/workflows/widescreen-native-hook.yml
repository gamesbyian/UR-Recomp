name: Native Widescreen runtime hook

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/widescreen-native-hook.yml"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/inspect_native_widescreen_prep_anchor.py"
      - "tools/apply_native_widescreen_hook.py"
      - "tools/analyze_native_widescreen_hook_acceptance.py"
      - "tools/analyze_native_widescreen_reachability.py"
      - "tests/unit/test_seed_native_widescreen_aot.py"
      - "tests/unit/test_inspect_native_widescreen_prep_anchor.py"
      - "tests/unit/test_apply_native_widescreen_hook.py"
      - "tests/unit/test_analyze_native_widescreen_hook_acceptance.py"
      - "tests/unit/test_analyze_native_widescreen_reachability.py"
      - "tests/input/preparation-emission-race.script"
      - "tests/input/object-liveness-dragster.script"
      - "tools/summarize_object_liveness_probe.py"

concurrency:
  group: widescreen-native-hook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Run focused unit coverage
        run: |
          python3 -m unittest \
            tests.unit.test_seed_native_widescreen_aot \
            tests.unit.test_inspect_native_widescreen_prep_anchor \
            tests.unit.test_apply_native_widescreen_hook \
            tests.unit.test_analyze_native_widescreen_hook_acceptance \
            tests.unit.test_analyze_native_widescreen_reachability

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Report preparation-entry call references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          python3 tools/analyze_native_widescreen_reachability.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --json-out analysis/generated/widescreen-native-reachability.json \
            --md-out analysis/generated/widescreen-native-reachability.md
          cat analysis/generated/widescreen-native-reachability.md

      - name: Generate native project and seed preparation wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
            --rom "$ROM" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --no-submodules \
            --generate \
            --no-build
          PROJECT="$ROOT/UniracersSNESRecomp"
          python3 tools/seed_native_widescreen_aot.py "$PROJECT/recomp"
          python3 "$FRAMEWORK/snesrecomp_cli.py" generate \
            --rom "$ROM" \
            --project-root "$PROJECT" \
            --cfg-dir recomp \
            --out-dir src/gen \
            --funcs-h recomp/funcs.h \
            --cfg-roots
          test -d "$PROJECT/src/gen"

      - name: Inspect and apply accepted preparation hook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          python3 tools/inspect_native_widescreen_prep_anchor.py \
            "$PROJECT/src/gen" \
            --radius 48 \
            --json-out analysis/generated/widescreen-native-prep-anchor.json \
            --md-out analysis/generated/widescreen-native-prep-anchor.md
          python3 tools/apply_native_widescreen_hook.py \
            "$PROJECT/src/gen" \
            --json-out analysis/generated/widescreen-native-hook-apply.json
          cat analysis/generated/widescreen-native-prep-anchor.md
          cat analysis/generated/widescreen-native-hook-apply.json

      - name: Build hooked native target
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          cmake -S "$PROJECT" -B "$PROJECT/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF
          cmake --build "$PROJECT/build" -j2
          test -x "$PROJECT/build/UniracersSNESRecomp"

      - name: Exercise stock, +8, +16 and +24
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          EXE="$PROJECT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-native-runs"
          mkdir -p "$ROOT"

          for margin in 0 8 16 24; do
            OUT="$ROOT/$margin"
            mkdir -p "$OUT/dumps"
            echo "== native Widescreen margin $margin =="
            SDL_AUDIODRIVER=dummy \
            URRECOMP_WS_MARGIN="$margin" \
            URRECOMP_WS_NATIVE_TRACE=1 \
            SNESRECOMP_DUMP_DIR="$OUT/dumps" \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$OUT/run.log" 2>&1
            test -s "$OUT/dumps/prep-emission-after-scroll.wram.bin"
            tail -n 30 "$OUT/run.log" || true
          done

      - name: Compare against accepted +8 contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ws-native-runs"
          python3 tools/analyze_native_widescreen_hook_acceptance.py \
            --log-0 "$ROOT/0/run.log" \
            --dump-0 "$ROOT/0/dumps/prep-emission-after-scroll.wram.bin" \
            --log-8 "$ROOT/8/run.log" \
            --dump-8 "$ROOT/8/dumps/prep-emission-after-scroll.wram.bin" \
            --log-16 "$ROOT/16/run.log" \
            --dump-16 "$ROOT/16/dumps/prep-emission-after-scroll.wram.bin" \
            --log-24 "$ROOT/24/run.log" \
            --dump-24 "$ROOT/24/dumps/prep-emission-after-scroll.wram.bin" \
            --json-out analysis/generated/widescreen-native-hook-acceptance.json \
            --md-out analysis/generated/widescreen-native-hook-acceptance.md
          cat analysis/generated/widescreen-native-hook-acceptance.md

      - name: Prove +16 gameplay and activation invariance
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          EXE="$PROJECT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/object-liveness-dragster.script"
          ROOT="$RUNNER_TEMP/ws-native-liveness"
          mkdir -p "$ROOT/0/dumps" "$ROOT/16/dumps" analysis/generated

          for MARGIN in 0 16; do
            SDL_AUDIODRIVER=dummy \
            URRECOMP_WS_MARGIN="$MARGIN" \
            URRECOMP_WS_NATIVE_TRACE=1 \
            SNESRECOMP_DUMP_DIR="$ROOT/$MARGIN/dumps" \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$ROOT/$MARGIN/run.log" 2>&1
            python3 tools/summarize_object_liveness_probe.py \
              "$ROOT/$MARGIN/dumps" \
              --json-out "$ROOT/$MARGIN/summary.json" \
              >"$ROOT/$MARGIN/summary.txt"
          done

          python3 - "$ROOT/0/summary.json" "$ROOT/16/summary.json" \
            analysis/generated/widescreen-native-plus16-liveness.json <<'PY'
          import json
          import pathlib
          import sys

          control=json.loads(pathlib.Path(sys.argv[1]).read_text())
          wide=json.loads(pathlib.Path(sys.argv[2]).read_text())
          cr={x["stem"]:x for x in control["rows"]}
          wr={x["stem"]:x for x in wide["rows"]}
          common=sorted(set(cr)&set(wr))
          diffs=[]
          for stem in common:
              a,b=cr[stem],wr[stem]
              protected={
                  "player_position":(
                      {"x":a["player"]["x"],"y":a["player"]["y"]},
                      {"x":b["player"]["x"],"y":b["player"]["y"]},
                  ),
                  "camera":(a["camera"],b["camera"]),
                  "progress":(a["progress"],b["progress"]),
                  "object_map_prefix_hex":(
                      a["object_map_prefix_hex"],b["object_map_prefix_hex"]
                  ),
              }
              bad={
                  k:{"control":x,"plus16":y}
                  for k,(x,y) in protected.items() if x!=y
              }
              if bad:
                  diffs.append({"stem":stem,"differences":bad})

          out={
              "common_samples":len(common),
              "protected_differences":diffs,
              "control_first_progress_change":control["first_progress_change"],
              "plus16_first_progress_change":wide["first_progress_change"],
              "no_earlier_gameplay_activation_or_collision_path":(
                  not diffs
                  and control["first_progress_change"]==wide["first_progress_change"]
              ),
              "collision_word_note":(
                  "0x0E95 remains diagnostic-only under the established event-relative "
                  "classification; object-map and progression ownership are the activation guardrails."
              ),
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          if not out["no_earlier_gameplay_activation_or_collision_path"]:
              raise SystemExit("+16 gameplay/liveness acceptance diverged")
          PY

      - name: Upload compact native-hook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widescreen-native-hook-evidence
          path: |
            analysis/generated/widescreen-native-reachability.json
            analysis/generated/widescreen-native-reachability.md
            analysis/generated/widescreen-native-prep-anchor.json
            analysis/generated/widescreen-native-prep-anchor.md
            analysis/generated/widescreen-native-hook-apply.json
            analysis/generated/widescreen-native-hook-acceptance.json
            analysis/generated/widescreen-native-hook-acceptance.md
            analysis/generated/widescreen-native-plus16-liveness.json
            ${{ runner.temp }}/ws-native-runs/0/run.log
            ${{ runner.temp }}/ws-native-runs/8/run.log
            ${{ runner.temp }}/ws-native-runs/16/run.log
            ${{ runner.temp }}/ws-native-runs/24/run.log
          if-no-files-found: warn
          retention-days: 7

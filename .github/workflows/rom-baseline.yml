name: ROM baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - ".github/workflows/rom-baseline.yml"
concurrency:
  group: rom-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Stage repository-owned SNESRecomp
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          test -f .tools/src/snesrecomp/tools/new_project/probe_rom.py

      - name: Fingerprint canonical ROM
        shell: bash
        run: |
          set -euo pipefail
          ROM='reference/roms/retail/Uniracers_USA.sfc'
          echo "== file =="
          ls -l "$ROM"
          echo
          echo "== standard digests =="
          sha256sum "$ROM"
          sha1sum "$ROM"
          md5sum "$ROM"
          echo
          echo "== crc32 =="
          python3 - "$ROM" <<'PY'
          import sys, zlib
          from pathlib import Path
          p=Path(sys.argv[1])
          data=p.read_bytes()
          print(f"{zlib.crc32(data) & 0xffffffff:08x}  {p}")
          PY
          echo
          echo "== SNESRecomp cartridge probe =="
          python3 .tools/src/snesrecomp/tools/new_project/probe_rom.py "$ROM"

          PROFILE_CATALOG_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/profiles-v1.txt" | cut -d' ' -f1)"
          PROFILE_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt" | cut -d' ' -f1)"
          RUN_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/runs/default/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_RUN_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_MATCH_BEFORE="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urmatch" | cut -d' ' -f1)"

          rm -rf "$TEST_PACKAGE"
          # Package replacement must use the same Windows extraction path.
          PACKAGE_ARCHIVE_WIN="$(cygpath -w "$PACKAGE_ARCHIVE")"
          EXTRACT_WIN="$(cygpath -w "$(dirname "$TEST_PACKAGE")")"
          PACKAGE_ARCHIVE_WIN="$PACKAGE_ARCHIVE_WIN" EXTRACT_WIN="$EXTRACT_WIN" \
            powershell.exe -NoProfile -NonInteractive -Command \
              '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:PACKAGE_ARCHIVE_WIN -DestinationPath $env:EXTRACT_WIN -Force'

          CONFIG_AFTER="$(sha256sum "$PACKAGE_USER_DATA/config.ini" | cut -d' ' -f1)"
          KEYBINDS_AFTER="$(sha256sum "$PACKAGE_USER_DATA/keybinds.ini" | cut -d' ' -f1)"
          MOD_STATE_AFTER="$(sha256sum "$PACKAGE_USER_DATA/mod-state.toml" | cut -d' ' -f1)"
          MODERN_AFTER="$(sha256sum "$PACKAGE_USER_DATA/host-state-v1.txt" | cut -d' ' -f1)"
          PROFILE_CATALOG_AFTER="$(sha256sum "$PACKAGE_USER_DATA/profiles-v1.txt" | cut -d' ' -f1)"
          PROFILE_AFTER="$(sha256sum "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt" | cut -d' ' -f1)"
          RUN_AFTER="$(sha256sum "$PACKAGE_USER_DATA/runs/default/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_RUN_AFTER="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urrun" | cut -d' ' -f1)"
          MULTIPLAYER_MATCH_AFTER="$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urmatch" | cut -d' ' -f1)"
          test "$CONFIG_BEFORE" = "$CONFIG_AFTER"
          test "$KEYBINDS_BEFORE" = "$KEYBINDS_AFTER"
          test "$MOD_STATE_BEFORE" = "$MOD_STATE_AFTER"
          test "$MODERN_BEFORE" = "$MODERN_AFTER"
          test "$PROFILE_CATALOG_BEFORE" = "$PROFILE_CATALOG_AFTER"
          test "$PROFILE_BEFORE" = "$PROFILE_AFTER"
          test "$RUN_BEFORE" = "$RUN_AFTER"
          test "$MULTIPLAYER_RUN_BEFORE" = "$MULTIPLAYER_RUN_AFTER"
          test "$MULTIPLAYER_MATCH_BEFORE" = "$MULTIPLAYER_MATCH_AFTER"
          grep -Fq "profile-catalog-upgrade-marker" "$PACKAGE_USER_DATA/profiles-v1.txt"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$TEST_PACKAGE/keybinds.ini"
          test ! -e "$TEST_PACKAGE/saves"

          REFRESH_DUMPS="$RUNNER_TEMP/package-refresh-dumps"
          mkdir -p "$REFRESH_DUMPS"
          PACKAGE_WIN="$(cygpath -w "$TEST_PACKAGE")"
          USER_DATA_WIN="$(cygpath -w "$PACKAGE_USER_DATA")"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          REFRESH_DUMPS_WIN="$(cygpath -w "$REFRESH_DUMPS")"
          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_DUMP_DIR="$REFRESH_DUMPS_WIN" \
          UR_RECOMP_USER_DATA_ROOT="$USER_DATA_WIN" \
            timeout 300 powershell.exe -NoProfile -Command \
              "& '${PACKAGE_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-refresh-boot.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-refresh-boot.log"
          test "$RC" -eq 0
          grep -Fq "Config/saves anchored to user data" "$RUNNER_TEMP/package-refresh-boot.log"
          grep -Fq "$USER_DATA_WIN" "$RUNNER_TEMP/package-refresh-boot.log"
          test "$MODERN_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/host-state-v1.txt" | cut -d' ' -f1)"
          test "$PROFILE_CATALOG_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/profiles-v1.txt" | cut -d' ' -f1)"
          test "$PROFILE_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/saves/profile-default/host-profile.txt" | cut -d' ' -f1)"
          test "$RUN_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/runs/default/package-refresh-marker.urrun" | cut -d' ' -f1)"
          test "$MULTIPLAYER_RUN_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urrun" | cut -d' ' -f1)"
          test "$MULTIPLAYER_MATCH_BEFORE" = "$(sha256sum "$PACKAGE_USER_DATA/multiplayer-runs/package-refresh-marker.urmatch" | cut -d' ' -f1)"
          test ! -e "$TEST_PACKAGE/config.ini"
          test ! -e "$TEST_PACKAGE/keybinds.ini"
          test ! -e "$TEST_PACKAGE/saves"
          python tools/assemble_windows_package.py verify --package "$TEST_PACKAGE"

          python tools/assemble_windows_package.py verify-archive \
            --archive "$PACKAGE_ARCHIVE"
          echo "WINDOWS_PACKAGE_REFRESH_USER_DATA_PRESERVED ok"

      - name: Legacy portable state migrates once
        run: |
          set -euo pipefail
          LEGACY="$RUNNER_TEMP/package-legacy"
          MIGRATED="$RUNNER_TEMP/package-migrated-user-data"
          rm -rf "$LEGACY" "$MIGRATED"
          cp -R "$TEST_PACKAGE" "$LEGACY"
          cp "$PACKAGE_USER_DATA/config.ini" "$LEGACY/config.ini"
          cp "$PACKAGE_USER_DATA/keybinds.ini" "$LEGACY/keybinds.ini"
          mkdir -p "$LEGACY/mods/preloaded"
          cp "$PACKAGE_USER_DATA/mod-state.toml" "$LEGACY/mods/preloaded/state.toml"
          mkdir -p "$LEGACY/saves"
          printf 'legacy-sram-marker\n' > "$LEGACY/saves/legacy-marker.srm"

          LEGACY_CONFIG="$(sha256sum "$LEGACY/config.ini" | cut -d' ' -f1)"
          LEGACY_KEYS="$(sha256sum "$LEGACY/keybinds.ini" | cut -d' ' -f1)"
          LEGACY_MOD="$(sha256sum "$LEGACY/mods/preloaded/state.toml" | cut -d' ' -f1)"
          LEGACY_SAVE="$(sha256sum "$LEGACY/saves/legacy-marker.srm" | cut -d' ' -f1)"
          LEGACY_WIN="$(cygpath -w "$LEGACY")"
          MIGRATED_WIN="$(cygpath -w "$MIGRATED")"
          powershell.exe -NoProfile -Command \
            "(Get-Item -LiteralPath '${LEGACY_WIN}\\config.ini').IsReadOnly = \$true; (Get-Item -LiteralPath '${LEGACY_WIN}\\keybinds.ini').IsReadOnly = \$true; (Get-Item -LiteralPath '${LEGACY_WIN}\\mods\\preloaded\\state.toml').IsReadOnly = \$true; (Get-Item -LiteralPath '${LEGACY_WIN}\\saves\\legacy-marker.srm').IsReadOnly = \$true"
          SCRIPT_WIN="$(cygpath -w "$RUNNER_TEMP/package-boot.script")"
          DUMPS="$RUNNER_TEMP/package-migration-dumps"
          DUMPS_WIN="$(cygpath -w "$DUMPS")"
          mkdir -p "$DUMPS"
          mkdir -p "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-saves.migrate.tmp/stale.srm"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"

          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
          UR_RECOMP_USER_DATA_ROOT="$MIGRATED_WIN" \
            timeout 300 powershell.exe -NoProfile -Command \
              "& '${LEGACY_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-migration.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/package-migration.log"
          test "$RC" -eq 0
          test -f "$MIGRATED/config.ini"
          test -f "$MIGRATED/keybinds.ini"
          test -f "$MIGRATED/mod-state.toml"
          test -f "$MIGRATED/saves/legacy-marker.srm"
          grep -Fq "legacy-sram-marker" "$MIGRATED/saves/legacy-marker.srm"
          powershell.exe -NoProfile -Command \
            "if ((Get-Item -LiteralPath '${MIGRATED_WIN}\\config.ini').IsReadOnly -or (Get-Item -LiteralPath '${MIGRATED_WIN}\\keybinds.ini').IsReadOnly -or (Get-Item -LiteralPath '${MIGRATED_WIN}\\mod-state.toml').IsReadOnly -or (Get-Item -LiteralPath '${MIGRATED_WIN}\\saves\\legacy-marker.srm').IsReadOnly) { exit 1 }"
          test ! -e "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          test ! -e "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          test ! -e "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          test ! -e "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"
          test "$LEGACY_CONFIG" = "$(sha256sum "$LEGACY/config.ini" | cut -d' ' -f1)"
          test "$LEGACY_KEYS" = "$(sha256sum "$LEGACY/keybinds.ini" | cut -d' ' -f1)"
          test "$LEGACY_MOD" = "$(sha256sum "$LEGACY/mods/preloaded/state.toml" | cut -d' ' -f1)"
          test "$LEGACY_SAVE" = "$(sha256sum "$LEGACY/saves/legacy-marker.srm" | cut -d' ' -f1)"

          powershell.exe -NoProfile -Command \
            "(Get-Item -LiteralPath '${LEGACY_WIN}\\config.ini').IsReadOnly = \$false; (Get-Item -LiteralPath '${LEGACY_WIN}\\keybinds.ini').IsReadOnly = \$false; (Get-Item -LiteralPath '${LEGACY_WIN}\\mods\\preloaded\\state.toml').IsReadOnly = \$false; (Get-Item -LiteralPath '${LEGACY_WIN}\\saves\\legacy-marker.srm').IsReadOnly = \$false"
          printf '# legacy-source-must-not-remigrate-config\n' >> "$LEGACY/config.ini"
          printf '# legacy-source-must-not-remigrate-keybinds\n' >> "$LEGACY/keybinds.ini"
          printf 'legacy-source-must-not-remigrate-save\n' > "$LEGACY/saves/legacy-marker.srm"
          printf '# legacy-source-must-not-remigrate-mod\n' >> "$LEGACY/mods/preloaded/state.toml"
          printf 'destination-wins\n' > "$MIGRATED/saves/legacy-marker.srm"
          mkdir -p "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-saves.migrate.tmp/stale.srm"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          printf 'stale-temp\n' > "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"
          set +e
          SDL_VIDEODRIVER=offscreen \
          SDL_AUDIODRIVER=dummy \
          UR_RECOMP_USER_DATA_ROOT="$MIGRATED_WIN" \
            timeout 300 powershell.exe -NoProfile -Command \
              "& '${LEGACY_WIN}\\run-uniracers.cmd' --script '${SCRIPT_WIN}'; exit \$LASTEXITCODE" \
              >"$RUNNER_TEMP/package-migration-second.log" 2>&1
          RC=$?
          set -e
          test "$RC" -eq 0
          test -f "$MIGRATED/config.ini"
          test -f "$MIGRATED/keybinds.ini"
          test -f "$MIGRATED/mod-state.toml"
          ! grep -Fq "legacy-source-must-not-remigrate-config" "$MIGRATED/config.ini"
          ! grep -Fq "legacy-source-must-not-remigrate-keybinds" "$MIGRATED/keybinds.ini"
          grep -Fq "destination-wins" "$MIGRATED/saves/legacy-marker.srm"
          ! grep -Fq "legacy-source-must-not-remigrate-save" "$MIGRATED/saves/legacy-marker.srm"
          ! grep -Fq "legacy-source-must-not-remigrate-mod" "$MIGRATED/mod-state.toml"
          test ! -e "$MIGRATED/.ur-recomp-saves.migrate.tmp"
          test ! -e "$MIGRATED/.ur-recomp-config.ini.migrate.tmp"
          test ! -e "$MIGRATED/.ur-recomp-keybinds.ini.migrate.tmp"
          test ! -e "$MIGRATED/.ur-recomp-mod-state.toml.migrate.tmp"
          echo "WINDOWS_PACKAGE_LEGACY_MIGRATION ok"


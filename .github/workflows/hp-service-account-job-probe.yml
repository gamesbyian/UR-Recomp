name: HP NETWORK SERVICE atomic Job Object probe

# Deliberately owner-only. Does not install runner hooks or start broker work.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hp-service-atomic-job-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atomic-service-probe:
    if: >-
      github.repository == 'gamesbyian/UR-Recomp' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, hp-mini, ur-recomp]
    timeout-minutes: 5
    steps:
      - name: Require intended runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'hpmini-ur-recomp') {
            throw 'Refusing to run on an unexpected machine'
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify main SHA and atomic Windows service identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw 'Checked-out code does not match the assigned main SHA'
          }
          $py = 'C:\DevNode\runners\UR-Recomp\_work\.devnode-tools\python-3.12.10\python.exe'
          if (-not (Test-Path -LiteralPath $py -PathType Leaf)) {
            throw 'Missing existing shared Python runtime'
          }
          & $py -B tools/hp_service_account_job_probe.py --require-network-service
          if ($LASTEXITCODE -ne 0) {
            throw "NETWORK SERVICE atomic Job Object proof failed with $LASTEXITCODE"
          }

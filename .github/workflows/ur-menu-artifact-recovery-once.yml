name: UR menu footage artifact recovery ONE-SHOT

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ur-menu-artifact-recovery-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'media/native-title-menu-footage-20261010'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa-evidence-only
          persist-credentials: false
      - name: Recover successfully validated source from original native run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovered"
          gh run download 38091213101 \
            --repo gamesbyian/UR-Recomp \
            --name ur-native-title-menu-one-shot-38091213101 \
            --dir "$RUNNER_TEMP/recovered"
          find "$RUNNER_TEMP/recovered" -type f -printf '%P %s bytes\n' | sort
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends ffmpeg
          python3 - "$RUNNER_TEMP/recovered" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          root,repo=map(pathlib.Path,sys.argv[1:])
          def get(name):
              items=list(root.rglob(name))
              assert len(items)==1,(name,items)
              return items[0]
          manifest=root/"native-media-recorded/native-title-menu-provenance.json"
          data=json.loads(manifest.read_text())
          assert data["status"]=="verified_consecutive_host_presentations"
          assert data["guest_frame_start"]==30 and data["guest_frame_end"]==929
          assert data["consecutive_host_presentations"]==900
          assert data["control_guest_crc_sha256"]==data["recorded_guest_crc_sha256"]
          assert data["dropped_or_skipped_host_frame_ids"]==0
          master=get("ur-native-title-menu-lossless.mkv")
          assert hashlib.sha256(master.read_bytes()).hexdigest()==data["master"]["sha256"]
          index=get("ur-native-title-menu-lossless.mkv.frames.tsv")
          assert hashlib.sha256(index.read_bytes()).hexdigest()==data["index_sha256"]
          frames=[line.split("\t") for line in index.read_text().splitlines()[1:]]
          assert len(frames)==900
          assert all(int(row[0])==i and int(row[1])==30+i for i,row in enumerate(frames))
          # Multiple logs were uploaded; require exact native recording completion.
          logs=[p for p in root.rglob("log.txt") if "native-media-recorded" in str(p)]
          assert len(logs)==1,logs
          assert "UR_NATIVE_VIDEO_END actual=900 expected=900 last=929 ffmpeg_status=0 status=complete" in logs[0].read_text()
          mp4=get("ur-native-title-menu-900f.mp4")
          probe=json.loads(subprocess.run(["ffprobe","-v","error","-count_frames",
              "-select_streams","v:0","-show_entries",
              "stream=width,height,nb_read_frames,r_frame_rate","-of","json",str(mp4)],
              text=True,capture_output=True,check=True).stdout)["streams"][0]
          assert (probe["width"],probe["height"],int(probe["nb_read_frames"]))==(1920,1080,900),probe
          raw=(repo/"baldosa-evidence-only/tests/routes/race_1p.txt").read_text()
          assert raw.count("turbo on\n")==1
          modified=raw.replace("turbo on\n","turbo off\n",1)
          data["input_route_sha256"]=hashlib.sha256(modified.encode()).hexdigest()
          data["input_route_description"]="Pinned upstream 1P original menu route, single turbo-on to turbo-off change"
          data["native_game_pin"]="10b864b9d14a7b7416dd909eb7b054c88faef101"
          data["native_framework_pin"]="075fbe4c8e0d97b0013be541795c39cb644a9709"
          data["native_executable_sha256"]=get("native-binary-sha256.txt").read_text().split()[0]
          data["rom_sha256"]="859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478"
          data["ci_execution"]="https://github.com/gamesbyian/UR-Recomp/actions/runs/38091213101"
          data["ci_source_artifact_id"]=11684691069
          data["presentation_mode"]="original fixed-width title/menu 256x224 in SDL 960x540 16:9 drawable; no invented wide-world title content"
          data["delivery_output"]={"width":1920,"height":1080,"source_drawable":[960,540],"upscale":"nearest-neighbour 2x"}
          target=repo/"media/showcase/2026-10-10/recruitment/native-menu"
          target.mkdir(parents=True,exist_ok=True)
          import shutil
          for file in (mp4,get("ur-native-title-menu-poster.png")):
              shutil.copyfile(file,target/file.name)
              data.setdefault("published_sha256",{})[file.name]=hashlib.sha256(file.read_bytes()).hexdigest()
          (target/"native-title-menu-provenance.json").write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          print("ACCEPTED title/menu artifact recovery; 900 guest frames, 15s nominal",data["published_sha256"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/2026-10-10/recruitment/native-menu/
          git diff --cached --check
          git commit -m "media: commit verified native title and menu footage from retained CI artifact"
          git push origin HEAD:refs/heads/media/native-title-menu-footage-20261010

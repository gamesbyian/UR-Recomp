# RF065: real pinned original Snes9x source compilation, NO ROM execution.
# Narrow merge gate: the Python patch fixtures alone cannot prove that the
# actual historical original 2014 C++ translation units still compile.
name: QA01 original 2014 stack observer source compile

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/qa01-original-stack-producer-compile.yml"
      - "tools/qa01_rf044_stack_bus_witness.py"
      - "tools/qa01_rf045_source_stack_macro_witness.py"
      - "tools/qa01_rf063_original_shared_sequence.py"
      - "tools/qa01_rf064_original_post_call_pull.py"
      - "tools/qa01_rf066_original_consumed_sequence.py"
      - "tools/qa01_rf069_original_getset_binary_audit.py"
      # RF083/RF090/RF091 original CPU/APU observer: exact original compile gate.
      - "tools/qa01_rf083_original_sound_dp_first_writer.py"
      - "tests/unit/test_qa01_rf083_original_sound_dp_first_writer.py"
      # RF094 optional post-DSP and late-F7 source compile qualification.
      - "tools/qa01_rf094_spc_dsp_followthrough.py"
      - "tools/qa01_rf094_spc_dsp_report.py"
      - "tests/unit/test_qa01_rf094_spc_dsp_followthrough.py"
      - "tests/unit/test_qa01_rf094_f7_report.py"
      - "tools/qa01_rf070_original_sa1_probe_isolation.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snes9x-libretro.json"
      - "third_party/manifest.json"
      - "third_party/src/snes9x-libretro/**"
      - "tools/validate_island.py"
      - "tools/patches/snes9x-snesref-debug-exports.patch"

permissions:
  contents: read

concurrency:
  group: qa01-original-stack-compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  original-source-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact pinned uninstrumented original core
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          # --offline bootstraps repository-owned VENDORED source without .git.
          # A git rev-parse here accidentally resolves the PARENT PR checkout;
          # instead check the upstream revision AND the exact source-tree hash.
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.validate_island import tree_sha256
          island=json.loads(Path("third_party/manifest.json").read_text())
          c=next(x for x in island["components"] if x["id"]=="snes9x-libretro")
          t=json.loads(Path("tools/toolchain-entries/snes9x-libretro.json").read_text())
          pin="1bcc369e89f08243e0a462882fb1f3e42e51de3a"
          assert c["revision"] == t["revision"] == pin
          assert c["source_sha256"] == tree_sha256(Path(c["source_path"]))
          assert c["mode"]=="vendored"
          print("RF065 original upstream commit and vendored pristine source SHA verified")
          PY
          test -s "$SRC/libretro/snes9x_libretro.so"
          mkdir -p "$RUNNER_TEMP/rf065"
          sha256sum "$SRC/libretro/snes9x_libretro.so" > "$RUNNER_TEMP/rf065/stock-core-sha256.txt"
      - name: Stage genuine original CPU/stack probes without adding guest bus calls
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          python3 tools/qa01_rf044_stack_bus_witness.py original --root "$SRC"
          python3 tools/qa01_rf045_source_stack_macro_witness.py --root "$SRC"
          python3 tools/qa01_rf063_original_shared_sequence.py --root "$SRC"
          python3 tools/qa01_rf064_original_post_call_pull.py --root "$SRC"
          python3 tools/qa01_rf066_original_consumed_sequence.py --root "$SRC"
          python3 tools/qa01_rf070_original_sa1_probe_isolation.py --root "$SRC"
          grep -Fq 'UR_QA01_RF063_SOURCE_BUS_CHECKPOINT_SEQUENCE' "$SRC/getset.h"
          grep -Fq 'UR_QA01_RF063_SOURCE_BUS_CHECKPOINT_SEQUENCE' "$SRC/cpuexec.cpp"
          grep -Fq 'UR_QA01_RF064_ORIGINAL_POST_CALL_PULL_JOIN' "$SRC/cpuops.cpp"
          grep -Fq 'UR_QA01_RF066_ORIGINAL_POST_CALL_EXECUTED_READ' "$SRC/cpuops.cpp"
          grep -Fq 'UR_QA01_RF070_ORIGINAL_MAIN_CPU_ONLY_SA1_ISOLATION' "$SRC/cpuops.cpp"
          test "$(grep -Fc 'ur_rf064_post_pull("pullB"' "$SRC/cpuops.cpp")" -eq 1
          test "$(grep -Fc 'ur_rf064_post_pull("pullW"' "$SRC/cpuops.cpp")" -eq 1
          sha256sum "$SRC/getset.h" "$SRC/cpuexec.cpp" "$SRC/cpuops.cpp" > "$RUNNER_TEMP/rf065/instrumented-source-sha256.txt"
      - name: Compile instrumented original real 2014 Snes9x C++ library
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          # Pinned 2014 Makefile has only %.o: %.cpp and %.o: %.c;
          # changing getset.h does NOT invalidate all old stock .o files.
          # An incremental link can mix getset versions under LTO.
          make -C "$SRC/libretro" clean
          make -C "$SRC/libretro" -j2
          test -s "$SRC/libretro/snes9x_libretro.so"
          sha256sum "$SRC/libretro/snes9x_libretro.so" > "$RUNNER_TEMP/rf065/instrumented-core-sha256.txt"
          cp "$SRC/libretro/snes9x_libretro.so" "$RUNNER_TEMP/rf065/instrumented-original-libretro.so"
          python3 tools/qa01_rf069_original_getset_binary_audit.py \
            --binary "$SRC/libretro/snes9x_libretro.so" \
            --out "$RUNNER_TEMP/rf065/rf069-actual-original-ELF-getset.json"
          # Recheck actual files, not just a build-completion exit code.
          test -s "$RUNNER_TEMP/rf065/rf069-actual-original-ELF-getset.json"
          {
            echo "Original upstream source revision: 1bcc369e89f08243e0a462882fb1f3e42e51de3a (verified vendored island source SHA)"
            echo "UR-Recomp workflow source SHA: $GITHUB_SHA"
            echo "Stock original built, all stale objects removed, all RF044/RF045/RF063/RF064/RF066 source objects rebuilt; actual linked ELF getters/setters carry the read/write guards."
            echo "No ROM, movie, controller input, native replay, evidence normalization or USA event admission."
            echo "USA event gate: 0/45. Windows release gates: 0/12."
          } > "$RUNNER_TEMP/rf065/README.txt"
          cat "$RUNNER_TEMP/rf065/README.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep compact immutable compile receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf065-original-stack-source-build-receipt
          path: ${{ runner.temp }}/rf065/
          retention-days: 14
          if-no-files-found: warn

  # The separate Zoo RF083 observer modifies genuine 2014 getset, CPU,
  # opcode macro and PPU translation units. Python source-injection tests and
  # an older Zoo binary do not establish that THIS patched observer links.
  # Keep this independent of the historical RF065 stack-audit object layout.
  original-rf083-cpu-apu-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap and pin pristine original Snes9x 2014 source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.validate_island import tree_sha256
          island=json.loads(Path("third_party/manifest.json").read_text())
          item=next(x for x in island["components"] if x["id"]=="snes9x-libretro")
          pin=json.loads(Path("tools/toolchain-entries/snes9x-libretro.json").read_text())
          assert item["revision"] == pin["revision"] == "1bcc369e89f08243e0a462882fb1f3e42e51de3a"
          assert item["mode"] == "vendored"
          assert item["source_sha256"] == tree_sha256(Path(item["source_path"]))
          print("RF083 ORIGINAL_SOURCE_PIN=passed")
          PY
          test -s "$SRC/libretro/snes9x_libretro.so"
      - name: Inject only source-bounded RF083 and clean-compile actual original core
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          mkdir -p "$RUNNER_TEMP/rf083"
          python3 tools/qa01_rf083_original_sound_dp_first_writer.py --root "$SRC"
          # Actual pinned original source: the CPU RF083 frame anchor, SMP
          # RF092 tick/ports and new RF094 post-DSP observer share one ELF.
          python3 tools/qa01_rf092_original_spc_edges.py --root "$SRC"
          python3 tools/qa01_rf094_spc_dsp_followthrough.py --original "$SRC"
          grep -Fq 'UR_QA01_RF094_ORIGINAL_DSP_FOLLOWTHROUGH' "$SRC/apu/bapu/smp/smp.cpp"
          grep -Fq 'rf094_original_dsp_write(status.dsp_addr, data)' "$SRC/apu/bapu/smp/memory.cpp"
          grep -Fq 'UR_QA01_RF083_ZOO_SOUND_DP_FIRST_WRITER' "$SRC/cpuexec.cpp"
          grep -Fq 'rf083_port_read(Address,1u' "$SRC/getset.h"
          grep -Fq 'rf083_inc16_commit' "$SRC/cpumacro.h"
          grep -Fq 'UR_QA01_RF091_ORIGINAL_APU_WRITE' "$SRC/ppu.cpp"
          sha256sum "$SRC/cpuexec.cpp" "$SRC/getset.h" "$SRC/cpumacro.h" "$SRC/ppu.cpp" "$SRC/apu/bapu/smp/smp.cpp" "$SRC/apu/bapu/smp/core.cpp" "$SRC/apu/bapu/smp/memory.cpp" > "$RUNNER_TEMP/rf083/modified-original-source-sha256.txt"
          # 2014 make rules do not fully invalidate every object on header
          # changes. Rebuild all four genuine translation units in one link.
          make -C "$SRC/libretro" clean
          make -C "$SRC/libretro" -j2
          test -s "$SRC/libretro/snes9x_libretro.so"
          sha256sum "$SRC/libretro/snes9x_libretro.so" > "$RUNNER_TEMP/rf083/linked-original-core-sha256.txt"
          {
            echo "RF083_SOURCE_HEAD_SHA=$GITHUB_SHA"
            echo "ORIGINAL_UPSTREAM_SHA=1bcc369e89f08243e0a462882fb1f3e42e51de3a"
            echo "RF083_ORIGINAL_PATCHED_SOURCE_COMPILE_LINK=passed"
            echo "RF094_ORIGINAL_PATCHED_DSP_WRITE_COMPILE_LINK=passed"
            echo "Actual RF083 CPU and RF092/RF094 SPC MMIO/DSP observers share one clean-linked pinned 2014 Snes9x ELF, with original DSP post-write and late port capture opt-in only."
            echo "No ROM execution, audio equivalence, original/native event or Windows release acceptance was performed."
            echo "USA events 0/45; release gates 0/12."
          } > "$RUNNER_TEMP/rf083/README.txt"
          cat "$RUNNER_TEMP/rf083/README.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve linked original compile receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf083-original-cpu-apu-compile-receipt
          path: ${{ runner.temp }}/rf083/
          retention-days: 14
          if-no-files-found: warn

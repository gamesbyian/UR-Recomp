name: VS Widescreen +48 capacity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/widescreen-vs-plus48-capacity.yml"
      - ".github/workflows/widescreen-vs-capacity.yml"
      - "tools/apply_native_widescreen_hook.py"
      - "tests/unit/test_apply_native_widescreen_hook.py"
      - "tools/build_widescreen_capacity_result.py"
      - "tools/evaluate_widescreen_capacity_probe.py"
      - "tools/check_widescreen_capacity_evidence.py"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/patch_widescreen_probe_host.py"
      - "tools/summarize_paired_player_slots.py"
      - "tests/input/vs-first-race.input"
      - "tests/input/vs-first-race-observe.script"

concurrency:
  group: widescreen-vs-plus48-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    uses: ./.github/workflows/widescreen-vs-capacity.yml
    with:
      margin: 48

name: HP unattended seeded 2P gameplay research

# Independent of the five LLM agents. Each scheduled run generates fresh
# source-bound controller populations with a 4-way guest determinism oracle.
# Reuse canonical Windows Ninja build and full game acceptance before science.
# No PR/fork can reach the personal Windows runner through this caller.
# The first source-bound scheduled science run #41244390541 completed 8
# distinct seeded 2P cases / 32 real guest processes in 289s research time.
# Hourly pilot reuses this same one-worker workflow, with no parallel
# HP jobs, new GHA runner, weaker package QA or extra task agent.
# November 1 single-cron resynchronization: the previous :17 hourly trigger
# had produced no new scheduled event across multiple eligible UTC slots.
# Changing the minute can re-register the GitHub schedule and refresh its
# actor; there is no acceptance credit until a new true schedule receipt.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      research_wall_seconds:
        description: 'Owner-only trial; scheduled/default horizon remains 360 seconds'
        type: choice
        required: false
        default: '360'
        options:
          - '360'
          - '600'

permissions:
  contents: read

concurrency:
  group: hp-seeded-2p-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-bound-windows-research:
    if: >-
      github.repository == 'gamesbyian/UR-Recomp' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/windows-native-smoke.yml
    with:
      run_on_hp: true
      hp_ninja_auto: true
      hp_seeded_2p: true
      hp_research_wall_seconds: ${{ github.event_name == 'workflow_dispatch' && inputs.research_wall_seconds || '360' }}

          LOG="$RUNNER_TEMP/ui-race-result-route.log"
          DUMPS="$RUNNER_TEMP/ui-race-result-dumps"
          mkdir -p "$DUMPS"

          echo "== scripted UI race-result continuation reconnaissance =="
          SNESRECOMP_DUMP_DIR="$DUMPS" SDL_AUDIODRIVER=dummy \
          timeout 180s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \

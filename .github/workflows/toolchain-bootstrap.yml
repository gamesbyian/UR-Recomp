name: Toolchain bootstrap regression

on:
  pull_request:
    paths:
      - "tools/bootstrap_toolchain.py"
      - "tools/install_pure_python_tool.py"
      - "tools/validate_island.py"
      - "tools/toolchain.json"
      - "third_party/**"
      - "tools/tool_interop.json"
      - "tools/validate_tool_interop.py"
      - "tools/export_symbol_adapters.py"
      - "tools/run_fixture_mesen.py"
      - "tests/test_mesen_fixture_adapter.py"
      - "analysis/generated/symbols.json"
      - "analysis/generated/snes2asm-symbols.yml"
      - "analysis/generated/da65-symbols-bank-*.info"
      - "tests/test_bootstrap_toolchain.py"
      - ".github/workflows/toolchain-bootstrap.yml"
  push:
    paths:
      - "tools/bootstrap_toolchain.py"
      - "tools/install_pure_python_tool.py"
      - "tools/validate_island.py"
      - "tools/toolchain.json"
      - "third_party/**"
      - "tools/tool_interop.json"
      - "tools/validate_tool_interop.py"
      - "tools/export_symbol_adapters.py"
      - "tools/run_fixture_mesen.py"
      - "tests/test_mesen_fixture_adapter.py"
      - "analysis/generated/symbols.json"
      - "analysis/generated/snes2asm-symbols.yml"
      - "analysis/generated/da65-symbols-bank-*.info"
      - "tests/test_bootstrap_toolchain.py"
      - ".github/workflows/toolchain-bootstrap.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrapper without fetching tools
        run: python3 tests/test_bootstrap_toolchain.py
      - name: Validate repository-island manifest
        run: python3 tools/validate_island.py --status
      - name: Stage vendored manual workbench offline
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool ghidra-snes --clone-only
          test -f .tools/src/ghidra-snes/gradle.properties
          test -d .tools/src/ghidra-snes/data/languages
          test -d .tools/src/ghidra-snes/src/main
      - name: Validate tool interoperability graph
        run: python3 tools/validate_tool_interop.py
      - name: Check symbol adapter outputs
        run: python3 tools/export_symbol_adapters.py --check
      - name: Test shared fixture Mesen adapter
        run: python3 tests/test_mesen_fixture_adapter.py

  build-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - snes9x-libretro
          - superfamiconv
          - wla-dx
          - snes2asm
          - cc65
          - snesrecomp
          - flips
          - bsnes-libretro
          - beetle-bsnes-libretro
          - mesen-for-ai
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned tool through project bootstrap
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.tool }}" in
            mesen-for-ai|snes2asm|superfamiconv|flips|wla-dx|beetle-bsnes-libretro|cc65|snesrecomp)
              python3 tools/bootstrap_toolchain.py --offline --tool "${{ matrix.tool }}" --jobs 2
              ;;
            *)
              python3 tools/bootstrap_toolchain.py --tool "${{ matrix.tool }}" --jobs 2
              ;;
          esac
      - name: Smoke repository-owned SNESRecomp archive
        if: matrix.tool == 'snesrecomp'
        shell: bash
        run: |
          set -euo pipefail
          test -x .tools/src/snesrecomp/build-snesref/snesref
          test -f .tools/src/snesrecomp/LICENSE
          test ! -e .tools/src/snesrecomp/lib/recomp-net/CMakeLists.txt
          test ! -e .tools/src/snesrecomp/lib/retcomm-rbengine/CMakeLists.txt

      - name: Smoke vendored da65 65816 mode
        if: matrix.tool == 'cc65'
        shell: bash
        run: |
          set -euo pipefail
          printf '\xEA' > "$RUNNER_TEMP/da65-smoke.bin"
          .tools/src/cc65/bin/da65 --cpu 65816 "$RUNNER_TEMP/da65-smoke.bin" > "$RUNNER_TEMP/da65-smoke.s"
          grep -q '.setcpu "65816"' "$RUNNER_TEMP/da65-smoke.s"
          grep -q '\$EA' "$RUNNER_TEMP/da65-smoke.s"

      - name: Smoke vendored Beetle/bsnes libretro ABI
        if: matrix.tool == 'beetle-bsnes-libretro'
        shell: bash
        run: |
          set -euo pipefail
          test -f .tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so
          nm -D .tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so | grep -q ' T retro_init$'
          nm -D .tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so | grep -q ' T retro_get_memory_data$'
      - name: Test vendored mesen-for-ai
        if: matrix.tool == 'mesen-for-ai'
        run: .tools/venvs/mesen-for-ai/bin/python -m unittest discover -s third_party/src/mesen-for-ai/tests -v
      - name: Smoke mesen-for-ai launcher
        if: matrix.tool == 'mesen-for-ai'
        run: </dev/null .tools/venvs/mesen-for-ai/bin/mesen-mcpd
      - name: Verify vendored PyYAML closure
        if: matrix.tool == 'snes2asm'
        run: |
          .tools/venvs/snes2asm/bin/python - <<'PY'
          import yaml
          assert yaml.__version__ == "6.0.3", yaml.__version__
          assert not yaml.__with_libyaml__
          print("PyYAML", yaml.__version__, "pure-python")
          PY
      - name: Smoke adapted snes2asm behavior
        if: matrix.tool == 'snes2asm'
        run: .tools/venvs/snes2asm/bin/python tests/smoke_snes2asm_patch.py

name: One-shot audio setup routine extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audio-setup-routine-extract.yml"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Extract bounded ROM windows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path("reference/roms/retail/Uniracers_USA.sfc").read_bytes()
          def off(bank,addr):
              assert addr >= 0x8000
              return (bank & 0x7f)*0x8000 + (addr-0x8000)
          for bank,addr,n in [(0x02,0x8035,0x80),(0x02,0x807E,0x100),(0x02,0x812A,0x80)]:
              o=off(bank,addr)
              data=rom[o:o+n]
              print(f"WINDOW {bank:02X}:{addr:04X} file=0x{o:06X} len={len(data)}")
              for i in range(0,len(data),16):
                  chunk=data[i:i+16]
                  print(f"{bank:02X}:{addr+i:04X}  "+chunk.hex(" "))
          PY

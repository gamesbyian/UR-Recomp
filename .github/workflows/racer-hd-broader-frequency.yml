name: Racer HD broader frequency census

on:
  pull_request:
    paths:
      - "tools/measure_racer_hd_frequency_from_wram_dumps.py"
      - "tools/summarize_racer_semantic_trace.py"
      - "tools/prototype_racer_hd_replacement.py"
      - "tools/build_racer_hd_asset_dossier.py"
      - "tools/check_racer_hd_temporal_coherence.py"
      - "native/presentation/racer_replacement_selector.hpp"
      - "native/presentation/racer_replacement_selector.cpp"
      - "native/presentation/racer_hd_presenter.hpp"
      - "analysis/data/racer-hd-replacement-prototype.json"
      - "analysis/data/racer-hd-art-approval-broader-04b9.json"
      - "analysis/data/racer-hd-art-approval-broader-0239.json"
      - "analysis/data/racer-hd-art-approval-broader-0439.json"
      - "analysis/generated/racer-hd-broader-frequency-summary-2026-10-05.json"
      - "tests/native/racer_replacement_selector_test.cpp"
      - "tests/native/racer_hd_presenter_test.cpp"
      - "tests/unit/test_build_racer_hd_asset_dossier.py"
      - "tests/unit/test_racer_hd_temporal_coherence.py"
      - "tests/unit/test_summarize_racer_semantic_trace.py"
      - "tools/measure_racer_hd_fallback_frequency.py"
      - "tools/probe_racer_hd_ranked_visual_context.py"
      - "tests/unit/test_measure_racer_hd_frequency_from_wram_dumps.py"
      - "tests/unit/test_measure_racer_hd_fallback_frequency.py"
      - "tests/unit/test_probe_racer_hd_ranked_visual_context.py"
      - ".github/workflows/racer-hd-broader-frequency.yml"
  workflow_dispatch:

concurrency:
  group: racer-hd-broader-frequency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install reference-core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build Snes9x reference runner
        shell: bash
        run: |
          set -euo pipefail
          git -C snesrecomp apply --check "$GITHUB_WORKSPACE/tools/patches/snesrecomp-dual-controller-input.patch"
          git -C snesrecomp apply "$GITHUB_WORKSPACE/tools/patches/snesrecomp-dual-controller-input.patch"
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2

      - name: Generate dense active-race census script
        run: |
          python3 tools/measure_racer_hd_frequency_from_wram_dumps.py script \
            --start 1180 \
            --end 3820 \
            --prefix racer-sample \
            --out "$RUNNER_TEMP/racer-hd-broader.script"
          test "$(grep -c '^dump racer-sample-' "$RUNNER_TEMP/racer-hd-broader.script")" -eq 2641

          python3 - "$RUNNER_TEMP/racer-hd-before-04b9-registry.json" <<'PY'
          import json, pathlib, sys
          src = pathlib.Path("analysis/data/racer-hd-replacement-prototype.json")
          data = json.loads(src.read_text())
          broader_rids = {
              "ordinary-racer-0x04B9-p1-broader-frequency-reference",
              "ordinary-racer-0x0239-p1-broader-frequency-reference",
              "ordinary-racer-0x0439-p1-broader-frequency-reference",
              "ordinary-racer-0x0039-p1-broader-frequency-reference",
          }
          data["entries"] = [
              e for e in data["entries"]
              if e["representation_id"] not in broader_rids
          ]
          for key in (
              "ordinary-race-04b9-broader-static-1392-1393",
              "ordinary-race-0239-broader-static-1406-1407",
              "ordinary-race-0439-broader-static-1414-1415",
              "ordinary-race-0039-broader-static-1398-1399",
          ):
              data.get("motion_review_sequences", {}).pop(key, None)
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )
          PY

          python3 - "$RUNNER_TEMP/racer-hd-after-04b9-registry.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(
              pathlib.Path("analysis/data/racer-hd-replacement-prototype.json").read_text()
          )
          excluded = {
              "ordinary-racer-0x0239-p1-broader-frequency-reference",
              "ordinary-racer-0x0439-p1-broader-frequency-reference",
              "ordinary-racer-0x0039-p1-broader-frequency-reference",
          }
          data["entries"] = [
              e for e in data["entries"] if e["representation_id"] not in excluded
          ]
          for key in (
              "ordinary-race-0239-broader-static-1406-1407",
              "ordinary-race-0439-broader-static-1414-1415",
              "ordinary-race-0039-broader-static-1398-1399",
          ):
              data.get("motion_review_sequences", {}).pop(key, None)
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Validate WRAM census phase against retained native window
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/measure_racer_hd_frequency_from_wram_dumps.py script \
            --start 1180 \
            --end 1620 \
            --prefix racer-overlap \
            --out "$RUNNER_TEMP/racer-hd-overlap.script"
          mkdir -p "$RUNNER_TEMP/racer-hd-overlap-dumps"

          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_INPUT_FILE="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input" \
          SNESREF_SCRIPT="$RUNNER_TEMP/racer-hd-overlap.script" \
          SNESREF_DUMP_DIR="$RUNNER_TEMP/racer-hd-overlap-dumps" \
            "$RUNNER_TEMP/snesref-build/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            > "$RUNNER_TEMP/racer-hd-overlap-snes9x.log"

          python3 tools/measure_racer_hd_frequency_from_wram_dumps.py measure \
            "$RUNNER_TEMP/racer-hd-overlap-dumps" \
            --prefix racer-overlap \
            --registry "$RUNNER_TEMP/racer-hd-before-04b9-registry.json" \
            --workflow-run "${{ github.run_id }}" \
            --json-out "$RUNNER_TEMP/racer-hd-overlap-frequency.json" \
            > "$RUNNER_TEMP/racer-hd-overlap-frequency.txt"

          python3 - "$RUNNER_TEMP/racer-hd-overlap-frequency.json" \
            analysis/generated/racer-hd-fallback-frequency-2026-10-05.json <<'PY'
          import json, pathlib, sys
          ref = json.loads(pathlib.Path(sys.argv[1]).read_text())
          native = json.loads(pathlib.Path(sys.argv[2]).read_text())
          m = ref["measurement"]
          expected = native["second_expansion"]["after"]
          current = native["current_after"]
          spill = native["broader_player_local_spill_in"]
          assert current["hd_selected_player_frames"] == expected["hd_selected_player_frames"] + spill["player_frames_added"]
          assert current["original_fallback_player_frames"] == expected["original_fallback_player_frames"] - spill["player_frames_added"]
          assert m["frames_observed"] == 441, m
          assert m["player_frame_observations"] == expected["player_frame_observations"], (m, expected)
          assert m["hd_selected_player_frames"] == expected["hd_selected_player_frames"], (m, expected)
          assert m["original_fallback_player_frames"] == expected["original_fallback_player_frames"], (m, expected)
          target = ref["target_discriminator"]
          assert target["observed"] is True, target
          assert target["measurement"]["player_frames"] == 12, target
          assert target["measurement"]["episode_count"] == 1, target
          print(
              "RACER_HD_REFERENCE_PHASE_PARITY",
              f"frames={m['frames_observed']}",
              f"hd={m['hd_selected_player_frames']}",
              f"fallback={m['original_fallback_player_frames']}",
              "target=12/1",
          )
          PY

      - name: Replay longer ordinary two-player route in Snes9x
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/racer-hd-broader-dumps"
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_INPUT_FILE="$GITHUB_WORKSPACE/tests/input/two-player-p1-win.input" \
          SNESREF_SCRIPT="$RUNNER_TEMP/racer-hd-broader.script" \
          SNESREF_DUMP_DIR="$RUNNER_TEMP/racer-hd-broader-dumps" \
            "$RUNNER_TEMP/snesref-build/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            > "$RUNNER_TEMP/racer-hd-broader-snes9x.log"

      - name: Measure broader Racer HD before and after 04B9
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/measure_racer_hd_frequency_from_wram_dumps.py measure \
            "$RUNNER_TEMP/racer-hd-broader-dumps" \
            --prefix racer-sample \
            --registry "$RUNNER_TEMP/racer-hd-before-04b9-registry.json" \
            --workflow-run "${{ github.run_id }}" \
            --json-out "$RUNNER_TEMP/racer-hd-broader-before.json" \
            > "$RUNNER_TEMP/racer-hd-broader-before.txt"

          python3 tools/probe_racer_hd_ranked_visual_context.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            "$RUNNER_TEMP/racer-hd-broader-before.json" \
            --registry "$RUNNER_TEMP/racer-hd-before-04b9-registry.json" \
            --rank 0 \
            --json-out "$RUNNER_TEMP/racer-hd-04b9-baseline-probe.json" \
            --output-dir "$RUNNER_TEMP/racer-hd-04b9-baseline-probe" \
            > "$RUNNER_TEMP/racer-hd-04b9-baseline-probe.txt"

          python3 tools/measure_racer_hd_frequency_from_wram_dumps.py measure \
            "$RUNNER_TEMP/racer-hd-broader-dumps" \
            --prefix racer-sample \
            --registry "$RUNNER_TEMP/racer-hd-after-04b9-registry.json" \
            --workflow-run "${{ github.run_id }}" \
            --json-out "$RUNNER_TEMP/racer-hd-broader-after.json" \
            --trace-out "$RUNNER_TEMP/racer-hd-broader-trace.json" \
            > "$RUNNER_TEMP/racer-hd-broader-after.txt"

          python3 - "$RUNNER_TEMP/racer-hd-broader-before.json" \
            "$RUNNER_TEMP/racer-hd-broader-after.json" \
            "$RUNNER_TEMP/racer-hd-04b9-baseline-probe.json" <<'PY'
          import json, pathlib, sys
          before = json.loads(pathlib.Path(sys.argv[1]).read_text())
          after = json.loads(pathlib.Path(sys.argv[2]).read_text())
          probe = json.loads(pathlib.Path(sys.argv[3]).read_text())
          b = before["measurement"]
          a = after["measurement"]
          assert (b["frames_observed"], b["player_frame_observations"]) == (2641, 5282)
          assert (b["hd_selected_player_frames"], b["original_fallback_player_frames"]) == (118, 5164)
          assert probe["target"]["player"] == "p1"
          assert probe["target"]["semantic_frame_id"] == "0x04B9"
          assert probe["target"]["player_frames"] == 80
          assert probe["target"]["episode_count"] == 60
          assert probe["witness_exact_state_count"] == 58
          assert probe["unique_stock_raster_count"] == 1
          assert probe["canonical"]["stock_rgba_sha256"] == "42d47919a4326d4b4ddfd1f249a46e218dcde421e1520e7f7399afc6aa7dcf68"
          assert probe["canonical"]["alpha_bounds"] == [18, 5, 47, 36]
          assert probe["canonical"]["contact_x2_y2"] == [77, 72]
          assert (a["hd_selected_player_frames"], a["original_fallback_player_frames"]) == (198, 5084), a
          assert a["hd_selected_player_frames"] - b["hd_selected_player_frames"] == 80
          print("RACER_HD_BROADER_GAIN before=118/5282 after=198/5282 removed=80")
          PY

      - name: Build 04B9 single-player review evidence
        shell: bash
        run: |
          set -euo pipefail
          ROM="reference/roms/retail/Uniracers_USA.sfc"
          DOSSIER="$RUNNER_TEMP/racer-hd-04b9-dossier"
          python3 tools/build_racer_hd_asset_dossier.py \
            "$ROM" \
            --trace "$RUNNER_TEMP/racer-hd-broader-trace.json" \
            --window-start 1392 \
            --window-end 1393 \
            --player p1 \
            --output-dir "$DOSSIER" \
            > "$RUNNER_TEMP/racer-hd-04b9-dossier.txt"

          python3 tools/build_racer_pose_equivalence.py \
            "$DOSSIER/manifest.json" \
            --out "$DOSSIER/pose-equivalence.json" \
            > "$RUNNER_TEMP/racer-hd-04b9-equivalence.txt"

          python3 tools/build_racer_hd_shipping_readiness.py \
            "$DOSSIER/pose-equivalence.json" \
            --decisions analysis/data/racer-hd-art-approval-broader-04b9.json \
            --out "$DOSSIER/shipping-readiness.json" \
            --require-shipping-ready \
            > "$RUNNER_TEMP/racer-hd-04b9-shipping-readiness.txt"

          python3 tools/build_racer_hd_review_packet.py \
            "$DOSSIER/manifest.json" \
            "$DOSSIER/pose-equivalence.json" \
            --output-dir "$DOSSIER/review" \
            --readiness "$DOSSIER/shipping-readiness.json" \
            > "$RUNNER_TEMP/racer-hd-04b9-review.txt"

          python3 tools/check_racer_hd_temporal_coherence.py \
            "$ROM" \
            --sequence-key ordinary-race-04b9-broader-static-1392-1393 \
            --json-out "$RUNNER_TEMP/racer-hd-04b9-temporal.json" \
            > "$RUNNER_TEMP/racer-hd-04b9-temporal.txt"

          python3 - "$DOSSIER/manifest.json" "$RUNNER_TEMP/racer-hd-04b9-temporal.json" "$DOSSIER/shipping-readiness.json" <<'PY'
          import json, pathlib, sys
          dossier = json.loads(pathlib.Path(sys.argv[1]).read_text())
          temporal = json.loads(pathlib.Path(sys.argv[2]).read_text())
          readiness = json.loads(pathlib.Path(sys.argv[3]).read_text())
          assert dossier["review_players"] == ["p1"]
          assert dossier["validation"]["review_players_registered_window"] is True
          assert dossier["validation"]["fully_registered_window"] is False
          reps = dossier["representations"]
          assert len(reps) == 1
          review = reps[0]["art_review"]["authored_candidate"]["gameplay_scale_review"]
          assert review["stock_alpha_bounds"] == [18, 5, 47, 36], review
          assert review["candidate_alpha_bounds"] == [18, 5, 47, 36], review
          assert review["candidate_contact_x2_y2"] == [77, 72], review
          assert review["alpha_iou"] >= 0.68, review
          assert reps[0]["art_review"]["authored_candidate"]["rgba_sha256"] == "3e026afb7e237b3a440f048b7c2d9801ab6475a48a8cb4ab42eba096c9c666ed"
          assert readiness["shipping_ready"] is True, readiness
          assert readiness["counts"]["approved"] == 1, readiness
          assert readiness["shipping_ready"] is True, readiness
          assert readiness["counts"]["approved"] == 1, readiness
          assert temporal["players"] == ["p1"]
          assert all(temporal["validation"].values()), temporal
          print("RACER_HD_04B9_REVIEW", json.dumps(review, sort_keys=True))
          print("RACER_HD_04B9_HASH", reps[0]["art_review"]["authored_candidate"]["rgba_sha256"])
          PY

      - name: Measure and review next P1 0239 context
        shell: bash
        run: |
          set -euo pipefail
          ROM="reference/roms/retail/Uniracers_USA.sfc"
          python3 - analysis/data/racer-hd-replacement-prototype.json "$RUNNER_TEMP/racer-hd-before-0239-registry.json" <<'PY'
          import json, pathlib, sys
          source = json.loads(pathlib.Path(sys.argv[1]).read_text())
          excluded = {
              "ordinary-racer-0x0239-p1-broader-frequency-reference",
              "ordinary-racer-0x0439-p1-broader-frequency-reference",
              "ordinary-racer-0x0039-p1-broader-frequency-reference",
          }
          source["entries"] = [
              e for e in source["entries"] if e["representation_id"] not in excluded
          ]
          for key in (
              "ordinary-race-0239-broader-static-1406-1407",
              "ordinary-race-0439-broader-static-1414-1415",
              "ordinary-race-0039-broader-static-1398-1399",
          ):
              source.get("motion_review_sequences", {}).pop(key, None)
          pathlib.Path(sys.argv[2]).write_text(json.dumps(source, indent=2) + "\n")
          PY

          python3 - analysis/data/racer-hd-replacement-prototype.json "$RUNNER_TEMP/racer-hd-after-0239-registry.json" <<'PY'
          import json, pathlib, sys
          source = json.loads(pathlib.Path(sys.argv[1]).read_text())
          excluded = {
              "ordinary-racer-0x0439-p1-broader-frequency-reference",
              "ordinary-racer-0x0039-p1-broader-frequency-reference",
          }
          source["entries"] = [
              e for e in source["entries"] if e["representation_id"] not in excluded
          ]
          for key in (
              "ordinary-race-0439-broader-static-1414-1415",
              "ordinary-race-0039-broader-static-1398-1399",
          ):
              source.get("motion_review_sequences", {}).pop(key, None)
          pathlib.Path(sys.argv[2]).write_text(json.dumps(source, indent=2) + "\n")
          PY

          python3 tools/measure_racer_hd_frequency_from_wram_dumps.py measure \
            "$RUNNER_TEMP/racer-hd-broader-dumps" \
            --prefix racer-sample \
            --registry "$RUNNER_TEMP/racer-hd-before-0239-registry.json" \
            --workflow-run "${{ github.run_id }}" \
            --json-out "$RUNNER_TEMP/racer-hd-before-0239.json" \
            > "$RUNNER_TEMP/racer-hd-before-0239.txt"

          python3 tools/probe_racer_hd_ranked_visual_context.py \
            "$ROM" \
            "$RUNNER_TEMP/racer-hd-before-0239.json" \
            --registry "$RUNNER_TEMP/racer-hd-before-0239-registry.json" \
            --rank 0 \
            --json-out "$RUNNER_TEMP/racer-hd-0239-probe.json" \
            --output-dir "$RUNNER_TEMP/racer-hd-0239-probe" \
            > "$RUNNER_TEMP/racer-hd-0239-probe.txt"

          python3 tools/measure_racer_hd_frequency_from_wram_dumps.py measure \
            "$RUNNER_TEMP/racer-hd-broader-dumps" \
            --prefix racer-sample \
            --registry "$RUNNER_TEMP/racer-hd-after-0239-registry.json" \
            --workflow-run "${{ github.run_id }}" \
            --json-out "$RUNNER_TEMP/racer-hd-after-0239.json" \
            --trace-out "$RUNNER_TEMP/racer-hd-after-0239-trace.json" \
            > "$RUNNER_TEMP/racer-hd-after-0239.txt"

          python3 - "$RUNNER_TEMP/racer-hd-before-0239.json" "$RUNNER_TEMP/racer-hd-after-0239.json" "$RUNNER_TEMP/racer-hd-0239-probe.json" <<'PY'
          import json, pathlib, sys
          before = json.loads(pathlib.Path(sys.argv[1]).read_text())
          after = json.loads(pathlib.Path(sys.argv[2]).read_text())
          probe = json.loads(pathlib.Path(sys.argv[3]).read_text())
          b, a = before["measurement"], after["measurement"]
          assert (b["hd_selected_player_frames"], b["original_fallback_player_frames"]) == (198, 5084), b
          assert probe["target"]["player"] == "p1"
          assert probe["target"]["semantic_frame_id"] == "0x0239"
          assert probe["target"]["player_frames"] == 79
          assert probe["target"]["episode_count"] == 58
          assert probe["witness_exact_state_count"] == 49
          assert probe["unique_stock_raster_count"] == 1
          assert probe["canonical"]["stock_rgba_sha256"] == "f422bb38627c7333c7118a83001bab8b5a07753c19a909c5463b6907af33a0f0"
          assert probe["canonical"]["alpha_bounds"] == [18, 5, 47, 36]
          assert probe["canonical"]["contact_x2_y2"] == [77, 72]
          assert (a["hd_selected_player_frames"], a["original_fallback_player_frames"]) == (277, 5005), a
          assert a["hd_selected_player_frames"] - b["hd_selected_player_frames"] == 79
          print("RACER_HD_0239_GAIN before=198/5282 after=277/5282 removed=79")
          PY

          DOSSIER="$RUNNER_TEMP/racer-hd-0239-dossier"
          python3 tools/build_racer_hd_asset_dossier.py \
            "$ROM" \
            --trace "$RUNNER_TEMP/racer-hd-after-0239-trace.json" \
            --window-start 1406 \
            --window-end 1407 \
            --player p1 \
            --output-dir "$DOSSIER" \
            > "$RUNNER_TEMP/racer-hd-0239-dossier.txt"

          python3 tools/build_racer_pose_equivalence.py \
            "$DOSSIER/manifest.json" \
            --out "$DOSSIER/pose-equivalence.json" \
            > "$RUNNER_TEMP/racer-hd-0239-equivalence.txt"

          python3 tools/build_racer_hd_shipping_readiness.py \
            "$DOSSIER/pose-equivalence.json" \
            --decisions analysis/data/racer-hd-art-approval-broader-0239.json \
            --out "$DOSSIER/shipping-readiness.json" \
            --require-shipping-ready \
            > "$RUNNER_TEMP/racer-hd-0239-shipping-readiness.txt"

          python3 tools/build_racer_hd_review_packet.py \
            "$DOSSIER/manifest.json" \
            "$DOSSIER/pose-equivalence.json" \
            --output-dir "$DOSSIER/review" \
            --readiness "$DOSSIER/shipping-readiness.json" \
            > "$RUNNER_TEMP/racer-hd-0239-review.txt"

          python3 tools/check_racer_hd_temporal_coherence.py \
            "$ROM" \
            --sequence-key ordinary-race-0239-broader-static-1406-1407 \
            --json-out "$RUNNER_TEMP/racer-hd-0239-temporal.json" \
            > "$RUNNER_TEMP/racer-hd-0239-temporal.txt"

          python3 - "$DOSSIER/manifest.json" "$RUNNER_TEMP/racer-hd-0239-temporal.json" "$DOSSIER/shipping-readiness.json" <<'PY'
          import json, pathlib, sys
          dossier = json.loads(pathlib.Path(sys.argv[1]).read_text())
          temporal = json.loads(pathlib.Path(sys.argv[2]).read_text())
          readiness = json.loads(pathlib.Path(sys.argv[3]).read_text())
          reps = dossier["representations"]
          assert len(reps) == 1
          review = reps[0]["art_review"]["authored_candidate"]["gameplay_scale_review"]
          assert review["stock_alpha_bounds"] == [18, 5, 47, 36], review
          assert review["candidate_alpha_bounds"] == [18, 5, 47, 36], review
          assert review["candidate_contact_x2_y2"] == [77, 72], review
          assert review["alpha_iou"] >= 0.71, review

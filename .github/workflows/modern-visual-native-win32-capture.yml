name: Modern integrated visual native SDL rehearsal
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/modern-visual-native-win32-capture.yml"
      - "tools/qa_modern_visual_sdl_capture.py"
      - "tools/qa_modern_visual_win32_capture_driver.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modern-visual-native-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-sdl-root:
    # Exact assembled four-PR integration branch only. Diagnostic and no release.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 2053
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact visual QA source
        uses: actions/checkout@v4
      - name: Check out pinned Baldosa AOT and SDL framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Verify source, retail ROM and capture unit contracts
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          python -m unittest \
            tests.unit.test_qa_modern_visual_native_capture \
            tests.unit.test_qa_modern_visual_win32_capture_driver \
            tests.unit.test_check_modern_visual_capture_bundle
          python tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
      - name: Stage original Modern native host and opt-in SDL3 readback
        run: |
          set -euo pipefail
          python tools/baldosa_dram_refresh_beam_rate_patch.py --game baldosa
          python tools/baldosa_io_access_clock_order_patch.py --game baldosa
          (cd baldosa && bash tools/regen.sh --cfg-roots \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc")
          python tools/baldosa_io_access_clock_order_patch.py --game baldosa --verify-gen
          python tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_pause_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_options_spike.py --game baldosa
          python tools/baldosa_modern_options_spike.py --game baldosa
          python tools/qa_modern_visual_sdl_capture.py --framework baldosa/snesrecomp
          grep -Fq UR_MODERN_UI_SDL_DRAWABLE_CAPTURE \
            baldosa/snesrecomp/runner/src/desktop/host_main.c
      - name: Acquire pinned native Windows Clang
        run: |
          bash baldosa/snesrecomp/tools/ci/fetch_toolchain.sh \
            --artifact windows-x64 --tag v1.0.14
      - name: Compile real Win32 Baldosa Modern product with one SDL observer
        run: |
          set -euo pipefail
          source "$TOOLCHAIN_DIR/env.sh"
          clang --version | head -n1 | grep -F "22.1.8"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          cmake -S baldosa -B baldosa/build-ur-visual -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_ENABLE_TRACE=OFF
          cmake --build baldosa/build-ur-visual --target UniracersSNESRecomp -j 3
          test -s baldosa/build-ur-visual/UniracersSNESRecomp.exe
          python tools/check_windows_pe_timestamp.py \
            --exe baldosa/build-ur-visual/UniracersSNESRecomp.exe \
            --source-epoch "$SOURCE_DATE_EPOCH"
      - name: Launch real Win32 root and capture actual SDL drawable
        run: |
          set -euo pipefail
          python tools/qa_modern_visual_win32_capture_driver.py \
            --exe "$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --source-sha "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/ur-modern-win32-visual-baseline" \
            --video windows --timeout 100
          test -s "$RUNNER_TEMP/ur-modern-win32-visual-baseline/actual-sdl-drawable.png"
          echo "Actual integrated Windows Modern candidate: readback from SDL drawable; NO physical-pad, original-art or release approval." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture native widescreen and fallback Windows output on SAME exact PE
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for size in 1280x720 1024x768; do
            python tools/qa_modern_visual_win32_capture_driver.py \
              --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
              --out "$RUNNER_TEMP/ur-modern-win32-visual-$size" \
              --video windows --timeout 100 --window-size "$size"
            test -s "$RUNNER_TEMP/ur-modern-win32-visual-$size/actual-sdl-drawable.png"
            test -s "$RUNNER_TEMP/ur-modern-win32-visual-$size/readback-receipt.json"
          done
          # Explicit native-source witness alongside exact SDL sizes: neither
          # a resized screenshot nor a 342px frame letterboxed into 4:3
          # counts as the compact Modern renderer. These stage lines were
          # observed in the same-process original captured Windows logs.
          grep -Fq 'UR_BALDOSA_MODERN_DESTINATION stage=root raster=342x224 root=11,10,320,204 source=modern_product_view' \
            "$RUNNER_TEMP/ur-modern-win32-visual-1280x720/probe_first/native-process.log"
          grep -Fq 'UR_BALDOSA_MODERN_DESTINATION stage=root raster=256x224 root=8,10,240,204 source=modern_product_view' \
            "$RUNNER_TEMP/ur-modern-win32-visual-1024x768/probe_first/native-process.log"
          echo "Actual combined-head SDL output 1280x720 / 1024x768 AND same-process native root 342x224 / 256x224 verified; human/physical-device approval remains pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture native Records keyboard, P1 Options and P1 profile states
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          # Each route drives the real native production edge handler,
          # in a separate clean process on the SAME PE.
          for spec in records-keyboard:1024x768 options-p1:observed profile-first-p1:1280x720 practice-picker-p1:1024x768 multiplayer-unbound:1024x768; do
            route="${spec%%:*}"
            size="${spec#*:}"
            # Options can change the live host display. Preserve its *observed*
            # output size via the existing independent two-run size probe;
            # root/Records/profile retain strict requested WxH and no fallback.
            size_args=()
            if [ "$size" != "observed" ]; then
              size_args=(--window-size "$size")
            fi
            python tools/qa_modern_visual_win32_capture_driver.py \
              --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
              --out "$RUNNER_TEMP/ur-modern-win32-journey-$route" \
              --video windows --timeout 110 "${size_args[@]}" \
              --route "$route"
            test -s "$RUNNER_TEMP/ur-modern-win32-journey-$route/actual-sdl-drawable.png"
            test -s "$RUNNER_TEMP/ur-modern-win32-journey-$route/readback-receipt.json"
          done
          echo "True-native Windows keyboard Records, P1 Options and first-profile journey screenshots; no physical-pad/visual approval." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture all opened destinations at exact 16-to-9 drawable
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          # Each route is a separate *real* Windows process of the SAME PE.
          # The Options variant takes its image before frame-66 Display change.
          # A requested 1280x720 drawable must not silently fall back.
          for route in practice-picker-p1 multiplayer-unbound records-keyboard options-open-p1 profile-first-p1; do
            out="$RUNNER_TEMP/ur-modern-win32-wide-destination-$route"
            python tools/qa_modern_visual_win32_capture_driver.py \
              --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
              --out "$out" --video windows --timeout 110 \
              --window-size 1280x720 --route "$route"
            test -s "$out/actual-sdl-drawable.png"
            test -s "$out/readback-receipt.json"
            # Bind the exact child stage and *source-native* 342 wide geometry
            # to the same process that emitted SDL's 1280x720 readback.
            case "$route" in
              practice-picker-p1) stage=practice-picker ;;
              multiplayer-unbound) stage=multiplayer-unrecorded-warning ;;
              records-keyboard) stage=records-1p ;;
              options-open-p1) stage=options ;;
              profile-first-p1) stage=profile-first ;;
              *) exit 2 ;;
            esac
            grep -Fq "UR_BALDOSA_MODERN_DESTINATION stage=$stage raster=342x224 root=11,10,320,204 source=modern_product_view" \
              "$out/probe_first/native-process.log"
            grep -Fq 'output=1280x720 source=SDL_RenderReadPixels' \
              "$out/probe_first/native-process.log"
          done
          echo "Five real native 342-wide destination states reached at 1280x720 SDL output; human/physical approval not implied." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact wide destination screenshots and native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-wide-destinations
          path: |
            ${{ runner.temp }}/ur-modern-win32-wide-destination-*/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-wide-destination-*/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-wide-destination-*/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-wide-destination-*/probe_first/native-process.log
          if-no-files-found: warn
          retention-days: 7
      - name: Retain controller and keyboard journey SDL frames, never save roots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-navigation-journeys
          path: |
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker-p1/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker-p1/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker-p1/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker-p1/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unbound/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unbound/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unbound/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unbound/probe_first/native-process.log
          if-no-files-found: warn
          retention-days: 7
      - name: Capture stock Authentic control at 16-to-9 and 4-to-3
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          # Same native PE and exact Windows display sizes, but execution
          # mode=authentic; fail if Modern root opens or paints at all.
          for size in 1280x720 1024x768; do
            python tools/qa_modern_visual_win32_capture_driver.py \
              --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
              --out "$RUNNER_TEMP/ur-authentic-win32-control-$size" \
              --video windows --timeout 100 --window-size "$size" \
              --route authentic-stock
            test -s "$RUNNER_TEMP/ur-authentic-win32-control-$size/actual-sdl-drawable.png"
            test -s "$RUNNER_TEMP/ur-authentic-win32-control-$size/readback-receipt.json"
          done
          echo "Genuine Authenticated-mode stock execution with no Modern frontend observed. Source guest CRC, physical display and visual identity still require independent checks." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain independent Authentic control output only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-authentic-isolation-control
          path: |
            ${{ runner.temp }}/ur-authentic-win32-control-1280x720/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-authentic-win32-control-1280x720/readback-receipt.json
            ${{ runner.temp }}/ur-authentic-win32-control-1280x720/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-authentic-win32-control-1280x720/probe_first/native-process.log
            ${{ runner.temp }}/ur-authentic-win32-control-1024x768/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-authentic-win32-control-1024x768/readback-receipt.json
            ${{ runner.temp }}/ur-authentic-win32-control-1024x768/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-authentic-win32-control-1024x768/probe_first/native-process.log
          if-no-files-found: warn
          retention-days: 7
      - name: Retain exact widescreen and 4-to-3 SDL output without player data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-size-comparison
          path: |
            ${{ runner.temp }}/ur-modern-win32-visual-1280x720/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-visual-1280x720/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-visual-1280x720/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-visual-1280x720/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-visual-1024x768/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-visual-1024x768/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-visual-1024x768/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-visual-1024x768/probe_first/native-process.log
          if-no-files-found: warn
          retention-days: 7
      - name: Retain exact readback, logs, hash receipts, no ROM/user saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-root-drawable
          path: |
            ${{ runner.temp }}/ur-modern-win32-visual-baseline/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-visual-baseline/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-visual-baseline/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-visual-baseline/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-visual-baseline/capture_observed/native-process.log
            ${{ runner.temp }}/ur-modern-win32-visual-baseline/capture_observed/actual-sdl-drawable.pam
          if-no-files-found: warn
          retention-days: 7
      - name: Retain exact tested AMD64 executable separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-native-executable
          path: baldosa/build-ur-visual/UniracersSNESRecomp.exe
          if-no-files-found: warn
          retention-days: 7

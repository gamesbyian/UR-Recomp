name: ART-4K original pose-family wheel holdout research
on:
  pull_request:
    paths:
      - ".github/workflows/art4k-original-family-holdout.yml"
      - "tools/art/evaluate_original_racer_wheel_holdout.py"
      - "tests/unit/test_evaluate_original_racer_wheel_holdout.py"
      - "tools/art/audit_original_racer_holdout_near_duplicates.py"
      - "tests/unit/test_audit_original_racer_holdout_near_duplicates.py"
      - "tools/art/audit_original_racer_chroma_axes.py"
      - "tests/unit/test_audit_original_racer_chroma_axes.py"
      - "tools/art/compare_original_chroma_axes_to_glb_poses.py"
      - "tests/unit/test_compare_original_chroma_axes_to_glb_poses.py"
      - "tools/art/audit_original_racer_temporal_motion.py"
      - "tests/unit/test_audit_original_racer_temporal_motion.py"
      - "tools/art/study_original_racer_root_lean_grid.py"
      - "tests/unit/test_study_original_racer_root_lean_grid.py"
      - "tools/art/evaluate_original_racer_lean_silhouettes.py"
      - "tests/unit/test_evaluate_original_racer_lean_silhouettes.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: art4k-original-wheel-holdout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-original-source-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Authenticate exact canonical original USA ROM
        shell: bash
        run: |
          set -euo pipefail
          rom=reference/roms/retail/Uniracers_USA.sfc
          test -f "$rom"
          test "$(wc -c < "$rom")" -eq 2097152
          printf '%s  %s\n' \
            '859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478' \
            "$rom" | sha256sum --check --status
      - name: Install bounded CPU-only offline renderer
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 trimesh==4.11.1 pillow==12.3.0
      - name: Recompose all original pose families from canonical ROM
        shell: bash
        run: |
          set -euo pipefail
          python tools/art/export_registered_original_racer_corpus.py \
            --rom reference/roms/retail/Uniracers_USA.sfc \
            --out "$RUNNER_TEMP/art4k-verified-original-corpus"
          test -s "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json"
      - name: Restore previously verified 2026 five-pose GLB artifact
        uses: actions/download-artifact@v4
        with:
          name: ur-experimental-model-review-actual-glbs
          run-id: 41259476190
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/art4k-verified-model
      - name: Score frozen 1.00 and 1.10 wheel hypotheses on original masks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/art4k-reports"
          model="$RUNNER_TEMP/art4k-verified-model/real-model-site/model-review/assets/d061cddcdbac9b2b5ac137d0d721b63f92dc3ec1/upright-efdc8425f252b4a0.glb"
          test -s "$model"
          printf '%s  %s\n' \
            'efdc8425f252b4a0218d140d087c6cc923689589e0cf74cc6333d722182595f5' \
            "$model" | sha256sum --check --status
          python tools/art/evaluate_original_racer_wheel_holdout.py \
            --corpus "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json" \
            --glb "$model" \
            --camera analysis/data/racer-inverse-side-provisional-1205.json \
            --out "$RUNNER_TEMP/art4k-reports/wheel-holdout.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                            "art4k-reports/wheel-holdout.json").read_text())
          holdout = row["genuinely_new_binary_mask_holdout"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Canonical original ROM, unpaired experimental GLB\n\n")
              out.write(f"New independent 2D masks: {holdout['independent_binary_mask_count']}\n\n")
              out.write(f"1.00 wheel mean IoU: {holdout['mean_iou_width_1_00']}\n\n")
              out.write(f"1.10 wheel mean IoU: {holdout['mean_iou_width_1_10']}\n\n")
              out.write("**Unverified source 3D camera, pose pairing and owner likeness.**\n")
          PY
      - name: Audit visually correlated original binary masks separately
        shell: bash
        run: |
          set -euo pipefail
          python tools/art/audit_original_racer_holdout_near_duplicates.py \
            --corpus "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json" \
            --holdout "$RUNNER_TEMP/art4k-reports/wheel-holdout.json" \
            --out "$RUNNER_TEMP/art4k-reports/shape-clusters.json"
      - name: Measure original sprite-colour projected axis for model pose design
        shell: bash
        run: |
          set -euo pipefail
          python tools/art/audit_original_racer_chroma_axes.py \
            --corpus "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json" \
            --out "$RUNNER_TEMP/art4k-reports/source-chroma-axes.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "art4k-reports/source-chroma-axes.json").read_text())
          summary=row["source_variants"]
          print("Verified original source 2D painted-axis range:",
                summary["source_2d_chroma_axis_range_deg"])
          assert summary["independent_exact_source_binary_masks"] >= 35
          assert row["original_mesh_lean_angle_recovered"] is False
          PY
      - name: Compare five real 2026 GLB painted axes to original source angles
        shell: bash
        run: |
          set -euo pipefail
          python tools/art/compare_original_chroma_axes_to_glb_poses.py \
            --corpus "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json" \
            --source-axes "$RUNNER_TEMP/art4k-reports/source-chroma-axes.json" \
            --model-review-dir "$RUNNER_TEMP/art4k-verified-model/real-model-site/model-review" \
            --camera analysis/data/racer-inverse-side-provisional-1205.json \
            --out "$RUNNER_TEMP/art4k-reports/source-to-glb-axes.json"
      - name: Test actual 2026 source rig lean directions against original source sprites
        shell: bash
        run: |
          set -euo pipefail
          python tools/art/study_original_racer_root_lean_grid.py \
            --corpus "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json" \
            --source-axes "$RUNNER_TEMP/art4k-reports/source-chroma-axes.json" \
            --model-review-dir "$RUNNER_TEMP/art4k-verified-model/real-model-site/model-review" \
            --camera analysis/data/racer-inverse-side-provisional-1205.json \
            --out "$RUNNER_TEMP/art4k-reports/root-lean-grid.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/
            "art4k-reports/root-lean-grid.json").read_text())
          assert data["original_mask_count"]==35
          assert len(data["all_predeclared_root_rotation_5deg_grid_samples"])==20
          assert data["genuinely_new_original_3d_pose_holdout_tested"] is False
          assert data["source_2026_mesh_or_default_geometry_modified"] is False
          print("Unapproved original-mask root lean baseline",
            data["baseline_5_pose_unpaired_source_coverage"])
          print("Descriptive top two-grid candidate",
            data["top_five_two_added_samples_by_training_mean_axis_gap"][0])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("### Exploratory source-mask lean grid, NOT original 3D recovery\n\n")
              out.write("Verified 1994 ROM pixels and frozen five-GLB source.\n\n")
              out.write("No default rig geometry, source camera or 1994 pose mapping changed.\n")
          PY
      - name: Test actual whole GLB silhouettes and stable original source contact
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/art4k-verified-model/real-model-site/model-review/assets/d061cddcdbac9b2b5ac137d0d721b63f92dc3ec1/upright-efdc8425f252b4a0.glb"
          test -s "$model"
          printf '%s  %s\n' 'efdc8425f252b4a0218d140d087c6cc923689589e0cf74cc6333d722182595f5' "$model" | sha256sum --check --status
          python tools/art/evaluate_original_racer_lean_silhouettes.py \
            --corpus "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json" \
            --glb "$model" \
            --camera analysis/data/racer-inverse-side-provisional-1205.json \
            --out "$RUNNER_TEMP/art4k-reports/full-lean-silhouette.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"art4k-reports/full-lean-silhouette.json"
          report=json.loads(path.read_text())
          summary=report["summary"]
          assert report["original_unique_binary_silhouettes"]==35
          assert report["model_2026_faces"]==28860
          assert len(report["model_2026_root_pose_hypotheses"])==5
          assert summary["original_unique_binary_masks"]==35
          assert report["angle_grid_was_selected_using_these_known_original_masks"] is True
          assert report["source_original_1994_sprite_to_2026_rig_pose_paired"] is False
          assert report["original_3d_mesh_joint_or_tire_contact_recovered"] is False
          assert report["shipping_art_approved"] is False
          print("Real GLB full-silhouette source IoU:",summary["mean_full_silhouette_iou_per_fixed_source_root_pose"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("### Real source whole-silhouette lean check (post-hoc, unpaired)\n\n")
              out.write(f"35 SHA-distinct authentic 64px source masks; 5 actual 2026 source-root rotations.\n\n")
              for name,value in summary["mean_full_silhouette_iou_per_fixed_source_root_pose"].items():
                  out.write(f"- {name}: mean original-source IoU {value}\n")
              out.write("\nNo 1994 authentic camera, pose, physical ground-contact or likeness acceptance.\n")
          PY
      - name: Audit actual original ROM frame holds and 2D motion transitions
        shell: bash
        run: |
          set -euo pipefail
          python tools/art/audit_original_racer_temporal_motion.py \
            --corpus "$RUNNER_TEMP/art4k-verified-original-corpus/source-corpus.json" \
            --out "$RUNNER_TEMP/art4k-reports/original-temporal-edges.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          row=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "art4k-reports/original-temporal-edges.json").read_text())
          witness=row["temporal_source_witness"]
          assert row["source_original_frame_observations"]==91
          assert row["distinct_original_binary_masks"]==35
          assert row["original_source_representation_count"]==59
          assert witness["registered_source_windows"]==27
          assert row["original_frame_cadence_or_model_time_inferred"] is False
          print("Source original raster temporal edges", witness["source_observed_player_frame_pairs"])
          print("Actual consecutive guest-frame pairs",witness["actually_consecutive_original_guest_frame_pairs"])
          print("Actual source alpha changes",witness["source_binary_silhouette_changes"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as output:
              output.write("### Original ROM source-frame motion, not 1994 3D motion\n\n")
              output.write(f"Registered temporal observations: 91 across 27 windows\n\n")
              output.write(f"Consecutive guest-frame edges: {witness['actually_consecutive_original_guest_frame_pairs']}\n\n")
              output.write(f"Source silhouette-change edges: {witness['source_binary_silhouette_changes']}\n\n")
              output.write("No source→experimental-GLB pose or 1994 timing assigned.\n")
          PY
      - name: Upload short-lived, SHA-verified original sprite research corpus
        uses: actions/upload-artifact@v4
        with:
          name: art4k-original-source-families-for-review
          path: |
            ${{ runner.temp }}/art4k-verified-original-corpus/source-corpus.json
            ${{ runner.temp }}/art4k-verified-original-corpus/stock/source-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload bounded numeric provenance report
        uses: actions/upload-artifact@v4
        with:
          name: art4k-genuine-original-pose-family-wheel-holdout
          path: ${{ runner.temp }}/art4k-reports/*.json
          if-no-files-found: error
          retention-days: 30

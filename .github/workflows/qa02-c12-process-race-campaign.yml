name: QA-02 C12 bounded process-race campaign

# Research/targeted QA only: manual dispatch, bounded cohort, no release credit.
# Reuse the already established production coordinator fixture and compile once.
on:
  workflow_dispatch:
    inputs:
      trials_per_shard:
        description: "Fresh two-process contests per shard (four shards)"
        type: choice
        required: true
        default: "100"
        options:
          - "10"
          - "100"
          - "500"
      seed:
        description: "Base deterministic scheduling seed"
        required: true
        default: "11413"

  workflow_call:
    inputs:
      trials_per_shard:
        description: "Bounded per-shard repeat count for manual parent campaign"
        required: true
        type: string
      seed:
        description: "Immutable parent-selected seed"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa02-c12-process-race-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      binary_sha256: ${{ steps.digest.outputs.binary_sha256 }}
    steps:
      - name: Check out production coordinator and existing fixture
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate C12 campaign contracts before spending native runner time
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/unit -p test_qa02_c12_campaign.py
      - name: Build the original production coordinator process fixture once
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa02_c12_campaign.py build \
            --executable "$RUNNER_TEMP/c12-build/qa02-coordinator-race"
      - name: Bind the exact compiled fixture
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          digest=$(sha256sum "$RUNNER_TEMP/c12-build/qa02-coordinator-race" | cut -d ' ' -f1)
          echo "binary_sha256=$digest" >> "$GITHUB_OUTPUT"
          printf 'Source commit: %s\nNative fixture SHA-256: %s\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload single immutable producer executable
        uses: actions/upload-artifact@v4
        with:
          name: qa02-c12-native-binary
          path: ${{ runner.temp }}/c12-build/
          retention-days: 7
          if-no-files-found: error

  probes:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download shared native producer
        uses: actions/download-artifact@v4
        with:
          name: qa02-c12-native-binary
          path: ${{ runner.temp }}/c12-build
      - name: Run bounded independent C12 process races on fresh private roots
        shell: bash
        env:
          TRIALS: ${{ inputs.trials_per_shard }}
          BASE_SEED: ${{ inputs.seed }}
          SHARD: ${{ matrix.shard }}
          BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          [[ "$BASE_SEED" =~ ^[0-9]{1,8}$ ]] || { echo "Invalid seed"; exit 2; }
          [[ "$TRIALS" = 10 || "$TRIALS" = 100 || "$TRIALS" = 500 ]] || exit 2
          chmod +x "$RUNNER_TEMP/c12-build/qa02-coordinator-race"
          python3 tools/qa02_c12_campaign.py run \
            --executable "$RUNNER_TEMP/c12-build/qa02-coordinator-race" \
            --source-sha "$GITHUB_SHA" \
            --binary-sha256 "$BINARY_SHA256" \
            --trials "$TRIALS" --shard "$SHARD" \
            --seed "$((BASE_SEED + SHARD * 1000003))" \
            --work "$RUNNER_TEMP/c12-work" \
            --out "$RUNNER_TEMP/c12-result/result.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Always retain per-shard compact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa02-c12-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/c12-result/result.json
          retention-days: 14
          if-no-files-found: warn
      - name: Retain bounded failed case filesystem evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa02-c12-shard-${{ matrix.shard }}-failures
          path: ${{ runner.temp }}/c12-work/trial-*/
          retention-days: 7
          if-no-files-found: ignore

  aggregate:
    if: ${{ always() && needs.build.result == 'success' }}
    needs: [build, probes]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact per-shard results including partial campaigns
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: qa02-c12-shard-[0-3]
          path: ${{ runner.temp }}/c12-shards
          merge-multiple: false
      - name: Fail closed on missing, invalid or divergent trial population
        shell: bash
        env:
          TRIALS: ${{ inputs.trials_per_shard }}
          BASE_SEED: ${{ inputs.seed }}
          BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c12-shards"
          python3 tools/qa02_c12_campaign.py aggregate \
            --results-dir "$RUNNER_TEMP/c12-shards" \
            --source-sha "$GITHUB_SHA" \
            --binary-sha256 "$BINARY_SHA256" \
            --trials "$TRIALS" --seed "$BASE_SEED" \
            --out "$RUNNER_TEMP/c12-aggregate/result.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Always retain aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa02-c12-campaign-aggregate
          path: ${{ runner.temp }}/c12-aggregate/result.json
          retention-days: 14
          if-no-files-found: warn

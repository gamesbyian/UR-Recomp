      - name: Modern pause Run Data acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          LOG="$RUNNER_TEMP/pause-run-data.log"
          DUMPS="$RUNNER_TEMP/pause-run-data-dumps"
          mkdir -p "$DUMPS"

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/race-entered.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/race-entered.wram.bin" ]

            EXPECTED=$(python3 -c '"'"'import pathlib,sys; w=pathlib.Path(sys.argv[1]).read_bytes(); u=lambda o:w[o]|(w[o+1]<<8); m,ts,sec,t,sub=(u(0x0E0F),u(0x0E13),u(0x0E17),u(0x0E1B),u(0x0E1F)); assert 0<=m<=9 and 0<=ts<=5 and 0<=sec<=9 and 0<=t<=9 and 0<=sub<=5; print(f"{m}:{ts}{sec}.{t} subtick={sub}")'"'"' "'"$DUMPS"'/race-entered.wram.bin")

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]

            xdotool windowfocus "$WIN"
            xdotool key Escape
            sleep 0.2

            # Active race rows:
            # Resume -> Restart -> Focus Pause -> Controls -> Run Data.
            xdotool key Down
            xdotool key Down
            xdotool key Down
            xdotool key Down
            xdotool key Return

            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_RUN_DATA OPENED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_RUN_DATA OPENED valid=1 time=$EXPECTED" "'"$LOG"'"
            kill -0 "$PID"

            xdotool key Escape

          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/ui-options-submenus.script"
          LOG="$RUNNER_TEMP/ui-options-submenus.log"
          DUMPS="$RUNNER_TEMP/ui-options-submenu-dumps"
          mkdir -p "$DUMPS"

          echo "== scripted UI Options submenu reconnaissance =="
          SNESRECOMP_DUMP_DIR="$DUMPS" SDL_AUDIODRIVER=dummy \
          timeout 180s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \

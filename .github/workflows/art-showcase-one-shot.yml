name: Art showcase one-shot production
# Revision 3: permit proved same-player stock-identical timeline aliases

on:
  push:
    branches:
      - media/art-showcase-approved-gated-20261010
    paths:
      - .github/workflows/art-showcase-one-shot.yml

permissions:
  contents: write

concurrency:
  group: ur-art-showcase-one-shot
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Runtime dependencies and ROM identity
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
      - name: Export source and approved animation from canonical assets
        run: |
          set -euo pipefail
          OUT=media/showcase/art-reconstruction/2026-10-10
          python3 tools/showcase/art_showcase/export_approved_strip.py --player p1 --output "$OUT"
          python3 tools/showcase/art_showcase/render_approved_art.py --manifest "$OUT/inputs.json" --output "$OUT"
      - name: Independent video verification and source evidence
        run: |
          set -euo pipefail
          OUT=media/showcase/art-reconstruction/2026-10-10
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image
          p=Path("media/showcase/art-reconstruction/2026-10-10")
          data=json.loads((p/"provenance.json").read_text())
          manifest=json.loads((p/"inputs.json").read_text())
          assert len(manifest["frames"])==16
          assert [e["frame"] for e in manifest["frames"]]==list(range(1205,1221))
          assert len(data["clips"])==3
          assert [c["frames"] for c in data["clips"]]==[210,210,150]
          for c in data["clips"]:
              f=p/c["filename"]
              assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==c["sha256"]
              sheet=p/c["contact_sheet"]
              assert Image.open(sheet).size==(2400,270)
              assert hashlib.sha256(sheet.read_bytes()).hexdigest()==c["contact_sheet_sha256"]
              frames=json.loads(subprocess.check_output(["ffprobe","-v","error",
                  "-count_frames","-select_streams","v:0","-show_entries","stream=nb_read_frames",
                  "-of","json",str(f)]))["streams"][0]["nb_read_frames"]
              assert int(frames)==c["frames"]
          for e in manifest["frames"]:
              for k in ["stock_png","authored_png"]:
                  assert (p/e[k]).is_file()
          print("UR_ART_SHOWCASE_ACCEPTANCE PASS 3 MP4, 570 video frames, 16 ordered source poses, 3 contact sheets")
          PY
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          du -sh "$OUT"
      - name: Commit reproducible media to the isolated art lane
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/art-reconstruction/2026-10-10/
          git commit -m "Render verified first-family sprite remaster showcase clips"
          git push origin HEAD:media/art-showcase-approved-gated-20261010
      - name: Retain exact outputs for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-approved-art-showcase-one-shot
          if-no-files-found: warn
          retention-days: 7
          path: |
            media/showcase/art-reconstruction/2026-10-10/

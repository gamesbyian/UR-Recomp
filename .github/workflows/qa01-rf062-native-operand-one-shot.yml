# TEMPORARY source-authentic RF062 run. Research branch only, DO NOT MERGE.
# Corrected read-only RF018 check discriminates the single Read expression
# from the separate pointer-once Write expression (no host/game timing edit).
# RF018 read shape is qualified in an independent small preflight, then the
# reusable campaign is modified on this branch to stage the real native
# helper, direct decoded-PC IR read, generated-M1X0 static gate, and capture.
name: RF062 genuine USA Zoo direct sound operand one-shot

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/qa01-rf062-native-operand-one-shot.yml"

permissions:
  contents: read

jobs:
  rf018-source-compat-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact research code
        uses: actions/checkout@v4
      - name: Verify RF018 hoisted pointer and RF062 one-read compatibility
        run: |
          python3 -m unittest discover -s tests/unit -p 'test_qa01_rf062_direct_sound_bus_pc_patch.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_baldosa_dp_indirect_long_pointer_once_patch.py' -v

  authentic-rf062-zoo:
    needs: rf018-source-compat-preflight
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      zoo_terminal_phase: true
      zoo_race_mesh: true
      zoo_dp_window: true
      qa01_apu_phase: false
      source_followthrough: true
      baldosa_refresh_beam_rate: true
      baldosa_io_clock_order: true
      baldosa_spc_reference_rate: true
      baldosa_dp_pointer_once: true
      baldosa_hdma_cpu_stall: true
      baldosa_spc_interrupt_stage: true
      qa01_cold_guest_reload: true
      zoo_next_bowl: true

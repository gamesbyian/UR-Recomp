name: One-shot regenerate symbols for Dessy mining
on:
  push:
    branches:
      - chatgpt/dessy-full-mine-2026-09-30

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dessy-full-mine-2026-09-30
      - name: Regenerate symbols
        run: |
          python3 tools/export_symbols.py
          python3 tools/export_symbol_adapters.py
          git add analysis/generated/symbols.json analysis/generated/snes2asm-symbols.yml analysis/generated/mesen-symbols.mlb analysis/generated/ghidra-symbols.json analysis/generated/da65-symbols-bank-*.info
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate symbol exports after Dessyreqt mining"
          git push origin HEAD:chatgpt/dessy-full-mine-2026-09-30

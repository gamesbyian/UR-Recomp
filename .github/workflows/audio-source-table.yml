name: One-shot audio block-pool harvest

on:
  push:
    branches:
      - chatgpt/audio-source-table-2026-09-29
    paths:
      - .github/workflows/audio-source-table.yml

permissions:
  contents: read

jobs:
  harvest-audio-block-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Decode packed audio block pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio-block-pool"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          rom = Path("reference/roms/retail/Uniracers_USA.sfc").read_bytes()

          def file_to_cpu(off):
              bank = off // 0x8000
              addr = 0x8000 + (off % 0x8000)
              return (bank << 16) | addr

          # Helper 02:812A maps block ID X by walking length-prefixed records
          # from CPU 10:8000 (LoROM file offset 0x080000).
          cursor = 0x080000
          blocks = []
          for block_id in range(0x32):
              if cursor + 2 > len(rom):
                  raise SystemExit(f"block {block_id:02X} header outside ROM at {cursor:06X}")
              total_len = int.from_bytes(rom[cursor:cursor+2], "little")
              if total_len < 2 or cursor + total_len > len(rom):
                  raise SystemExit(f"implausible block {block_id:02X} length {total_len} at {cursor:06X}")
              record = rom[cursor:cursor+total_len]
              payload = record[2:]
              blocks.append({
                  "id": block_id,
                  "id_hex": f"0x{block_id:02X}",
                  "cpu_address": f"0x{file_to_cpu(cursor):06X}",
                  "file_offset": f"0x{cursor:06X}",
                  "total_length": total_len,
                  "payload_length": len(payload),
                  "record_sha256": hashlib.sha256(record).hexdigest(),
                  "payload_sha256": hashlib.sha256(payload).hexdigest(),
                  "payload_prefix_hex": payload[:32].hex(" "),
                  "payload_suffix_hex": payload[-16:].hex(" "),
              })
              cursor += total_len

          table_base = 0x01FAD5
          tables = []
          direct = {0xFAD5,0xFB15,0xFB55,0xFBD5,0xFC15}
          for i in range(6):
              off = table_base + i * 0x40
              cpu = file_to_cpu(off)
              raw = rom[off:off+0x40]
              ids = [x for x in raw if x != 0xFF]
              tables.append({
                  "cpu_address": f"0x{cpu:06X}",
                  "file_offset": f"0x{off:06X}",
                  "direct_transfer_caller_found": (cpu & 0xFFFF) in direct,
                  "bytes_hex": raw.hex(" "),
                  "block_ids": ids,
                  "block_ids_hex": [f"0x{x:02X}" for x in ids],
                  "non_ff_count": len(ids),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "selected_payload_bytes": sum(blocks[x]["payload_length"] for x in ids),
                  "expected_port3_bytes_including_64_selectors": 64 + sum(blocks[x]["payload_length"] for x in ids),
              })

          # Static code bytes that justified the decoder.
          def cpu_to_file(cpu):
              bank=(cpu>>16)&0x7F; addr=cpu&0xFFFF
              return bank*0x8000+(addr-0x8000)
          code_windows={}
          for name,cpu,size in (
              ("helper_02_812A",0x02812A,0x100),
              ("transfer_02_82A9",0x0282A9,0x100),
              ("helper_02_8328",0x028328,0x80),
          ):
              off=cpu_to_file(cpu)
              code_windows[name]={"cpu_start":f"0x{cpu:06X}","file_offset":f"0x{off:06X}","hex":rom[off:off+size].hex(" ")}

          out = {
              "schema_version": 1,
              "canonical_rom_sha256": hashlib.sha256(rom).hexdigest(),
              "pool_start_cpu": "0x108000",
              "pool_start_file_offset": "0x080000",
              "block_count": len(blocks),
              "pool_end_file_offset": f"0x{cursor:06X}",
              "pool_byte_length": cursor - 0x080000,
              "blocks": blocks,
              "selector_tables": tables,
              "code_windows": code_windows,
          }
          target=Path(__import__("os").environ["RUNNER_TEMP"])/"audio-block-pool"/"audio-block-pool.json"
          target.write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps({
              "block_count":len(blocks),
              "pool_end_file_offset":out["pool_end_file_offset"],
              "pool_byte_length":out["pool_byte_length"],
              "blocks":[{k:b[k] for k in ("id_hex","cpu_address","total_length","payload_length","payload_sha256")} for b in blocks],
              "tables":[{k:t[k] for k in ("cpu_address","direct_transfer_caller_found","non_ff_count","selected_payload_bytes","expected_port3_bytes_including_64_selectors")} for t in tables],
          },indent=2))
          PY

      - name: Upload block-pool evidence
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-audio-block-pool
          path: ${{ runner.temp }}/audio-block-pool/audio-block-pool.json
          retention-days: 2

          assert [x["semantic_frame_id"] for x in spill["states"]] == ["0x04B9", "0x0239", "0x00B9", "0x0439", "0x01B9"]
          assert current["measurement"]["player_frame_observations"] == 882
          retained_floor = (
              retained["current_after"]["hd_selected_player_frames"]
              + retained["broader_player_local_spill_in"]["player_frames_added"]
          )
          assert current["measurement"]["hd_selected_player_frames"] >= retained_floor
          assert (
              current["measurement"]["hd_selected_player_frames"]
              + current["measurement"]["original_fallback_player_frames"]
              == current["measurement"]["player_frame_observations"]
          )

          assert dossier["temporal_window"]["start"] == 1354
          assert dossier["temporal_window"]["end"] == 1356
          assert dossier["temporal_window"]["frame_count"] == 3
          assert len(dossier["representations"]) == 2
          for rep in dossier["representations"]:
              proof = rep["art_review"]["reuse_proof"]
              assert proof["same_player"] is True
              assert proof["stock_rgba_byte_identical"] is True
              assert proof["stock_rgba_sha256"] == proof["source_stock_rgba_sha256"]
              assert rep["art_review"]["authored_candidate"]["rgba_sha256"] == proof["source_authored_rgba_sha256"]

          assert equivalence["semantic_representation_count"] == 2
          assert equivalence["unique_stock_pose_count"] == 2
          assert equivalence["worklist"]["unauthored_pose_count"] == 0
          assert equivalence["worklist"]["conflicting_authored_pose_count"] == 0
          assert readiness["shipping_ready"] is True
          assert readiness["counts"]["approved"] == 2
          assert temporal["window"] == [1354, 1356]
          assert temporal["sequence_key"] == "ordinary-race-1354-1356-frequency-hold"
          assert all(temporal["validation"].values())
          for player in ("p1", "p2"):
              pairs = temporal["sequences"][player]["pairs"]
              assert len(pairs) == 2
              assert all(pair["transition_class"] == "static" for pair in pairs)
              assert all(pair["static_edge_preserved"] for pair in pairs)

          print(
              "UR_RACER_FALLBACK_FREQUENCY PASS "
              f"before={retained['before']['hd_selected_player_frames']}/882 "
              f"current={current['measurement']['hd_selected_player_frames']}/882 "
              f"retained_floor={retained_floor}"
          )
          PY


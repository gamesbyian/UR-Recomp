name: airborne rotation native/reference differential

on:
  workflow_dispatch:
  push:
    paths:
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "rom_identity.txt"
      - "snesrecomp"
      - "tests/input/race-rotation-left.script"
      - "tests/input/race-rotation-right.script"
      - "tests/input/race-rotation-control.script"
      - "tools/summarize_player_checkpoints.py"
      - "tools/summarize_paired_player_slots.py"
      - "tools/compare_wram_checkpoints.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain.json"
      - ".github/workflows/race-rotation-differential.yml"

concurrency:
  group: race-rotation-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build native target
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native"
          mkdir -p "$ROOT"
          sh snesrecomp/tools/new_project/setup_project.sh \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --generate \
            --build \
            --snesrecomp-ref cd5875cbdaf19f5e324272b1f8051d671fce9215
          test -x "$ROOT/UniracersSNESRecomp/build/UniracersSNESRecomp"

      - name: Build pinned Snes9x and snesref
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2
          test -x "$RUNNER_TEMP/snesref-build/snesref"

      - name: Run native rotation intervention and control
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for kind in left right control; do
            SCRIPT="$GITHUB_WORKSPACE/tests/input/race-rotation-${kind}.script"
            DUMPS="$RUNNER_TEMP/native-rotation-${kind}-dumps"
            LOG="$RUNNER_TEMP/native-rotation-${kind}.log"
            mkdir -p "$DUMPS"
            SNESRECOMP_DUMP_DIR="$DUMPS" SDL_AUDIODRIVER=dummy \
              timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$LOG" 2>&1
            cat "$LOG"
            test -s "$DUMPS/rotation-settle.wram.bin"
          done

      - name: Run reference rotation intervention and control
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/snesref-build/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for kind in left right control; do
            SCRIPT="$GITHUB_WORKSPACE/tests/input/race-rotation-${kind}.script"
            DUMPS="$RUNNER_TEMP/reference-rotation-${kind}-dumps"
            LOG="$RUNNER_TEMP/reference-rotation-${kind}.log"
            mkdir -p "$DUMPS"
            SNESREF_HEADLESS=1 \
            SNESREF_FAST=1 \
            SNESREF_WRAM_FILL=0 \
            SNESREF_SCRIPT="$SCRIPT" \
            SNESREF_DUMP_DIR="$DUMPS" \
              "$EXE" "$CORE" "$ROM" >"$LOG" 2>&1
            cat "$LOG"
            test -s "$DUMPS/rotation-settle.wram.bin"
          done

      - name: Summarize rotation semantics
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINTS=(
            --checkpoint accel-180
            --checkpoint rotation-pre
            --checkpoint rotation-input-008
            --checkpoint rotation-post-008
            --checkpoint rotation-post-016
            --checkpoint rotation-release-016
            --checkpoint rotation-settle
          )
          for engine in native reference; do
            for kind in left right control; do
              python3 tools/summarize_player_checkpoints.py \
                "$RUNNER_TEMP/${engine}-rotation-${kind}-dumps" \
                "${CHECKPOINTS[@]}" \
                --json-out "$RUNNER_TEMP/${engine}-rotation-${kind}-state.json" \
                | tee "$RUNNER_TEMP/${engine}-rotation-${kind}-state.txt"
            done
          done

          python3 - \
            "$RUNNER_TEMP/native-rotation-left-state.json" "$RUNNER_TEMP/reference-rotation-left-state.json" \
            "$RUNNER_TEMP/native-rotation-right-state.json" "$RUNNER_TEMP/reference-rotation-right-state.json" \
            "$RUNNER_TEMP/native-rotation-control-state.json" "$RUNNER_TEMP/reference-rotation-control-state.json" <<'PY'
          import json, pathlib, sys
          nl, rl, nr, rr, nc, rc=[json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          fields=["x_pos","y_pos","x_speed","y_speed","air_effective","pitch_effective"]
          for label,a,b in (
              ("left native/reference",nl,rl),
              ("right native/reference",nr,rr),
              ("control native/reference",nc,rc),
          ):
              print("==",label,"==")
              for cp in a:
                  diff={k:(a[cp][k],b[cp][k]) for k in fields if a[cp][k]!=b[cp][k]}
                  print(cp, "MATCH" if not diff else diff)
                  if diff:
                      raise SystemExit(1)
          for label,a in (("L",nl),("R",nr)):
              print(f"== native {label} causal semantic deltas ==")
              for cp in a:
                  diff={k:(a[cp][k],nc[cp][k]) for k in fields if a[cp][k]!=nc[cp][k]}
                  print(cp, diff or "IDENTICAL")
          PY

      - name: Compare L/R rotation against matched control
        shell: bash
        run: |
          set -euo pipefail
          for engine in native reference; do
            for kind in left right; do
              python3 tools/compare_wram_checkpoints.py \
                "$RUNNER_TEMP/${engine}-rotation-${kind}-dumps" "$RUNNER_TEMP/${engine}-rotation-control-dumps" \
                --label-a "${kind}" --label-b jump-only --limit 100 \
                --checkpoint rotation-pre \
                --checkpoint rotation-input-008 \
                --checkpoint rotation-post-008 \
                --checkpoint rotation-post-016 \
                --checkpoint rotation-release-016 \
                --checkpoint rotation-settle \
                --json-out "$RUNNER_TEMP/${engine}-rotation-${kind}-effect.json" \
                | tee "$RUNNER_TEMP/${engine}-rotation-${kind}-effect.txt"
            done
          done

      - name: Upload rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-airborne-rotation
          path: |
            ${{ runner.temp }}/native-rotation-*.log
            ${{ runner.temp }}/reference-rotation-*.log
            ${{ runner.temp }}/native-rotation-*-state.json
            ${{ runner.temp }}/reference-rotation-*-state.json
            ${{ runner.temp }}/native-rotation-*-state.txt
            ${{ runner.temp }}/reference-rotation-*-state.txt
            ${{ runner.temp }}/native-rotation-*-effect.json
            ${{ runner.temp }}/reference-rotation-*-effect.json
            ${{ runner.temp }}/native-rotation-*-effect.txt
            ${{ runner.temp }}/reference-rotation-*-effect.txt
            ${{ runner.temp }}/native-rotation-*-dumps/
            ${{ runner.temp }}/reference-rotation-*-dumps/
          if-no-files-found: warn
          retention-days: 7

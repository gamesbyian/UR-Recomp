name: RNC scope-entry decoder probe

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rnc-scope-decoder-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Decode RNC attribution scope entries
        run: |
          python3 tools/probe_rnc_writer_decode.py \
            reference/roms/retail/Uniracers_USA.sfc \
            --json-out analysis/generated/rnc-writer-decode.json
          cat analysis/generated/rnc-writer-decode.json

      - name: Persist generated report
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch analysis/generated/rnc-writer-decode.json >/dev/null 2>&1 && \
             git diff --quiet -- analysis/generated/rnc-writer-decode.json; then
            echo "report already current"
            exit 0
          fi
          git add analysis/generated/rnc-writer-decode.json
          if git diff --cached --quiet; then
            echo "report already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record RNC scope decoder probe"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

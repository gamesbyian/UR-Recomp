name: Native build and boot smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "rom_identity.txt"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "third_party/manifest.json"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/patches/snesrecomp-live-vsync.patch"
      - "tools/patches/snesrecomp-live-display-mode.patch"
      - "tools/patches/snesrecomp-presentation-scale.patch"
      - "tools/toolchain-entries/_global.json"
      - "tools/patch_modern_product_host.py"
      - "tools/check_ppm.py"
      - "tools/prepare_native_widescreen_product.py"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/apply_native_widescreen_hook.py"
      - "tools/patches/snesrecomp-dynamic-native-widescreen.patch"
      - "tools/build_display_geometry_review.py"
      - "tools/analyze_display_active_height.py"
      - "tests/unit/test_analyze_display_active_height.py"
      - "tests/unit/test_check_ppm.py"
      - "analysis/display-geometry-candidates.json"
      - "native/product/**"
      - "native/title/uniracers_restart_policy.*"
      - "native/title/uniracers_ws_margins.*"
      - "tests/native/uniracers_ws_margins_test.c"
      - "tests/unit/test_uniracers_ws_margins_c.py"
      - "tests/input/vs-first-race.input"
      - "tests/input/vs-first-race-observe.script"
      - "tests/input/two-player-first-race.input"
      - "tests/input/two-player-first-race-observe.script"
      - "tools/patches/snesrecomp-ws-shadow-split-band.patch"
      - "tests/input/reach-first-race.script"
      - "tests/input/modern-focus-pause.script"
      - "tests/input/modern-profile-panel-acceptance.script"
      - "tests/input/modern-exit-frontend-results.script"
      - "tests/input/modern-exit-frontend-active.script"
      - "tests/input/widescreen-product-acceptance.script"
      - "tools/check_widescreen_product_parity.py"
      - "tests/unit/test_check_widescreen_product_parity.py"
      - ".github/workflows/native-build-smoke.yml"
      - "third_party/archives/SDL3-3.4.10.tar.gz"
      - "tools/toolchain-entries/sdl3.json"
concurrency:
  group: native-build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config xvfb xdotool \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Stage repository-owned SNESRecomp framework
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          # Canonical desktop backend (docs/PLATFORM-TARGETS.md): exact SDL3 source, staged offline.
          python3 tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only
          test -f .tools/src/sdl3/SDL3-3.4.10/CMakeLists.txt
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh
          test -f .tools/src/snesrecomp/runner/runner.cmake
          test ! -e .tools/src/snesrecomp/lib/recomp-net/CMakeLists.txt
          test ! -e .tools/src/snesrecomp/lib/retcomm-rbengine/CMakeLists.txt

      - name: Scaffold, generate and build
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-recomp-build"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --no-generate \
              --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 "$GITHUB_WORKSPACE/tools/prepare_native_widescreen_product.py" \
            --framework "$FRAMEWORK" \
            --project "$ROOT" \
            --rom "$ROM" \
            --json-out "$RUNNER_TEMP/widescreen-product-prepare.json"
          grep -q '"product_ready": true' "$RUNNER_TEMP/widescreen-product-prepare.json"

          python3 "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py" \
            "$ROOT/src/main.c" \
            --game-rtl "$ROOT/src/game_rtl.c" \
            --cmake "$ROOT/CMakeLists.txt"
          grep -q "ur_uniracers_product_after_run_frame" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_key_down" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_gamepad_button" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_overlay" "$ROOT/src/main.c"
          grep -q "ur_uniracers_modern_native_widescreen_enabled" "$ROOT/src/main.c"
          grep -q "uniracers_modern_host.cpp" "$ROOT/CMakeLists.txt"
          grep -q "\.session_reset = &GameSessionReset" "$ROOT/src/game_rtl.c"

          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON \
            -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Locate game executable
        id: exe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-recomp-build/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"

          echo "== executable files under build/ =="
          find "$ROOT/build" -maxdepth 4 -type f -perm -111 -print || true

          if [ ! -f "$EXE" ] || [ ! -x "$EXE" ]; then
            echo "::error::Expected generated game target is missing or not executable: $EXE"
            echo "The scaffold contract names the CMake target UniracersSNESRecomp; do not fall back to arbitrary build-tree executables."
            exit 1
          fi

          case "$EXE" in
            */CMakeFiles/*|*/CompilerId*|*/a.out)
              echo "::error::Refusing non-game build helper executable: $EXE"
              exit 1
              ;;
          esac

          file "$EXE"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "Selected game target: $EXE"

      - name: Modern profile persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/host-profile-store-acceptance"
          STATE="$RUNNER_TEMP/profile-alpha.state"
          LOG="$RUNNER_TEMP/profile-persistence.log"
          rm -f "$STATE" "$STATE.tmp" "$LOG"

          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I "$GITHUB_WORKSPACE/native/product" \
            "$GITHUB_WORKSPACE/native/product/host_product_state.cpp" \
            "$GITHUB_WORKSPACE/native/product/output_resolution_policy.cpp" \
            "$GITHUB_WORKSPACE/native/product/modern_racer_identity.cpp" \
            "$GITHUB_WORKSPACE/native/product/host_profile_state.cpp" \
            "$GITHUB_WORKSPACE/native/product/host_profile_store.cpp" \
            "$GITHUB_WORKSPACE/tests/native/host_profile_store_acceptance.cpp" \
            -o "$EXE"

          "$EXE" save "$STATE" | tee -a "$LOG"
          "$EXE" load "$STATE" | tee -a "$LOG"
          "$EXE" legacy-host-default "$STATE" | tee -a "$LOG"
          "$EXE" malformed "$STATE" | tee -a "$LOG"
          "$EXE" authentic "$STATE" | tee -a "$LOG"

          grep -q "PROFILE_ACCEPTANCE saved generation=1" "$LOG"
          grep -q "PROFILE_ACCEPTANCE fresh_process_load_ok" "$LOG"
          grep -q "PROFILE_ACCEPTANCE legacy_host_defaulted" "$LOG"
          grep -q "PROFILE_ACCEPTANCE malformed_defaulted_preserved" "$LOG"
          grep -q "PROFILE_ACCEPTANCE authentic_inert" "$LOG"
          echo "UR_PROFILE_PERSISTENCE_RESULT=restart_legacy_default_recovery_authentic_inert"

      - name: Modern profile save-root isolation acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ALPHA_STATE="$RUNNER_TEMP/profile-alpha-host-state.txt"
          BETA_STATE="$RUNNER_TEMP/profile-beta-host-state.txt"
          ALPHA_ROOT="$RUNNER_TEMP/profile-alpha-saves"
          BETA_ROOT="$RUNNER_TEMP/profile-beta-saves"
          AUTH_ROOT="$RUNNER_TEMP/profile-authentic-ignored"
          mkdir -p "$ALPHA_ROOT" "$BETA_ROOT" "$AUTH_ROOT"
          cp "$GITHUB_WORKSPACE/reference/imported/reverse-engineering/dessyreqt/SRAM/Clean.srm" \
            "$ALPHA_ROOT/save.srm"
          cp "$GITHUB_WORKSPACE/reference/imported/reverse-engineering/dessyreqt/SRAM/All Silvers - No Hunter.srm" \
            "$BETA_ROOT/save.srm"

          cat >"$ALPHA_STATE" <<'EOF'
          UR-HOST-STATE/6
          profile=alpha
          pause_on_focus_loss=1
          vibration_enabled=1
          EOF
          cat >"$BETA_STATE" <<'EOF'
          UR-HOST-STATE/6
          profile=beta
          pause_on_focus_loss=1
          vibration_enabled=1
          EOF

          run_case() {
            local NAME="$1"
            local STATE="$2"
            local ROOT="$3"
            local MODE="$4"
            local LOG="$RUNNER_TEMP/profile-root-$NAME.log"

            set +e
            SDL_AUDIODRIVER=dummy \
            UR_PRODUCT_DIAGNOSTICS=1 \
            UR_HOST_STATE_PATH="$STATE" \
            UR_PROFILE_SAVE_ROOT="$ROOT" \
            UR_PROFILE_SRAM_DIAGNOSTICS=1 \
            UR_EXECUTION_MODE="$MODE" \
            SNESRECOMP_RUN_FRAMES=1 \
            timeout 12s xvfb-run -a "$EXE" "$ROM" >"$LOG" 2>&1
            local STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
              cat "$LOG"
              exit "$STATUS"
            fi
            cat "$LOG"
          }

          run_case alpha-first "$ALPHA_STATE" "$ALPHA_ROOT" modern
          run_case alpha-restart "$ALPHA_STATE" "$ALPHA_ROOT" modern
          run_case beta "$BETA_STATE" "$BETA_ROOT" modern
          run_case authentic "$ALPHA_STATE" "$AUTH_ROOT" authentic

          grep -Fq "UR_PROFILE_SAVE_ROOT APPLIED profile=alpha root=$ALPHA_ROOT" \
            "$RUNNER_TEMP/profile-root-alpha-first.log"
          grep -Fq "UR_PROFILE_SAVE_ROOT APPLIED profile=alpha root=$ALPHA_ROOT" \
            "$RUNNER_TEMP/profile-root-alpha-restart.log"
          grep -Fq "UR_PROFILE_SAVE_ROOT APPLIED profile=beta root=$BETA_ROOT" \
            "$RUNNER_TEMP/profile-root-beta.log"
          grep -Fq "UR_PROFILE_SAVE_ROOT AUTHENTIC_DEFAULT root=saves" \
            "$RUNNER_TEMP/profile-root-authentic.log"
          if grep -Fq "UR_PROFILE_SAVE_ROOT APPLIED" "$RUNNER_TEMP/profile-root-authentic.log"; then
            echo "::error::Authentic mode applied a Modern profile save root"
            exit 1
          fi
          test -d "$ALPHA_ROOT"
          test -d "$BETA_ROOT"
          test "$ALPHA_ROOT" != "$BETA_ROOT"

          ALPHA_DIGEST=$(sed -n 's/.*UR_PROFILE_SRAM LOADED .*digest=\([0-9A-F]*\).*/\1/p' \
            "$RUNNER_TEMP/profile-root-alpha-first.log" | tail -n1)
          ALPHA_RESTART_DIGEST=$(sed -n 's/.*UR_PROFILE_SRAM LOADED .*digest=\([0-9A-F]*\).*/\1/p' \
            "$RUNNER_TEMP/profile-root-alpha-restart.log" | tail -n1)
          BETA_DIGEST=$(sed -n 's/.*UR_PROFILE_SRAM LOADED .*digest=\([0-9A-F]*\).*/\1/p' \
            "$RUNNER_TEMP/profile-root-beta.log" | tail -n1)
          test -n "$ALPHA_DIGEST"
          test -n "$BETA_DIGEST"
          test "$ALPHA_DIGEST" = "$ALPHA_RESTART_DIGEST"
          test "$ALPHA_DIGEST" != "$BETA_DIGEST"
          grep -q "UR_PROFILE_SRAM LOADED root=$ALPHA_ROOT .* size=8192" \
            "$RUNNER_TEMP/profile-root-alpha-first.log"
          grep -q "UR_PROFILE_SRAM LOADED root=$BETA_ROOT .* size=8192" \
            "$RUNNER_TEMP/profile-root-beta.log"

          DEFAULT_STATE="$RUNNER_TEMP/profile-default-host-state.txt"
          DEFAULT_LOG="$RUNNER_TEMP/profile-root-default.log"
          cat >"$DEFAULT_STATE" <<'EOF'
          UR-HOST-STATE/6
          profile=default.gamma
          pause_on_focus_loss=1
          vibration_enabled=1
          EOF
          rm -rf "$(dirname "$EXE")/saves/profile-default.gamma"
          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$DEFAULT_STATE" \
          SNESRECOMP_RUN_FRAMES=1 \
          timeout 12s xvfb-run -a "$EXE" "$ROM" >"$DEFAULT_LOG" 2>&1
          grep -Fq "UR_PROFILE_SAVE_ROOT APPLIED profile=default.gamma root=saves/profile-default.gamma" \
            "$DEFAULT_LOG"
          grep -Fq "UR_PROFILE_STATE MISSING_READ_ONLY" "$DEFAULT_LOG"
          test -d "$(dirname "$EXE")/saves/profile-default.gamma"

          echo "UR_PROFILE_SAVE_ROOT_RESULT=alpha_restart_byte_stable_beta_content_isolated_authentic_default_default_root_creatable"

      - name: Modern racer profile panel acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-profile-panel-acceptance.script"
          ROOT="$RUNNER_TEMP/modern-profile-panel"
          STATE="$ROOT/host-state-v6.txt"
          LOG="$ROOT/run.log"
          DUMPS="$ROOT/dumps"
          SAVE_ROOT="$(dirname "$EXE")/saves/profile-steve"
          SECOND_ROOT="$(dirname "$EXE")/saves/profile-mike"
          rm -rf "$ROOT" "$SAVE_ROOT" "$SECOND_ROOT"
          mkdir -p "$DUMPS"
          cat >"$STATE" <<'EOF'
          UR-HOST-STATE/6
          profile=
          pause_on_focus_loss=1
          vibration_enabled=1
          EOF

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export UR_HOST_STATE_PATH="'"$STATE"'"
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/profile-panel-rider-select-ready.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/profile-panel-rider-select-ready.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]
            xdotool windowfocus "$WIN"

            # Open the real Modern panel and wrap one preset left from MIKE
            # to exact classic STEVE/rider 15. Rename afterward to prove the
            # player-facing name is independent from the stock rider identity.
            xdotool key F2
            xdotool key n
            xdotool key Left
            xdotool key Return
            for _ in $(seq 1 100); do
              grep -q "UR_PROFILE_UI CREATED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PROFILE_UI CREATED" "'"$LOG"'"

            # A rejected edit is still modal: submit an empty rename first
            # and prove the host consumes it instead of dismissing the editor or
            # forwarding Enter to the stock rider-select screen underneath.
            xdotool key r
            xdotool key BackSpace BackSpace BackSpace BackSpace BackSpace
            xdotool key Return
            for _ in $(seq 1 100); do
              grep -q "UR_PROFILE_UI SAVE_REJECTED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PROFILE_UI SAVE_REJECTED" "'"$LOG"'"

            xdotool type SONIC
            xdotool key Return
            for _ in $(seq 1 100); do
              grep -q "UR_PROFILE_UI RENAMED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PROFILE_UI RENAMED" "'"$LOG"'"
            grep -q "UR_PROFILE_UI COOL_NAME" "'"$LOG"'"

            # Create a second independent default MIKE profile, then switch
            # back to the first profile through the actual chooser.
            xdotool key n
            xdotool key Return
            for _ in $(seq 1 100); do
              [ "$(grep -c "UR_PROFILE_UI CREATED" "'"$LOG"'")" -ge 2 ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ "$(grep -c "UR_PROFILE_UI CREATED" "'"$LOG"'")" -ge 2 ]
            xdotool key Up
            xdotool key Return
            sleep 0.2
            xdotool key Escape

            # The script now continues through ordinary stock rider confirm.
            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/profile-panel-tour-ready.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/profile-panel-tour-ready.wram.bin" ]
            wait "$PID"
          '

          cat "$LOG"
          grep -q "UR_PROFILE_UI OPENED" "$LOG"
          grep -q "UR_PROFILE_SELECT APPLIED" "$LOG"
          grep -q "^profile=steve$" "$STATE"
          test -s "$SAVE_ROOT/host-profile.txt"
          grep -q "^profile=steve$" "$SAVE_ROOT/host-profile.txt"
          grep -q "^racer_name=SONIC$" "$SAVE_ROOT/host-profile.txt"
          grep -q "^racer_index=15$" "$SAVE_ROOT/host-profile.txt"
          grep -Eq "^stock_sram=[0-9a-f]{16384}$" "$SAVE_ROOT/host-profile.txt"
          test -s "$SECOND_ROOT/host-profile.txt"
          grep -q "^profile=mike$" "$SECOND_ROOT/host-profile.txt"
          grep -q "^racer_name=MIKE$" "$SECOND_ROOT/host-profile.txt"
          grep -q "^racer_index=0$" "$SECOND_ROOT/host-profile.txt"
          grep -Eq "^stock_sram=[0-9a-f]{16384}$" "$SECOND_ROOT/host-profile.txt"
          python3 - \
            "$GITHUB_WORKSPACE/reference/imported/reverse-engineering/dessyreqt/SRAM/Clean.srm" \
            "$SAVE_ROOT/host-profile.txt" "$SECOND_ROOT/host-profile.txt" <<'PY'
          from pathlib import Path
          import sys

          clean = Path(sys.argv[1]).read_bytes()
          if len(clean) != 8192:
              raise SystemExit(f"unexpected clean SRAM size: {len(clean)}")

          def snapshot(path):
              fields = {}
              for line in Path(path).read_text().splitlines():
                  if "=" in line:
                      key, value = line.split("=", 1)
                      fields[key] = value
              encoded = fields.get("stock_sram", "")
              if len(encoded) != 16384:
                  raise SystemExit(f"missing stock SRAM snapshot in {path}")
              return bytes.fromhex(encoded)

          first = snapshot(sys.argv[2])
          second = snapshot(sys.argv[3])
          if first == second:
              raise SystemExit("second created Modern profile cloned active-profile SRAM")
          print("UR_PROFILE_SRAM_ISOLATION second_profile_distinct_from_first=1")
          print(
              "UR_PROFILE_POST_ACTIVATION "
              f"clean_byte_identical={int(second == clean)} bytes=8192"
          )
          PY
          [ "$(grep -c "UR_PROFILE_UI CREATED" "$LOG")" -ge 2 ]
          [ "$(grep -c "UR_PROFILE_SELECT APPLIED" "$LOG")" -ge 3 ]
          python3 - "$DUMPS/profile-panel-tour-ready.wram.bin" <<'PY'
          from pathlib import Path
          import sys
          wram = Path(sys.argv[1]).read_bytes()
          rider = wram[0x017D]
          if rider != 15:
              raise SystemExit(
                  f"Modern STEVE preset did not reach stock rider init: {rider}")
          print("UR_PROFILE_STOCK_RIDER rider=15")
          PY

          # The same host hotkey must be inert under Authentic policy.
          AUTH_LOG="$ROOT/authentic.log"
          AUTH_DUMPS="$ROOT/authentic-dumps"
          rm -rf "$AUTH_DUMPS"
          mkdir -p "$AUTH_DUMPS"
          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export UR_EXECUTION_MODE=authentic
            export UR_HOST_STATE_PATH="'"$STATE"'"
            export SNESRECOMP_DUMP_DIR="'"$AUTH_DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$AUTH_LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$AUTH_DUMPS"'/profile-panel-rider-select-ready.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$AUTH_DUMPS"'/profile-panel-rider-select-ready.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]
            xdotool windowfocus "$WIN"
            xdotool key F2
            sleep 0.5
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          '
          ! grep -q "UR_PROFILE_UI OPENED" "$AUTH_LOG"
          echo "UR_PROFILE_PANEL_RESULT=two_profile_create_switch_rename_cool_name_profile_sram_isolated_stock_rider_15_authentic_inert"

      - name: Modern unfinished-tour resume acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script"
          STATE="$RUNNER_TEMP/tour-resume-host-state.txt"
          ROOT="$RUNNER_TEMP/tour-resume-profile"
          LOG="$RUNNER_TEMP/tour-resume-restore.log"
          DUMPS="$RUNNER_TEMP/tour-resume-restore-dumps"
          rm -rf "$ROOT" "$DUMPS"
          mkdir -p "$ROOT" "$DUMPS"

          cat >"$STATE" <<'EOF'
          UR-HOST-STATE/6
          profile=resume.alpha
          pause_on_focus_loss=1
          vibration_enabled=1
          EOF

          # R-2026-10-04-UI-20 already proves that battery-backed unfinished
          # flags survive boot and that stock rider confirmation wipes all 50.
          # Build the smallest exact fixture from the canonical clean SRAM:
          # Crawler/rider 0, medal generation 0, tracks 0+1 qualified.
          python3 - \
            "$GITHUB_WORKSPACE/reference/imported/reverse-engineering/dessyreqt/SRAM/Clean.srm" \
            "$ROOT/save.srm" "$ROOT/host-profile.txt" <<'PY'
          from pathlib import Path
          import sys

          source, sram_path, profile_path = map(Path, sys.argv[1:])
          sram = bytearray(source.read_bytes())
          if len(sram) != 8192:
              raise SystemExit(f"unexpected clean SRAM size: {len(sram)}")
          rider = 0
          tour = 0
          medal = sram[0x069C + 16 * tour + rider]
          if medal != 0:
              raise SystemExit(f"clean fixture medal is not zero: {medal}")
          flags = bytes((1, 1, 0, 0, 0))
          sram[0x1075:0x107A] = flags
          sram_path.write_bytes(sram)
          profile_path.write_text(
              "UR-HOST-PROFILE/2\n"
              "profile=resume.alpha\n"
              "generation=1\n"
              f"stock_sram={bytes(sram).hex()}\n"
              f"tour_resume={rider}:{tour}:{medal}:11000\n"
          )
          print("UR_TOUR_RESUME_FIXTURE rider=0 tour=0 medal=0 flags=11000")
          PY

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$STATE" \
          UR_PROFILE_SAVE_ROOT="$ROOT" \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
          timeout 100s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            >"$LOG" 2>&1

          grep -q "UR_TOUR_RESUME APPLIED" "$LOG"
          test -s "$DUMPS/rider-select-ready.wram.bin"
          test -s "$DUMPS/tracks-ready.wram.bin"
          test -s "$DUMPS/race-entered.wram.bin"

          python3 - "$ROOT/host-profile.txt" "$ROOT/save.srm" <<'PY'
          import pathlib
          import sys

          profile = pathlib.Path(sys.argv[1]).read_text().splitlines()
          sram = pathlib.Path(sys.argv[2]).read_bytes()
          resume = next(line.split("=", 1)[1] for line in profile
                        if line.startswith("tour_resume="))
          rider, tour, medal, flags = resume.split(":")
          tour = int(tour)
          expected = bytes(int(ch) for ch in flags)
          actual = sram[0x1075 + 5 * tour:0x1075 + 5 * tour + 5]
          if actual != expected:
              raise SystemExit(
                  f"restored tour flags mismatch: expected={list(expected)} actual={list(actual)}")
          if not 0 < sum(actual) < 5:
              raise SystemExit(f"continuation is not unfinished progress: {list(actual)}")
          print(
              "UR_TOUR_RESUME_FILE",
              f"rider={rider}",
              f"tour={tour}",
              f"medal={medal}",
              f"flags={flags}",
          )
          PY

          grep "UR_TOUR_RESUME" "$LOG"
          echo "UR_TOUR_RESUME_RESULT=stock_rider_wipe_then_fresh_process_restore"


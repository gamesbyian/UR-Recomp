name: Native Widescreen runtime hook

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/widescreen-native-hook.yml"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/inspect_native_widescreen_prep_anchor.py"
      - "tools/apply_native_widescreen_hook.py"
      - "tests/unit/test_seed_native_widescreen_aot.py"
      - "tests/unit/test_inspect_native_widescreen_prep_anchor.py"
      - "tests/unit/test_apply_native_widescreen_hook.py"

concurrency:
  group: widescreen-native-hook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install generation dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Run focused unit coverage
        run: |
          python3 -m unittest             tests.unit.test_seed_native_widescreen_aot             tests.unit.test_inspect_native_widescreen_prep_anchor

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Generate native project and seed preparation wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh"             --rom "$ROM"             --dir "$ROOT"             --name "Uniracers"             --players 2             --yes             --no-ci             --no-fetch-boxart             --no-recomp-ui             --no-netplay             --no-github             --no-submodules             --generate             --no-build
          PROJECT="$ROOT/UniracersSNESRecomp"
          python3 tools/seed_native_widescreen_aot.py "$PROJECT/recomp"
          python3 "$FRAMEWORK/snesrecomp_cli.py" generate             --rom "$ROM"             --project-root "$PROJECT"             --cfg-dir recomp             --out-dir src/gen             --funcs-h recomp/funcs.h             --cfg-roots
          test -d "$PROJECT/src/gen"

      - name: Inspect accepted preparation seam
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          python3 tools/inspect_native_widescreen_prep_anchor.py             "$PROJECT/src/gen"             --radius 48             --json-out analysis/generated/widescreen-native-prep-anchor.json             --md-out analysis/generated/widescreen-native-prep-anchor.md
          cat analysis/generated/widescreen-native-prep-anchor.md

      - name: Upload compact anchor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widescreen-native-prep-anchor
          path: |
            analysis/generated/widescreen-native-prep-anchor.json
            analysis/generated/widescreen-native-prep-anchor.md
          if-no-files-found: warn
          retention-days: 7

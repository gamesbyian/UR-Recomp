name: SMV tooling regression

on:
  workflow_dispatch:

concurrency:
  group: smv-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test historical replay tooling
        run: |
          python3 tests/test_extract_smv_input.py
          python3 tests/test_summarize_wram_trace_checkpoints.py

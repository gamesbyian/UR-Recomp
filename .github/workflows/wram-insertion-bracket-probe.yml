name: WRAM insertion bracket probe

on:
  push:
    branches:
      - chatgpt/pal-subregion-survivor-refinement-2026-09-30

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe bracket operands
        run: python3 tools/probe_wram_insertion_brackets.py
      - uses: actions/upload-artifact@v4
        with:
          name: wram-insertion-bracket-probe
          path: |
            analysis/generated/wram-insertion-bracket-probe.json
            analysis/generated/wram-insertion-bracket-probe.md
          if-no-files-found: error

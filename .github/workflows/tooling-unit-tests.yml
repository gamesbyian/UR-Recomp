name: Project tooling unit tests

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/unit/**"
      - "tests/native/**/*.c"
      - "tests/native/modern_pause_menu_test.cpp"
      - "tests/native/modern_pause_input_test.cpp"
      - "native/product/modern_pause_menu.cpp"
      - "native/product/modern_pause_menu.h"
      - "native/product/modern_pause_input.cpp"
      - "native/product/modern_pause_input.h"
      - "native/product/local_multiplayer_setup.hpp"
      - "native/product/modern_root_menu.hpp"
      - "native/product/modern_text_catalog.hpp"
      - "native/product/modern_text_layout.hpp"
      - "tests/native/local_multiplayer_setup_test.cpp"
      - "tests/native/modern_root_menu_test.cpp"
      - "tests/native/modern_text_catalog_test.cpp"
      - "tests/native/modern_text_layout_test.cpp"
      - "native/title/**/*.c"
      - "native/title/**/*.h"
      - "native/reference/**/*.c"
      - "docs/RECOMP-C-PRACTICES.md"
      - "analysis/ui-state-map.yml"
      - "analysis/frontend-modernization-policy.json"
      - "analysis/evidence-envelope.schema.json"
      - "analysis/modern-product-settings.json"
      - "analysis/agent-context-lanes.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: tooling-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free Python unit tests
        run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v

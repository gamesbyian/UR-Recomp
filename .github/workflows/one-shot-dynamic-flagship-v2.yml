name: One-shot dynamic 90s flagship media edit
on:
  push:
    branches: [media/oct19-dynamic-topology-flagship-v2]
    paths: [.github/workflows/one-shot-dynamic-flagship-v2.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg media-only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          python3 -m py_compile tools/showcase/build_dynamic_flagship_v2.py
      - name: Re-cut real source racing into 90s flagship
        run: |
          python3 tools/showcase/build_dynamic_flagship_v2.py --outdir media/showcase/2026-10-19/dynamic-native-2p/flagship-v2
      - name: Source output integrity and independently decoded representative edit witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess,os
          from pathlib import Path
          from PIL import Image
          root=Path('media/showcase/2026-10-19/dynamic-native-2p/flagship-v2')
          m=json.loads((root/'dynamic-flagship-provenance.json').read_text())
          video=root/'ur-recomp-flagship-dynamic-90s-1080p.mp4'
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(video)==m['new_output_sha256']
          assert m['new_output_frames']==5400 and not m['genuine_race_motion_interpolated']
          assert not m['original_2p_cameras_repositioned']
          assert not m['closed_loop_completion_claimed']
          ordinals=[75,420,720,975,1230,1470,1680,2300,3300,4620,5160]
          expr='+'.join('eq(n\\,'+str(n)+')' for n in ordinals)
          temp=root/'dynamic-v2-review-%02d.png'
          subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y','-i',str(video),'-vf',f'select={expr}', '-fps_mode','vfr',
             '-frames:v',str(len(ordinals)),'-start_number','0',str(temp)],check=True)
          snaps={}
          for i,ordinal in enumerate(ordinals):
              a=root/f'dynamic-v2-review-{i:02d}.png'
              b=root/f'dynamic-v2-source-ordinal-{ordinal:04d}.png'
              assert a.exists()
              os.replace(a,b)
              with Image.open(b) as image:
                  assert image.size==(1920,1080)
                  image.load()
              with Image.open(b) as image:image.verify()
              snaps[b.name]=sha(b)
          m['output_review_frames_sha256']=snaps
          m['review_status']='exact-source-and-11-decoded-frames-validated_pending_visual_screening'
          (root/'dynamic-flagship-provenance.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          print('PASS 90s real gameplay replacement plus 11 output review frames')
          PY
      - name: Retain media independently reviewable outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-dynamic-topology-90s-flagship
          path: media/showcase/2026-10-19/dynamic-native-2p/flagship-v2/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish scoped outputs and self-remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/2026-10-19/dynamic-native-2p/flagship-v2/
          git rm -f .github/workflows/one-shot-dynamic-flagship-v2.yml
          git commit -m "media: publish 90s course-varied real widescreen flagship and decoded witnesses"
          git push origin "HEAD:${GITHUB_REF_NAME}"

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="490" viewBox="35 45 1525 375" role="img" aria-labelledby="title desc">
<title id="title">ユニレーサーズ | Japanese Uniracers wordmark</title>
<desc id="desc">Original, custom-drawn katakana display lettering for the proposed Japanese rendering of Uniracers, Yuni Rēsāzu. Rounded hand-shaped strokes in matching Uniracers yellow and diagonal black shadow, all strokes editable as cubic Beziers.</desc>
<metadata>Artistically designed katakana adaptation, not a historical Japanese box-art title or a traced Japanese official logo. Text: ユニレーサーズ. Glyphs: ユ ニ レ ー サ ー ズ. The English logos remain unchanged.</metadata>

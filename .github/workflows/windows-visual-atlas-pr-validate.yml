name: Windows Visual Atlas (PR validation)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/windows-visual-atlas.yml"
      - ".github/workflows/windows-visual-atlas-intake.yml"
      - ".github/workflows/windows-visual-atlas-site.yml"
      - ".github/workflows/windows-visual-atlas-pr-validate.yml"
      - "analysis/windows-visual-atlas.json"
      - "analysis/ui-capture-manifest.json"
      - "analysis/modern-visual-acceptance-matrix.json"
      - "tools/qa_modern_visual_win32_capture_driver.py"
      - "media/showcase/2026-10-20/graphpaper-final/cards/**"
      - "tools/windows_visual_atlas.py"
      - "tools/windows_visual_atlas_intake.py"
      - "media/windows-visual-atlas/**"
      - "tools/visual_atlas_web/**"
      - "tools/art/model-review/**"
      - "tools/art/collar_transition_review.py"
      - "tools/art/verify_collar_transition_review.py"
      - "tools/art/rounded_fork_clearance_review.py"
      - "tools/art/verify_rounded_fork_clearance_review.py"
      - "tools/art/pedal_axle_clearance_review.py"
      - "tools/art/verify_pedal_axle_clearance_review.py"
      - "tools/art/build_racer_source_pixel_corpus.py"
      - "tools/art/racer_source_pixels.py"
      - "analysis/data/racer-hd-replacement-prototype.json"
      - "media/showcase/art-reconstruction/2026-10-10/stock/**"
      - "media/showcase/art-reconstruction/2026-10-10/inputs-p*.json"
      - "tests/unit/test_model_review_pages.py"
      - "tests/unit/test_windows_visual_atlas.py"
      - "tests/unit/test_windows_visual_atlas_intake.py"
      - "tests/unit/test_windows_visual_atlas_frontend.py"
      - "docs/atlas/**"
      - "design/visual-atlas/mockups/**"
      - "tools/visual_atlas_web/tube-header.svg"
permissions:
  contents: read
concurrency:
  group: ur-windows-atlas-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  atlas-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate real fixture routes, assets and inventory
        run: |
          python3 -m unittest tests.unit.test_windows_visual_atlas tests.unit.test_windows_visual_atlas_intake tests.unit.test_windows_visual_atlas_frontend tests.unit.test_model_review_pages
          python3 tools/windows_visual_atlas.py validate
          python3 tools/windows_visual_atlas.py build --out "$RUNNER_TEMP/atlas-preview"
          test -s "$RUNNER_TEMP/atlas-preview/index.html"
          test -s "$RUNNER_TEMP/atlas-preview/atlas.json"
      - name: Check mobile browser JS syntax
        run: |
          set -euo pipefail
          node --check tools/visual_atlas_web/atlas.js
          node --check tools/art/model-review/index_overlay.mjs
          node --test tools/art/model-review/test_index_overlay.mjs
          python3 - <<'PY'
          import os
          from pathlib import Path
          html = Path("tools/art/model-review/index.html").read_text()
          source = html.rsplit('<script type="module">', 1)[1].split("</script>", 1)[0]
          (Path(os.environ["RUNNER_TEMP"]) / "model-review.mjs").write_text(source)
          PY
          node --check "$RUNNER_TEMP/model-review.mjs"

  mobile-chromium-smoke:
    # Fast, targeted atlas-only real-browser test; no Windows build or ROM.
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ROM-free site and validate CDP smoke source
        run: |
          python3 tools/windows_visual_atlas.py build --out "$RUNNER_TEMP/atlas-site"
          node --check tools/visual_atlas_web/browser-smoke.mjs
          node --check tools/art/model-review/browser-smoke.mjs
          node --check tools/art/model-review/pedal_level_motion.mjs
          node tools/art/model-review/pedal_level_motion.test.mjs
      - name: Exercise 320–1440px layouts, real DOM interactions and screenshot both surfaces
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node tools/visual_atlas_web/browser-smoke.mjs "$RUNNER_TEMP/atlas-site" "$RUNNER_TEMP/browser-evidence"
          node tools/art/model-review/browser-smoke.mjs "$RUNNER_TEMP/atlas-site" "$RUNNER_TEMP/browser-evidence"
      - name: Preserve optical evidence and failures for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-atlas-mobile-browser-smoke
          path: ${{ runner.temp }}/browser-evidence/
          if-no-files-found: warn
          retention-days: 7

  experimental-real-model-export:
    # One source-bound consumer of the SAME unapproved rig on the PR checkout.
    # Do not wake this expensive OpenSCAD route while a PR is still a draft.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated offline OpenSCAD/GLB authoring dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python3 -m venv "$RUNNER_TEMP/rig-venv"
          "$RUNNER_TEMP/rig-venv/bin/python" -m pip install 'numpy==1.26.4' 'trimesh==4.5.3' 'scipy==1.14.1' 'pillow==11.1.0'
      - name: Export all five actual experimental poses and bind immutable receipts
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          export EXPERIMENTAL_RIG_SHA="$source_commit"
          echo "EXPERIMENTAL_RIG_SHA=$source_commit" >> "$GITHUB_ENV"
          for pose in upright pedal wheelie stunt bank; do
            "$RUNNER_TEMP/rig-venv/bin/python" \
              tools/art/export_articulated_unicycle.py \
              tools/art/candidates/unicycle_shared_rig.scad \
              "$RUNNER_TEMP/model-exports/$pose" --rig-pose "$pose" --timeout 120
          done
          python3 tools/windows_visual_atlas.py build --out "$RUNNER_TEMP/real-model-site"
          python3 tools/art/model-review/stage_pages.py \
            --exports "$RUNNER_TEMP/model-exports" \
            --site "$RUNNER_TEMP/real-model-site" \
            --source-commit "$source_commit"
          # Exercise the exact optional manual-publish evidence path on
          # real GLB bytes, at no extra OpenSCAD or Windows-build cost.
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/prepare_model_review_measurement_sidecar.py \
            --model-review-dir "$RUNNER_TEMP/real-model-site/model-review" \
            --camera analysis/data/racer-inverse-side-provisional-1205.json \
            --out "$RUNNER_TEMP/real-measurements.json"
          ln "$RUNNER_TEMP/real-measurements.json" \
            "$RUNNER_TEMP/real-model-site/model-review/model-measurements.json"
          python3 - <<'PY'
          import json,os,pathlib
          site=pathlib.Path(os.environ["RUNNER_TEMP"])/"real-model-site/model-review"
          m=json.loads((site/"manifest.json").read_text())
          assert len(m["poses"])==5 and m["source_commit"]==os.environ["EXPERIMENTAL_RIG_SHA"]
          assert m["likeness_approved"] is False and m["source_sprite_pose_registration"] is False
          evidence=json.loads((site/"model-measurements.json").read_text())
          assert evidence["schema"]=="UR-RACER-MODEL-REVIEW-MEASUREMENT-SIDECAR/1"
          assert evidence["original_frame_observations"]==32
          assert evidence["distinct_original_source_binary_silhouette_count"]==10
          assert evidence["experimental_glb_pose_count"]==5
          assert evidence["source_to_experimental_model_pose_mapping_verified"] is False
          assert evidence["shipping_art_approved"] is False
          print("EXPERIMENTAL_FIVE_POSE_EXPORT_STAGED",m["source_commit"])
          PY
      - name: Export and independently validate owner-directed collar model against real baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collar-review"
          python3 tools/art/collar_transition_review.py \
            tools/art/candidates/unicycle_shared_rig.scad \
            "$RUNNER_TEMP/collar-review/collar.scad"
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/export_articulated_unicycle.py \
            "$RUNNER_TEMP/collar-review/collar.scad" \
            "$RUNNER_TEMP/collar-review/export" --rig-pose upright --timeout 120 \
            > "$RUNNER_TEMP/collar-review/export-result.json"
          python3 - <<'PY'
          import json,os,pathlib,shutil
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          output=root/"collar-review"
          for source,target in ((root/"model-exports/upright",output/"baseline.glb"),
                                (output/"export",output/"collar.glb")):
              ptr=json.loads((source/"articulated_blockout_current.json").read_text())
              last=json.loads((source/"articulated_blockout_last_attempt.json").read_text())
              assert last["status"]=="succeeded" and last["attempt_id"]==ptr["attempt_id"]
              shutil.copyfile(source/ptr["glb_path"],target)
          PY
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/verify_collar_transition_review.py \
            --baseline-glb "$RUNNER_TEMP/collar-review/baseline.glb" \
            --candidate-glb "$RUNNER_TEMP/collar-review/collar.glb" \
            --baseline-scad tools/art/candidates/unicycle_shared_rig.scad \
            --candidate-scad "$RUNNER_TEMP/collar-review/collar.scad" \
            --out "$RUNNER_TEMP/collar-review/integrity-report.json"
      - name: Preserve opt-in owner collar review artifact (never the default Pages model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-owner-saddle-collar-unapproved-review
          path: ${{ runner.temp }}/collar-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Compare source-locked rounded fork and optional outboard pedal/axle studies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rounded-fork-review"
          python3 tools/art/rounded_fork_clearance_review.py \
            tools/art/candidates/unicycle_shared_rig.scad \
            "$RUNNER_TEMP/rounded-fork-review/rounded.scad"
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/export_articulated_unicycle.py \
            "$RUNNER_TEMP/rounded-fork-review/rounded.scad" \
            "$RUNNER_TEMP/rounded-fork-review/export" --rig-pose upright --timeout 120 \
            > "$RUNNER_TEMP/rounded-fork-review/export-result.json"
          python3 - <<'PY'
          import os,json,pathlib,shutil
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          src=root/"rounded-fork-review/export"
          ptr=json.loads((src/"articulated_blockout_current.json").read_text())
          last=json.loads((src/"articulated_blockout_last_attempt.json").read_text())
          assert last["status"]=="succeeded" and ptr["attempt_id"]==last["attempt_id"]
          target=root/"rounded-fork-review/rounded.glb"
          shutil.copyfile(src/ptr["glb_path"],target)
          PY
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/verify_rounded_fork_clearance_review.py \
            --baseline-scad tools/art/candidates/unicycle_shared_rig.scad \
            --rounded-scad "$RUNNER_TEMP/rounded-fork-review/rounded.scad" \
            --straight-glb "$RUNNER_TEMP/collar-review/collar.glb" \
            --rounded-glb "$RUNNER_TEMP/rounded-fork-review/rounded.glb" \
            --out "$RUNNER_TEMP/rounded-fork-review/physical-clearance-report.json"
          # Keep this as one CI/review artifact with the same real-model
          # execution. No secondary rig, new runner or production assets.
          mkdir -p "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle"
          python3 tools/art/pedal_axle_clearance_review.py \
            tools/art/candidates/unicycle_shared_rig.scad \
            "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/candidate.scad"
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/export_articulated_unicycle.py \
            "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/candidate.scad" \
            "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/export" \
            --rig-pose upright --timeout 120 \
            > "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/export-result.json"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ["RUNNER_TEMP"])/"rounded-fork-review/outboard-pedal-axle"
          export = root/"export"
          current=json.loads((export/"articulated_blockout_current.json").read_text())
          last=json.loads((export/"articulated_blockout_last_attempt.json").read_text())
          assert current["attempt_id"] == last["attempt_id"] and last["status"]=="succeeded"
          shutil.copyfile(export/current["glb_path"],root/"candidate.glb")
          PY
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/verify_pedal_axle_clearance_review.py \
            --canonical-source tools/art/candidates/unicycle_shared_rig.scad \
            --candidate-source "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/candidate.scad" \
            --baseline-rounded-glb "$RUNNER_TEMP/rounded-fork-review/rounded.glb" \
            --candidate-glb "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/candidate.glb" \
            --out "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/physical-report.json"
          # Reuse the very same real-geometry job and previously qualified
          # outboard source/export. Owner chose wider assembly, but requires
          # bilateral orange markings. No canonical or 1994 source changes.
          mkdir -p "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread"
          python3 tools/art/mirrored_outboard_tread_review.py \
            tools/art/candidates/unicycle_shared_rig.scad \
            "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread/candidate.scad"
          "$RUNNER_TEMP/rig-venv/bin/python" -m unittest tests.unit.test_mirrored_outboard_glb_review
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/export_articulated_unicycle.py \
            "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread/candidate.scad" \
            "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread/export" \
            --rig-pose upright --timeout 120 \
            > "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread/export-result.json"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"rounded-fork-review/owner-mirrored-tread"
          export=target/"export"
          current=json.loads((export/"articulated_blockout_current.json").read_text())
          last=json.loads((export/"articulated_blockout_last_attempt.json").read_text())
          assert current["attempt_id"]==last["attempt_id"] and last["status"]=="succeeded"
          shutil.copyfile(export/current["glb_path"],target/"candidate.glb")
          PY
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/verify_mirrored_outboard_tread_review.py \
            --canonical-source tools/art/candidates/unicycle_shared_rig.scad \
            --old-source "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/candidate.scad" \
            --mirrored-source "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread/candidate.scad" \
            --old-glb "$RUNNER_TEMP/rounded-fork-review/outboard-pedal-axle/candidate.glb" \
            --mirrored-glb "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread/candidate.glb" \
            --out "$RUNNER_TEMP/rounded-fork-review/owner-mirrored-tread/physical-report.json"
          # Reuse the five real source GLBs already exported above; no extra
          # OpenSCAD exports or new runner. The repaired source patch leaves
          # the global pose formula/pivots alone; verify rigid transport,
          # material identity and positive ideal-torus proof independently.
          "$RUNNER_TEMP/rig-venv/bin/python" -m unittest tests.unit.test_fork_pose_transport
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/verify_fork_pose_transport.py \
            --rounded-upright-glb "$RUNNER_TEMP/rounded-fork-review/rounded.glb" \
            --canonical-pose-exports-root "$RUNNER_TEMP/model-exports" \
            --out "$RUNNER_TEMP/rounded-fork-review/five-pose-transport-report.json"
          # Reuse the five SOURCE-2026 real GLBs above. This distinct receipt
          # proves the viewer's two moving platforms are translated rather
          # than rigidly spun, while recording OpenSCAD rod faceting drift.
          "$RUNNER_TEMP/rig-venv/bin/python" -m unittest tests.unit.test_source_pedal_pose_sweep
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/verify_source_pedal_pose_sweep.py \
            --canonical-source tools/art/candidates/unicycle_shared_rig.scad \
            --source-pose-exports-root "$RUNNER_TEMP/model-exports" \
            --out "$RUNNER_TEMP/rounded-fork-review/source-pedal-five-pose-report.json"
      - name: Preserve one rounded 2026 fork candidate for visual review (not approved or default)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-rounded-fork-crown-unapproved-review
          path: ${{ runner.temp }}/rounded-fork-review/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise actual five-part glTF exports and original sprite rail in Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node tools/art/model-review/pedal_level_motion.test.mjs
          UR_MODEL_SMOKE_REAL=1 node tools/art/model-review/browser-smoke.mjs \
            "$RUNNER_TEMP/real-model-site" "$RUNNER_TEMP/real-model-evidence"
      - name: Summarize exact art provenance without approval
        if: always()
        run: |
          {
            echo "### Five-pose experimental 3D review"
            echo "Same-checkout experimental model source: \`${EXPERIMENTAL_RIG_SHA:-unavailable}\`"
            echo "Artifact is a technical viewer candidate, not original art likeness or release approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain experimental site and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-experimental-model-review-actual-glbs
          path: |
            ${{ runner.temp }}/real-model-site/model-review/
            ${{ runner.temp }}/real-model-evidence/
          if-no-files-found: warn
          retention-days: 14

          cd "$RUNNER_TEMP/baldosa-native-romless"
          sha256sum UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip > UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip.sha256
          test -s UR-Recomp-Baldosa-Windows-x64-ROMLESS.zip.sha256
          echo "PASS: deterministic ROM-free Baldosa Windows candidate created from the same executable that passed native PE, clean-machine import and 1P/2P player-journey QA. Contains no ROM, SRAM or user state. Candidate only, not a completed remaster." >> "$GITHUB_STEP_SUMMARY"


name: QA-08 source-authentic native CGRAM port writer comparison
# One bounded archive-only source adjudication (no new emulator execution).
# Retire PR trigger after classified green/fail-closed historical result.
# Source-only experiment completed green: run 38832857831.
# Manual reproduction only; do not run historical emulator research on PRs.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qa08-native-port-original-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-native-ppu-port:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve only three exact original/native immutable PPU archives
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa08-port"
          for pair in \
            12013432991:original \
            12014896975:windows-before \
            12017392389:windows-writer; do
            IFS=: read -r id name <<< "$pair"
            curl --retry 3 -fLSs \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/$id/zip" \
              -o "$RUNNER_TEMP/qa08-port/$name.zip"
          done
          echo "d725ee45db1b66d098e79499263dd089dba80a26de517c30db674f91e20f80a8  $RUNNER_TEMP/qa08-port/original.zip" | sha256sum -c -
          echo "f01ab5a4888c227f306a0b9cd89e67710a4b41cad4c22867072280a17811fa82  $RUNNER_TEMP/qa08-port/windows-before.zip" | sha256sum -c -
          echo "4b55a33917a5941e87d507ceb8af01391c01fc4574a2543fab3f0b3cf35402f0  $RUNNER_TEMP/qa08-port/windows-writer.zip" | sha256sum -c -
      - name: Require full 263 unchanged raster frames and compare 48 real native CPU port writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.unit.test_qa08_adjudicate_native_cgram_port_writer
          python3 tools/qa08_adjudicate_native_cgram_port_writer.py \
            --original-ppu-archive "$RUNNER_TEMP/qa08-port/original.zip" \
            --windows-before-archive "$RUNNER_TEMP/qa08-port/windows-before.zip" \
            --windows-writer-archive "$RUNNER_TEMP/qa08-port/windows-writer.zip" \
            --out "$RUNNER_TEMP/qa08-port/qa08-original-native-CGRAM-CPU-port-writer.json"
          python3 - "$RUNNER_TEMP/qa08-port/qa08-original-native-CGRAM-CPU-port-writer.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["Windows_263_real_256x224_P7_frames_byte_identical"] is True
          assert x["native_bounded_CPU_port_records"]==48
          assert x["directly_observed_original_CPU_writer_frame_difference"]==2
          assert x["graphics_fix_admitted"] is False
          print("Original/native frame + raw PPU data-port witness accepted, raster/game timing not patched")
          PY
          echo "Source-only writer chronology; CPU/guest phase attribution and graphics release remain HOLD." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact-register source-qualified CPU port chronology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa08-source-authentic-original-native-CGRAM-port-writer-chronology
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/qa08-port/qa08-original-native-CGRAM-CPU-port-writer.json

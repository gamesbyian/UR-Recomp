name: Europe USA snes2asm homolog probe

on:
  push:
    branches:
      - chatgpt/pal-subregion-survivor-refinement-2026-09-30

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare selected Europe USA homologs
        run: python3 tools/compare_europe_usa_snes2asm_homologs.py
      - uses: actions/upload-artifact@v4
        with:
          name: europe-usa-snes2asm-homologs
          path: |
            analysis/generated/europe-usa-snes2asm-homologs.json
            analysis/generated/europe-usa-snes2asm-homologs.md
          if-no-files-found: error

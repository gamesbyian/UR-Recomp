            "$RUNNER_TEMP/racer-wide-original-frames" "$RUNNER_TEMP/racer-wide-hd-frames"

          run_wide() {
            local mode="$1"
            local log="$RUNNER_TEMP/racer-wide-$mode.log"
            local shot="$RUNNER_TEMP/racer-wide-$mode-1220.ppm"
            local dumps="$RUNNER_TEMP/racer-wide-$mode-dumps"

          baseline_variable = {i for i, _, _ in ab}
          hd_on_stable = [
              (i, blobs[1][i], blobs[2][i])
              for i in range(len(blobs[0]))
              if i not in baseline_variable and blobs[1][i] != blobs[2][i]
          ]
          if hd_on_stable:
              preview = ",".join(

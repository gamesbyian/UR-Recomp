name: One-shot PAL prototype snes2asm evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/compare_pal_prototype_snes2asm.py"
      - "tests/unit/test_compare_pal_prototype_snes2asm.py"
      - ".github/workflows/pal-prototype-snes2asm-evidence.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Run normalized PAL/prototype pass
        run: python3 tools/compare_pal_prototype_snes2asm.py
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_compare_pal_prototype_snes2asm -v
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/pal-retail-vs-prototype-snes2asm.json analysis/generated/pal-retail-vs-prototype-snes2asm.md
          git diff --cached --quiet || git commit -m "analysis: record PAL prototype snes2asm delta pass"
          git push origin HEAD:${{ github.head_ref }}

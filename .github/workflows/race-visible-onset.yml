name: One-shot state-aligned race-visible onset

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/input/race-visible-onset.script"
      - ".github/workflows/race-visible-onset.yml"

jobs:
  onset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Build reference stack
        run: |
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          python3 tools/bootstrap_toolchain.py --offline --tool beetle-bsnes-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2
      - name: Run state-aligned route through both cores
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/snesref-build/snesref"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/race-visible-onset.script"
          run_core() {
            local label="$1"
            local core="$2"
            local allow_abort="${3:-0}"
            local dumps="$RUNNER_TEMP/${label}-dumps"
            mkdir -p "$dumps"
            set +e
            SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
            SNESREF_SCRIPT="$SCRIPT" SNESREF_DUMP_DIR="$dumps" \
              "$EXE" "$core" "$ROM" >"$RUNNER_TEMP/${label}.log" 2>&1
            local status=$?
            set -e
            cat "$RUNNER_TEMP/${label}.log"
            test -s "$dumps/race-start-active-064.wram.bin"
            if [ "$status" -eq 0 ]; then return 0; fi
            if [ "$allow_abort" -eq 1 ] && [ "$status" -eq 134 ]; then
              echo "::warning::${label} completed fixture then aborted during teardown"
              return 0
            fi
            return "$status"
          }
          run_core snes9x "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          run_core beetle "$GITHUB_WORKSPACE/.tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so" 1
      - name: Compare state-aligned framebuffers
        run: |
          python3 tools/compare_framebuffers.py             "$RUNNER_TEMP/snes9x-dumps"             "$RUNNER_TEMP/beetle-dumps"             --json-out race-visible-onset-cross-core.json
          cat race-visible-onset-cross-core.json
      - name: Reduce Snes9x onset presentation
        run: |
          python3 tools/summarize_race_start_transition.py             "$RUNNER_TEMP/snes9x-dumps"             --json-out race-visible-onset-snes9x.json
          cat race-visible-onset-snes9x.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-visible-onset
          path: |
            race-visible-onset-cross-core.json
            race-visible-onset-snes9x.json
            ${{ runner.temp }}/snes9x.log
            ${{ runner.temp }}/beetle.log
            ${{ runner.temp }}/snes9x-dumps/
            ${{ runner.temp }}/beetle-dumps/
          retention-days: 7

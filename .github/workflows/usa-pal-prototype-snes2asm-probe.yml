name: USA PAL prototype snes2asm homolog probe

on:
  push:
    branches:
      - chatgpt/pal-subregion-survivor-refinement-2026-09-30

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare USA and PAL prototype homologs
        run: python3 tools/compare_usa_palprototype_snes2asm_homologs.py
      - uses: actions/upload-artifact@v4
        with:
          name: usa-pal-prototype-snes2asm-homologs
          path: |
            analysis/generated/usa-pal-prototype-snes2asm-homologs.json
            analysis/generated/usa-pal-prototype-snes2asm-homologs.md
          if-no-files-found: error

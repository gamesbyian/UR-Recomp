              r"logical=(\d+)x224 backing=48 visible=43$", log, re.M)
          present = re.findall(
              r"^UR_BALDOSA_WS342_PRESENT frame=(\d+) width=342 height=224 "
              r"pitch=(\d+) calibrated=1 saved=([01])", log, re.M)
          names = sorted(captures.glob("ur-baldosa-ws342-*.pam"))
          headers = (b"P7\nWIDTH 342\nHEIGHT 224\nDEPTH 4\nMAXVAL 255\n"
                     b"TUPLTYPE RGB_ALPHA\nENDHDR\n")
          seen = []
          for path in names:
              assert re.fullmatch(r"ur-baldosa-ws342-\d{6}\.pam", path.name), path
              raw = path.read_bytes()
              assert raw.startswith(headers) and len(raw) == len(headers) + 342 * 224 * 4, path
              margins = edge_differences(raw[len(headers):], width=342, extra=43)
              seen.append({
                  "name": path.name,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "four_margin_differences": margins,
                  "four_margins_nontrivial": all(v > 32 for v in margins.values()),
              })
          assert len(guest_crcs) > 0, "no original 1P guest frames"
          assert any(mode == 1 and active != 1 and frontend == 0x3C
                     for _, mode, active, frontend in modes), (
                         "no observed genuine pre-race 1P guest mode", modes)

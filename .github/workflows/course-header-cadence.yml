name: Course header cadence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-header-cadence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Rebuild course header and trailer reports
        run: |
          python3 tools/analyze_course_header_cadence.py
          python3 tools/analyze_course_trailers.py
          cat analysis/generated/course-header-cadence.md
          cat analysis/generated/course-trailer-structure.md

      - name: Persist generated reports
        shell: bash
        run: |
          set -euo pipefail
          git add             analysis/generated/course-header-cadence.md             analysis/generated/course-trailer-structure.json             analysis/generated/course-trailer-structure.md
          if git diff --cached --quiet; then
            echo "course header/trailer reports already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh course header and trailer analysis"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

name: Progression SRAM save-load acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/data/progression-model.json"
      - "tools/analyze_progression_sram_acceptance.py"
      - "tests/unit/test_analyze_progression_sram_acceptance.py"
      - "tests/input/progression-sram-acceptance.script"
      - "reference/imported/tas-bots/dessyreqt-4250-submission.smv"
      - "tools/extract_smv_input.py"
      - ".github/workflows/progression-sram-acceptance.yml"

concurrency:
  group: progression-sram-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev

      - name: Verify canonical ROM and unit tests
        run: |
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 -m unittest tests.unit.test_analyze_progression_sram_acceptance

      - name: Extract historical bot input and anchored SRAM
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/extract_smv_input.py \
            reference/imported/tas-bots/dessyreqt-4250-submission.smv \
            --input-out "$RUNNER_TEMP/full.input" \
            --sram-out "$RUNNER_TEMP/start.srm" \
            --sram-size 8192 \
            --json-out "$RUNNER_TEMP/smv.json" >/dev/null
          python3 - "$RUNNER_TEMP/full.input" "$RUNNER_TEMP/first-40000.input" <<'PY'
          from pathlib import Path
          import sys
          from tools.controller_input import load_controller_runs
          src, out = map(Path, sys.argv[1:])
          horizon = 40000
          lines = ["# Exact historical 2014 bot input through the first bounded progression window."]
          for run in load_controller_runs(src):
              if run.start >= horizon:
                  break
              duration = min(run.duration, horizon - run.start)
              if duration <= 0:
                  continue
              row = f"{run.start}:{duration}:{run.p1_mask:03x}"
              if run.p2_mask:
                  row += f":{run.p2_mask:03x}"
              lines.append(row)
          out.write_text("\n".join(lines) + "\n")
          PY
          test "$(stat -c%s "$RUNNER_TEMP/start.srm")" -eq 8192

      - name: Build reference harness and Snes9x core
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          test -x .tools/src/snesrecomp/build-snesref/snesref

      - name: Replay gameplay and select first authentic medal mutation
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          DUMPS="$RUNNER_TEMP/run-dumps"
          mkdir -p "$DUMPS"
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$RUNNER_TEMP/start.srm" \
          SNESREF_INPUT_FILE="$RUNNER_TEMP/first-40000.input" \
          SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/progression-sram-acceptance.script" \
          SNESREF_DUMP_DIR="$DUMPS" \
            "$EXE" "$CORE" "$ROM" | tee "$RUNNER_TEMP/run.log"

          BEFORE="$(find "$DUMPS" -maxdepth 1 -type f -name 'progression-before*sram*' -print -quit)"
          test -n "$BEFORE"
          cp "$BEFORE" "$RUNNER_TEMP/before.srm"

          python3 - "$RUNNER_TEMP/before.srm" "$DUMPS" "$RUNNER_TEMP/after.srm" "$RUNNER_TEMP/selected.txt" analysis/data/progression-model.json <<'PY'
          from pathlib import Path
          import json, sys
          before_path, dumps_path, after_path, selected_path, model_path = map(Path, sys.argv[1:])
          model = json.loads(model_path.read_text())
          base = int(model["medal_matrix"]["base"].split(":")[1], 16)
          end = base + model["medal_matrix"]["rows"] * model["medal_matrix"]["row_stride"]
          before = before_path.read_bytes()
          for p in sorted(dumps_path.glob("progression-scan-*sram*")):
              data = p.read_bytes()
              if data[base:end] != before[base:end]:
                  after_path.write_bytes(data)
                  selected_path.write_text(p.name + "\n")
                  print("selected first medal mutation:", p.name)
                  break
          else:
              raise SystemExit("no medal-matrix mutation found by frame 40000")
          PY
          test "$(stat -c%s "$RUNNER_TEMP/after.srm")" -eq 8192

      - name: Reload emitted SRAM in fresh reference process
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          DUMPS="$RUNNER_TEMP/reload-dumps"
          mkdir -p "$DUMPS"
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$RUNNER_TEMP/after.srm" \
          SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/sram-roundtrip.script" \
          SNESREF_DUMP_DIR="$DUMPS" \
            "$EXE" "$CORE" "$ROM" | tee "$RUNNER_TEMP/reload.log"
          RELOAD="$(find "$DUMPS" -maxdepth 1 -type f -name 'sram-roundtrip*sram*' -print -quit)"
          test -n "$RELOAD"
          cp "$RELOAD" "$RUNNER_TEMP/reload.srm"

      - name: Assert model-predicted progression survives reload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analyze_progression_sram_acceptance.py \
            --before "$RUNNER_TEMP/before.srm" \
            --after "$RUNNER_TEMP/after.srm" \
            --reload "$RUNNER_TEMP/reload.srm" \
            --model analysis/data/progression-model.json \
            --require-medal \
            --out analysis/generated/progression-sram-acceptance.json

      - name: Persist compact acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          git add analysis/generated/progression-sram-acceptance.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record gameplay progression acceptance evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload transient acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progression-sram-acceptance
          path: |
            ${{ runner.temp }}/smv.json
            ${{ runner.temp }}/before.srm
            ${{ runner.temp }}/after.srm
            ${{ runner.temp }}/selected.txt
            ${{ runner.temp }}/reload.srm
            ${{ runner.temp }}/run.log
            ${{ runner.temp }}/reload.log
            analysis/generated/progression-sram-acceptance.json
          retention-days: 7

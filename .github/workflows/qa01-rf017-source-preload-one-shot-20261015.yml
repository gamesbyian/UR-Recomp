name: QA-01 independent RF-017 corrected original/native Zoo source experiment

# Temporary one-shot research PR; REMOVE from any mergeable source.
on:
  pull_request:
    paths:
      - .github/workflows/qa01-rf017-source-preload-one-shot-20261015.yml
      - tools/probe_original_event_complete.py
      - tests/unit/test_probe_original_event_complete.py

permissions:
  contents: read

concurrency:
  group: qa01-rf017-correct-source-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corrected-source-zoo:
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      source_followthrough: true
      baldosa_refresh_beam_rate: true
      baldosa_io_clock_order: true
      zoo_terminal_phase: true
      qa01_apu_phase: false

name: UR title menu capture ONE-SHOT (never merge workflow)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ur-native-title-menu-once.yml"

permissions:
  contents: write

concurrency:
  group: ur-media-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  footage:
    if: github.event.pull_request.head.ref == 'media/native-title-menu-footage-20261010'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      BALDOSA_PIN: 10b864b9d14a7b7416dd909eb7b054c88faef101
      BALDOSA_FRAMEWORK_PIN: 075fbe4c8e0d97b0013be541795c39cb644a9709
      USA_ROM_SHA256: 859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478
      GH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SDL_AUDIODRIVER: dummy
      PIXELS: "0"
      KEEP_WRAM: "0"
      TMO: "240"
      UR_BALDOSA_HD: "1"
      UR_BALDOSA_HD_DENSITY: "1"
      UR_BALDOSA_WS342: "0"
      UR_BALDOSA_WS342_LIVE: "0"
      UR_RACER_HD: "0"
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Verify the ROM and existing pinned Baldosa/framework
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GH_HEAD_SHA"
          printf '%s  %s\n' "$USA_ROM_SHA256" "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" | sha256sum -c -
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc

      - name: Check out pinned complete Baldosa native guest and framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Install same SDL2 native host dependencies as existing workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = "$BALDOSA_PIN"
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = "$BALDOSA_FRAMEWORK_PIN"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ninja-build pkg-config libsdl2-dev libgl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            xvfb x11-utils ffmpeg
          ffmpeg -hide_banner -encoders | grep -w ffv1

      - name: Stage existing read-only guest and Original-wide presentation plus recorder
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_single_presentation_scale_patch.py \
            --root "$GITHUB_WORKSPACE" --framework baldosa/snesrecomp
          python3 tools/baldosa_hd_host_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_ws24_framework_split_patch.py \
            --root "$GITHUB_WORKSPACE" --framework baldosa/snesrecomp
          python3 tools/baldosa_ws24_host_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/showcase/stage_native_menu_capture.py --framework baldosa/snesrecomp
          python3 - <<'PY'
          from pathlib import Path
          route = Path("baldosa/tests/routes/race_1p.txt").read_text()
          assert route.count("turbo on\\n") == 1
          candidate = route.replace("turbo on\\n", "turbo off\\n", 1)
          assert candidate.count("press start 2") >= 4
          Path("/tmp/media-native-title-1p.txt").write_text(candidate)
          PY
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          test -x baldosa/build/UniracersSNESRecomp
          if [ ! -f baldosa/build/config.ini ]; then
            printf '%s\n' '[Sound]' 'EnableAudio = 0' > baldosa/build/config.ini
          fi
          sha256sum baldosa/build/UniracersSNESRecomp > "$RUNNER_TEMP/native-binary-sha256.txt"

      - name: Run the identical extended route with capture off then on
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 -ac > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          export DISPLAY=:99
          for _ in 1 2 3 4 5; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null
          export SNESRECOMP_ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          cat > "$RUNNER_TEMP/media-host-wrapper" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export SDL_VIDEODRIVER=x11
          args=("$@")
          config=""
          for ((i=0; i+1<${#args[@]}; i++)); do
            if [ "${args[i]}" = "--config" ]; then
              config="${args[i+1]}"
              break
            fi
          done
          test -n "$config"
          python3 "$GITHUB_WORKSPACE/tools/baldosa_hd_enable_renderer.py" --config "$config"
          cat >> "$config" <<'CFG'
          [Graphics]
          WindowSize = 960x540
          OutputMethod = SDL-Software
          LinearFiltering = 0
          Fullscreen = 0
          CFG
          exec "$BALDOSA_REAL_BIN" "$@"
          SH
          chmod +x "$RUNNER_TEMP/media-host-wrapper"
          export BIN="$RUNNER_TEMP/media-host-wrapper"
          bash baldosa/tools/run_route.sh "/tmp/media-native-title-1p.txt" \
            "$RUNNER_TEMP/native-media-control"
          UR_NATIVE_VIDEO_START=30 UR_NATIVE_VIDEO_COUNT=900 \
            UR_NATIVE_VIDEO_OUTPUT=ur-native-title-menu-lossless.mkv \
            bash baldosa/tools/run_route.sh "/tmp/media-native-title-1p.txt" \
            "$RUNNER_TEMP/native-media-recorded"
          cmp "$RUNNER_TEMP/native-media-control/fd/crc.txt" \
              "$RUNNER_TEMP/native-media-recorded/fd/crc.txt"

      - name: Reject discontinuous, incomplete, or guest-divergent recording
        shell: bash
        run: |
          set -euo pipefail
          REC="$RUNNER_TEMP/native-media-recorded"
          python3 tools/showcase/validate_continuous_native_capture.py \
            --master "$REC/ur-native-title-menu-lossless.mkv" \
            --frames "$REC/ur-native-title-menu-lossless.mkv.frames.tsv" \
            --log "$REC/log.txt" \
            --control-crc "$RUNNER_TEMP/native-media-control/fd/crc.txt" \
            --recorded-crc "$REC/fd/crc.txt" \
            --count 900 --min-start 1 --logical-width 256 --rom-sha256 "$USA_ROM_SHA256" \
            --git-sha "$GH_HEAD_SHA" --route media-native-title-1p \
            --out "$REC/native-title-menu-provenance.json"
          grep -q 'UR_NATIVE_VIDEO_END actual=900 expected=900' "$REC/log.txt"
          mkdir -p "$RUNNER_TEMP/media-publish"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$REC/ur-native-title-menu-lossless.mkv" \
            -vf scale=1920:1080:flags=neighbor \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p \
            -movflags +faststart "$RUNNER_TEMP/media-publish/ur-native-title-menu-900f.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$REC/ur-native-title-menu-lossless.mkv" \
            -vf "select=eq(n\\,300)" -frames:v 1 \
            "$RUNNER_TEMP/media-publish/ur-native-title-menu-poster.png"
          cp "$REC/native-title-menu-provenance.json" \
            "$RUNNER_TEMP/media-publish/native-title-menu-provenance.json"
          python3 - "$RUNNER_TEMP/media-publish" "$REC" "$BALDOSA_PIN" "$BALDOSA_FRAMEWORK_PIN" "$GITHUB_RUN_ID" "$RUNNER_TEMP" <<'PY'
          import hashlib, json, pathlib, sys
          dest, rec = (pathlib.Path(v) for v in sys.argv[1:3])
          data = json.loads((dest / "native-title-menu-provenance.json").read_text())
          data["native_game_pin"] = sys.argv[3]
          data["native_framework_pin"] = sys.argv[4]
          data["ci_execution"] = "https://github.com/gamesbyian/UR-Recomp/actions/runs/" + sys.argv[5]
          data["native_executable_sha256"] = (pathlib.Path(sys.argv[6]) / "native-binary-sha256.txt").read_text().split()[0]
          data["input_route_sha256"] = hashlib.sha256(
              (pathlib.Path(sys.argv[6]) / "media-native-title-1p.txt").read_bytes()).hexdigest()
          data["presentation_mode"] = "1P original stock title/menu navigation, 256x224 fixed source in 16:9 host window"
          data["delivery_output"] = {"width": 1920, "height": 1080,
                                      "source_drawable": [960, 540],
                                      "upscale": "nearest-neighbour 2x"}
          for filename in ("ur-native-title-menu-900f.mp4", "ur-native-title-menu-poster.png"):
              data.setdefault("published_sha256", {})[filename] = hashlib.sha256(
                  (dest / filename).read_bytes()).hexdigest()
          (dest / "native-title-menu-provenance.json").write_text(
              json.dumps(data, sort_keys=True, indent=2) + "\n")
          PY
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=codec_name,width,height,nb_read_frames \
            -of json "$RUNNER_TEMP/media-publish/ur-native-title-menu-900f.mp4"

      - name: Preserve verified source and diagnostics as a bounded artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-native-title-menu-one-shot-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-media-recorded/ur-native-title-menu-lossless.mkv
            ${{ runner.temp }}/native-media-recorded/ur-native-title-menu-lossless.mkv.frames.tsv
            ${{ runner.temp }}/native-media-recorded/native-title-menu-provenance.json
            ${{ runner.temp }}/native-media-recorded/log.txt
            ${{ runner.temp }}/native-media-control/log.txt
            ${{ runner.temp }}/native-binary-sha256.txt
            ${{ runner.temp }}/media-native-title-1p.txt
            ${{ runner.temp }}/media-publish/

      - name: Commit ONLY validated clean gameplay, poster and manifest to draft PR branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          target="media/showcase/2026-10-10/recruitment/native-menu"
          mkdir -p "$target"
          cp "$RUNNER_TEMP/media-publish/"* "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git diff --cached --check
          git commit -m "media: retain verified consecutive native two-player 600-frame recording"
          git push origin HEAD:refs/heads/media/native-title-menu-footage-20261010

name: Project tooling unit tests

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/unit/**"
      - "tests/native/**/*.c"
      # QA-10 Original 7:6/PAR and UHD viewport source+fixture must run
      # the actual compiled C++ policy regression, not just native smoke.
      - "native/product/widescreen_output_composition.cpp"
      - "native/product/widescreen_output_composition.hpp"
      - "tests/native/widescreen_output_composition_test.cpp"
      - "tests/native/modern_pause_menu_test.cpp"
      - "tests/native/modern_pause_input_test.cpp"
      # Options rollback refusal is an executable native C++ regression.
      - "native/product/baldosa_native_options.hpp"
      - "tests/native/baldosa_native_options_test.cpp"
      - "native/product/modern_pause_menu.cpp"
      - "native/product/modern_pause_menu.h"
      - "native/product/modern_pause_input.cpp"
      - "native/product/modern_pause_input.h"
      # Completed-run codec/archive paths are compiled by the native
      # unit runner; changes must invalidate the same ROM-free regression.
      - "native/product/completed_run_record.*"
      - "native/product/completed_run_store.*"
      - "tests/native/completed_run_store_test.cpp"
      # Multiplayer pair publication shares the UTF-8 run store and codec.
      - "native/product/multiplayer_match_record.*"
      - "tests/native/multiplayer_match_record_test.cpp"
      - "native/product/multiplayer_match_catalog.*"
      - "tests/native/multiplayer_match_catalog_test.cpp"
      - "native/product/baldosa_native_multiplayer_records_summary.*"
      - "tests/native/baldosa_native_multiplayer_records_summary_test.cpp"
      - "native/product/baldosa_native_records_summary.*"
      - "tests/native/baldosa_native_records_summary_test.cpp"
      - "native/product/local_tournament_utf8_path.hpp"
      - "native/product/local_tournament_fixture_launch_store.cpp"
      - "native/product/local_tournament_fixture_launch_store.hpp"
      - "tests/native/local_tournament_fixture_launch_store_test.cpp"
      # The native atomic writer's no-replace race is a compiled C++ unit.
      - "native/product/local_tournament_atomic_replace.hpp"
      - "tests/native/local_tournament_atomic_replace_test.cpp"
      - "native/product/completed_run_ghost_target.hpp"
      - "native/product/display_treatment_policy.hpp"
      - "native/product/modern_controller_prompt.hpp"
      - "native/product/reduced_flashing_frame_blend.hpp"
      - "native/product/run_artifact_date.hpp"
      - "native/product/run_artifact_date.cpp"
      - "tests/native/run_artifact_date_test.cpp"
      - "native/product/reduced_flashing_frame_blend.cpp"
      - "tests/native/reduced_flashing_frame_blend_test.cpp"
      - "tests/native/modern_controller_prompt_test.cpp"
      - "tests/native/display_treatment_policy_test.cpp"
      - "tests/native/completed_run_ghost_target_test.cpp"
      - "native/product/clean_stock_sram.*"
      - "native/product/host_profile_state.*"
      - "native/product/host_profile_store.*"
      - "native/title/uniracers_tour_resume.*"
      - "tests/native/malformed_sram_containment_test.cpp"
      - "native/product/local_multiplayer_setup.hpp"
      - "native/product/modern_host_input_release_latch.hpp"
      - "native/product/modern_root_menu.hpp"
      # Shared Modern root visuals are executable C++ painter contracts;
      # source or test edits must run the actual ROM-free native test suite.
      - "native/product/modern_root_overlay_presenter.hpp"
      - "tests/native/modern_root_overlay_presenter_test.cpp"
      # Both source-owned pause views must execute the compiled C++ painter
      # regression even when no Python harness file changes.
      - "native/product/modern_pause_overlay_presenter.hpp"
      - "tests/native/modern_pause_overlay_presenter_test.cpp"
      # Destination modal and real paused-Options source geometry are also
      # executable C++ painter contracts, not only host-header metadata.
      - "native/product/modern_native_destination_presenter.hpp"
      - "tests/native/modern_native_destination_presenter_test.cpp"
      - "tests/native/modern_native_destination_layering_test.cpp"
      # Original-derived menu primitive and source atlas headers own
      # executable C++ invariants. They must invalidate this same suite even
      # if no Python shim or presenter was changed in the PR.
      # Original measurements, palette tokens and native output use the same tests.
      - "native/product/modern_stock_menu_palette.hpp"
      - "tests/unit/test_modern_menu_visual_grammar_cpp.py"
      - "tests/unit/test_modern_menu_original_source_tokens.py"
      - "analysis/generated/menu-visual-language.json"
      - "native/product/modern_menu_visual_grammar.hpp"
      - "native/product/modern_ui_access.hpp"
      - "native/product/modern_reduced_motion_preference.hpp"
      - "tests/native/modern_reduced_motion_preference_test.cpp"
      - "tests/unit/test_modern_reduced_motion_preference_cpp.py"
      - "tests/native/modern_root_layout_dump.cpp"
      - "tests/unit/test_modern_root_legibility_audit.py"
      - "tools/qa_modern_visual_diagnostics.py"
      - "tools/qa_modern_visual_case_checks.py"
      - "tests/unit/test_qa_modern_visual_case_checks.py"
      - "analysis/modern-visual-acceptance-matrix.json"
      - "tests/native/modern_ui_access_test.cpp"
      - "tests/unit/test_modern_ui_access_cpp.py"
      - "tests/native/modern_ui_access_parity_dump.cpp"
      - "tests/unit/test_modern_ui_access_python_parity.py"
      - "tests/native/modern_menu_visual_grammar_test.cpp"
      - "native/product/modern_menu_source_atlas.hpp"
      - "tests/native/modern_menu_source_atlas_test.cpp"
      - "native/product/modern_text_catalog.hpp"
      - "native/product/modern_text_layout.hpp"
      - "tests/native/local_multiplayer_setup_test.cpp"
      - "tests/native/modern_host_input_release_latch_test.cpp"
      - "tests/native/modern_root_menu_test.cpp"
      - "tests/native/modern_text_catalog_test.cpp"
      - "tests/native/modern_text_layout_test.cpp"
      - "native/title/**/*.c"
      - "native/title/**/*.h"
      - "native/reference/**/*.c"
      - "docs/RECOMP-C-PRACTICES.md"
      - "analysis/ui-state-map.yml"
      - "analysis/frontend-modernization-policy.json"
      - "analysis/evidence-envelope.schema.json"
      # The release ledger is executable QA configuration, unlike planning docs.
      # Its source-contract validator must run before any ledger PR is merged.
      - "docs/RELEASE-QUALITY-LEDGER.json"
      - "analysis/modern-product-settings.json"
      - "analysis/agent-context-lanes.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tooling-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Preserve the existing required 'unit' check; use a focused suite only
      # for a fully enumerated, exact allowlist of non-product operations files.
      # PR API/auth/pagination errors, mixed changes and dispatch all run FULL.
      - name: Select unit test scope from the exact GitHub PR file census
        id: unit-scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          mode="$(python3 tools/ci_select_unit_suite.py)"
          test "$mode" = ops || test "$mode" = full
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Unit suite mode: $mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Fast-fail Python and workflow syntax
        run: |
          python3 -m compileall -q tests/unit tools
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| YAML.parse_file(path) }'
      - name: Restore compile cache
        if: steps.unit-scope.outputs.mode != 'ops'
        id: cxx-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cxx-cache
          key: ur-unit-cxx-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ur-unit-cxx-${{ runner.os }}-
      - name: Enable content-addressed compile cache for unit-test fixtures
        if: steps.unit-scope.outputs.mode != 'ops'
        shell: bash
        run: |
          # Keys hash the preprocessed translation unit and every compile flag,
          # so a stale or partial cache can only miss, never return wrong code.
          shim="$RUNNER_TEMP/cxx-shim"
          mkdir -p "$shim" "$RUNNER_TEMP/cxx-cache"
          for name in g++ gcc c++ cc clang clang++; do
            ln -sf "$PWD/tools/ci_compile_cache.py" "$shim/$name"
          done
          echo "$shim" >> "$GITHUB_PATH"
          echo "UR_COMPILE_CACHE_DIR=$RUNNER_TEMP/cxx-cache" >> "$GITHUB_ENV"

      - name: Execute complete operations regression on exactly scoped PRs
        if: steps.unit-scope.outputs.mode == 'ops'
        shell: bash
        run: |
          set -uo pipefail
          python3 -m unittest -v \
            tests.unit.test_agent_control \
            tests.unit.test_ops_live_status \
            tests.unit.test_ci_cancelled_job_sample \
            tests.unit.test_validate_history_custody \
            tests.unit.test_backup_main_history \
            tests.unit.test_report_ci_runtime \
            tests.unit.test_ci_select_unit_suite \
            tests.unit.test_ci_trigger_policy \
            tests.unit.test_ci_playtest_request_guard \
            tests.unit.test_verify_baldosa_playtest_release \
            >"$RUNNER_TEMP/unit-shard0.log" 2>&1
          rc=$?
          printf 'shard0=%s\n' "$rc" > "$RUNNER_TEMP/unit-shard-exits.txt"
          grep -E '^(Ran [0-9]+ tests?|OK|FAILED|FAIL:|ERROR:)' "$RUNNER_TEMP/unit-shard0.log" || true
          exit "$rc"

      - name: Run full dependency-free Python unit tests in timing-balanced shards
        if: steps.unit-scope.outputs.mode != 'ops'
        shell: bash
        run: |
          set -euo pipefail
          # One shard per vCPU (max 4). tools/partition_unit_tests.py assigns
          # every discovered module to exactly one shard, balanced by recorded
          # runtime (unknown modules get a default weight, so coverage never
          # depends on the timing file being current).
          shards=$(nproc); (( shards > 4 )) && shards=4; (( shards < 2 )) && shards=2
          # Persist intended population before starting any child process.
          printf '%s\n' "$shards" > "$RUNNER_TEMP/unit-shard-count.txt"
          pids=()
          for ((i = 0; i < shards; i++)); do
            mapfile -t mods < <(python3 tools/partition_unit_tests.py --shards "$shards" --index "$i")
            python3 tools/run_unit_shard.py --out "$RUNNER_TEMP/unit-module-timings-shard$i.json" "${mods[@]}" >"$RUNNER_TEMP/unit-shard$i.log" 2>&1 &
            pids+=($!)
          done

          set +e
          : > "$RUNNER_TEMP/unit-shard-exits.txt"
          rc=0
          for ((i = 0; i < shards; i++)); do
            wait "${pids[$i]}"; r=$?
            echo "shard$i=$r" >> "$RUNNER_TEMP/unit-shard-exits.txt"
            (( r != 0 )) && rc=1
          done
          set -e

          # Persist per-shard results before asserting; the reporting step
          # publishes the concise diagnosis even on red.
          echo "Tooling unit shards=$shards"; cat "$RUNNER_TEMP/unit-shard-exits.txt"
          # Print compressed per-module wall times (no test output) for
          # offline rebalance from the immutable source-bound Actions job log.
          # Retain every failing module's original full stderr diagnostics.
          grep -E '^(Ran [0-9]+ tests?|OK|FAILED|FAIL:|ERROR:|UR_UNIT_TIMINGS_ZLIB64=)' "$RUNNER_TEMP"/unit-shard*.log || true
          test "$rc" -eq 0

      - name: Compute reviewable timing weights from all successful measured shards
        if: success() && steps.unit-scope.outputs.mode != 'ops'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rebalance_unit_test_timings.py \
            --source "$RUNNER_TEMP" \
            --source-sha "$GITHUB_SHA" \
            --shards "$(cat "$RUNNER_TEMP/unit-shard-count.txt")" \
            --out "$RUNNER_TEMP/unit_test_timings_candidate.json"

      - name: Publish bounded unit result and job summary
        if: always()
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/summarize_unittest_ci.py \
            --root "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/ci-tooling-unit-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload compact unit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-tooling-unit-result
          path: |
            ${{ runner.temp }}/ci-tooling-unit-result.json
            ${{ runner.temp }}/unit-module-timings-shard*.json
            ${{ runner.temp }}/unit_test_timings_candidate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve full failing-shard diagnostics
        # Timeout cancellation must retain the last executed test name.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ci-tooling-unit-failure-logs
          path: ${{ runner.temp }}/unit-shard*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save compile cache
        if: always() && steps.unit-scope.outputs.mode != 'ops' && steps.cxx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cxx-cache
          key: ur-unit-cxx-${{ runner.os }}-${{ github.run_id }}

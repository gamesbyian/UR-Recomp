name: Native build and boot smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "rom_identity.txt"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "third_party/manifest.json"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/patches/snesrecomp-live-vsync.patch"
      - "tools/patches/snesrecomp-live-display-mode.patch"
      - "tools/toolchain-entries/_global.json"
      - "tools/patch_modern_product_host.py"
      - "tools/prepare_native_widescreen_product.py"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/apply_native_widescreen_hook.py"
      - "tools/patches/snesrecomp-dynamic-native-widescreen.patch"
      - "tools/build_display_geometry_review.py"
      - "tools/analyze_display_active_height.py"
      - "tests/unit/test_analyze_display_active_height.py"
      - "analysis/display-geometry-candidates.json"
      - "native/product/**"
      - "native/title/uniracers_restart_policy.*"
      - "tests/input/reach-first-race.script"
      - "tests/input/modern-focus-pause.script"
      - "tests/input/modern-exit-frontend-results.script"
      - "tests/input/modern-exit-frontend-active.script"
      - "tests/input/widescreen-product-acceptance.script"
      - ".github/workflows/native-build-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "rom_identity.txt"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/archives/SDL3-3.4.10.tar.gz"
      - "tools/toolchain-entries/sdl3.json"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "third_party/manifest.json"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/patches/snesrecomp-live-vsync.patch"
      - "tools/patches/snesrecomp-live-display-mode.patch"
      - "tools/toolchain-entries/_global.json"
      - "tools/patch_modern_product_host.py"
      - "tools/prepare_native_widescreen_product.py"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/apply_native_widescreen_hook.py"
      - "tools/patches/snesrecomp-dynamic-native-widescreen.patch"
      - "tools/build_display_geometry_review.py"
      - "tools/analyze_display_active_height.py"
      - "tests/unit/test_analyze_display_active_height.py"
      - "analysis/display-geometry-candidates.json"
      - "native/product/**"
      - "native/title/uniracers_restart_policy.*"
      - "tests/input/reach-first-race.script"
      - "tests/input/modern-focus-pause.script"
      - "tests/input/modern-exit-frontend-results.script"
      - "tests/input/modern-exit-frontend-active.script"
      - "tests/input/widescreen-product-acceptance.script"
concurrency:
  group: native-build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config xvfb xdotool \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Stage repository-owned SNESRecomp framework
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          # Canonical desktop backend (docs/PLATFORM-TARGETS.md): exact SDL3 source, staged offline.
          python3 tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only
          test -f .tools/src/sdl3/SDL3-3.4.10/CMakeLists.txt
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh
          test -f .tools/src/snesrecomp/runner/runner.cmake
          test ! -e .tools/src/snesrecomp/lib/recomp-net/CMakeLists.txt
          test ! -e .tools/src/snesrecomp/lib/retcomm-rbengine/CMakeLists.txt

      - name: Scaffold, generate and build
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-recomp-build"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --no-generate \
              --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 "$GITHUB_WORKSPACE/tools/prepare_native_widescreen_product.py" \
            --framework "$FRAMEWORK" \
            --project "$ROOT" \
            --rom "$ROM" \
            --json-out "$RUNNER_TEMP/widescreen-product-prepare.json"
          grep -q '"product_ready": true' "$RUNNER_TEMP/widescreen-product-prepare.json"

          python3 "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py" \
            "$ROOT/src/main.c" \
            --game-rtl "$ROOT/src/game_rtl.c" \
            --cmake "$ROOT/CMakeLists.txt"
          grep -q "ur_uniracers_modern_after_run_frame" "$ROOT/src/main.c"
          grep -q "ur_uniracers_modern_system_key_down" "$ROOT/src/main.c"
          grep -q "ur_uniracers_modern_system_gamepad_button" "$ROOT/src/main.c"
          grep -q "ur_uniracers_modern_system_overlay" "$ROOT/src/main.c"
          grep -q "ur_uniracers_modern_native_widescreen_enabled" "$ROOT/src/main.c"
          grep -q "uniracers_modern_host.cpp" "$ROOT/CMakeLists.txt"
          grep -q "\.session_reset = &GameSessionReset" "$ROOT/src/game_rtl.c"

          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON \
            -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Locate game executable
        id: exe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-recomp-build/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"

          echo "== executable files under build/ =="
          find "$ROOT/build" -maxdepth 4 -type f -perm -111 -print || true

          if [ ! -f "$EXE" ] || [ ! -x "$EXE" ]; then
            echo "::error::Expected generated game target is missing or not executable: $EXE"
            echo "The scaffold contract names the CMake target UniracersSNESRecomp; do not fall back to arbitrary build-tree executables."
            exit 1
          fi

          case "$EXE" in
            */CMakeFiles/*|*/CompilerId*|*/a.out)
              echo "::error::Refusing non-game build helper executable: $EXE"
              exit 1
              ;;
          esac

          file "$EXE"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "Selected game target: $EXE"

      - name: Native boot smoke
        shell: bash
        run: |
          set +e
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          echo "== starting native executable =="
          echo "$EXE"
          SHOT="$RUNNER_TEMP/native-frame-300.ppm"
          PRESENTS="$RUNNER_TEMP/native-presents.csv"
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_SCREENSHOT="$SHOT" \
          SNESRECOMP_SCREENSHOT_FRAME=300 \
          SNESRECOMP_PRESENT_LOG="$PRESENTS" \
          timeout 20s xvfb-run -a "$EXE" "$ROM" \
            >"$RUNNER_TEMP/boot.log" 2>&1
          STATUS=$?
          cat "$RUNNER_TEMP/boot.log"
          echo "boot_exit_status=$STATUS"
          if [ "$STATUS" -eq 124 ]; then
            echo "SMOKE_RESULT=alive_after_20s"
            exit 0
          fi
          if [ "$STATUS" -eq 0 ]; then
            echo "SMOKE_RESULT=clean_exit"
            exit 0
          fi
          echo "SMOKE_RESULT=failed_status_$STATUS"
          exit "$STATUS"

      - name: Validate captured frame
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SHOT="$RUNNER_TEMP/native-frame-300.ppm"
          PRESENTS="$RUNNER_TEMP/native-presents.csv"
          if [ ! -s "$SHOT" ]; then
            echo "::error::Expected frame-300 diagnostic screenshot was not produced"
            exit 1
          fi
          python3 - "$SHOT" <<'PY'
          import hashlib
          import pathlib
          import sys

          p = pathlib.Path(sys.argv[1])
          raw = p.read_bytes()
          with p.open("rb") as f:
              magic = f.readline().strip()
              dims = f.readline().strip().split()
              maxv = f.readline().strip()
              pixels = f.read()
          if magic != b"P6" or len(dims) != 2 or maxv != b"255":
              raise SystemExit(f"unexpected PPM header: {magic!r} {dims!r} {maxv!r}")
          w, h = map(int, dims)
          expected = w * h * 3
          if len(pixels) != expected:
              raise SystemExit(f"PPM payload length {len(pixels)} != {expected}")
          nonblack = sum(any(pixels[i+j] for j in range(3)) for i in range(0, len(pixels), 3))
          colors = len({pixels[i:i+3] for i in range(0, len(pixels), 3)})
          print(f"screenshot={p}")
          print(f"dimensions={w}x{h}")
          print(f"sha256={hashlib.sha256(raw).hexdigest()}")
          print(f"unique_rgb={colors}")
          print(f"nonblack_pixels={nonblack}/{w*h} ({nonblack/(w*h):.3%})")
          print(f"channel_min={min(pixels)} channel_max={max(pixels)}")
          if colors < 2:
              raise SystemExit("captured frame is a single flat color")
          PY
          if [ -s "$PRESENTS" ]; then
            echo "== final present-log rows =="
            tail -n 12 "$PRESENTS"
          fi

      - name: Desktop output-mode capability acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          LOG="$RUNNER_TEMP/display-caps.log"

          UR_DISPLAY_CAPS_DIAGNOSTICS=1 \
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_RUN_FRAMES=5 \
          timeout 12s xvfb-run -a "$EXE" "$ROM" >"$LOG" 2>&1

          cat "$LOG"
          grep -Eq "UR_DISPLAY_CAPS modes=[1-9][0-9]* " "$LOG"
          grep -q "native_ok=1" "$LOG"
          grep -q "first_ok=1" "$LOG"
          grep -q "apply_ok=1" "$LOG"
          grep -q "reject_ok=1" "$LOG"
          grep -q "range_reject_ok=1" "$LOG"
          grep -Eq "native=[1-9][0-9]*x[1-9][0-9]*@[0-9]+" "$LOG"
          grep -Eq "first=[1-9][0-9]*x[1-9][0-9]*@[0-9]+" "$LOG"

      - name: Deterministic native input route
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script"
          LOG="$RUNNER_TEMP/race-smoke.log"
          DUMPS="$RUNNER_TEMP/race-dumps"
          mkdir -p "$DUMPS"

          echo "== scripted native input route =="
          SNESRECOMP_DUMP_DIR="$DUMPS" SDL_AUDIODRIVER=dummy \
          timeout 90s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            >"$LOG" 2>&1
          STATUS=$?
          cat "$LOG"

          for state in main-menu-ready rider-select-ready tours-ready tracks-ready after-track-confirm now-playing-ready race-entered; do
            WRAM="$DUMPS/$state.wram.bin"
            if [ -s "$WRAM" ]; then
              python3 -c 'import pathlib,sys; name=sys.argv[1]; w=pathlib.Path(sys.argv[2]).read_bytes(); print(f"{name}: menu[009F]=0x{w[0x009F]:02X} selectedOption[009B]=0x{w[0x009B]:02X} row[000E]=0x{w[0x000E]:02X} col[0C63]=0x{w[0x0C63]:02X} track[00CE]=0x{w[0x00CE]:02X} inRace[0313]=0x{w[0x0313]:02X}")' "$state" "$WRAM"
            fi
          done

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Scripted native route exited with status $STATUS"
            exit "$STATUS"
          fi
          if [ ! -s "$DUMPS/now-playing-ready.wram.bin" ] || [ ! -s "$DUMPS/race-entered.wram.bin" ]; then
            echo "::error::Route did not prove now-playing and race entry"
            exit 1
          fi
          echo "INPUT_ROUTE_RESULT=reached_race"

      - name: Shipping Widescreen composition acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/widescreen-product-acceptance.script"
          ROOT="$RUNNER_TEMP/widescreen-product"
          LOG="$ROOT/run.log"
          DUMPS="$ROOT/dumps"
          STATE="$ROOT/host-state-v6.txt"
          mkdir -p "$DUMPS"
          cat >"$STATE" <<'STATEEOF'
          UR-HOST-STATE/6
          profile=
          pause_on_focus_loss=1
          vibration_enabled=1
          display_mode=windowed
          vsync=on
          presentation_fps=game
          output_resolution=native
          widescreen=16x9
          STATEEOF

          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$STATE" \
          URRECOMP_WS_NATIVE_TRACE=1 \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
          SDL_AUDIODRIVER=dummy \
          timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_HOST_STATE LOADED .*widescreen=16x9" "$LOG"
          grep -q "URWS_PREP_EXT margin=48" "$LOG"
          grep -q "URWS_SHADOW_EXT provider=course-runtime margin=48" "$LOG"

          python3 - "$DUMPS/ws-product-main-menu.fb.bmp" \
            "$DUMPS/ws-product-race.fb.bmp" \
            "$DUMPS/ws-product-after-scroll.fb.bmp" <<'PY'
          import pathlib, struct, sys

          def dims(path):
              raw=pathlib.Path(path).read_bytes()
              if raw[:2] != b"BM" or len(raw) < 26:
                  raise SystemExit(f"{path}: not a retained BMP")
              return struct.unpack_from("<i", raw, 18)[0], abs(struct.unpack_from("<i", raw, 22)[0])

          frontend=dims(sys.argv[1])
          race=dims(sys.argv[2])
          after=dims(sys.argv[3])
          print("WIDESCREEN_PRODUCT", "frontend=", frontend, "race=", race, "after=", after)
          if frontend != (256, 224):
              raise SystemExit(f"fixed frontend widened unexpectedly: {frontend}")
          if race != (342, 224) or after != (342, 224):
              raise SystemExit(f"active 1P race did not hold accepted 342x224 view: {race} {after}")
          PY

      - name: Build display-geometry review
        shell: bash
        run: |
          set -euo pipefail
          DUMPS="$RUNNER_TEMP/race-dumps"
          for tag in main-menu-ready now-playing-ready race-entered; do
            test -s "$DUMPS/$tag.fb.bmp"
          done
          python3 tools/build_display_geometry_review.py \
            --candidates analysis/display-geometry-candidates.json \
            --capture "$DUMPS/main-menu-ready.fb.bmp" \
            --capture "$DUMPS/now-playing-ready.fb.bmp" \
            --capture "$DUMPS/race-entered.fb.bmp" \
            --json-out "$RUNNER_TEMP/display-geometry-review.json" \
            --html-out "$RUNNER_TEMP/display-geometry-review.html"
          python3 - "$RUNNER_TEMP/display-geometry-review.json" <<'PY'
          import json, pathlib, sys
          report=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["framebuffer_geometry"] == [256, 224], report["framebuffer_geometry"]
          by_id={row["id"]:row for row in report["candidates"]}
          assert by_id["uniracers-7x6-full"]["derived_16x9"]["materializer_margin_pixels"] == 48
          assert by_id["raw-square-full"]["derived_16x9"]["materializer_margin_pixels"] == 72
          assert by_id["raw-square-216"]["derived_16x9"]["materializer_margin_pixels"] == 64
          print("DISPLAY_GEOMETRY_REVIEW_READY candidates=", len(by_id))
          PY
          python3 tools/analyze_display_active_height.py \
            --capture "$DUMPS/main-menu-ready.fb.bmp" \
            --capture "$DUMPS/now-playing-ready.fb.bmp" \
            --capture "$DUMPS/race-entered.fb.bmp" \
            --crop-top 4 --crop-bottom 4 \
            --json-out "$RUNNER_TEMP/display-active-height.json" \
            --md-out "$RUNNER_TEMP/display-active-height.md"
          python3 - "$RUNNER_TEMP/display-active-height.json" <<'PY'
          import json, pathlib, sys
          report=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["source_height"] == 224
          assert report["active_height"] == 216
          assert not report["all_captures_crop_content_neutral"]
          assert all(not row["crop_content_neutral"] for row in report["captures"])
          print(
              "DISPLAY_ACTIVE_HEIGHT_DISCRIMINATOR",
              "distinct=", report["total_distinct_cropped_pixels_vs_nearest_retained_boundary"],
              "cropped=", report["total_cropped_pixels"],
          )
          PY

      - name: Modern focus-loss pause acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          LOG="$RUNNER_TEMP/focus-pause.log"
          DUMPS="$RUNNER_TEMP/focus-pause-dumps"
          mkdir -p "$DUMPS"

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/race-entered.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/race-entered.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]

            # Directly unmap the native SDL window. This requires no window
            # manager and causes SDL_GetKeyboardFocus() to become null.
            xdotool windowunmap "$WIN"

            for _ in $(seq 1 100); do
              grep -q "UR_FOCUS_PAUSE APPLIED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_FOCUS_PAUSE APPLIED focus=0 setting=1 modern=1" "'"$LOG"'"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          '

          cat "$LOG"
          echo "UR_FOCUS_PAUSE_RESULT=applied_through_native_product_host"

      - name: Modern pause-settings row persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          STATE="$RUNNER_TEMP/host-state-v6.txt"
          SAVE_LOG="$RUNNER_TEMP/host-state-save.log"
          LOAD_LOG="$RUNNER_TEMP/host-state-load.log"
          AUTH_LOG="$RUNNER_TEMP/host-state-authentic.log"
          DUMPS="$RUNNER_TEMP/host-state-dumps"
          rm -f "$STATE"
          mkdir -p "$DUMPS"

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export UR_HOST_STATE_PATH="'"$STATE"'"
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$SAVE_LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/race-entered.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/race-entered.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]

            xdotool windowfocus "$WIN"
            xdotool key Escape
            sleep 0.3

            # Active race exposes Resume -> Restart -> Options.
            # Enter Options, toggle Focus Pause, then navigate to the
            # host-owned Display row, advance through Borderless to Fullscreen,
            # move to VSync and select Adaptive, set Presentation FPS to 120,
            # choose the first explicit active-monitor Output Resolution, then
            # enable the persisted 16:9 Widescreen view.
            xdotool key Down
            xdotool key Down
            xdotool key Return
            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_OPTIONS OPENED" "'"$SAVE_LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_OPTIONS OPENED" "'"$SAVE_LOG"'"
            xdotool key Return
            xdotool key Down
            xdotool key Return
            xdotool key Return
            xdotool key Down
            xdotool key Return
            xdotool key Down
            xdotool key Return
            xdotool key Return
            xdotool key Return
            xdotool key Down
            xdotool key Return
            xdotool key Down
            xdotool key Return

            for _ in $(seq 1 100); do
              grep -q "^widescreen=16x9$" "'"$STATE"'" 2>/dev/null && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done

            for _ in $(seq 1 100); do
              grep -q "^output_resolution=[0-9][0-9]*x[0-9][0-9]*$" "'"$STATE"'" 2>/dev/null && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "^UR-HOST-STATE/6$" "'"$STATE"'"
            grep -q "^pause_on_focus_loss=0$" "'"$STATE"'"
            grep -q "^display_mode=fullscreen$" "'"$STATE"'"
            grep -q "^vsync=adaptive$" "'"$STATE"'"
            grep -q "^presentation_fps=120$" "'"$STATE"'"
            grep -q "^widescreen=16x9$" "'"$STATE"'"
            RESOLUTION=$(sed -n "s/^output_resolution=//p" "'"$STATE"'")
            test -n "$RESOLUTION"
            test "$RESOLUTION" != native
            grep -Eq "^output_resolution=[0-9]+x[0-9]+$" "'"$STATE"'"
            grep -q "UR_DISPLAY_MODE APPLIED mode=fullscreen host=2" "'"$SAVE_LOG"'"
            grep -q "UR_VSYNC APPLIED mode=adaptive host=2" "'"$SAVE_LOG"'"
            grep -q "UR_PRESENTATION_FPS APPLIED mode=120 target=120 decoupled=1" "'"$SAVE_LOG"'"
            grep -q "UR_OUTPUT_RESOLUTION SELECTED value=$RESOLUTION" "'"$SAVE_LOG"'"
            grep -q "UR_OUTPUT_RESOLUTION APPLIED requested=$RESOLUTION effective=$RESOLUTION status=applied" "'"$SAVE_LOG"'"
            grep -q "UR_WIDESCREEN SELECTED mode=16x9" "'"$SAVE_LOG"'"
            grep -q "UR_HOST_STATE SAVED" "'"$SAVE_LOG"'"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          '

          set +e
          SDL_AUDIODRIVER=dummy           UR_PRODUCT_DIAGNOSTICS=1           UR_HOST_STATE_PATH="$STATE"           timeout 6s xvfb-run -a "$EXE" "$ROM" >"$LOAD_LOG" 2>&1
          LOAD_STATUS=$?
          set -e
          if [ "$LOAD_STATUS" -ne 0 ] && [ "$LOAD_STATUS" -ne 124 ]; then
            cat "$LOAD_LOG"
            exit "$LOAD_STATUS"
          fi
          RESOLUTION=$(sed -n "s/^output_resolution=//p" "$STATE")
          grep -q "UR_HOST_STATE LOADED pause_on_focus_loss=0 display_mode=fullscreen vsync=adaptive presentation_fps=120 output_resolution=$RESOLUTION widescreen=16x9" "$LOAD_LOG"
          grep -q "UR_DISPLAY_MODE APPLIED mode=fullscreen host=2" "$LOAD_LOG"
          grep -q "UR_OUTPUT_RESOLUTION APPLIED requested=$RESOLUTION effective=$RESOLUTION status=applied" "$LOAD_LOG"
          grep -q "UR_VSYNC APPLIED mode=adaptive host=2" "$LOAD_LOG"
          grep -q "UR_PRESENTATION_FPS APPLIED mode=120 target=120 decoupled=1" "$LOAD_LOG"

          set +e
          SDL_AUDIODRIVER=dummy           UR_PRODUCT_DIAGNOSTICS=1           UR_EXECUTION_MODE=authentic           UR_HOST_STATE_PATH="$STATE"           timeout 6s xvfb-run -a "$EXE" "$ROM" >"$AUTH_LOG" 2>&1
          AUTH_STATUS=$?
          set -e
          if [ "$AUTH_STATUS" -ne 0 ] && [ "$AUTH_STATUS" -ne 124 ]; then
            cat "$AUTH_LOG"
            exit "$AUTH_STATUS"
          fi
          grep -q "UR_HOST_STATE AUTHENTIC_INERT" "$AUTH_LOG"
          if grep -q "UR_HOST_STATE LOADED" "$AUTH_LOG"; then
            echo "::error::Authentic mode loaded modern host settings"
            exit 1
          fi
          if grep -q "UR_DISPLAY_MODE APPLIED" "$AUTH_LOG"; then
            echo "::error::Authentic mode applied modern display policy"
            exit 1
          fi
          if grep -q "UR_VSYNC APPLIED" "$AUTH_LOG"; then
            echo "::error::Authentic mode applied modern VSync policy"
            exit 1
          fi
          if grep -q "UR_PRESENTATION_FPS APPLIED" "$AUTH_LOG"; then
            echo "::error::Authentic mode applied modern presentation-FPS policy"
            exit 1
          fi
          if grep -q "UR_OUTPUT_RESOLUTION" "$AUTH_LOG"; then
            echo "::error::Authentic mode touched modern output-resolution policy"
            exit 1
          fi
          if grep -q "UR_WIDESCREEN" "$AUTH_LOG"; then
            echo "::error::Authentic mode touched modern Widescreen policy"
            exit 1
          fi

          echo "== saved host state =="
          cat "$STATE"
          echo "== save diagnostics =="
          cat "$SAVE_LOG"
          echo "== load diagnostics =="
          cat "$LOAD_LOG"
          echo "== authentic diagnostics =="
          cat "$AUTH_LOG"
          echo "UR_PAUSE_OPTIONS_RESULT=focus_fullscreen_vsync_presentation_fps_output_resolution_widescreen_saved_loaded_and_authentic_inert"

      - name: Modern Output Resolution rollback acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          SOURCE_STATE="$RUNNER_TEMP/host-state-v6.txt"
          ROLLBACK_DIR="$RUNNER_TEMP/output-resolution-rollback"
          STATE="$ROLLBACK_DIR/host-state-v6.txt"
          BEFORE="$ROLLBACK_DIR/before.txt"
          LOG="$ROLLBACK_DIR/rollback.log"
          DUMPS="$ROLLBACK_DIR/dumps"
          rm -rf "$ROLLBACK_DIR"
          mkdir -p "$DUMPS"
          cp "$SOURCE_STATE" "$STATE"
          cp "$STATE" "$BEFORE"
          RESOLUTION=$(sed -n 's/^output_resolution=//p' "$STATE")
          test -n "$RESOLUTION"
          test "$RESOLUTION" != native

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export UR_HOST_STATE_PATH="'"$STATE"'"
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/race-entered.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/race-entered.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]

            xdotool windowfocus "$WIN"
            xdotool key Escape
            sleep 0.2

            # Active race: Resume -> Restart -> Options.
            xdotool key Down
            xdotool key Down
            xdotool key Return
            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_OPTIONS OPENED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_OPTIONS OPENED" "'"$LOG"'"

            # Focus -> Display -> VSync -> Presentation FPS -> Output Resolution.
            for _ in 1 2 3 4; do xdotool key Down; done

            # Make the already-loaded state file read-only. The candidate
            # resolution must apply live first, persistence must fail, and the
            # host must restore the previously persisted fullscreen mode.
            chmod 444 "'"$STATE"'"
            xdotool key Return

            for _ in $(seq 1 100); do
              grep -q "UR_HOST_STATE SAVE_FAILED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_HOST_STATE SAVE_FAILED" "'"$LOG"'"

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          '

          chmod 644 "$STATE"
          cmp "$BEFORE" "$STATE"

          APPLIES=$(grep -c "UR_OUTPUT_RESOLUTION APPLIED" "$LOG")
          OLD_APPLIES=$(grep -c "UR_OUTPUT_RESOLUTION APPLIED requested=$RESOLUTION effective=$RESOLUTION status=applied" "$LOG")
          test "$APPLIES" -ge 3
          test "$OLD_APPLIES" -ge 2

          cat "$LOG"
          echo "UR_OUTPUT_RESOLUTION_ROLLBACK_RESULT=live_candidate_reverted_after_save_failure"

      - name: Modern presentation FPS cadence acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          STATE="$RUNNER_TEMP/host-state-v6.txt"
          PRESENTS="$RUNNER_TEMP/presentation-120.csv"
          LOG="$RUNNER_TEMP/presentation-120.log"

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$STATE" \
          SNESRECOMP_RUN_FRAMES=120 \
          SNESRECOMP_PRESENT_LOG="$PRESENTS" \
          timeout 12s xvfb-run -a "$EXE" "$ROM" >"$LOG" 2>&1

          grep -q "UR_PRESENTATION_FPS APPLIED mode=120 target=120 decoupled=1" "$LOG"
          test -s "$PRESENTS"
          python3 - "$PRESENTS" <<'PY'
          import csv
          import pathlib
          import sys

          rows = list(csv.DictReader(pathlib.Path(sys.argv[1]).open()))
          frames = {int(row["frame"]) for row in rows}
          presentations = len(rows)
          simulations_seen = len(frames)
          print(
              "UR_PRESENTATION_FPS_CADENCE",
              f"presentations={presentations}",
              f"simulated_frames_seen={simulations_seen}",
          )
          if simulations_seen < 100:
              raise SystemExit("presentation log did not cover the bounded simulation run")
          if presentations <= simulations_seen * 1.5:
              raise SystemExit(
                  "120 Hz presentation did not re-present captured guest frames")
          PY

      - name: Modern pause controls panel acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          LOG="$RUNNER_TEMP/pause-controls.log"
          DUMPS="$RUNNER_TEMP/pause-controls-dumps"
          mkdir -p "$DUMPS"

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/race-entered.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/race-entered.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]

            xdotool windowfocus "$WIN"
            xdotool key Escape
            sleep 0.2

            # Active race rows: Resume -> Restart -> Focus Pause -> Controls.
            xdotool key Down
            xdotool key Down
            xdotool key Down
            xdotool key Return

            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_CONTROLS OPENED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_CONTROLS OPENED" "'"$LOG"'"
            kill -0 "$PID"

            # Escape closes the host-only subview, not the paused guest.
            xdotool key Escape
            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_CONTROLS CLOSED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1

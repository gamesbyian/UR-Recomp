name: ART4K original Mesen held RGB repeatability (one-off)

on:
  pull_request:
    paths:
      - 'tools/art/audit_original_mesen_held_rgb_repeatability.py'
      - 'tests/unit/test_audit_original_mesen_held_rgb_repeatability.py'
      - '.github/workflows/art4k-held-rgb-repeatability-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: art4k-held-rgb-repeatability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-ppu-video-discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run original source RAM versus RGB negative controls
        run: python3 -m unittest tests.unit.test_audit_original_mesen_held_rgb_repeatability
      - name: Download both SHA-authenticated original Mesen source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in 13199861365 13199267815; do
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/$artifact/zip" \
              --output "$RUNNER_TEMP/original-$artifact.zip"
          done
          printf '%s  %s\n' \
            "b72a1c805423f14847b257fe807be84559aa2a9e8914314ce1b8d24532f95964" "$RUNNER_TEMP/original-13199861365.zip" | sha256sum --check --status
          printf '%s  %s\n' \
            "24b70f3a3468d628d57c1bc1a43915e8abaecb6a66dc6156fcb4b685a73610e2" "$RUNNER_TEMP/original-13199267815.zip" | sha256sum --check --status
      - name: Require same source PPU SHA and reject screen replay repeatability
        run: |
          set -euo pipefail
          python3 -m tools.art.audit_original_mesen_held_rgb_repeatability \
            --first-original-source-zip "$RUNNER_TEMP/original-13199861365.zip" \
            --second-original-source-zip "$RUNNER_TEMP/original-13199267815.zip" \
            --out "$RUNNER_TEMP/original-mesen-screen-repeatability.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"original-mesen-screen-repeatability.json").read_text())
          assert r["source_original_OAM_VRAM_CGRAM_sha_identical_across_executions"]
          assert not r["screen_RGB_repeatable_across_executions"]
          assert r["across_executions_same_tick"]["1219"]["RGB_pixels_different_across_executions"]==10258
          assert r["across_executions_same_tick"]["1220"]["RGB_pixels_different_across_executions"]==22776
          assert r["within_execution_changed_RGB_pixels_by_run"]=={"41565384581":0,"41566836578":23593}
          assert not r["source_screen_to_current_PPU_scanout_phase_independently_aligned"]
          assert not r["original_source_OAM_to_racer_pixel_ownership_verified"]
          print("ORIGINAL_MESENCE_HELD_RGB_NONREPEATABILITY_CONFIRMED",10258,22776,0,23593)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: art4k-original-held-rgb-repeatability-${{ github.run_id }}
          path: ${{ runner.temp }}/original-mesen-screen-repeatability.json
          retention-days: 7
          if-no-files-found: error

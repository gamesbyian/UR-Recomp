name: QA-08 original Snes9x effective finish on-pixel depth source

# Bounded original-only source witness at two externally established finished
# pixels: 3791 and 3871. No Windows compilation or alternative CPU.
# Requires 263/263 ORIGINAL baseline source image byte equality.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qa08-original-finish-layer-callback.yml"
      - "tools/qa08_patch_original_finish_layer_callback.py"
      - "tests/unit/test_qa08_patch_original_finish_layer_callback.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: qa08-original-finish-layer-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-single-route:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1649 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Prove exact unchanged ROM, two-pad route and core revision
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          echo "859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478  reference/roms/retail/Uniracers_USA.sfc" | sha256sum -c -
          cmp baldosa/tests/routes/race_2p.txt reference/imported/reverse-engineering/baldosa-uniracers-recomp/tests/routes/race_2p.txt
          python3 -m unittest tests.unit.test_qa08_patch_original_finish_layer_callback
          mkdir -p "$RUNNER_TEMP/qa08-original-finish/frames"
          grep -v '^turbo ' baldosa/tests/routes/race_2p.txt > "$RUNNER_TEMP/qa08-original-finish/original.script"
      - name: Build exact old core with one disposable read-only callback observer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libsdl2-dev
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          python3 tools/qa08_patch_original_finish_layer_callback.py \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/libretro.cpp" --apply
          make -C "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro" -j 2
          cmake -S baldosa/snesrecomp/tools/snesref -B "$RUNNER_TEMP/qa08-original-ref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qa08-original-ref" -j 2
      - name: Observe actual original callback and all canonical unchanged images
        run: |
          set -euo pipefail
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$RUNNER_TEMP/qa08-original-finish/original.script" \
          SNESREF_DUMP_DIR="$RUNNER_TEMP/qa08-original-finish" \
          SNESREF_FRAME_DUMP_DIR="$RUNNER_TEMP/qa08-original-finish/frames" \
          SNESREF_FRAME_DUMP_NATIVE=1 SNESREF_FRAME_DUMP_FROM=1279 \
          SNESREF_FRAME_DUMP_TO=9503 SNESREF_FRAME_DUMP_STEP=16 \
          UR_QA08_SNES9X_FINISH_LAYERS=original-2p-3791-3871 \
          timeout 240 "$RUNNER_TEMP/qa08-original-ref/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            > "$RUNNER_TEMP/qa08-original-finish/original.log" 2>&1
          python3 tools/qa08_original_twoplayer_fullroute_manifest.py \
            --frames "$RUNNER_TEMP/qa08-original-finish/frames" \
            --script "$RUNNER_TEMP/qa08-original-finish/original.script" \
            --log "$RUNNER_TEMP/qa08-original-finish/original.log" \
            --rom reference/roms/retail/Uniracers_USA.sfc \
            --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            --out "$RUNNER_TEMP/qa08-original-finish/new-original-2p-manifest.json"
      - name: Refuse altered original source picture, callback or script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/11996107746/zip" \
            -o "$RUNNER_TEMP/qa08-original-finish/original-immutable.zip"
          echo "72b7b152d08d8abb3636053bfd132db64926a5bf188f4dbba7e30b20d9583e9e  $RUNNER_TEMP/qa08-original-finish/original-immutable.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/qa08-original-finish" "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib,json,pathlib,re,sys,zipfile
          root=pathlib.Path(sys.argv[1])
          report=json.loads((root/"new-original-2p-manifest.json").read_text())
          assert report["actual_callbacks_captured"]==263
          assert report["capture_selection"]==[1279,5471,16]
          with zipfile.ZipFile(root/"original-immutable.zip") as original:
              for callback in range(1279,5472,16):
                  filename=f"frames/frame_{callback:06d}_256x224.raw"
                  old=original.read(filename)
                  new=(root/filename).read_bytes()
                  assert len(old)==len(new)==256*224*4 and old==new, f"modified original image callback={callback}"
          text=(root/"original.log").read_text(errors="replace")
          lines=[line for line in text.splitlines() if line.startswith("QA08_ORIGINAL_FINISH_LAYER ")]
          assert len(lines)==2,lines
          source=[]
          for frame,line in zip((3791,3871),lines):
              fields=dict(re.findall(r"([a-zA-Z_0-9]+)=([a-fA-F0-9]+)",line))
              assert int(fields["callback"])==frame
              assert fields["RGB565"].lower()=="30c0"
              assert (int(fields["x"]),int(fields["y"]))==(121,165)
              assert (int(fields["width"]),int(fields["height"]))==(256,224)
              assert int(fields["brightness"])==7
              assert fields["CGADSUB"].lower()=="04"
              assert fields["CGRAM_1B"].lower()=="000d"
              assert fields["CGRAM_C6"].lower()=="04e1"
              source.append({k:v for k,v in fields.items()})
          (root/"original-finish-source-layers.json").write_text(json.dumps({
              "schema":"qa08-original-2014-snes9x-two-pixel-real-ppu-buffer-owners/1",
              "original_rebuilt_exact_pinned_libretro_source_fully_same_263_images":True,
              "actual_original_video_callbacks":[3791,3871],
              "original_source_PPU_buffer_observations":source,
              "Win32_layer_owner_or_physical_SNES_equivalence_proven":False,
              "source_layer_assertion_requires_decoded_depth_priority":True,
              "renderer_or_game_state_modified_by_observer":False,
              "release_acceptance":False
          },indent=2)+"\n")
          with open(sys.argv[2],"a") as o:
              o.write("Original 2014 Snes9x 263/263 image-byte identities preserved under opt-in callback read-only probe; two genuine 256x224 callback raster/depth/PPU witnesses produced. No final original OBJ owner inferred until depth tags are source-decoded.\n")
          PY
      - name: Retain only small original source/PPU witness and replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa08-original-finish-two-pixels-depth-readonly
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa08-original-finish/original-finish-source-layers.json
            ${{ runner.temp }}/qa08-original-finish/new-original-2p-manifest.json
            ${{ runner.temp }}/qa08-original-finish/original.log

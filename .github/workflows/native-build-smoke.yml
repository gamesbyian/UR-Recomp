          cat "$LOG"
          grep -q "UR_HOST_STATE LOADED .*widescreen=16x9" "$LOG"
          grep -q "URWS_PREP_EXT margin=48" "$LOG"
          grep -q "URWS_SHADOW_EXT provider=course-runtime margin=48" "$LOG"

          python3 - "$DUMPS/ws-product-main-menu.fb.bmp" \
            "$DUMPS/ws-product-race.fb.bmp" \
            "$DUMPS/ws-product-after-scroll.fb.bmp" <<'PY'
          import pathlib, struct, sys

          def dims(path):
              raw=pathlib.Path(path).read_bytes()
              if raw[:2] != b"BM" or len(raw) < 26:
                  raise SystemExit(f"{path}: not a retained BMP")
              return struct.unpack_from("<i", raw, 18)[0], abs(struct.unpack_from("<i", raw, 22)[0])

          frontend=dims(sys.argv[1])
          race=dims(sys.argv[2])
          after=dims(sys.argv[3])
          print("WIDESCREEN_PRODUCT", "frontend=", frontend, "race=", race, "after=", after)
          if frontend != (256, 224):
              raise SystemExit(f"fixed frontend widened unexpectedly: {frontend}")
          if race != (342, 224) or after != (342, 224):
              raise SystemExit(f"active 1P race did not hold accepted 342x224 view: {race} {after}")
          PY

      - name: Shipping Widescreen stock-parity acceptance
        shell: bash
        run: |
          set -euo pipefail
          # The widened view may add side columns only: its authored 256-wide
          # centre must equal the matched Original-view frame, and guest WRAM
          # may differ only inside the guest +8 lane.
          python3 -m unittest tests.unit.test_check_widescreen_product_parity \
            tests.unit.test_uniracers_ws_margins_c
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/widescreen-product-acceptance.script"
          ROOT="$RUNNER_TEMP/widescreen-product-stock"
          mkdir -p "$ROOT/dumps"
          cat >"$ROOT/host-state-v6.txt" <<'STATEEOF'
          UR-HOST-STATE/6
          profile=
          pause_on_focus_loss=1
          vibration_enabled=1
          display_mode=windowed
          vsync=on
          presentation_fps=game
          output_resolution=native
          widescreen=original
          STATEEOF

          # Every matched run starts from the SRAM the 16:9 acceptance run
          # started from; later steps get back the state that run left.
          SAVES="$(dirname "$EXE")/saves"
          reset_saves() {
            rm -rf "$SAVES"
            if [ -d "$RUNNER_TEMP/ws-saves-pre" ]; then cp -a "$RUNNER_TEMP/ws-saves-pre" "$SAVES"; fi
          }
          reset_saves
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$ROOT/host-state-v6.txt" \
          SNESRECOMP_DUMP_DIR="$ROOT/dumps" \
          SDL_AUDIODRIVER=dummy \
          timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            >"$ROOT/run.log" 2>&1

          python3 tools/check_widescreen_product_parity.py \
            --stock-dumps "$ROOT/dumps" \
            --wide-dumps "$RUNNER_TEMP/widescreen-product/dumps" \
            --checkpoint ws-product-race \
            --checkpoint ws-product-after-scroll \
            --out "$RUNNER_TEMP/widescreen-product-parity.json"

          # Margins are presented host-side from the course model, which must
          # lock onto the live view and hold it for the whole route.
          WIDE_LOG="$RUNNER_TEMP/widescreen-product/run.log"
          grep -q "URWS_MARGINS CALIBRATED" "$WIDE_LOG"
          if grep -q "URWS_MARGINS LOST" "$WIDE_LOG"; then
            grep "URWS_MARGINS" "$WIDE_LOG"
            echo "::error::Widescreen margin presenter lost its course calibration"
            exit 1
          fi

          # Split-screen races (VS and ordinary 2P) widen too: each viewport is
          # its own calibrated margin band, and the authored picture and guest
          # WRAM must still match the Original view exactly.
          split_route() {
            local name="$1" input="$2" script="$3"
            for view in original 16x9; do
              OUT="$RUNNER_TEMP/widescreen-product-$name-$view"
              mkdir -p "$OUT/dumps"
              sed "s/^widescreen=.*/widescreen=$view/" "$ROOT/host-state-v6.txt" >"$OUT/state.txt"
              reset_saves
              UR_PRODUCT_DIAGNOSTICS=1 \
              UR_HOST_STATE_PATH="$OUT/state.txt" \
              URRECOMP_WS_NATIVE_TRACE=1 \
              SNESRECOMP_INPUT_FILE="$input" \
              SNESRECOMP_DUMP_DIR="$OUT/dumps" \
              SDL_AUDIODRIVER=dummy \
              timeout 150s xvfb-run -a "$EXE" "$ROM" --script "$script" \
                >"$OUT/run.log" 2>&1
            done
            local log="$RUNNER_TEMP/widescreen-product-$name-16x9/run.log"
            grep -q "URWS_MARGINS CALIBRATED band=0" "$log"
            grep -q "URWS_MARGINS CALIBRATED band=1" "$log"
            if grep -q "URWS_MARGINS LOST" "$log"; then
              grep "URWS_MARGINS" "$log"
              echo "::error::$name margin presenter lost its course calibration"
              exit 1
            fi
          }

          split_route vs \
            "$GITHUB_WORKSPACE/tests/input/vs-first-race.input" \
            "$GITHUB_WORKSPACE/tests/input/vs-first-race-observe.script"
          grep -q "URWS_VS_MATERIALIZER margin=48 player=1 calibrated=1" \
            "$RUNNER_TEMP/widescreen-product-vs-16x9/run.log"
          python3 tools/check_widescreen_product_parity.py \
            --stock-dumps "$RUNNER_TEMP/widescreen-product-vs-original/dumps" \
            --wide-dumps "$RUNNER_TEMP/widescreen-product-vs-16x9/dumps" \
            --checkpoint vs-race-1240 \
            --checkpoint vs-race-1340 \
            --checkpoint vs-race-1620 \
            --out "$RUNNER_TEMP/widescreen-product-vs-parity.json"

          split_route two-player \
            "$GITHUB_WORKSPACE/tests/input/two-player-first-race.input" \
            "$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"
          python3 tools/check_widescreen_product_parity.py \
            --stock-dumps "$RUNNER_TEMP/widescreen-product-two-player-original/dumps" \
            --wide-dumps "$RUNNER_TEMP/widescreen-product-two-player-16x9/dumps" \
            --checkpoint two-player-race-1220 \
            --checkpoint two-player-race-1420 \
            --checkpoint two-player-both-post-1620 \
            --out "$RUNNER_TEMP/widescreen-product-two-player-parity.json"

          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, struct, sys
          root = pathlib.Path(sys.argv[1])
          def dims(path):
              raw = path.read_bytes()
              return struct.unpack_from("<i", raw, 18)[0], abs(struct.unpack_from("<i", raw, 22)[0])
          checks = {
              "vs": ("vs-race-1240", "vs-race-1340", "vs-race-1620"),
              "two-player": ("two-player-race-1220", "two-player-race-1420", "two-player-both-post-1620"),
          }
          for name, tags in checks.items():
              for tag in tags:
                  d = dims(root / f"widescreen-product-{name}-16x9/dumps/{tag}.fb.bmp")
                  if d != (342, 224):
                      raise SystemExit(f"{name}/{tag} did not widen to 342x224: {d}")
          print("WIDESCREEN_PRODUCT_SPLIT widened=342x224")
          PY

          rm -rf "$SAVES"
          if [ -d "$RUNNER_TEMP/ws-saves-post" ]; then cp -a "$RUNNER_TEMP/ws-saves-post" "$SAVES"; fi

      - name: Build display-geometry review
        shell: bash
        run: |

name: One-shot audio block SPC correlation

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/correlate_audio_blocks_spc.py"
      - ".github/workflows/audio-block-spc-correlation.yml"

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Acquire and verify public SPC archive transiently
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fi.zophar.net/soundfiles/nintendo-snes-spc/uniracers/Uniracers%20%28EMU%29.zophar.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/uniracers-spc.zip"
          python3 - "$RUNNER_TEMP/uniracers-spc.zip" <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          raw=p.read_bytes()
          assert len(raw)==491821, len(raw)
          assert hashlib.sha256(raw).hexdigest()=="85a3f00cfe46cddd18caa714374ef54da6835f0d293557ce499de352b8d4fdb0"
          print("SPC archive fingerprint verified")
          PY
      - name: Correlate omitted package blocks with SPC RAM
        run: |
          python3 tools/correlate_audio_blocks_spc.py             "reference/roms/retail/Uniracers_USA.sfc"             "$RUNNER_TEMP/uniracers-spc.zip"             --json-out audio-block-spc-correlation.json
          cat audio-block-spc-correlation.json
      - uses: actions/upload-artifact@v4
        with:
          name: audio-block-spc-correlation
          path: audio-block-spc-correlation.json

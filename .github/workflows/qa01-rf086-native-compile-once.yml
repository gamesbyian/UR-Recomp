name: RF086 one-shot pinned native compile proof (temporary)

# One bounded PR-only compile, not a recurring campaign or release gate.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/qa01-rf086-native-compile-once.yml

permissions:
  contents: read

jobs:
  pinned-native-compile:
    if: ${{ github.event.pull_request.number == 2717 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned Baldosa research guest
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Patch actual pinned C sources and compile/link
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PR_HEAD=${{ github.event.pull_request.head.sha }}"
            echo "CHECKOUT=$(git rev-parse HEAD)"
            echo "BALDOSA=$(git -C baldosa rev-parse HEAD)"
            echo "FRAMEWORK=$(git -C baldosa/snesrecomp rev-parse HEAD)"
            test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
            test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
            python3 -m unittest discover -s tests/unit -p test_qa01_rf084_native_sound_dp_committed_writer.py
            python3 -m unittest discover -s tests/unit -p test_qa01_rf086_native_first_boundary.py
            python3 tools/qa01_rf084_native_sound_dp_committed_writer.py --root baldosa
            python3 tools/qa01_rf086_native_first_boundary_commit.py --root baldosa
            sha256sum baldosa/src/gen/bank82_part00_v2.c baldosa/snesrecomp/runner/src/cpu_state.c
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get install -y --no-install-recommends ninja-build pkg-config build-essential cmake libsdl2-dev libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl-dev libgles-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
            cmake -S baldosa -B baldosa/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
            cmake --build baldosa/build --target UniracersSNESRecomp -j3
            file baldosa/build/UniracersSNESRecomp
            sha256sum baldosa/build/UniracersSNESRecomp
          } 2>&1 | tee "$RUNNER_TEMP/rf086-native-compile.log"
      - name: Preserve exact compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf086-pinned-native-compile-2717
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/rf086-native-compile.log

name: One-shot QA-01 RF-017 Zoo unmasked WRAM discriminator
# Disposable PR-triggered experiment. Delete this file after its one run.
# Uses the existing manual/callable campaign; no second build or event oracle.
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/qa01-zoo-wram-one-shot.yml

permissions:
  contents: read

jobs:
  zoo-rf017-firstdiff:
    if: github.head_ref == 'qa01-zoo-wram-firstdiff-20261015'
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      zoo_terminal_phase: true
      source_followthrough: true
      zoo_next_bowl: true
      baldosa_refresh_beam_rate: true
      baldosa_io_clock_order: true
      qa01_cold_guest_reload: true

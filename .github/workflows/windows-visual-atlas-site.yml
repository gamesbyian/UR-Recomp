name: Windows Visual Atlas (publish static site)
on:
  push:
    branches: [main]
    paths:
      - "analysis/windows-visual-atlas.json"
      - "tools/windows_visual_atlas.py"
      - "tools/windows_visual_atlas_intake.py"
      - "tools/visual_atlas_web/**"
      - "tools/art/model-review/**"
      - "tools/art/build_racer_source_pixel_corpus.py"
      - "tools/art/racer_source_pixels.py"
      - "analysis/data/racer-hd-replacement-prototype.json"
      - "media/showcase/art-reconstruction/2026-10-10/stock/**"
      - "media/showcase/art-reconstruction/2026-10-10/inputs-p*.json"
      - "media/windows-visual-atlas/approved/**"
      - "media/showcase/2026-10-20/graphpaper-final/cards/**"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages (only if Pages Actions source is configured)"
        type: boolean
        default: false
      include_experimental_model:
        description: "Build latest five-pose unapproved draft GLB for the model review route (expensive opt-in)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ur-atlas-static-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate inventory and reuse source-approved incidental captures
        run: |
          set -euo pipefail
          python3 tools/windows_visual_atlas.py validate
          python3 tools/windows_visual_atlas.py build --out "$RUNNER_TEMP/atlas-site"
          python3 - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"atlas-site/atlas.json").read_text())
          counts=report["counts"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Windows Visual Atlas (static snapshot)\n")
              f.write("Source `"+os.environ["GITHUB_SHA"]+"`\n\n")
              for name,amount in counts.items():
                  f.write(f"- {name}: {amount}\n")
              f.write("\nThis site contains current-source engineering captures or distinct COMING SOON plates; no hardware/visual/release approval.\n")
          PY
      - name: Check out existing five-part draft rig only on explicit manual opt-in
        if: github.event_name == 'workflow_dispatch' && inputs.include_experimental_model == true
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/UR-Recomp
          ref: graphics/art4k-part-addressable-rig-20261029
          path: candidate-rig
          persist-credentials: false
      - name: Prepare isolated, offline-authoring-only GLB dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.include_experimental_model == true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python3 -m venv "$RUNNER_TEMP/rig-venv"
          "$RUNNER_TEMP/rig-venv/bin/python" -m pip install 'numpy==1.26.4' 'trimesh==4.5.3'
      - name: Generate and verify the five exact source-owned blockout poses
        if: github.event_name == 'workflow_dispatch' && inputs.include_experimental_model == true
        run: |
          set -euo pipefail
          source_commit="$(git -C candidate-rig rev-parse HEAD)"
          for pose in upright pedal wheelie stunt bank; do
            "$RUNNER_TEMP/rig-venv/bin/python" \
              candidate-rig/tools/art/export_articulated_unicycle.py \
              candidate-rig/tools/art/candidates/unicycle_shared_rig.scad \
              "$RUNNER_TEMP/model-exports/$pose" --rig-pose "$pose" --timeout 120
          done
          python3 tools/art/model-review/stage_pages.py \
            --exports "$RUNNER_TEMP/model-exports" \
            --site "$RUNNER_TEMP/atlas-site" \
            --source-commit "$source_commit"
          {
            echo "### Experimental 3D model review"
            echo "Rig source: \`$source_commit\`"
            echo "Five exported procedural studies; no original likeness or release approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain independent browser-ready site (without copyrighted ROM)
        uses: actions/upload-artifact@v4
        with:
          name: ur-windows-visual-atlas-latest-site
          path: ${{ runner.temp }}/atlas-site/
          retention-days: 30
          if-no-files-found: error
      - name: Stage Pages only on explicit dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/atlas-site/
  publish-pages:
    needs: assemble-site
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

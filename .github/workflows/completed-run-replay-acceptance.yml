name: Completed run replay acceptance

on:
  workflow_dispatch:

concurrency:
  group: completed-run-replay-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install focused desktop build dependencies
        shell: bash
        run: |
          cmake --version
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM and unit contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 -m unittest tests.unit.test_completed_run_record_cpp tests.unit.test_completed_run_record_process tests.unit.test_completed_run_capture_cpp tests.unit.test_completed_run_comparison_cpp tests.unit.test_completed_run_presentation_cpp tests.unit.test_completed_run_store_cpp tests.unit.test_completed_run_catalog_cpp tests.unit.test_completed_run_browser_cpp tests.unit.test_completed_run_replay_cpp tests.unit.test_completed_run_ghost_cpp tests.unit.test_completed_run_ghost_policy_cpp tests.unit.test_completed_run_ghost_world_sample_cpp tests.unit.test_completed_run_ghost_projection_cpp tests.unit.test_completed_run_ghost_frame_cpp tests.unit.test_completed_run_ghost_racer_selector_cpp tests.unit.test_completed_run_ghost_raster_cpp tests.unit.test_completed_run_ghost_trace_cpp tests.unit.test_uniracers_course_identity_cpp tests.unit.test_uniracers_course_identity_corpus tests.unit.test_uniracers_run_data_cpp

      - name: Stage framework and SDL3
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          python3 tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only

      - name: Scaffold and build modern native host
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-run-replay"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK"             sh "$FRAMEWORK/tools/new_project/setup_project.sh"               --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"               --dir "$TMP"               --name "Uniracers"               --players 2               --yes               --no-ci               --no-fetch-boxart               --no-recomp-ui               --no-netplay               --no-github               --no-submodules               --no-generate               --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 "$GITHUB_WORKSPACE/tools/prepare_native_widescreen_product.py"             --framework "$FRAMEWORK"             --project "$ROOT"             --rom "$ROM"             --json-out "$RUNNER_TEMP/widescreen-product-prepare.json"
          python3 "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py"             "$ROOT/src/main.c"             --game-rtl "$ROOT/src/game_rtl.c"             --cmake "$ROOT/CMakeLists.txt"

          grep -q "completed_run_record.cpp" "$ROOT/CMakeLists.txt"
          grep -q "uniracers_course_identity.cpp" "$ROOT/CMakeLists.txt"

          cmake -S "$ROOT" -B "$ROOT/build"             -DCMAKE_BUILD_TYPE=Release             -DSNESRECOMP_ROOT="$FRAMEWORK"             -DSNESRECOMP_SDL_BACKEND=SDL3             -DSNESRECOMP_SDL3_FETCH=ON             -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Enable unpaced deterministic CI host
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          printf '[General]\nDisableFrameDelay = 1\n' > "$ROOT/build/config.ini"
          grep -Fq 'DisableFrameDelay = 1' "$ROOT/build/config.ini"

      - name: Capture completed Dragster run
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          RECORD="$RUNNER_TEMP/original.urrun"
          LOG="$RUNNER_TEMP/original.log"

          SDL_AUDIODRIVER=dummy \
          UR_RUN_RECORD_CAPTURE_PATH="$RECORD" \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/race-finish-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          test -s "$RECORD"
          test -s "$RECORD.input"
          test -s "$RECORD.urghost"
          grep -q "UR_RUN_RECORD CAPTURED" "$LOG"
          grep -q "course=course:01" "$LOG"
          grep -q "ghost_trace=1" "$LOG"

          # Keep one paced control in this gate until retained CI evidence
          # demonstrates that unpaced execution is stable for this acceptance.
          PACED_USER="$RUNNER_TEMP/completed-run-paced-user"
          PACED_RECORD="$RUNNER_TEMP/paced-proof.urrun"
          PACED_LOG="$RUNNER_TEMP/paced-proof.log"
          mkdir -p "$PACED_USER"
          printf '[General]\nDisableFrameDelay = 0\n' > "$PACED_USER/config.ini"
          SDL_AUDIODRIVER=dummy \
          SNESRECOMP_USER_DATA_DIR="$PACED_USER" \
          UR_RUN_RECORD_CAPTURE_PATH="$PACED_RECORD" \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/race-finish-dragster.script" \
              >"$PACED_LOG" 2>&1
          cat "$PACED_LOG"
          test -s "$PACED_RECORD"

          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I "$GITHUB_WORKSPACE/native/product" \
            "$GITHUB_WORKSPACE/native/product/completed_run_record.cpp" \
            "$GITHUB_WORKSPACE/tests/native/completed_run_replay_compare.cpp" \
            -o "$RUNNER_TEMP/compare-runs"
          "$RUNNER_TEMP/compare-runs" "$PACED_RECORD" "$RECORD" \
            | tee "$RUNNER_TEMP/paced-unpaced-compare.log"
          grep -q "UR_RUN_REPLAY_COMPARE PASS course=course:01" \
            "$RUNNER_TEMP/paced-unpaced-compare.log"
          echo "UR_COMPLETED_RUN_UNPACED_PROOF=semantic_record_equal"

      - name: Rehydrate replay input from saved artifact
        shell: bash
        run: |
          set -euo pipefail
          # The recorder's .input sidecar is acceptance-only. Shipping Local Runs
          # regenerates this stream from the persisted .urrun, so prove the
          # same bytes emerge in a fresh process before native guest replay.
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I "$GITHUB_WORKSPACE/native/product" \
            "$GITHUB_WORKSPACE/native/product/completed_run_record.cpp" \
            "$GITHUB_WORKSPACE/native/product/completed_run_replay.cpp" \
            "$GITHUB_WORKSPACE/tests/native/completed_run_replay_rehydrate.cpp" \
            -o "$RUNNER_TEMP/rehydrate-completed-run"
          "$RUNNER_TEMP/rehydrate-completed-run" \
            "$RUNNER_TEMP/original.urrun" \
            "$RUNNER_TEMP/rehydrated.input" \
            | tee "$RUNNER_TEMP/rehydrate.log"
          cmp "$RUNNER_TEMP/original.urrun.input" "$RUNNER_TEMP/rehydrated.input"
          grep -q "UR_RUN_REPLAY_REHYDRATE PASS course=course:01" \
            "$RUNNER_TEMP/rehydrate.log"

      - name: Re-drive captured run in a fresh process
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          REPLAYED="$RUNNER_TEMP/replayed.urrun"
          LOG="$RUNNER_TEMP/replayed.log"

          SDL_AUDIODRIVER=dummy           SNESRECOMP_INPUT_FILE="$RUNNER_TEMP/rehydrated.input"           SNESRECOMP_INPUT_RELATIVE=1           UR_RUN_RECORD_CAPTURE_PATH="$REPLAYED"           UR_RUN_GHOST_ACCEPTANCE_RECORD="$ORIGINAL"           UR_RUN_GHOST_ACCEPTANCE_TARGET=previous           UR_RUN_GHOST_DRAW_DIAGNOSTICS=1           UR_PRODUCT_DIAGNOSTICS=1             timeout 180s xvfb-run -a "$EXE" "$ROM"               --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script"               >"$LOG" 2>&1

          cat "$LOG"
          test -s "$REPLAYED"
          test -s "$REPLAYED.urghost"
          grep -q "UR_RUN_RECORD CAPTURED" "$LOG"
          grep -q "ghost_trace=1" "$LOG"
          grep -q "UR_RUN_GHOST DRAWN" "$LOG"
          grep -q "script .* dump replay-race-results ok" "$LOG"

          test -x "$RUNNER_TEMP/compare-runs"
          "$RUNNER_TEMP/compare-runs" "$ORIGINAL" "$REPLAYED" | tee "$RUNNER_TEMP/compare.log"
          grep -q "UR_RUN_REPLAY_COMPARE PASS course=course:01" "$RUNNER_TEMP/compare.log"

          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I "$GITHUB_WORKSPACE/native/product" \
            "$GITHUB_WORKSPACE/native/product/completed_run_record.cpp" \
            "$GITHUB_WORKSPACE/native/product/completed_run_ghost.cpp" \
            "$GITHUB_WORKSPACE/native/product/completed_run_ghost_trace.cpp" \
            "$GITHUB_WORKSPACE/tests/native/completed_run_ghost_trace_check.cpp" \
            -o "$RUNNER_TEMP/check-ghost-trace"
          "$RUNNER_TEMP/check-ghost-trace" "$ORIGINAL" "$ORIGINAL.urghost" | tee "$RUNNER_TEMP/original-ghost-trace.log"
          "$RUNNER_TEMP/check-ghost-trace" "$REPLAYED" "$REPLAYED.urghost" | tee "$RUNNER_TEMP/replayed-ghost-trace.log"
          grep -q "UR_RUN_GHOST_TRACE_CHECK PASS course=course:01" "$RUNNER_TEMP/original-ghost-trace.log"
          grep -q "UR_RUN_GHOST_TRACE_CHECK PASS course=course:01" "$RUNNER_TEMP/replayed-ghost-trace.log"

          # Bound checksums prove trace integrity, not deterministic replay.
          # Assert original vs fresh-process P1 world/pitch trajectory parity.
          # Report separately any cosmetic P1 pose / P2-context differences:
          # replay input alone does not guarantee stock presentation RNG.
          # A single transitional terminal lifecycle sample may differ.
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I "$GITHUB_WORKSPACE/native/product" \
            -I "$GITHUB_WORKSPACE/tests/native" \
            "$GITHUB_WORKSPACE/native/product/completed_run_record.cpp" \
            "$GITHUB_WORKSPACE/native/product/completed_run_ghost.cpp" \
            "$GITHUB_WORKSPACE/native/product/completed_run_ghost_trace.cpp" \
            "$GITHUB_WORKSPACE/tests/native/completed_run_ghost_trace_compare.cpp" \
            -o "$RUNNER_TEMP/compare-ghost-traces"
          "$RUNNER_TEMP/compare-ghost-traces" \
            "$ORIGINAL" "$ORIGINAL.urghost" \
            "$REPLAYED" "$REPLAYED.urghost" \
            | tee "$RUNNER_TEMP/ghost-world-equivalence.log"
          grep -q "UR_RUN_GHOST_TRACE_COMPARE PASS course=course:01" \
            "$RUNNER_TEMP/ghost-world-equivalence.log"

      - name: Re-drive identical saved run under alternate Modern presentation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          ALTERNATE="$RUNNER_TEMP/alternate-presentation.urrun"
          LOG="$RUNNER_TEMP/alternate-presentation.log"
          STATE="$RUNNER_TEMP/alternate-presentation-host-state.txt"

          # The versioned product state is host-only: no alternate replay,
          # input format, frame clock, course selector or guest memory edits.
          # Contrast stock 4x/4:3/VSync-on with 1x/16:9/VSync-off. Preserve
          # the same previously rehydrated .urrun controller stream.
          printf '%s\n' \
            'UR-HOST-STATE/6' \
            'profile=' \
            'regional_presentation=north_america' \
            'pause_on_focus_loss=1' \
            'vibration_enabled=1' \
            'display_mode=windowed' \
            'vsync=off' \
            'presentation_fps=game' \
            'output_resolution=native' \
            'widescreen=16x9' \
            'internal_render_scale=1x' \
            > "$STATE"

          SDL_AUDIODRIVER=dummy \
          UR_HOST_STATE_PATH="$STATE" \
          SNESRECOMP_INPUT_FILE="$RUNNER_TEMP/rehydrated.input" \
          SNESRECOMP_INPUT_RELATIVE=1 \
          UR_RUN_RECORD_CAPTURE_PATH="$ALTERNATE" \
          UR_RUN_GHOST_ACCEPTANCE_RECORD="$ORIGINAL" \
          UR_RUN_GHOST_ACCEPTANCE_TARGET=previous \
          UR_RUN_GHOST_DRAW_DIAGNOSTICS=1 \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              > "$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_HOST_STATE LOADED .*widescreen=16x9 internal_render_scale=1x" "$LOG"
          grep -q "UR_RENDER_SCALE APPLIED scale=1x" "$LOG"
          grep -q "UR_RUN_GHOST DRAWN" "$LOG"
          grep -q "UR_RUN_RECORD CAPTURED" "$LOG"
          test -s "$ALTERNATE"
          test -s "$ALTERNATE.urghost"
          "$RUNNER_TEMP/compare-runs" "$ORIGINAL" "$ALTERNATE" \
            | tee "$RUNNER_TEMP/alternate-presentation-run-compare.log"
          "$RUNNER_TEMP/compare-ghost-traces" \
            "$ORIGINAL" "$ORIGINAL.urghost" \
            "$ALTERNATE" "$ALTERNATE.urghost" \
            | tee "$RUNNER_TEMP/alternate-presentation-ghost-compare.log"
          grep -q "UR_RUN_REPLAY_COMPARE PASS course=course:01" \
            "$RUNNER_TEMP/alternate-presentation-run-compare.log"
          grep -q "UR_RUN_GHOST_TRACE_COMPARE PASS course=course:01" \
            "$RUNNER_TEMP/alternate-presentation-ghost-compare.log"

      - name: Launch stored run through Local Runs browser
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          RUNS="$RUNNER_TEMP/browser-runs"
          LOG="$RUNNER_TEMP/browser-replay.log"

          mkdir -p "$RUNS"
          cp "$ORIGINAL" "$RUNS/run-0001.urrun"
          python3 - "$ORIGINAL" "$RUNS/run-0002.urrun" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_bytes()
          marker = b"checksum "
          pos = source.rfind(marker)
          if pos < 0:
              raise SystemExit("captured record has no checksum")
          damaged = bytearray(source)
          index = pos + len(marker)
          damaged[index] = ord("1") if damaged[index] != ord("1") else ord("0")
          pathlib.Path(sys.argv[2]).write_bytes(damaged)
          PY

          SDL_AUDIODRIVER=dummy \
          UR_RUN_BROWSER_ACCEPTANCE=quit-after-return \
          UR_RUN_BROWSER_DIRECTORY="$RUNS" \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_RUN_BROWSER OPENED entries=2 playable=1" "$LOG"
          grep -q "UR_RUN_BROWSER ENTRY index=0 order=2 status=CORRUPT playable=0" "$LOG"
          grep -q "UR_RUN_BROWSER ENTRY index=1 order=1 status=PLAYABLE playable=1" "$LOG"
          grep -q "UR_RUN_BROWSER ACCEPTANCE_TRIGGER pause=1 opened=1 launched=1" "$LOG"
          grep -q "UR_RUN_BROWSER REPLAY_LAUNCHED" "$LOG"
          grep -q "UR_RUN_BROWSER REPLAY_RETURNED" "$LOG"

          test "$(find "$RUNS" -maxdepth 1 -name '*.urrun' -type f | wc -l)" -eq 2

      - name: Open profile-wide Records Runs/Replays surface
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          RUNS="$RUNNER_TEMP/records-runs"
          LOG="$RUNNER_TEMP/records-browser.log"

          mkdir -p "$RUNS"
          cp "$ORIGINAL" "$RUNS/run-0001.urrun"
          cp "$ORIGINAL" "$RUNS/run-0002.urrun"
          python3 - "$RUNS/run-0002.urrun" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          marker = data.rfind(b"checksum ")
          if marker < 0:
              raise SystemExit("missing checksum marker")
          pos = marker + len(b"checksum ")
          data[pos] = ord("1") if data[pos] != ord("1") else ord("0")
          path.write_bytes(data)
          PY

          SDL_AUDIODRIVER=dummy \
          UR_RECORDS_BROWSER_ACCEPTANCE=quit-after-open \
          UR_RUN_BROWSER_DIRECTORY="$RUNS" \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_RECORDS_BROWSER OPENED courses=1 runs=1 unavailable=1" "$LOG"
          grep -q "UR_RECORDS_BROWSER COURSE course=course:01 runs=1" "$LOG"
          grep -q "UR_RECORDS_BROWSER ACCEPTANCE_TRIGGER pause=1 opened=1 drilled=1 detail=1 current_course=1 courses=1 runs=1" "$LOG"
          grep -Eq "UR_RECORDS_BROWSER ACCEPTANCE_TRIGGER .* finish=[0-9]+:[0-9]{2}\.[0-9]{2}/60 delta=\+0:00\.00/60 .*target_changed=1 split_target=PREVIOUS" "$LOG"
          if grep -q "UR_RUN_BROWSER REPLAY_LAUNCHED" "$LOG"; then
            echo "::error::Profile-wide Records surface launched replay directly"
            exit 1
          fi

      - name: Resolve Records through custom user-data root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          USER_ROOT="$RUNNER_TEMP/records-user-data-root"
          RUNS="$USER_ROOT/runs/default"
          LOG="$RUNNER_TEMP/records-user-data-root.log"

          mkdir -p "$RUNS"
          cp "$ORIGINAL" "$RUNS/run-0001.urrun"

          SDL_AUDIODRIVER=dummy \
          UR_RECOMP_USER_DATA_ROOT="$USER_ROOT" \
          UR_RECORDS_BROWSER_ACCEPTANCE=quit-after-open \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_RECORDS_BROWSER OPENED courses=1 runs=1 unavailable=0 profile=default" "$LOG"
          grep -q "UR_RECORDS_BROWSER ACCEPTANCE_TRIGGER pause=1 opened=1 drilled=1 detail=1 current_course=1 courses=1 runs=1" "$LOG"

      - name: Browse profile-owned Records read-only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          USER_ROOT="$RUNNER_TEMP/records-profiles-root"
          LOG="$RUNNER_TEMP/records-profiles.log"

          mkdir -p "$USER_ROOT/runs/alpha" "$USER_ROOT/runs/beta"
          printf "UR-PROFILE-CATALOG/1\nalpha|3|ALPHA\nbeta|4|BETA\n" > "$USER_ROOT/profiles-v1.txt"
          cp "$ORIGINAL" "$USER_ROOT/runs/alpha/run-0001.urrun"
          printf "not a completed run\n" > "$USER_ROOT/runs/alpha/run-bad.urrun"
          cp "$ORIGINAL" "$USER_ROOT/runs/beta/run-0001.urrun"

          SDL_AUDIODRIVER=dummy \
          UR_RECOMP_USER_DATA_ROOT="$USER_ROOT" \
          UR_RECORDS_BROWSER_ACCEPTANCE=profiles \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_RECORDS_BROWSER OPENED courses=0 runs=0 unavailable=0 profile=default profiles=2 profiles_available=1 profile_unavailable=1" "$LOG"
          grep -q "UR_RECORDS_BROWSER PROFILE_OPEN profile=alpha runs=1 tracks=1 active=0" "$LOG"
          grep -q "UR_RECORDS_BROWSER PROFILES_ACCEPTANCE pause=1 opened=1 profiles_opened=1 profiles=2 drilled=1 profile=alpha tracks=1 runs=1 handoff_allowed=0 returned=1" "$LOG"

      - name: Fail closed on malformed profile catalog
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          USER_ROOT="$RUNNER_TEMP/records-malformed-profiles-root"
          LOG="$RUNNER_TEMP/records-malformed-profiles.log"

          mkdir -p "$USER_ROOT/runs/default"
          printf "not a profile catalog\n" > "$USER_ROOT/profiles-v1.txt"
          cp "$ORIGINAL" "$USER_ROOT/runs/default/run-0001.urrun"

          SDL_AUDIODRIVER=dummy \
          UR_RECOMP_USER_DATA_ROOT="$USER_ROOT" \
          UR_RECORDS_BROWSER_ACCEPTANCE=profiles-malformed \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_RECORDS_BROWSER OPENED courses=1 runs=1 unavailable=0 profile=default profiles=0 profiles_available=0" "$LOG"
          grep -q "UR_RECORDS_BROWSER PROFILES_MALFORMED pause=1 opened=1 tracks_preserved=1 runs=1 profiles_failed_closed=1 profiles_opened=1" "$LOG"

      - name: Open Records through pause menu
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          RUNS="$RUNNER_TEMP/pause-records-runs"
          LOG="$RUNNER_TEMP/pause-records.log"

          mkdir -p "$RUNS"
          cp "$ORIGINAL" "$RUNS/run-0001.urrun"

          SDL_AUDIODRIVER=dummy \
          UR_PAUSE_RECORDS_ACCEPTANCE=1 \
          UR_RUN_BROWSER_DIRECTORY="$RUNS" \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_PAUSE_RECORDS ACCEPTANCE_TRIGGER .* selected=1 opened=1" "$LOG"
          grep -q "UR_RECORDS_BROWSER OPENED_FROM_PAUSE_MENU" "$LOG"
          grep -q "UR_RECORDS_BROWSER OPENED courses=1 runs=1 unavailable=0" "$LOG"

      - name: Open Records directly from results
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-run-replay/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          ORIGINAL="$RUNNER_TEMP/original.urrun"
          RUNS="$RUNNER_TEMP/results-records-runs"
          LOG="$RUNNER_TEMP/results-records.log"

          mkdir -p "$RUNS"
          cp "$ORIGINAL" "$RUNS/run-0001.urrun"

          SDL_AUDIODRIVER=dummy \
          UR_RECORDS_BROWSER_ACCEPTANCE=results-shortcut \
          UR_RUN_BROWSER_DIRECTORY="$RUNS" \
          UR_PRODUCT_DIAGNOSTICS=1 \
            timeout 180s xvfb-run -a "$EXE" "$ROM" \
              --script "$GITHUB_WORKSPACE/tests/input/completed-run-replay-dragster.script" \
              >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_RECORDS_BROWSER OPENED_FROM_RESULTS" "$LOG"
          grep -q "UR_RECORDS_BROWSER RESULTS_SHORTCUT opened=1 paused=1 courses=1 runs=1" "$LOG"
          if grep -q "UR_RUN_BROWSER REPLAY_LAUNCHED" "$LOG"; then
            echo "::error::Results Records shortcut launched replay directly"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completed-run-replay-acceptance
          path: |
            ${{ runner.temp }}/original.urrun
            ${{ runner.temp }}/original.urrun.input
            ${{ runner.temp }}/rehydrated.input
            ${{ runner.temp }}/rehydrate.log
            ${{ runner.temp }}/original.urrun.urghost
            ${{ runner.temp }}/replayed.urrun
            ${{ runner.temp }}/replayed.urrun.urghost
            ${{ runner.temp }}/original.log
            ${{ runner.temp }}/paced-proof.log
            ${{ runner.temp }}/paced-unpaced-compare.log
            ${{ runner.temp }}/replayed.log
            ${{ runner.temp }}/browser-replay.log
            ${{ runner.temp }}/records-browser.log
            ${{ runner.temp }}/records-user-data-root.log
            ${{ runner.temp }}/pause-records.log
            ${{ runner.temp }}/records-profiles.log
            ${{ runner.temp }}/records-malformed-profiles.log
            ${{ runner.temp }}/results-records.log
            ${{ runner.temp }}/compare.log
            ${{ runner.temp }}/original-ghost-trace.log
            ${{ runner.temp }}/replayed-ghost-trace.log
            ${{ runner.temp }}/ghost-world-equivalence.log
            ${{ runner.temp }}/alternate-presentation.urrun
            ${{ runner.temp }}/alternate-presentation.urrun.urghost
            ${{ runner.temp }}/alternate-presentation.log
            ${{ runner.temp }}/alternate-presentation-run-compare.log
            ${{ runner.temp }}/alternate-presentation-ghost-compare.log
          if-no-files-found: warn
          retention-days: 7

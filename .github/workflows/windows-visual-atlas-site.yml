name: Windows Visual Atlas (publish static site)
on:
  push:
    branches: [main]
    paths:
      - "analysis/windows-visual-atlas.json"
      - "tools/windows_visual_atlas.py"
      - "tools/windows_visual_atlas_intake.py"
      - "tools/visual_atlas_web/**"
      - "tools/contributor_gallery/**"
      - "docs/contributors/**"
      - "assets/branding/**"
      - "tools/art/model-review/**"
      - "tools/art/build_racer_source_pixel_corpus.py"
      - "tools/art/racer_source_pixels.py"
      - "analysis/data/racer-hd-replacement-prototype.json"
      - "media/showcase/art-reconstruction/2026-10-10/stock/**"
      - "media/showcase/art-reconstruction/2026-10-10/inputs-p*.json"
      - "media/windows-visual-atlas/approved/**"
      - "media/showcase/2026-10-20/graphpaper-final/cards/**"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages (only if Pages Actions source is configured)"
        type: boolean
        default: false
      include_experimental_model:
        description: "Build five-pose unapproved authoring model from exact checked-out main (expensive opt-in)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ur-atlas-static-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble-site:
    outputs:
      contributor_publish: ${{ steps.gallery-change.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect first-party contributor-gallery publication change
        id: gallery-change
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then exit 0; fi
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "No trustworthy previous commit; manual Pages dispatch remains available"
            exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" -- |
            grep -Eq '^(tools/contributor_gallery/|docs/contributors/|assets/branding/concepts/)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate inventory and reuse source-approved incidental captures
        run: |
          set -euo pipefail
          python3 tools/windows_visual_atlas.py validate
          python3 tools/windows_visual_atlas.py build --out "$RUNNER_TEMP/atlas-site"
          python3 - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"atlas-site/atlas.json").read_text())
          counts=report["counts"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Windows Visual Atlas (static snapshot)\n")
              f.write("Source `"+os.environ["GITHUB_SHA"]+"`\n\n")
              for name,amount in counts.items():
                  f.write(f"- {name}: {amount}\n")
              f.write("\nThis site contains current-source engineering captures or distinct COMING SOON plates; no hardware/visual/release approval.\n")
          PY
      - name: Prepare isolated, offline-authoring-only GLB dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.include_experimental_model == true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python3 -m venv "$RUNNER_TEMP/rig-venv"
          "$RUNNER_TEMP/rig-venv/bin/python" -m pip install 'numpy==1.26.4' 'trimesh==4.5.3' 'scipy==1.14.1' 'pillow==11.1.0'
      - name: Generate and verify the five exact source-owned blockout poses
        if: github.event_name == 'workflow_dispatch' && inputs.include_experimental_model == true
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          for pose in upright pedal wheelie stunt bank; do
            "$RUNNER_TEMP/rig-venv/bin/python" \
              tools/art/export_articulated_unicycle.py \
              tools/art/candidates/unicycle_shared_rig.scad \
              "$RUNNER_TEMP/model-exports/$pose" --rig-pose "$pose" --timeout 120
          done
          python3 tools/art/model-review/stage_pages.py \
            --exports "$RUNNER_TEMP/model-exports" \
            --site "$RUNNER_TEMP/atlas-site" \
            --source-commit "$source_commit"
          {
            echo "### Experimental 3D model review"
            echo "Rig source: \`$source_commit\`"
            echo "Five exact-main experimental authoring studies; no original likeness or release approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate source-verified measurements for the explicitly opted-in model
        if: github.event_name == 'workflow_dispatch' && inputs.include_experimental_model == true
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rig-venv/bin/python" tools/art/prepare_model_review_measurement_sidecar.py \
            --model-review-dir "$RUNNER_TEMP/atlas-site/model-review" \
            --camera analysis/data/racer-inverse-side-provisional-1205.json \
            --out "$RUNNER_TEMP/model-measurements.json"
          # Only this opt-in path publishes a measurement packet. It was
          # produced from the exact staged GLBs and sprite rail and checked
          # against both manifest SHA values. Never publish a stale packet.
          ln "$RUNNER_TEMP/model-measurements.json" \
            "$RUNNER_TEMP/atlas-site/model-review/model-measurements.json"
          {
            echo "Source comparison: verified 32 original frame observations,"
            echo "10 distinct original 2D silhouettes, 5 unpaired GLB poses."
            echo "Provisional camera only; no original pose mapping or art approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Add ROM-free, source-preserving contributor artwork gallery
        run: |
          set -euo pipefail
          python3 tools/contributor_gallery/stage.py --site "$RUNNER_TEMP/atlas-site"
          echo "Contributor gallery: experimental references only; source artwork unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain independent browser-ready site (without copyrighted ROM)
        uses: actions/upload-artifact@v4
        with:
          name: ur-windows-visual-atlas-latest-site
          path: ${{ runner.temp }}/atlas-site/
          retention-days: 30
          if-no-files-found: error
      - name: Stage Pages on explicit dispatch or contributor-gallery main change
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true) || (github.event_name == 'push' && steps.gallery-change.outputs.publish == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/atlas-site/
  publish-pages:
    needs: assemble-site
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true) || (github.event_name == 'push' && needs.assemble-site.outputs.contributor_publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

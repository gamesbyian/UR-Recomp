name: One-shot regional racer-state relations

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/verify_regional_racer_state_relations.py"
      - "tests/unit/test_verify_regional_racer_state_relations.py"
      - ".github/workflows/regional-racer-state-evidence.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Verify regional racer-state relations
        run: python3 tools/verify_regional_racer_state_relations.py
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_verify_regional_racer_state_relations -v
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/regional-racer-state-relations.json analysis/generated/regional-racer-state-relations.md
          git diff --cached --quiet || git commit -m "analysis: record regional racer-state relations"
          git push origin HEAD:${{ github.head_ref }}

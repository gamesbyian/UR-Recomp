name: EC46 structural probe
on:
  push:
    branches:
      - chatgpt/ec46-coordinate-window-island-2026-10-01
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.unit.test_analyze_ec46_coordinate_window_structure_island -v
      - run: python3 tools/analyze_ec46_coordinate_window_structure_island.py
      - uses: actions/upload-artifact@v4
        with:
          name: ec46-coordinate-window-island
          path: |
            analysis/generated/ec46-coordinate-window-structure-island.json
            analysis/generated/ec46-coordinate-window-structure-island.md
          if-no-files-found: error

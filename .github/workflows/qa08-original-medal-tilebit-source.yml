name: QA-08 source original 2014 4bpp medal sprite indexed tile

# Historical source only, two true video callbacks. The original full
# 263-frame 2P reference is an immutable admission guard. No sprite,
# tile, ROM or VRAM binary exported; indexed16 FNV + occupancy only.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qa08-original-medal-tilebit-source.yml"
      - "tools/qa08_patch_original_medal_tilebits.py"
      - "tests/unit/test_qa08_patch_original_medal_tilebits.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snes9x-libretro.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qa08-source-original-medal-tilebits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-7-slots:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1649 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Source pin and exact no-turbo reference route
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          echo "859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478  reference/roms/retail/Uniracers_USA.sfc" | sha256sum -c -
          cmp baldosa/tests/routes/race_2p.txt reference/imported/reverse-engineering/baldosa-uniracers-recomp/tests/routes/race_2p.txt
          python3 -m unittest tests.unit.test_qa08_patch_original_medal_tilebits
          mkdir -p "$RUNNER_TEMP/qa08-source-4bpp/frames"
          grep -v '^turbo ' baldosa/tests/routes/race_2p.txt > "$RUNNER_TEMP/qa08-source-4bpp/original.script"
      - name: Build exact 2014 core with disposable read-only source 4bpp observer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libsdl2-dev
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          python3 tools/qa08_patch_original_medal_tilebits.py \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/libretro.cpp" --apply
          make -C "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro" -j 2
          cmake -S baldosa/snesrecomp/tools/snesref -B "$RUNNER_TEMP/qa08-source-ref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qa08-source-ref" -j 2
      - name: Run one completely unchanged two-player input route
        run: |
          set -euo pipefail
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$RUNNER_TEMP/qa08-source-4bpp/original.script" \
          SNESREF_DUMP_DIR="$RUNNER_TEMP/qa08-source-4bpp" \
          SNESREF_FRAME_DUMP_DIR="$RUNNER_TEMP/qa08-source-4bpp/frames" \
          SNESREF_FRAME_DUMP_NATIVE=1 SNESREF_FRAME_DUMP_FROM=1279 \
          SNESREF_FRAME_DUMP_TO=9503 SNESREF_FRAME_DUMP_STEP=16 \
          UR_QA08_ORIGINAL_MEDAL_TILEBITS=original-2p-4031-4175 \
          timeout 240 "$RUNNER_TEMP/qa08-source-ref/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            > "$RUNNER_TEMP/qa08-source-4bpp/original.log" 2>&1
          python3 tools/qa08_original_twoplayer_fullroute_manifest.py \
            --frames "$RUNNER_TEMP/qa08-source-4bpp/frames" \
            --script "$RUNNER_TEMP/qa08-source-4bpp/original.script" \
            --log "$RUNNER_TEMP/qa08-source-4bpp/original.log" \
            --rom reference/roms/retail/Uniracers_USA.sfc \
            --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            --out "$RUNNER_TEMP/qa08-source-4bpp/manifest.json"
      - name: Certify all 263 unchanged original video frames and exact source masks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/11996107746/zip" \
            -o "$RUNNER_TEMP/qa08-source-4bpp/immutable-original.zip"
          echo "72b7b152d08d8abb3636053bfd132db64926a5bf188f4dbba7e30b20d9583e9e  $RUNNER_TEMP/qa08-source-4bpp/immutable-original.zip" | sha256sum -c -
          python3 tools/qa08_verify_original_medal_tilebits.py \
            --root "$RUNNER_TEMP/qa08-source-4bpp" \
            --original "$RUNNER_TEMP/qa08-source-4bpp/immutable-original.zip" \
            --out "$RUNNER_TEMP/qa08-source-4bpp/verified-indexed16-source.json"
          python3 - "$RUNNER_TEMP/qa08-source-4bpp/verified-indexed16-source.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          z=json.load(open(sys.argv[1]))
          assert z["original_263_full_source_frame_bytes_identical"] is True
          assert z["actual_sampled_original_sprite_slots"]==14
          assert z["actual_sampled_original_pixel_slots"]==10
          assert z["no_full_VRAM_or_game_art_exported"] is True
          with open(sys.argv[2],"a") as o:
              o.write("Source Snes9x original two medal frames: 14 original 16x16 4bpp slot shape fingerprints and 10 original palette-index pixel tests. All 263 original source frames byte-identical. No Windows/hardware or sprite correction acceptance.\n")
          PY
      - name: Retain only small original 4bpp source audit and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa08-original-medal-sprite-4bpp-readonly
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa08-source-4bpp/verified-indexed16-source.json
            ${{ runner.temp }}/qa08-source-4bpp/manifest.json
            ${{ runner.temp }}/qa08-source-4bpp/original.log

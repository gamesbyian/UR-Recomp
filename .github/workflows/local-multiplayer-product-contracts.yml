name: Local multiplayer product contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/product/local_multiplayer_*.hpp"
      - "native/product/local_multiplayer_*.cpp"
      - "native/product/local_tournament_round_robin.hpp"
      - "native/product/local_tournament_fixture_receipt.hpp"
      - "native/product/local_tournament_fixture_launch*.hpp"
      - "tests/native/local_tournament_fixture_launch_test.cpp"
      - "tests/unit/test_local_tournament_fixture_launch_cpp.py"
      - "native/product/multiplayer_match_record.*"
      - "native/product/multiplayer_match_catalog.*"
      - "native/product/multiplayer_match_presentation.*"
      - "native/product/multiplayer_match_browser.*"
      - "native/product/multiplayer_match_summary.*"
      - "tests/native/multiplayer_match_summary_test.cpp"
      - "native/product/run_record_capture_policy.hpp"
      - "tests/native/local_multiplayer_*_test.cpp"
      - "tests/native/local_tournament_round_robin_test.cpp"
      - "tests/native/local_tournament_fixture_receipt_test.cpp"
      - "tests/unit/test_local_tournament_fixture_receipt_cpp.py"
      - "tests/unit/test_local_tournament_round_robin_cpp.py"
      - "tests/native/multiplayer_match_record_test.cpp"
      - "tests/unit/test_local_multiplayer_*_cpp.py"
      - "tests/unit/test_local_multiplayer_host_contract.py"
      - "tests/unit/test_multiplayer_match_record_cpp.py"
      - "tests/unit/test_multiplayer_match_catalog_cpp.py"
      - "tests/unit/test_multiplayer_match_presentation_cpp.py"
      - "tests/unit/test_multiplayer_match_browser_cpp.py"
      - "tests/unit/test_multiplayer_match_summary_cpp.py"
      - "tests/unit/test_run_record_capture_policy_cpp.py"
      - "tests/unit/test_multiplayer_match_capture_host_contract.py"
      - "native/product/uniracers_modern_host.cpp"
      - ".github/workflows/local-multiplayer-product-contracts.yml"

concurrency:
  group: local-multiplayer-product-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Run local multiplayer product contracts
        run: |
          python3 -m unittest \
            tests.unit.test_local_tournament_round_robin_cpp \
            tests.unit.test_local_tournament_fixture_receipt_cpp \
            tests.unit.test_local_tournament_fixture_launch_cpp \
            tests.unit.test_local_multiplayer_setup_cpp \
            tests.unit.test_local_multiplayer_participants_cpp \
            tests.unit.test_local_multiplayer_match_binding_cpp \
            tests.unit.test_multiplayer_match_record_cpp \
            tests.unit.test_multiplayer_match_catalog_cpp \
            tests.unit.test_multiplayer_match_presentation_cpp \
            tests.unit.test_multiplayer_match_browser_cpp \
            tests.unit.test_multiplayer_match_summary_cpp \
            tests.unit.test_run_record_capture_policy_cpp \
            tests.unit.test_multiplayer_match_capture_host_contract \
            tests.unit.test_local_multiplayer_host_contract

name: Repository hygiene

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docs/qa01/REQUEST-ZOO-CAUSAL.md"
      # Source-pinned offline physical report must receive independent hygiene.
      - "docs/playtest/windows-h01-h07-offline.html"
      - "docs/WINDOWS-PLAYTEST-INSTRUCTIONS.md"
      # Source-of-truth progress admissions must receive ready-head hygiene.
      - "docs/progress/**"
      - "AGENTS.md"
      - "docs/README.md"
      - "docs/SYMBOLS.md"
      - "docs/PERIODIC-REPOSITORY-HYGIENE.md"
      - "docs/TOOL-INTEROPERABILITY.md"
      - "reference/**"
      - "analysis/generated/symbols.json"
      - "analysis/generated/*-symbols*"
      - "third_party/**"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check repository boundaries and generated surfaces
        run: python3 tools/check_repo_hygiene.py
      - name: Validate changed workflow files with actionlint
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Query the complete PR file census; avoid a large checkout-history fetch.
          # An API failure must not masquerade as "no changed workflows".
          pr_files="$RUNNER_TEMP/actionlint-pr-files.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$pr_files"
          mapfile -t discovered < <(
            grep -E '^\.github/workflows/[^/]+\.ya?ml$' "$pr_files" || true
          )
          # A deleted YAML file no longer exists in the checkout.
          changed=()
          for path in "${discovered[@]}"; do
            if [[ -f "$path" ]]; then
              changed+=("$path")
            fi
          done
          if (( ${#changed[@]} == 0 )); then
            echo "No workflow definitions changed; actionlint not needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=1.7.12
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$tarball"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$tarball" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "### actionlint: changed workflow definitions" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${changed[@]}" >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -oneline "${changed[@]}"

      - name: Advisory offline zizmor security scan of changed workflow files
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_files="$RUNNER_TEMP/zizmor-pr-files.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$pr_files"
          mapfile -t discovered < <(
            grep -E '^\.github/workflows/[^/]+\.ya?ml$' "$pr_files" || true
          )
          changed=()
          for path in "${discovered[@]}"; do
            if [[ -f "$path" ]]; then changed+=("$path"); fi
          done
          if (( ${#changed[@]} == 0 )); then
            echo "No modified workflow YAML files for zizmor." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=1.31.1
          tarball="$RUNNER_TEMP/zizmor-$version.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/zizmorcore/zizmor/releases/download/v$version/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$tarball"
          printf '%s  %s\n' \
            'd185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99' \
            "$tarball" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/zizmor-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/zizmor-bin" zizmor
          test -x "$RUNNER_TEMP/zizmor-bin/zizmor"
          echo "### zizmor: offline security review of changed workflows" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${changed[@]}" >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/zizmor-bin/zizmor" --offline --min-severity high "${changed[@]}"

name: Modern visual QA native SDL baseline
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/modern-visual-native-win32-capture.yml"
      - "tools/qa_modern_visual_sdl_capture.py"
      - "tools/qa_modern_visual_win32_capture_driver.py"
      - "tools/capture_modern_title_entry_sdl_win32.py"
      - "tools/capture_modern_title_attract_sdl_win32.py"
      - "tests/unit/test_capture_modern_title_attract_sdl_win32.py"
      - "tests/unit/test_capture_modern_title_entry_sdl_win32.py"
      - "tools/qa_modern_motion_final_sdl_pair.py"
      - "tests/unit/test_qa_modern_motion_final_sdl_pair.py"
      - "tools/qa_modern_title_final_sdl_transition.py"
      - "tests/unit/test_qa_modern_title_final_sdl_transition.py"
      - "native/product/modern_title_presenter.hpp"
      # Destination PR #2040 may request actual 4:3/wide native SDL evidence
      # with the existing independent QA driver, not a parallel test runtime.
      - "native/product/modern_native_destination_presenter.hpp"
      - "tools/baldosa_native_modern_root.cpp"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modern-visual-native-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-sdl-root:
    # Independent QA #2041, merged destination owner #2040 or its narrow
    # source-bound follow-up #2117 may trigger genuine Windows SDL captures.
    # These jobs do not grant artwork, controller or release acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 2041 || github.event.pull_request.number == 2040 || github.event.pull_request.number == 2117 || github.head_ref == 'qa/modern-motion-final-sdl-pair-20261020' || github.head_ref == 'qa/modern-title-final-sdl-transition-20261021' || github.event.pull_request.number == 2043
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact visual QA source
        uses: actions/checkout@v4
      - name: Check out pinned Baldosa AOT and SDL framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Verify source, retail ROM and capture unit contracts
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          python -m unittest \
            tests.unit.test_qa_modern_visual_native_capture \
            tests.unit.test_qa_modern_visual_win32_capture_driver \
            tests.unit.test_capture_modern_title_entry_sdl_win32 \
            tests.unit.test_capture_modern_title_attract_sdl_win32 \
            tests.unit.test_qa_modern_motion_final_sdl_pair \
            tests.unit.test_qa_modern_title_final_sdl_transition \
            tests.unit.test_qa_modern_visual_authentic_rgb_parity \
            tests.unit.test_check_modern_visual_capture_bundle \
            tests.unit.test_qa_authentic_presdl_sdl_rgb_parity
          python tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
      - name: Stage original Modern native host and opt-in SDL3 readback
        run: |
          set -euo pipefail
          python tools/baldosa_dram_refresh_beam_rate_patch.py --game baldosa
          python tools/baldosa_io_access_clock_order_patch.py --game baldosa
          (cd baldosa && bash tools/regen.sh --cfg-roots \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc")
          python tools/baldosa_io_access_clock_order_patch.py --game baldosa --verify-gen
          python tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_execution_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_product_pause_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_user_data_spike.py --game baldosa
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_profile_activation_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python tools/baldosa_modern_options_spike.py --game baldosa
          python tools/baldosa_modern_options_spike.py --game baldosa
          python tools/qa_modern_visual_sdl_capture.py --framework baldosa/snesrecomp
          grep -Fq UR_MODERN_UI_SDL_DRAWABLE_CAPTURE \
            baldosa/snesrecomp/runner/src/desktop/host_main.c
      - name: Acquire pinned native Windows Clang
        run: |
          bash baldosa/snesrecomp/tools/ci/fetch_toolchain.sh \
            --artifact windows-x64 --tag v1.0.14
      - name: Compile real Win32 Baldosa Modern product with one SDL observer
        run: |
          set -euo pipefail
          source "$TOOLCHAIN_DIR/env.sh"
          clang --version | head -n1 | grep -F "22.1.8"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          cmake -S baldosa -B baldosa/build-ur-visual -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_ENABLE_TRACE=OFF
          cmake --build baldosa/build-ur-visual --target UniracersSNESRecomp -j 3
          test -s baldosa/build-ur-visual/UniracersSNESRecomp.exe
          python tools/check_windows_pe_timestamp.py \
            --exe baldosa/build-ur-visual/UniracersSNESRecomp.exe \
            --source-epoch "$SOURCE_DATE_EPOCH"
      # #2043 TITLE LANE ONLY: this real AOT PE already has the established
      # SDL3 readback observer inserted above. No duplicate renderer/runtime.
      - name: Prove actual Modern title SDL entry/sweep and reduced motion
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'visual/modern-native-widescreen-title-20261020' }}
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for aspect in wide 4:3; do
            suffix="wide"
            if [ "$aspect" = "4:3" ]; then suffix="4by3"; fi
            python tools/capture_modern_title_entry_sdl_win32.py \
              --exe "$EXE" --rom "$ROM" \
              --source-sha "$(git rev-parse HEAD)" \
              --aspect "$aspect" \
              --out "$RUNNER_TEMP/modern-title-sdl-motion-$suffix-pr2043"
          done
          echo "Real source-bound Windows SDL3 title logo lift/exit, confirmed root and reduced stillness at 16:9/4:3; no hardware or art approval." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded title SDL pixels and logs only
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'visual/modern-native-widescreen-title-20261020' }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-title-motion-final-sdl-pr2043
          path: |
            ${{ runner.temp }}/modern-title-sdl-motion-*/native-title-sdl-motion-receipt.json
            ${{ runner.temp }}/modern-title-sdl-motion-*/*/sdl.pam
            ${{ runner.temp }}/modern-title-sdl-motion-*/*/sdl.png
            ${{ runner.temp }}/modern-title-sdl-motion-*/*/native-process.log
          if-no-files-found: warn
          retention-days: 7

      # Title-owner-only original source identity check: active guest PPU
      # paints its *whole* original title and real 2P race; the native host
      # consumes P1 wake then opens the same Modern root without guest writes.
      # Decision-first discriminator for the independently observed black
      # original title at guest/draw1000: compare genuine guest-rendered P6
      # before SDL with the exact SDL3 readback on SAME Windows native PE.
      # This never asserts success/visibility from an intentionally blank frame.
      - name: Diagnose original guest full title P6 versus final SDL at frame1000
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'visual/modern-native-widescreen-title-20261020' }}
        run: |
          set -euo pipefail
          python tools/capture_modern_title_attract_sdl_win32.py \
            --exe "$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --source-sha "$(git rev-parse HEAD)" \
            --aspect wide --diagnose-title-only \
            --out "$RUNNER_TEMP/modern-title-original-p6-vs-sdl-diagnostic-pr2043"
          echo "Measured exact P6 original guest versus P7 SDL at draw1000; do not infer title art visibility or acceptance from the source state flag alone." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded original-title source-versus-SDL diagnostic
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'visual/modern-native-widescreen-title-20261020' }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-title-original-source-vs-sdl-pr2043
          path: |
            ${{ runner.temp }}/modern-title-original-p6-vs-sdl-diagnostic-pr2043/original-title-diagnostic-only.json
            ${{ runner.temp }}/modern-title-original-p6-vs-sdl-diagnostic-pr2043/original-title/original-presdl.ppm
            ${{ runner.temp }}/modern-title-original-p6-vs-sdl-diagnostic-pr2043/original-title/original-title-source-vs-sdl.json
            ${{ runner.temp }}/modern-title-original-p6-vs-sdl-diagnostic-pr2043/original-title/native-sdl.pam
            ${{ runner.temp }}/modern-title-original-p6-vs-sdl-diagnostic-pr2043/original-title/native-sdl.png
            ${{ runner.temp }}/modern-title-original-p6-vs-sdl-diagnostic-pr2043/original-title/native-process.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prove actual original stock attract/demo and safe Modern wake SDL
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'visual/modern-native-widescreen-title-20261020' }}
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for aspect in wide 4:3; do
            suffix="wide"
            if [ "$aspect" = "4:3" ]; then suffix="4by3"; fi
            python tools/capture_modern_title_attract_sdl_win32.py \
              --exe "$EXE" --rom "$ROM" \
              --source-sha "$(git rev-parse HEAD)" \
              --aspect "$aspect" \
              --out "$RUNNER_TEMP/modern-title-original-attract-sdl-$suffix-pr2043"
          done
          echo "Genuine original title→original two-player demo→P1 wake→Modern title→native root SDL capture at 16:9/4:3; preview stays opt-in, no hardware, art or release approval." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain only actual original/demo title SDL evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'visual/modern-native-widescreen-title-20261020' }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-title-original-attract-final-sdl-pr2043
          path: |
            ${{ runner.temp }}/modern-title-original-attract-sdl-*/real-stock-title-demo-wake-sdl-receipt.json
            ${{ runner.temp }}/modern-title-original-attract-sdl-*/*/native-sdl.pam
            ${{ runner.temp }}/modern-title-original-attract-sdl-*/*/native-sdl.png
            ${{ runner.temp }}/modern-title-original-attract-sdl-*/*/native-process.log
            ${{ runner.temp }}/modern-title-original-attract-sdl-*/original-title/original-presdl.ppm
            ${{ runner.temp }}/modern-title-original-attract-sdl-*/original-title/original-title-source-vs-sdl.json
          if-no-files-found: warn
          retention-days: 7

      # Bounded independent companion to draft native title owner #2043.
      # Actual final SDL readback, not source P6 or guessed guest frames.
      - name: Verify real native title-to-root final SDL at widescreen and 4x3
        if: github.event_name == 'pull_request' && github.head_ref == 'qa/modern-title-final-sdl-transition-20261021'
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for size in 1280x720 1024x768; do
            ROOT="$RUNNER_TEMP/ur-modern-title-final-sdl-$size"
            for route in title-still title-entered-root title-reduced-still title-reduced-entered-root; do
              python tools/qa_modern_visual_win32_capture_driver.py \
                --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
                --out "$ROOT/$route" --video windows --timeout 100 \
                --window-size "$size" --route "$route"
            done
            python tools/qa_modern_title_final_sdl_transition.py \
              --case-root "$ROOT" --source-sha "$(git rev-parse HEAD)" \
              --output "$ROOT/verified-final-sdl-title-to-root.json"
          done
          echo "Genuine Windows final SDL P7 title and five-way root, normal and reduced-motion, one source/PE across both 16:9 and 4:3. No natural clock, art, physical gamepad or release acceptance." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain actual final SDL native title and root readback witnesses
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'qa/modern-title-final-sdl-transition-20261021'
        uses: actions/upload-artifact@v4
        with:
          name: modern-title-final-native-win32-p7-16x9-4x3
          path: |
            ${{ runner.temp }}/ur-modern-title-final-sdl-*/verified-final-sdl-title-to-root.json
            ${{ runner.temp }}/ur-modern-title-final-sdl-*/*/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-title-final-sdl-*/*/readback-receipt.json
            ${{ runner.temp }}/ur-modern-title-final-sdl-*/*/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-title-final-sdl-*/*/probe_first/native-process.log
          if-no-files-found: warn
          retention-days: 10
      - name: Launch real Win32 root and capture actual SDL drawable
        run: |
          set -euo pipefail
          python tools/qa_modern_visual_win32_capture_driver.py \
            --exe "$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --source-sha "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/ur-modern-win32-visual-baseline" \
            --video windows --timeout 100
          test -s "$RUNNER_TEMP/ur-modern-win32-visual-baseline/actual-sdl-drawable.png"
          echo "Real Win32 original Modern root only; no integrated visual skin, physical pads, release or visual approval." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture native widescreen and fallback Windows output on SAME exact PE
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for size in 1280x720 1024x768; do
            python tools/qa_modern_visual_win32_capture_driver.py \
              --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
              --out "$RUNNER_TEMP/ur-modern-win32-visual-$size" \
              --video windows --timeout 100 --window-size "$size"
            test -s "$RUNNER_TEMP/ur-modern-win32-visual-$size/actual-sdl-drawable.png"
            test -s "$RUNNER_TEMP/ur-modern-win32-visual-$size/readback-receipt.json"
          done
          echo "Actual final-drawable Windows Modern engineering baseline 1280x720 and 1024x768; same PE, separate clean runs; no redesign or physical-device approval." >> "$GITHUB_STEP_SUMMARY"
      # One bounded source/PE-bound final SDL motion proof, never a regular
      # requirement for unrelated PRs or evidence of physical/art approval.
      - name: Prove merged Modern animation in real SDL P7 and reduced control
        if: github.event_name == 'pull_request' && github.head_ref == 'qa/modern-motion-final-sdl-pair-20261020'
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          for size in 1280x720 1024x768; do
            ROOT="$RUNNER_TEMP/ur-modern-native-motion-$size"
            for route in root-motion-normal-zero root-motion-normal-eight root-motion-reduced-zero root-motion-reduced-eight; do
              python tools/qa_modern_visual_win32_capture_driver.py \
                --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
                --out "$ROOT/$route" --video windows --timeout 100 \
                --window-size "$size" --route "$route"
            done
            python tools/qa_modern_motion_final_sdl_pair.py \
              --case-root "$ROOT" --source-sha "$(git rev-parse HEAD)" \
              --output "$ROOT/verified-source-pe-p7-motion.json"
          done
          echo "Actual P7 pixel differences with UI motion enabled and identical reduced-motion control, same exact native Windows PE at 16:9 and 4:3. Does NOT certify natural cadence, original cursor OBJ, character likeness, physical controls, 342-wide game composition or release QA." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source-bound real native final SDL motion pixels and logs
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'qa/modern-motion-final-sdl-pair-20261020'
        uses: actions/upload-artifact@v4
        with:
          name: modern-motion-native-win32-p7-phase-reduced
          path: |
            ${{ runner.temp }}/ur-modern-native-motion-*/verified-source-pe-p7-motion.json
            ${{ runner.temp }}/ur-modern-native-motion-*/*/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-native-motion-*/*/readback-receipt.json
            ${{ runner.temp }}/ur-modern-native-motion-*/*/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-native-motion-*/*/probe_first/native-process.log
          if-no-files-found: warn
          retention-days: 7
      - name: Capture native Records keyboard, P1 Options and P1 profile states
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          # Each route drives the real native production edge handler,
          # in a separate clean process on the SAME PE.
          for spec in records-keyboard:1024x768 options-p1:1280x720 profile-first-p1:1280x720 practice-picker:1280x720 multiplayer-unrecorded:1280x720; do
            route="${spec%%:*}"
            size="${spec#*:}"
            python tools/qa_modern_visual_win32_capture_driver.py \
              --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
              --out "$RUNNER_TEMP/ur-modern-win32-journey-$route" \
              --video windows --timeout 110 --window-size "$size" \
              --route "$route"
            test -s "$RUNNER_TEMP/ur-modern-win32-journey-$route/actual-sdl-drawable.png"
            test -s "$RUNNER_TEMP/ur-modern-win32-journey-$route/readback-receipt.json"
          done
          echo "True-native Windows Records, Options, first-profile, Practice picker and anonymous 2P warning screenshots on one PE; no physical-pad/visual approval." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain controller and keyboard journey SDL frames, never save roots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-navigation-journeys
          path: |
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-records-keyboard/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-options-p1/probe_first/native-process.log
            # A changed DISPLAY setting can make the first process only a
            # rejected size probe. Retain the *selected*, later fresh-process
            # P7/log too; a PNG or receipt alone cannot establish SDL bytes.
            ${{ runner.temp }}/ur-modern-win32-journey-*/capture_observed/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-*/capture_observed/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-profile-first-p1/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-practice-picker/probe_first/native-process.log
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unrecorded/actual-sdl-drawable.png
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unrecorded/readback-receipt.json
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unrecorded/probe_first/actual-sdl-drawable.pam
            ${{ runner.temp }}/ur-modern-win32-journey-multiplayer-unrecorded/probe_first/native-process.log
          if-no-files-found: warn
          retention-days: 7
      - name: Capture stock Authentic control at 16-to-9 and 4-to-3
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/baldosa/build-ur-visual/UniracersSNESRecomp.exe"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          # Same native PE and exact Windows display sizes, but execution
          # mode=authentic; fail if Modern root opens or paints at all.
          for size in 1280x720 1024x768; do
            python tools/qa_modern_visual_win32_capture_driver.py \
              --exe "$EXE" --rom "$ROM" --source-sha "$(git rev-parse HEAD)" \
              --out "$RUNNER_TEMP/ur-authentic-win32-control-$size" \
              --video windows --timeout 100 --window-size "$size" \
              --route authentic-stock
            test -s "$RUNNER_TEMP/ur-authentic-win32-control-$size/actual-sdl-drawable.png"
            test -s "$RUNNER_TEMP/ur-authentic-win32-control-$size/readback-receipt.json"
            python tools/qa_modern_visual_authentic_rgb_parity.py \
              --stage "$RUNNER_TEMP/ur-authentic-win32-control-$size/probe_first" \
              --receipt "$RUNNER_TEMP/ur-authentic-win32-control-$size/readback-receipt.json" \
              --out "$RUNNER_TEMP/ur-authentic-win32-control-$size/independent-rgb-parity.json"
            # Stronger than a nonblank SDL frame: compare every observed RGB
            # pixel to the pinned native host's post-ComposeOsd source P6.
            # This fails on any art mutation, incorrect scaling, letterbox
            # contamination, missing data or source-image format drift.
            python tools/qa_authentic_presdl_sdl_rgb_parity.py \
              "$RUNNER_TEMP/ur-authentic-win32-control-$size/probe_first/stock-composed-before-sdl.ppm" \
              "$RUNNER_TEMP/ur-authentic-win32-control-$size/probe_first/actual-sdl-drawable.pam" \
              --receipt "$RUNNER_TEMP/ur-authentic-win32-control-$size/probe_first/authentic-exact-rgb-parity.json"
          done
          echo "Genuine Authentic stock RGB exact P6-to-SDL readback parity at 16:9/4:3; alpha, guest CRC, physical screen and human signoff remain unapproved." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain independent Authentic control output only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-visual-win32-authentic-isolation-control
          path: |
            ${{ runner.temp }}/ur-authentic-win32-control-1280x720/actual-sdl-drawable.png

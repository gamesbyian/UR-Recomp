name: S2 desktop digest reference

on:
  workflow_dispatch:permissions:
  contents: read

concurrency:
  group: s2-desktop-digest-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Verify inputs and stage framework
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          python3 tools/check_s2_desktop_digest_reference.py
          python3 -m unittest tests.unit.test_s2_desktop_digest_reference
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only

      - name: Generate canonical guest
        run: |
          set -euo pipefail
          F="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          T="$RUNNER_TEMP/s2-reference"
          R="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          mkdir -p "$T"
          SNESRECOMP_ROOT="$F" sh "$F/tools/new_project/setup_project.sh" \
            --rom "$R" --dir "$T" --name Uniracers --players 2 --yes \
            --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay --no-github \
            --no-submodules --no-generate --no-build
          P="$T/UniracersSNESRecomp"
          python3 "$F/snesrecomp_cli.py" generate \
            --rom "$R" --project-root "$P" --cfg-dir recomp \
            --out-dir src/gen --funcs-h recomp/funcs.h --cfg-roots
          echo "FRAMEWORK=$F" >> "$GITHUB_ENV"
          echo "PROJECT=$P" >> "$GITHUB_ENV"

      - name: Build native reference executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s2-reference-obj" "$RUNNER_TEMP/s2-reference-include"
          printf '#ifndef SNESRECOMP_REFERENCE_CONFIG_H\n#define SNESRECOMP_REFERENCE_CONFIG_H\n#endif\n' > "$RUNNER_TEMP/s2-reference-include/config.h"
          CFLAGS="-std=gnu11 -O2 -Wall -Wextra -DSNESRECOMP_TRACE=0 -DSNESRECOMP_ENABLE_MODS=0 -DSNESRECOMP_FRAME_FINGERPRINTS=0 -DSNESRECOMP_PPU_DMA_HISTORY=0 -DSNESRECOMP_DISPATCH_HISTORY=0 -DSNESRECOMP_FUNC_SNAPSHOT=0 -DSNESRECOMP_STACK_BALANCE_DIAGNOSTICS=0 -DSNESRECOMP_BOOT_WATCHDOG_DIAGNOSTICS=0 -DSNESRECOMP_CPU_HW_DIAGNOSTICS=0 -DSNESRECOMP_SPC_DIAGNOSTICS=0 -DSNESRECOMP_EXECUTION_DEFAULT_MODE=SNESRECOMP_EXECUTION_MODE_OFF -I$RUNNER_TEMP/s2-reference-include -I$FRAMEWORK/runner/src -I$FRAMEWORK/runner/src/snes -I$PROJECT/src -I$PROJECT/recomp"
          python3 - <<'PY' > "$RUNNER_TEMP/runtime-sources.txt"
          import json
          from pathlib import Path
          c=json.loads(Path("analysis/switch-s2-runtime-core-contract.json").read_text())
          for s in c["runtime_sources"]:
              print(s)
          PY
          sources=(
            "$PROJECT/src/game_rtl.c"
            "$PROJECT/src/host_contract.c"
            "$PROJECT/src/gen_stubs.c"
            "$PROJECT"/src/gen/*.c
            "$GITHUB_WORKSPACE/native/reference/s2_desktop_digest_reference.c"
          )
          while IFS= read -r s; do sources+=("$FRAMEWORK/$s"); done < "$RUNNER_TEMP/runtime-sources.txt"
          support=(
            runner/src/audio_trace.c
            runner/src/ppu_dma_trace.c
            runner/src/sha256.c
            runner/src/mod_audio.c
            runner/src/framedump.c
            runner/src/snes_runahead.c
            runner/src/crc32.c
            runner/src/netplay/snes_state_digest.c
          )
          for s in "${support[@]}"; do sources+=("$FRAMEWORK/$s"); done

          objects=()
          i=0
          for src in "${sources[@]}"; do
            obj="$RUNNER_TEMP/s2-reference-obj/$(printf '%04d' "$i").o"
            gcc $CFLAGS -c "$src" -o "$obj"
            objects+=("$obj")
            i=$((i+1))
          done
          gcc "${objects[@]}" -lm -o "$RUNNER_TEMP/s2-desktop-reference"

      - name: Run and prove repeatability
        run: |
          set -euo pipefail
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          "$RUNNER_TEMP/s2-desktop-reference" "$ROM" | tee "$RUNNER_TEMP/reference-1.txt"
          "$RUNNER_TEMP/s2-desktop-reference" "$ROM" | tee "$RUNNER_TEMP/reference-2.txt"
          cmp "$RUNNER_TEMP/reference-1.txt" "$RUNNER_TEMP/reference-2.txt"
          grep -q '^snes_init=1$' "$RUNNER_TEMP/reference-1.txt"
          grep -q '^execution_complete=1$' "$RUNNER_TEMP/reference-1.txt"
          for f in 0 1 60 120; do grep -q "^checkpoint frame=$f " "$RUNNER_TEMP/reference-1.txt"; done

      - uses: actions/upload-artifact@v4
        with:
          name: s2-desktop-digest-reference
          path: ${{ runner.temp }}/reference-1.txt
          retention-days: 30

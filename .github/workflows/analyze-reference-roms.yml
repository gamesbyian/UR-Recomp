name: Analyze reference ROMs
on:
  push:
    paths:
      - "tools/analyze_reference_roms.py"
      - "tools/inventory_reference_roms.py"
      - "tools/compare_reference_roms.py"
      - "tools/rnc_method1.py"
      - "tools/analyze_rnc_streams.py"
      - "tools/inspect_rnc_payloads.py"
      - "tools/find_rnc_decoder_signature.py"
      - "tools/map_rnc_code_refs.py"
      - "reference/roms/**"
      - ".github/workflows/analyze-reference-roms.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analyze-reference-roms
  cancel-in-progress: true
jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python tools/inventory_reference_roms.py
          python tools/analyze_reference_roms.py
          python tools/compare_reference_roms.py
          python tools/analyze_rnc_streams.py
          python tools/inspect_rnc_payloads.py
          python tools/find_rnc_decoder_signature.py
          python tools/map_rnc_code_refs.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/generated/reference-rom-inventory.md
          git add -f analysis/generated/retail-vs-prototype-structure.md
          git add -f analysis/generated/reference-rom-comparison.md
          git add -f analysis/generated/rnc-stream-manifest.json
          git add -f analysis/generated/rnc-stream-manifest.md
          git add -f analysis/generated/rnc-payload-structure.md
          git add -f analysis/generated/rnc-decoder-signature-search.md
          git add -f analysis/generated/rnc-code-reference-map.md
          git commit -m "Generate reference ROM analysis" || exit 0
          git pull --rebase origin main
          git push

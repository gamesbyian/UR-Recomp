name: Bottom-edge cross-core regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/summarize_presentation_geometry.py"
      - "tests/input/reach-first-race.script"
      - "tools/toolchain-entries/snes9x-libretro.json"
      - "tools/toolchain-entries/beetle-bsnes-libretro.json"
      - "tools/toolchain-entries/_global.json"
      - "tools/bootstrap_toolchain.py"
      - "tools/patches/beetle-bsnes-ur-recomp.patch"
      - ".github/workflows/bottom-edge-cross-core.yml"

concurrency:
  group: bottom-edge-cross-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Build reference stack
        run: |
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          python3 tools/bootstrap_toolchain.py --offline --tool beetle-bsnes-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2
      - name: Run first-race route through both cores
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/snesref-build/snesref"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script"
          run_core() {
            local label="$1" core="$2"
            local dumps="$RUNNER_TEMP/$label"
            mkdir -p "$dumps"
            SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
            SNESREF_SCRIPT="$SCRIPT" SNESREF_DUMP_DIR="$dumps" \
              "$EXE" "$core" "$ROM" >"$RUNNER_TEMP/$label.log" 2>&1
            cat "$RUNNER_TEMP/$label.log"
            python3 tools/summarize_presentation_geometry.py "$dumps" --json-out "$label-presentation.json"
          }
          run_core snes9x "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          run_core beetle "$GITHUB_WORKSPACE/.tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so"
      - name: Assert live 224-line bottom edge
        run: |
          python3 - <<'PY'
          import json
          required=("main-menu-ready","rider-select-ready","tours-ready","tracks-ready","now-playing-ready","race-entered")
          for engine in ("snes9x","beetle"):
              r=json.load(open(f"{engine}-presentation.json"))
              rows={x["checkpoint"]:x for x in r["checkpoints"]}
              for tag in required:
                  x=rows[tag]
                  fb=x["framebuffer"]
                  last=fb["edges"]["last_row"]
                  assert (fb["width"],fb["height"])==(256,224),(engine,tag,fb["width"],fb["height"])
                  assert last["nonzero_pixels"]==256,(engine,tag,last)
              print(engine,"256x224 live-bottom-edge invariant confirmed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bottom-edge-cross-core
          path: |
            snes9x-presentation.json
            beetle-presentation.json

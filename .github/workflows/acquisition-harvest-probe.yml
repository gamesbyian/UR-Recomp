name: Acquisition harvest probe

on:
  push:
    branches:
      - chatgpt/acquisition-triage-harvest-2026-09-29
    paths:
      - .github/workflows/acquisition-harvest-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/acquisition-triage-harvest-2026-09-29
          fetch-depth: 0

      - name: Probe direct and archived artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          UA={"User-Agent":"UR-Recomp research preservation/1.0"}
          report={"probes":[]}
          out=Path("references/recovered/acquisition-2026-09-29")
          out.mkdir(parents=True, exist_ok=True)

          def fetch(url, timeout=45):
              req=urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read(), r.geturl(), r.headers.get_content_type()

          def record(name, state, **extra):
              report["probes"].append({"name":name,"state":state,**extra})

          def save(name, data, source, relpath):
              p=Path(relpath); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(data)
              record(name,"recovered",source=source,path=str(p),size=len(data),sha256=hashlib.sha256(data).hexdigest())

          # Direct public manual: useful but non-blocking.
          try:
              url="https://www.videogamemanual.com/snes/Uniracers%20(USA).pdf"
              data,final,ctype=fetch(url)
              if data.startswith(b"%PDF") and len(data)>10000:
                  save("US instruction manual",data,final,"references/imported/manuals/Uniracers-USA-manual.pdf")
              else:
                  record("US instruction manual","unexpected-response",url=final,size=len(data),content_type=ctype)
          except Exception as e:
              record("US instruction manual","failed",error=repr(e))

          # High-value historical targets: query Wayback CDX, then fetch best surviving snapshot.
          targets=[
            ("usjo13.lua","http://www.obellemare.com/speedruns/Uniracers%20%28U%29%20%5B%21%5D/usjo13.lua","references/imported/tas-bots/usjo13.lua","lua"),
            ("Halamantariel boost/mechanics page","http://www.obellemare.com/speedruns/Uniracers%20%28U%29%20%5B%21%5D/Uniracers.html","references/recovered/tas-bot/Halamantariel-Uniracers.html","html"),
            ("FallThrough glitch page","http://dscarroll.com/uniracerstas/FallThrough.ashx","references/recovered/tas-bot/FallThrough.html","html"),
          ]
          for name,url,rel,kind in targets:
              try:
                  cdx="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode({
                      "url":url,"output":"json","filter":"statuscode:200","collapse":"digest","fl":"timestamp,original,statuscode,mimetype,digest"
                  })
                  raw,_,_=fetch(cdx)
                  rows=json.loads(raw.decode("utf-8","replace"))
                  if len(rows)<2:
                      record(name,"no-wayback-snapshot",url=url)
                      continue
                  recovered=False
                  # Prefer latest snapshot, but fall back across distinct digests.
                  for row in reversed(rows[1:]):
                      ts,original,*_=row
                      snap=f"https://web.archive.org/web/{ts}id_/{original}"
                      try:
                          data,final,ctype=fetch(snap,60)
                      except Exception:
                          continue
                      if kind=="lua":
                          plausible=(b"memory." in data or b"savestate" in data or b"joypad" in data) and len(data)>1000
                      else:
                          plausible=b"<html" in data[:1000].lower() or b"<body" in data[:2000].lower()
                      if plausible:
                          save(name,data,final,rel)
                          recovered=True
                          break
                  if not recovered:
                      record(name,"snapshots-found-but-fetch-failed",snapshot_count=len(rows)-1,url=url)
              except Exception as e:
                  record(name,"wayback-probe-failed",url=url,error=repr(e))

          # If FallThrough HTML was recovered, preserve any linked savestates/movies from the same live/archived URL family.
          fp=Path("references/recovered/tas-bot/FallThrough.html")
          if fp.exists():
              html=fp.read_text("utf-8","replace")
              hrefs=re.findall(r'href=["\']([^"\']+\.(?:zs\d|smv|state|sav|zip))["\']',html,re.I)
              record("FallThrough linked binary enumeration","enumerated",count=len(hrefs),hrefs=hrefs[:50])

          # P2 map corpus: inventory only; do not pull tens/hundreds of MB into repo automatically.
          try:
              url="https://vgmaps.de/maps/snes/uniracers/"
              data,final,ctype=fetch(url)
              text=data.decode("utf-8","replace")
              hrefs=sorted(set(re.findall(r'href=["\']([^"\']+\.(?:png|gif|jpg|jpeg))["\']',text,re.I)))
              inv={"source":final,"count":len(hrefs),"files":hrefs}
              p=Path("references/recovered/acquisition-2026-09-29/vgmaps-inventory.json")
              p.write_text(json.dumps(inv,indent=2)+"\n")
              record("VGMaps course corpus","inventory-only",count=len(hrefs),path=str(p),reason="P2 evidence; avoid automatic large binary import")
          except Exception as e:
              record("VGMaps course corpus","inventory-failed",error=repr(e))

          Path("references/recovered/acquisition-2026-09-29/probe-report.json").write_text(json.dumps(report,indent=2)+"\n")
          PY

      - name: Commit recovered evidence
        shell: bash
        run: |
          set -euo pipefail
          git add references/recovered/acquisition-2026-09-29 references/recovered/tas-bot references/imported/manuals references/imported/tas-bots 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No recoverable artifacts found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harvest remaining external acquisition leads"
          git fetch origin chatgpt/acquisition-triage-harvest-2026-09-29
          git rebase origin/chatgpt/acquisition-triage-harvest-2026-09-29
          git push origin HEAD:chatgpt/acquisition-triage-harvest-2026-09-29

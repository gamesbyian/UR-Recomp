name: QA-01 original 2014 Switcher Race B source qualification

on:
  # Manual original-only replay; preserve no automatic per-PR core rebuild.
  workflow_dispatch:
    inputs:
      source_horizon:
        description: "Last original movie frame to inspect (baseline 22000; extend after negative)"
        required: true
        type: choice
        options:
          - "22000"
          - "48000"
          - "96000"
        default: "48000"
      stack_writer_probe:
        description: "Opt-in original-only Switcher stack opcode scope (requires horizon 22000)"
        required: false
        type: boolean
        default: false
      fresh_paired_nmi_probe:
        description: "Opt-in fresh paired Switcher result with original NMI saved-A, pull and RTI witness"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa01-switcher-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-original-switcher:
    if: ${{ !inputs.fresh_paired_nmi_probe }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45  # optional original-only traced replay rebuilds and rescans
    steps:
      - name: Check out USA source and archived historical 2014 movie
        uses: actions/checkout@v4
      - name: Check out pinned Snes9x reference runner
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Check ROM core and source metadata before replay
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.stack_writer_probe }}" = "true" ] &&
             [ "${{ inputs.source_horizon }}" != "22000" ]; then
            echo "stack_writer_probe requires source_horizon=22000; reject before source build/scan" >&2
            exit 2
          fi
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          python3 -m unittest discover -s tests/unit -p test_probe_original_switcher_source_2014.py
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709

      - name: Build only original Snes9x and snesref for bounded archive scan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libsdl2-dev
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          cmake -S baldosa/snesrecomp/tools/snesref \
                -B "$RUNNER_TEMP/qa01-switcher-snesref" \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qa01-switcher-snesref" -j2

      - name: Scan the original movie for a real Switcher result and archive provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/probe_original_switcher_source_2014.py \
            --snesref "$RUNNER_TEMP/qa01-switcher-snesref/snesref" \
            --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --work-dir "$RUNNER_TEMP/qa01-switcher" \
            --report "$RUNNER_TEMP/qa01-switcher/source-switcher-result.json" \
            --source-horizon "${{ inputs.source_horizon }}"
          cat "$RUNNER_TEMP/qa01-switcher/source-switcher-result.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Original source only, 0/45 native release credit." >> "$GITHUB_STEP_SUMMARY"
          echo "Horizon: ${{ inputs.source_horizon }} original movie frames; an unqualified source is not a gameplay defect." >> "$GITHUB_STEP_SUMMARY"

      - name: Trace original Switcher stack-page opcode scopes (opt-in only)
        if: ${{ inputs.stack_writer_probe }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.source_horizon }}" = "22000" || {
            echo "Bounded stack writer probe requires independently qualified original 22000-frame horizon" >&2
            exit 2
          }
          BASE="$RUNNER_TEMP/qa01-switcher"
          TRACE="$RUNNER_TEMP/qa01-switcher-stack"
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          RESULT="$(python3 - "$BASE/source-switcher-result.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding="utf-8"))
          assert a["status"] == "source_event_and_entry_verified"
          assert a["release_complete_event_credit"] == 0
          assert a["original_source_horizon_frames"] == 22000
          n=a["source_result"]["original_result_frame"]
          assert type(n) is int and 100 < n < 22000
          print(n)
          PY
          )"
          # This source frame is independently observed, not invented.
          # Snes9x ICPU.Frame and host script f are intentionally NOT equated.
          export UR_QA_STACK_FIRST="$((RESULT - 16))"
          export UR_QA_STACK_LAST="$((RESULT + 3))"
          python3 tools/instrument_snesref_qa01_switcher_stack.py "$SRC/cpuexec.cpp"
          make -C "$SRC/libretro" -j2
          python3 tools/probe_original_switcher_source_2014.py \
            --snesref "$RUNNER_TEMP/qa01-switcher-snesref/snesref" \
            --core "$SRC/libretro/snes9x_libretro.so" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --work-dir "$TRACE" \
            --report "$TRACE/source-switcher-result.json" \
            --source-horizon 22000
          python3 tools/report_qa01_switcher_stack_trace.py \
            --original-report "$BASE/source-switcher-result.json" \
            --instrumented-report "$TRACE/source-switcher-result.json" \
            --opcode-log "$TRACE/source-switcher/source/source-scan.log" \
            --out "$TRACE/switcher-original-stack-scopes.json"
          cat "$TRACE/switcher-original-stack-scopes.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Original opcode-scope observations, not proven stack writes, native parity or QA-01 admission." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain original-only source diagnostic and no copyrighted movie bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa01-switcher-original-source-2014
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa01-switcher/source-switcher-result.json
            ${{ runner.temp }}/qa01-switcher/source-switcher/source/source-event-diagnostic.json
            ${{ runner.temp }}/qa01-switcher/source-switcher/source/source-scan.log
            ${{ runner.temp }}/qa01-switcher/source-switcher/source/source-entry.log
            ${{ runner.temp }}/qa01-switcher-stack/switcher-original-stack-scopes.json
            ${{ runner.temp }}/qa01-switcher-stack/source-switcher/source/source-scan.log

  fresh-paired-switcher-nmi:
    # Reuse the existing source/movie producer and exact pinned native guest;
    # the original-only branch above is skipped for this manual mode.
    if: ${{ inputs.fresh_paired_nmi_probe }}
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Check out canonical USA source and original movie
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out pinned Baldosa and original snesref runner
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Validate exact original source, native pin and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          # Do not silently ignore the historical-source horizon input when
          # selecting the independent fresh-paired host-frame experiment.
          test "${{ inputs.source_horizon }}" = "22000" || {
            echo "fresh_paired_nmi_probe requires source_horizon=22000" >&2
            exit 2
          }
          test "${{ inputs.stack_writer_probe }}" != "true" || {
            echo "fresh_paired_nmi_probe cannot combine with historical-source-only stack_writer_probe" >&2
            exit 2
          }
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          test -s reference/imported/tas-bots/dessyreqt-4250-submission.smv
          python3 -m unittest discover -s tests/unit -p test_qa01_original_nmi_stack_pull.py
          python3 -m unittest discover -s tests/unit -p test_qa01_native_nmi_beam.py
          python3 -m unittest discover -s tests/unit -p test_qa01_native_stack_read.py
          python3 -m unittest discover -s tests/unit -p test_qa01_native_interp_pla.py
          python3 -m unittest discover -s tests/unit -p test_qa01_native_stack_read_pair_crosswalk.py
          python3 -m unittest discover -s tests/unit -p test_qa01_switcher_nmi_beam_crosswalk.py
          python3 -m unittest discover -s tests/unit -p test_qa01_switcher_source_followon.py
          python3 -m unittest discover -s tests/unit -p test_probe_original_event_complete.py
          python3 -m unittest discover -s tests/unit -p test_qa01_event_campaign.py
      - name: Build exactly one pinned native and one original guest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config build-essential cmake libsdl2-dev \
            libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev xvfb
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          cmake -S baldosa/snesrecomp/tools/snesref \
            -B "$RUNNER_TEMP/qa01-switcher-snesref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qa01-switcher-snesref" -j2
          python3 tools/baldosa_qa_dense_scene_input_patch.py \
            --host baldosa/snesrecomp/runner/src/desktop/host_main.c
          python3 tools/qa01_native_switcher_stack_gate.py \
            baldosa/snesrecomp/runner/src/cpu_state.c
          python3 tools/qa01_native_nmi_beam_patch.py \
            baldosa/snesrecomp/runner/src/cpu_state.c
          python3 tools/qa01_native_stack_read_patch.py \
            baldosa/snesrecomp/runner/src/cpu_state.c
          python3 tools/qa01_native_interp_pla_patch.py \
            baldosa/snesrecomp/runner/src/snes/interp816.c
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j3
          test -x baldosa/build/UniracersSNESRecomp
      - name: Instrument only disposable original Snes9x opcode and interrupt scopes
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          python3 tools/instrument_snesref_qa01_switcher_stack.py \
            "$SRC/cpuexec.cpp" --single-address 0x01DD --watch-nmi
          python3 tools/qa01_original_nmi_pha_accumulator_patch.py "$SRC/cpuexec.cpp"
          python3 tools/qa01_original_nmi_stack_pull_patch.py "$SRC/cpuexec.cpp"
          make -C "$SRC/libretro" -j2
          test -s "$SRC/libretro/snes9x_libretro.so"
          test -x "$RUNNER_TEMP/qa01-switcher-snesref/snesref"
      - name: Existing fresh-paired Switcher source movie replay and exact result discriminator
        shell: bash
        env:
          UR_QA_STACK_FIRST: "5778"
          UR_QA_STACK_LAST: "5782"
          SNESRECOMP_WLOG_ADDR: "01DD:01DD:${{ runner.temp }}/qa01-switcher-fresh/native-01dd-beam.log"
          SNESRECOMP_WLOG_STATE: "1"
          SNESRECOMP_WLOG_ADDR_CAP: "2048"
          UR_QA_NATIVE_STACK_FIRST: "5778"
          UR_QA_NATIVE_STACK_LAST: "5782"
          UR_QA_NATIVE_STACK_READ_ENABLE: "1"
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qa01-switcher-fresh"
          mkdir -p "$OUT"
          set +e
          python3 tools/probe_original_event_complete.py \
            --case switcher --native-backend pinned-baldosa \
            --switcher-same-host-penultimate \
            --switcher-same-host-full-memory-offsets \
            --source-horizon 22000 \
            --snesref "$RUNNER_TEMP/qa01-switcher-snesref/snesref" \
            --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            --native "$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --work-dir "$OUT" --json-out "$OUT/paired-switcher.json" \
            > "$OUT/paired-attempt.log" 2>&1
          rc=$?
          set -e
          tail -n 70 "$OUT/paired-attempt.log"
          echo "Paired producer exit $rc; original/native phase has NOT been normalized." >> "$GITHUB_STEP_SUMMARY"
          # Exit 0 can mean an investigative strict *candidate*; exit 1 can
          # mean a genuine original/native divergence. Neither is a release
          # admission. Reject crashes and misleading/contradictory JSON
          # using the existing source-owned event-campaign classifier.
          test -s "$OUT/paired-switcher.json"
          python3 - "$OUT/paired-switcher.json" "$rc" "$GITHUB_SHA" \
                    "$OUT/paired-classification.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          import qa01_event_campaign as qa
          report,rc,source,out,summary=sys.argv[1:]
          row=qa.classify("switcher",int(rc),Path(report),
                          qa.make_plan("switcher",source))
          if row["disposition"] not in ("strict_candidate","strict_divergence"):
              raise ValueError("fresh paired NMI probe failed source-owned classification: "
                               +str(row["reason"]))
          if row["release_credit"] != 0:
              raise ValueError("investigative classification attempted release admission")
          Path(out).write_text(json.dumps(row,indent=2,sort_keys=True)+"\\n",
                               encoding="utf-8")
          with open(summary,"a",encoding="utf-8") as f:
              f.write("\\nQA-01 source classifier: **"+row["disposition"]
                      +"**; zero accepted USA events and no release credit.\\n")
          PY
          test -s "$OUT/switcher/replay/reference.log"
          python3 tools/qa01_switcher_source_followon.py \
            --trace-jsonl "$OUT/switcher/source/trace.jsonl" \
            --paired-report "$OUT/paired-switcher.json" \
            --source-diagnostic "$OUT/switcher/source/source-event-diagnostic.json" \
            --out "$OUT/source-followon.json"
          cat "$OUT/source-followon.json" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/qa01_original_nmi_stack_pull_report.py \
            --original-log "$OUT/switcher/replay/reference.log" \
            --paired-report "$OUT/paired-switcher.json" \
            --out "$OUT/stack-pull-rti-report.json"
          cat "$OUT/stack-pull-rti-report.json" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/qa01_native_nmi_beam_report.py \
            --wlog "$OUT/native-01dd-beam.log" \
            --paired-report "$OUT/paired-switcher.json" \
            --out "$OUT/native-beam-report.json"
          cat "$OUT/native-beam-report.json" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/qa01_native_stack_read_report.py \
            --read-log "$OUT/switcher/replay/native/qa01-native-01dd-reads.log" \
            --paired-report "$OUT/paired-switcher.json" \
            --out "$OUT/native-01dd-reads-report.json"
          cat "$OUT/native-01dd-reads-report.json" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/qa01_native_interp_pla_report.py \
            --interp-log "$OUT/switcher/replay/native/qa01-native-interpreter-pla.log" \
            --paired-report "$OUT/paired-switcher.json" \
            --native-read-report "$OUT/native-01dd-reads-report.json" \
            --out "$OUT/native-interpreter-pla-report.json"
          cat "$OUT/native-interpreter-pla-report.json" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/qa01_switcher_nmi_beam_crosswalk.py \
            --original-report "$OUT/stack-pull-rti-report.json" \
            --native-report "$OUT/native-beam-report.json" \
            --out "$OUT/original-native-nmi-beam-crosswalk.json"
          cat "$OUT/original-native-nmi-beam-crosswalk.json" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/qa01_native_stack_read_pair_crosswalk.py \
            --native-beam-report "$OUT/native-beam-report.json" \
            --native-read-report "$OUT/native-01dd-reads-report.json" \
            --out "$OUT/native-read-writer-crosswalk.json"
          cat "$OUT/native-read-writer-crosswalk.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Original-side NMI/stack/RTI scope only. Zero full-event credit; USA 0/45." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve original/native logs and provenance but not ROM or controller bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa01-switcher-fresh-paired-nmi
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa01-switcher-fresh/paired-attempt.log
            ${{ runner.temp }}/qa01-switcher-fresh/paired-switcher.json
            ${{ runner.temp }}/qa01-switcher-fresh/paired-classification.json
            ${{ runner.temp }}/qa01-switcher-fresh/stack-pull-rti-report.json
            ${{ runner.temp }}/qa01-switcher-fresh/native-01dd-beam.log
            ${{ runner.temp }}/qa01-switcher-fresh/native-beam-report.json
            ${{ runner.temp }}/qa01-switcher-fresh/switcher/replay/native/qa01-native-01dd-reads.log
            ${{ runner.temp }}/qa01-switcher-fresh/native-01dd-reads-report.json
            ${{ runner.temp }}/qa01-switcher-fresh/switcher/replay/native/qa01-native-interpreter-pla.log
            ${{ runner.temp }}/qa01-switcher-fresh/native-interpreter-pla-report.json
            ${{ runner.temp }}/qa01-switcher-fresh/native-read-writer-crosswalk.json
            ${{ runner.temp }}/qa01-switcher-fresh/original-native-nmi-beam-crosswalk.json
            ${{ runner.temp }}/qa01-switcher-fresh/source-followon.json
            ${{ runner.temp }}/qa01-switcher-fresh/switcher/source/source-scan.log
            ${{ runner.temp }}/qa01-switcher-fresh/switcher/calibration/reference.log
            ${{ runner.temp }}/qa01-switcher-fresh/switcher/calibration/native.log
            ${{ runner.temp }}/qa01-switcher-fresh/switcher/replay/reference.log
            ${{ runner.temp }}/qa01-switcher-fresh/switcher/replay/native.log

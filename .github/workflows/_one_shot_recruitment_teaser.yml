name: One-shot recruitment teaser export

# Temporary, media-only builder. The successful job removes itself and the
# temporary compressed transfer file in the very same generated-media commit.
on:
  push:
    branches:
      - media/recruitment-teaser-evidence-20261010
    paths:
      - .github/workflows/_one_shot_recruitment_teaser.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-ur-recruitment-teaser-20261010
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/media/recruitment-teaser-evidence-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video dependencies
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Expand and verify exact renderer
        run: |
          base64 -d tools/showcase/.recruitment_teaser_source.py.gz.b64 | gzip -d > tools/showcase/build_recruitment_teaser.py
          echo 'da6d5203b673396fbcaedaa16353aec4195001abd9cb4360e3bfe6b2ce254e86  tools/showcase/build_recruitment_teaser.py' | sha256sum -c -
          python3 -m py_compile tools/showcase/build_recruitment_teaser.py
      - name: Fetch pinned native capture evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/11681865494/zip' \
            -o /tmp/baldosa-late-evidence.zip
          echo 'd3146b4d28e247530985826a7d2b321de8359b611c2b379a966397f6192381ad  /tmp/baldosa-late-evidence.zip' | sha256sum -c -
      - name: Build and validate real-source media
        run: |
          python3 tools/showcase/build_recruitment_teaser.py \
            --zip /tmp/baldosa-late-evidence.zip \
            --outdir media/showcase/2026-10-10/recruitment
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('media/showcase/2026-10-10/recruitment')
          p=json.loads((root/'recruitment-provenance.json').read_text())
          assert p['guest_crc_matching_frames']==2473
          assert p['original_centre_match_1856'] is True
          assert len(p['outputs'])==4
          for name,record in p['outputs'].items():
              path=root/name
              assert path.is_file() and path.stat().st_size==record['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==record['sha256']
              if name.endswith('.mp4'):
                  x=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(path)]))
                  assert any(s['codec_type']=='video' for s in x['streams'])
                  assert any(s['codec_type']=='audio' for s in x['streams'])
          PY
      - name: Commit footage and retire temporary exporter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/showcase/2026-10-10/recruitment tools/showcase/build_recruitment_teaser.py
          git rm .github/workflows/_one_shot_recruitment_teaser.yml tools/showcase/.recruitment_teaser_source.py.gz.b64
          git commit -m "media: retain source-backed recruitment trailers, poster and reproducible renderer"
          git push origin HEAD:media/recruitment-teaser-evidence-20261010

name: RF093 disposable native SPC compile (remove before merge)
on:
  pull_request:
    paths:
      - tools/qa01_rf093_native_spc_edges.py
      - tests/unit/test_qa01_rf093_native_spc_edges.py
      - .github/workflows/rf093-temp-native-compile.yml
permissions:
  contents: read
jobs:
  native-spc-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: Patch exact pinned native SPC and compile real C translation unit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          python3 -m unittest discover -s tests/unit -p test_qa01_rf093_native_spc_edges.py
          python3 tools/qa01_rf093_native_spc_edges.py --root baldosa
          cc -std=gnu11 -fsyntax-only -I baldosa/snesrecomp/runner/src \
            -I baldosa/snesrecomp/runner/src/snes \
            baldosa/snesrecomp/runner/src/snes/apu.c
          echo "RF093 actual pinned native APU C translation unit compiled; not linked or executed"

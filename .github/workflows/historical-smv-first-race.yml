name: Historical SMV first-race replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "reference/imported/tas-bots/dessyreqt-4250-submission.smv"
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "tools/extract_smv_input.py"
      - "tools/summarize_wram_trace_checkpoints.py"
      - "tools/compose_historical_reference_result.py"
      - "tools/compose_historical_replay_result.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/toolchain-entries/snes9x-libretro.json"
      - "tools/toolchain-entries/_global.json"
      - "tools/patches/snesrecomp-input-file.patch"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "third_party/manifest.json"
      - ".github/workflows/historical-smv-first-race.yml"
  push:
    branches:
      - main
    paths:
      - "reference/imported/tas-bots/dessyreqt-4250-submission.smv"
      - "reference/roms/retail/Uniracers_USA.sfc"
      - "tools/extract_smv_input.py"
      - "tools/summarize_wram_trace_checkpoints.py"
      - "tools/compose_historical_reference_result.py"
      - "tools/compose_historical_replay_result.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/toolchain-entries/snes9x-libretro.json"
      - "tools/toolchain-entries/_global.json"
      - "tools/patches/snesrecomp-input-file.patch"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
      - "third_party/cargo/snesrecomp-analyzer/**"
      - "third_party/manifest.json"
concurrency:
  group: historical-smv-first-race-${{ github.ref }}
  # This workflow may persist evidence on main; serialize rather than cancel writes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Extract historical controller stream
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/extract_smv_input.py \
            reference/imported/tas-bots/dessyreqt-4250-submission.smv \
            --input-out "$RUNNER_TEMP/dessyreqt-4250.input" \
            --sram-out "$RUNNER_TEMP/dessyreqt-4250.srm" \
            --sram-size 8192 \
            --json-out "$RUNNER_TEMP/dessyreqt-4250.json"
          cat "$RUNNER_TEMP/dessyreqt-4250.json"
          mkdir -p analysis/generated
          cp "$RUNNER_TEMP/dessyreqt-4250.json" analysis/generated/historical-2014-smv-metadata.json
          python3 - "$RUNNER_TEMP/dessyreqt-4250.json" "$RUNNER_TEMP/dessyreqt-4250.srm" <<'PY'
          import json, pathlib, sys
          meta=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not meta.get("reset_anchored"):
              raise SystemExit("2014 historical movie is snapshot-anchored; raw-input replay needs a state adapter")
          sram=pathlib.Path(sys.argv[2])
          if not sram.exists() or sram.stat().st_size != 8192:
              raise SystemExit("2014 reset movie did not yield canonical-size 8 KiB SRAM")
          print("2014 movie is reset/SRAM anchored")
          PY
          python3 - "$RUNNER_TEMP/dessyreqt-4250.input" "$RUNNER_TEMP/dessyreqt-first-5000.input" <<'PY'
          from pathlib import Path
          import sys
          from tools.controller_input import load_controller_runs

          source, out = map(Path, sys.argv[1:])
          horizon = 5000
          runs = load_controller_runs(source)
          lines = ["# Exact Dessyreqt input truncated to the first 5000 guest frames."]
          for run in runs:
              if run.start >= horizon:
                  break
              duration = min(run.duration, horizon - run.start)
              if duration <= 0:
                  continue
              row = f"{run.start}:{duration}:{run.p1_mask:03x}"
              if run.p2_mask:
                  row += f":{run.p2_mask:03x}"
              lines.append(row)
          out.write_text("\n".join(lines) + "\n")
          print(f"first-race input runs: {len(lines) - 1}")
          PY
          head -80 "$RUNNER_TEMP/dessyreqt-first-5000.input"

      - name: Stage and build repository-owned SNESRecomp framework
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          test -x .tools/src/snesrecomp/build-snesref/snesref

      - name: Build pinned Snes9x reference core
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2

      - name: Trace first historical race window
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          INPUT="$RUNNER_TEMP/dessyreqt-first-5000.input"
          TRACE="$RUNNER_TEMP/dessyreqt-first-race-trace.jsonl"

          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_FRAMES=5000 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$RUNNER_TEMP/dessyreqt-4250.srm" \
          SNESREF_INPUT_FILE="$INPUT" \
          SNESREF_TRACE_FILE="$TRACE" \
            "$EXE" "$CORE" "$ROM" >/dev/null 2>&1

          python3 tools/summarize_wram_trace_checkpoints.py "$TRACE" \
            --checkpoint 440 --checkpoint 441 --checkpoint 442 --checkpoint 443 --checkpoint 444 --checkpoint 445 --checkpoint 446 --checkpoint 447 --checkpoint 448 --checkpoint 449 --checkpoint 450 --checkpoint 451 --checkpoint 452 --checkpoint 453 --checkpoint 454 --checkpoint 455 --checkpoint 456 --checkpoint 457 --checkpoint 458 --checkpoint 459 --checkpoint 460 \
            --checkpoint 794 --checkpoint 800 --checkpoint 1000 --checkpoint 1200 \
            --checkpoint 1400 --checkpoint 1600 --checkpoint 1800 \
            --checkpoint 2000 --checkpoint 2200 --checkpoint 2400 \
            --checkpoint 2600 --checkpoint 2800 --checkpoint 2874 --checkpoint 2894 --checkpoint 3000 \
            --checkpoint 3400 --checkpoint 3800 --checkpoint 4200 \
            --checkpoint 4600 --checkpoint 5000 \
            --tsv-out "$RUNNER_TEMP/dessyreqt-first-race-state.tsv" \
            --json-out "$RUNNER_TEMP/dessyreqt-first-race-state.json" \
            | tee "$RUNNER_TEMP/dessyreqt-first-race-summary.txt"

      - name: Compose and validate 2014 reference result
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compose_historical_reference_result.py \
            --smv-meta "$RUNNER_TEMP/dessyreqt-4250.json" \
            --trace-summary "$RUNNER_TEMP/dessyreqt-first-race-state.json" \
            --out analysis/generated/historical-2014-first-race-reference.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("analysis/generated/historical-2014-first-race-reference.json").read_text())
          if not d["reference_reached_race"]:
              raise SystemExit("2014 historical movie did not reach an active race by frame 5000")
          print("first active race frame:", d["first_in_race_frame"])
          print("first race-results frame:", d["first_race_results_frame"])
          PY

      - name: Build native target
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --no-submodules \
            --generate \
            --no-build
          PROJ="$ROOT/UniracersSNESRecomp"
          cmake -S "$PROJ" -B "$PROJ/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF
          cmake --build "$PROJ/build" -j2
          test -x "$PROJ/build/UniracersSNESRecomp"

      - name: Replay exact 2014 input in native runtime
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          INPUT="$RUNNER_TEMP/dessyreqt-first-5000.input"
          PROJ="$RUNNER_TEMP/native/UniracersSNESRecomp"
          SCRIPT="$RUNNER_TEMP/dessyreqt-checkpoints.script"
          DUMPS="$RUNNER_TEMP/native-2014-dumps"
          LOG="$RUNNER_TEMP/native-2014.log"
          mkdir -p "$PROJ/build/saves" "$DUMPS"
          cp "$RUNNER_TEMP/dessyreqt-4250.srm" "$PROJ/build/saves/save.srm"

          python3 - "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys
          checkpoints = [
              *range(440, 461),
              794, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400,
              2600, 2800, 2874, 2894, 3000, 3400, 3800, 4200, 4600, 5000,
          ]
          lines = ["# Exact historical replay checkpoints; input comes from SNESRECOMP_INPUT_FILE."]
          previous = 0
          for frame in checkpoints:
              lines.append(f"wait {frame - previous}")
              lines.append(f"dump frame-{frame}")
              previous = frame
          lines.append("quit")
          Path(sys.argv[1]).write_text("\n".join(lines) + "\n")
          PY
          cat "$SCRIPT"

          set +e
          (
            cd "$PROJ/build"
            SNESRECOMP_INPUT_FILE="$INPUT" \
            SNESRECOMP_DUMP_DIR="$DUMPS" \
            SDL_AUDIODRIVER=dummy \
              timeout 180s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT"
          ) >"$LOG" 2>&1
          RC=$?
          set -e
          cat "$LOG"
          if [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi
          test -s "$DUMPS/frame-794.wram.bin"
          test -s "$DUMPS/frame-2874.wram.bin"
          test -s "$DUMPS/frame-5000.wram.bin"

      - name: Compose canonical 2014 replay result
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compose_historical_replay_result.py \
            --smv-meta "$RUNNER_TEMP/dessyreqt-4250.json" \
            --trace-summary "$RUNNER_TEMP/dessyreqt-first-race-state.json" \
            --reference-tsv "$RUNNER_TEMP/dessyreqt-first-race-state.tsv" \
            --native-dump-dir "$RUNNER_TEMP/native-2014-dumps" \
            --out analysis/generated/historical-2014-first-race-replay.json

      - name: Record exact 2014 native replay fidelity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("analysis/generated/historical-2014-first-race-replay.json")
          d=json.loads(p.read_text())
          if len(d["shared_sampled_frames"]) < 10:
              raise SystemExit(
                  f"too few shared checkpoints: {len(d['shared_sampled_frames'])}"
              )
          if d["sampled_native_reference_match"]:
              print("exact 2014 historical race replay matches native/reference checkpoints")
          else:
              print(
                  "KNOWN FIDELITY GAP: native/reference historical replay diverges "
                  f"beginning at frame {d['first_sampled_mismatch_frame']}; "
                  "preserving this as decompilation/runtime evidence"
              )
              print(
                  "native at reference race entry:",
                  d["native_in_race_at_reference_entry"],
                  "native at reference results:",
                  d["native_results_at_reference_results"],
              )
          PY

      - name: Persist available 2014 historical evidence
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            analysis/generated/historical-2014-smv-metadata.json \
            analysis/generated/historical-2014-first-race-reference.json \
            analysis/generated/historical-2014-first-race-replay.json
          do
            if [ -f "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "no new 2014 historical evidence to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record historical 2014 replay evidence"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload historical replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dessyreqt-4250-first-race-replay
          path: |
            ${{ runner.temp }}/dessyreqt-4250.input
            ${{ runner.temp }}/dessyreqt-first-5000.input
            ${{ runner.temp }}/dessyreqt-4250.json
            ${{ runner.temp }}/dessyreqt-4250.srm
            ${{ runner.temp }}/dessyreqt-first-race-trace.jsonl
            ${{ runner.temp }}/dessyreqt-first-race-state.tsv
            ${{ runner.temp }}/dessyreqt-first-race-state.json
            ${{ runner.temp }}/dessyreqt-first-race-summary.txt
            analysis/generated/historical-2014-smv-metadata.json
            analysis/generated/historical-2014-first-race-reference.json
            analysis/generated/historical-2014-first-race-replay.json
            ${{ runner.temp }}/dessyreqt-checkpoints.script
            ${{ runner.temp }}/native-2014.log
            ${{ runner.temp }}/native-2014-dumps/
          retention-days: 7

# One deliberate exact-main original/native Zoo RF083/RF084 causal campaign.
# PR changes to the request marker are the sole automatic trigger. Existing
# source-qualified QA-01 producer, tests, artifacts and release gate authority
# are preserved by calling the owning reusable campaign without alteration.
name: Source-bound Zoo RF083/RF084 causal request

on:
  push:
    branches: [main]
    paths:
      - "docs/qa01/REQUEST-ZOO-CAUSAL.md"

permissions:
  contents: read

concurrency:
  group: qa01-zoo-causal-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify_request:
    runs-on: ubuntu-22.04
    outputs:
      observer_enabled: ${{ steps.guard.outputs.observer_enabled }}
      rf094_enabled: ${{ steps.guard.outputs.rf094_enabled }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject unrelated source edits or unincremented campaign requests
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git show "${GITHUB_SHA}^:docs/qa01/REQUEST-ZOO-CAUSAL.md" > "$RUNNER_TEMP/previous-zoo-request.md"
          python3 tools/ci_playtest_request_guard.py \
            --previous "$RUNNER_TEMP/previous-zoo-request.md" \
            --current docs/qa01/REQUEST-ZOO-CAUSAL.md \
            --source-sha "$GITHUB_SHA" \
            --marker docs/qa01/REQUEST-ZOO-CAUSAL.md \
            --gha-output "$GITHUB_OUTPUT"
          echo "Authorized source-bound Zoo observer campaign; no automatic USA event or release credit." >> "$GITHUB_STEP_SUMMARY"

  original_native_zoo_causal:
    needs: qualify_request
    if: ${{ needs.qualify_request.result == 'success' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      zoo_race_mesh: true
      zoo_dp_window: true
      # Collect real result follow-through, next-Bowl progression and a fresh
      # original/native guest ranked-record reload on the SAME source epoch.
      # The owning campaign admits cold-guest collection only after successful
      # source classification (including genuine strict divergence); it never
      # awards event credit or proves Windows disk persistence.
      source_followthrough: true
      zoo_next_bowl: true
      qa01_cold_guest_reload: true
      # One validated request mode controls both instrumented cores together.
      # `off` keeps RF015/RF017 and the raw mesh while disabling all RF083-090 hooks.
      qa01_rf084_native_sound_dp: ${{ needs.qualify_request.outputs.observer_enabled == 'true' }}
      qa01_rf088_rf089_echo: ${{ needs.qualify_request.outputs.observer_enabled == 'true' }}
      # An explicit sequence-20+ source request controls RF094; old cases stay OFF.
      qa01_rf094_spc_dsp: ${{ needs.qualify_request.outputs.rf094_enabled == 'true' }}
      baldosa_refresh_beam_rate: true
      baldosa_io_clock_order: true

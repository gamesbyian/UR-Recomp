name: Native racer presentation acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/presentation/**"
      - "tools/apply_native_racer_presentation_probe.py"
      - "tools/summarize_racer_semantic_trace.py"
      - "tools/measure_racer_hd_fallback_frequency.py"
      - "tools/measure_racer_hd_live_draws.py"
      - "tools/measure_racer_hd_scene_tail.py"
      - "tools/check_racer_hd_pixel_confinement.py"
      - "tools/select_racer_hd_same_state_native_frame.py"
      - "tools/check_racer_hd_foreground_occlusion.py"
      - "tools/probe_racer_hd_fallback_family.py"
      - "tools/probe_racer_hd_state_reuse.py"
      - "tools/build_racer_hd_asset_dossier.py"
      - "tools/build_racer_pose_equivalence.py"
      - "tools/build_racer_hd_review_packet.py"
      - "tools/check_ppm.py"
      - "tools/check_racer_presentation_trace.py"
      - "tools/build_racer_hd_shipping_readiness.py"
      - "analysis/data/racer-hd-art-approval.json"
      - "analysis/data/racer-hd-art-approval-1354-1356.json"
      - "analysis/data/racer-hd-art-approval-1280-1286.json"
      - "tests/unit/test_build_racer_hd_asset_dossier.py"
      - "tests/unit/test_build_racer_pose_equivalence.py"
      - "tests/unit/test_build_racer_hd_review_packet.py"
      - "tests/unit/test_build_racer_hd_shipping_readiness.py"
      - "tests/unit/test_apply_native_racer_presentation_probe.py"
      - "tests/unit/test_summarize_racer_semantic_trace.py"
      - "tests/unit/test_check_racer_presentation_trace.py"
      - "tests/unit/test_measure_racer_hd_fallback_frequency.py"
      - "tests/unit/test_measure_racer_hd_live_draws.py"
      - "tests/unit/test_measure_racer_hd_scene_tail.py"
      - "tests/unit/test_racer_hd_pixel_confinement.py"
      - "tests/unit/test_select_racer_hd_same_state_native_frame.py"
      - "tests/unit/test_racer_hd_foreground_occlusion.py"
      - "tests/unit/test_probe_racer_hd_fallback_family.py"
      - "tests/native/racer_hd_presenter_test.cpp"
      - "tests/native/racer_replacement_selector_test.cpp"
      - "tests/native/racer_oam_placement_test.cpp"
      - "tests/input/two-player-first-race-observe.script"
      - "tests/input/two-player-first-race.input"
      - "tests/input/qa08-one-player-racer-motion.script"
      - "tests/input/qa08-vs-racer-motion.script"
      - "tests/input/vs-first-race.input"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snesrecomp.json"
      - "tools/toolchain-entries/sdl3.json"
      - "analysis/data/racer-hd-replacement-prototype.json"
      - "analysis/generated/racer-hd-fallback-frequency-2026-10-05.json"
      - ".github/workflows/racer-native-presentation-acceptance.yml"

concurrency:
  group: racer-native-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Probe next measured fallback family reuse
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/probe_racer_hd_fallback_family.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --json-out "$RUNNER_TEMP/racer-hd-next-family-probe.json" \
            --output-dir "$RUNNER_TEMP/racer-hd-next-family-probe" \
            --trace-out "$RUNNER_TEMP/racer-hd-next-family-trace.json" \
            | tee "$RUNNER_TEMP/racer-hd-next-family-probe.txt"

      - name: Build next-family Racer HD review evidence
        shell: bash
        run: |
          set -euo pipefail
          ROM="reference/roms/retail/Uniracers_USA.sfc"
          DOSSIER="$RUNNER_TEMP/racer-hd-next-family-dossier"

          python3 tools/build_racer_hd_asset_dossier.py \
            "$ROM" \
            --trace "$RUNNER_TEMP/racer-hd-next-family-trace.json" \
            --window-start 1280 \
            --window-end 1283 \
            --output-dir "$DOSSIER" \
            > "$RUNNER_TEMP/racer-hd-next-family-dossier.txt"

          python3 tools/build_racer_pose_equivalence.py \
            "$DOSSIER/manifest.json" \
            --out "$DOSSIER/pose-equivalence.json" \
            > "$RUNNER_TEMP/racer-hd-next-family-equivalence.txt"

          python3 tools/build_racer_hd_shipping_readiness.py \
            "$DOSSIER/pose-equivalence.json" \
            --decisions analysis/data/racer-hd-art-approval-1280-1286.json \
            --out "$DOSSIER/shipping-readiness.json" \
            --require-shipping-ready \
            > "$RUNNER_TEMP/racer-hd-next-family-shipping-readiness.txt"

          python3 tools/build_racer_hd_review_packet.py \
            "$DOSSIER/manifest.json" \
            "$DOSSIER/pose-equivalence.json" \
            --output-dir "$DOSSIER/review" \
            --readiness "$DOSSIER/shipping-readiness.json" \
            > "$RUNNER_TEMP/racer-hd-next-family-review.txt"

          python3 - "$DOSSIER/manifest.json" "$DOSSIER/shipping-readiness.json" <<'PY'
          import json, pathlib, sys
          dossier = json.loads(pathlib.Path(sys.argv[1]).read_text())
          readiness = json.loads(pathlib.Path(sys.argv[2]).read_text())
          reps = {r["representation_id"]: r for r in dossier["representations"]}
          p1 = reps["ordinary-racer-0x0544-p1-frequency-0578-reference"]
          p2 = reps["ordinary-racer-0x0578-p2-frequency-0544-reference"]
          proof = p1["art_review"]["palette_reuse_proof"]
          assert proof["stock_normalized_byte_identical"] is True
          assert proof["authored_normalized_byte_identical"] is True
          assert proof["normalized_stock_sha256"] == "f78818b7924ce450ceca6d425f11e520388db635a77e6fec9a30236e960b82e4"
          assert p1["art_review"]["authored_candidate"]["rgba_sha256"] == "0254ccf6722ec2dfccd0d5d449c8371974c54a35c28efd4e1071e093782e341a"
          assert p2["art_review"]["authored_candidate"]["rgba_sha256"] == "c2a76550ed07481f22ba832a75170c4609fd2b1bd45d748d5c2d8f90a1d66201"
          review = p2["art_review"]["authored_candidate"]["gameplay_scale_review"]
          assert review["stock_alpha_bounds"] == [17, 5, 47, 36]
          assert review["candidate_alpha_bounds"] == [17, 5, 47, 36]
          assert review["candidate_contact_x2_y2"] == [77, 72]
          assert review["alpha_iou"] >= 0.67
          assert readiness["shipping_ready"] is True
          assert readiness["counts"]["approved"] == 2
          print("UR_RACER_NEXT_FAMILY_REVIEW PASS approved=2")
          PY

          python3 tools/check_racer_hd_temporal_coherence.py \
            "$ROM" \
            --sequence-key ordinary-race-1280-1283-frequency-hold \
            --json-out "$RUNNER_TEMP/racer-hd-next-family-temporal-a.json" \
            > "$RUNNER_TEMP/racer-hd-next-family-temporal-a.txt"

          python3 tools/check_racer_hd_temporal_coherence.py \
            "$ROM" \
            --sequence-key ordinary-race-1285-1286-frequency-hold \
            --json-out "$RUNNER_TEMP/racer-hd-next-family-temporal-b.json" \
            > "$RUNNER_TEMP/racer-hd-next-family-temporal-b.txt"
      - name: Probe next remaining measured Racer HD state
        shell: bash
        run: |
          set -euo pipefail
          STATE='{"p1_primary":"0x0545","p2_primary":"0x057C","p1_companion":"0x0000","p2_companion":"0x0C27","p1_selector":0,"p2_selector":0,"p1_companion_gate_word":"0x0000","p2_companion_gate_word":"0x0001"}'
          python3 tools/probe_racer_hd_state_reuse.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --state-json "$STATE" \
            --frames "1401,1402,1403,1404,1405,1406" \
            --json-out "$RUNNER_TEMP/racer-hd-next-ranked-state.json" \
            --output-dir "$RUNNER_TEMP/racer-hd-next-ranked-state" \
            > "$RUNNER_TEMP/racer-hd-next-ranked-state.txt"
      - name: Install native build dependencies
        run: |
          cmake --version
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libpulse-dev libxss-dev libxtst-dev

      - name: Verify selector, placement, and orientation contracts
        shell: bash
        run: |
          set -euo pipefail
          CXX="${CXX:-c++}"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_replacement_selector_test.cpp             native/presentation/racer_replacement_selector.cpp             -o "$RUNNER_TEMP/racer-selector-test"
          "$RUNNER_TEMP/racer-selector-test"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_oam_placement_test.cpp             native/presentation/racer_oam_placement.cpp             -o "$RUNNER_TEMP/racer-oam-test"
          "$RUNNER_TEMP/racer-oam-test"
          "$CXX" -std=c++17 -I native/presentation             tests/native/racer_hd_presenter_test.cpp             native/presentation/racer_replacement_selector.cpp             -o "$RUNNER_TEMP/racer-hd-presenter-test"
          "$RUNNER_TEMP/racer-hd-presenter-test"

      - name: Stage pinned SNESRecomp
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          # bootstrap_toolchain now applies the repository-owned patch stack
          # even for clone-only staging; do not apply input-file.patch twice.
          grep -F 'HostGetenv("INPUT_FILE")' "$FRAMEWORK/runner/src/desktop/host_main.c"

      - name: Scaffold and inject presentation probe
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/racer-presentation-acceptance"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay \
              --no-github --no-submodules --generate --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          python3 tools/apply_native_racer_presentation_probe.py "$ROOT"

          python3 "$GITHUB_WORKSPACE/tools/bootstrap_toolchain.py" --offline --tool sdl3 --clone-only
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10" \
            -DUR_RECOMP_SOURCE_ROOT="$GITHUB_WORKSPACE"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Run Original and HD draw-frame acceptance routes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/racer-presentation-acceptance/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"
          INPUT="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"
          ORIGINAL_A_LOG="$RUNNER_TEMP/racer-original-a.log"
          ORIGINAL_B_LOG="$RUNNER_TEMP/racer-original-b.log"
          HD_LOG="$RUNNER_TEMP/racer-hd.log"
          OBJ_ONLY_LOG="$RUNNER_TEMP/racer-original-obj-only.log"
          CAPTURE_LOG="$RUNNER_TEMP/racer-hd-capture-only.log"
          ORIGINAL_A_DUMPS="$RUNNER_TEMP/racer-original-a-dumps"
          ORIGINAL_B_DUMPS="$RUNNER_TEMP/racer-original-b-dumps"
          HD_DUMPS="$RUNNER_TEMP/racer-hd-dumps"
          OBJ_ONLY_DUMPS="$RUNNER_TEMP/racer-original-obj-only-dumps"
          CAPTURE_DUMPS="$RUNNER_TEMP/racer-hd-capture-only-dumps"
          ORIGINAL_A_SHOT="$RUNNER_TEMP/racer-original-a-1220.ppm"
          ORIGINAL_B_SHOT="$RUNNER_TEMP/racer-original-b-1220.ppm"
          HD_SHOT="$RUNNER_TEMP/racer-hd-1220.ppm"
          OBJ_ONLY_SHOT="$RUNNER_TEMP/racer-original-obj-only-1220.ppm"
          CAPTURE_SHOT="$RUNNER_TEMP/racer-hd-capture-only-1220.ppm"
          mkdir -p "$ORIGINAL_A_DUMPS" "$ORIGINAL_B_DUMPS" "$HD_DUMPS" "$OBJ_ONLY_DUMPS" "$CAPTURE_DUMPS"

          run_route() {
            local mode="$1" log="$2" dumps="$3" shot="$4"
            shift 4
            local -a visual_capture=()
            if [ "$mode" = Original-OBJ-only ] || [ "$mode" = Capture-Only ]; then
              local series="$RUNNER_TEMP/racer-$mode-frames"
              mkdir -p "$series"
              visual_capture=("SNESRECOMP_SCREENSHOT_DIR=$series" "SNESRECOMP_SCREENSHOT_FROM=1210" "SNESRECOMP_SCREENSHOT_TO=1235")
            fi
            set +e
            env "$@" "${visual_capture[@]}" \
              SNESRECOMP_DUMP_DIR="$dumps" \
              SNESRECOMP_INPUT_FILE="$INPUT" \
              SNESRECOMP_SCREENSHOT="$shot" \
              SNESRECOMP_SCREENSHOT_FRAME=1220 \
              SDL_AUDIODRIVER=dummy \
              timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" >"$log" 2>&1
            local status=$?
            set -e
            cat "$log"
            if [ "$status" -ne 0 ]; then
              echo "::error::$mode native route exited with status $status"
              exit "$status"
            fi
          }

          run_route Original-A "$ORIGINAL_A_LOG" "$ORIGINAL_A_DUMPS" "$ORIGINAL_A_SHOT"
          run_route Original-B "$ORIGINAL_B_LOG" "$ORIGINAL_B_DUMPS" "$ORIGINAL_B_SHOT"
          run_route HD "$HD_LOG" "$HD_DUMPS" "$HD_SHOT" \
            UR_RACER_HD=1 UR_RACER_HD_CENSUS=1 \
            UR_RACER_HD_OBJ_LAYER_PAM="$RUNNER_TEMP/racer-hd-legacy-obj-1220.pam" \
            UR_RACER_HD_OBJ_LAYER_FRAME=1220

          # The pinned legacy PPU previously populated the source OBJ
          # z-buffer but failed to publish its ARGB overlay render line.
          # Require at least one truly opaque alpha pixel in the native
          # accepted frame. Do not mistake a written all-transparent PAM
          # for successfully extracted Original graphics.
          python3 - "$RUNNER_TEMP/racer-hd-legacy-obj-1220.pam" <<'PY'
          import pathlib, sys
          from tools.check_racer_hd_foreground_occlusion import parse_obj_pam
          rgba = parse_obj_pam(pathlib.Path(sys.argv[1]).read_bytes())
          alpha = sum(rgba[i] != 0 for i in range(3, len(rgba), 4))
          assert alpha > 0, "legacy PPU OBJ capture is entirely transparent"
          print(f"UR_RACER_HD_LEGACY_OBJ_CAPTURE PASS opaque_pixels={alpha}")
          PY

          run_route Original-OBJ-only "$OBJ_ONLY_LOG" "$OBJ_ONLY_DUMPS" "$OBJ_ONLY_SHOT" SNESRECOMP_LAYER_MASK=0x10
          run_route Capture-Only "$CAPTURE_LOG" "$CAPTURE_DUMPS" "$CAPTURE_SHOT" UR_RACER_HD=1 UR_RACER_HD_CAPTURE_ONLY=1

          # The two extra processes advance slightly differently: on the
          # retained native reference, OBJ-only matches stock frame 1220
          # at its 1221, capture-only at its 1219. Select *actual host
          # screenshots* by exact eight-word guest composition, never by
          # assuming raw frame indices coincide across processes.
          python3 - "$ORIGINAL_A_LOG" "$ORIGINAL_B_LOG" "$HD_LOG" <<'PY'
          import pathlib, re, sys
          pat = re.compile(r"^UR_RACER_PRESENTATION_TRACE frame=1220 (.+)$", re.MULTILINE)
          values = []
          for name in sys.argv[1:]:
              matches = pat.findall(pathlib.Path(name).read_text(encoding="utf-8"))
              assert len(matches) == 1, (name, matches)
              values.append(matches[0])
          assert len(set(values)) == 1, values
          print("UR_RACER_HD_BASELINE_SOURCE_ALIGNMENT PASS frame=1220 controls=3")
          PY

          python3 tools/select_racer_hd_same_state_native_frame.py \
            --reference-log "$ORIGINAL_A_LOG" --reference-frame 1220 \
            --candidate-log "$OBJ_ONLY_LOG" \
            --candidate-dir "$RUNNER_TEMP/racer-Original-OBJ-only-frames" \
            --width 256 --height 224 \
            --out-ppm "$RUNNER_TEMP/racer-original-obj-only-aligned-1220.ppm" \
            --json-out "$RUNNER_TEMP/racer-obj-only-source-alignment.json"
          python3 tools/select_racer_hd_same_state_native_frame.py \
            --reference-log "$ORIGINAL_A_LOG" --reference-frame 1220 \
            --candidate-log "$CAPTURE_LOG" \
            --candidate-dir "$RUNNER_TEMP/racer-Capture-Only-frames" \
            --width 1024 --height 896 \
            --out-ppm "$RUNNER_TEMP/racer-hd-capture-only-aligned-1220.ppm" \
            --json-out "$RUNNER_TEMP/racer-capture-only-source-alignment.json"


          # These are actual host presentation results, not registration matches.
          python3 tools/measure_racer_hd_live_draws.py \
            "$HD_LOG" --json-out "$RUNNER_TEMP/racer-hd-live-census.json" \
            > "$RUNNER_TEMP/racer-hd-live-census.txt"
          python3 - "$RUNNER_TEMP/racer-hd-live-census.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1], encoding="utf-8"))["measurement"]
          assert m["guest_frames_with_host_presents"] >= 100, m
          assert m["hd_drawn_guest_frames"] > 0, m
          assert m["original_presented_guest_frames"] > 0, m
          assert m["capture_armed_guest_frames"] >= m["hd_drawn_guest_frames"], m
          assert m["hd_run_count"] > 0, m
          assert m["player_frame_denominator"] == 2 * m["guest_frames_with_host_presents"], m
          print(
              "UR_RACER_HD_LIVE_CENSUS PASS "
              f"hd={m['hd_drawn_guest_frames']} "
              f"presented={m['guest_frames_with_host_presents']} "
              f"fallback={m['original_presented_guest_frames']} "
              f"bursts={m['hd_run_count']} "
              f"switches={m['draw_mode_switches']} "
              f"player_hd={m['hd_drawn_player_frames']}"
          )
          PY

          # Measure the race segment, excluding 1179 boot/setup frames.
          python3 tools/measure_racer_hd_live_draws.py \
            "$HD_LOG" --from-frame 1180 --to-frame 1620 \
            --json-out "$RUNNER_TEMP/racer-hd-live-race-window.json" \
            > "$RUNNER_TEMP/racer-hd-live-race-window.txt"
          python3 - "$RUNNER_TEMP/racer-hd-live-race-window.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1], encoding="utf-8"))["measurement"]
          assert m["guest_frames_observed"] == 441, m
          assert m["guest_frames_with_host_presents"] == 441, m
          assert m["hd_drawn_guest_frames"] > 0, m
          assert m["original_presented_guest_frames"] > 0, m
          print(
              "UR_RACER_HD_LIVE_RACE_WINDOW PASS "
              f"hd={m['hd_drawn_guest_frames']}/441 "
              f"fallback={m['original_presented_guest_frames']} "
              f"switches={m['draw_mode_switches']} "
              f"bursts={m['hd_run_count']}"
          )
          PY

          # Guard all non-racer pixels at native 4x, not just logical centres.
          python3 tools/check_racer_hd_pixel_confinement.py \
            --original "$ORIGINAL_A_SHOT" \
            --original-control "$ORIGINAL_B_SHOT" \
            --hd "$HD_SHOT" --hd-log "$HD_LOG" --frame 1220 \
            --json-out "$RUNNER_TEMP/racer-hd-frame-1220-confinement.json"

          # Match the logged capture to the actually selected native guest
          # frame, not to the reference process's shifted frame number.
          python3 - "$RUNNER_TEMP/racer-capture-only-source-alignment.json" "$CAPTURE_LOG" <<'PY'
          import json, pathlib, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          selected = record["selected_guest_frame"]
          log = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          assert f"UR_RACER_HD_CAPTURE_ONLY frame={selected} instances=4" in log
          print(f"UR_RACER_HD_CAPTURE_ONLY_ALIGNED PASS frame={selected}")
          PY
          python3 tools/check_racer_hd_pixel_confinement.py \
            --original "$ORIGINAL_A_SHOT" \
            --original-control "$ORIGINAL_B_SHOT" \
            --hd "$RUNNER_TEMP/racer-hd-capture-only-aligned-1220.ppm" --hd-log "$HD_LOG" --frame 1220 --capture-only \
            --json-out "$RUNNER_TEMP/racer-hd-capture-removal-1220.json"

          # Inspect the isolated stock OBJ layer for *potential* lost
          # foreground depth at one exact original/HD 2P guest frame.
          # The analyzer never treats RGB disagreement alone as proof of BG
          # priority: other OBJ and PPU colour math remain valid causes.
          test -s "$OBJ_ONLY_SHOT"
          python3 tools/check_racer_hd_foreground_occlusion.py \
            --original "$ORIGINAL_A_SHOT" \
            --original-control "$ORIGINAL_B_SHOT" \
            --hd "$HD_SHOT" --native-log "$HD_LOG" \
            --obj-only-ppm "$RUNNER_TEMP/racer-original-obj-only-aligned-1220.ppm" \
            --frame 1220 \
            --json-out "$RUNNER_TEMP/racer-hd-foreground-1220.json" \
            > "$RUNNER_TEMP/racer-hd-foreground-1220.txt"
          python3 - "$RUNNER_TEMP/racer-hd-foreground-1220.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1], encoding="utf-8"))
          assert m["frame"] == 1220, m
          assert m["density"] == 4, m
          assert m["native_split_obj_opaque_pixels"] > 0, m
          assert m["potential_foreground_occlusion_overpaint_pixels"] <= m[
              "stock_obj_differs_from_original_rgb_pixels"
          ], m
          print(
              "UR_RACER_HD_FOREGROUND_WITNESS PASS "
              f"obj={m['native_split_obj_opaque_pixels']} "
              f"ambiguous={m['stock_obj_differs_from_original_rgb_pixels']} "
              f"possible_overpaint={m['potential_foreground_occlusion_overpaint_pixels']} "
              f"needs_priority_review={int(m['review_required'])}"
          )
          PY


          for stem in original-a original-b hd; do

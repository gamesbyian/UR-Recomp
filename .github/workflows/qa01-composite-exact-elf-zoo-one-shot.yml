name: TEMP QA-01 replay exact composite ELF with full Zoo original/native checks

# One independent read-only CI experiment. NEVER merge this temporary trigger.
on:
  pull_request:
    paths:
      - .github/workflows/qa01-composite-exact-elf-zoo-one-shot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: qa01-composite-pinned-elf-full-zoo-20261016
  cancel-in-progress: false

jobs:
  exact-existing-elf-original-native-zoo:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Download exact earlier native ELF, original core and reference executable
        uses: actions/download-artifact@v4
        with:
          repository: gamesbyian/UR-Recomp
          run-id: 38879846733
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: qa01-campaign-reference-and-native-binaries
          path: ${{ runner.temp }}/qa01-exact-composite
      - name: Verify source binaries and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libgl1 libopengl0 libfreetype6 libdecor-0-0 \
            libx11-6 libxext6 libxrandr2 \
            libxcursor1 libxi6 libxss1 libwayland-client0 \
            libxkbcommon0 libegl1 libgles2 libdrm2 libgbm1 \
            libasound2 libpulse0 libudev1 libdbus-1-3 xvfb
          BIN="$RUNNER_TEMP/qa01-exact-composite"
          (cd "$BIN" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$BIN/native" | cut -d' ' -f1)" = 9a3bd17afd8377a4c83e76c05cd57dfdae2488e498aa4bea1b90a2baa018bb48
          test "$(sha256sum "$BIN/snes9x_libretro.so" | cut -d' ' -f1)" = ec4ce30d80e0b2c22b5d700aec01d601bd85db452ccb8e2b32fa75e9fe63554a
          chmod +x "$BIN/native" "$BIN/snesref"
          ldd "$BIN/native" > "$RUNNER_TEMP/qa01-native-ldd.log"
          if grep -q 'not found' "$RUNNER_TEMP/qa01-native-ldd.log"; then
            cat "$RUNNER_TEMP/qa01-native-ldd.log"; exit 1
          fi
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
      - name: Run one actual original/native Zoo source case with unmasked full handoff observers
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/qa01-exact-composite"
          ROOT="$RUNNER_TEMP/qa01-exact-zoo"
          mkdir -p "$ROOT"
          python3 tools/qa01_event_campaign.py plan \
            --selected zoom-zoo --source-sha "$(git rev-parse HEAD)" \
            --out "$ROOT/plan.json"
          set +e
          timeout --signal=TERM --kill-after=30s 80m \
            python3 tools/probe_original_event_complete.py \
              --case zoom-zoo --native-backend pinned-baldosa \
              --source-horizon 22000 \
              --snesref "$BIN/snesref" \
              --core "$BIN/snes9x_libretro.so" \
              --native "$BIN/native" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --work-dir "$ROOT/work" \
              --json-out "$ROOT/producer-report.json" \
              --zoo-race-mesh --zoo-dp-window --zoo-terminal-phase \
              --source-followthrough --zoo-next-bowl \
              > "$ROOT/producer.log" 2>&1
          producer_rc=$?
          set -e
          echo "Source-qualified original/native producer exit: $producer_rc"
          tail -n 60 "$ROOT/producer.log" || true
          set +e
          python3 tools/qa01_event_campaign.py classify \
            --plan "$ROOT/plan.json" --case zoom-zoo \
            --producer-exit "$producer_rc" \
            --producer-report "$ROOT/producer-report.json" \
            --producer-log "$ROOT/producer.log" \
            --out "$ROOT/case-result.json"
          case_rc=$?
          set -e
          if [[ "$producer_rc" -ne 0 || "$case_rc" -ne 0 ]]; then
            echo "Scientific or transport negative; inspect retained source evidence, never waive it" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - "$ROOT/producer-report.json" "$ROOT/case-result.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          c=json.load(open(sys.argv[2]))
          expected={
            "rom_sha256":"859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478",
            "original_movie_sha256":"06dce29e9d36997fc2a1fac4bab72180ab6c8096366cfcf05780c1b2dea4b442",
            "source_sram_sha256":"a6af0ddf25ae5feafba301100938f5ef81137ee76dcdc483a04fb6e961347828",
            "native_executable_sha256":"9a3bd17afd8377a4c83e76c05cd57dfdae2488e498aa4bea1b90a2baa018bb48",
            "reference_core_sha256":"ec4ce30d80e0b2c22b5d700aec01d601bd85db452ccb8e2b32fa75e9fe63554a",
            "input_sha256":"04ad1c2d70b38d3f33513468be2c94acc4b0c452a323631aebb390a3542f75e8"}
          for key,value in expected.items():
            if p.get(key)!=value:
              raise SystemExit(f"Exact source identity changed at {key}: {p.get(key)}")
          mesh=p["zoo_race_mesh"]
          if mesh["masked_or_excluded_wram_bytes"]!=0:
            raise SystemExit("Missing genuinely unmasked full-WRAM comparisons")
          d=p["zoo_next_bowl_handoff"]
          dp=mesh["late_direct_page_window"]
          if len(d["samples"])!=11 or len(dp["samples"])!=13:
            raise SystemExit("Expected 11 true Bowl samples and 13 consecutive late-Zoo samples")
          with open(sys.argv[3],"a",encoding="utf-8") as out:
            out.write("Exact composite native ELF independently re-executed on the unchanged original 2014 movie.\n\n")
            out.write(f"Guest-relative result: {c['evidence']['terminal_guest_relative_frames']}\n\n")
            out.write(f"True next Bowl (archived/original/native): {d['source_next_bowl_active_entry_offset']}/{d['fresh_reference_next_bowl_entry_offset']}/{d['fresh_native_next_bowl_entry_offset']}\n\n")
            out.write("Unmasked 128KiB WRAM comparisons; 0/45 release admissions. No Windows product inference.\n")
          PY
      - name: Retain source receipts without ROM or full memory dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa01-composite-exact-elf-zoo-observer
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa01-exact-zoo/plan.json
            ${{ runner.temp }}/qa01-exact-zoo/case-result.json
            ${{ runner.temp }}/qa01-exact-zoo/producer-report.json
            ${{ runner.temp }}/qa01-exact-zoo/producer.log

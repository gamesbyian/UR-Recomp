name: PAL survivor subregion probe

on:
  push:
    branches:
      - chatgpt/pal-subregion-survivor-refinement-2026-09-30

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine survivor windows
        run: python3 tools/refine_pal_snes2asm_survivors.py
      - name: Build current comparative atlas
        run: |
          python3 tools/build_comparative_code_atlas.py
          cat analysis/generated/comparative-code-atlas.md
      - name: Probe fresh Europe/USA structural anchors
        run: |
          python3 tools/compare_semantic_anchors.py
          python3 tools/build_cross_build_symbol_correspondence.py
          python3 - <<'PY'
          import json
          p=json.load(open("analysis/generated/cross-build-symbol-correspondence.json"))
          wanted={"Player_ApplyVerticalAcceleration","Input_DecodePlayer1Buttons"}
          for row in p["functions"]:
              if row["name"] in wanted and row["build"] != "legacy-beta":
                  print("PROMOTED_ROW="+json.dumps(row,sort_keys=True))
          PY
      - name: Preserve regenerated comparative surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/semantic-anchor-cross-build-matches.json \
                  analysis/generated/semantic-anchor-cross-build-matches.md \
                  analysis/generated/cross-build-symbol-correspondence.json \
                  analysis/generated/cross-build-symbol-correspondence.md
          if git diff --cached --quiet; then
            echo "No generated correspondence changes"
          else
            git commit -m "Regenerate cross-build correspondence [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pal-snes2asm-subregion-alignment
          path: |
            analysis/generated/pal-snes2asm-subregion-alignment.json
            analysis/generated/pal-snes2asm-subregion-alignment.md
            analysis/generated/comparative-code-atlas.json
            analysis/generated/comparative-code-atlas.md
          if-no-files-found: error

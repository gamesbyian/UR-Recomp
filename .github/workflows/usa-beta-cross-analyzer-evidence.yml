name: One-shot USA beta cross-analyzer evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/classify_usa_beta_deltas.py"
      - "tests/unit/test_classify_usa_beta_deltas.py"
      - ".github/workflows/usa-beta-cross-analyzer-evidence.yml"
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Run bounded snes2asm classification
        run: python3 tools/classify_usa_beta_deltas.py
      - name: Run focused unit regression
        run: python3 -m unittest tests.unit.test_classify_usa_beta_deltas -v
      - name: Show compact result
        run: cat analysis/generated/usa-beta-cross-analyzer.md
      - name: Commit generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/usa-beta-cross-analyzer.json analysis/generated/usa-beta-cross-analyzer.md
          git diff --cached --quiet || git commit -m "analysis: record USA beta snes2asm classification"
          git push origin HEAD:${{ github.head_ref }}

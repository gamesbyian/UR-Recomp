name: Racer HD replacement prototype

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: racer-hd-replacement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Run focused unit tests
        run: python3 -m unittest tests.unit.test_racer_hd_replacement_prototype tests.unit.test_racer_hd_temporal_coherence -v
      - name: Render synchronized semantic replacement prototypes
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"])
          registry = json.loads(
              Path("analysis/data/racer-hd-replacement-prototype.json").read_text()
          )
          for entry in registry["entries"]:
              rep = entry["representation_id"]
              frame = entry["semantic_frame_id"]
              out = root / f"racer-hd-prototype-{rep}"
              subprocess.run(
                  [
                      "python3",
                      "tools/prototype_racer_hd_replacement.py",
                      "reference/roms/retail/Uniracers_USA.sfc",
                      "--semantic-frame-id", frame,
                      "--representation-id", rep,
                      "--output-dir", str(out),
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              m = json.loads((out / "manifest.json").read_text())
              contact = entry["registration"]["semantic_anchors"]["wheel_contact_x2_y2"]
              assert m["semantic_frame_id"] == frame
              assert m["representation_id"] == rep
              assert m["authoritative_state_mutated"] is False
              assert m["fallback"]["byte_exact_to_original_control"] is True
              assert m["validation"]["whole_canvas_registration_preserved"] is True
              assert m["validation"]["orientation_applied_post_selection"] is True
              assert m["remastered_candidate"]["dimensions"] == [256, 256]
              assert m["derived_anchor_probe"]["flip_pivot_x2_y2"] == [63, 63]
              assert m["derived_anchor_probe"]["stock_contact_x2_y2"] == contact
              assert m["validation"]["semantic_anchor_metadata_exact"] is True
              assert m["validation"]["missing_registration_metadata"] == []
              assert (out / m["original"]["comparison_png"]).is_file()
              assert (out / m["remastered_candidate"]["png"]).is_file()
              print(
                  f"UR_RACER_PROTOTYPE PASS representation={rep} "
                  f"semantic={frame} contact={contact}"
              )
          PY
      - name: Check replacement temporal coherence
        run: |
          python3 tools/check_racer_hd_temporal_coherence.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --json-out "$RUNNER_TEMP/racer-hd-temporal-coherence.json" \
            | tee "$RUNNER_TEMP/racer-hd-temporal-coherence.txt"
          python3 - "$RUNNER_TEMP/racer-hd-temporal-coherence.json" <<'PY'
          import json, pathlib, sys
          r = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert r["schema_version"] == 2
          assert r["window"] == [1205, 1220]
          assert all(r["validation"].values())
          for player in ("p1", "p2"):
              assert len(r["sequences"][player]["frames"]) == 16
              assert len(r["sequences"][player]["pairs"]) == 15
              static = [p for p in r["sequences"][player]["pairs"] if p["transition_class"] == "static"]
              dynamic = [p for p in r["sequences"][player]["pairs"] if p["transition_class"] == "dynamic"]
              assert static
              assert dynamic
              assert all(p["static_edge_preserved"] for p in static)
              assert all(p["dynamic_edge_preserved"] for p in dynamic)
              assert all(p["transition_ratio_within_bounds"] for p in dynamic)
          print("UR_RACER_AUTHORED_TEMPORAL_COHERENCE PASS")
          PY

      - name: Measure fifth-family 1261-1267 staircase anchors
        run: |
          ROM="reference/roms/retail/Uniracers_USA.sfc"
          for spec in \
            "057e0542 0x057E 0x0542 0x0D49 0x0000" \
            "057d0541 0x057D 0x0541 0x0D48 0x0000" \
            "057d0540 0x057D 0x0540 0x0D48 0x0000" \
            "057c0540 0x057C 0x0540 0x0D47 0x0000"; do
            set -- $spec
            label="$1"; p1p="$2"; p2p="$3"; p1c="$4"; p2c="$5"
            python3 tools/measure_racer_composed_anchor.py "$ROM" \
              --p1-primary "$p1p" --p2-primary "$p2p" \
              --p1-companion "$p1c" --p2-companion "$p2c" \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate 0x0001 --p2-gate 0x0000 \
              --player p1 --palette-asset-id 0x06 \
              | tee "$RUNNER_TEMP/racer-fifth-$label-p1.json"
            python3 tools/measure_racer_composed_anchor.py "$ROM" \
              --p1-primary "$p1p" --p2-primary "$p2p" \
              --p1-companion "$p1c" --p2-companion "$p2c" \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate 0x0001 --p2-gate 0x0000 \
              --player p2 --palette-asset-id 0x07 \
              | tee "$RUNNER_TEMP/racer-fifth-$label-p2.json"
          done

          # Compare the five non-057C poses against shipping-approved
          # same-player stock geometry. These references differ only in the
          # other racer's synchronized state, so exact RGBA identity proves
          # direct authored reuse rather than semantic-ID guesswork.
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x057E --p2-primary 0x0544 \
            --p1-companion 0x0D49 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-fifth-reference-057e-p1.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x057D --p2-primary 0x0543 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-fifth-reference-057d-p1.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x057F --p2-primary 0x0542 \
            --p1-companion 0x0D4A --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-fifth-reference-0542-p2.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0540 --p2-primary 0x0541 \
            --p1-companion 0x0D2C --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-fifth-reference-0541-p2.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0541 --p2-primary 0x0540 \
            --p1-companion 0x0D0D --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-fifth-reference-0540-p2.json"

      - name: Classify fifth-family visual equivalence
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          phases = ("057e0542", "057d0541", "057d0540", "057c0540")
          names = [
              f"racer-fifth-{phase}-{player}"
              for phase in phases
              for player in ("p1", "p2")
          ] + [
              "racer-fifth-reference-057e-p1",
              "racer-fifth-reference-057d-p1",
              "racer-fifth-reference-0542-p2",
              "racer-fifth-reference-0541-p2",
              "racer-fifth-reference-0540-p2",
          ]
          rows = {name: json.loads((root / f"{name}.json").read_text()) for name in names}
          rgba = {}
          alpha = {}
          for name, row in rows.items():
              rgba.setdefault((row["player"], row["rgba_sha256"]), []).append(name)
              alpha.setdefault(row["alpha_sha256"], []).append(name)
          summary = {
              "family": "ordinary-race-1261-1267-staircase",
              "window": [1261, 1267],
              "rows": rows,
              "same_player_rgba_equivalence_groups": [
                  group for group in rgba.values() if len(group) > 1
              ],
              "alpha_equivalence_groups": [
                  group for group in alpha.values() if len(group) > 1
              ],
              "approved_reuse_checks": {
                  "p1_057e_exact":
                      rows["racer-fifth-057e0542-p1"]["rgba_sha256"]
                      == rows["racer-fifth-reference-057e-p1"]["rgba_sha256"],
                  "p1_057d_exact":
                      rows["racer-fifth-057d0541-p1"]["rgba_sha256"]
                      == rows["racer-fifth-reference-057d-p1"]["rgba_sha256"],
                  "p2_0542_exact":
                      rows["racer-fifth-057e0542-p2"]["rgba_sha256"]
                      == rows["racer-fifth-reference-0542-p2"]["rgba_sha256"],
                  "p2_0541_exact":
                      rows["racer-fifth-057d0541-p2"]["rgba_sha256"]
                      == rows["racer-fifth-reference-0541-p2"]["rgba_sha256"],
                  "p2_0540_exact":
                      rows["racer-fifth-057d0540-p2"]["rgba_sha256"]
                      == rows["racer-fifth-reference-0540-p2"]["rgba_sha256"],
              },
          }
          (root / "racer-fifth-family-equivalence.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Measure fourth-family entry hold and exit anchors
        run: |
          ROM="reference/roms/retail/Uniracers_USA.sfc"
          for spec in \
            "entry 0x0540 0x057F 0x0D0C 0x0D2A 0x0001 0x0001" \
            "hold 0x0540 0x0540 0x0D0C 0x0D0C 0x0001 0x0001" \
            "exit 0x0541 0x057F 0x0D0D 0x0D2A 0x0001 0x0001"; do
            set -- $spec
            label="$1"; p1p="$2"; p2p="$3"; p1c="$4"; p2c="$5"; p1g="$6"; p2g="$7"
            python3 tools/measure_racer_composed_anchor.py "$ROM" \
              --p1-primary "$p1p" --p2-primary "$p2p" \
              --p1-companion "$p1c" --p2-companion "$p2c" \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate "$p1g" --p2-gate "$p2g" \
              --player p1 --palette-asset-id 0x06 \
              | tee "$RUNNER_TEMP/racer-fourth-$label-p1.json"
            python3 tools/measure_racer_composed_anchor.py "$ROM" \
              --p1-primary "$p1p" --p2-primary "$p2p" \
              --p1-companion "$p1c" --p2-companion "$p2c" \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate "$p1g" --p2-gate "$p2g" \
              --player p2 --palette-asset-id 0x07 \
              | tee "$RUNNER_TEMP/racer-fourth-$label-p2.json"
          done

          # Compare against the nearest shipping-approved geometry.
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0541 --p2-primary 0x0540 \
            --p1-companion 0x0D0D --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-fourth-reference-0541d0d-p1.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x057F --p2-primary 0x0542 \
            --p1-companion 0x0D4A --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-fourth-reference-057fd4a-p1.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0540 --p2-primary 0x0541 \
            --p1-companion 0x0D2C --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-fourth-reference-0540d2c-p1.json"

      - name: Classify fourth-family visual equivalence
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          names = [
              f"racer-fourth-{phase}-{player}"
              for phase in ("entry", "hold", "exit")
              for player in ("p1", "p2")
          ] + [
              "racer-fourth-reference-0541d0d-p1",
              "racer-fourth-reference-057fd4a-p1",
              "racer-fourth-reference-0540d2c-p1",
          ]
          rows = {name: json.loads((root / f"{name}.json").read_text()) for name in names}
          rgba = {}
          alpha = {}
          for name, row in rows.items():
              rgba.setdefault((row["player"], row["rgba_sha256"]), []).append(name)
              alpha.setdefault(row["alpha_sha256"], []).append(name)
          summary = {
              "family": "ordinary-race-1230-1239-entry-hold-exit",
              "window": [1230, 1239],
              "rows": rows,
              "same_player_rgba_equivalence_groups": [
                  group for group in rgba.values() if len(group) > 1
              ],
              "alpha_equivalence_groups": [
                  group for group in alpha.values() if len(group) > 1
              ],
              "known_geometry_checks": {
                  "exit_p1_0541d0d_matches_approved_p1":
                      rows["racer-fourth-exit-p1"]["rgba_sha256"]
                      == rows["racer-fourth-reference-0541d0d-p1"]["rgba_sha256"],
                  "p2_057fd2a_matches_approved_p1_057fd4a_alpha":
                      rows["racer-fourth-entry-p2"]["alpha_sha256"]
                      == rows["racer-fourth-reference-057fd4a-p1"]["alpha_sha256"],
                  "p1_0540d0c_matches_approved_p1_0540d2c_alpha":
                      rows["racer-fourth-entry-p1"]["alpha_sha256"]
                      == rows["racer-fourth-reference-0540d2c-p1"]["alpha_sha256"],
              },
          }
          (root / "racer-fourth-family-equivalence.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Measure third-family hold and recovery anchors
        run: |
          ROM="reference/roms/retail/Uniracers_USA.sfc"
          for player_palette in "p1 0x06" "p2 0x07"; do
            set -- $player_palette
            player="$1"
            palette="$2"
            python3 tools/measure_racer_composed_anchor.py "$ROM" \
              --p1-primary 0x0543 --p2-primary 0x0540 \
              --p1-companion 0x0000 --p2-companion 0x0D2C \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate 0x0000 --p2-gate 0x0001 \
              --player "$player" --palette-asset-id "$palette" \
              | tee "$RUNNER_TEMP/racer-third-hold-$player.json"
            python3 tools/measure_racer_composed_anchor.py "$ROM" \
              --p1-primary 0x0542 --p2-primary 0x0541 \
              --p1-companion 0x0000 --p2-companion 0x0D2D \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate 0x0000 --p2-gate 0x0001 \
              --player "$player" --palette-asset-id "$palette" \
              | tee "$RUNNER_TEMP/racer-third-recovery-$player.json"
          done

          # Measure the nearest already-approved same-player P2 poses so reuse
          # is proven by stock RGBA identity rather than semantic-ID similarity.
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0541 --p2-primary 0x0540 \
            --p1-companion 0x0D0D --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-third-reference-0540-p2.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0540 --p2-primary 0x0541 \
            --p1-companion 0x0D2C --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-third-reference-0541-p2.json"
          # Cross-player geometry references: these are already-approved
          # opposite-color poses whose alpha masks may be reusable exactly.
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x057D --p2-primary 0x0543 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-third-crossref-0543-p2.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0540 --p2-primary 0x0541 \
            --p1-companion 0x0D2C --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-third-crossref-0540d2c-p1.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0540 --p2-primary 0x0542 \
            --p1-companion 0x0D2C --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-third-crossref-0542-p2.json"
          python3 tools/measure_racer_composed_anchor.py "$ROM" \
            --p1-primary 0x0541 --p2-primary 0x0540 \
            --p1-companion 0x0D2D --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-third-crossref-0541d2d-p1.json"

      - name: Classify third-family visual equivalence
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          names = [
              "racer-third-hold-p1",
              "racer-third-hold-p2",
              "racer-third-recovery-p1",
              "racer-third-recovery-p2",
              "racer-third-reference-0540-p2",
              "racer-third-reference-0541-p2",
              "racer-third-crossref-0543-p2",
              "racer-third-crossref-0540d2c-p1",
              "racer-third-crossref-0542-p2",
              "racer-third-crossref-0541d2d-p1",
          ]
          rows = {name: json.loads((root / f"{name}.json").read_text()) for name in names}
          hashes = {}
          for name, row in rows.items():
              hashes.setdefault((row["player"], row["rgba_sha256"]), []).append(name)
          summary = {
              "family": "ordinary-race-1244-1252-hold-recovery",
              "window": [1244, 1252],
              "rows": rows,
              "same_player_equivalence_groups": [
                  group for group in hashes.values() if len(group) > 1
              ],
              "cross_player_alpha_equivalence": {
                  "hold_p1_0543_matches_approved_p2_0543":
                      rows["racer-third-hold-p1"]["alpha_sha256"]
                      == rows["racer-third-crossref-0543-p2"]["alpha_sha256"],
                  "hold_p2_0540d2c_matches_approved_p1_0540d2c":
                      rows["racer-third-hold-p2"]["alpha_sha256"]
                      == rows["racer-third-crossref-0540d2c-p1"]["alpha_sha256"],
                  "recovery_p1_0542_matches_approved_p2_0542":
                      rows["racer-third-recovery-p1"]["alpha_sha256"]
                      == rows["racer-third-crossref-0542-p2"]["alpha_sha256"],
                  "recovery_p2_0541d2d_matches_approved_p1_0541d2d":
                      rows["racer-third-recovery-p2"]["alpha_sha256"]
                      == rows["racer-third-crossref-0541d2d-p1"]["alpha_sha256"],
              },
          }
          (root / "racer-third-family-equivalence.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Measure second synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0544 \
            --p1-companion 0x0D49 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-second-sync-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0544 \
            --p1-companion 0x0D49 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-second-sync-p2.json"

      - name: Measure adjacent synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057D --p2-primary 0x0543 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-adjacent-sync-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057D --p2-primary 0x0543 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-adjacent-sync-p2.json"

      - name: Measure duplicate synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0543 \

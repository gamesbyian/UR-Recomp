name: Widescreen +8 strip scheduling experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/widescreen-strip-scheduling-plus8.yml"
      - "tools/instrument_snesref_widescreen_strip_schedule.py"
      - "tools/analyze_widescreen_strip_schedule.py"
      - "tools/analyze_widescreen_preparation_boundary.py"
      - "tools/analyze_widescreen_helper_staging.py"
      - "tools/analyze_widescreen_edge_helper.py"
      - "tools/analyze_widescreen_count32_discriminator.py"
      - "tools/analyze_widescreen_a59e_trace.py"
      - "tools/analyze_widescreen_xphase_discriminator.py"
      - "tools/analyze_widescreen_secondary_lane.py"
      - "tests/unit/test_analyze_widescreen_strip_schedule.py"
      - "tests/unit/test_analyze_widescreen_preparation_boundary.py"
      - "tests/unit/test_analyze_widescreen_helper_staging.py"
      - "tests/unit/test_analyze_widescreen_edge_helper.py"
      - "tests/unit/test_analyze_widescreen_count32_discriminator.py"
      - "tests/unit/test_analyze_widescreen_a59e_trace.py"
      - "tests/unit/test_analyze_widescreen_xphase_discriminator.py"
      - "tests/unit/test_analyze_widescreen_secondary_lane.py"
      - "tests/input/preparation-emission-race.script"
      - "tests/input/object-liveness-dragster.script"

concurrency:
  group: widescreen-strip-scheduling-plus8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build and instrument reference harness
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --tool snes9x-libretro --jobs 2
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro"
          python3 tools/instrument_snesref_widescreen_strip_schedule.py "$CORE/cpuexec.cpp"
          make -C "$CORE/libretro" -j2
          test -x .tools/src/snesrecomp/build-snesref/snesref
          test -f "$CORE/libretro/snes9x_libretro.so"

      - name: Characterize stock A597 edge-preparation helper
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-edge-helper"
          mkdir -p "$ROOT/dumps" analysis/generated

          URRECOMP_WS_MARGIN=0 \
          URRECOMP_WS_BOUNDARY_TRACE=1 \
          URRECOMP_WS_EDGE_HELPER_TRACE=1 \
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$ROOT/dumps" \
            "$EXE" "$CORE" "$ROM" >"$ROOT/run.log" 2>&1

          python3 tools/analyze_widescreen_preparation_boundary.py \
            "$ROOT/run.log" \
            --json-out analysis/generated/widescreen-preparation-boundary.json \
            --md-out analysis/generated/widescreen-preparation-boundary.md

          python3 tools/analyze_widescreen_edge_helper.py \
            "$ROOT/run.log" \
            --json-out analysis/generated/widescreen-edge-helper.json \
            --md-out analysis/generated/widescreen-edge-helper.md

          cat analysis/generated/widescreen-preparation-boundary.md
          cat analysis/generated/widescreen-edge-helper.md

      - name: Test count-only two-strip demand
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-count32"
          mkdir -p "$ROOT/control/dumps" "$ROOT/count32/dumps" analysis/generated

          for SIDE in control count32; do
            if [ "$SIDE" = control ]; then
              MARGIN=0
              MODE=""
            else
              MARGIN=8
              MODE="count32"
            fi
            URRECOMP_WS_MARGIN="$MARGIN" \
            URRECOMP_WS_MODE="$MODE" \
            SNESREF_HEADLESS=1 \
            SNESREF_FAST=1 \
            SNESREF_WRAM_FILL=0 \
            SNESREF_SCRIPT="$SCRIPT" \
            SNESREF_DUMP_DIR="$ROOT/$SIDE/dumps" \
              "$EXE" "$CORE" "$ROM" >"$ROOT/$SIDE/run.log" 2>&1
          done

          python3 tools/analyze_widescreen_count32_discriminator.py \
            "$ROOT/control/run.log" "$ROOT/count32/run.log" \
            --json-out analysis/generated/widescreen-count32-discriminator.json \
            --md-out analysis/generated/widescreen-count32-discriminator.md
          cat analysis/generated/widescreen-count32-discriminator.md

      - name: Probe A59E X-phase deltas
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-xphase"
          mkdir -p "$ROOT/control/dumps" analysis/generated

          URRECOMP_WS_MARGIN=0 \
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$ROOT/control/dumps" \
            "$EXE" "$CORE" "$ROM" >"$ROOT/control/run.log" 2>&1

          VARIANTS=()
          for DELTA in 1 -1 8 -8; do
            case "$DELTA" in
              1) NAME=xplus1 ;;
              -1) NAME=xminus1 ;;
              8) NAME=xplus8 ;;
              -8) NAME=xminus8 ;;
            esac
            mkdir -p "$ROOT/$NAME/dumps"
            URRECOMP_WS_MARGIN=8 \
            URRECOMP_WS_X_DELTA="$DELTA" \
            SNESREF_HEADLESS=1 \
            SNESREF_FAST=1 \
            SNESREF_WRAM_FILL=0 \
            SNESREF_SCRIPT="$SCRIPT" \
            SNESREF_DUMP_DIR="$ROOT/$NAME/dumps" \
              "$EXE" "$CORE" "$ROM" >"$ROOT/$NAME/run.log" 2>&1
            VARIANTS+=("$ROOT/$NAME/run.log")
          done

          python3 tools/analyze_widescreen_xphase_discriminator.py \
            "$ROOT/control/run.log" "${VARIANTS[@]}" \
            --json-out analysis/generated/widescreen-xphase-discriminator.json \
            --md-out analysis/generated/widescreen-xphase-discriminator.md
          cat analysis/generated/widescreen-xphase-discriminator.md

      - name: Probe secondary horizontal lane
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-secondary"
          mkdir -p "$ROOT/control/dumps" "$ROOT/secondary/dumps" analysis/generated

          URRECOMP_WS_MARGIN=0 \
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$ROOT/control/dumps" \
            "$EXE" "$CORE" "$ROM" >"$ROOT/control/run.log" 2>&1

          URRECOMP_WS_MARGIN=8 \
          URRECOMP_WS_MODE=secondary \
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$ROOT/secondary/dumps" \
            "$EXE" "$CORE" "$ROM" >"$ROOT/secondary/run.log" 2>&1

          python3 tools/analyze_widescreen_secondary_lane.py \
            "$ROOT/control/run.log" "$ROOT/secondary/run.log" \
            --json-out analysis/generated/widescreen-secondary-lane.json \
            --md-out analysis/generated/widescreen-secondary-lane.md
          cat analysis/generated/widescreen-secondary-lane.md

      - name: Probe pre-helper secondary horizontal lane
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-secondary-pre"
          mkdir -p "$ROOT/control/dumps" "$ROOT/secondary-pre/dumps" analysis/generated

          URRECOMP_WS_MARGIN=0 \
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$ROOT/control/dumps" \
            "$EXE" "$CORE" "$ROM" >"$ROOT/control/run.log" 2>&1

          URRECOMP_WS_MARGIN=8 \
          URRECOMP_WS_MODE=secondary_pre \
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$ROOT/secondary-pre/dumps" \
            "$EXE" "$CORE" "$ROM" >"$ROOT/secondary-pre/run.log" 2>&1

          python3 tools/analyze_widescreen_secondary_lane.py \
            "$ROOT/control/run.log" "$ROOT/secondary-pre/run.log" \
            --json-out analysis/generated/widescreen-secondary-prehelper.json \
            --md-out analysis/generated/widescreen-secondary-prehelper.md
          cat analysis/generated/widescreen-secondary-prehelper.md

      - name: Trace A59E strip preparation internals
        shell: bash
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/.tools/src/snesrecomp/build-snesref/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/preparation-emission-race.script"
          ROOT="$RUNNER_TEMP/ws-a59e"
          mkdir -p "$ROOT/dumps" analysis/generated

          URRECOMP_WS_MARGIN=0 \
          URRECOMP_WS_A59E_TRACE=1 \
          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$ROOT/dumps" \
            "$EXE" "$CORE" "$ROM" >"$ROOT/run.log" 2>&1

          python3 tools/analyze_widescreen_a59e_trace.py \
            "$ROOT/run.log" \
            --json-out analysis/generated/widescreen-a59e-trace.json \
            --md-out analysis/generated/widescreen-a59e-trace.md
          cat analysis/generated/widescreen-a59e-trace.md

      - name: Upload bounded experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widescreen-strip-scheduling-plus8
          path: |
            analysis/generated/widescreen-edge-helper.json
            analysis/generated/widescreen-edge-helper.md
            analysis/generated/widescreen-preparation-boundary.json
            analysis/generated/widescreen-preparation-boundary.md
            analysis/generated/widescreen-count32-discriminator.json
            analysis/generated/widescreen-count32-discriminator.md
            analysis/generated/widescreen-a59e-trace.json
            analysis/generated/widescreen-a59e-trace.md
            analysis/generated/widescreen-xphase-discriminator.json
            analysis/generated/widescreen-xphase-discriminator.md
            analysis/generated/widescreen-secondary-lane.json
            analysis/generated/widescreen-secondary-lane.md
            analysis/generated/widescreen-secondary-prehelper.json
            analysis/generated/widescreen-secondary-prehelper.md
            ${{ runner.temp }}/ws-boundary/
            ${{ runner.temp }}/ws-edge-helper/
            ${{ runner.temp }}/ws-count32/
            ${{ runner.temp }}/ws-a59e/
            ${{ runner.temp }}/ws-xphase/
            ${{ runner.temp }}/ws-secondary/
            ${{ runner.temp }}/ws-secondary-pre/
          if-no-files-found: warn
          retention-days: 7

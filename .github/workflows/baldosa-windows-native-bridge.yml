  workflow_call:
    inputs:
      parallel_journeys:
        description: "Opt in to source-identical two-worker Windows acceptance pilot"
        required: false
        type: boolean
        default: false
      export_campaign_inputs:
        description: "Export the one source-bound Windows executable and ROMless ZIP for manual cohort reuse"
        required: false
        type: boolean

name: Windows Local Tournament package acceptance

# Manual QA rebuilds and verifies the independently pinned inner ZIP in the
# same private Windows job. Never download or republish a ROM-bearing archive.
on:
  workflow_dispatch:
    inputs:
      candidate_commit_sha:
        description: "Independently nominated exact main source commit (40 hex)"
        required: true
      portable_zip_sha256:
        description: "SHA-256 of canonical inner portable ZIP from verified main smoke"
        required: true

concurrency:
  group: windows-local-tournament-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-tournament:
    uses: ./.github/workflows/windows-native-smoke.yml
    with:
      run_tournament_acceptance: true
      candidate_commit_sha: ${{ inputs.candidate_commit_sha }}
      portable_zip_sha256: ${{ inputs.portable_zip_sha256 }}

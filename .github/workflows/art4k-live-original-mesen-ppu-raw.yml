name: ART-4K original Mesen SNES raw PPU snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/art/capture_original_mesen_ppu_raw.py'
      - 'tests/unit/test_capture_original_mesen_ppu_raw.py'
      - 'third_party/src/mesen-for-ai/bridge.lua'
      - '.github/workflows/art4k-live-original-mesen-ppu-raw.yml'

concurrency:
  group: art4k-live-mesen-ppu-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  MESENCE_REVISION: a60e79feb4d6dcced5922d636f9211837d01e381
  MESENCE_INPUT_PATCH_REV: v2

jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev xvfb unzip curl clang

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Restore pinned MesenCE binary cache
        id: mesence-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mesence-cache
          key: mesence-linux-x64-${{ env.MESENCE_REVISION }}-${{ env.MESENCE_INPUT_PATCH_REV }}

      - name: Fetch pinned MesenCE source
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/nesdev-org/MesenCE.git "$RUNNER_TEMP/MesenCE"
          git -C "$RUNNER_TEMP/MesenCE" checkout --detach "$MESENCE_REVISION"
          test "$(git -C "$RUNNER_TEMP/MesenCE" rev-parse HEAD)" = "$MESENCE_REVISION"
          git -C "$RUNNER_TEMP/MesenCE" apply --unidiff-zero             "$GITHUB_WORKSPACE/third_party/src/mesen-for-ai/patches/mesence-lua-input-subport.patch"

      - name: Stage MesenCE librashader dependency
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/MesenCE"
          curl -fL --retry 3             "https://nightly.link/SourMesen/librashader/workflows/build/Mesen/librashader-x64-ubuntu.zip"             -o "$RUNNER_TEMP/librashader.zip"
          rm -rf "$RUNNER_TEMP/librashader"
          mkdir -p "$RUNNER_TEMP/librashader"
          unzip -q "$RUNNER_TEMP/librashader.zip" -d "$RUNNER_TEMP/librashader"
          LIB="$(find "$RUNNER_TEMP/librashader" -type f -name librashader.so -print -quit)"
          test -n "$LIB"
          mkdir -p UI/Dependencies
          cp "$LIB" UI/Dependencies/librashader.so

      - name: Build pinned MesenCE
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -C "$RUNNER_TEMP/MesenCE" -j2 -O LTO=true STATICLINK=true SYSTEM_LIBEVDEV=false
          PUBLISH="$RUNNER_TEMP/MesenCE/bin/linux-x64/Release/linux-x64/publish"
          test -x "$PUBLISH/Mesen"
          rm -rf "$RUNNER_TEMP/mesence-cache"
          mkdir -p "$RUNNER_TEMP/mesence-cache"
          cp -a "$PUBLISH/." "$RUNNER_TEMP/mesence-cache/"


      - name: Capture consecutive original MesenCE PPU RAM frames
        shell: bash
        run: |
          set -euo pipefail
          MESEN_BIN="$RUNNER_TEMP/mesence-cache/Mesen"
          timeout 300s xvfb-run -a python3 -m tools.art.capture_original_mesen_ppu_raw \
            --rom reference/roms/retail/Uniracers_USA.sfc \
            --input-file tests/input/two-player-first-race.input \
            --mesen-for-ai-repo third_party/src/mesen-for-ai \
            --mesen-executable "$MESEN_BIN" \
            --advance-frames 1218 --capture-frames 2 --include-held-framebuffer \
            --out-dir "$RUNNER_TEMP/art4k-actual-ppu-raw"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.art.capture_original_mesen_ppu_raw import validate_snapshot_files
          root=Path(os.environ["RUNNER_TEMP"])/"art4k-actual-ppu-raw"
          report=json.loads((root/"manifest.json").read_text())
          validate_snapshot_files(root,report)
          assert len(report["frames"])==2
          assert [f["emulator_bridge_frame"] for f in report["frames"]]==[1219,1220]
          assert not report["live_original_per_player_64x64_alpha_composition_verified"]
          assert not report["source_original_3d_camera_or_articulated_rig_verified"]
          assert report["original_held_framebuffer_P6_exported"] is True
          assert report["original_PPU_RGB_to_source_OBJ_pixel_ownership_verified"] is False
          for row in report["frames"]:
              display=row["original_emulator_held_display_P6"]
              assert display["source_format"]=="P6"
              assert display["source_rgb_byte_length"]==3*display["source_display_width"]*display["source_display_height"]
              assert display["source_display_width"]>=256
              assert display["source_display_height"]>=200
          assert len({x["original_emulator_held_display_P6"]["sha256"] for x in report["frames"]})>=1
          print("ACTUAL_MESENCE_SNES_RAW_PPU_PLUS_P6",1219,1220,"held_source_screen_with_no_OBJ_or_3D_claim")
          PY

      - name: Upload SHA-bound original emulator PPU raw RAM states
        uses: actions/upload-artifact@v4
        with:
          name: art4k-original-mesen-ppu-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/art4k-actual-ppu-raw/
          retention-days: 7
          if-no-files-found: error

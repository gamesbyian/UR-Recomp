name: Flagship recruitment video actual media acceptance

on:
  pull_request:
    paths:
      - "tools/showcase/build_flagship_recruitment_20261019.py"
      - "tools/showcase/blue_trailer_art_direction.py"
      - "tools/showcase/graph_paper_trailer_art_direction.py"
      - "assets/promo/canonical/**"
      - ".github/workflows/promo-flagship-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promo-flagship-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-flagship:
    name: Full source-pinned 80s landscape and 27s portrait MP4 exports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install media tooling and Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m venv "$RUNNER_TEMP/promo-venv"
          "$RUNNER_TEMP/promo-venv/bin/python" -m pip install "Pillow>=11,<13"
      - name: Rebuild complete source-pinned flagship films
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flagship"
          "$RUNNER_TEMP/promo-venv/bin/python" tools/showcase/build_flagship_recruitment_20261019.py --outdir "$RUNNER_TEMP/flagship"
      - name: Independently verify video outputs and backgrounds
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/promo-venv/bin/python" - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'flagship'
          receipt=json.loads((directory/'flagship-provenance.json').read_text())
          assert receipt['approved_visual_assets']=={
              'portrait':'blueprint-9x16-portrait-2160x3840.png',
              'landscape':'blueprint-16x9-logo-right.png'}
          for name,size,frames in (
              ('ur-recomp-blue-action-80s-1080p.mp4',(1920,1080),4800),
              ('ur-recomp-blue-action-27s-vertical.mp4',(1080,1920),1620)):
              f=directory/name
              assert f.is_file() and f.stat().st_size>100_000
              sha=hashlib.sha256(f.read_bytes()).hexdigest()
              assert receipt['output_sha256'][name]==sha
              probe=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-count_frames','-select_streams','v:0',
                  '-show_entries','stream=width,height,r_frame_rate,nb_read_frames',
                  '-of','json',str(f)]))['streams'][0]
              assert (probe['width'],probe['height'])==size
              assert probe['r_frame_rate']=='60/1'
              assert int(probe['nb_read_frames'])==frames
          print('Full approved-background flagship film integrity passed')
          PY
      - name: Preserve complete media and source-matched receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-promo-owner-approved-full-flagship
          path: ${{ runner.temp }}/flagship/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

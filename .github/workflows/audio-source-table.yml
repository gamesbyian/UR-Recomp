name: One-shot audio source-table trace

on:
  push:
    branches:
      - chatgpt/audio-source-table-2026-09-29
    paths:
      - .github/workflows/audio-source-table.yml
      - tools/trace_audio_source_table.py
      - tests/input/reach-first-race.script

permissions:
  contents: read

jobs:
  trace-audio-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Scan direct calls to APU transfer entry and wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio-source"
          python3 - <<'PY'
          import json
          from pathlib import Path

          rom_path = Path("reference/roms/retail/Uniracers_USA.sfc")
          data = rom_path.read_bytes()

          patterns = {
              "JSR_8298": bytes.fromhex("20 98 82"),
              "JSR_8294": bytes.fromhex("20 94 82"),
              "JSL_828298": bytes.fromhex("22 98 82 82"),
              "JSL_028298": bytes.fromhex("22 98 82 02"),
              "JSL_828294": bytes.fromhex("22 94 82 82"),
              "JSL_028294": bytes.fromhex("22 94 82 02"),
          }

          def cpu_addr(offset):
              bank = 0x80 | (offset // 0x8000)
              addr = 0x8000 + (offset % 0x8000)
              return (bank << 16) | addr

          out = {"schema_version": 1, "patterns": {}}
          for name, pat in patterns.items():
              rows = []
              start = 0
              while True:
                  pos = data.find(pat, start)
                  if pos < 0:
                      break
                  pc = cpu_addr(pos)
                  lo = max(0, pos - 24)
                  hi = min(len(data), pos + len(pat) + 40)
                  rows.append({
                      "rom_offset": pos,
                      "rom_offset_hex": f"0x{pos:06X}",
                      "cpu_pc24": f"0x{pc:06X}",
                      "same_bank_82_for_jsr": ((pc >> 16) & 0xFF) == 0x82,
                      "context_start_hex": f"0x{lo:06X}",
                      "context_hex": data[lo:hi].hex(" "),
                  })
                  start = pos + 1
              out["patterns"][name] = rows

          target = Path(__import__("os").environ["RUNNER_TEMP"]) / "audio-source" / "apu-transfer-callsites.json"
          target.write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps({k: len(v) for k, v in out["patterns"].items()}, indent=2))
          PY

      - name: Generate project and build trace target
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/trace-project"
          mkdir -p "$ROOT"
          sh snesrecomp/tools/new_project/setup_project.sh \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --generate \
            --snesrecomp-ref cd5875cbdaf19f5e324272b1f8051d671fce9215

          PROJECT="$ROOT/UniracersSNESRecomp"

          python3 - "$PROJECT/src/host_contract.c" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "#include <stdint.h>\n"
          if marker not in s:
              raise SystemExit("host_contract.c include marker not found")
          s = s.replace(
              marker,
              marker + "\n#if !defined(SNESRECOMP_TRACE) || !SNESRECOMP_TRACE\n",
              1,
          )
          s += "\n#endif /* production debug-hook stubs */\n"
          p.write_text(s)
          PY

          cmake -S "$PROJECT" -B "$PROJECT/build-trace" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ENABLE_TRACE=ON
          cmake --build "$PROJECT/build-trace" -j2
          test -x "$PROJECT/build-trace/UniracersSNESRecomp"

          mapfile -t FUNCS < <(
            grep -RhoE 'bank_82_8298_M[01]X[01]' "$PROJECT/src" |
              sort -u
          )
          printf 'generated variants at 82:8298:\n'
          printf '  %s\n' "${FUNCS[@]:-}"
          if [ "${#FUNCS[@]}" -ne 1 ]; then
            echo "expected exactly one generated variant at 82:8298" >&2
            exit 1
          fi
          echo "APU_FUNC=${FUNCS[0]}" >> "$GITHUB_ENV"
          grep -R -n -B8 -A180 "${FUNCS[0]}" "$PROJECT/src" \
            > "$RUNNER_TEMP/audio-source/generated-apu-transfer.txt" || true

      - name: Trace source table and transport
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/trace-project/UniracersSNESRecomp"
          EXE="$PROJECT/build-trace/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script"
          LOG="$RUNNER_TEMP/audio-source/native-audio-source-host.log"
          OUT="$RUNNER_TEMP/audio-source/audio-source-table-trace.json"

          SNESRECOMP_DEBUG_PORT=4377 SDL_AUDIODRIVER=dummy \
            timeout 240s xvfb-run -a "$EXE" "$ROM" --paused --script "$SCRIPT" \
            >"$LOG" 2>&1 &
          HOST_PID=$!
          trap 'kill "$HOST_PID" 2>/dev/null || true' EXIT

          set +e
          python3 tools/trace_audio_source_table.py \
            --snapshot-function "$APU_FUNC" \
            --port 4377 \
            --command-timeout 60 \
            --coarse-until 900 \
            --coarse-step 25 \
            --max-frames 1800 \
            --json-out "$OUT"
          TRACE_STATUS=$?
          set -e

          kill "$HOST_PID" 2>/dev/null || true
          wait "$HOST_PID" 2>/dev/null || true
          trap - EXIT

          echo "== host log tail =="
          tail -n 140 "$LOG"
          if [ "$TRACE_STATUS" -ne 0 ]; then
            exit "$TRACE_STATUS"
          fi
          test -s "$OUT"

          python3 - "$OUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          d = json.loads(p.read_text())
          if not d["snapshot_function_matches_observed"]:
              raise SystemExit(
                  f"snapshot variant mismatch: requested={d['requested_snapshot_function']} "
                  f"observed={d['observed_variant']}"
              )
          if d["snapshot_count"] < 1:
              raise SystemExit("target function executed but no function snapshot was captured")
          pointers = [
              s["source_pointer"] for s in d["snapshots"]
              if s.get("source_pointer")
          ]
          print(json.dumps({
              "race_active_frame": d["race_active_frame"],
              "target_hits": d["cpu_trace"]["target_hits"],
              "snapshot_count": d["snapshot_count"],
              "source_pointers": pointers,
              "audio_events": d["audio_event_range"]["events_returned"],
          }, indent=2))
          PY

      - name: Upload source-table evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-audio-source-table
          path: |
            ${{ runner.temp }}/audio-source/audio-source-table-trace.json
            ${{ runner.temp }}/audio-source/apu-transfer-callsites.json
            ${{ runner.temp }}/audio-source/generated-apu-transfer.txt
            ${{ runner.temp }}/audio-source/native-audio-source-host.log
          if-no-files-found: warn
          retention-days: 2

name: SNESRecomp C2 baseline network audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snesrecomp-c2-network-audit.yml"
      - "tools/audit_network_trace.py"
      - "tests/unit/test_audit_network_trace.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain.json"
      - "third_party/manifest.json"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"
  pull_request:
    paths:
      - ".github/workflows/snesrecomp-c2-network-audit.yml"
      - "tools/audit_network_trace.py"
      - "tests/unit/test_audit_network_trace.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain.json"
      - "third_party/manifest.json"
      - "third_party/archives/snesrecomp-cd5875cbdaf19f5e.tar.gz"

concurrency:
  group: snesrecomp-c2-network-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sdl3-fetch-off
            backend: SDL3
            require_full_build: "0"
          - label: sdl2-system
            backend: SDL2
            require_full_build: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config strace \
            libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Stage repository-owned framework archive
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          test -f .tools/src/snesrecomp/runner/runner.cmake
          test -f .tools/src/snesrecomp/snesrecomp_cli.py
          test ! -e .tools/src/snesrecomp/lib/recomp-net/CMakeLists.txt
          test ! -e .tools/src/snesrecomp/lib/retcomm-rbengine/CMakeLists.txt

      - name: Prepare pinned host Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version
          cargo +1.97.1 --version

      - name: Prove native analyzer builds from repository Cargo closure
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          EMPTY_CARGO="$RUNNER_TEMP/cargo-empty"
          rm -rf "$EMPTY_CARGO" "$FRAMEWORK/recompiler-rs/target"
          mkdir -p "$EMPTY_CARGO"
          RUSTUP_AUTO_INSTALL=0 CARGO_HOME="$EMPTY_CARGO" CARGO_NET_OFFLINE=true \
            python3 "$FRAMEWORK/tools/build_native_analyzer.py" \
            >"$RUNNER_TEMP/analyzer-offline.log" 2>&1
          cat "$RUNNER_TEMP/analyzer-offline.log"
          test -x "$FRAMEWORK/recompiler-rs/target/release/snesrecomp-analyze"
          rm -rf "$FRAMEWORK/recompiler-rs/target"

      - name: Scaffold and generate without submodules
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/c2-${BACKEND,,}"
          mkdir -p "$TMP"
          GEN_CARGO="$RUNNER_TEMP/cargo-generation-${BACKEND,,}"
          rm -rf "$GEN_CARGO"
          mkdir -p "$GEN_CARGO"
          RUSTUP_AUTO_INSTALL=0 CARGO_HOME="$GEN_CARGO" CARGO_NET_OFFLINE=true \
            SNESRECOMP_ROOT="$FRAMEWORK" \
            strace -ff -e trace=network -o "$RUNNER_TEMP/trace-scaffold-${BACKEND,,}" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --generate \
              --no-build \
              >"$RUNNER_TEMP/scaffold-${BACKEND,,}.log" 2>&1
          cat "$RUNNER_TEMP/scaffold-${BACKEND,,}.log"
          GEN="$TMP/UniracersSNESRecomp/src/gen"
          COUNT="$(find "$GEN" -maxdepth 1 -type f -name '*.c' -size +0c | wc -l)"
          echo "generated_c_files=$COUNT"
          test "$COUNT" -ge 1
          echo "PROJECT_ROOT=$TMP/UniracersSNESRecomp" >> "$GITHUB_ENV"

      - name: Configure and build with source fetching disabled
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          REQUIRE_FULL_BUILD: ${{ matrix.require_full_build }}
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          LABEL="${BACKEND,,}"
          CONFIG_LOG="$RUNNER_TEMP/configure-$LABEL.log"
          BUILD_LOG="$RUNNER_TEMP/build-$LABEL.log"

          set +e
          strace -ff -e trace=network -o "$RUNNER_TEMP/trace-configure-$LABEL" \
            cmake -S "$PROJECT_ROOT" -B "$PROJECT_ROOT/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DSNESRECOMP_ROOT="$FRAMEWORK" \
              -DSNESRECOMP_SDL_BACKEND="$BACKEND" \
              -DSNESRECOMP_SDL3_FETCH=OFF \
              >"$CONFIG_LOG" 2>&1
          CONFIG_STATUS=$?
          set -e
          cat "$CONFIG_LOG"
          echo "configure_status=$CONFIG_STATUS"

          BUILD_STATUS=not-run
          if [ "$CONFIG_STATUS" -eq 0 ]; then
            set +e
            strace -ff -e trace=network -o "$RUNNER_TEMP/trace-build-$LABEL" \
              cmake --build "$PROJECT_ROOT/build" -j2 \
              >"$BUILD_LOG" 2>&1
            RC=$?
            set -e
            BUILD_STATUS=$RC
            cat "$BUILD_LOG"
            echo "build_status=$BUILD_STATUS"
            if [ "$RC" -ne 0 ]; then
              echo "::error::$BACKEND configured but the offline build failed"
              exit "$RC"
            fi
            test -x "$PROJECT_ROOT/build/UniracersSNESRecomp"
          fi

          if [ "$REQUIRE_FULL_BUILD" = "1" ] && [ "$CONFIG_STATUS" -ne 0 ]; then
            echo "::error::$BACKEND is required to complete the baseline build"
            exit "$CONFIG_STATUS"
          fi

          if [ "$BACKEND" = "SDL3" ] && [ "$CONFIG_STATUS" -ne 0 ]; then
            if ! grep -Eqi 'SDL3.*(not found|was not found)|no SDL3 package found' "$CONFIG_LOG"; then
              echo "::error::SDL3 fetch-off failed for an unclassified reason"
              exit "$CONFIG_STATUS"
            fi
            echo "SDL3_FETCH_OFF_RESULT=missing_host_sdl3_classified"
          elif [ "$BACKEND" = "SDL3" ]; then
            echo "SDL3_FETCH_OFF_RESULT=host_sdl3_available_full_build_green"
          else
            echo "SDL2_SYSTEM_RESULT=full_build_green"
          fi

      - name: Classify observed network boundary
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          LABEL="${BACKEND,,}"
          python3 tools/audit_network_trace.py \
            "$RUNNER_TEMP/trace-scaffold-$LABEL*" \
            --json-out "$RUNNER_TEMP/network-scaffold-$LABEL.json" \
            --require-none
          python3 tools/audit_network_trace.py \
            "$RUNNER_TEMP/trace-configure-$LABEL*" \
            "$RUNNER_TEMP/trace-build-$LABEL*" \
            --json-out "$RUNNER_TEMP/network-build-$LABEL.json" \
            --require-none
          echo "generation_and_build_network_attempts=0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snesrecomp-c2-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/scaffold-*.log
            ${{ runner.temp }}/configure-*.log
            ${{ runner.temp }}/build-*.log
            ${{ runner.temp }}/network-*.json
            ${{ runner.temp }}/analyzer-offline.log
            ${{ runner.temp }}/trace-scaffold-*
            ${{ runner.temp }}/trace-configure-*
            ${{ runner.temp }}/trace-build-*
          if-no-files-found: warn
          retention-days: 7

name: Windows audio output capture (opt-in)

# Reuse a completed Windows native smoke package. Never rebuild it in this
# specialist lane. Follow successful main-branch Windows package builds,
# rather than running for every PR or performing another native build.
on:
  workflow_run:
    workflows: ["Windows native build and boot smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Windows native build and boot smoke run ID with portable package artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  output-capture:
    # workflow_run executes with the default-branch workflow, so accept only
    # a successful Windows main build. Never execute an untrusted PR artifact.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch packaged Windows build without recompiling
        uses: actions/download-artifact@v4
        with:
          name: ur-recomp-windows-x64-portable
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audio-source

      - name: Capture named SDL3 audio checkpoints and APU counters
        run: |
          set -euo pipefail
          SOURCE="${{ inputs.source_run_id || github.event.workflow_run.id }}"
          [[ "$SOURCE" =~ ^[0-9]{1,20}$ ]]
          ARCHIVE="$RUNNER_TEMP/audio-source/UR-Recomp-Windows-x64.zip"
          EXTRACT="$RUNNER_TEMP/audio-product"
          test -s "$ARCHIVE"
          python tools/assemble_windows_package.py verify-archive --archive "$ARCHIVE"
          python -m zipfile -e "$ARCHIVE" "$EXTRACT"
          PACKAGE="$EXTRACT/UR-Recomp-Windows-x64"
          python tools/assemble_windows_package.py verify --package "$PACKAGE"
          PACKAGE_WIN="$(cygpath -w "$PACKAGE")"

          # Independent fresh processes derived from the canonical race route.
          # No fabricated guest input, sample-clock alignment or renderer edits.
          for CASE in main-menu-ready now-playing-ready race-entered; do
            SCRIPT="$RUNNER_TEMP/audio-$CASE.script"
            DUMPS="$RUNNER_TEMP/audio-dumps-$CASE"
            ROOT="$RUNNER_TEMP/audio-user-data-$CASE"
            PCM="$RUNNER_TEMP/audio-device-output-$CASE.raw"
            STATS="$RUNNER_TEMP/audio-ring-stats-$CASE.txt"
            LOG="$RUNNER_TEMP/audio-native-$CASE.log"
            python tools/build_audio_checkpoint_route.py \
              "$GITHUB_WORKSPACE/tests/input/reach-first-race.script" \
              "$CASE" "$SCRIPT"
            mkdir -p "$DUMPS"
            rm -rf "$ROOT" "$PCM" "$STATS"
            SCRIPT_WIN="$(cygpath -w "$SCRIPT")"
            DUMPS_WIN="$(cygpath -w "$DUMPS")"
            ROOT_WIN="$(cygpath -w "$ROOT")"
            PCM_WIN="$(cygpath -w "$PCM")"
            STATS_WIN="$(cygpath -w "$STATS")"
            set +e
            SDL_VIDEO_DRIVER=offscreen \
            SDL_VIDEODRIVER=offscreen \
            SDL_AUDIO_DRIVER=disk \
            SDL_AUDIO_DISK_OUTPUT_FILE="$PCM_WIN" \
            SDL_AUDIO_FORMAT=S16LE \
            SDL_AUDIO_CHANNELS=2 \
            SDL_AUDIO_FREQUENCY=44100 \
            SDL_AUDIO_DISK_TIMESCALE=1.0 \
            SNESRECOMP_AUDIO_STATS="$STATS_WIN" \
            SNESRECOMP_DUMP_DIR="$DUMPS_WIN" \
            UR_RECOMP_USER_DATA_ROOT="$ROOT_WIN" \
              timeout 180 powershell.exe -NoProfile -Command \
                "& '$PACKAGE_WIN\\run-uniracers.cmd' --script '$SCRIPT_WIN'; exit \$LASTEXITCODE" \
                >"$LOG" 2>&1
            RC=$?
            set -e
            tail -n 25 "$LOG"
            test "$RC" -eq 0
            test -s "$DUMPS/$CASE.wram.bin"
            test -s "$DUMPS/$CASE-audio-post.wram.bin"
            # Execute as a module so tools.* imports resolve on native Windows
            # Python, instead of treating tools/ as the Python root.
            python -m tools.check_native_audio_checkpoint_timing "$LOG" "$CASE"
            test -s "$PCM"
            test -s "$STATS"
            # 60 guest frames centered on the named dump (30 before/after).
            # A 1s *device* tail approximates that window, subject to SDL
            # scheduling and queue latency, which are not yet phase-calibrated.
            python tools/analyze_sdl_disk_audio.py "$LOG" "$PCM_WIN" \
              --tail-seconds 1.0 --min-tail-rms 50 \
              --json-out "$RUNNER_TEMP/audio-output-$CASE.json"
            # Exactly the first reporting interval is exempt from starvation
            # gates; both measured Windows runs have been clean afterward.
            python tools/analyze_snesrecomp_audio_stats.py "$STATS" \
              --max-new-audible-drops 0 \
              --max-post-startup-underflows 0 \
              --max-post-startup-missing-frames 0 \
              --json-out "$RUNNER_TEMP/audio-ring-$CASE.json"
            rm -f "$PCM"
            echo "WINDOWS_NATIVE_AUDIO_CHECKPOINT PASS case=$CASE source_run=$SOURCE"
          done

          # Compare native *relative* levels with independent references,
          # not hashes or absolute PCM amplitude across emulator backends.
          python tools/analyze_audio_phase_matrix.py \
            --native-directory "$RUNNER_TEMP" \
            --reference analysis/generated/audio-startup-reference-summary.json \
            --json-out "$RUNNER_TEMP/audio-phase-matrix.json"
          echo "WINDOWS_NATIVE_AUDIO_OUTPUT PASS source_run=$SOURCE"

      - name: Upload bounded audio evidence (never PCM)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-audio-evidence
          path: |
            ${{ runner.temp }}/audio-native-*.log
            ${{ runner.temp }}/audio-output-*.json
            ${{ runner.temp }}/audio-ring-*.json
            ${{ runner.temp }}/audio-phase-matrix.json
          if-no-files-found: warn
          retention-days: 7

name: One-shot VS route state stepping

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/patches/snesrecomp-dual-controller-input.patch"
      - "tools/patches/snes9x-snesref-debug-exports.patch"
      - "tools/toolchain.json"
      - ".github/workflows/vs-p2-oam-recon.yml"

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Patch and build reference stack
        run: |
          git -C snesrecomp apply "$GITHUB_WORKSPACE/tools/patches/snesrecomp-dual-controller-input.patch"
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2
      - name: Step through VS states after verified P2 confirmation
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/snesref-build/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          INPUT="$RUNNER_TEMP/vs-route.input"
          cat >"$INPUT" <<'EOF'
          500:1:020:000
          502:1:020:000
          534:2:100:000
          597:2:100:000
          665:2:000:080
          685:2:000:100
          780:2:100:000
          880:2:100:000
          980:2:100:000
          1080:2:100:000
          1180:2:100:000
          1280:2:100:000
          1380:2:100:000
          EOF
          OBS="$RUNNER_TEMP/observe.script"
          cat >"$OBS" <<'EOF'
          wait 740
          dump t740
          wait 100
          dump t840
          wait 100
          dump t940
          wait 100
          dump t1040
          wait 100
          dump t1140
          wait 100
          dump t1240
          wait 100
          dump t1340
          wait 100
          dump t1440
          wait 180
          dump t1620
          quit
          EOF
          DUMPS="$RUNNER_TEMP/dumps"
          mkdir -p "$DUMPS"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_INPUT_FILE="$INPUT" SNESREF_SCRIPT="$OBS" SNESREF_DUMP_DIR="$DUMPS" \
            "$EXE" "$CORE" "$ROM" 2>&1 | tee "$RUNNER_TEMP/route.log"
          for tag in t740 t840 t940 t1040 t1140 t1240 t1340 t1440 t1620; do
            python3 -c 'import pathlib,sys; w=pathlib.Path(sys.argv[1]).read_bytes(); s=pathlib.Path(sys.argv[2]).read_bytes(); print(f"{sys.argv[3]} menu=0x{w[0x009F]:02X} sel=0x{w[0x009B]:02X} row=0x{w[0x000E]:02X} col=0x{w[0x0C63]:02X} race=0x{w[0x0313]:02X} owner=0x{s[0x0743]:02X}")' "$DUMPS/$tag.wram.bin" "$DUMPS/$tag.sram.bin" "$tag"
          done
          echo "== active-display OAM writes =="
          awk '($4=="2102" || $4=="2103" || $4=="2104") && $2 < 225 {print}' "$DUMPS"/*.ppuw.tsv | head -n 300 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs-route-state-stepping
          path: |
            ${{ runner.temp }}/route.log
            ${{ runner.temp }}/dumps/
          retention-days: 7

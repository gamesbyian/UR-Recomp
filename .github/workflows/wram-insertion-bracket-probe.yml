name: WRAM insertion bracket probe

on:
  push:
    branches:
      - chatgpt/pal-subregion-survivor-refinement-2026-09-30

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe bracket operands
        run: python3 tools/probe_wram_insertion_brackets.py
      - name: Commit bracket evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/wram-insertion-bracket-probe.json \
                  analysis/generated/wram-insertion-bracket-probe.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Record WRAM insertion bracket probe [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wram-insertion-bracket-probe
          path: |
            analysis/generated/wram-insertion-bracket-probe.json
            analysis/generated/wram-insertion-bracket-probe.md
          if-no-files-found: error

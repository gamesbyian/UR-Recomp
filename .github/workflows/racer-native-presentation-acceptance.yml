              )

          import json
          schema = json.loads(
              pathlib.Path("analysis/data/state-schema.json").read_text()
          )
          semantic_diffs = []
          for entry in schema["entries"]:
              addr = entry.get("address", "")
              width = entry.get("width", "")
              if not addr.startswith("7E:"):
                  continue
              try:
                  off = int(addr[3:], 16)
              except ValueError:
                  continue
              n = 1 if width.startswith("8-bit") else 2 if width.startswith(("16-bit", "signed 16-bit")) else 0
              if not n or off + n > len(blobs[0]):
                  continue
              va = blobs[0][off:off+n]
              vb = blobs[1][off:off+n]
              vh = blobs[2][off:off+n]
              if not (va == vb == vh):
                  semantic_diffs.append(
                      (entry["id"], va.hex(), vb.hex(), vh.hex())
                  )
          if semantic_diffs:

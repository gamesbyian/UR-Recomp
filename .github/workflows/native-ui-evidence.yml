        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/ui-rename-editor-explore.script"
          LOG="$RUNNER_TEMP/ui-rename-editor-explore.log"
          DUMPS="$RUNNER_TEMP/ui-rename-editor-dumps"
          mkdir -p "$DUMPS"

          echo "== scripted UI Rename Player editor exploration =="
          SNESRECOMP_DUMP_DIR="$DUMPS" SDL_AUDIODRIVER=dummy \

          grep -q "UR_PRESENTATION_FPS APPLIED mode=120 target=120 decoupled=1" "$LOG"
          test -s "$PRESENTS"
          python3 - "$PRESENTS" <<'PY'
          import csv
          import pathlib
          import sys

          rows = list(csv.DictReader(pathlib.Path(sys.argv[1]).open()))
          frames = {int(row["frame"]) for row in rows}
          presentations = len(rows)
          simulations_seen = len(frames)
          print(
              "UR_PRESENTATION_FPS_CADENCE",
              f"presentations={presentations}",
              f"simulated_frames_seen={simulations_seen}",
          )
          if simulations_seen < 100:
              raise SystemExit("presentation log did not cover the bounded simulation run")
          if presentations <= simulations_seen * 1.5:
              raise SystemExit(
                  "120 Hz presentation did not re-present captured guest frames")
          PY


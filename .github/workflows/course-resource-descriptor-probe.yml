name: Course resource descriptor island probe

on:
  push:
    branches:
      - chatgpt/course-resource-descriptor-island-2026-10-01

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate island evidence
        run: python3 tools/analyze_course_resource_descriptor_structure_island.py
      - name: Refresh comparative census
        run: python3 tools/build_comparative_structural_census.py
      - name: Run unit probe
        run: python3 -m unittest tests.unit.test_analyze_course_resource_descriptor_structure_island -v
      - name: Commit generated evidence
        run: |
          if git diff --quiet -- analysis/generated/course-resource-descriptor-structure-island.json analysis/generated/course-resource-descriptor-structure-island.md analysis/generated/comparative-structural-census.json analysis/generated/comparative-structural-census.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/course-resource-descriptor-structure-island.json analysis/generated/course-resource-descriptor-structure-island.md analysis/generated/comparative-structural-census.json analysis/generated/comparative-structural-census.md
          git commit -m "analysis: record course resource descriptor evidence"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: course-resource-descriptor-island
          path: |
            analysis/generated/course-resource-descriptor-structure-island.json
            analysis/generated/course-resource-descriptor-structure-island.md
            analysis/generated/comparative-structural-census.json
            analysis/generated/comparative-structural-census.md
          if-no-files-found: error

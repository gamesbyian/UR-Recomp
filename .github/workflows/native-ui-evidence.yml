name: Native UI evidence

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      canonical_candidate:
        description: Reuse the caller run's canonical Modern native candidate
        required: false
        type: boolean
        default: false

concurrency:
  group: native-ui-evidence-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: build-ui-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download canonical Modern native candidate
        if: ${{ inputs.canonical_candidate == true }}
        uses: actions/download-artifact@v4
        with:
          name: modern-native-canonical-candidate
          path: ${{ runner.temp }}/modern-native-canonical-artifact

      - name: Bridge canonical candidate into Native UI artifact contract
        if: ${{ inputs.canonical_candidate == true }}
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/modern-native-canonical-artifact/modern-native-canonical.tar.gz" -C "$RUNNER_TEMP"
          ROOT="$RUNNER_TEMP/modern-native-canonical/UniracersSNESRecomp"
          test -x "$ROOT/build/UniracersSNESRecomp"
          grep -q "ur_uniracers_product_after_run_frame" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_key_down" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_gamepad_button" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_overlay" "$ROOT/src/main.c"
          grep -q "uniracers_modern_host.cpp" "$ROOT/CMakeLists.txt"
          rm -rf "$RUNNER_TEMP/ur-recomp-build"
          mv "$RUNNER_TEMP/modern-native-canonical" "$RUNNER_TEMP/ur-recomp-build"
          tar -czf "$RUNNER_TEMP/native-ui-build.tar.gz" -C "$RUNNER_TEMP" ur-recomp-build

      - name: Upload bridged native UI candidate
        if: ${{ inputs.canonical_candidate == true }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-build-candidate
          path: ${{ runner.temp }}/native-ui-build.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Install desktop build dependencies
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          cmake --version
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config \
            libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        if: ${{ inputs.canonical_candidate != true }}
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Stage repository-owned SNESRecomp framework
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh
          test -f .tools/src/snesrecomp/runner/runner.cmake
          test ! -e .tools/src/snesrecomp/lib/recomp-net/CMakeLists.txt
          test ! -e .tools/src/snesrecomp/lib/retcomm-rbengine/CMakeLists.txt

      - name: Scaffold, generate and build
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-recomp-build"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --no-generate \
              --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 "$GITHUB_WORKSPACE/tools/prepare_native_widescreen_product.py" \
            --framework "$FRAMEWORK" \
            --project "$ROOT" \
            --rom "$ROM" \
            --json-out "$RUNNER_TEMP/widescreen-product-prepare.json"
          grep -q '"product_ready": true' "$RUNNER_TEMP/widescreen-product-prepare.json"

          python3 "$GITHUB_WORKSPACE/tools/patch_modern_product_host.py" \
            "$ROOT/src/main.c" \
            --game-rtl "$ROOT/src/game_rtl.c" \
            --cmake "$ROOT/CMakeLists.txt"
          grep -q "ur_uniracers_product_after_run_frame" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_key_down" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_gamepad_button" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_overlay" "$ROOT/src/main.c"
          grep -q "uniracers_modern_host.cpp" "$ROOT/CMakeLists.txt"

          python3 "$GITHUB_WORKSPACE/tools/bootstrap_toolchain.py" --offline --tool sdl3 --clone-only
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"


      - name: Package native UI candidate
        if: ${{ inputs.canonical_candidate != true }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/native-ui-build.tar.gz" \
            -C "$RUNNER_TEMP" ur-recomp-build
          test -s "$RUNNER_TEMP/native-ui-build.tar.gz"

      - name: Upload native UI candidate
        if: ${{ inputs.canonical_candidate != true }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-build-candidate
          path: ${{ runner.temp }}/native-ui-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  capture:
    name: capture-${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        shard: [core, navigation, results-a, results-b, records, profiles]
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install native UI runtime dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xdotool

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Download native UI candidate
        uses: actions/download-artifact@v4
        with:
          name: native-ui-build-candidate
          path: ${{ runner.temp }}/native-ui-build-artifact

      - name: Restore native UI candidate
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/native-ui-build-artifact/native-ui-build.tar.gz" \
            -C "$RUNNER_TEMP"
          EXE="$RUNNER_TEMP/ur-recomp-build/UniracersSNESRecomp/build/UniracersSNESRecomp"
          test -x "$EXE"

      - name: Run UI evidence shard
        shell: bash
        run: |
          set -uo pipefail
          EXE="$RUNNER_TEMP/ur-recomp-build/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SHARD="${{ matrix.shard }}"
          OPTIONAL_FAILURES=0

          run_route() {
            name="$1"
            script="$2"
            dump_name="$3"
            limit="$4"
            required="${5:-optional}"
            log="$RUNNER_TEMP/$name.log"
            dumps="$RUNNER_TEMP/$dump_name"
            mkdir -p "$dumps"

            echo "== $name =="
            # GitHub invokes bash with -e before this script body. Optional
            # reconnaissance routes must be allowed to return nonzero so this
            # function can preserve their partial evidence and continue.
            set +e
            SNESRECOMP_DUMP_DIR="$dumps" SDL_AUDIODRIVER=dummy \
              timeout "${limit}s" xvfb-run -a "$EXE" "$ROM" --script "$GITHUB_WORKSPACE/tests/input/$script" \
              >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            echo "$name status=$status"

            if [ "$status" -ne 0 ]; then
              if [ "$required" = "required" ]; then
                echo "::error::$name exited with status $status"
                return "$status"
              fi
              echo "::warning::$name exited with status $status; preserving partial evidence"
              OPTIONAL_FAILURES=1
            fi
            return 0
          }

          case "$SHARD" in
            core)
              run_route race-smoke reach-first-race.script race-dumps 90 required || exit $?
              for state in now-playing-ready race-entered; do
                test -s "$RUNNER_TEMP/race-dumps/$state.wram.bin" || { echo "::error::Route did not prove $state"; exit 1; }
              done
              run_route ui-options-route ui-options-route.script ui-dumps 90 required || exit $?
              for required in \
                ui-main-menu-1p.fb.bmp ui-main-menu-2p.fb.bmp ui-main-menu-vs.fb.bmp \
                ui-main-menu-league.fb.bmp ui-main-menu-options.fb.bmp ui-options-entry.fb.bmp \
                ui-options-back-main.fb.bmp; do
                test -s "$RUNNER_TEMP/ui-dumps/$required" || { echo "::error::Missing UI framebuffer dump: $required"; exit 1; }
              done
              ;;
            navigation)
              # Historical ending shortcut is a retained manual-only experiment.
              run_route ui-splash-capture ui-splash-capture.script ui-ending-dumps 90 required || exit $?
              test -s "$RUNNER_TEMP/ui-ending-dumps/ui-splash-observed.wram.bin" || { echo "::error::Missing authentic splash capture"; exit 1; }
              run_route ui-attract-route ui-attract-route.script ui-attract-dumps 90
              run_route ui-pause-route ui-pause-route.script ui-pause-dumps 90
              run_route ui-race-result-route ui-race-result-route.script ui-race-result-dumps 180
              run_route ui-erase-confirm ui-erase-confirm.script ui-erase-confirm-dumps 90
              ;;
            results-a)
              run_route ui-options-submenus ui-options-submenus.script ui-options-submenu-dumps 180
              # Retain all Circuit driving captures; the unproven result state is manual research.
              # A matched fresh-root paced/unpaced proof showed exact identity of all
              # 121 Circuit dumps (WRAM/SRAM/PPU/OAM/framebuffers) with a 71s to 28s
              # execution improvement. Isolate save/config state so previous
              # routes cannot perturb the new required reference evidence.
              (
                export SNESRECOMP_USER_DATA_DIR="$RUNNER_TEMP/ui-circuit-unpaced-user-data"
                mkdir -p "$SNESRECOMP_USER_DATA_DIR" || exit $?
                printf '[General]\nDisableFrameDelay = 1\n' > "$SNESRECOMP_USER_DATA_DIR/config.ini" || exit $?
                grep -Fqx 'DisableFrameDelay = 1' "$SNESRECOMP_USER_DATA_DIR/config.ini" || exit $?
                run_route ui-circuit-drive-capture ui-circuit-drive-capture.script ui-circuit-result-dumps 120 required || exit $?
              ) || exit $?
              for tag in ui-circuit-track-selected ui-circuit-now-playing ui-circuit-entered ui-circuit-drive-start ui-circuit-drive-10 ui-circuit-drive-20 ui-circuit-drive-30 ui-circuit-drive-40 ui-circuit-drive-50 ui-circuit-drive-60 ui-circuit-terminal; do
                test -s "$RUNNER_TEMP/ui-circuit-result-dumps/$tag.wram.bin" || { echo "::error::Missing Circuit capture: $tag"; exit 1; }
              done
              ;;
            results-b)
              # Required bounded entry proof; the unresolved idle-to-Stunt-results
              # attempt stays in ui-stunt-result-route.script for manual research.
              run_route ui-stunt-entry-route ui-stunt-entry-route.script ui-stunt-result-dumps 90 required || exit $?
              for tag in ui-stunt-track-selected ui-stunt-now-playing ui-stunt-entered; do
                test -s "$RUNNER_TEMP/ui-stunt-result-dumps/$tag.wram.bin" || { echo "::error::Missing Stunt entry dump: $tag"; exit 1; }
              done
              run_route ui-pre-race-timing ui-pre-race-timing.script ui-pre-race-timing-dumps 180
              run_route ui-records-submenus ui-records-submenus.script ui-records-submenu-dumps 180
              run_route ui-league-table ui-league-table.script ui-league-dumps 90
              ;;
            records)
              run_route ui-records-explore ui-records-explore.script ui-records-explore-dumps 180
              run_route ui-main-branches ui-main-branches.script ui-branch-dumps 150
              ;;
            profiles)
              run_route ui-rename-editor-explore ui-rename-editor-explore.script ui-rename-editor-dumps 180
              run_route ui-name-league-route ui-name-league-route.script ui-name-league-dumps 120
              run_route ui-startup-timeline ui-startup-timeline.script ui-startup-timeline-dumps 120
              run_route ui-define-player-explore ui-define-player-explore.script ui-define-player-dumps 120
              ;;
            *)
              echo "::error::Unknown capture shard: $SHARD"
              exit 2
              ;;
          esac

          if [ "$OPTIONAL_FAILURES" -ne 0 ]; then
            echo "::warning::One or more optional probes failed in shard $SHARD; aggregate validation will decide whether evidence is sufficient."
          fi

      - name: Modern settings persistence acceptance
        # Independent host-state evidence runs from its own STATE/dump root.
        # Moving this step to Results-A only after byte-proven Circuit
        # acceleration balances the six native capture shards.
        if: matrix.shard == 'results-a'
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/ur-recomp-build/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          STATE="$RUNNER_TEMP/host-state-v6.txt"
          SAVE_LOG="$RUNNER_TEMP/host-state-save.log"
          LOAD_LOG="$RUNNER_TEMP/host-state-load.log"
          AUTH_LOG="$RUNNER_TEMP/host-state-authentic.log"
          DUMPS="$RUNNER_TEMP/host-state-dumps"
          PAUSED_OVERLAY="$RUNNER_TEMP/host-state-paused-overlay.ppm"
          rm -f "$STATE" "$PAUSED_OVERLAY"
          mkdir -p "$DUMPS"

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export UR_PAUSE_OPEN_ACCEPTANCE=1
            export SNESRECOMP_PAUSED_OVERLAY_DUMP="'"$PAUSED_OVERLAY"'"
            export UR_HOST_STATE_PATH="'"$STATE"'"
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$SAVE_LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/race-entered.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/race-entered.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]
            xdotool windowfocus "$WIN"

            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_ACCEPTANCE OPENED" "'"$SAVE_LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_ACCEPTANCE OPENED" "'"$SAVE_LOG"'"

            # Active race exposes Resume -> Restart -> Options.
            xdotool key --window "$WIN" Down Down Return
            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_OPTIONS OPENED" "'"$SAVE_LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_OPTIONS OPENED" "'"$SAVE_LOG"'"

            # Focus Pause: On -> Off.
            xdotool key --window "$WIN" Return
            # Display: Windowed -> Borderless -> Fullscreen.
            xdotool key --window "$WIN" Down Return Return
            # VSync: On -> Adaptive.
            xdotool key --window "$WIN" Down Return
            # Presentation FPS: Game -> 60 -> 90 -> 120.
            xdotool key --window "$WIN" Down Return Return Return
            # Output Resolution: Native -> first explicit monitor mode.
            xdotool key --window "$WIN" Down Return
            # Internal Render Scale: 4x -> 1x.
            xdotool key --window "$WIN" Down Return
            # Widescreen: Original -> 16:9.
            xdotool key --window "$WIN" Down Return

            for _ in $(seq 1 100); do
              grep -q "^widescreen=16x9$" "'"$STATE"'" 2>/dev/null && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            for _ in $(seq 1 100); do
              grep -q "^output_resolution=[0-9][0-9]*x[0-9][0-9]*$" "'"$STATE"'" 2>/dev/null && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done

            grep -q "^UR-HOST-STATE/6$" "'"$STATE"'"
            grep -q "^pause_on_focus_loss=0$" "'"$STATE"'"
            grep -q "^display_mode=fullscreen$" "'"$STATE"'"
            grep -q "^vsync=adaptive$" "'"$STATE"'"
            grep -q "^presentation_fps=120$" "'"$STATE"'"
            grep -q "^internal_render_scale=1x$" "'"$STATE"'"
            grep -q "^widescreen=16x9$" "'"$STATE"'"
            RESOLUTION=$(sed -n "s/^output_resolution=//p" "'"$STATE"'")
            test -n "$RESOLUTION"
            test "$RESOLUTION" != native
            grep -Eq "^output_resolution=[0-9]+x[0-9]+$" "'"$STATE"'"
            grep -q "UR_DISPLAY_MODE APPLIED mode=fullscreen host=2" "'"$SAVE_LOG"'"
            grep -q "UR_VSYNC APPLIED mode=adaptive host=2" "'"$SAVE_LOG"'"
            grep -q "UR_PRESENTATION_FPS APPLIED mode=120 target=120 decoupled=1" "'"$SAVE_LOG"'"
            grep -q "UR_OUTPUT_RESOLUTION SELECTED value=$RESOLUTION" "'"$SAVE_LOG"'"
            grep -q "UR_OUTPUT_RESOLUTION APPLIED requested=$RESOLUTION effective=$RESOLUTION status=applied" "'"$SAVE_LOG"'"
            grep -q "UR_RENDER_SCALE APPLIED scale=1x" "'"$SAVE_LOG"'"
            grep -q "UR_WIDESCREEN SELECTED mode=16x9" "'"$SAVE_LOG"'"
            grep -q "UR_HOST_STATE SAVED" "'"$SAVE_LOG"'"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          '
          # The pause/Options journey above runs entirely while the guest is
          # frozen; require that the paused host really presented the panel.
          python3 tools/check_paused_overlay_dump.py "$PAUSED_OVERLAY"

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$STATE" \
          SNESRECOMP_RUN_FRAMES=120 \
          timeout 12s xvfb-run -a "$EXE" "$ROM" >"$LOAD_LOG" 2>&1

          RESOLUTION=$(sed -n "s/^output_resolution=//p" "$STATE")
          python3 tools/ci_log_assert.py "$LOAD_LOG" \
            --event "UR_HOST_STATE LOADED" \
            --field "pause_on_focus_loss=0" \
            --field "display_mode=fullscreen" \
            --field "vsync=adaptive" \
            --field "presentation_fps=120" \
            --field "output_resolution=${RESOLUTION}" \
            --field "widescreen=16x9" \
            --field "internal_render_scale=1x"
          grep -q "UR_DISPLAY_MODE APPLIED mode=fullscreen host=2" "$LOAD_LOG"
          grep -q "UR_OUTPUT_RESOLUTION APPLIED requested=$RESOLUTION effective=$RESOLUTION status=applied" "$LOAD_LOG"
          grep -q "UR_VSYNC APPLIED mode=adaptive host=2" "$LOAD_LOG"
          grep -q "UR_PRESENTATION_FPS APPLIED mode=120 target=120 decoupled=1" "$LOAD_LOG"
          grep -q "UR_RENDER_SCALE APPLIED scale=1x" "$LOAD_LOG"

          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_EXECUTION_MODE=authentic \
          UR_HOST_STATE_PATH="$STATE" \
          SNESRECOMP_RUN_FRAMES=120 \
          timeout 12s xvfb-run -a "$EXE" "$ROM" >"$AUTH_LOG" 2>&1

          grep -q "UR_HOST_STATE AUTHENTIC_INERT" "$AUTH_LOG"
          ! grep -q "UR_HOST_STATE LOADED" "$AUTH_LOG"
          ! grep -q "UR_DISPLAY_MODE APPLIED" "$AUTH_LOG"
          ! grep -q "UR_VSYNC APPLIED" "$AUTH_LOG"
          ! grep -q "UR_PRESENTATION_FPS APPLIED" "$AUTH_LOG"
          ! grep -q "UR_OUTPUT_RESOLUTION" "$AUTH_LOG"
          ! grep -q "UR_WIDESCREEN" "$AUTH_LOG"
          if grep -q "UR_RENDER_SCALE" "$AUTH_LOG"; then
            echo "::error::Authentic mode touched modern Internal Render Scale policy"
            exit 1
          fi

          echo "UR_PAUSE_OPTIONS_RESULT=focus_fullscreen_vsync_presentation_fps_output_resolution_render_scale_widescreen_saved_loaded_and_authentic_inert"

      - name: Internal Render Scale compositor acceptance
        if: matrix.shard == 'core'
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/ur-recomp-build/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"
          INPUT="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"
          STATE="$RUNNER_TEMP/render-scale-2x.state"
          SHOT="$RUNNER_TEMP/render-scale-2x.ppm"
          LOG="$RUNNER_TEMP/render-scale-2x.log"
          DUMPS="$RUNNER_TEMP/render-scale-2x-dumps"
          mkdir -p "$DUMPS"

          cat > "$STATE" <<'EOF'
          UR-HOST-STATE/6
          profile=
          pause_on_focus_loss=1
          vibration_enabled=1
          display_mode=windowed
          vsync=on
          presentation_fps=game
          output_resolution=native
          widescreen=original
          internal_render_scale=2x
          EOF

          # evidence-frame-anchor: exact frame is required only to prove the post-scale 512x448 surface.
          # 1219 is an observed HD-composited frame in both the pre-move green smoke route and this shard.
          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$STATE" \
          UR_RACER_HD=1 \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
          SNESRECOMP_INPUT_FILE="$INPUT" \
          SNESRECOMP_SCREENSHOT="$SHOT" \
          SNESRECOMP_SCREENSHOT_FRAME=1219 \
          timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_HOST_STATE LOADED .*internal_render_scale=2x" "$LOG"
          grep -q "UR_RENDER_SCALE APPLIED scale=2x" "$LOG"
          grep -q "UR_RACER_HD_DRAW PASS .*output_scale=2" "$LOG"
          test -s "$SHOT"
          python3 tools/check_ppm.py "$SHOT" --width 512 --height 448 --min-colors 2
          echo "UR_RENDER_SCALE_FRAME PASS dimensions=512x448 scale=2"

      - name: Internal Render Scale fallback-frame acceptance
        if: matrix.shard == 'core'
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/ur-recomp-build/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/two-player-first-race-observe.script"
          INPUT="$GITHUB_WORKSPACE/tests/input/two-player-first-race.input"
          STATE="$RUNNER_TEMP/render-scale-2x.state"
          SHOT="$RUNNER_TEMP/render-scale-2x-fallback-1467.ppm"
          LOG="$RUNNER_TEMP/render-scale-2x-fallback-1467.log"
          DUMPS="$RUNNER_TEMP/render-scale-2x-fallback-1467-dumps"
          mkdir -p "$DUMPS"

          # Frame 1467 is the retained native Racer-HD fail-closed witness:
          # P1 is an unauthored 0540+0D4C pose and must not enter the authored
          # replacement draw path. Density must nevertheless remain at the
          # persisted 2x setting through the exact stock-raster fallback.
          SDL_AUDIODRIVER=dummy \
          UR_PRODUCT_DIAGNOSTICS=1 \
          UR_HOST_STATE_PATH="$STATE" \
          UR_RACER_HD=1 \
          SNESRECOMP_DUMP_DIR="$DUMPS" \
          SNESRECOMP_INPUT_FILE="$INPUT" \
          SNESRECOMP_SCREENSHOT="$SHOT" \
          SNESRECOMP_SCREENSHOT_FRAME=1467 \
          timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" >"$LOG" 2>&1

          cat "$LOG"
          grep -q "UR_HOST_STATE LOADED .*internal_render_scale=2x" "$LOG"
          grep -q "UR_RENDER_SCALE APPLIED scale=2x" "$LOG"
          if grep -F "UR_RACER_HD_DRAW PASS frame=1467 " "$LOG"; then
            echo "::error::fallback witness frame 1467 unexpectedly entered authored Racer HD"
            exit 1
          fi
          test -s "$SHOT"
          python3 tools/check_ppm.py "$SHOT" --width 512 --height 448 --min-colors 2
          echo "UR_RENDER_SCALE_FALLBACK PASS frame=1467 dimensions=512x448 scale=2"

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-capture-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/*-dumps/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/host-state-v6.txt
            ${{ runner.temp }}/render-scale-2x.state
            ${{ runner.temp }}/render-scale-2x.ppm
            ${{ runner.temp }}/render-scale-2x-dumps/
            ${{ runner.temp }}/render-scale-2x-fallback-1467.ppm
            ${{ runner.temp }}/render-scale-2x-fallback-1467.log
            ${{ runner.temp }}/render-scale-2x-fallback-1467-dumps/
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    name: aggregate-ui-evidence
    needs: [build, capture]
    if: ${{ needs.build.result == 'success' && needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download capture shards
        uses: actions/download-artifact@v4
        with:
          pattern: native-ui-capture-*
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Build UI atlas report
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_ui_atlas.py \
            --manifest analysis/ui-capture-manifest.json \
            --reference-index analysis/ui-reference-index.json \
            --transition-contract analysis/ui-transition-contract.json \
            --include-unclassified \
            --exclude-source-fixture two-player-first-race \
            --dump-dir "$RUNNER_TEMP/race-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-branch-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-vs-handoff-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-ending-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-attract-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-pause-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-options-submenu-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-erase-confirm-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-league-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-race-result-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-stunt-result-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-records-explore-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-rename-editor-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-circuit-result-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-records-submenu-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-records-isolated-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-name-league-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-startup-timeline-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-define-player-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-pre-race-timing-dumps" \
            --out-json "$RUNNER_TEMP/ui-atlas.json" \
            --out-md "$RUNNER_TEMP/ui-atlas.md" \
            --strict
          cat "$RUNNER_TEMP/ui-atlas.md"

      - name: Assert race-result finish time is printed
        shell: bash
        run: |
          set -euo pipefail
          # R-2026-10-04-UI-25: a nested LLE deadline unwind once dropped this row.
          cd tools
          python3 check_result_screen_time.py \
            --dump-dir "$RUNNER_TEMP/ui-race-result-dumps" \
            --checkpoint race-results

      - name: Assert reset-separated routes captured every dump
        shell: bash
        run: |
          set -euo pipefail
          # R-2026-10-04-UI-26: scripted console reset once crashed or wedged the
          # native target, silently dropping every capture after the first reset.
          missing=0
          for pair in \
            ui-records-explore:ui-records-explore-dumps \
            ui-options-submenus:ui-options-submenu-dumps \
            ui-records-submenus:ui-records-submenu-dumps \
            ui-main-branches:ui-branch-dumps \
            ui-rename-editor-explore:ui-rename-editor-dumps; do
            script="tests/input/${pair%%:*}.script"
            dir="$RUNNER_TEMP/${pair##*:}"
            for tag in $(awk '$1 == "dump" {print $2}' "$script"); do
              if [ ! -f "$dir/$tag.wram.bin" ]; then
                echo "missing native capture: ${pair%%:*}/$tag"
                missing=1
              fi
            done
          done
          exit "$missing"

      - name: Build visual UI contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_ui_contact_sheet.py \
            --atlas "$RUNNER_TEMP/ui-atlas.json" \
            --reference-index analysis/ui-reference-index.json \
            --out "$RUNNER_TEMP/ui-atlas.html" \
            --include-missing

      - name: Compare UI framebuffer transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compare_ui_frames.py \
            --manifest analysis/ui-frame-comparisons.json \
            --dump-dir "$RUNNER_TEMP/race-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-branch-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-vs-handoff-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-ending-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-attract-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-pause-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-options-submenu-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-erase-confirm-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-league-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-race-result-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-stunt-result-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-records-explore-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-rename-editor-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-circuit-result-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-records-submenu-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-records-isolated-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-name-league-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-startup-timeline-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-define-player-dumps" \
            --dump-dir "$RUNNER_TEMP/ui-pre-race-timing-dumps" \
            --out-json "$RUNNER_TEMP/ui-frame-comparisons.json" \
            --out-md "$RUNNER_TEMP/ui-frame-comparisons.md"
          cat "$RUNNER_TEMP/ui-frame-comparisons.md"


      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-native-ui-evidence
          path: |
            ${{ runner.temp }}/*-dumps/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ui-atlas.json
            ${{ runner.temp }}/ui-atlas.md
            ${{ runner.temp }}/ui-atlas.html
            ${{ runner.temp }}/ui-frame-comparisons.json
            ${{ runner.temp }}/ui-frame-comparisons.md
          if-no-files-found: warn
          retention-days: 7

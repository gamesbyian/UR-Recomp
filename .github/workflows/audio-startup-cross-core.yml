name: Audio startup cross-core regression

on:
  workflow_dispatch:

concurrency:
  group: audio-startup-cross-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build reference stack
        run: |
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          python3 tools/bootstrap_toolchain.py --offline --tool beetle-bsnes-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2

      - name: Run first-race route through both audio references
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/snesref-build/snesref"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script"
          run_core() {
            local label="$1" core="$2" allow_abort="${3:-0}"
            local dumps="$RUNNER_TEMP/${label}-dumps"
            mkdir -p "$dumps"
            set +e
            SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
            SNESREF_SCRIPT="$SCRIPT" SNESREF_DUMP_DIR="$dumps" \
            SNESREF_WAV="$RUNNER_TEMP/${label}.wav" \
              "$EXE" "$core" "$ROM" >"$RUNNER_TEMP/${label}.log" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/${label}.log"
            test -s "$RUNNER_TEMP/${label}.wav"
            test -s "$dumps/race-entered.wram.bin"
            if [ "$status" -eq 0 ]; then return 0; fi
            if [ "$allow_abort" -eq 1 ] && [ "$status" -eq 134 ]; then
              echo "::warning::${label} completed fixture then aborted during teardown"
              return 0
            fi
            return "$status"
          }
          run_core snes9x "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          run_core beetle "$GITHUB_WORKSPACE/.tools/src/beetle-bsnes-libretro/mednafen_snes_libretro.so" 1

      - name: Reduce named PCM windows
        run: |
          python3 tools/analyze_reference_audio_windows.py \
            "$RUNNER_TEMP/snes9x.log" "$RUNNER_TEMP/snes9x.wav" \
            --json-out snes9x-audio-windows.json
          python3 tools/analyze_reference_audio_windows.py \
            "$RUNNER_TEMP/beetle.log" "$RUNNER_TEMP/beetle.wav" \
            --json-out beetle-audio-windows.json
          cat snes9x-audio-windows.json
          cat beetle-audio-windows.json
          python3 - <<'PY'
          import json
          for name in ("snes9x","beetle"):
              r=json.load(open(f"{name}-audio-windows.json"))
              for tag,row in r["checkpoints"].items():
                  assert row["peak"] > 0, (name,tag,row)
                  assert row["nonzero_fraction"] > 0.01, (name,tag,row)
              assert r["checkpoints"]["main-menu-ready"]["window_sha256"] != r["checkpoints"]["race-entered"]["window_sha256"]
              print(name, "audible named windows and state transition confirmed")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-startup-cross-core
          path: |
            snes9x-audio-windows.json
            beetle-audio-windows.json
            ${{ runner.temp }}/snes9x.log
            ${{ runner.temp }}/beetle.log
          retention-days: 7

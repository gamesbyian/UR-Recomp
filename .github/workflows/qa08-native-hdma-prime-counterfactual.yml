name: QA-08 one-shot native HDMA prime raster experiment

on:
  # Bounded original/native research, not an automatic merge gate.
  # Its pinned original Snes9x artifact IDs 11884155561 and 11925517895
  # are no longer retrievable (HTTP 410 observed in run #40971901768).
  # Keep the full real experiment available for manual replay only after
  # independently restoring both original source archives by exact digest.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qa08-prime-one-shot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authentic-native-2p:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SDL_AUDIODRIVER: dummy
      PIXELS: "0"
      KEEP_WRAM: "0"
      TMO: "95"
      UR_BALDOSA_HD: "1"
      UR_BALDOSA_HD_DENSITY: "1"
      UR_QA08_HDMA_COLDATA_FRAME: "2208"
      UR_QA08_HDMA_ALL_CHANNELS_FRAME: "1856"
      # Five real host-presented source frames including two motion witnesses; no synthesis.
      UR_BALDOSA_FIXED_ORIGINAL_SOURCE_FRAME: "400"
      UR_BALDOSA_FIXED_ORIGINAL_SOURCE_EXTRA_FRAME: "1856"
      UR_BALDOSA_FIXED_ORIGINAL_SOURCE_LATE_FRAME: "2208"
      UR_QA08_ADDITIONAL_SOURCE_FRAME_A: "2192"
      UR_QA08_ADDITIONAL_SOURCE_FRAME_B: "2224"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false
      - name: ROM-free falsification of source comparison and selective DMA patch
        run: |
          python3 -m unittest tests.unit.test_qa08_compare_channel7_native_prime
          python3 -m unittest tests.unit.test_qa08_channel7_only_prime_counterfactual
          python3 -m unittest tests.unit.test_qa08_patch_channel57_prime_counterfactual
          python3 -m unittest tests.unit.test_qa08_compare_channel57_native_prime
          python3 -m unittest tests.unit.test_qa08_patch_extra_original_source_capture
          python3 -m unittest tests.unit.test_qa08_compare_original_moving_source_window
          python3 -m unittest tests.unit.test_qa08_patch_hdma_all_channels_source
      - name: Confirm exact prior native core, guest, ROM and route
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          echo "859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478  reference/roms/retail/Uniracers_USA.sfc" | sha256sum -c -
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          cmp baldosa/tests/routes/race_2p_split.txt reference/imported/reverse-engineering/baldosa-uniracers-recomp/tests/routes/race_2p_split.txt
      - name: Build exact native AOT with existing read-only PPU source presenter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ninja-build pkg-config libsdl2-dev libgl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev xvfb x11-utils
          python3 tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_single_presentation_scale_patch.py --root "$GITHUB_WORKSPACE" --framework baldosa/snesrecomp
          python3 tools/baldosa_hd_host_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          # Modify only this disposable CI checkout's read-only Original PPU
          # source capture observer; shipping production source stays intact.
          python3 tools/qa08_patch_extra_original_source_capture.py \
            --source tools/baldosa_native_racer_presentation.cpp
          python3 tools/qa08_patch_extra_original_source_capture.py \
            --source tools/baldosa_native_racer_presentation.cpp --apply-experiment
          python3 tools/qa08_patch_hdma_coldata_source.py --framework baldosa/snesrecomp
          # After the existing source-qualified channel5/7 observer, enable a
          # read-only all-channel census for one genuine countdown guest frame.
          python3 tools/qa08_patch_hdma_all_channels_source.py \
            --framework baldosa/snesrecomp
          python3 tools/qa08_patch_hdma_all_channels_source.py \
            --framework baldosa/snesrecomp --apply-experiment
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          if test ! -f baldosa/build/config.ini; then
            printf '%s\n' '[Sound]' 'EnableAudio = 0' > baldosa/build/config.ini
          fi
          test -x baldosa/build/UniracersSNESRecomp
      - name: Record independent unchanged 2P baseline source P7 and all guest CRCs
        shell: bash
        run: |
          set -euo pipefail
          export SNESRECOMP_ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          Xvfb :99 -screen 0 1280x720x24 -ac > "$RUNNER_TEMP/qa08-xvfb.log" 2>&1 &
          export DISPLAY=:99
          for _attempt in 1 2 3 4 5; do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :99 >/dev/null
          cat > "$RUNNER_TEMP/qa08-exec" <<'SH'
          #!/usr/bin/env bash
          export SDL_VIDEODRIVER=x11
          args=("$@")
          config=""
          for ((i=0; i+1<${#args[@]}; i++)); do
            if [ "${args[i]}" = "--config" ]; then config="${args[i+1]}"; break; fi
          done
          if [ -z "$config" ]; then
            echo "QA08 authentic 2P source has no isolated --config" >&2
            exit 3
          fi
          python3 "$GITHUB_WORKSPACE/tools/baldosa_hd_enable_renderer.py" --config "$config"
          exec "$BALDOSA_REAL_BIN" "$@"
          SH
          chmod +x "$RUNNER_TEMP/qa08-exec"
          export BIN="$RUNNER_TEMP/qa08-exec"
          export UR_BALDOSA_HD_CAPTURE_DIR="$RUNNER_TEMP/qa08-native-baseline"
          mkdir -p "$UR_BALDOSA_HD_CAPTURE_DIR" "$RUNNER_TEMP/qa08-counterfactual"
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/qa08-counterfactual/baseline"
          grep -q "^UR_BALDOSA_FIXED_ORIGINAL_SOURCE frame=$UR_BALDOSA_FIXED_ORIGINAL_SOURCE_LATE_FRAME logical=256x224 saved=1 source=native-original-ppu$" \
            "$RUNNER_TEMP/qa08-counterfactual/baseline/log.txt"
          for frame in 000400 001856 002192 002208 002224; do
            test -s "$UR_BALDOSA_HD_CAPTURE_DIR/ur-baldosa-original-source-${frame}.pam"
          done
          echo "a946c9ebb54775639b8fd87a6861af0408cceed4896e58be05908c4a4491c67f  $UR_BALDOSA_HD_CAPTURE_DIR/ur-baldosa-original-source-002208.pam" | sha256sum -c -
          grep "^UR_QA08_HDMA_INIDISP frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/baseline/log.txt" > "$RUNNER_TEMP/qa08-counterfactual/baseline-inidisp.log"
          test "$(wc -l < "$RUNNER_TEMP/qa08-counterfactual/baseline-inidisp.log")" -eq 4
      - name: Mutate disposable framework only and rebuild same AOT guest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa08_patch_hdma_prime_counterfactual.py \
            --framework baldosa/snesrecomp --apply-experiment
          grep -q 'UR_QA08_HDMA_PRIME_COUNTERFACTUAL' baldosa/snesrecomp/runner/src/snes/dma.c
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
      - name: Independently rerun exact 2P event and report every source pixel delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SNESRECOMP_ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export DISPLAY=:99 BIN="$RUNNER_TEMP/qa08-exec"
          export UR_BALDOSA_HD_CAPTURE_DIR="$RUNNER_TEMP/qa08-native-experiment"
          mkdir -p "$UR_BALDOSA_HD_CAPTURE_DIR"
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/qa08-counterfactual/experiment"
          cmp "$RUNNER_TEMP/qa08-counterfactual/baseline/fd/crc.txt" \
              "$RUNNER_TEMP/qa08-counterfactual/experiment/fd/crc.txt"
          grep -q "^UR_BALDOSA_FIXED_ORIGINAL_SOURCE frame=$UR_BALDOSA_FIXED_ORIGINAL_SOURCE_LATE_FRAME logical=256x224 saved=1 source=native-original-ppu$" \
            "$RUNNER_TEMP/qa08-counterfactual/experiment/log.txt"
          for frame in 000400 001856 002192 002208 002224; do
            test -s "$UR_BALDOSA_HD_CAPTURE_DIR/ur-baldosa-original-source-${frame}.pam"
          done
          grep "^UR_QA08_HDMA_INIDISP frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/experiment/log.txt" > "$RUNNER_TEMP/qa08-counterfactual/experiment-inidisp.log"
          test -s "$RUNNER_TEMP/qa08-counterfactual/experiment-inidisp.log"
          python3 tools/qa08_compare_native_hdma_prime_trial.py \
            --baseline "$RUNNER_TEMP/qa08-native-baseline/ur-baldosa-original-source-002208.pam" \
            --trial "$RUNNER_TEMP/qa08-native-experiment/ur-baldosa-original-source-002208.pam" \
            --baseline-crc "$RUNNER_TEMP/qa08-counterfactual/baseline/fd/crc.txt" \
            --trial-crc "$RUNNER_TEMP/qa08-counterfactual/experiment/fd/crc.txt" \
            --out "$RUNNER_TEMP/qa08-counterfactual/real-native-raster.json"
          python3 tools/qa08_compare_native_prime_multiframe.py \
            --before-dir "$RUNNER_TEMP/qa08-native-baseline" \
            --after-dir "$RUNNER_TEMP/qa08-native-experiment" \
            --baseline-crc "$RUNNER_TEMP/qa08-counterfactual/baseline/fd/crc.txt" \
            --trial-crc "$RUNNER_TEMP/qa08-counterfactual/experiment/fd/crc.txt" \
            --out "$RUNNER_TEMP/qa08-counterfactual/real-native-prime-3scene-raster.json"
          # Retrieve only the independently accepted ORIGINAL Snes9x source
          # archive from the exact prior evidence ID. Do not forward GH_TOKEN
          # to the signed cross-domain blob redirect.
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --dump-header "$RUNNER_TEMP/qa08-original-http-headers" \
            --output /dev/null \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/11884155561/zip"
          location="$(awk 'tolower($1) == "location:" {gsub(/\r/, "", $2); print $2}' "$RUNNER_TEMP/qa08-original-http-headers" | tail -1)"
          case "$location" in
            https://*) ;;
            *) echo "::error::accepted original Snes9x source artifact redirect unavailable"; exit 3 ;;
          esac
          curl --fail --silent --show-error --retry 3 --location \
            --output "$RUNNER_TEMP/qa08-original-source-exact.zip" "$location"
          echo "6e5d488230c11d3dfcd144b6a7cbc8c25d7acfcb4f95b776a85071dd3487f5e3  $RUNNER_TEMP/qa08-original-source-exact.zip" | sha256sum -c -
          python3 tools/qa08_check_hdma_prime_candidate.py \
            --original-zip "$RUNNER_TEMP/qa08-original-source-exact.zip" \
            --candidate-p7 "$RUNNER_TEMP/qa08-native-experiment/ur-baldosa-original-source-002208.pam" \
            --original-crc "$RUNNER_TEMP/qa08-counterfactual/baseline/fd/crc.txt" \
            --candidate-crc "$RUNNER_TEMP/qa08-counterfactual/experiment/fd/crc.txt" \
            --out "$RUNNER_TEMP/qa08-counterfactual/original-snes9x-exact-RGB5.json"
          {
            cat "$RUNNER_TEMP/qa08-counterfactual/real-native-raster.json"
            cat "$RUNNER_TEMP/qa08-counterfactual/original-snes9x-exact-RGB5.json"
            echo "Observation only, even if the hypothesis fails; not an original-emulator equality or shipping verdict."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore original pinned first-line behavior and apply ONLY channel-7 prime in disposable framework
        shell: bash
        run: |
          set -euo pipefail
          # Invert only the global counterfactual, retaining all previously
          # installed original-game adapter and read-only HDMA observers.
          # Assert exact reversibility before applying another experiment.
          python3 - <<'PY'
          from pathlib import Path
          from tools.qa08_patch_hdma_prime_counterfactual import (
              FUNCTION, NEXT, OLD_SAVE, OLD_RESTORE, NEW_ADVANCE, patch_source,
          )
          path = Path("baldosa/snesrecomp/runner/src/snes/dma.c")
          global_source = path.read_text()
          head, tail = global_source.split(FUNCTION, 1)
          body, rest = tail.split(NEXT, 1)
          prime_transfer = "    int len = transferLength[ch->mode & 7];"
          if body.count(prime_transfer) != 1 or body.count(NEW_ADVANCE) != 1:
              raise SystemExit("global prime source drift: cannot restore selectively")
          body = body.replace(prime_transfer, OLD_SAVE, 1).replace(NEW_ADVANCE, OLD_RESTORE, 1)
          recovered = head + FUNCTION + body + NEXT + rest
          if patch_source(recovered) != global_source:
              raise SystemExit("not an exact inverse of prior global prime")
          path.write_text(recovered)
          PY
          python3 tools/qa08_patch_channel7_only_prime_counterfactual.py --framework baldosa/snesrecomp
          python3 tools/qa08_patch_channel7_only_prime_counterfactual.py \
            --framework baldosa/snesrecomp --apply-experiment
          grep -q UR_QA08_CH7_ONLY_PRIME_EXPERIMENT baldosa/snesrecomp/runner/src/snes/dma.c
          if grep -q UR_QA08_HDMA_PRIME_COUNTERFACTUAL baldosa/snesrecomp/runner/src/snes/dma.c; then
            echo "::error::global counterfactual remains in selective candidate"; exit 3
          fi
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
      - name: Execute third real native guest with selective channel-7 HDMA and preserve actual source
        shell: bash
        run: |
          set -euo pipefail
          export SNESRECOMP_ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export DISPLAY=:99 BIN="$RUNNER_TEMP/qa08-exec"
          export UR_BALDOSA_HD_CAPTURE_DIR="$RUNNER_TEMP/qa08-native-channel7"
          mkdir -p "$UR_BALDOSA_HD_CAPTURE_DIR"
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/qa08-counterfactual/channel7"
          cmp "$RUNNER_TEMP/qa08-counterfactual/baseline/fd/crc.txt" \
              "$RUNNER_TEMP/qa08-counterfactual/channel7/fd/crc.txt"
          grep -q "^UR_BALDOSA_FIXED_ORIGINAL_SOURCE frame=$UR_QA08_HDMA_COLDATA_FRAME logical=256x224 saved=1 source=native-original-ppu$" \
            "$RUNNER_TEMP/qa08-counterfactual/channel7/log.txt"
          for frame in 000400 001856 002192 002208 002224; do
            test -s "$UR_BALDOSA_HD_CAPTURE_DIR/ur-baldosa-original-source-${frame}.pam"
          done
          grep "^UR_QA08_HDMA_INIDISP frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/channel7/log.txt" \
            > "$RUNNER_TEMP/qa08-counterfactual/channel7-inidisp.log"
          test "$(wc -l < "$RUNNER_TEMP/qa08-counterfactual/channel7-inidisp.log")" -eq 3
          # A truly selective change must leave real channel5 BBUS
          # provenance on this same guest input byte-for-byte intact.
          grep "^UR_QA08_HDMA_CGADSUB frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/baseline/log.txt" \
            > "$RUNNER_TEMP/qa08-counterfactual/stock-channel5.log"
          grep "^UR_QA08_HDMA_CGADSUB frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/channel7/log.txt" \
            > "$RUNNER_TEMP/qa08-counterfactual/selective-channel5.log"
          test -s "$RUNNER_TEMP/qa08-counterfactual/stock-channel5.log"
          cmp "$RUNNER_TEMP/qa08-counterfactual/stock-channel5.log" \
              "$RUNNER_TEMP/qa08-counterfactual/selective-channel5.log"
      - name: Classify selective prime against BOTH archived independent original rasters
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The accepted post-GO archive was already downloaded and SHA
          # verified in the preceding two-process source comparison.
          test -s "$RUNNER_TEMP/qa08-original-source-exact.zip"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --dump-header "$RUNNER_TEMP/qa08-original-countdown-headers" \
            --output /dev/null \
            "https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/11925517895/zip"
          location="$(awk 'tolower($1) == "location:" {gsub(/\r/, "", $2); print $2}' "$RUNNER_TEMP/qa08-original-countdown-headers" | tail -1)"
          case "$location" in
            https://*) ;;
            *) echo "::error::original countdown source redirect unavailable"; exit 3 ;;
          esac
          curl --fail --silent --show-error --retry 3 --location \
            --output "$RUNNER_TEMP/qa08-original-countdown-exact.zip" "$location"
          echo "56ec0011a3559f5953578c495d080d0150f2a06fb7a76c2e437fab781e2b2ce6  $RUNNER_TEMP/qa08-original-countdown-exact.zip" | sha256sum -c -
          python3 tools/qa08_compare_channel7_native_prime.py \
            --stock-dir "$RUNNER_TEMP/qa08-native-baseline" \
            --global-dir "$RUNNER_TEMP/qa08-native-experiment" \
            --channel7-dir "$RUNNER_TEMP/qa08-native-channel7" \
            --stock-crc "$RUNNER_TEMP/qa08-counterfactual/baseline/fd/crc.txt" \
            --global-crc "$RUNNER_TEMP/qa08-counterfactual/experiment/fd/crc.txt" \
            --channel7-crc "$RUNNER_TEMP/qa08-counterfactual/channel7/fd/crc.txt" \
            --original-postgo-zip "$RUNNER_TEMP/qa08-original-source-exact.zip" \
            --original-countdown-zip "$RUNNER_TEMP/qa08-original-countdown-exact.zip" \
            --out "$RUNNER_TEMP/qa08-counterfactual/real-channel7-original-vs-native.json"
          cat "$RUNNER_TEMP/qa08-counterfactual/real-channel7-original-vs-native.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Selective channel-7 trial is diagnostic ONLY: no HDMA production promotion." >> "$GITHUB_STEP_SUMMARY"
      - name: Reverse selective patch exactly and stage disposable combined channel5+7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.qa08_patch_channel7_only_prime_counterfactual import SELECTIVE, RESTORE, patch_source
          path = Path("baldosa/snesrecomp/runner/src/snes/dma.c")
          selective = path.read_text()
          if selective.count(SELECTIVE) != 1:
              raise SystemExit("selective source is not exactly pinned")
          recovered = selective.replace(SELECTIVE, RESTORE, 1)
          if patch_source(recovered) != selective:
              raise SystemExit("recovered source does not recreate selective patch")
          path.write_text(recovered)
          PY
          python3 tools/qa08_patch_channel57_prime_counterfactual.py \
            --framework baldosa/snesrecomp
          python3 tools/qa08_patch_channel57_prime_counterfactual.py \
            --framework baldosa/snesrecomp --apply-experiment
          grep -q UR_QA08_CH57_ONLY_PRIME_EXPERIMENT baldosa/snesrecomp/runner/src/snes/dma.c
          if grep -qE 'UR_QA08_CH7_ONLY_PRIME_EXPERIMENT|UR_QA08_HDMA_PRIME_COUNTERFACTUAL' \
            baldosa/snesrecomp/runner/src/snes/dma.c; then
            echo "::error::competing prime source mutation remains"; exit 3
          fi
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
      - name: Execute fourth real 2P game guest under combined channel5+7 prime
        shell: bash
        run: |
          set -euo pipefail
          export SNESRECOMP_ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export DISPLAY=:99 BIN="$RUNNER_TEMP/qa08-exec"
          export UR_BALDOSA_HD_CAPTURE_DIR="$RUNNER_TEMP/qa08-native-channel57"
          mkdir -p "$UR_BALDOSA_HD_CAPTURE_DIR"
          bash baldosa/tools/run_route.sh baldosa/tests/routes/race_2p_split.txt \
            "$RUNNER_TEMP/qa08-counterfactual/channel57"
          cmp "$RUNNER_TEMP/qa08-counterfactual/baseline/fd/crc.txt" \
              "$RUNNER_TEMP/qa08-counterfactual/channel57/fd/crc.txt"
          grep -q "^UR_BALDOSA_FIXED_ORIGINAL_SOURCE frame=$UR_QA08_HDMA_COLDATA_FRAME logical=256x224 saved=1 source=native-original-ppu$" \
            "$RUNNER_TEMP/qa08-counterfactual/channel57/log.txt"
          for frame in 000400 001856 002192 002208 002224; do
            test -s "$UR_BALDOSA_HD_CAPTURE_DIR/ur-baldosa-original-source-$frame.pam"
          done
          grep "^UR_QA08_HDMA_CGADSUB frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/experiment/log.txt" \
            > "$RUNNER_TEMP/qa08-counterfactual/global-channel5.log"
          grep "^UR_QA08_HDMA_CGADSUB frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/channel57/log.txt" \
            > "$RUNNER_TEMP/qa08-counterfactual/combined-channel5.log"
          test -s "$RUNNER_TEMP/qa08-counterfactual/global-channel5.log"
          cmp "$RUNNER_TEMP/qa08-counterfactual/global-channel5.log" \
              "$RUNNER_TEMP/qa08-counterfactual/combined-channel5.log"
          grep "^UR_QA08_HDMA_INIDISP frame=$UR_QA08_HDMA_COLDATA_FRAME " \
            "$RUNNER_TEMP/qa08-counterfactual/channel57/log.txt" \
            > "$RUNNER_TEMP/qa08-counterfactual/channel57-inidisp.log"
          test "$(wc -l < "$RUNNER_TEMP/qa08-counterfactual/channel57-inidisp.log")" -eq 3
      - name: Strict fourth-source RGB5 comparison to two original emulator PPU images
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/qa08-original-source-exact.zip"

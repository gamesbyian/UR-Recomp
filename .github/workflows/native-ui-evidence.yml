          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/ui-erase-confirm.script"
          LOG="$RUNNER_TEMP/ui-erase-confirm.log"
          DUMPS="$RUNNER_TEMP/ui-erase-confirm-dumps"
          mkdir -p "$DUMPS"

          echo "== scripted UI erase-confirmation reconnaissance =="
          SNESRECOMP_DUMP_DIR="$DUMPS" SDL_AUDIODRIVER=dummy \
          timeout 90s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \

      # Separate from the strict QA-12 pause-evidence ZIP allowlist. Bounded
      # source logs and the kill receipt only: no ROM, executable or saves.
      - name: Retain bounded native Practice lifecycle logs separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baldosa-win32-native-practice-lifecycle

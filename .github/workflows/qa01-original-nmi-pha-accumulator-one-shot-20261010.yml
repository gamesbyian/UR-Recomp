name: QA-01 original I_NMI PHA full accumulator ONE-SHOT

on:
  pull_request:
    paths:
      - ".github/workflows/qa01-original-nmi-pha-accumulator-one-shot-20261010.yml"

permissions:
  contents: read

concurrency:
  group: qa01-original-nmi-pha-full-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-pha-accumulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Check out pinned original and native comparison harness
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out independently pinned Baldosa native game/framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Confirm actual canonical 2014 input, ROM and source revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          test -s reference/imported/tas-bots/dessyreqt-4250-submission.smv
          python3 -m unittest discover -s tests/unit -p 'test_qa01_native_switcher_stack_trace.py'
          python3 -m unittest discover -s tests/unit -p 'test_probe_original_event_complete.py'

      - name: Build disposable original PHA A/M/SP observer and pinned stock native
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config build-essential cmake libsdl2-dev \
            libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev xvfb
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          cmake -S baldosa/snesrecomp/tools/snesref \
            -B "$RUNNER_TEMP/qa01-switcher-snesref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qa01-switcher-snesref" -j2
          # Existing verified QA-only source-input transport is unchanged.
          python3 tools/baldosa_qa_dense_scene_input_patch.py \
            --host baldosa/snesrecomp/runner/src/desktop/host_main.c
          # Read-only original CPU opcode pre/post-byte observation in a
          # disposable libretro source checkout, never a guest opcode change.
          python3 tools/instrument_snesref_qa01_switcher_stack.py \
            --single-address 0x01DD --watch-nmi \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/cpuexec.cpp"
          # Second independent observer: exact original I_NMI+6 PHA
          # full accumulator, M flag and low/high stack bytes (read-only).
          python3 tools/qa01_original_nmi_pha_accumulator_patch.py \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/cpuexec.cpp"
          make -C "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro" -j2
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j3
          test -x baldosa/build/UniracersSNESRecomp
          test -x "$RUNNER_TEMP/qa01-switcher-snesref/snesref"

      - name: Replay authentic original/native result, validate exact original PHA A and stack word
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qa01-switcher-original-01dd"
          mkdir -p "$ROOT"
          # CPU ICpu.Frame is NOT assumed identical to the separate native
          # writer ring's snes_frame_counter. Report both clocks explicitly.
          export UR_QA_STACK_FIRST=5778
          export UR_QA_STACK_LAST=5782
          set +e
          python3 tools/probe_original_event_complete.py \
            --case switcher \
            --native-backend pinned-baldosa \
            --switcher-same-host-penultimate \
            --switcher-same-host-full-memory-offsets \
            --snesref "$RUNNER_TEMP/qa01-switcher-snesref/snesref" \
            --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            --native "$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --work-dir "$ROOT" \
            --json-out "$ROOT/switcher-paired-report.json" \
            > "$ROOT/probe.log" 2>&1
          rc=$?
          set -e
          tail -n 20 "$ROOT/probe.log"
          test "$rc" -eq 1 || {
            echo "Strict full original/native guest-relative parity changed; do not silently admit" >&2
            exit 2
          }
          test -s "$ROOT/switcher-paired-report.json"
          test -s "$ROOT/switcher/replay/reference.log"
          python3 tools/qa01_original_nmi_pha_accumulator_report.py \
            --original-log "$ROOT/switcher/replay/reference.log" \
            --paired-report "$ROOT/switcher-paired-report.json" \
            --out "$ROOT/original-nmi-pha-accumulator.json"
          python3 - "$ROOT/original-nmi-pha-accumulator.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["complete_event_release_credit"] == 0
          assert j["original_cpu_vs_native_writer_frame_clocks_unaligned"] is True
          assert len(j["original_nmi_hardware_entry_events"]) == 5
          assert j["independently_authenticated_original_native_pair"]["original_native_result_relative_frame_parity"] is False
          print("QA01_ORIGINAL_NMI_PHA_FULL_A=" + json.dumps({
              "pha": j["confirmed_original_01dd_pha_register_scope"],
              "all_I_NMI_pha_register_scopes": j["all_bounded_original_I_NMI_pha_register_scopes"],
              "original_native_strict_parity": False, "usa_event_credit": 0,
          },sort_keys=True))
          PY
          echo "Authentic Switcher guest-relative +4704/+4702 mismatch persists: original full-A PHA is research, not USA admission (0/45)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded original PHA original register evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa01-original-nmi-pha-accumulator-one-shot-20261010
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qa01-switcher-original-01dd/original-nmi-pha-accumulator.json
            ${{ runner.temp }}/qa01-switcher-original-01dd/probe.log
            ${{ runner.temp }}/qa01-switcher-original-01dd/switcher/replay/reference.log

name: Modern race restart native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/product/race_restart_anchor.*"
      - "native/product/session_runtime_adapter.*"
      - "native/product/race_restart_lifecycle.*"
      - "native/product/modern_session_runtime.*"
      - "native/product/modern_session_c_api.*"
      - "tools/patches/snesrecomp-title-key-hook.patch"
      - "tools/patches/snesrecomp-title-overlay-hook.patch"
      - "tools/patches/snesrecomp-title-gamepad-hook.patch"
      - "native/product/modern_pause_menu.*"
      - "tests/unit/test_modern_pause_menu_cpp.py"
      - "tools/toolchain.json"
      - "native/title/uniracers_restart_policy.*"
      - "tools/patch_modern_restart_probe_host.py"
      - "tests/unit/test_patch_modern_restart_probe_host.py"
      - "tests/unit/test_modern_session_runtime_cpp.py"
      - "tests/unit/test_modern_session_key_input_cpp.py"
      - "tests/native/modern_session_key_input_test.cpp"
      - "tests/native/modern_session_runtime_test.cpp"
      - "tests/unit/test_persistent_restart_restore_cpp.py"
      - "tests/unit/test_uniracers_restart_policy_cpp.py"
      - "tests/input/modern-restart-results-acceptance.script"
      - "tests/input/modern-restart-acceptance.script"
      - ".github/workflows/modern-race-restart-acceptance.yml"
      - "docs/MODERN-PRODUCT-LAYER.md"
      - "docs/SEMANTIC-SUFFICIENCY.md"
      - "docs/PROJECT-PLAN.md"

concurrency:
  group: modern-race-restart-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restart-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install focused desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Stage repository-owned SNESRecomp framework
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh

      - name: Scaffold and patch generated Uniracers host
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/ur-restart-acceptance"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --generate \
              --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          python3 "$GITHUB_WORKSPACE/tools/patch_modern_restart_probe_host.py" \
            "$ROOT/src/main.c" \
            --cmake "$ROOT/CMakeLists.txt"

          grep -q "UR_RESTART_PROBE captured=1" "$ROOT/src/main.c"
          grep -q "UrRestartProbeAfterRunFrame" "$ROOT/src/main.c"
          grep -q "UrModernSystemKeyDown" "$ROOT/src/main.c"
          grep -q "system_key_down" "$ROOT/src/main.c"
          grep -q "system_overlay" "$ROOT/src/main.c"
          grep -q "system_gamepad_button" "$ROOT/src/main.c"
          grep -q "modern_session_c_api.cpp" "$ROOT/CMakeLists.txt"
          grep -q "uniracers_restart_policy.cpp" "$ROOT/CMakeLists.txt"
          grep -q "snes_state_digest.c" "$ROOT/CMakeLists.txt"

      - name: Prove host-side product and title lifecycle contracts
        run: |
          python3 -m unittest \
            tests.unit.test_modern_session_runtime_cpp \
            tests.unit.test_modern_session_key_input_cpp \
            tests.unit.test_persistent_restart_restore_cpp \
            tests.unit.test_uniracers_restart_policy_cpp \
            tests.unit.test_patch_modern_restart_probe_host

      - name: Build patched native target
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/ur-restart-acceptance/UniracersSNESRecomp"
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF
          cmake --build "$ROOT/build" -j2
          test -x "$ROOT/build/UniracersSNESRecomp"

      - name: Prove product-command restart dispatch and repeated replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-restart-acceptance/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-restart-acceptance.script"
          LOG="$RUNNER_TEMP/modern-restart-acceptance.log"

          set +e
          SDL_AUDIODRIVER=dummy \
            timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            >"$LOG" 2>&1
          STATUS=$?
          set -e

          cat "$LOG"
          test "$STATUS" -eq 0
          grep -q "UR_SESSION_KEY PASS pause_resume_host_gate=1" "$LOG"
          grep -q "UR_SESSION_OVERLAY PASS paused_panel_presented=1" "$LOG"
          grep -q "UR_SESSION_GAMEPAD PASS start_nav_cancel=1 restart_item=1" "$LOG"
          grep -q "UR_RESTART_PROBE captured=1" "$LOG"
          grep -q "UR_RESTART_PROBE restart1_applied=1 immediate_equal=1 sram_progression_unchanged=1" "$LOG"
          grep -q "UR_RESTART_PROBE restart2_applied=1 immediate_equal=1 sram_progression_unchanged=1" "$LOG"
          grep -q "UR_RESTART_PROBE PASS command_dispatch=1 player_input_dispatch=1 repeated_restart_equal=1 window=60" "$LOG"
          ! grep -q "UR_RESTART_PROBE FAIL" "$LOG"

      - name: Prove results-screen Retry preserves persistent SRAM
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ur-restart-acceptance/UniracersSNESRecomp"
          EXE="$ROOT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-restart-results-acceptance.script"
          LOG="$RUNNER_TEMP/modern-restart-results-acceptance.log"

          set +e
          UR_RESTART_PROBE_MODE=results SDL_AUDIODRIVER=dummy \
            timeout 180s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
            >"$LOG" 2>&1
          STATUS=$?
          set -e

          cat "$LOG"
          test "$STATUS" -eq 0
          grep -q "UR_RESTART_PROBE results_restart1_applied=1 immediate_equal=1 sram_progression_unchanged=1 persistent_cart_preserved=1 input=gamepad-menu" "$LOG"
          grep -q "UR_RESTART_PROBE results_restart2_applied=1 immediate_equal=1 sram_progression_unchanged=1 persistent_cart_preserved=1 input=keyboard-hotkey" "$LOG"
          grep -q "UR_RESTART_RESULTS PASS results_surface=1 player_input_dispatch=1 persistent_sram_preserved=1 repeated_restart_equal=1 window=60" "$LOG"
          ! grep -q "UR_RESTART_PROBE FAIL" "$LOG"

      - name: Upload restart acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-race-restart-acceptance
          path: |
            ${{ runner.temp }}/modern-restart-acceptance.log
            ${{ runner.temp }}/modern-restart-results-acceptance.log
          if-no-files-found: warn
          retention-days: 7

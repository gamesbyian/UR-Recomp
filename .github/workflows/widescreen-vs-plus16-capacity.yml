name: VS Widescreen +16 capacity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/widescreen-vs-plus16-capacity.yml"
      - "tools/apply_native_widescreen_hook.py"
      - "tests/unit/test_apply_native_widescreen_hook.py"
      - "tools/seed_native_widescreen_aot.py"
      - "tools/patch_widescreen_probe_host.py"
      - "tools/summarize_paired_player_slots.py"
      - "tests/input/vs-first-race.input"
      - "tests/input/vs-first-race-observe.script"
      - "analysis/widescreen-vs-plus16-capacity-evidence.json"
      - "analysis/widescreen-policy.yml"
      - "docs/WIDESCREEN-RECONNAISSANCE.md"
      - "docs/WORK-QUEUE.md"

concurrency:
  group: widescreen-vs-plus16-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Run focused hook tests
        run: python3 -m unittest tests.unit.test_apply_native_widescreen_hook

      - name: Generate hooked native target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
            --rom "$ROM" --dir "$ROOT" --name "Uniracers" --players 2 --yes \
            --no-ci --no-fetch-boxart --no-recomp-ui --no-netplay --no-github \
            --no-submodules --generate --no-build
          PROJECT="$ROOT/UniracersSNESRecomp"
          python3 tools/seed_native_widescreen_aot.py "$PROJECT/recomp"
          python3 "$FRAMEWORK/snesrecomp_cli.py" generate \
            --rom "$ROM" --project-root "$PROJECT" --cfg-dir recomp \
            --out-dir src/gen --funcs-h recomp/funcs.h --cfg-roots
          python3 tools/patch_widescreen_probe_host.py "$PROJECT/src/main.c"
          python3 tools/apply_native_widescreen_hook.py "$PROJECT/src/gen"
          python3 "$GITHUB_WORKSPACE/tools/bootstrap_toolchain.py" --offline --tool sdl3 --clone-only
          cmake -S "$PROJECT" -B "$PROJECT/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 -DSNESRECOMP_SDL3_FETCH=ON -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$PROJECT/build" -j2
          test -x "$PROJECT/build/UniracersSNESRecomp"

      - name: Run matched stock and +16 VS fixtures
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/native/UniracersSNESRecomp"
          EXE="$PROJECT/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          INPUT="$GITHUB_WORKSPACE/tests/input/vs-first-race.input"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/vs-first-race-observe.script"
          ROOT="$RUNNER_TEMP/widescreen-vs-plus16"
          mkdir -p "$ROOT"
          for margin in 0 16; do
            OUT="$ROOT/$margin"
            mkdir -p "$OUT/dumps" "$OUT/frames"
            rm -rf "$PROJECT/build/saves"
            SNESRECOMP_INPUT_FILE="$INPUT" \
            SNESRECOMP_DUMP_DIR="$OUT/dumps" \
            SNESRECOMP_FRAMEDUMP_PIXELS=1 \
            SNESRECOMP_FRAMEDUMP_START=1340 \
            SNESRECOMP_FRAMEDUMP_END=1340 \
            URRECOMP_WS_MARGIN="$margin" \
            URRECOMP_WS_NATIVE_TRACE=1 \
            SDL_AUDIODRIVER=dummy \
              timeout 180s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              --framedump "$OUT/frames" >"$OUT/run.log" 2>&1
            test -s "$OUT/dumps/vs-race-1240.wram.bin"
            test -s "$OUT/dumps/vs-race-1620.wram.bin"
            test -s "$OUT/frames/frame_001340.bmp"
          done
          grep -q "URWS_VS_PREP margin=16 player=1" "$ROOT/16/run.log"
          grep -q "URWS_VS_PREP margin=16 player=2" "$ROOT/16/run.log"
          grep -q "URWS_VS_MATERIALIZER margin=16 player=1 calibrated=1" "$ROOT/16/run.log"
          grep -q "URWS_VS_MATERIALIZER margin=16 player=2 calibrated=1" "$ROOT/16/run.log"
          if grep -q "URWS_VS_MATERIALIZER margin=16 player=1 calibrated=0" "$ROOT/16/run.log"; then
            echo "P1 live-course calibration missed at least one accepted +8 payload" >&2
            exit 1
          fi
          if grep -q "URWS_VS_MATERIALIZER margin=16 player=2 calibrated=0" "$ROOT/16/run.log"; then
            echo "P2 live-course calibration missed at least one accepted +8 payload" >&2
            exit 1
          fi
          grep -q "URWS_VS_SHADOW_EXT provider=course-runtime margin=16 player=1 depth=1" "$ROOT/16/run.log"
          grep -q "URWS_VS_SHADOW_EXT provider=course-runtime margin=16 player=2 depth=1" "$ROOT/16/run.log"

      - name: Compare protected state and geometry
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/widescreen-vs-plus16"
          mkdir -p analysis/generated
          CHECKPOINTS=(
            --checkpoint vs-race-1240
            --checkpoint vs-race-1340
            --checkpoint vs-race-1440
            --checkpoint vs-race-1620
          )
          for margin in 0 16; do
            python3 tools/summarize_paired_player_slots.py \
              "$ROOT/$margin/dumps" "${CHECKPOINTS[@]}" \
              --json-out "$ROOT/$margin/state.json" >"$ROOT/$margin/state.txt"
          done

          python3 - "$ROOT/0/state.json" "$ROOT/16/state.json" \
            "$ROOT/0/frames/frame_001340.bmp" "$ROOT/16/frames/frame_001340.bmp" \
            analysis/generated/widescreen-vs-plus16-capacity.json <<'PY'
          import json, pathlib, struct, sys

          control=json.loads(pathlib.Path(sys.argv[1]).read_text())
          wide=json.loads(pathlib.Path(sys.argv[2]).read_text())
          protected=("slot1","slot2","race_progress","camera_and_viewport")
          rows=[]
          accepted=True
          for checkpoint in control:
              diffs={}
              for section in protected:
                  if control[checkpoint][section] != wide[checkpoint][section]:
                      diffs[section]={
                          "control":control[checkpoint][section],
                          "plus16":wide[checkpoint][section],
                      }
              rows.append({"checkpoint":checkpoint,"protected_differences":diffs})
              accepted = accepted and not diffs

          def dims(path):
              data=pathlib.Path(path).read_bytes()
              return (
                  struct.unpack_from("<i",data,18)[0],
                  abs(struct.unpack_from("<i",data,22)[0]),
              )
          control_dim=dims(sys.argv[3]); wide_dim=dims(sys.argv[4])
          geometry_ok=control_dim==(256,224) and wide_dim==(288,224)
          out={
              "schema_version":1,
              "fixture":"vs-first-race",
              "candidate_margin_pixels_per_side":16,
              "control_frame_geometry":control_dim,
              "plus16_frame_geometry":wide_dim,
              "protected_sections":list(protected),
              "rows":rows,
              "protected_state_equal_at_all_checkpoints":accepted,
              "geometry_accepted":geometry_ok,
              "capacity_classification":(
                  "vs-plus16-live-course-capacity-proven"
                  if accepted and geometry_ok
                  else "vs-plus16-capacity-rejected"
              ),
          }
          pathlib.Path(sys.argv[5]).write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          if not accepted:
              raise SystemExit("VS +16 protected state diverged")
          if not geometry_ok:
              raise SystemExit("VS +16 host geometry diverged")
          PY

      - name: Verify retained +16 capacity evidence
        run: |
          python3 - "$RUNNER_TEMP/widescreen-vs-plus16/16/run.log" <<'PY'
          import json, pathlib, re, sys
          retained=json.loads(pathlib.Path("analysis/widescreen-vs-plus16-capacity-evidence.json").read_text())
          generated=json.loads(pathlib.Path("analysis/generated/widescreen-vs-plus16-capacity.json").read_text())
          log=pathlib.Path(sys.argv[1]).read_text(errors="replace")

          assert generated["capacity_classification"] == retained["capacity_classification"]
          assert generated["protected_state_equal_at_all_checkpoints"] is retained["protected_state_equal_at_all_checkpoints"]
          assert generated["control_frame_geometry"] == retained["control_frame_geometry"]
          assert generated["plus16_frame_geometry"] == retained["plus16_frame_geometry"]

          for player in (1,2):
              vals=re.findall(
                  rf"URWS_VS_MATERIALIZER margin=16 player={player} calibrated=(\d)",
                  log,
              )
              shadows=len(re.findall(
                  rf"URWS_VS_SHADOW_EXT provider=course-runtime margin=16 player={player} depth=1",
                  log,
              ))
              assert vals
              assert "0" not in vals
              assert len(vals) == retained["calibration"][f"player{player}_events"]
              assert vals.count("1") == retained["calibration"][f"player{player}_matches"]
              assert shadows == retained["plus16_host_shadow_events"][f"player{player}"]

          assert retained["guest_descriptor_promotion"] is False
          assert retained["full_authentic_16x9_ready"] is False
          print("VS_PLUS16_RETAINED_EVIDENCE_MATCH")
          PY

      - name: Upload compact +16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widescreen-vs-plus16-capacity
          path: |
            analysis/generated/widescreen-vs-plus16-capacity.json
            ${{ runner.temp }}/widescreen-vs-plus16/0/state.json
            ${{ runner.temp }}/widescreen-vs-plus16/16/state.json
            ${{ runner.temp }}/widescreen-vs-plus16/0/run.log
            ${{ runner.temp }}/widescreen-vs-plus16/16/run.log
            ${{ runner.temp }}/widescreen-vs-plus16/0/frames/frame_001340.bmp
            ${{ runner.temp }}/widescreen-vs-plus16/16/frames/frame_001340.bmp
          if-no-files-found: warn
          retention-days: 7

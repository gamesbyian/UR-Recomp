name: Baldosa 2014 complete-Zoo frame-dense transplant

on:
  pull_request:
    paths:
      - ".github/workflows/baldosa-2014-zoo-scene.yml"
      - "tools/baldosa_2014_zoo_scene_route.py"
      - "tools/baldosa_2014_zoo_calibrated_input.py"
      - "tools/baldosa_qa_dense_scene_input_patch.py"
      - "tools/baldosa_2014_zoo_scene_report.py"
      - "tools/baldosa_2014_zoo_boundary_report.py"
      - "tools/baldosa_2014_zoo_phase_equivalence.py"
      - "tools/instrument_snesref_zoo_menu_writes.py"
      - "tools/baldosa_zoo_opcode_writer_report.py"
      - "tools/baldosa_zoo_native_write_chronology.py"
      - "tools/baldosa_qa_native_writer_window_patch.py"
      - "tools/bootstrap_toolchain.py"
      - "tools/toolchain-entries/snes9x-libretro.json"
      - "tests/unit/test_baldosa_2014_zoo_scene_route.py"
      - "tests/unit/test_baldosa_2014_zoo_scene_report.py"
      - "tests/unit/test_baldosa_2014_zoo_boundary_report.py"
      - "tests/unit/test_baldosa_2014_zoo_phase_equivalence.py"
      - "tests/unit/test_baldosa_zoo_opcode_writer_report.py"
      - "tests/unit/test_baldosa_zoo_native_write_chronology.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baldosa-2014-zoo-scene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrated-original-native-zoo:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact original USA fixtures
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out pinned Baldosa AOT guest and fork framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Install original/core build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsdl2-dev libgl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgles-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev xvfb x11-utils

      - name: Verify exact USA ROM and build source-backed scene calibration scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          cmp baldosa/tests/routes/zoomzoo_1p.txt \
              reference/imported/reverse-engineering/baldosa-uniracers-recomp/tests/routes/zoomzoo_1p.txt
          mkdir -p "$RUNNER_TEMP/zoo-scene"
          ROOT="$RUNNER_TEMP/zoo-scene"
          python3 tools/baldosa_2014_zoo_scene_route.py \
            --upstream baldosa/tests/routes/zoomzoo_1p.txt \
            --out "$ROOT/replay.txt" \
            --calibration-out "$ROOT/calibration.txt" \
            --boundary-out "$ROOT/boundary.txt" \
            --report "$ROOT/input-provenance.json"
          python3 tools/extract_smv_input.py \
            reference/imported/tas-bots/dessyreqt-4250-submission.smv \
            --input-out "$ROOT/historical-input" \
            --sram-out "$ROOT/movie.srm" --sram-size 8192 \
            --json-out "$ROOT/movie-metadata.json"
          grep -v '^turbo' "$ROOT/calibration.txt" > "$ROOT/original-calibration.txt"
          grep -v '^turbo' "$ROOT/replay.txt" > "$ROOT/original-replay.txt"
          grep -v '^turbo' "$ROOT/boundary.txt" > "$ROOT/original-boundary.txt"

      - name: Build authoritative original Snes9x and pinned Baldosa snesref wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          cmake -S baldosa/snesrecomp/tools/snesref \
                -B "$RUNNER_TEMP/zoo-snesref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/zoo-snesref" -j2

      - name: Calibrate independent first Zoo-active guest frame in original Snes9x
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/zoo-scene"
          mkdir -p "$ROOT/original-calibration"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$ROOT/movie.srm" \
          SNESREF_SCRIPT="$ROOT/original-calibration.txt" \
          SNESREF_DUMP_DIR="$ROOT/original-calibration" \
            timeout 100 "$RUNNER_TEMP/zoo-snesref/snesref" \
              "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
              "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              > "$ROOT/original-calibration.log" 2>&1
          grep 'dump scene-entered' "$ROOT/original-calibration.log"
          test -s "$ROOT/original-calibration/scene-entered.wram.bin"

      - name: Stage QA-only frame-accurate host input file shim in disposable Baldosa checkout
        shell: bash
        run: |
          set -euo pipefail
          # No modification to the project's checked-in SNESRecomp gitlink,
          # guest code, Modern UI, renderer or gameplay source.
          python3 tools/baldosa_qa_dense_scene_input_patch.py \
            --host baldosa/snesrecomp/runner/src/desktop/host_main.c
          python3 tools/baldosa_qa_native_writer_window_patch.py \
            --framework-cpu-state baldosa/snesrecomp/runner/src/cpu_state.c
          git -C baldosa/snesrecomp diff --check
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          test -x baldosa/build/UniracersSNESRecomp
          if [ ! -f baldosa/build/config.ini ]; then
            printf '%s\n' '[Sound]' 'EnableAudio = 0' > baldosa/build/config.ini
          fi

      - name: Calibrate Baldosa AOT then replay identical frame-dense original input in BOTH guests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/zoo-scene"
          Xvfb :99 -screen 0 1280x720x24 -ac > "$ROOT/xvfb.log" 2>&1 &
          export DISPLAY=:99
          for _ in 1 2 3 4 5; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null
          cat > "$ROOT/x11-wrap" <<'SH'
          #!/bin/sh
          export SDL_VIDEODRIVER=x11
          exec "$BALDOSA_REAL_BIN" "$@"
          SH
          chmod +x "$ROOT/x11-wrap"
          export SNESRECOMP_ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          export BIN="$ROOT/x11-wrap" SRM="$ROOT/movie.srm"
          export SDL_AUDIODRIVER=dummy PIXELS=0 KEEP_WRAM=0 TMO=130
          unset UR_QA_SCENE_INPUT_FILE || true
          bash baldosa/tools/run_route.sh "$ROOT/calibration.txt" "$ROOT/native-calibration"
          grep 'dump scene-entered' "$ROOT/native-calibration/log.txt"
          test -s "$ROOT/native-calibration/dump/scene-entered.wram.bin"

          python3 tools/baldosa_2014_zoo_calibrated_input.py \
            --original-log "$ROOT/original-calibration.log" \
            --native-log "$ROOT/native-calibration/log.txt" \
            --source-report "$ROOT/input-provenance.json" \
            --out-original "$ROOT/original-input.txt" \
            --out-native "$ROOT/native-input.txt" \
            --report "$ROOT/input-phase-report.json"

          mkdir -p "$ROOT/original"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$ROOT/movie.srm" \
          SNESREF_INPUT_FILE="$ROOT/original-input.txt" \
          SNESREF_SCRIPT="$ROOT/original-replay.txt" \
          SNESREF_DUMP_DIR="$ROOT/original" \
            timeout 130 "$RUNNER_TEMP/zoo-snesref/snesref" \
              "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
              "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              > "$ROOT/original.log" 2>&1
          tail -n 18 "$ROOT/original.log"
          test -s "$ROOT/original/scene-entered.wram.bin"
          test -s "$ROOT/original/result-stable-candidate.wram.bin"

          export UR_QA_SCENE_INPUT_FILE="$ROOT/native-input.txt"
          bash baldosa/tools/run_route.sh "$ROOT/replay.txt" "$ROOT/native"
          tail -n 18 "$ROOT/native/log.txt"
          test -s "$ROOT/native/dump/scene-entered.wram.bin"
          test -s "$ROOT/native/dump/result-stable-candidate.wram.bin"

          python3 tools/baldosa_2014_zoo_scene_report.py \
            --original "$ROOT/original" --native "$ROOT/native/dump" \
            --source-report "$ROOT/input-provenance.json" \
            --calibration-report "$ROOT/input-phase-report.json" \
            --original-log "$ROOT/original.log" --native-log "$ROOT/native/log.txt" \
            --rom reference/roms/retail/Uniracers_USA.sfc --with-ppu \
            --out "$ROOT/paired-result.json"
          cat "$ROOT/paired-result.json" >> "$GITHUB_STEP_SUMMARY"
          echo "IMPORTANT: displayed PPU and active course checks remain candidate diagnostics; independent QA review is required. No 45-course credit issued." >> "$GITHUB_STEP_SUMMARY"

          # Controlled host-side input-latch hypotheses: keep original reference
          # untouched, change only native input-file absolute frame origin.
          # Crucially build/ROM/SRAM and original replay are reused, so one
          # stage tests BOTH -1/+1 instead of recompiling 3 separate jobs.
          for phase in -1 1; do
            python3 tools/baldosa_2014_zoo_calibrated_input.py \
              --original-log "$ROOT/original-calibration.log" \
              --native-log "$ROOT/native-calibration/log.txt" \
              --source-report "$ROOT/input-provenance.json" \
              --native-phase "$phase" \
              --out-original "$ROOT/original-input-phase-$phase.txt" \
              --out-native "$ROOT/native-input-phase-$phase.txt" \
              --report "$ROOT/input-phase-$phase.json"
            export UR_QA_SCENE_INPUT_FILE="$ROOT/native-input-phase-$phase.txt"
            if bash baldosa/tools/run_route.sh "$ROOT/replay.txt" "$ROOT/native-phase-$phase" &&
                test -s "$ROOT/native-phase-$phase/dump/result-stable-candidate.wram.bin"; then
              python3 tools/baldosa_2014_zoo_scene_report.py \
                --original "$ROOT/original" \
                --native "$ROOT/native-phase-$phase/dump" \
                --source-report "$ROOT/input-provenance.json" \
                --calibration-report "$ROOT/input-phase-$phase.json" \
                --original-log "$ROOT/original.log" \
                --native-log "$ROOT/native-phase-$phase/log.txt" \
                --rom reference/roms/retail/Uniracers_USA.sfc --with-ppu \
                --out "$ROOT/paired-result-phase-$phase.json"
            else
              echo "native phase $phase: did not produce settled full result" >&2
              echo "native phase $phase did not finish; retained log is negative evidence" \
                > "$ROOT/paired-result-phase-$phase.failure.txt"
            fi
          done

          python3 - "$ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          rows = []
          for phase in (0, -1, 1):
              p = root / ("paired-result.json" if phase == 0 else
                          f"paired-result-phase-{phase}.json")
              if p.is_file():
                  data = json.loads(p.read_text())
                  timing = data["observed_result_frame_phases"]
                  ppu = data["ppu_settled_result"]
                  rows.append({
                      "native_input_phase": phase,
                      "reached_both_result_screens": (
                          data["original_reached_stable_circuit_result_state"] and
                          data["baldosa_reached_stable_circuit_result_state"]),
                      "active_named_fields_equal": data["active_sample_field_agreement"],
                      "result_onset_original_minus_native_relative_frames":
                          timing["onset_guest_relative_delta"],
                      "displayed_original_native_result_equal":
                          ppu["ppu_result_candidate"],
                      "contact_disagreement_first_stage":
                          data["contact_disagreement_first_stage"],
                      "first_sampled_difference": data["first_semantic_difference"],
                      "credit": 0,
                  })
              else:
                  rows.append({"native_input_phase": phase,
                               "status": "no_settled_native_capture",
                               "credit": 0})
          evidence = {
              "schema": "UR-QA01-ZOO-NATIVE-LATCH-PHASE/1",
              "reference_input_phase": 0,
              "native_phases_exhaustively_tested": [-1, 0, 1],
              "same_pinned_build_original_movie_sram_and_course": True,
              "results": rows,
              "admitted_complete_event_count": 0,
              "warning": "This is a controlled input-latch intervention, not"
                         " a rule change or license to select a flattering phase.",
          }
          (root / "phase-discriminator.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY
          cat "$ROOT/phase-discriminator.json" >> "$GITHUB_STEP_SUMMARY"

          # Independent FIXED scene-relative observation. Neither host sees
          # a result-menu 'until' here, eliminating script polling as the
          # explanation unless both frame dumps show equal true transition.
          mkdir -p "$ROOT/original-boundary"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$ROOT/movie.srm" \
          SNESREF_INPUT_FILE="$ROOT/original-input.txt" \
          SNESREF_SCRIPT="$ROOT/original-boundary.txt" \
          SNESREF_DUMP_DIR="$ROOT/original-boundary" \
            timeout 130 "$RUNNER_TEMP/zoo-snesref/snesref" \
              "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
              "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              > "$ROOT/original-boundary.log" 2>&1
          test -s "$ROOT/original-boundary/boundary-05163.wram.bin"
          export UR_QA_SCENE_INPUT_FILE="$ROOT/native-input.txt"
          # Capture native guest writer/helper scopes only in the existing
          # one-run pinned Baldosa boundary replay (no new recompilation).
          # The framework logger has no CPU-PC promise for native AOT scopes.
          NATIVE_ENTRY="$(python3 -c 'import sys; sys.path.insert(0, "tools"); from baldosa_2014_zoo_calibrated_input import guest_scene_entry; print(guest_scene_entry(open(sys.argv[1]).read()))' "$ROOT/native-calibration/log.txt")"
          export SNESRECOMP_WLOG_ADDR="008B:00CE:$ROOT/native-menu-writes.log"
          export SNESRECOMP_WLOG_ADDR_CAP=100000
          export UR_QA_ZOO_NATIVE_WRITE_FIRST="$((NATIVE_ENTRY + 5152))"
          export UR_QA_ZOO_NATIVE_WRITE_LAST="$((NATIVE_ENTRY + 5165))"
          bash baldosa/tools/run_route.sh "$ROOT/boundary.txt" "$ROOT/native-boundary"
          unset SNESRECOMP_WLOG_ADDR SNESRECOMP_WLOG_ADDR_CAP UR_QA_ZOO_NATIVE_WRITE_FIRST UR_QA_ZOO_NATIVE_WRITE_LAST
          test -s "$ROOT/native-menu-writes.log"
          test -s "$ROOT/native-boundary/dump/boundary-05163.wram.bin"
          python3 tools/baldosa_2014_zoo_boundary_report.py \
            --original "$ROOT/original-boundary" \
            --native "$ROOT/native-boundary/dump" \
            --original-log "$ROOT/original-boundary.log" \
            --native-log "$ROOT/native-boundary/log.txt" \
            --out "$ROOT/fixed-boundary-report.json"
          python3 tools/baldosa_2014_zoo_phase_equivalence.py \
            --original "$ROOT/original-boundary" \
            --native "$ROOT/native-boundary/dump" \
            --boundary-report "$ROOT/fixed-boundary-report.json" \
            --out "$ROOT/adjacent-memory-phase-report.json"
          NATIVE_ENTRY="$(python3 -c 'import sys; sys.path.insert(0, "tools"); from baldosa_2014_zoo_calibrated_input import guest_scene_entry; print(guest_scene_entry(open(sys.argv[1]).read()))' "$ROOT/native-calibration/log.txt")"
          python3 tools/baldosa_zoo_native_write_chronology.py \
            --native-writes "$ROOT/native-menu-writes.log" \
            --native-host-log "$ROOT/native-boundary/log.txt" \
            --native "$ROOT/native-boundary/dump" \
            --original "$ROOT/original-boundary" \
            --native-scene-entry "$NATIVE_ENTRY" \
            --out "$ROOT/native-menu-writer-report.json"
          cat "$ROOT/adjacent-memory-phase-report.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ROOT/native-menu-writer-report.json" >> "$GITHUB_STEP_SUMMARY"
          # Keep large fixed-boundary raw rows in the artifact; show the
          # compact adjacent-phase finding prominently in job summary.
          echo "Fixed-frame contact and result-onset differences are diagnostic, not automatic course acceptance." >> "$GITHUB_STEP_SUMMARY"

      - name: Trace precise original-menu writer opcode PCs in a disposable reference rebuild
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/zoo-scene"
          # The pinned uninstrumented comparison above must succeed first.
          # Only change the disposable original Snes9x core AFTER its full
          # 1P result/memory parity proof. Baldosa and the USA game ROM stay
          # untouched. Repeat the same reference route and compare dumps.
          python3 tools/instrument_snesref_zoo_menu_writes.py \
            .tools/src/snes9x-libretro/cpuexec.cpp
          make -C .tools/src/snes9x-libretro/libretro -j2
          ORIGINAL_ENTRY="$(python3 -c 'import sys; sys.path.insert(0, "tools"); from baldosa_2014_zoo_calibrated_input import guest_scene_entry; print(guest_scene_entry(open(sys.argv[1]).read()))' "$ROOT/original-calibration.log")"
          export UR_QA_ZOO_TRACE_FIRST="$((ORIGINAL_ENTRY + 5152))"
          export UR_QA_ZOO_TRACE_LAST="$((ORIGINAL_ENTRY + 5165))"
          echo "Scoped original guest CPU writer trace: absolute ${UR_QA_ZOO_TRACE_FIRST}..${UR_QA_ZOO_TRACE_LAST}"
          mkdir -p "$ROOT/original-pc"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SRAM_IN="$ROOT/movie.srm" \
          SNESREF_INPUT_FILE="$ROOT/original-input.txt" \
          SNESREF_SCRIPT="$ROOT/original-boundary.txt" \
          SNESREF_DUMP_DIR="$ROOT/original-pc" \
            timeout 130 "$RUNNER_TEMP/zoo-snesref/snesref" \
              "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
              "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              > "$ROOT/original-pc.log" 2>&1
          grep -m 2 'ZOOPCWRITE f=' "$ROOT/original-pc.log"
          for frame in 05155 05156 05157 05158 05163 05175; do
            cmp "$ROOT/original-boundary/boundary-${frame}.wram.bin" \
                "$ROOT/original-pc/boundary-${frame}.wram.bin"
          done
          python3 tools/baldosa_zoo_opcode_writer_report.py \
            --log "$ROOT/original-pc.log" \
            --original "$ROOT/original-boundary" \
            --scene-entry-frame "$ORIGINAL_ENTRY" \
            --out "$ROOT/original-menu-opcode-writers.json"
          cat "$ROOT/original-menu-opcode-writers.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Captured original opcode scopes are causal leads, NOT an independently proven native CPU fault or a completed-course admission." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain independent guest evidence but not copyrighted movie/SRAM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baldosa-zoo-2014-frame-dense-guest-parity
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/zoo-scene/input-provenance.json
            ${{ runner.temp }}/zoo-scene/input-phase-report.json
            ${{ runner.temp }}/zoo-scene/paired-result.json
            ${{ runner.temp }}/zoo-scene/phase-discriminator.json
            ${{ runner.temp }}/zoo-scene/fixed-boundary-report.json
            ${{ runner.temp }}/zoo-scene/adjacent-memory-phase-report.json
            ${{ runner.temp }}/zoo-scene/original-menu-opcode-writers.json
            ${{ runner.temp }}/zoo-scene/native-menu-writer-report.json
            ${{ runner.temp }}/zoo-scene/native-menu-writes.log
            ${{ runner.temp }}/zoo-scene/original-pc.log
            ${{ runner.temp }}/zoo-scene/original-boundary.log
            ${{ runner.temp }}/zoo-scene/native-boundary/log.txt
            ${{ runner.temp }}/zoo-scene/original-boundary/*.wram.bin
            ${{ runner.temp }}/zoo-scene/original-boundary/*.regs.json
            ${{ runner.temp }}/zoo-scene/original-boundary/*.vram.bin
            ${{ runner.temp }}/zoo-scene/original-boundary/*.cgram.bin
            ${{ runner.temp }}/zoo-scene/native-boundary/dump/*.wram.bin
            ${{ runner.temp }}/zoo-scene/native-boundary/dump/*.regs.json
            ${{ runner.temp }}/zoo-scene/native-boundary/dump/*.vram.bin
            ${{ runner.temp }}/zoo-scene/native-boundary/dump/*.cgram.bin
            ${{ runner.temp }}/zoo-scene/input-phase-*.json
            ${{ runner.temp }}/zoo-scene/paired-result-phase-*.json
            ${{ runner.temp }}/zoo-scene/paired-result-phase-*.failure.txt
            ${{ runner.temp }}/zoo-scene/native-phase-*/log.txt
            ${{ runner.temp }}/zoo-scene/native-phase-*/dump/*.wram.bin
            ${{ runner.temp }}/zoo-scene/native-phase-*/dump/*.regs.json
            ${{ runner.temp }}/zoo-scene/native-phase-*/dump/*.vram.bin
            ${{ runner.temp }}/zoo-scene/native-phase-*/dump/*.cgram.bin
            ${{ runner.temp }}/zoo-scene/original.log
            ${{ runner.temp }}/zoo-scene/original-calibration.log
            ${{ runner.temp }}/zoo-scene/native-calibration/log.txt
            ${{ runner.temp }}/zoo-scene/native/log.txt
            ${{ runner.temp }}/zoo-scene/original/*.wram.bin
            ${{ runner.temp }}/zoo-scene/native/dump/*.wram.bin
            ${{ runner.temp }}/zoo-scene/original/*.fb.bmp
            ${{ runner.temp }}/zoo-scene/original/*.vram.bin
            ${{ runner.temp }}/zoo-scene/original/*.cgram.bin
            ${{ runner.temp }}/zoo-scene/original/*.oam.bin
            ${{ runner.temp }}/zoo-scene/original/*.info.json
            ${{ runner.temp }}/zoo-scene/original/*.regs.json
            ${{ runner.temp }}/zoo-scene/native/dump/*.regs.json
            ${{ runner.temp }}/zoo-scene/native/dump/*.fb.bmp
            ${{ runner.temp }}/zoo-scene/native/dump/*.vram.bin
            ${{ runner.temp }}/zoo-scene/native/dump/*.cgram.bin
            ${{ runner.temp }}/zoo-scene/native/dump/*.oam.bin

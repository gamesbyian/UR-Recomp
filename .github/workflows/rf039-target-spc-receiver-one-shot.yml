# One-shot genuine original/native RF039. Source-registered original SPC F6/F7 vs native queue/apply/read at target 6091. Remove immediately after run queues.
name: RF039 Target SPC Receiver Read-Only Witness
on:
  push:
    branches:
      - research/rf039-zoo-6091-spc-receiver-20261017
permissions:
  contents: read
concurrency:
  group: rf039-target-spc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-zoo:
    uses: ./.github/workflows/qa01-event-campaign.yml
    with:
      selected: zoom-zoo
      zoo_race_mesh: true
      zoo_dp_window: true
      zoo_terminal_phase: true
      source_followthrough: true
      zoo_next_bowl: true
      qa01_cold_guest_reload: true
      baldosa_refresh_beam_rate: true
      baldosa_io_clock_order: true
      baldosa_spc_reference_rate: true
      baldosa_dp_pointer_once: true
      baldosa_hdma_cpu_stall: true
      baldosa_spc_interrupt_stage: true
      qa01_rf034_spc_boundary: true

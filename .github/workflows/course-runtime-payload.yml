name: course runtime payload probe

on:
  workflow_dispatch:concurrency:
  group: course-runtime-payload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build pinned Snes9x and snesref
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2
          test -x "$RUNNER_TEMP/snesref-build/snesref"

      - name: Capture settled Dragster WRAM
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/snesref-build/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/course-load-timeline.script"
          DUMPS="$RUNNER_TEMP/course-runtime-dumps"
          LOG="$RUNNER_TEMP/course-runtime.log"
          mkdir -p "$DUMPS"

          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$DUMPS" \
            "$EXE" "$CORE" "$ROM" >"$LOG" 2>&1
          cat "$LOG"
          test -s "$DUMPS/race-active.wram.bin"

      - name: Match decoded payloads across frontend-to-race timeline
        shell: bash
        run: |
          set -euo pipefail
          : >"$RUNNER_TEMP/course-runtime-timeline.txt"
          for checkpoint in \
            tracks-ready after-track-confirm now-playing-ready \
            post-confirm-000 post-confirm-001 post-confirm-002 post-confirm-004 \
            post-confirm-008 post-confirm-016 post-confirm-032 post-confirm-036 \
            post-confirm-040 post-confirm-041 post-confirm-042 post-confirm-043 \
            post-confirm-044 post-confirm-045 post-confirm-046 post-confirm-047 \
            post-confirm-048 post-confirm-052 post-confirm-056 post-confirm-060 post-confirm-064 \
            post-confirm-096 post-confirm-128 post-confirm-144 race-active
          do
            echo "== $checkpoint ==" | tee -a "$RUNNER_TEMP/course-runtime-timeline.txt"
            python3 tools/probe_runtime_course_payload.py \
              "reference/roms/retail/Uniracers_USA.sfc" \
              "$RUNNER_TEMP/course-runtime-dumps/$checkpoint.wram.bin" \
              --focus-stream 1 \
              --limit 40 \
              --json-out "$RUNNER_TEMP/course-runtime-$checkpoint.json" \
              | tee -a "$RUNNER_TEMP/course-runtime-timeline.txt"
          done

      - name: Capture second-tour first-event WRAM
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/snesref-build/snesref"
          CORE="$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/course-load-timeline-tour2.script"
          DUMPS="$RUNNER_TEMP/course-runtime-tour2-dumps"
          LOG="$RUNNER_TEMP/course-runtime-tour2.log"
          mkdir -p "$DUMPS"

          SNESREF_HEADLESS=1 \
          SNESREF_FAST=1 \
          SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$SCRIPT" \
          SNESREF_DUMP_DIR="$DUMPS" \
            "$EXE" "$CORE" "$ROM" >"$LOG" 2>&1
          cat "$LOG"
          test -s "$DUMPS/race-active.wram.bin"

      - name: Compare second-tour tail cursor
        shell: bash
        run: |
          set -euo pipefail
          : >"$RUNNER_TEMP/course-runtime-tour2-timeline.txt"
          for checkpoint in \
            tours-ready tour2-selected tracks-ready now-playing-ready \
            post-confirm-040 post-confirm-041 post-confirm-042 post-confirm-043 \
            post-confirm-044 post-confirm-045 post-confirm-046 post-confirm-047 \
            post-confirm-048 race-active
          do
            echo "== $checkpoint ==" | tee -a "$RUNNER_TEMP/course-runtime-tour2-timeline.txt"
            python3 tools/probe_runtime_course_payload.py \
              "reference/roms/retail/Uniracers_USA.sfc" \
              "$RUNNER_TEMP/course-runtime-tour2-dumps/$checkpoint.wram.bin" \
              --focus-stream 11 \
              --limit 40 \
              --json-out "$RUNNER_TEMP/course-runtime-tour2-$checkpoint.json" \
              | tee -a "$RUNNER_TEMP/course-runtime-tour2-timeline.txt"
          done

          python3 - "$RUNNER_TEMP/course-runtime-tour2-race-active.json" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          best=d["best_match"]
          cur=d["focus_cursor"]
          print("best stream:", best["stream"], "equal fraction:", best["equal_fraction"])
          print("focus cursor:", cur)
          if best["stream"] != 11:
              raise SystemExit(
                  f"second-tour route did not load expected stream 11; best={best['stream']}"
              )
          PY

      - name: Persist second-tour cursor result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/course-runtime-tour2-race-active.json"
          out="analysis/generated/course-runtime-tour2-tail-cursor.json"
          if [ ! -s "$src" ]; then
            echo "no second-tour race-active result available"
            exit 0
          fi
          mkdir -p analysis/generated
          python3 - "$src" "$out" <<'PY'
          import json, pathlib, sys
          src=pathlib.Path(sys.argv[1])
          out=pathlib.Path(sys.argv[2])
          d=json.loads(src.read_text())
          payload={
              "expected_stream": 11,
              "best_stream": d["best_match"]["stream"],
              "best_equal_fraction": d["best_match"]["equal_fraction"],
              "focus_cursor": d.get("focus_cursor"),
              "live_header_first_16": d.get("live_header_first_16"),
              "runtime_racer_state": d.get("runtime_racer_state"),
          }
          out.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY
          git add "$out"
          if git diff --cached --quiet; then
            echo "second-tour cursor result already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record second-tour course tail cursor"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload course runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-course-runtime-payload
          path: |
            ${{ runner.temp }}/course-runtime.log
            ${{ runner.temp }}/course-runtime-timeline.txt
            ${{ runner.temp }}/course-runtime-*.json
            ${{ runner.temp }}/course-runtime-dumps/*.wram.bin
            ${{ runner.temp }}/course-runtime-tour2.log
            ${{ runner.temp }}/course-runtime-tour2-timeline.txt
            ${{ runner.temp }}/course-runtime-tour2-*.json
            ${{ runner.temp }}/course-runtime-tour2-dumps/*.wram.bin
            analysis/generated/course-runtime-tour2-tail-cursor.json
          if-no-files-found: error
          retention-days: 7

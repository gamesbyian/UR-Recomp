name: Read-only account Actions artifact storage census
on:
  # Manual-first; only changes to this small reporting utility qualify for
  # the automatic self-test. Normal product PRs never dispatch the census.
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/actions-artifact-census.yml'
      - 'tools/actions_storage_inventory.py'
      - 'tests/unit/test_actions_storage_inventory.py'

concurrency:
  group: artifact-census-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    # Do not run PR source with a credential for a fork.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline inventory contract tests
        run: python3 -m unittest discover -s tests/unit -p test_actions_storage_inventory.py -v
      - name: Collect complete snapshots independently for each accessible repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage-census"
          python3 - <<'PY' > "$RUNNER_TEMP/storage-census/repos.txt"
          from tools.actions_storage_inventory import repositories
          print(*repositories("gamesbyian"), sep="\n")
          PY
          while IFS= read -r repo; do
            name="$(basename "$repo")"
            echo "::group::Inspect $repo"
            # A completed 6,626-object UR read-only audit required 25/page
            # after occasional incomplete 100-row GitHub API responses.
            census_args=()
            if [[ "$repo" == "gamesbyian/UR-Recomp" ]]; then
              census_args=(--page-size 25 --max-pages 400 --recheck-first-page)
            fi
            if python3 tools/actions_storage_inventory.py --repo "$repo" "${census_args[@]}" \
                --json-out "$RUNNER_TEMP/storage-census/$name.json" \
                > "$RUNNER_TEMP/storage-census/$name.md" \
                2> "$RUNNER_TEMP/storage-census/$name.error"; then
              echo "Complete: $repo"
              rm -f "$RUNNER_TEMP/storage-census/$name.error"
            else
              # Report only a bounded classification, never raw CLI stderr.
              classification="$(grep -Eo 'HTTP [1-5][0-9]{2}|status unavailable|timed out after 3 attempts|artifact count changed during pagination' "$RUNNER_TEMP/storage-census/$name.error" | tail -n 1 || true)"
              classification="${classification:-unclassified}"
              echo "::warning::Incomplete GitHub artifact listing for $repo (reason: $classification), excluded from totals"
              rm -f "$RUNNER_TEMP/storage-census/$name.json" "$RUNNER_TEMP/storage-census/$name.md"
              printf 'INCOMPLETE: %s (no bytes claimed)\n' "$classification" > "$RUNNER_TEMP/storage-census/$name.error"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/storage-census/repos.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "storage-census"
          names = (root / "repos.txt").read_text().splitlines()
          good, missing = [], []
          for repo in names:
              path = root / (repo.split("/")[-1] + ".json")
              if path.exists():
                  entries = json.loads(path.read_text())["repositories"]
                  if len(entries) != 1 or entries[0]["repository"] != repo:
                      raise SystemExit("mismatched source repository")
                  good.append(entries[0])
              else:
                  missing.append(repo)
          report = {
              "schema": "actions-storage-repository-snapshots/v1",
              "account_wide_complete": len(missing) == 0,
              "repositories_expected": len(names),
              "repositories_complete": len(good),
              "incomplete_repositories": missing,
              "complete_repository_snapshots": good,
          }
          (root / "index.json").write_text(json.dumps(report, indent=2) + "\n")
          rows = ["# GitHub Actions storage census",
                  "",
                  f"**Completed: {len(good)} of {len(names)} repositories.**",
                  f"**Account-wide complete: {len(missing) == 0}.**",
                  "",
                  "Sizes are metadata-based estimates for COMPLETE repositories only, never accrued billing GB-hours.",
                  "",
                  "| Repository | Retained artifacts | Estimated MiB |",
                  "|---|---:|---:|"]
          for entry in sorted(good, key=lambda x: -x["current_artifact_bytes_estimate"]):
              rows.append(f"| {entry['repository']} | {entry['active_count']} | {entry['current_artifact_bytes_estimate']/1048576:.1f} |")
          total = sum(entry["current_artifact_bytes_estimate"] for entry in good)
          rows.extend(["", f"**Completed subset only:** {total / 1048576:.1f} MiB", ""])
          if missing:
              rows.extend(["## Incomplete or unavailable repositories (excluded from totals)", ""])
              rows.extend("- " + repo for repo in missing)
          rows.extend(["", "Read-only: no artifacts were deleted or nominated for deletion.", ""])
          text = "\n".join(rows)
          (root / "summary.md").write_text(text)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(text)
          if not good:
              raise SystemExit("no complete repository snapshots")
          PY
      - name: Retain bounded read-only census for exact-source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-public-repositories-storage-census
          path: ${{ runner.temp }}/storage-census/
          retention-days: 2
          if-no-files-found: warn

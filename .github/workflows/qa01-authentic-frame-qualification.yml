                  stages[row["stage"]]+=1
                  if prefix:mixed[row["stage"]]+=1
                  row["seq"]=len(events)+1
                  events.append(row)
              assert len(events)==47853
              assert stages==collections.Counter({"opcode":45103,"read":2705,**{
                  k:9 for k in ("entry","resume_origin","after_push","compiled_rti","handler_return")}})
              assert mixed==collections.Counter({"read":73,"compiled_rti":2})
              frame_ordinals={}
              for frame in range(1017,1026):

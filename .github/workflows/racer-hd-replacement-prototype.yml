name: Racer HD replacement prototype

on:
  pull_request:
    branches:
      - main
    paths:
      - "analysis/data/racer-hd-replacement-prototype.json"
      - "analysis/generated/racer-presentation-family.json"
      - "analysis/data/presentation-assets.json"
      - "tools/prototype_racer_hd_replacement.py"
      - "tools/measure_racer_composed_anchor.py"
      - "tools/check_racer_hd_temporal_coherence.py"
      - "tools/extract_racer_presentation_family.py"
      - "tests/unit/test_racer_hd_replacement_prototype.py"
      - "tests/unit/test_racer_hd_temporal_coherence.py"
      - ".github/workflows/racer-hd-replacement-prototype.yml"

permissions:
  contents: read

concurrency:
  group: racer-hd-replacement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"
      - name: Run focused unit tests
        run: python3 -m unittest tests.unit.test_racer_hd_replacement_prototype tests.unit.test_racer_hd_temporal_coherence -v
      - name: Render synchronized semantic replacement prototypes
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"])
          registry = json.loads(
              Path("analysis/data/racer-hd-replacement-prototype.json").read_text()
          )
          for entry in registry["entries"]:
              rep = entry["representation_id"]
              frame = entry["semantic_frame_id"]
              out = root / f"racer-hd-prototype-{rep}"
              subprocess.run(
                  [
                      "python3",
                      "tools/prototype_racer_hd_replacement.py",
                      "reference/roms/retail/Uniracers_USA.sfc",
                      "--semantic-frame-id", frame,
                      "--representation-id", rep,
                      "--output-dir", str(out),
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              m = json.loads((out / "manifest.json").read_text())
              contact = entry["registration"]["semantic_anchors"]["wheel_contact_x2_y2"]
              assert m["semantic_frame_id"] == frame
              assert m["representation_id"] == rep
              assert m["authoritative_state_mutated"] is False
              assert m["fallback"]["byte_exact_to_original_control"] is True
              assert m["validation"]["whole_canvas_registration_preserved"] is True
              assert m["validation"]["orientation_applied_post_selection"] is True
              assert m["remastered_candidate"]["dimensions"] == [256, 256]
              assert m["derived_anchor_probe"]["flip_pivot_x2_y2"] == [63, 63]
              assert m["derived_anchor_probe"]["stock_contact_x2_y2"] == contact
              assert m["validation"]["semantic_anchor_metadata_exact"] is True
              assert m["validation"]["missing_registration_metadata"] == []
              assert (out / m["original"]["comparison_png"]).is_file()
              assert (out / m["remastered_candidate"]["png"]).is_file()
              print(
                  f"UR_RACER_PROTOTYPE PASS representation={rep} "
                  f"semantic={frame} contact={contact}"
              )
          PY
      - name: Check replacement temporal coherence
        run: |
          python3 tools/check_racer_hd_temporal_coherence.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --json-out "$RUNNER_TEMP/racer-hd-temporal-coherence.json" \
            | tee "$RUNNER_TEMP/racer-hd-temporal-coherence.txt"
          python3 - "$RUNNER_TEMP/racer-hd-temporal-coherence.json" <<'PY'
          import json, pathlib, sys
          r = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert r["validation"]["shared_registration_basis"] is True
          assert r["validation"]["candidate_alpha_transition_matches_stock"] is True
          for player in ("p1", "p2"):
              assert len(r["sequences"][player]["frames"]) >= 2
              assert r["sequences"][player]["pairs"]
          print("UR_RACER_TEMPORAL_COHERENCE PASS")
          PY

      - name: Measure second synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0544 \
            --p1-companion 0x0D49 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-second-sync-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0544 \
            --p1-companion 0x0D49 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-second-sync-p2.json"

      - name: Measure adjacent synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057D --p2-primary 0x0543 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-adjacent-sync-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057D --p2-primary 0x0543 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-adjacent-sync-p2.json"

      - name: Measure duplicate synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0543 \
            --p1-companion 0x0D49 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-duplicate-sync-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0543 \
            --p1-companion 0x0D49 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-duplicate-sync-p2.json"

      - name: Measure alternate companion-context racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0544 \
            --p1-companion 0x0D69 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-companion-context-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057E --p2-primary 0x0544 \
            --p1-companion 0x0D69 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-companion-context-p2.json"

      - name: Measure predecessor synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057D --p2-primary 0x0542 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-predecessor-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057D --p2-primary 0x0542 \
            --p1-companion 0x0D48 --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-predecessor-p2.json"

      - name: Measure forward synchronized racer anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057F --p2-primary 0x0543 \
            --p1-companion 0x0D6A --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-forward-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057F --p2-primary 0x0543 \
            --p1-companion 0x0D6A --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-forward-p2.json"

      - name: Measure 0541 companion-predecessor anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x0541 --p2-primary 0x0540 \
            --p1-companion 0x0D2D --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-0541-companion-predecessor-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x0541 --p2-primary 0x0540 \
            --p1-companion 0x0D2D --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-0541-companion-predecessor-p2.json"
          python3 - "$RUNNER_TEMP/racer-0541-companion-predecessor-p1.json" "$RUNNER_TEMP/racer-0541-companion-predecessor-p2.json" <<'PY'
          import json, pathlib, sys
          p1 = json.loads(pathlib.Path(sys.argv[1]).read_text())
          p2 = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert p1["flip_pivot_x2_y2"] == [63, 63]
          assert p1["wheel_contact_x2_y2"] == [61, 76]
          assert p1["alpha_bounds"] == [22, 2, 39, 38]
          assert p2["flip_pivot_x2_y2"] == [63, 63]
          assert p2["wheel_contact_x2_y2"] == [63, 76]
          assert p2["alpha_bounds"] == [23, 3, 40, 38]
          assert p1["composition"]["p1_companion"] == "0x0D2D"
          assert p2["composition"]["p1_companion"] == "0x0D2D"
          print("UR_RACER_0541_COMPANION_PREDECESSOR PASS")
          PY

      - name: Measure 0540/0541 predecessor anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x0540 --p2-primary 0x0541 \
            --p1-companion 0x0D2C --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-0540-0541-predecessor-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x0540 --p2-primary 0x0541 \
            --p1-companion 0x0D2C --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-0540-0541-predecessor-p2.json"
          python3 - "$RUNNER_TEMP/racer-0540-0541-predecessor-p1.json" "$RUNNER_TEMP/racer-0540-0541-predecessor-p2.json" <<'PY'
          import json, pathlib, sys
          p1 = json.loads(pathlib.Path(sys.argv[1]).read_text())
          p2 = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert p1["flip_pivot_x2_y2"] == [63, 63]
          assert p1["wheel_contact_x2_y2"] == [63, 76]
          assert p1["alpha_bounds"] == [23, 2, 40, 38]
          assert p2["flip_pivot_x2_y2"] == [63, 63]
          assert p2["wheel_contact_x2_y2"] == [61, 76]
          assert p2["alpha_bounds"] == [22, 3, 39, 38]
          assert p1["composition"]["p1_companion"] == "0x0D2C"
          assert p2["composition"]["p1_companion"] == "0x0D2C"
          print("UR_RACER_0540_0541_PREDECESSOR PASS")
          PY

      - name: Measure 0540/0542 companion discriminator
        run: |
          for companion in 0x0D2C 0x0D4C; do
            tag="$(printf '%s' "$companion" | tr '[:upper:]' '[:lower:]')"
            python3 tools/measure_racer_composed_anchor.py \
              "reference/roms/retail/Uniracers_USA.sfc" \
              --p1-primary 0x0540 --p2-primary 0x0542 \
              --p1-companion "$companion" --p2-companion 0x0000 \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate 0x0001 --p2-gate 0x0000 \
              --player p1 --palette-asset-id 0x06 \
              | tee "$RUNNER_TEMP/racer-0540-0542-$tag-p1.json"
            python3 tools/measure_racer_composed_anchor.py \
              "reference/roms/retail/Uniracers_USA.sfc" \
              --p1-primary 0x0540 --p2-primary 0x0542 \
              --p1-companion "$companion" --p2-companion 0x0000 \
              --p1-selector 0 --p2-selector 0 \
              --p1-gate 0x0001 --p2-gate 0x0000 \
              --player p2 --palette-asset-id 0x07 \
              | tee "$RUNNER_TEMP/racer-0540-0542-$tag-p2.json"
          done

          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              "0x0d2c": {
                  "p1": ([63, 63], [63, 76], [23, 2, 40, 38]),
                  "p2": ([63, 63], [59, 76], [21, 4, 40, 38]),
              },
              "0x0d4c": {
                  "p1": ([63, 63], [63, 76], [23, 2, 40, 38]),
                  "p2": ([63, 63], [59, 76], [21, 4, 40, 38]),
              },
          }
          for tag, players in expected.items():
              for player, (pivot, contact, bounds) in players.items():
                  r = json.loads((root / f"racer-0540-0542-{tag}-{player}.json").read_text())
                  assert r["flip_pivot_x2_y2"] == pivot
                  assert r["wheel_contact_x2_y2"] == contact
                  assert r["alpha_bounds"] == bounds
                  assert r["composition"]["p1_companion"].lower() == tag
          print("UR_RACER_0540_0542_COMPANION_DISCRIMINATOR PASS")
          PY

      - name: Measure 057F/0542 predecessor anchors
        run: |
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057F --p2-primary 0x0542 \
            --p1-companion 0x0D4A --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p1 --palette-asset-id 0x06 \
            | tee "$RUNNER_TEMP/racer-057f-0542-predecessor-p1.json"
          python3 tools/measure_racer_composed_anchor.py \
            "reference/roms/retail/Uniracers_USA.sfc" \
            --p1-primary 0x057F --p2-primary 0x0542 \
            --p1-companion 0x0D4A --p2-companion 0x0000 \
            --p1-selector 0 --p2-selector 0 \
            --p1-gate 0x0001 --p2-gate 0x0000 \
            --player p2 --palette-asset-id 0x07 \
            | tee "$RUNNER_TEMP/racer-057f-0542-predecessor-p2.json"
          python3 - "$RUNNER_TEMP/racer-057f-0542-predecessor-p1.json" "$RUNNER_TEMP/racer-057f-0542-predecessor-p2.json" <<'PY'
          import json, pathlib, sys
          p1 = json.loads(pathlib.Path(sys.argv[1]).read_text())
          p2 = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert p1["flip_pivot_x2_y2"] == [63, 63]
          assert p1["wheel_contact_x2_y2"] == [65, 76]
          assert p1["alpha_bounds"] == [22, 2, 41, 38]
          assert p2["flip_pivot_x2_y2"] == [63, 63]
          assert p2["wheel_contact_x2_y2"] == [59, 76]
          assert p2["alpha_bounds"] == [21, 4, 40, 38]
          assert p1["composition"]["p1_companion"] == "0x0D4A"
          assert p2["composition"]["p1_companion"] == "0x0D4A"
          print("UR_RACER_057F_0542_PREDECESSOR PASS")
          PY

      - name: Upload compact visual proof
        uses: actions/upload-artifact@v4
        with:
          name: racer-hd-replacement-prototype
          path: |
            ${{ runner.temp }}/racer-hd-prototype-*/
            ${{ runner.temp }}/racer-hd-temporal-coherence.json
            ${{ runner.temp }}/racer-hd-temporal-coherence.txt
            ${{ runner.temp }}/racer-0541-companion-predecessor-p1.json
            ${{ runner.temp }}/racer-0541-companion-predecessor-p2.json
            ${{ runner.temp }}/racer-0540-0541-predecessor-p1.json
            ${{ runner.temp }}/racer-0540-0541-predecessor-p2.json
            ${{ runner.temp }}/racer-0540-0542-0x0d2c-p1.json
            ${{ runner.temp }}/racer-0540-0542-0x0d2c-p2.json
            ${{ runner.temp }}/racer-0540-0542-0x0d4c-p1.json
            ${{ runner.temp }}/racer-0540-0542-0x0d4c-p2.json
            ${{ runner.temp }}/racer-057f-0542-predecessor-p1.json
            ${{ runner.temp }}/racer-057f-0542-predecessor-p2.json
            ${{ runner.temp }}/racer-forward-p1.json
            ${{ runner.temp }}/racer-forward-p2.json
            ${{ runner.temp }}/racer-predecessor-p1.json
            ${{ runner.temp }}/racer-predecessor-p2.json
            ${{ runner.temp }}/racer-companion-context-p1.json
            ${{ runner.temp }}/racer-companion-context-p2.json
            ${{ runner.temp }}/racer-duplicate-sync-p1.json
            ${{ runner.temp }}/racer-duplicate-sync-p2.json
            ${{ runner.temp }}/racer-adjacent-sync-p1.json
            ${{ runner.temp }}/racer-adjacent-sync-p2.json
          if-no-files-found: error

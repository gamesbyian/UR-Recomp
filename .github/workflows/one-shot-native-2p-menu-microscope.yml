name: One-shot native 2P menu state microscope
on:
  push:
    branches: [media/oct19-dynamic-native-racing]
    paths: [.github/workflows/one-shot-native-2p-menu-microscope.yml]
permissions:
  contents: write
jobs:
  menu-state:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
      - name: Lightweight original state probe host dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            ninja-build pkg-config libsdl2-dev libgl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev xvfb x11-utils python3
      - name: Source-pinned native rebuild once and four menu traces
        run: |
          set -euo pipefail
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          echo '859ec99fdc25dd9b239d9085bf656e4f49c93a32faa5bb248da83efd68ebd478  reference/roms/retail/Uniracers_USA.sfc' | sha256sum -c -
          python3 tools/baldosa_guest_adapter_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_single_presentation_scale_patch.py --root "$GITHUB_WORKSPACE" --framework baldosa/snesrecomp
          python3 tools/baldosa_hd_host_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/baldosa_ws24_framework_split_patch.py --root "$GITHUB_WORKSPACE" --framework baldosa/snesrecomp
          python3 tools/baldosa_ws24_host_spike.py --game baldosa --ur-root "$GITHUB_WORKSPACE"
          python3 tools/showcase/stage_continuous_native_capture.py --framework baldosa/snesrecomp
          python3 tools/showcase/probe_stock_2p_topology_menu.py \
            --source baldosa/tests/routes/race_2p_split.txt --out "$RUNNER_TEMP/menu-probes"
          cmake -S baldosa -B baldosa/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
             -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j 3
          printf '%s\n' '[Sound]' 'EnableAudio = 0' > baldosa/build/config.ini
          Xvfb :99 -screen 0 1280x720x24 -ac > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          export DISPLAY=:99 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy
          export SNESRECOMP_ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          export BALDOSA_REAL_BIN="$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp"
          chmod +x tools/showcase/native_dynamic_media_wrapper.sh
          export BIN="$GITHUB_WORKSPACE/tools/showcase/native_dynamic_media_wrapper.sh"
          export PIXELS=0 KEEP_WRAM=0 TMO=60 UR_BALDOSA_HD=1 UR_BALDOSA_HD_DENSITY=1
          export UR_BALDOSA_WS342=1 UR_BALDOSA_WS342_LIVE=1 UR_RACER_HD=0
          sleep 2
          mkdir -p "$RUNNER_TEMP/menu-states"
          for name in all-start all-a start-then-a a-then-start; do
            bash baldosa/tools/run_route.sh "$RUNNER_TEMP/menu-probes/$name.txt" "$RUNNER_TEMP/menu-states/$name"
          done
          python3 - <<'PY'
          import json,struct,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'menu-states'
          result={'schema':'UR-REAL-2P-MENU-STATE-SAMPLES/1','rom':'canonical USA 859ec99f...','runs':{}}
          for name in ('all-start','all-a','start-then-a','a-then-start'):
           rows={}
           for tag in ('touring-shuffler','after-tour-accept','selected-course-row','after-track-accept','after-race-accept'):
            path=root/name/'dump'/f'{tag}.wram.bin'
            data=path.read_bytes()
            assert len(data)==0x20000,(name,tag,len(data))
            u16=lambda i:struct.unpack_from('<H',data,i)[0]
            rows[tag]={'state_7E009F':data[0x009f], 'selected_7E009B':data[0x009b],
                      'track_7E00CE':data[0x00ce], 'race_7E0313':data[0x0313],
                      'p1_x':u16(0x411),'p2_x':u16(0x413),
                      'source_guest_state_not_written':True}
           result['runs'][name]=rows
          folder=Path(os.environ['RUNNER_TEMP'])/'menu-probes'
          (folder/'read-only-menu-states.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Save exact original guest logs and inspectable state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-2p-shuffler-native-state-probe
          path: |
            ${{ runner.temp }}/menu-probes/
            ${{ runner.temp }}/menu-states/*/log.txt
            ${{ runner.temp }}/menu-states/*/dump/*.wram.bin
          if-no-files-found: warn
          retention-days: 14
      - name: Retire disposable microscope after successful observations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-native-2p-menu-microscope.yml
          git commit -m "ci: retire completed source-pinned 2P menu microscope"
          git push origin "HEAD:${GITHUB_REF_NAME}"

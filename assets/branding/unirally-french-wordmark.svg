  <ns0:title id="title">L'Inéluctable Esseulement de la Roue Unique | French Unirally wordmark</ns0:title>
  <ns0:desc id="desc">Original typographic French art-title reinterpretation using the same Uniracers yellow and diagonally offset black rim; editable path outlines and no external font needed.</ns0:desc>

name: One-shot native-capture reel export

# This temporary builder is removed before committing its outputs.
on:
  push:
    branches:
      - media/capture-reel-20261010
    paths:
      - .github/workflows/_one_shot_showcase_capture.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-showcase-fixed-branch
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/media/capture-reel-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Install FFmpeg for this one-off renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download pinned native image archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/gamesbyian/UR-Recomp/actions/artifacts/11681138053/zip' \
            -o /tmp/baldosa-native-spike-evidence.zip
          echo '40a84fbc04e75b0892a55b44a03340198d8d49c9543a95db54720cf00a1bbb97  /tmp/baldosa-native-spike-evidence.zip' | sha256sum -c -
      - name: Render videos and source image
        run: |
          ffmpeg -version | head -n 1
          python tools/showcase/build_capture_reel.py \
            --zip /tmp/baldosa-native-spike-evidence.zip \
            --outdir media/showcase/2026-10-10
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('media/showcase/2026-10-10')
          m=json.loads((p/'provenance.json').read_text())
          assert m['verified']['frame_1856_exact_center_match']
          assert len(m['outputs']) == 4
          assert all((p/name).exists() and (p/name).stat().st_size for name in m['outputs'])
          print('Verified',len(m['outputs']),'generated assets')
          PY
      - name: Commit generated assets and retire one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/showcase/2026-10-10
          git rm .github/workflows/_one_shot_showcase_capture.yml
          git commit -m "media: retain exact native-capture recruitment reels and provenance"
          git push origin HEAD:media/capture-reel-20261010

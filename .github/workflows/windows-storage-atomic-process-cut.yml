name: Windows atomic storage process-cut regression

# ROM-free native Windows regression for the production atomic writer.
# Runs only when its implementation or crash-cut fixture changes.
on:
  pull_request:
    paths:
      - "native/product/local_tournament_atomic_replace.hpp"
      - "tests/native/local_tournament_atomic_replace_test.cpp"
      - "tests/native/host_profile_win32_cas_process_test.cpp"
      - "tests/native/host_staged_replace_sharing_retry_win32_test.cpp"
      - "native/product/host_profile_store.cpp"
      - "native/product/local_tournament_launch_path_lock.hpp"
      - ".github/workflows/windows-storage-atomic-process-cut.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-storage-atomic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-cut:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute actual Windows child-process cuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe missing' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ x64 tools missing' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'vcvars64.bat missing' }
          $include = Join-Path $env:GITHUB_WORKSPACE 'native\product'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tests\native\local_tournament_atomic_replace_test.cpp'
          $exe = Join-Path $env:RUNNER_TEMP 'local_tournament_atomic_replace_test.exe'
          $runner = Join-Path $env:RUNNER_TEMP 'run-atomic-writer.cmd'
          $retryExe = Join-Path $env:RUNNER_TEMP 'host_staged_replace_sharing_retry_win32_test.exe'
          $retrySource = Join-Path $env:GITHUB_WORKSPACE 'tests\native\host_staged_replace_sharing_retry_win32_test.cpp'
          $retryRoot = Join-Path $env:RUNNER_TEMP ('ur-replace-retry-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $retryRoot | Out-Null
          $casExe = Join-Path $env:RUNNER_TEMP 'host_profile_win32_cas_process_test.exe'
          $casRoot = Join-Path $env:RUNNER_TEMP ('ur-profile-cas-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $casRoot | Out-Null
          $casFiles = @(
            'native\product\host_product_state.cpp',
            'native\product\output_resolution_policy.cpp',
            'native\product\modern_racer_identity.cpp',
            'native\product\host_profile_state.cpp',
            'native\product\host_profile_store.cpp',
            'tests\native\host_profile_win32_cas_process_test.cpp'
          )
          $casSources = ($casFiles | ForEach-Object { '"' + (Join-Path $env:GITHUB_WORKSPACE $_) + '"' }) -join ' '
          $commands = @(
            '@echo off',
            "call `"$vcvars`"",
            'if errorlevel 1 exit /b 1',
            "cl /nologo /DUR_ATOMIC_REPLACE_TEST_DIAGNOSTICS=1 /std:c++17 /EHsc /W3 /I`"$include`" `"$source`" /Fe:`"$exe`"",
            'if errorlevel 1 exit /b 1',
            "`"$exe`"",
            'if errorlevel 1 exit /b 1',
            "cl /nologo /std:c++17 /EHsc /W3 /I`"$include`" $casSources /Fe:`"$casExe`"",
            'if errorlevel 1 exit /b 1',
            "`"$casExe`" `"$casRoot\profile.state`"",
            'if errorlevel 1 exit /b 1',
            "cl /nologo /DUR_ATOMIC_REPLACE_TEST_DIAGNOSTICS=1 /std:c++17 /EHsc /W3 /I`"$include`" `"$retrySource`" /Fe:`"$retryExe`"",
            'if errorlevel 1 exit /b 1',
            "`"$retryExe`" `"$retryRoot`"",
            'exit /b %ERRORLEVEL%'
          )
          [System.IO.File]::WriteAllLines($runner, $commands, [System.Text.Encoding]::ASCII)
          & cmd.exe /d /c "`"$runner`""
          if ($LASTEXITCODE -ne 0) { throw "Windows storage process-cut fixture failed: $LASTEXITCODE" }
          Write-Host 'Windows atomic storage process-cut and profile CAS regressions passed'

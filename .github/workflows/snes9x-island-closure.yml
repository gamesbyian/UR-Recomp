name: Snes9x island closure probe

on:
  pull_request:
    paths:
      - "tools/measure_source_closure.py"
      - "tests/unit/test_measure_source_closure.py"
      - "tools/patches/snes9x-snesref-debug-exports.patch"
      - ".github/workflows/snes9x-island-closure.yml"
      - "docs/ISLAND-TOOLCHAIN-PLAN.md"
      - "docs/WORK-QUEUE.md"
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned Snes9x revision
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/snes9x"
          git init "$root"
          git -C "$root" remote add origin https://github.com/snes9xgit/snes9x.git
          git -C "$root" fetch --depth 1 --filter=blob:none origin 1bcc369e89f08243e0a462882fb1f3e42e51de3a
          git -C "$root" checkout --detach 1bcc369e89f08243e0a462882fb1f3e42e51de3a
          git -C "$root" apply "$GITHUB_WORKSPACE/tools/patches/snes9x-snesref-debug-exports.patch"
          echo "SNES9X_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build patched libretro core with compiler dependency emission
        shell: bash
        run: |
          set -euo pipefail
          make -C "$SNES9X_ROOT/libretro" -j2 CPPFLAGS="-MMD -MP"
          test -s "$SNES9X_ROOT/libretro/snes9x_libretro.so"
          count="$(find "$SNES9X_ROOT" -name '*.d' -type f | wc -l)"
          test "$count" -gt 0
          echo "compiler depfiles: $count"

      - name: Measure build-consumed source closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/measure_source_closure.py             --source-root "$SNES9X_ROOT"             --dep-root "$SNES9X_ROOT"             --include LICENSE             --include libretro/Makefile             --include libretro/Makefile.common             --include libretro/link.T             --output analysis/generated/snes9x-build-closure-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("analysis/generated/snes9x-build-closure-probe.json")
          data = json.loads(p.read_text())
          summary = (
              "### Snes9x island closure probe\n\n"
              f"- files consumed: {data['file_count']}\n"
              f"- source bytes: {data['source_bytes']}\n"
              f"- closure SHA-256: \`{data['closure_sha256']}\`\n"
          )
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write(summary)
          PY

      - name: Materialize measured closure
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/snes9x-island"
          mkdir -p "$out"
          python3 - "$SNES9X_ROOT" "$out" <<'PY'
          import json
          from pathlib import Path
          import shutil
          import sys

          source = Path(sys.argv[1])
          dest = Path(sys.argv[2])
          data = json.loads(Path("analysis/generated/snes9x-build-closure-probe.json").read_text())
          for record in data["files"]:
              rel = Path(record["path"])
              target = dest / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source / rel, target)
          PY
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/snes9x-island.tar.gz" snes9x-island

      - uses: actions/upload-artifact@v4
        with:
          name: snes9x-island-closure-probe
          path: |
            analysis/generated/snes9x-build-closure-probe.json
            ${{ runner.temp }}/snes9x-island.tar.gz
          if-no-files-found: error
          retention-days: 7

name: One-shot Snes9x debug patch compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/patches/snes9x-snesref-debug-exports.patch"
      - ".github/workflows/snes9x-debug-patch-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint patch
        run: sha256sum tools/patches/snes9x-snesref-debug-exports.patch
      - name: Check patch against pinned Snes9x
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/snes9x"
          cd "$RUNNER_TEMP/snes9x"
          git remote add origin https://github.com/snes9xgit/snes9x.git
          git fetch --depth 1 origin 1bcc369e89f08243e0a462882fb1f3e42e51de3a
          git checkout --detach FETCH_HEAD
          git apply --check "$GITHUB_WORKSPACE/tools/patches/snes9x-snesref-debug-exports.patch"
          echo "PATCH_COMPATIBLE=1"

name: E580 race-loop control probe
on:
  push:
    branches:
      - chatgpt/e580-race-loop-control-2026-10-01
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/analyze_race_loop_e580_control_structure_island.py
      - run: python3 tools/build_comparative_structural_census.py
      - run: python3 -m unittest tests.unit.test_analyze_race_loop_e580_control_structure_island -v
      - name: Commit generated evidence
        run: |
          if git diff --quiet -- analysis/generated/race-loop-e580-control-structure-island.json analysis/generated/race-loop-e580-control-structure-island.md analysis/generated/comparative-structural-census.json analysis/generated/comparative-structural-census.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/generated/race-loop-e580-control-structure-island.json analysis/generated/race-loop-e580-control-structure-island.md analysis/generated/comparative-structural-census.json analysis/generated/comparative-structural-census.md
          git commit -m "analysis: record E580 race-loop control evidence"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: e580-race-loop-control-island
          path: |
            analysis/generated/race-loop-e580-control-structure-island.json
            analysis/generated/race-loop-e580-control-structure-island.md
            analysis/generated/comparative-structural-census.json
            analysis/generated/comparative-structural-census.md
          if-no-files-found: error

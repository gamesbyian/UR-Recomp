name: Tiny-margin Widescreen Dragster probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/patch_widescreen_probe_host.py"
      - "tools/analyze_tiny_widescreen_probe.py"
      - ".github/workflows/widescreen-tiny-margin-probe.yml"
      - "tests/input/object-activation-dragster-tail.script"

concurrency:
  group: widescreen-tiny-margin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Stage repository-owned SNESRecomp framework
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --jobs 2
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh

      - name: Generate diagnostic native target
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          ROOT="$RUNNER_TEMP/native"
          mkdir -p "$ROOT"
          SNESRECOMP_ROOT="$FRAMEWORK" sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --no-submodules \
            --generate \
            --no-build
          PROJ="$ROOT/UniracersSNESRecomp"
          python3 "$GITHUB_WORKSPACE/tools/patch_widescreen_probe_host.py" "$PROJ/src/main.c"
          grep -n "native_widescreen" "$PROJ/src/main.c"
          grep -n "WidescreenProbePrepareFrame" "$PROJ/src/main.c"
          cmake -S "$PROJ" -B "$PROJ/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF
          cmake --build "$PROJ/build" -j2
          test -x "$PROJ/build/UniracersSNESRecomp"

      - name: Run 0 8 16 24 pixel-per-side probes
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/native/UniracersSNESRecomp/build/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/object-activation-dragster-tail.script"
          ROOT="$RUNNER_TEMP/widescreen-tiny-margin"
          mkdir -p "$ROOT"

          for margin in 0 8 16 24; do
            echo "=== margin $margin ==="
            DUMPS="$ROOT/margin-$margin"
            mkdir -p "$DUMPS"
            SNESRECOMP_WS_EXTRA="$margin" \
            SNESRECOMP_DUMP_DIR="$DUMPS" \
            SDL_AUDIODRIVER=dummy \
              timeout 210s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$ROOT/margin-$margin.log" 2>&1
            tail -n 30 "$ROOT/margin-$margin.log"
            test -s "$DUMPS/object-tail-060.info.json"
            test -s "$DUMPS/object-tail-174.info.json"
          done

      - name: Analyze cross-margin invariants and first exposure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          python3 tools/analyze_tiny_widescreen_probe.py \
            "$RUNNER_TEMP/widescreen-tiny-margin" \
            --json-out analysis/generated/widescreen-tiny-margin-dragster.json \
            --md-out analysis/generated/widescreen-tiny-margin-dragster.md

          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("analysis/generated/widescreen-tiny-margin-dragster.json").read_text())
          for margin in (0, 8, 16, 24):
              r = d["results"][str(margin)]
              if not r["all_authoritative_state_equal"]:
                  raise SystemExit(f"margin {margin}: authoritative simulation state diverged")
              if margin and r["first_nonblack_margin"] is None:
                  raise SystemExit(f"margin {margin}: probe did not expose any presentation pixels")
          PY

      - name: Upload compact probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-widescreen-tiny-margin
          path: |
            ${{ runner.temp }}/widescreen-tiny-margin/*.log
            ${{ runner.temp }}/widescreen-tiny-margin/margin-*/object-tail-*.info.json
            ${{ runner.temp }}/widescreen-tiny-margin/margin-*/object-tail-*.wram.bin
            ${{ runner.temp }}/widescreen-tiny-margin/margin-*/object-tail-*.fb.bgrx
            ${{ runner.temp }}/widescreen-tiny-margin/margin-*/object-tail-*.fb.bmp
            analysis/generated/widescreen-tiny-margin-dragster.json
            analysis/generated/widescreen-tiny-margin-dragster.md
          if-no-files-found: warn
          retention-days: 5

name: One-shot Sayans patch analysis

on:
  push:
    branches:
      - chatgpt/external-evidence-reconcile-2026-09-29
    paths:
      - .github/workflows/external-evidence-sayans-analysis.yml
  pull_request:
    paths:
      - .github/workflows/external-evidence-sayans-analysis.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Analyze patch against canonical USA ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/generated
          python3 tools/analyze_ips_patch.py             references/imported/patches/sayans-uniracers-2002/Uniraceresp.ips             --base reference/roms/retail/Uniracers_USA.sfc             --output analysis/generated/sayans-translation-patch-map.json             >/tmp/sayans-analysis.json

      - name: Build compact classification report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          src = Path("analysis/generated/sayans-translation-patch-map.json")
          data = json.loads(src.read_text(encoding="utf-8"))

          def hint(record):
              before = record.get("before_printable_ratio", 0.0)
              after = record.get("after_printable_ratio", 0.0)
              length = record["length"]
              if after >= 0.80 and length >= 3:
                  return "text-like"
              if length <= 4 and after < 0.50:
                  return "small-binary"
              if after >= 0.50:
                  return "mixed/text-like"
              return "binary/unknown"

          counts = Counter()
          banks = defaultdict(lambda: {"records": 0, "bytes": 0, "changed": 0})
          rows = []
          for record in data["records"]:
              cls = hint(record)
              counts[cls] += 1
              bank = record["lorom"].split(":", 1)[0] if record.get("lorom") else "n/a"
              banks[bank]["records"] += 1
              banks[bank]["bytes"] += record["length"]
              banks[bank]["changed"] += record.get("actual_changed_bytes", 0)
              rows.append({
                  "offset": record["offset_hex"],
                  "lorom": record.get("lorom"),
                  "length": record["length"],
                  "changed": record.get("actual_changed_bytes", 0),
                  "hint": cls,
                  "before_ascii": record.get("before_ascii", ""),
                  "after_ascii": record.get("after_ascii", ""),
              })

          report = {
              "schema_version": 1,
              "patch_sha256": data["patch_sha256"],
              "base_sha256": data["base"]["sha256"],
              "result_sha256": data["result"]["sha256"],
              "record_count": data["record_count"],
              "encoded_write_bytes": data["encoded_write_bytes"],
              "actual_changed_bytes": data["result"]["actual_changed_bytes"],
              "classification_counts": dict(sorted(counts.items())),
              "banks": dict(sorted(banks.items())),
              "records": rows,
          }
          Path("analysis/generated/sayans-translation-classification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              k: report[k]
              for k in (
                  "patch_sha256",
                  "base_sha256",
                  "result_sha256",
                  "record_count",
                  "encoded_write_bytes",
                  "actual_changed_bytes",
                  "classification_counts",
                  "banks",
              )
          }, indent=2, sort_keys=True))
          PY

      - name: Upload compact reports
        uses: actions/upload-artifact@v4
        with:
          name: sayans-translation-analysis
          path: |
            analysis/generated/sayans-translation-patch-map.json
            analysis/generated/sayans-translation-classification.json
          retention-days: 1

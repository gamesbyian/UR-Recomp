          assert retained["before"]["hd_selected_player_frames"] == 150
          assert retained["after"]["hd_selected_player_frames"] == 162
          assert retained["current_after"]["hd_selected_player_frames"] == 179
          assert retained["current_after"]["original_fallback_player_frames"] == 703
          spill = retained["broader_player_local_spill_in"]

name: trace course-buffer writers

on:
  workflow_dispatch:concurrency:
  group: trace-course-buffer-writers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-course:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Generate project and build trace target
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/trace-project"
          mkdir -p "$ROOT"
          sh snesrecomp/tools/new_project/setup_project.sh \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --generate \
            --snesrecomp-ref cd5875cbdaf19f5e324272b1f8051d671fce9215

          PROJECT="$ROOT/UniracersSNESRecomp"
          python3 - "$PROJECT/src/host_contract.c" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          marker="#include <stdint.h>\n"
          if marker not in s:
              raise SystemExit("host_contract.c include marker not found")
          s=s.replace(marker,marker+"\n#if !defined(SNESRECOMP_TRACE) || !SNESRECOMP_TRACE\n",1)
          s+="\n#endif /* production debug-hook stubs */\n"
          p.write_text(s)
          PY

          python3 "$GITHUB_WORKSPACE/tools/bootstrap_toolchain.py" --offline --tool sdl3 --clone-only
          cmake -S "$PROJECT" -B "$PROJECT/build-trace" -DSNESRECOMP_SDL_BACKEND=SDL3 -DSNESRECOMP_SDL3_FETCH=ON -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ENABLE_TRACE=ON
          cmake --build "$PROJECT/build-trace" -j2
          test -x "$PROJECT/build-trace/UniracersSNESRecomp"

      - name: Trace course-buffer writers through race setup
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/trace-project/UniracersSNESRecomp"
          EXE="$PROJECT/build-trace/UniracersSNESRecomp"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script"
          LOG="$RUNNER_TEMP/course-trace-host.log"
          OUT="$RUNNER_TEMP/course-buffer-writers.json"

          SNESRECOMP_DEBUG_PORT=4377 SDL_AUDIODRIVER=dummy \
            timeout 240s xvfb-run -a "$EXE" "$ROM" --paused --script "$SCRIPT" \
            >"$LOG" 2>&1 &
          HOST_PID=$!
          trap 'kill "$HOST_PID" 2>/dev/null || true' EXIT

          set +e
          python3 tools/trace_native_wram_writers.py \
            --port 4377 \
            --command-timeout 45 \
            --coarse-until 900 \
            --coarse-step 25 \
            --max-frames 1400 \
            --address 0x10000 \
            --address 0x10003 \
            --address 0x10005 \
            --address 0x1000B \
            --json-out "$OUT"
          TRACE_STATUS=$?
          set -e

          kill "$HOST_PID" 2>/dev/null || true
          wait "$HOST_PID" 2>/dev/null || true
          trap - EXIT

          echo "== host log tail =="
          tail -n 140 "$LOG"
          if [ "$TRACE_STATUS" -ne 0 ]; then
            exit "$TRACE_STATUS"
          fi
          test -s "$OUT"

      - name: Upload course writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-course-buffer-writers
          path: |
            ${{ runner.temp }}/course-trace-host.log
            ${{ runner.temp }}/course-buffer-writers.json
          if-no-files-found: warn
          retention-days: 7

name: Windows earned-run named-stream discriminator

on:
  pull_request:
    paths:
      - ".github/workflows/win32-earned-run-ads.yml"
      - "tests/unit/test_export_earned_run_win32_ads.py"
      - "tools/export_baldosa_earned_1p_run.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earned-run-ads-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ads-discriminator:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Exercise genuine Win32 ADS and classify the known missing guard
        shell: pwsh
        run: |
          @'
          import os
          import unittest
          from tests.unit import test_export_earned_run_win32_ads

          suite = unittest.defaultTestLoader.loadTestsFromModule(test_export_earned_run_win32_ads)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Win32 earned-run named-stream discriminator\n\n')
              summary.write(f'Tests: {result.testsRun}; skipped: {len(result.skipped)}; '
                            f'expected failures: {len(result.expectedFailures)}; '
                            f'unexpected successes: {len(result.unexpectedSuccesses)}.\n\n')
              summary.write('An expected failure means the exporter still lacks the ADS refusal. '
                            'This is source/host evidence, not release acceptance.\n')
          if result.testsRun != 3 or result.skipped or len(result.expectedFailures) != 1 or not result.wasSuccessful():
              raise SystemExit('Inconclusive/changed Win32 ADS behavior: inspect the individual tests before claiming coverage')
          '@ | python -

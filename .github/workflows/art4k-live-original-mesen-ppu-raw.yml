name: ART-4K original Mesen SNES raw PPU snapshot

on:
  # Reusable exact pinned build shared with trusted-main cache seeder.
  workflow_call:
    inputs:
      seed_only:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      advance_frames:
        description: "Original emulator frames before first captured frame, 1-2500"
        type: number
        default: 1218
        required: true
      capture_frames:
        description: "Consecutive source frame captures, 1-5 (unless capture_ticks set)"
        type: number
        default: 2
        required: true
      capture_ticks:
        description: "Optional ordered comma-separated original bridge ticks (1..24 distinct, <=2500); overrides contiguous inputs"
        type: string
        default: ""
        required: false
      capture_rider_wram:
        description: "Optional same-tick original WRAM 0000-17FF sidecar for rider state / graphics queue; off by default"
        type: boolean
        default: false
        required: false
  pull_request:
    paths:
      - 'tools/art/capture_original_mesen_ppu_raw.py'
      - 'tests/unit/test_capture_original_mesen_ppu_raw.py'
      - 'third_party/src/mesen-for-ai/bridge.lua'
      - '.github/workflows/art4k-live-original-mesen-ppu-raw.yml'

concurrency:
  group: art4k-live-mesen-ppu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  MESENCE_REVISION: a60e79feb4d6dcced5922d636f9211837d01e381
  MESENCE_INPUT_PATCH_REV: v2

jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev xvfb unzip curl clang

      - name: Verify canonical ROM
        # Trusted cache seeding builds only an emulator, no ROM or capture.
        if: ${{ !inputs.seed_only }}
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Restore pinned MesenCE binary cache
        id: mesence-cache
        # Only main-created caches can be restored across sibling PR refs.
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesence-cache
          key: mesence-linux-x64-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MESENCE_REVISION }}-${{ env.MESENCE_INPUT_PATCH_REV }}-${{ hashFiles('tools/art/mesence_cache_receipt.py', 'third_party/src/mesen-for-ai/patches/mesence-lua-input-subport.patch') }}

      - name: Fetch pinned MesenCE source
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/nesdev-org/MesenCE.git "$RUNNER_TEMP/MesenCE"
          git -C "$RUNNER_TEMP/MesenCE" checkout --detach "$MESENCE_REVISION"
          test "$(git -C "$RUNNER_TEMP/MesenCE" rev-parse HEAD)" = "$MESENCE_REVISION"
          git -C "$RUNNER_TEMP/MesenCE" apply --unidiff-zero             "$GITHUB_WORKSPACE/third_party/src/mesen-for-ai/patches/mesence-lua-input-subport.patch"

      - name: Stage MesenCE librashader dependency
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/MesenCE"
          curl -fL --retry 3             "https://nightly.link/SourMesen/librashader/workflows/build/Mesen/librashader-x64-ubuntu.zip"             -o "$RUNNER_TEMP/librashader.zip"
          rm -rf "$RUNNER_TEMP/librashader"
          mkdir -p "$RUNNER_TEMP/librashader"
          unzip -q "$RUNNER_TEMP/librashader.zip" -d "$RUNNER_TEMP/librashader"
          LIB="$(find "$RUNNER_TEMP/librashader" -type f -name librashader.so -print -quit)"
          test -n "$LIB"
          mkdir -p UI/Dependencies
          cp "$LIB" UI/Dependencies/librashader.so

      - name: Build pinned MesenCE
        if: steps.mesence-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -C "$RUNNER_TEMP/MesenCE" -j2 -O LTO=true STATICLINK=true SYSTEM_LIBEVDEV=false
          PUBLISH="$RUNNER_TEMP/MesenCE/bin/linux-x64/Release/linux-x64/publish"
          test -x "$PUBLISH/Mesen"
          rm -rf "$RUNNER_TEMP/mesence-cache"
          mkdir -p "$RUNNER_TEMP/mesence-cache"
          cp -a "$PUBLISH/." "$RUNNER_TEMP/mesence-cache/"


      - name: Verify source-bound MesenCE cache before any emulator execution
        shell: bash
        run: |
          set -euo pipefail
          mode=seal
          if [[ "${{ steps.mesence-cache.outputs.cache-hit }}" == "true" ]]; then
            mode=verify
          fi
          python3 tools/art/mesence_cache_receipt.py "$mode" \
            --cache "$RUNNER_TEMP/mesence-cache" \
            --revision "$MESENCE_REVISION" \
            --patch "$GITHUB_WORKSPACE/third_party/src/mesen-for-ai/patches/mesence-lua-input-subport.patch"
          if [[ "$mode" == "seal" ]]; then
            python3 tools/art/mesence_cache_receipt.py verify \
              --cache "$RUNNER_TEMP/mesence-cache" \
              --revision "$MESENCE_REVISION" \
              --patch "$GITHUB_WORKSPACE/third_party/src/mesen-for-ai/patches/mesence-lua-input-subport.patch"
          fi

      # A good nine-minute build must survive a later original-capture
      # assertion failure. Save only after checking every actual runtime file.
      - name: Save verified pinned MesenCE build
        if: ${{ steps.mesence-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesence-cache
          key: mesence-linux-x64-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MESENCE_REVISION }}-${{ env.MESENCE_INPUT_PATCH_REV }}-${{ hashFiles('tools/art/mesence_cache_receipt.py', 'third_party/src/mesen-for-ai/patches/mesence-lua-input-subport.patch') }}

      - name: Capture selected or consecutive original MesenCE PPU RAM frames
        if: ${{ !inputs.seed_only }}
        env:
          MESEN_SNES_DISABLE_FRAME_SKIPPING: "1"
          CAPTURE_TICKS: ${{ inputs.capture_ticks || '' }}
          # Reuse the ordinary two-frame PR proof to qualify real Mesen WRAM.
          # Manual workflow dispatch remains strictly opt-in/default false.
          RIDER_WRAM_CAPTURE: ${{ github.event_name == 'pull_request' && 'true' || inputs.capture_rider_wram || 'false' }}
          RESEARCH_HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          MESEN_BIN="$RUNNER_TEMP/mesence-cache/Mesen"
          ADVANCE_FRAMES="${{ inputs.advance_frames || 1218 }}"
          CAPTURE_FRAMES="${{ inputs.capture_frames || 2 }}"
          export ADVANCE_FRAMES CAPTURE_FRAMES
          # ONE-OFF original 24-tick rider-state experiment on this research PR.
          # Remove after evidence is verified; all other PRs and manual runs
          # retain their normal two-frame and opt-in settings.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" &&
                "$RESEARCH_HEAD_REF" == "art4k/optional-source-rider-wram-rail-20261104" ]]; then
            CAPTURE_TICKS="$(seq -s, 1601 1624)"
            export CAPTURE_TICKS
            echo "SOURCE_ORIGINAL_RIDER_WRAM_ONE_SHOT_24_TICKS $CAPTURE_TICKS"
          fi
          rider_capture=()
          if [[ "$RIDER_WRAM_CAPTURE" == "true" ]]; then
            rider_capture=(--include-rider-wram)
          elif [[ "$RIDER_WRAM_CAPTURE" != "false" ]]; then
            echo "Invalid optional rider WRAM capture flag" >&2
            exit 2
          fi
          if [[ -n "$CAPTURE_TICKS" ]]; then
            # A manual sparse capture executes the whole original input replay
            # once, but snapshots only the requested bounded bridge ticks.
            python3 - <<'PYSPARSE'
          import os
          from tools.art.capture_original_mesen_ppu_raw import parse_capture_ticks
          ticks=parse_capture_ticks(os.environ["CAPTURE_TICKS"])
          print("SOURCE_ORIGINAL_SPARSE_TICKS", list(ticks))
          PYSPARSE
            selection=(--capture-ticks "$CAPTURE_TICKS")
          else
            [[ "$ADVANCE_FRAMES" =~ ^[0-9]+$ ]] && [[ "$CAPTURE_FRAMES" =~ ^[0-9]+$ ]]
            (( 1 <= ADVANCE_FRAMES && ADVANCE_FRAMES <= 2500 ))
            (( 1 <= CAPTURE_FRAMES && CAPTURE_FRAMES <= 5 ))
            selection=(--advance-frames "$ADVANCE_FRAMES" --capture-frames "$CAPTURE_FRAMES")
          fi
          timeout 300s xvfb-run -a python3 -m tools.art.capture_original_mesen_ppu_raw \
            --rom reference/roms/retail/Uniracers_USA.sfc \
            --input-file tests/input/two-player-first-race.input \
            --mesen-for-ai-repo third_party/src/mesen-for-ai \
            --mesen-executable "$MESEN_BIN" \
            "${selection[@]}" "${rider_capture[@]}" --include-held-framebuffer \
            --out-dir "$RUNNER_TEMP/art4k-actual-ppu-raw"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.art.capture_original_mesen_ppu_raw import validate_snapshot_files, parse_capture_ticks
          root=Path(os.environ["RUNNER_TEMP"])/"art4k-actual-ppu-raw"
          report=json.loads((root/"manifest.json").read_text())
          validate_snapshot_files(root,report)
          advance=int(os.environ["ADVANCE_FRAMES"])
          count=int(os.environ["CAPTURE_FRAMES"])
          actual=[f["emulator_bridge_frame"] for f in report["frames"]]
          sparse=os.environ.get("CAPTURE_TICKS","")
          if sparse:
              desired=list(parse_capture_ticks(sparse))
              assert report["source_requested_capture_ticks"]==desired
              assert actual==desired
              print("SOURCE_ORIGINAL_SPARSE_CAPTURE_SHA_BOUND",desired)
          else:
              assert len(report["frames"])==count
              assert actual==list(range(advance+1,advance+count+1))
              assert "source_requested_capture_ticks" not in report
          assert not report["live_original_per_player_64x64_alpha_composition_verified"]
          assert not report["source_original_3d_camera_or_articulated_rig_verified"]
          assert report["original_held_framebuffer_P6_exported"] is True
          rider_capture=os.environ.get("RIDER_WRAM_CAPTURE","false")=="true"
          assert (report.get("source_original_rider_work_ram_0000_17ff_captured")
                  is True if rider_capture else
                  "source_original_rider_work_ram_0000_17ff_captured" not in report)
          assert report["source_original_snes_frame_skipping_disabled_requested"] is True
          assert report["original_PPU_RGB_to_source_OBJ_pixel_ownership_verified"] is False
          for row in report["frames"]:
              display=row["original_emulator_held_display_P6"]
              assert display["source_format"]=="P6"
              assert display["source_rgb_byte_length"]==3*display["source_display_width"]*display["source_display_height"]
              assert display["source_display_width"]>=256
              assert display["source_display_height"]>=200
          assert report["source_held_display_to_current_PPU_scanout_phase_independently_aligned"] is False
          assert report["source_held_display_RGB_reproducibility_across_runs_independently_verified"] is False
          original_screen_shas={f["emulator_bridge_frame"]:f["original_emulator_held_display_P6"]["sha256"]
                                for f in report["frames"]}
          if not sparse and (advance,count)==(1218,2):
              assert original_screen_shas=={
                  1219:"3db1ead6ef6da21dc5c085f38dbd3fe8c17e00d4eba7900ce1074beaa9358cfb",
                  1220:"2fdc8dbdcf55d971209b09922802f81d0c31ad75af90ba0c5cf3137d9e1150d3",
              }, original_screen_shas
          else:
              assert len(original_screen_shas)==len(actual)
              print("EXPLORATORY_ORIGINAL_FRAME_WINDOW_NOT_SOURCE_ART_APPROVED",
                    actual,original_screen_shas)
          print("ACTUAL_MESENCE_SNES_RAW_PPU_PLUS_P6",actual,"held_source_screen_with_no_OBJ_or_3D_claim")
          PY
          if [[ "$RIDER_WRAM_CAPTURE" == "true" ]]; then
            python3 -m tools.art.audit_original_mesen_rider_wram_fields \
              --source-dir "$RUNNER_TEMP/art4k-actual-ppu-raw" \
              --out "$RUNNER_TEMP/original-rider-candidate-words.json"
            python3 - <<'PYRIDER'
          import json,os
          from pathlib import Path
          from tools.art.audit_original_mesen_contiguous_24 import ANCHORS
          root=Path(os.environ["RUNNER_TEMP"])/"art4k-actual-ppu-raw"
          manifest=json.loads((root/"manifest.json").read_text())
          rail=json.loads((Path(os.environ["RUNNER_TEMP"])/"original-rider-candidate-words.json").read_text())
          ticks=[r["emulator_bridge_frame"] for r in manifest["frames"]]
          if ticks==list(range(1601,1625)):
              for tick,old_hashes in ANCHORS.items():
                  row=next(x for x in manifest["frames"] if x["emulator_bridge_frame"]==tick)
                  actual=tuple(row["raw_original_snes_ppu_memory"][key]["sha256"]
                      for key in ("oam","vram","cgram"))+(row["original_emulator_held_display_P6"]["sha256"],)
                  if actual!=old_hashes:
                      raise ValueError(f"new original rider rail disagrees with previously authenticated PPU tick {tick}")
              print("ART4K_ORIGINAL_RIDER_PPU_3_ANCHORS_MATCH_12_OF_12",sorted(ANCHORS))
          # This is source working RAM, not a recorded execution trace or
          # verified mapping from 1994 3D bones to the unapproved 2026 GLB.
          fields=("persistent_P1_orientation_04c7","persistent_P2_orientation_04c9",
                  "current_rider_angle_workspace_0f49","current_rider_wheel_phase_workspace_0f83",
                  "current_rider_signed_spin_speed_0f8f","current_rider_frame_workspace_0f77",
                  "current_rider_presentation_id_0f97","tile_DMA_pending_0306")
          result={"manifest_sha256":rail["source_capture_manifest_sha256"],
                  "source_original_ROM_sha256":rail["source_original_USA_ROM_sha256"],
                  "source_original_replay_sha256":rail["source_replay_sha256"],
                  "source_mesen_executable_sha256":rail["source_original_emulator_executable_sha256"],
                  "source_WRAM_is_post_frame_not_writer_trace":True,
                  "source_original_1994_3d_pose_verified":False,
                  "rows":[{"tick":r["original_emulator_bridge_tick"],
                      "wram_sha256":r["exact_original_wram_span_sha256"],
                      "candidate_raw_words":{field:r["candidate_original_ram_fields"][field]
                                            for field in fields},
                      "candidate_DMA_source_bank_slice_sha256":
                           r["candidate_transfer_list_byte_slices"]["source_bank_15a1"]["sha256"]}
                      for r in rail["source_rows"]]}
          print("ART4K_ORIGINAL_RIDER_WRAM_SOURCE_WITNESS_JSON",json.dumps(result,sort_keys=True,separators=(",",":")))
          PYRIDER
            # ONE-SHOT source preservation bridge: compare the second real
            # 24-tick replay to all 24 original WRAM hashes before emitting
            # bounded xz/base64 for a GitHub evidence blob.
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" &&
                  "$RESEARCH_HEAD_REF" == "art4k/optional-source-rider-wram-rail-20261104" ]]; then
              python3 - <<'PYWRAM'
          import base64,hashlib,json,lzma,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"art4k-actual-ppu-raw"
          old=json.loads('{"1601":"57ff1a4e9174410c95bef7c453a3aaf5bfc3a731e1b94a305c9f7848f3c1878e","1602":"77f899efefd6e00ad25ad9a6a87593ec8d982572f7f56b03a11c2b996560eba0","1603":"004a64a34dcd14e0275191c5d963f3d1ea99889eba0cae663b647beeb7b2678f","1604":"c146d5f6568b3829e39d2a3a846817cd5a7894005777c4d6e73f2ede7feb3f8c","1605":"9c0c04c914f76380b93857222fb81837331adf44c383c8f1d83fcdf57a6a6313","1606":"9d9025d67128bc0612e4ae565f88e36e67cd63aa15a5f8bbf87f598229b7f73e","1607":"21607dc841f230e96c3767aadef582f7f33dddb8226f676b472f54456f3e77d1","1608":"33c71e211f3303551e6159d6997b8968f9d157d471c0d4d87836167236ec19d7","1609":"2d30dad22e057ca744ae094d5d19ecb5ed17b1df5bfe387aaa89a893ba0bdb86","1610":"7ead4abc03b79439048be3954fb01a14a90e29f4f03add9a5fe663206ea996b5","1611":"35458c89986d52eadcd08be7b403b4442c5b4188d66233527e283c6d6fb14eb3","1612":"cdd9880bee862341746004353ed6f65a58076081f1e5380ad3abb51b376a7b93","1613":"6200d56bac764c7f9c6a5c42d264f389cabf31feab3b63f62e119fa8d8c8f3d6","1614":"e550ca8309b0913f2775a7a817ea789fa9dd4465cf35f195027d2579957cbbd7","1615":"973ef83c216547aefe88ff1be7b7f1593274e332ed51d1b6238b365e57e50b1f","1616":"0eb68561442bcdbf4a09654bfd9ab8be259b673dadc0b40d9eca19d32b20535f","1617":"7c95ffacb36b7b4b0600d8d750adf61eb066b683e5f0591674e60bc4624eb98f","1618":"7de2e894deaa6286e970aba13a8f3b3b13ac5d5c1ca6940c44f385cbcdaa5d10","1619":"2c3fe1871c697cd6b035a1fa16c4b33ffdcfdb466f1cc9fad557a1ddd3840072","1620":"8a6617328a4e84e93e3a9eba52c8a9179ba251450b1d3eb46cdd21d2f18be5b1","1621":"9854534298b59329fba3fc0d92787f9b141f0385dcaf966645037459242078d0","1622":"98cead4537897055ade8b47171960017eccf74fd25cea6146623efbd047d042c","1623":"5b031dcb4d5053c745a7e6c34f44abc3b02fdda641104c89b5793eecb2dd6b4d","1624":"77d2326d512cbab0c9b2930fae7b96608e3316cd98acfbcc5f0922a602db5034"}')
          rows=[]
          for tick in range(1601,1625):
              b=(root/f"frame-{tick:06d}-wram-0000-17ff.bin").read_bytes()
              if len(b)!=6144 or hashlib.sha256(b).hexdigest()!=old[str(tick)]:
                  raise ValueError(f"second 24-tick original WRAM replay differs at {tick}")
              rows.append(b)
          raw=b"".join(rows)
          if len(raw)!=147456 or hashlib.sha256(raw).hexdigest()!="c81fd37d4475a9627a658b70e8fc23948043b700cda0746320d8064a0fb489db":
              raise ValueError("original 24-tick combined WRAM source identity mismatch")
          packed=lzma.compress(raw,preset=9)
          info={"schema":"UR-ART4K-24-ORIGINAL-MESEN-WRAM-RAW-XZ/1",
              "original_source_run_first":41773517842,
              "source_second_run_id":os.environ.get("GITHUB_RUN_ID"),
              "source_ticks":list(range(1601,1625)),
              "original_source_raw_Wram_bytes":len(raw),
              "sha256_original_raw_concat":hashlib.sha256(raw).hexdigest(),
              "sha256_xz":hashlib.sha256(packed).hexdigest(),
              "xz_size":len(packed),
              "frame_sha256_by_tick":old,
              "source_1994_3d_pose_recovered":False}
          print("ART4K_ORIGINAL_RIDER_WRAM24_EXACT_REPLAY_FREEZE",json.dumps(info,sort_keys=True,separators=(",",":")))
          print("ART4K_ORIGINAL_RIDER_WRAM24_XZ_BASE64",base64.b64encode(packed).decode("ascii"))
          PYWRAM
            fi
          fi

      - name: Upload SHA-bound original emulator PPU raw RAM states
        if: ${{ !inputs.seed_only }}
        uses: actions/upload-artifact@v4
        with:
          name: art4k-original-mesen-ppu-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/art4k-actual-ppu-raw/
          retention-days: 7
          if-no-files-found: error

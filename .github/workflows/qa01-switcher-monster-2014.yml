name: QA-01 2014 Switcher to Monster genuine original/native experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/qa01-switcher-monster-2014.yml"
      - "tools/qa01_switcher_monster_handoff.py"
      - "tests/unit/test_qa01_switcher_next_monster.py"
      - "tools/probe_original_event_complete.py"
      - "tools/bootstrap_toolchain.py"
      - "tests/unit/test_probe_original_event_complete.py"

permissions:
  contents: read

concurrency:
  group: qa01-original-switcher-monster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-native-switcher-monster:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out canonical original USA source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out pinned Baldosa native guest plus framework
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/uniracers-recomp
          ref: 10b864b9d14a7b7416dd909eb7b054c88faef101
          path: baldosa
          submodules: recursive
          persist-credentials: false

      - name: Prove exact original input and pinned guest identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rom.py reference/roms/retail/Uniracers_USA.sfc
          test "$(git -C baldosa rev-parse HEAD)" = 10b864b9d14a7b7416dd909eb7b054c88faef101
          test "$(git -C baldosa/snesrecomp rev-parse HEAD)" = 075fbe4c8e0d97b0013be541795c39cb644a9709
          test -s reference/imported/tas-bots/dessyreqt-4250-submission.smv
          python3 -m unittest discover -s tests/unit -p test_probe_original_event_complete.py
          python3 -m unittest discover -s tests/unit -p test_qa01_bowl_next_switcher.py
          python3 -m unittest discover -s tests/unit -p test_qa01_bowl_source_movie_memory.py
          python3 -m unittest discover -s tests/unit -p test_qa01_bowl_cold_record.py
          python3 -m unittest discover -s tests/unit -p test_qa01_bowl_handoff_raw_archive_audit.py
          python3 -m unittest discover -s tests/unit -p test_qa01_event_route_artifact_audit.py
          python3 -m unittest discover -s tests/unit -p test_qa01_switcher_next_monster.py

      - name: Build one original Snes9x and one native Baldosa guest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config build-essential cmake libsdl2-dev \
            libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgles-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev xvfb
          python3 tools/bootstrap_toolchain.py --offline --tool snes9x-libretro --jobs 2
          cmake -S baldosa/snesrecomp/tools/snesref \
            -B "$RUNNER_TEMP/switcher-snesref" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/switcher-snesref" -j2
          # QA-only input-file transport already validated in the Zoo route.
          # Absolutely no guest code, original ROM, SRAM or gameplay edit.
          python3 tools/baldosa_qa_dense_scene_input_patch.py \
            --host baldosa/snesrecomp/runner/src/desktop/host_main.c
          cmake -S baldosa -B baldosa/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF -DRECOMP_UI_SDL3=OFF
          cmake --build baldosa/build --target UniracersSNESRecomp -j3
          test -x baldosa/build/UniracersSNESRecomp
          test -x "$RUNNER_TEMP/switcher-snesref/snesref"

      - name: Execute source-derived Switcher result to authentic next Monster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa01-switcher-monster"
          set +e
          timeout --signal=TERM --kill-after=30s 15m \
            python3 tools/probe_original_event_complete.py \
              --case switcher \
              --native-backend pinned-baldosa \
              --source-followthrough \
              --switcher-next-monster \
              --switcher-same-host-penultimate \
              --switcher-same-host-full-memory-offsets \
              --snesref "$RUNNER_TEMP/switcher-snesref/snesref" \
              --core "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
              --native "$GITHUB_WORKSPACE/baldosa/build/UniracersSNESRecomp" \
              --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
              --work-dir "$RUNNER_TEMP/qa01-switcher-monster" \
              --json-out "$RUNNER_TEMP/qa01-switcher-monster/switcher-report.json" \
              > "$RUNNER_TEMP/qa01-switcher-monster/attempt.log" 2>&1
          rc=$?
          set -e
          echo "Switcher producer exit: $rc; any bounded next-course diagnostic carries zero event credit."
          tail -n 50 "$RUNNER_TEMP/qa01-switcher-monster/attempt.log"
          if [ -s "$RUNNER_TEMP/qa01-switcher-monster/switcher-report.json" ]; then
            python3 - "$RUNNER_TEMP/qa01-switcher-monster/switcher-report.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          hand=data.get("switcher_next_monster_handoff") or {}
          print(json.dumps({
            "case":data.get("course_id"),
            "source_result_movie_frame":data.get("original_source_event",{}).get("original_result_frame"),
            "source_next_monster":data.get("original_source_event",{}).get("source_next_monster"),
            "event_relative_result_clocks":data.get("comparison",{}).get("terminal_result_guest_frame"),
            "bounded_next_monster":{k:v for k,v in hand.items() if k!="samples"},
            "strict_original_native_candidate":data.get("comparison",{}).get("paired_event_candidate"),
            "official_usa_accepted":0
          },sort_keys=True,indent=2))
          PY
          fi
          exit "$rc"

      - name: Retain original bounded Switcher progression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa01-switcher-next-monster-original-native
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/qa01-switcher-monster/attempt.log
            ${{ runner.temp }}/qa01-switcher-monster/switcher-report.json
            ${{ runner.temp }}/qa01-switcher-monster/switcher/source/source-scan.log
            ${{ runner.temp }}/qa01-switcher-monster/switcher/source/source-event-diagnostic.json
            ${{ runner.temp }}/qa01-switcher-monster/switcher/source/source-entry.log
            ${{ runner.temp }}/qa01-switcher-monster/switcher/calibration/reference.log
            ${{ runner.temp }}/qa01-switcher-monster/switcher/calibration/native.log
            ${{ runner.temp }}/qa01-switcher-monster/switcher/replay/reference.log
            ${{ runner.temp }}/qa01-switcher-monster/switcher/replay/native.log
            ${{ runner.temp }}/qa01-switcher-monster/switcher/replay/ref/switcher-next-monster-*.wram.bin
            ${{ runner.temp }}/qa01-switcher-monster/switcher/replay/ref/switcher-next-monster-*.sram.bin
            ${{ runner.temp }}/qa01-switcher-monster/switcher/replay/native/switcher-next-monster-*.wram.bin
            ${{ runner.temp }}/qa01-switcher-monster/switcher/replay/native/switcher-next-monster-*.sram.bin
            ${{ runner.temp }}/qa01-switcher-monster/switcher/original-movie-meta.json

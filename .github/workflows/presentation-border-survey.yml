name: One-shot presentation border/effects survey

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/summarize_presentation_geometry.py"
      - "tests/input/title-transition-recon.script"
      - "tests/input/reach-first-race.script"
      - ".github/workflows/presentation-border-survey.yml"

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Build patched Snes9x and snesref
        run: |
          python3 tools/bootstrap_toolchain.py --tool snes9x-libretro --jobs 2
          cmake -S snesrecomp/tools/snesref -B "$RUNNER_TEMP/snesref-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/snesref-build" -j2

      - name: Capture title/front-end timeline
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/title"
          mkdir -p "$D"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/title-transition-recon.script" \
          SNESREF_DUMP_DIR="$D" \
            "$RUNNER_TEMP/snesref-build/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 tools/summarize_presentation_geometry.py "$D" --json-out presentation-title.json
          cat presentation-title.json

      - name: Capture first-race timeline
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/race"
          mkdir -p "$D"
          SNESREF_HEADLESS=1 SNESREF_FAST=1 SNESREF_WRAM_FILL=0 \
          SNESREF_SCRIPT="$GITHUB_WORKSPACE/tests/input/reach-first-race.script" \
          SNESREF_DUMP_DIR="$D" \
            "$RUNNER_TEMP/snesref-build/snesref" \
            "$GITHUB_WORKSPACE/.tools/src/snes9x-libretro/libretro/snes9x_libretro.so" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          python3 tools/summarize_presentation_geometry.py "$D" --json-out presentation-race.json
          cat presentation-race.json

      - uses: actions/upload-artifact@v4
        with:
          name: presentation-border-effects-survey
          path: |
            presentation-title.json
            presentation-race.json

name: Owner HP Pathfinder bounded CPU probe
on:
  push:
    branches: [ops/hp-windows-native-smoke-experiment-20261029]
    paths: ['.github/workflows/owner-hp-pathfinder-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-hp-pathfinder-one-shot
  cancel-in-progress: true
jobs:
  cpu-probe:
    name: HP Windows Pathfinder solver
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Expose Node.js and Git to Windows service
        shell: cmd
        run: |
          echo C:\Program Files\nodejs>>"%GITHUB_PATH%"
          echo C:\Program Files\Git\cmd>>"%GITHUB_PATH%"
      - name: Checkout Pathfinder Windows CLI fix for validation
        uses: actions/checkout@v4
        with:
          repository: gamesbyian/Pathfinder-Game
          # Exact merged Pathfinder main with Windows fixes, for reproducible throughput evidence.
          ref: f9667cf7db30ca4c893ec6e7a58b971dd443e321
          path: pathfinder
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            package.json
            package-lock.json
            scripts
            modules
            data/levels.json
            data/stress/stress-levels-random.json
          sparse-checkout-cone-mode: false
      - name: Install solver dependencies
        shell: cmd
        working-directory: pathfinder
        run: |
          node --version
          call npm --version
          call npm ci --include=dev --no-audit --no-fund
          if errorlevel 1 exit /b 1
          if not exist node_modules\esbuild\package.json exit /b 7
      - name: Verify cross-platform bundled CLI smoke regression
        shell: cmd
        working-directory: pathfinder
        run: call npm run test:run-bundled-cli
      - name: Run bounded real Pathfinder solver work
        shell: cmd
        working-directory: pathfinder
        run: |
          if not exist "%RUNNER_TEMP%\hp-pathfinder" mkdir "%RUNNER_TEMP%\hp-pathfinder"
          node scripts/run-bundled.mjs scripts/solver-speed-probe.mjs --corpus=published --count=16 --work-budget=250000 --budget-ms=10000 --out="%RUNNER_TEMP%\hp-pathfinder\speed.json"
          if errorlevel 1 exit /b 1
          if not exist "%RUNNER_TEMP%\hp-pathfinder\speed.json" exit /b 9
          node -e "const f=require('fs'); const a=JSON.parse(f.readFileSync(process.argv[1],'utf8')); if (!Array.isArray(a.rows) || a.rows.length!==16 || a.errorCount!==0 || !Number.isFinite(a.totalMs) || a.totalMs<=0) process.exit(10)" "%RUNNER_TEMP%\hp-pathfinder\speed.json"
          if errorlevel 1 exit /b 1
          node scripts/run-bundled.mjs scripts/solver-speed-probe.mjs --corpus=corpus2 --count=12 --work-budget=2000000 --budget-ms=30000 --out="%RUNNER_TEMP%\hp-pathfinder\corpus2-speed.json"
          if errorlevel 1 exit /b 1
          node -e "const f=require('fs'); const a=JSON.parse(f.readFileSync(process.argv[1],'utf8')); if (!Array.isArray(a.rows) || a.rows.length!==12 || a.errorCount!==0 || !Number.isFinite(a.totalMs) || a.totalMs<=0) process.exit(11)" "%RUNNER_TEMP%\hp-pathfinder\corpus2-speed.json"
          if errorlevel 1 exit /b 1
          git rev-parse HEAD > "%RUNNER_TEMP%\hp-pathfinder\source-sha.txt"
      - name: Retain source-bound throughput data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hp-pathfinder-bounded-solver-probe
          path: ${{ runner.temp }}/hp-pathfinder/
          if-no-files-found: warn
          retention-days: 7

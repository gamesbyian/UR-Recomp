name: Native build compiler cache
description: >-
  ccache for the generated Uniracers native candidate and SDL3. Keys are the
  compiler's own content hash of the preprocessed source plus flags, so a stale
  or partial cache can only miss; it never substitutes a different build.
runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ccache
    - name: Restore/save ccache directory
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ur-native-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
        restore-keys: |
          ur-native-ccache-${{ runner.os }}-
    - name: Route CMake C/C++ compiles through ccache
      shell: bash
      run: |
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_MAXSIZE=400M"
          echo "CCACHE_COMPRESS=1"
          # Candidate projects live under different $RUNNER_TEMP subdirectories
          # per workflow; rewriting paths under the runner root lets them share.
          echo "CCACHE_BASEDIR=$(dirname "$RUNNER_TEMP")"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"

      - name: UI League table reconnaissance
        if: matrix.shard == 'b'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/ui-league-table.script"
          LOG="$RUNNER_TEMP/ui-league-table.log"
          DUMPS="$RUNNER_TEMP/ui-league-dumps"
          mkdir -p "$DUMPS"

          echo "== scripted UI League table reconnaissance =="

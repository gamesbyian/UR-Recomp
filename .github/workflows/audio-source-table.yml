name: One-shot audio source-table trace

on:
  push:
    branches:
      - chatgpt/audio-source-table-2026-09-29
    paths:
      - .github/workflows/audio-source-table.yml
      - tools/trace_audio_source_table.py
      - tools/trace_native_wram_writers.py
      - tests/input/reach-first-race.script

permissions:
  contents: read

jobs:
  trace-audio-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Scan direct calls to APU transfer entry and wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio-source"
          python3 - <<'PY'
          import json
          from pathlib import Path

          rom_path = Path("reference/roms/retail/Uniracers_USA.sfc")
          data = rom_path.read_bytes()

          patterns = {
              "JSR_8298": bytes.fromhex("20 98 82"),
              "JSR_8294": bytes.fromhex("20 94 82"),
              "JSL_828298": bytes.fromhex("22 98 82 82"),
              "JSL_028298": bytes.fromhex("22 98 82 02"),
              "JSL_828294": bytes.fromhex("22 94 82 82"),
              "JSL_028294": bytes.fromhex("22 94 82 02"),
          }

          def cpu_addr(offset):
              bank = 0x80 | (offset // 0x8000)
              addr = 0x8000 + (offset % 0x8000)
              return (bank << 16) | addr

          out = {"schema_version": 1, "patterns": {}}
          for name, pat in patterns.items():
              rows = []
              start = 0
              while True:
                  pos = data.find(pat, start)
                  if pos < 0:
                      break
                  pc = cpu_addr(pos)
                  lo = max(0, pos - 24)
                  hi = min(len(data), pos + len(pat) + 40)
                  rows.append({
                      "rom_offset": pos,
                      "rom_offset_hex": f"0x{pos:06X}",
                      "cpu_pc24": f"0x{pc:06X}",
                      "same_bank_82_for_jsr": ((pc >> 16) & 0xFF) == 0x82,
                      "context_start_hex": f"0x{lo:06X}",
                      "context_hex": data[lo:hi].hex(" "),
                  })
                  start = pos + 1
              out["patterns"][name] = rows

          target = Path(__import__("os").environ["RUNNER_TEMP"]) / "audio-source" / "apu-transfer-callsites.json"
          target.write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps({k: len(v) for k, v in out["patterns"].items()}, indent=2))
          PY

      - name: Generate project and build trace target
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/trace-project"
          mkdir -p "$ROOT"
          sh snesrecomp/tools/new_project/setup_project.sh \
            --rom "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" \
            --dir "$ROOT" \
            --name "Uniracers" \
            --players 2 \
            --yes \
            --no-ci \
            --no-fetch-boxart \
            --no-recomp-ui \
            --no-netplay \
            --no-github \
            --generate \
            --snesrecomp-ref cd5875cbdaf19f5e324272b1f8051d671fce9215

          PROJECT="$ROOT/UniracersSNESRecomp"

          python3 - "$PROJECT/src/host_contract.c" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "#include <stdint.h>\n"
          if marker not in s:
              raise SystemExit("host_contract.c include marker not found")
          s = s.replace(
              marker,
              marker + "\n#if !defined(SNESRECOMP_TRACE) || !SNESRECOMP_TRACE\n",
              1,
          )
          s += "\n#endif /* production debug-hook stubs */\n"
          p.write_text(s)
          PY

          cmake -S "$PROJECT" -B "$PROJECT/build-trace" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ENABLE_TRACE=ON
          cmake --build "$PROJECT/build-trace" -j2
          test -x "$PROJECT/build-trace/UniracersSNESRecomp"

      - name: Start held deterministic first-race route
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audio-source"
          PROJECT="$RUNNER_TEMP/trace-project/UniracersSNESRecomp"
          SCRIPT="$RUNNER_TEMP/reach-first-race-hold.script"
          sed '/^[[:space:]]*quit[[:space:]]*$/d' "$GITHUB_WORKSPACE/tests/input/reach-first-race.script" > "$SCRIPT"
          SNESRECOMP_DEBUG_PORT=4377 SDL_AUDIODRIVER=dummy \
            timeout 300s xvfb-run -a "$PROJECT/build-trace/UniracersSNESRecomp" \
            "$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc" --paused --script "$SCRIPT" \
            >"$OUT/native-audio-source-host.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/audio-source-host.pid"

      - name: Capture direct-page pointer writers
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audio-source"
          python3 tools/trace_native_wram_writers.py \
            --port 4377 --command-timeout 45 --coarse-until 900 --coarse-step 25 --max-frames 1400 \
            --address 0x00 --address 0x01 --address 0x02 \
            --address 0x63 --address 0x64 --address 0x65 --address 0x6f \
            --json-out "$OUT/audio-source-writers.json"

      - name: Resolve transfer PC and ROM source windows
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audio-source"
          python3 tools/trace_audio_source_table.py \
            --writers-json "$OUT/audio-source-writers.json" \
            --port 4377 --command-timeout 60 \
            --json-out "$OUT/audio-source-table-trace.json"

          python3 - "$OUT/audio-source-table-trace.json" <<'PY'
          import json
          import sys
          d = json.load(open(sys.argv[1]))
          print(json.dumps({
              "runtime_pcs": d["runtime_pcs"],
              "observed_D_values": d["observed_D_values"],
              "target_hits": d["cpu_trace"]["target_hits"],
              "captures": [
                  {k: r.get(k) for k in (
                      "block_index", "frame", "pc24",
                      "entry_stream_pointer", "entry_stream_file_offset",
                      "working_pointer_63", "working_63_file_offset"
                  )}
                  for r in d["captures"]
              ],
              "source_windows": [
                  {k: r.get(k) for k in ("roles", "source_pointer", "source_file_offset", "cart_len")}
                  for r in d["source_cart_windows"]
              ],
              "audio_events": len(d["audio_events"]),
          }, indent=2))
          PY

      - name: Stop trace host
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/audio-source-host.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/audio-source-host.pid")" 2>/dev/null || true
          fi
          echo "== host log tail =="
          tail -n 140 "$RUNNER_TEMP/audio-source/native-audio-source-host.log" 2>/dev/null || true

      - name: Upload source-table evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniracers-audio-source-table
          path: |
            ${{ runner.temp }}/audio-source/audio-source-table-trace.json
            ${{ runner.temp }}/audio-source/audio-source-writers.json
            ${{ runner.temp }}/audio-source/apu-transfer-callsites.json
            ${{ runner.temp }}/audio-source/native-audio-source-host.log
          if-no-files-found: warn
          retention-days: 2

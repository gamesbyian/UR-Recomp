            kill -0 "$PID"

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          '

          cat "$LOG"
          echo "UR_PAUSE_RUN_DATA_RESULT=authoritative_timer_opened_and_closed"

      - name: Modern Exit to Frontend acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"

          run_exit_case() {
            local NAME="$1"
            local MODE="$2"
            local SCRIPT="$3"
            local LOG="$RUNNER_TEMP/exit-frontend-${NAME}.log"
            local DUMPS="$RUNNER_TEMP/exit-frontend-${NAME}-dumps"
            rm -rf "$DUMPS"
            mkdir -p "$DUMPS"

            set +e
            SDL_AUDIODRIVER=dummy \
            UR_PRODUCT_DIAGNOSTICS=1 \
            UR_EXIT_FRONTEND_ACCEPTANCE="$MODE" \
            SNESRECOMP_DUMP_DIR="$DUMPS" \
            timeout 140s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" \
              >"$LOG" 2>&1
            local STATUS=$?
            set -e

            cat "$LOG"
            test "$STATUS" -eq 0
            grep -q "UR_EXIT_FRONTEND ACCEPTANCE_TRIGGER" "$LOG"
            grep -q "UR_EXIT_FRONTEND REQUESTED" "$LOG"
            grep -q "UR_SESSION_REBOOT_SRAM_RESTORED digest=" "$LOG"
            grep -q "UR_EXIT_FRONTEND FRONTEND_READY menu=D7" "$LOG"
            grep -q "UR_EXIT_FRONTEND FRONTEND_USABLE menu=3C" "$LOG"
            test -s "$DUMPS/exit-frontend-ready.wram.bin"
            test -s "$DUMPS/exit-frontend-usable.wram.bin"

            local BEFORE
            local RESTORED
            BEFORE=$(grep "UR_EXIT_FRONTEND REQUESTED" "$LOG" | tail -n1 | sed -E 's/.*sram=([0-9A-F]+).*/\1/')
            RESTORED=$(grep "UR_SESSION_REBOOT_SRAM_RESTORED" "$LOG" | tail -n1 | sed -E 's/.*digest=([0-9A-F]+).*/\1/')
            test -n "$BEFORE"
            test "$BEFORE" = "$RESTORED"

            if grep -q "UR_PAUSE_QUIT REQUESTED" "$LOG"; then
              echo "::error::Exit to Frontend crossed into Quit Desktop"
              exit 1
            fi

            echo "UR_EXIT_FRONTEND_CASE=${NAME} preserved_sram=${BEFORE}"
          }

          run_exit_case \
            active-race \
            active \
            "$GITHUB_WORKSPACE/tests/input/modern-exit-frontend-active.script"
          run_exit_case \
            results-pause \
            results \
            "$GITHUB_WORKSPACE/tests/input/modern-exit-frontend-results.script"

          echo "UR_EXIT_FRONTEND_RESULT=active_and_results_returned_to_usable_frontend_with_sram_preserved"

      - name: Modern pause Quit to Desktop acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.exe }}"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          SCRIPT="$GITHUB_WORKSPACE/tests/input/modern-focus-pause.script"
          LOG="$RUNNER_TEMP/pause-quit.log"
          DUMPS="$RUNNER_TEMP/pause-quit-dumps"
          mkdir -p "$DUMPS"

          timeout 90s xvfb-run -a bash -c '
            set -euo pipefail
            export SDL_AUDIODRIVER=dummy
            export UR_PRODUCT_DIAGNOSTICS=1
            export SNESRECOMP_DUMP_DIR="'"$DUMPS"'"
            "'"$EXE"'" "'"$ROM"'" --script "'"$SCRIPT"'" >"'"$LOG"'" 2>&1 &
            PID=$!

            for _ in $(seq 1 600); do
              [ -s "'"$DUMPS"'/race-entered.wram.bin" ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            [ -s "'"$DUMPS"'/race-entered.wram.bin" ]

            WIN=""
            for _ in $(seq 1 100); do
              WIN=$(xdotool search --pid "$PID" 2>/dev/null | head -n1 || true)
              [ -n "$WIN" ] && break
              sleep 0.1
            done
            [ -n "$WIN" ]

            xdotool windowfocus "$WIN"
            xdotool key Escape
            sleep 0.2

            # Active race rows:
            # Resume -> Restart -> Options -> Controls -> Run Data ->
            # Exit Frontend -> Quit Desktop.
            for _ in 1 2 3 4 5 6; do xdotool key Down; done
            xdotool key Return

            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_QUIT CONFIRM_OPENED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_QUIT CONFIRM_OPENED" "'"$LOG"'"
            kill -0 "$PID"

            # First prove cancellation leaves the native process alive and paused.
            xdotool key Escape
            for _ in $(seq 1 100); do
              grep -q "UR_PAUSE_QUIT CANCELLED" "'"$LOG"'" && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            grep -q "UR_PAUSE_QUIT CANCELLED" "'"$LOG"'"
            kill -0 "$PID"

            # Selection remains on Quit. Re-open and confirm.
            xdotool key Return
            for _ in $(seq 1 100); do
              [ "$(grep -c "UR_PAUSE_QUIT CONFIRM_OPENED" "'"$LOG"'")" -ge 2 ] && break
              kill -0 "$PID" 2>/dev/null || exit 1
              sleep 0.1
            done
            xdotool key Return

            set +e
            for _ in $(seq 1 100); do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 0.1
            done
            wait "$PID"
            STATUS=$?
            set -e

            grep -q "UR_PAUSE_QUIT REQUESTED" "'"$LOG"'"
            if [ "$STATUS" -ne 0 ]; then
              echo "quit process exited with status $STATUS"
              exit "$STATUS"
            fi
          '

          cat "$LOG"
          echo "UR_PAUSE_QUIT_RESULT=cancelled_then_clean_exit"


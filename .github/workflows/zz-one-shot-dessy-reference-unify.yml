name: One-shot Dessy intake and reference root consolidation
on:
  push:
    branches:
      - chatgpt/dessy-intake-and-reference-unify-2026-09-30

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dessy-intake-and-reference-unify-2026-09-30
          fetch-depth: 0

      - name: Finish Dessy intake metadata and ignored SRAM
        shell: bash
        run: |
          set -euo pipefail

          git show origin/main:"references/imported/Uniracers Stuff.zip" > /tmp/dessy.zip
          rm -rf /tmp/dessy-sram
          mkdir -p /tmp/dessy-sram
          unzip -q /tmp/dessy.zip 'SRAM/*' -d /tmp/dessy-sram
          mkdir -p "reference/imported/reverse-engineering/dessyreqt/SRAM"
          cp /tmp/dessy-sram/SRAM/*.srm "reference/imported/reverse-engineering/dessyreqt/SRAM/"
          git add -f "reference/imported/reverse-engineering/dessyreqt/SRAM/"*.srm

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          readme = Path("reference/README.md")
          text = readme.read_text(encoding="utf-8")
          start = text.index("## `reference/` versus `reference/`")
          end = text.index("This directory records", start)
          replacement = """## Unified `reference/` tree

          The repository uses a single `reference/` root for all preserved research inputs and evidence.

          - `reference/roms/` contains preserved ROM builds used as project inputs.
          - `reference/tools/` contains project-local historical/reference tool packages.
          - `reference/imported/` contains provenance-managed third-party research artifacts.
          - `reference/notes/` contains project-authored summaries and technical observations.
          - `reference/catalog.yml` and `reference/evidence-worklist.json` are the source registry and evidence queue.

          """
          readme.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          agents = Path("AGENTS.md")
          text = agents.read_text(encoding="utf-8")
          text = text.replace(
              "- `reference/` contains project-input and project-local reference material needed to reproduce work, including preserved ROM builds and historical tool packages.\n"
              "- `reference/` is the provenance-managed external research corpus: imported third-party evidence under `reference/imported/`, project summaries under `reference/notes/`, and the source registry in `reference/catalog.yml`.",
              "- `reference/` is the unified research/reference root: preserved ROM builds and historical tool packages live alongside provenance-managed external evidence under `reference/imported/`, project summaries under `reference/notes/`, and the source registry in `reference/catalog.yml`."
          )
          agents.write_text(text, encoding="utf-8")

          manifest_path = Path("reference/imported/MANIFEST.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          data["policy"] = data["policy"].replace("references/imported/", "reference/imported/")
          for entry in data["entries"]:
              entry["path"] = entry["path"].replace("references/imported/", "reference/imported/")

          root = Path("reference/imported/reverse-engineering/dessyreqt")
          existing = {e["path"] for e in data["entries"]}
          def blob_sha(path):
              return subprocess.check_output(["git","hash-object",str(path)], text=True).strip()
          def category(rel):
              top = rel.parts[0] if rel.parts else ""
              return {
                  "Scripts":"historical-bot-source",
                  "Glitches":"historical-tas-movie",
                  "Maps":"historical-course-map",
                  "SRAM":"historical-save-state",
                  "Watches":"historical-memory-watch",
                  "Docs":"historical-research-document",
              }.get(top, "historical-reverse-engineering")
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rel = path.relative_to(root)
              spath = path.as_posix()
              if spath in existing:
                  continue
              data["entries"].append({
                  "path": spath,
                  "category": category(rel),
                  "size": path.stat().st_size,
                  "git_blob_sha1": blob_sha(path),
                  "review_status": "direct-recovery-unreviewed"
              })
          manifest_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

          git add AGENTS.md reference/README.md reference/imported/MANIFEST.json
          test "$(git ls-files 'reference/imported/reverse-engineering/dessyreqt/**' | wc -l)" -eq 80
          git status --short

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finish Dessyreqt intake metadata"
          git push origin HEAD:chatgpt/dessy-intake-and-reference-unify-2026-09-30

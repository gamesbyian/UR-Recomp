name: UR Modern startup diagnostic ONE-SHOT
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/ur-modern-startup-diagnostic-once.yml"]
permissions:
  actions: read
jobs:
  logs:
    if: github.event.pull_request.head.ref == 'media/native-modern-root-footage-20261010'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read native startup log from existing failed run, no guest build
        run: |
          set -euo pipefail
          mkdir -p logs
          gh run download 38094399496 --repo gamesbyian/UR-Recomp --name ur-modern-native-source-38094399496 --dir logs
          find logs -type f -maxdepth 5 -printf '%p %s bytes\n'
          for f in $(find logs -name log.txt); do echo "==== $f"; tail -n 120 "$f"; done

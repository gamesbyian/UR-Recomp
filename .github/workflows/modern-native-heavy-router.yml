concurrency:
  group: modern-native-heavy-router-${{ github.ref }}
  # Preserve deliberately launched long evidence; superseded PRs may cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.classify.outputs.shared || steps.manual.outputs.shared }}
      onboarding: ${{ steps.classify.outputs.onboarding || steps.manual.outputs.onboarding }}
      ui: ${{ steps.classify.outputs.ui || steps.manual.outputs.ui }}
      any_heavy: ${{ steps.classify.outputs.any_heavy || steps.manual.outputs.any_heavy }}
    steps:
      - name: Check out PR head and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Collect changed paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # PR path filters use merge-base (three-dot) diffs.
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > "$RUNNER_TEMP/modern-native-changed-paths.txt"
          cat "$RUNNER_TEMP/modern-native-changed-paths.txt"

      - name: Classify heavyweight Modern suites
        if: github.event_name == 'pull_request'
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          selection=$(python3 tools/classify_modern_native_ci.py \
            --paths-file "$RUNNER_TEMP/modern-native-changed-paths.txt" \
            --github-output "$GITHUB_OUTPUT")
          echo "$selection"
          {
            echo "### Modern native CI route"
            echo
            echo "Changed PR paths: $(wc -l < "$RUNNER_TEMP/modern-native-changed-paths.txt")"
            echo
            echo "Suite selection: \`$selection\`"
            echo
            echo "A canonical native build is shared whenever at least two suites are selected."
          } >> "$GITHUB_STEP_SUMMARY"
          # A triggered router with no selected suite means the two path
          # policies have diverged; report the invariant instead of green no-op.
          grep -qE '"(shared|onboarding|ui)": true' <<< "$selection" || {
            echo "::error::native router triggered without an owning suite"
            exit 1
          }

      - name: Select established suite cohort for manual campaign
        if: github.event_name == 'workflow_dispatch'
        id: manual
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'shared=true'
            echo 'onboarding=true'
            echo 'ui=true'
            echo 'any_heavy=true'
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Manual Modern candidate campaign'
            echo
            echo 'All three existing Linux-native suites are selected. One canonical build is shared.'
            echo 'The optional Windows package is an independently built legacy candidate at the same source commit.'
            echo 'Neither branch certifies Baldosa integration, original/native event parity or physical hardware.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: classify
    outputs:
      candidate_sha256: ${{ steps.digest.outputs.candidate_sha256 }}
    if: github.event_name == 'workflow_dispatch' || (needs.classify.outputs.shared == 'true' && needs.classify.outputs.onboarding == 'true') || (needs.classify.outputs.shared == 'true' && needs.classify.outputs.ui == 'true') || (needs.classify.outputs.onboarding == 'true' && needs.classify.outputs.ui == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install desktop build dependencies
        shell: bash
        run: |
          cmake --version
          ninja --version
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config \
            libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev libpulse-dev libxss-dev libxtst-dev

      - name: Enable native compiler cache
        uses: ./.github/actions/native-build-cache

      - name: Verify canonical ROM
        run: python3 tools/verify_rom.py "reference/roms/retail/Uniracers_USA.sfc"

      - name: Stage repository-owned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_toolchain.py --offline --tool snesrecomp --clone-only
          python3 tools/bootstrap_toolchain.py --offline --tool sdl3 --clone-only
          test -f .tools/src/sdl3/SDL3-3.4.10/CMakeLists.txt
          test -f .tools/src/snesrecomp/tools/new_project/setup_project.sh
          test -f .tools/src/snesrecomp/runner/runner.cmake
          test ! -e .tools/src/snesrecomp/lib/recomp-net/CMakeLists.txt
          test ! -e .tools/src/snesrecomp/lib/retcomm-rbengine/CMakeLists.txt

      - name: Build canonical Modern native candidate
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/.tools/src/snesrecomp"
          TMP="$RUNNER_TEMP/modern-native-canonical"
          ROM="$GITHUB_WORKSPACE/reference/roms/retail/Uniracers_USA.sfc"
          mkdir -p "$TMP"

          SNESRECOMP_ROOT="$FRAMEWORK" \
            sh "$FRAMEWORK/tools/new_project/setup_project.sh" \
              --rom "$ROM" \
              --dir "$TMP" \
              --name "Uniracers" \
              --players 2 \
              --yes \
              --no-ci \
              --no-fetch-boxart \
              --no-recomp-ui \
              --no-netplay \
              --no-github \
              --no-submodules \
              --no-generate \
              --no-build

          ROOT="$TMP/UniracersSNESRecomp"
          python3 tools/prepare_native_widescreen_product.py \
            --framework "$FRAMEWORK" \
            --project "$ROOT" \
            --rom "$ROM" \
            --json-out "$RUNNER_TEMP/modern-native-canonical-prepare.json"
          grep -q '"product_ready": true' "$RUNNER_TEMP/modern-native-canonical-prepare.json"

          python3 tools/patch_modern_product_host.py \
            "$ROOT/src/main.c" \
            --game-rtl "$ROOT/src/game_rtl.c" \
            --cmake "$ROOT/CMakeLists.txt"

          grep -q "ur_uniracers_product_after_run_frame" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_key_down" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_gamepad_button" "$ROOT/src/main.c"
          grep -q "ur_uniracers_product_system_overlay" "$ROOT/src/main.c"
          grep -q "ur_uniracers_modern_native_widescreen_enabled" "$ROOT/src/main.c"
          grep -q "uniracers_modern_host.cpp" "$ROOT/CMakeLists.txt"
          grep -q "\.session_reset = &GameSessionReset" "$ROOT/src/game_rtl.c"

          cmake -S "$ROOT" -B "$ROOT/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ROOT="$FRAMEWORK" \
            -DSNESRECOMP_SDL_BACKEND=SDL3 \
            -DSNESRECOMP_SDL3_FETCH=ON \
            -DSNESRECOMP_SDL3_SOURCE_DIR="$GITHUB_WORKSPACE/.tools/src/sdl3/SDL3-3.4.10"
          cmake --build "$ROOT/build" -j"$(nproc)"
          test -x "$ROOT/build/UniracersSNESRecomp"

          tar -czf "$RUNNER_TEMP/modern-native-canonical.tar.gz" \
            -C "$RUNNER_TEMP" modern-native-canonical

      - name: Hash canonical native candidate
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha256=$(sha256sum "$RUNNER_TEMP/modern-native-canonical.tar.gz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload canonical Modern native candidate
        uses: actions/upload-artifact@v4
        with:
          name: modern-native-canonical-candidate
          path: ${{ runner.temp }}/modern-native-canonical.tar.gz
          if-no-files-found: error
          retention-days: 1

  shared:
    needs: [classify, build]
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.shared == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/modern-shared-native-acceptance.yml
    with:
      canonical_candidate: ${{ needs.build.result == 'success' }}

  onboarding:
    needs: [classify, build]
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.onboarding == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/modern-onboarding-practice-acceptance.yml
    with:
      canonical_candidate: ${{ needs.build.result == 'success' }}

  ui:
    needs: [classify, build]
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.ui == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/native-ui-evidence.yml
    with:
      canonical_candidate: ${{ needs.build.result == 'success' }}

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.include_windows == true
    uses: ./.github/workflows/windows-native-smoke.yml

  campaign-report:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [build, shared, onboarding, ui, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out reporting contract
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified Windows package if available
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ur-recomp-windows-x64-portable
          path: ${{ runner.temp }}/windows-portable
      - name: Write fail-closed candidate and suite manifest
        shell: bash
        env:
          CAMPAIGN_NATIVE: ${{ needs.build.result }}
          CAMPAIGN_SHARED: ${{ needs.shared.result }}
          CAMPAIGN_ONBOARDING: ${{ needs.onboarding.result }}
          CAMPAIGN_UI: ${{ needs.ui.result }}
          CAMPAIGN_WINDOWS: ${{ needs.windows.result }}
          CAMPAIGN_INCLUDE_WINDOWS: ${{ inputs.include_windows }}
          CAMPAIGN_NATIVE_SHA256: ${{ needs.build.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CAMPAIGN_WINDOWS" = success ]; then
            args+=(--windows-zip "$RUNNER_TEMP/windows-portable/UR-Recomp-Windows-x64.zip")
            args+=(--windows-checksum "$RUNNER_TEMP/windows-portable/UR-Recomp-Windows-x64.zip.sha256")
          fi
          python3 tools/qa_modern_batch_campaign.py \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --native "$CAMPAIGN_NATIVE" --shared "$CAMPAIGN_SHARED" \
            --onboarding "$CAMPAIGN_ONBOARDING" --ui "$CAMPAIGN_UI" \
            --windows "$CAMPAIGN_WINDOWS" \
            --include-windows "$CAMPAIGN_INCLUDE_WINDOWS" \
            --native-sha256 "$CAMPAIGN_NATIVE_SHA256" \
            --out "$RUNNER_TEMP/modern-campaign-result.json" \
            --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      - name: Publish the complete or incomplete campaign receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-campaign-report
          path: ${{ runner.temp }}/modern-campaign-result.json
          if-no-files-found: warn
          retention-days: 14

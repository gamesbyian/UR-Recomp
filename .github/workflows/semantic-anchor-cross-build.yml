name: Semantic anchor cross-build pass

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/compare_semantic_anchors.py"
      - ".github/workflows/semantic-anchor-cross-build.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run structural semantic-anchor matcher
        run: |
          python tools/compare_semantic_anchors.py
      - name: Run relocation regression
        run: |
          python tests/test_compare_semantic_anchors.py
      - name: Upload correspondence report
        uses: actions/upload-artifact@v4
        with:
          name: semantic-anchor-cross-build
          path: |
            analysis/generated/semantic-anchor-cross-build-matches.json
            analysis/generated/semantic-anchor-cross-build-matches.md
          if-no-files-found: error

name: One-shot Uniracers SPC archaeology

on:
  push:
    branches:
      - chatgpt/spc-audio-archaeology-2026-09-29
    paths:
      - .github/workflows/external-spc-analysis.yml

permissions:
  contents: write

jobs:
  acquire-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Acquire public Zophar SPC bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/spc/extracted
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://fi.zophar.net/soundfiles/nintendo-snes-spc/uniracers/Uniracers%20%28EMU%29.zophar.zip' \
            --output evidence/spc/uniracers-zophar.zip
          file evidence/spc/uniracers-zophar.zip
          sha256sum evidence/spc/uniracers-zophar.zip
          unzip -q evidence/spc/uniracers-zophar.zip -d evidence/spc/extracted

      - name: Inventory SPC state and common APU regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source_url = "https://fi.zophar.net/soundfiles/nintendo-snes-spc/uniracers/Uniracers%20%28EMU%29.zophar.zip"
          archive = Path("evidence/spc/uniracers-zophar.zip")
          root = Path("evidence/spc/extracted")
          rom = Path("reference/roms/retail/Uniracers_USA.sfc").read_bytes()

          spcs = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.suffix.lower() != ".spc":
                  continue
              data = path.read_bytes()
              if not data.startswith(b"SNES-SPC700 Sound File Data"):
                  raise SystemExit(f"not an SPC file: {path}")
              if len(data) < 0x10200:
                  raise SystemExit(f"truncated SPC file: {path} ({len(data)} bytes)")
              ram = data[0x100:0x10100]
              dsp = data[0x10100:0x10180]
              spcs.append({
                  "path": str(path.relative_to(root)),
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "apu_ram_sha256": hashlib.sha256(ram).hexdigest(),
                  "dsp_sha256": hashlib.sha256(dsp).hexdigest(),
                  "pc": int.from_bytes(data[0x25:0x27], "little"),
                  "a": data[0x27],
                  "x": data[0x28],
                  "y": data[0x29],
                  "psw": data[0x2A],
                  "sp": data[0x2B],
                  "_ram": ram,
              })

          if len(spcs) != 10:
              raise SystemExit(f"expected 10 SPC files, found {len(spcs)}")

          common = []
          start = None
          for i in range(0x10000):
              same = all(item["_ram"][i] == spcs[0]["_ram"][i] for item in spcs[1:])
              if same and start is None:
                  start = i
              if (not same or i == 0xFFFF) and start is not None:
                  end = i if not same else i + 1
                  if end - start >= 16:
                      blob = spcs[0]["_ram"][start:end]
                      rom_offsets = []
                      # Avoid treating long zero/fill ranges as meaningful ROM matches.
                      if len(set(blob)) > 2 and len(blob) >= 64:
                          pos = 0
                          while True:
                              found = rom.find(blob, pos)
                              if found < 0:
                                  break
                              rom_offsets.append(found)
                              pos = found + 1
                      common.append({
                          "start": start,
                          "start_hex": f"0x{start:04X}",
                          "end_exclusive": end,
                          "end_exclusive_hex": f"0x{end:04X}",
                          "length": end - start,
                          "sha256": hashlib.sha256(blob).hexdigest(),
                          "unique_byte_count": len(set(blob)),
                          "canonical_rom_offsets": rom_offsets,
                      })
                  start = None

          pairwise = []
          for i, left in enumerate(spcs):
              for right in spcs[i+1:]:
                  equal = sum(a == b for a, b in zip(left["_ram"], right["_ram"]))
                  pairwise.append({
                      "left": left["path"],
                      "right": right["path"],
                      "equal_bytes": equal,
                      "equal_fraction": round(equal / 0x10000, 6),
                  })

          stable_bytes = sum(
              all(item["_ram"][i] == spcs[0]["_ram"][i] for item in spcs[1:])
              for i in range(0x10000)
          )

          for item in spcs:
              del item["_ram"]

          report = {
              "schema_version": 1,
              "source_url": source_url,
              "archive_size": archive.stat().st_size,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "canonical_rom_sha256": hashlib.sha256(rom).hexdigest(),
              "spc_count": len(spcs),
              "stable_apu_ram_bytes_all_tracks": stable_bytes,
              "stable_apu_ram_fraction_all_tracks": round(stable_bytes / 0x10000, 6),
              "spcs": spcs,
              "common_apu_ranges_min_16": sorted(
                  common, key=lambda row: (-row["length"], row["start"])
              ),
              "pairwise_apu_ram_similarity": sorted(
                  pairwise, key=lambda row: (-row["equal_fraction"], row["left"], row["right"])
              ),
          }

          out = Path("evidence/spc/uniracers-spc-analysis.json")
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          print(json.dumps({
              "archive_size": report["archive_size"],
              "archive_sha256": report["archive_sha256"],
              "spc_count": report["spc_count"],
              "stable_apu_ram_bytes_all_tracks": stable_bytes,
              "stable_apu_ram_fraction_all_tracks": report["stable_apu_ram_fraction_all_tracks"],
              "common_ranges_min_16": len(common),
              "longest_common_ranges": report["common_apu_ranges_min_16"][:12],
              "spc_files": [
                  {"path": row["path"], "sha256": row["sha256"], "pc": row["pc"]}
                  for row in spcs
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Stage durable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p references/imported/audio/uniracers analysis/generated
          cp evidence/spc/uniracers-zophar.zip references/imported/audio/uniracers/Uniracers-EMU-zophar.zip
          cp evidence/spc/uniracers-spc-analysis.json analysis/generated/uniracers-spc-workflow-analysis.json

      - name: Commit acquired evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/imported/audio/uniracers/Uniracers-EMU-zophar.zip analysis/generated/uniracers-spc-workflow-analysis.json
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
            exit 0
          fi
          git commit -m "research: preserve Uniracers SPC corpus"
          git push origin HEAD:chatgpt/spc-audio-archaeology-2026-09-29

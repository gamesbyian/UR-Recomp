              SNESRECOMP_SCREENSHOT_TO=1235 \
              SDL_AUDIODRIVER=dummy \
              timeout 120s xvfb-run -a "$EXE" "$ROM" --script "$SCRIPT" >"$log" 2>&1
            local status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              cat "$log"
              echo "::error::Wide $mode route failed with status $status"

name: Repository hygiene

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/README.md"
      # The live queue carries enforced size/reuse contracts; queue-only edits
      # must validate them without launching the full tooling-unit suite.
      - "docs/WORK-QUEUE.md"
      - "docs/SYMBOLS.md"
      - "docs/PERIODIC-REPOSITORY-HYGIENE.md"
      - "docs/TOOL-INTEROPERABILITY.md"
      - "reference/**"
      - "analysis/generated/symbols.json"
      - "analysis/generated/*-symbols*"
      - "third_party/**"
      - "tools/**"
      - ".github/workflows/repo-hygiene.yml"
  workflow_dispatch:

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check active work-queue size and three-project reuse contracts
        run: python3 -m unittest -v tests.unit.test_document_authority tests.unit.test_three_project_reuse
      - name: Check repository boundaries and generated surfaces
        run: python3 tools/check_repo_hygiene.py
